<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOLKLI — ממיר מידות מסך</title>
<meta name="description" content="Free screen-units converter — convert between PX, REM, EM, VW, VH, PT and % instantly. Set your root font, element font and viewport size, type any value and copy the rest. Fast, private, right in your browser.">
<style>
  :root {
    --bg:#eef0f6; --panel:#ffffff; --panel-2:#f5f6fa; --line:#e5e8f0; --line-2:#eef0f6;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#7c3aed; --accent-dim:#6a2fe0; --accent-ink:#ffffff; --accent-soft:#efe9fe;
    --success:#22b04b; --success-dim:#1c9a41; --success-soft:#e6f6ec;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --danger:#e5484d; --danger-soft:#fdecec;
    --warm-soft:#fff5da; --warm-line:#f2d98a;
    --ok:#22b04b; --warn:#c88a04; --err:#e5484d;
    --grad:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn-glow:rgba(59,111,246,0.38);
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-lg:0 2px 6px rgba(20,24,44,0.05), 0 20px 50px rgba(20,24,44,0.10);
    --shadow-sm:0 1px 2px rgba(20,24,44,0.05);
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --sans:'Space Grotesk',system-ui,'Segoe UI','Heebo',sans-serif;
  }
  html[data-theme="dark"] {
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a303c; --line-2:#232833;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --accent:#a06bff; --accent-dim:#7c3aed; --accent-ink:#ffffff; --accent-soft:#241a3a;
    --success:#37c26a; --success-dim:#2fae5e; --success-soft:#132a1c;
    --info:#5b95f8; --info-dim:#4f8ef7; --info-soft:#182338;
    --danger:#ff6b6b; --danger-soft:#2a1719;
    --warm-soft:#2c2718; --warm-line:#5a4d24;
    --ok:#4ec98a; --warn:#e8b84b; --err:#ff6b6b;
    --grad:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn-glow:rgba(77,123,255,0.45);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,0.45), 0 24px 60px rgba(0,0,0,0.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;}
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:var(--grad);z-index:100;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--sans);}
  .wrap{max-width:1040px;margin:0 auto;padding:26px 20px 64px;}

  /* page intro */
  .pagehead{margin:4px 0 22px;}
  .pagehead h1{font-size:clamp(23px,3vw,32px);font-weight:700;letter-spacing:-0.02em;margin:0 0 8px;}
  .pagehead .kick{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);
    padding:4px 11px;border-radius:999px;margin-bottom:12px;}
  .pagehead p{font-size:14.5px;color:var(--muted);margin:0;max-width:70ch;}

  /* reused helpers (from box-shadow.html / color-convert.html) */
  .gbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--ink-2);font-size:13px;font-weight:600;padding:10px 12px;border-radius:11px;
    cursor:pointer;transition:all .12s;}
  .gbtn:hover{border-color:var(--accent);color:var(--accent-dim);background:var(--accent-soft);}
  .gbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .gbtn.hidden{display:none;}
  .copybtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);
    color:var(--muted);font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:9px;cursor:pointer;transition:all .12s;}
  .copybtn:hover{border-color:var(--accent);color:var(--accent-dim);background:var(--accent-soft);}
  .copybtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .fstr{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ink);background:var(--panel-2);
    border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;margin-bottom:12px;overflow-x:auto;white-space:nowrap;
    direction:ltr;text-align:start;}
  .numwrap{display:inline-flex;align-items:center;gap:5px;direction:ltr;}
  .numin{width:58px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:9px;
    font-family:var(--mono);font-size:13px;font-weight:600;text-align:center;padding:6px 4px;transition:border-color .12s,box-shadow .12s;}
  .numin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .numin::-webkit-outer-spin-button,.numin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .unit{font-family:var(--mono);font-size:12px;color:var(--faint);}

  /* ---- screen-units tool ---- */
  .tool{display:grid;grid-template-columns:1fr 350px;gap:18px;align-items:start;}
  @media (max-width:820px){ .tool{grid-template-columns:1fr;} }
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);}

  .convcard{padding:18px;}
  .setcard{padding:18px;position:sticky;top:16px;}
  .tblcard{padding:18px;margin-top:18px;}

  .cardtitle{font-size:13px;font-weight:800;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;margin-bottom:14px;}

  /* converter unit rows */
  .urow{display:flex;align-items:center;gap:11px;margin-bottom:11px;}
  .urow:last-child{margin-bottom:0;}
  .ulabel{width:46px;flex-shrink:0;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink-2);
    letter-spacing:.03em;direction:ltr;text-align:start;}
  .urow .numwrap{flex:1;min-width:0;}
  .urow .numin{flex:1;width:auto;min-width:0;text-align:start;padding-inline:11px;font-size:14px;}
  .urow .unit{min-width:26px;text-align:start;}
  .urow .copybtn{flex-shrink:0;}

  /* settings rows */
  .setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px;}
  .setrow > label{font-size:13px;font-weight:600;color:var(--ink-2);line-height:1.3;}
  .setrow .numin{width:74px;}

  .divider{height:1px;background:var(--line);margin:16px 0;border:0;}

  /* reference table */
  .tablewrap{overflow-x:auto;}
  .rtable{width:100%;border-collapse:collapse;direction:ltr;font-family:var(--mono);}
  .rtable th{text-align:start;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.05em;padding:8px 12px;border-bottom:1px solid var(--line);}
  .rtable td{font-size:13px;color:var(--ink-2);padding:9px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap;
    unicode-bidi:isolate;}
  .rtable tr:last-child td{border-bottom:0;}
  .rtable td.pxcol{font-weight:700;color:var(--ink);}

  .note{display:flex;align-items:flex-start;gap:9px;margin-top:18px;padding:12px 14px;border-radius:12px;
    background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);
    font-size:12px;color:var(--ink-2);line-height:1.55;}
  .note svg{width:16px;height:16px;color:var(--accent-dim);flex-shrink:0;margin-top:1px;
    stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  footer{margin-top:34px;text-align:center;color:var(--faint);font-size:12px;font-family:var(--mono);}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:11px 18px;border-radius:999px;
    box-shadow:var(--shadow-lg);transition:opacity .2s,transform .2s;z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
<link rel="stylesheet" href="./header.css">
</head>
<body>
<div id="site-header"></div>
<script src="./header.js"></script>
<div class="wrap">

  <div class="pagehead">
    <span class="kick" data-i18n="kick"></span>
    <h1 data-i18n="pageTitle"></h1>
    <p data-i18n="pageSub"></p>
  </div>

  <div class="tool">
    <!-- live converter -->
    <div class="card convcard">
      <div class="cardtitle" data-i18n="converterTitle"></div>

      <div class="urow">
        <span class="ulabel">PX</span>
        <span class="numwrap"><input type="number" id="pxIn" class="numin" value="16" step="any" aria-label="px"><span class="unit">px</span></span>
        <button class="copybtn" data-uk="px" type="button"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span data-i18n="copy"></span></button>
      </div>

      <div class="urow">
        <span class="ulabel">REM</span>
        <span class="numwrap"><input type="number" id="remIn" class="numin" step="any" aria-label="rem"><span class="unit">rem</span></span>
        <button class="copybtn" data-uk="rem" type="button"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span data-i18n="copy"></span></button>
      </div>

      <div class="urow">
        <span class="ulabel">EM</span>
        <span class="numwrap"><input type="number" id="emIn" class="numin" step="any" aria-label="em"><span class="unit">em</span></span>
        <button class="copybtn" data-uk="em" type="button"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span data-i18n="copy"></span></button>
      </div>

      <div class="urow">
        <span class="ulabel">VW</span>
        <span class="numwrap"><input type="number" id="vwIn" class="numin" step="any" aria-label="vw"><span class="unit">vw</span></span>
        <button class="copybtn" data-uk="vw" type="button"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span data-i18n="copy"></span></button>
      </div>

      <div class="urow">
        <span class="ulabel">VH</span>
        <span class="numwrap"><input type="number" id="vhIn" class="numin" step="any" aria-label="vh"><span class="unit">vh</span></span>
        <button class="copybtn" data-uk="vh" type="button"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span data-i18n="copy"></span></button>
      </div>

      <div class="urow">
        <span class="ulabel">PT</span>
        <span class="numwrap"><input type="number" id="ptIn" class="numin" step="any" aria-label="pt"><span class="unit">pt</span></span>
        <button class="copybtn" data-uk="pt" type="button"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span data-i18n="copy"></span></button>
      </div>

      <div class="urow">
        <span class="ulabel" data-i18n="pctLabel">%</span>
        <span class="numwrap"><input type="number" id="pctIn" class="numin" step="any" aria-label="percent"><span class="unit">%</span></span>
        <button class="copybtn" data-uk="pct" type="button"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span data-i18n="copy"></span></button>
      </div>
    </div>

    <!-- settings -->
    <div class="card setcard">
      <div class="cardtitle" data-i18n="settingsTitle"></div>

      <div class="setrow">
        <label for="rootIn" data-i18n="rootLabel"></label>
        <span class="numwrap"><input type="number" id="rootIn" class="numin" value="16" min="1" step="any"><span class="unit">px</span></span>
      </div>
      <div class="setrow">
        <label for="parentIn" data-i18n="parentLabel"></label>
        <span class="numwrap"><input type="number" id="parentIn" class="numin" value="16" min="1" step="any"><span class="unit">px</span></span>
      </div>
      <div class="setrow">
        <label for="vpwIn" data-i18n="vpwLabel"></label>
        <span class="numwrap"><input type="number" id="vpwIn" class="numin" value="1920" min="1" step="any"><span class="unit">px</span></span>
      </div>
      <div class="setrow">
        <label for="vphIn" data-i18n="vphLabel"></label>
        <span class="numwrap"><input type="number" id="vphIn" class="numin" value="1080" min="1" step="any"><span class="unit">px</span></span>
      </div>

      <hr class="divider">

      <button class="gbtn" id="useScreenBtn" type="button" style="width:100%;">
        <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
        <span data-i18n="useScreen"></span>
      </button>
    </div>
  </div>

  <!-- reference table -->
  <div class="card tblcard">
    <div class="cardtitle" data-i18n="tableTitle"></div>
    <div class="tablewrap">
      <table class="rtable">
        <thead><tr><th>px</th><th>rem</th><th>em</th><th>pt</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="note">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <span data-i18n="note"></span>
  </div>

  <footer data-i18n="foot"></footer>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const el = id => document.getElementById(id);

  const I18N = {
    he:{ dir:'rtl',
      kick:'ממיר מידות מסך',
      pageTitle:'ממיר יחידות מסך — PX, REM, EM, VW ו-VH',
      pageSub:'הקלידו ערך באחת היחידות וכל השאר יתעדכנו מיד — PX, REM, EM, VW, VH, PT ו-%. הגדירו גודל גופן בסיס, גופן אב וגודל חלון תצוגה, והעתיקו כל ערך בלחיצה. הכול רץ בדפדפן, שום דבר לא נשלח לשרת.',
      converterTitle:'המרה', settingsTitle:'הגדרות',
      rootLabel:'גודל גופן בסיס (root)', parentLabel:'גודל גופן אב (element)',
      vpwLabel:'רוחב חלון התצוגה', vphLabel:'גובה חלון התצוגה',
      useScreen:'לפי המסך שלי', tableTitle:'טבלת ייחוס נפוצה',
      pctLabel:'%', copy:'העתקה', copiedMsg:'הועתק ✓',
      note:'REM מחושב לפי גודל גופן הבסיס; EM ו-% לפי גופן האב (האלמנט); ו-VW/VH לפי מידות חלון התצוגה. שנו את ההגדרות למעלה כדי לקבל תוצאות מדויקות למקרה שלכם. PT מחושב לפי 96dpi (1px = 0.75pt).',
      foot:'KOLKLI · ממיר מידות מסך · פרטי ומהיר, ישירות בדפדפן' },
    en:{ dir:'ltr',
      kick:'Screen Units Converter',
      pageTitle:'Screen Units Converter — PX, REM, EM, VW & VH',
      pageSub:'Type a value in any unit and all the others update instantly — PX, REM, EM, VW, VH, PT and %. Set your root font, element font and viewport size, then copy any value with one click. Everything runs in your browser; nothing is sent to a server.',
      converterTitle:'Convert', settingsTitle:'Settings',
      rootLabel:'Root font size', parentLabel:'Parent font size',
      vpwLabel:'Viewport width', vphLabel:'Viewport height',
      useScreen:'Use my screen', tableTitle:'Common reference table',
      pctLabel:'%', copy:'Copy', copiedMsg:'Copied ✓',
      note:'REM is based on the root font size; EM and % are based on the parent (element) font size; VW/VH are based on the viewport size. Adjust the settings above to match your case. PT assumes 96dpi (1px = 0.75pt).',
      foot:'KOLKLI · Screen Units Converter · Private and fast, right in your browser' },
    ru:{ dir:'ltr',
      kick:'Конвертер экранных единиц',
      pageTitle:'Конвертер единиц — PX, REM, EM, VW и VH',
      pageSub:'Введите значение в любой единице, и все остальные обновятся мгновенно — PX, REM, EM, VW, VH, PT и %. Задайте базовый шрифт, шрифт элемента и размер окна, затем скопируйте любое значение одним щелчком. Всё работает в браузере; ничего не отправляется на сервер.',
      converterTitle:'Конвертация', settingsTitle:'Настройки',
      rootLabel:'Базовый размер шрифта', parentLabel:'Размер шрифта элемента',
      vpwLabel:'Ширина окна', vphLabel:'Высота окна',
      useScreen:'По моему экрану', tableTitle:'Таблица соответствий',
      pctLabel:'%', copy:'Копировать', copiedMsg:'Скопировано ✓',
      note:'REM рассчитывается по базовому размеру шрифта; EM и % — по шрифту родителя (элемента); VW/VH — по размеру окна. Измените настройки выше, чтобы получить точные значения. PT рассчитывается при 96dpi (1px = 0.75pt).',
      foot:'KOLKLI · Конвертер экранных единиц · Приватно и быстро, прямо в браузере' }
  };

  const UNITS = [
    { key:'px',  unit:'px',  toPx:(v,s)=>v,                  fromPx:(px,s)=>px },
    { key:'rem', unit:'rem', toPx:(v,s)=>v*s.rootFont,       fromPx:(px,s)=>px/s.rootFont },
    { key:'em',  unit:'em',  toPx:(v,s)=>v*s.parentFont,     fromPx:(px,s)=>px/s.parentFont },
    { key:'vw',  unit:'vw',  toPx:(v,s)=>v/100*s.vw,         fromPx:(px,s)=>px/s.vw*100 },
    { key:'vh',  unit:'vh',  toPx:(v,s)=>v/100*s.vh,         fromPx:(px,s)=>px/s.vh*100 },
    { key:'pt',  unit:'pt',  toPx:(v,s)=>v*96/72,            fromPx:(px,s)=>px*72/96 },
    { key:'pct', unit:'%',   toPx:(v,s)=>v/100*s.parentFont, fromPx:(px,s)=>px/s.parentFont*100 }
  ];
  const TABLE_PX = [8,12,14,16,20,24,32,48,64];

  let lang='he', t=I18N.he;
  const S = { rootFont:16, parentFont:16, vw:1920, vh:1080 };
  const state = { px:16 };

  // ---- helpers ----
  function fmt(n){
    if(!isFinite(n)) return '0';
    if(Math.abs(n)<1e-9) return '0';
    let s=n.toFixed(4).replace(/\.?0+$/,'');
    return (s===''||s==='-0')?'0':s;
  }
  function pos(v,def){ v=parseFloat(v); return (isFinite(v)&&v>0)?v:def; }
  function setVal(id,v,except){ if(id===except) return; const e=el(id); if(e && String(e.value)!==String(v)) e.value=v; }

  function readSettings(){
    S.rootFont=pos(el('rootIn').value,16);
    S.parentFont=pos(el('parentIn').value,16);
    S.vw=pos(el('vpwIn').value,1920);
    S.vh=pos(el('vphIn').value,1080);
  }

  function buildTable(){
    el('tbody').innerHTML = TABLE_PX.map(function(px){
      return '<tr><td class="pxcol">'+px+'px</td>'+
        '<td>'+fmt(px/S.rootFont)+'rem</td>'+
        '<td>'+fmt(px/S.parentFont)+'em</td>'+
        '<td>'+fmt(px*72/96)+'pt</td></tr>';
    }).join('');
  }

  // ---- render ----
  function render(except){
    const px=state.px;
    UNITS.forEach(function(u){ setVal(u.key+'In', fmt(u.fromPx(px,S)), except); });
    buildTable();
  }
  function blankOthers(exceptKey){
    UNITS.forEach(function(u){ if(u.key!==exceptKey){ const e=el(u.key+'In'); if(e) e.value=''; } });
  }

  // ---- toast + copy ----
  function toast(msg){ const e=el('toast'); e.textContent=msg; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),1700); }
  function copy(text){
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).catch(fallbackCopy.bind(null,text)); }
    else fallbackCopy(text);
    toast(t.copiedMsg);
  }
  function fallbackCopy(text){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(_){} document.body.removeChild(ta);
  }

  // ---- events ----
  UNITS.forEach(function(u){
    const input=el(u.key+'In');
    input.addEventListener('input',function(){
      const raw=input.value.trim();
      if(raw===''||raw==='-'||raw==='.'||raw==='-.'||raw==='+'){ blankOthers(u.key); return; }
      const v=parseFloat(raw);
      if(!isFinite(v)) return;
      state.px=u.toPx(v,S);
      render(u.key+'In');
    });
    input.addEventListener('blur',()=>render());
  });

  const SETMAP={rootIn:'rootFont',parentIn:'parentFont',vpwIn:'vw',vphIn:'vh'};
  ['rootIn','parentIn','vpwIn','vphIn'].forEach(function(id){
    el(id).addEventListener('input',()=>{ readSettings(); render(); });
    el(id).addEventListener('blur',function(){
      readSettings();
      if(!(parseFloat(el(id).value)>0)) el(id).value=S[SETMAP[id]];
      render();
    });
  });

  el('useScreenBtn').addEventListener('click',function(){
    el('vpwIn').value=window.innerWidth||1920;
    el('vphIn').value=window.innerHeight||1080;
    readSettings(); render();
  });

  document.querySelectorAll('.copybtn').forEach(function(b){
    b.addEventListener('click',function(){
      if(b.dataset.uk){
        const u=UNITS.find(x=>x.key===b.dataset.uk);
        const input=el(b.dataset.uk+'In');
        const val=(input && input.value!=='')?input.value:'0';
        copy(val+u.unit);
      } else if(b.dataset.copy){
        const target=el(b.dataset.copy); if(target) copy(target.textContent);
      }
    });
  });

  // ---- i18n + theme ----
  function applyLang(l){
    if(!I18N[l]) l='en';
    lang=l; t=I18N[l];
    document.documentElement.lang=l; document.documentElement.dir=t.dir;
    document.querySelectorAll('[data-i18n]').forEach(n=>{ const k=n.getAttribute('data-i18n'); if(typeof t[k]==='string') n.textContent=t[k]; });
    try{ localStorage.setItem('ac_lang', l); }catch(_){}
  }
  function ls(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
  function detectLang(){
    const chosen=ls('ac_lang'); if(chosen) return chosen;
    const cc=ls('ac_country'); if(cc) return cc==='IL'?'he':'en';
    let tz=''; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(_){}
    const navHe=(navigator.language||'').toLowerCase().indexOf('he')===0;
    return (tz==='Asia/Jerusalem'||navHe)?'he':'en';
  }
  function applyTheme(th){
    const dark=(th==='dark');
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
    const ti=el('themeIco'); if(ti) ti.textContent = dark?'☀️':'🌙';
    try{ localStorage.setItem('theme', dark?'dark':'light'); }catch(_){}
  }
  window.__setLang=applyLang;
  const tb=el('themeToggle'); if(tb) tb.addEventListener('click',()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));

  // ---- init ----
  readSettings();
  applyTheme(ls('theme')||'light');
  applyLang(detectLang());
  render();
})();
</script>
</body>
</html>
