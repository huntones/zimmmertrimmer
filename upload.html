<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOLKLI — Upload files</title>
<meta name="description" content="Upload your files securely — no account needed.">
<style>
  :root {
    --bg:#eef0f6; --panel:#ffffff; --panel-2:#f5f6fa; --line:#e5e8f0; --line-2:#eef0f6;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#7c3aed; --accent-dim:#6a2fe0; --accent-ink:#ffffff; --accent-soft:#efe9fe;
    --success:#22b04b; --success-dim:#1c9a41; --success-soft:#e6f6ec;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --danger:#e5484d; --danger-soft:#fdecec;
    --warm-soft:#fff5da; --warm-line:#f2d98a;
    --ok:#22b04b; --warn:#c88a04; --err:#e5484d;
    --grad:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-soft:linear-gradient(120deg,#efe9fe,#e6f0ff);
    --grad-shadow:rgba(93,79,240,0.30);
    --grad-btn:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn-glow:rgba(59,111,246,0.38);
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-lg:0 2px 6px rgba(20,24,44,0.05), 0 20px 50px rgba(20,24,44,0.10);
    --shadow-sm:0 1px 2px rgba(20,24,44,0.05);
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --sans:'Space Grotesk',system-ui,'Segoe UI','Heebo',sans-serif;
  }
  html[data-theme="dark"] {
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a303c; --line-2:#232833;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --accent:#a06bff; --accent-dim:#7c3aed; --accent-ink:#ffffff; --accent-soft:#241a3a;
    --success:#37c26a; --success-dim:#2fae5e; --success-soft:#132a1c;
    --info:#5b95f8; --info-dim:#4f8ef7; --info-soft:#182338;
    --danger:#ff6b6b; --danger-soft:#2a1719;
    --warm-soft:#2c2718; --warm-line:#5a4d24;
    --ok:#4ec98a; --warn:#e8b84b; --err:#ff6b6b;
    --grad:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-soft:linear-gradient(120deg,#1c1633,#11242a);
    --grad-shadow:rgba(77,123,255,0.42);
    --grad-btn:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn-glow:rgba(77,123,255,0.45);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,0.45), 0 24px 60px rgba(0,0,0,0.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;}
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:var(--grad);z-index:100;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--sans);}
  .wrap{width:100%;max-width:1220px;margin:0 auto;padding:10px 22px 46px;}

  /* ---------- minimal client top bar: language picker + brand ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px 18px;}
  .topbar .brand{display:flex;align-items:center;gap:9px;}
  .topbar .brand img{height:30px;width:auto;display:block;}
  .lang{position:relative;}
  .langbtn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:999px;
    background:var(--panel);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;font-size:13.5px;font-weight:600;
    box-shadow:var(--shadow-sm);transition:border-color .12s,transform .08s;}
  .langbtn:hover{border-color:var(--accent);} .langbtn:active{transform:scale(.97);}
  .langbtn .globe{width:17px;height:17px;color:var(--accent);}
  .langbtn .chev{width:14px;height:14px;color:var(--faint);transition:transform .18s;}
  .lang.open .langbtn .chev{transform:rotate(180deg);}
  .langmenu{position:absolute;top:calc(100% + 6px);inset-inline-start:0;min-width:150px;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:5px;z-index:60;
    opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .15s,transform .15s,visibility .15s;}
  .lang.open .langmenu{opacity:1;visibility:visible;transform:none;}
  .langmenu button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:none;background:transparent;
    color:var(--ink-2);cursor:pointer;font-size:13.5px;font-weight:600;text-align:start;padding:9px 11px;border-radius:8px;transition:background .12s,color .12s;}
  .langmenu button:hover{background:var(--panel-2);color:var(--accent-dim);}
  .langmenu button.on{color:var(--accent-dim);}
  .langmenu button .tick{width:15px;height:15px;opacity:0;color:var(--accent);}
  .langmenu button.on .tick{opacity:1;}

  /* ---------- the one big card that hosts every state ---------- */
  .card{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:22px;
    box-shadow:var(--shadow-lg);padding:38px 40px 30px;}
  @media (max-width:640px){ .card{padding:26px 18px 22px;border-radius:18px;} .wrap{padding:8px 13px 34px;} }

  /* decorative folder+cloud illustration, tucked into the top-left corner of the upload view */
  #uploadView{position:relative;}
  .illus{position:absolute;top:-14px;left:-10px;width:150px;height:auto;pointer-events:none;z-index:0;}
  @media (max-width:1080px){ .illus{display:none;} }

  /* hero */
  .hero{position:relative;z-index:1;text-align:center;margin-bottom:22px;}
  .hero .ic{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);color:var(--accent);box-shadow:0 6px 16px var(--grad-shadow);}
  .hero .ic svg{width:28px;height:28px;}
  .hero h1{font-size:clamp(22px,3vw,28px);font-weight:800;letter-spacing:-0.02em;margin:0 0 7px;word-break:break-word;}
  .hero .sub{font-size:15px;color:var(--muted);white-space:pre-wrap;word-break:break-word;max-width:56ch;margin:0 auto;}

  /* three feature cards */
  .features{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:0 auto 26px;position:relative;z-index:1;}
  .fcard{flex:1 1 200px;max-width:280px;min-width:0;text-align:center;padding:13px 16px;border-radius:14px;
    background:var(--panel-2);border:1px solid var(--line);}
  .fc-top{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink-2);}
  .fc-top .fc-ic{display:flex;color:var(--accent);}
  .fc-top .fc-ic svg{width:16px;height:16px;}
  .fc-t{font-size:13.5px;font-weight:700;}
  .fc-s{font-size:12px;color:var(--muted);margin-top:3px;}
  @media (max-width:560px){ .features{flex-direction:column;} .fcard{max-width:none;} }

  /* client fields */
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;position:relative;z-index:1;}
  @media (max-width:560px){ .fields{grid-template-columns:1fr;} }
  .field{display:flex;flex-direction:column;gap:7px;min-width:0;}
  .field.full{grid-column:1 / -1;}
  .field label{font-size:13px;font-weight:600;color:var(--ink-2);}
  .field label .req{color:var(--danger);}
  .inpwrap{position:relative;}
  .inpwrap .ic{position:absolute;top:50%;inset-inline-start:13px;transform:translateY(-50%);color:var(--faint);
    display:flex;pointer-events:none;}
  .inpwrap .ic svg{width:17px;height:17px;}
  .inpwrap .inp{padding-inline-start:39px;}
  .inp,.ta{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:11px;
    font-family:var(--sans);font-size:14px;padding:11px 13px;transition:border-color .12s,box-shadow .12s;}
  .inp:focus,.ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .ta{resize:vertical;min-height:78px;}

  /* big centered dropzone */
  .drop{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;
    border:2px dashed color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:16px;
    padding:30px 22px;cursor:pointer;background:color-mix(in srgb,var(--accent-soft) 45%,var(--panel));
    transition:border-color .15s,background .15s;margin-bottom:16px;}
  .drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);}
  .drop .cloud{color:var(--accent);margin-bottom:6px;}
  .drop .cloud svg{width:34px;height:34px;}
  .drop .big{font-size:16px;font-weight:700;color:var(--ink);}
  .drop .dhint{font-size:12.5px;color:var(--muted);}
  .drop .dbtns{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px;}
  .drop .choose{display:inline-flex;align-items:center;gap:7px;color:#fff;border:none;white-space:nowrap;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:600;font-size:13.5px;padding:10px 18px;border-radius:999px;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.14),0 6px 16px var(--grad-btn-glow);transition:filter .14s,transform .08s;}
  .drop .choose:hover{filter:brightness(1.05);} .drop .choose:active{transform:translateY(1px);}
  .drop .choose svg{width:15px;height:15px;}
  .drop .choose.ghost{color:var(--accent-dim);background:var(--panel);border:1px solid var(--accent);text-shadow:none;box-shadow:var(--shadow-sm);}
  html[data-theme="dark"] .drop .choose.ghost{color:var(--accent);}
  .drop .choose.ghost:hover{background:var(--accent-soft);filter:none;}
  @media (max-width:480px){ .drop .dbtns{flex-direction:column;width:100%;} .drop .choose{width:100%;justify-content:center;} }
  input[type=file]{display:none;}

  /* file list (appears once files are added) */
  .flist{position:relative;z-index:1;display:flex;flex-direction:column;gap:9px;margin-bottom:16px;
    max-height:calc(100vh - 300px);overflow-y:auto;overscroll-behavior:contain;}
  .flist:empty{display:none;}
  .flist::-webkit-scrollbar{width:10px;}
  .flist::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:999px;border:3px solid var(--panel);}
  .flist::-webkit-scrollbar-thumb:hover{background:var(--muted);}
  .frow{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line-2);border-radius:12px;background:var(--panel);}
  .frow .fico{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);color:var(--accent);}
  .frow .fico.image{color:var(--info);background:var(--info-soft);} .frow .fico.video{color:#e5484d;background:var(--danger-soft);}
  .frow .fico.doc{color:var(--info-dim);background:var(--info-soft);}
  .frow .fico svg{width:17px;height:17px;}
  .frow .fn{flex:1;min-width:0;}
  .frow .fn .nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .frow .fn .sz{font-family:var(--mono);font-size:11px;color:var(--faint);}
  .frow .fbar{height:5px;border-radius:999px;background:var(--panel-2);overflow:hidden;margin-top:5px;display:none;}
  .frow.up .fbar{display:block;}
  .frow .fbar i{display:block;height:100%;width:0;background:var(--grad);border-radius:999px;transition:width .2s ease;}
  .frow.done .fn .sz{color:var(--success-dim);}
  .frow .rm{width:30px;height:30px;flex-shrink:0;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;}
  .frow .rm:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft);}
  .frow .rm svg{width:15px;height:15px;}
  .frow .tick{width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--success-dim);}
  .frow .tick svg{width:18px;height:18px;}

  /* submit */
  .sendbtn{position:relative;z-index:1;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:9px;color:#fff;border:none;cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:600;font-size:15.5px;padding:15px 20px;border-radius:14px;text-shadow:0 1px 2px rgba(0,0,0,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.14),0 10px 24px var(--grad-btn-glow);
    transition:filter .14s,transform .08s;}
  .sendbtn:hover{filter:brightness(1.05);} .sendbtn:active{transform:translateY(1px);}
  .sendbtn:disabled{opacity:.6;cursor:not-allowed;filter:none;transform:none;}
  .sendbtn svg{width:18px;height:18px;}
  .uperr{position:relative;z-index:1;font-size:12.5px;color:var(--danger);margin-top:10px;min-height:15px;text-align:center;}

  /* yellow privacy banner */
  .banner{position:relative;z-index:1;display:flex;align-items:center;gap:10px;justify-content:center;text-align:center;
    margin-top:16px;padding:12px 16px;border-radius:12px;background:var(--warm-soft);border:1px solid var(--warm-line);
    font-size:12.5px;color:var(--ink-2);line-height:1.55;}
  .banner svg{width:16px;height:16px;color:var(--warn);flex-shrink:0;}

  /* loading / notice / password / success states */
  .state{text-align:center;padding:22px 10px;}
  .state .si{width:64px;height:64px;margin:0 auto 16px;border-radius:18px;display:flex;align-items:center;justify-content:center;}
  .state .si.warn{background:var(--warm-soft);color:var(--warn);} .state .si.lock{background:var(--accent-soft);color:var(--accent);}
  .state .si.ok{background:var(--success-soft);color:var(--success-dim);}
  .state .si svg{width:32px;height:32px;}
  .state h2{font-size:20px;margin:0 0 8px;}
  .state p{font-size:14px;color:var(--muted);margin:0 auto 18px;max-width:46ch;line-height:1.6;white-space:pre-wrap;}
  .pwform{display:flex;gap:8px;max-width:340px;margin:0 auto;}
  .pwform input{flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;
    font-family:var(--sans);font-size:14px;padding:11px 13px;}
  .pwform input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .pwform.bad input{border-color:var(--danger);}
  .pwform button{border:none;color:#fff;cursor:pointer;border-radius:10px;padding:0 18px;font-weight:600;font-size:14px;
    background:var(--grad-btn);box-shadow:0 4px 12px var(--grad-btn-glow);}
  .pwerr{font-size:12px;color:var(--danger);margin-top:10px;min-height:14px;}
  .again{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;
    border:1px solid var(--line);background:var(--panel);color:var(--ink-2);box-shadow:var(--shadow-sm);}
  .again:hover{border-color:var(--accent);} .again svg{width:15px;height:15px;}
  .hidden{display:none !important;}

  /* footer with policy links */
  footer{margin-top:22px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px 16px;
    color:var(--faint);font-size:12.5px;}
  footer .fbrand{font-family:var(--mono);font-weight:600;}
  footer .sep{color:var(--line);}
  footer a{color:var(--muted);transition:color .12s;}
  footer a:hover{color:var(--accent-dim);}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:11px 18px;border-radius:999px;
    box-shadow:var(--shadow-lg);transition:opacity .2s,transform .2s;z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">

  <!-- minimal top bar: language picker (start) + KOLKLI brand (end) -->
  <header class="topbar">
    <a class="brand" href="./" aria-label="KOLKLI"><img src="./assets/logo.png" alt="KOLKLI" width="139" height="34" decoding="async"></a>
    <div class="lang" id="langWrap">
      <button class="langbtn" id="langBtn" type="button" aria-haspopup="true" aria-expanded="false">
        <svg class="globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 0 20"/><path d="M12 2a15.3 15.3 0 0 0 0 20"/></svg>
        <span id="langName">עברית</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="langmenu" id="langMenu" role="menu">
        <button type="button" role="menuitem" data-lang="he">עברית<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>
        <button type="button" role="menuitem" data-lang="en">English<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>
        <button type="button" role="menuitem" data-lang="ru">Русский<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>
      </div>
    </div>
  </header>

  <div class="card">
    <!-- loading -->
    <div class="state" id="loadingState">
      <div class="si lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.2-8.5"/></svg></div>
      <p data-i18n="loading"></p>
    </div>

    <!-- notice: expired / closed / not found -->
    <div class="state hidden" id="noticeState">
      <div class="si warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg></div>
      <h2 id="noticeTitle"></h2>
      <p id="noticeBody"></p>
    </div>

    <!-- password gate -->
    <div class="state hidden" id="pwState">
      <div class="si lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
      <h2 data-i18n="pwTitle"></h2>
      <p data-i18n="pwSub"></p>
      <form class="pwform" id="pwForm">
        <input id="pwInput" type="password" dir="ltr" data-i18n-ph="pwPh" autocomplete="off">
        <button type="submit" data-i18n="unlock"></button>
      </form>
      <div class="pwerr" id="pwErr"></div>
    </div>

    <!-- upload -->
    <div class="hidden" id="uploadView">

      <!-- decorative folder + cloud illustration -->
      <svg class="illus" viewBox="0 0 200 172" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="ilF" x1="20" y1="70" x2="150" y2="160" gradientUnits="userSpaceOnUse">
            <stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/>
          </linearGradient>
          <linearGradient id="ilB" x1="20" y1="52" x2="150" y2="120" gradientUnits="userSpaceOnUse">
            <stop stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/>
          </linearGradient>
        </defs>
        <rect x="20" y="52" width="132" height="96" rx="15" fill="url(#ilB)"/>
        <path d="M20 78c0-8 6-14 14-14h30l12 12h62c8 0 14 6 14 14v44c0 8-6 14-14 14H34c-8 0-14-6-14-14V78Z" fill="url(#ilF)"/>
        <g opacity=".95">
          <path d="M86 98a20 20 0 0 1 38 4h3a13 13 0 0 1 0 26H84a17 17 0 0 1-2-34l4 4Z" fill="#ffffff"/>
          <path d="M104 96v30" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/>
          <path d="m94 106 10-10 10 10" stroke="#7c3aed" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <circle cx="164" cy="40" r="4" fill="#c4b5fd"/><circle cx="176" cy="58" r="3" fill="#ddd6fe"/><circle cx="150" cy="30" r="2.5" fill="#a78bfa"/>
      </svg>

      <div class="hero">

      featCountT:n=>`Up to ${n} files`, featCountS:'per request', featCountAnyT:'Multiple files', featCountAnyS:'No count limit',
      featTypesAllT:'All types supported', featTypesAllS:'Images, video, audio, documents & more', featTypesSomeT:'Supported types',
      dropBig:'Drag files here or click to upload', dropSub:'You can select several files at once', choose:'Add files', chooseFolder:'Add folder',

      successTitle:'Files uploaded!', successDefault:'Thank you! Your files reached the request owner.', uploadMore:'Upload more files',
      day:'1 day', days:d=>`${d} days`, today:'today',
      errType:n=>`"${n}" — file type not allowed for this request`, errSize:(n,s)=>`"${n}" is too large (max ${s})`,

    ru:{ dir:'ltr',
      loading:'Загрузка запроса…',
      ntExpiredT:'Срок ссылки истёк', ntExpiredB:'Ссылка для загрузки больше не активна. Попросите у владельца запроса новую ссылку.',
      ntClosedT:'Запрос закрыт', ntClosedB:'Владелец прекратил приём файлов. Попросите новую ссылку, если нужно загрузить файлы.',
      ntMissingT:'Ссылка не найдена', ntMissingB:'Ссылка неверна или не существует на этом устройстве. Убедитесь, что скопировали ссылку полностью.',
      pwTitle:'Запрос защищён паролем', pwSub:'Введите полученный пароль, чтобы загрузить файлы.',
      pwPh:'Пароль', unlock:'Войти', pwWrong:'Неверный пароль',
      heroSub:'Запрашивайте файлы легко — всё в одном месте',
      cName:'Полное имя', cNamePh:'Ваше имя', cPhone:'Номер телефона', cPhonePh:'+7 900 123-45-67',
      cEmail:'Эл. почта', cEmailPh:'you@mail.com', cNote:'Сообщение (необязательно)', cNotePh:'Заметка для владельца запроса…',
      featSizeT:'Макс. размер', featSize:s=>`До ${s}/файл`, featSizeAny:'Без ограничения размера',
      featCountT:n=>`До ${n} файлов`, featCountS:'на запрос', featCountAnyT:'Несколько файлов', featCountAnyS:'Без ограничения количества',
      featTypesAllT:'Любые типы файлов', featTypesAllS:'Изображения, видео, аудио, документы и др.', featTypesSomeT:'Разрешённые типы',
      dropBig:'Перетащите файлы сюда или нажмите для загрузки', dropSub:'Можно выбрать несколько файлов сразу', choose:'Добавить файлы', chooseFolder:'Добавить папку',
      sendBtn:'Отправить запрос', uploading:'Загрузка…',
      tImage:'Изображения', tVideo:'Видео', tAudio:'Аудио', tDoc:'Документы',
      sizeNoteAll:'Любые типы файлов', sizeNoteTypes:s=>`Разрешённые типы: ${s}`,
      privacy:'Ваши файлы остаются доступными владельцу запроса. Мы не видим, что вы отправляете.',
      footPrivacy:'Политика конфиденциальности', footTerms:'Условия использования',
      successTitle:'Файлы загружены!', successDefault:'Спасибо! Ваши файлы получены владельцем запроса.', uploadMore:'Загрузить ещё файлы',
      day:'1 день', days:d=>`${d} дн.`, today:'сегодня',
      errType:n=>`«${n}» — тип файла не разрешён для этого запроса`, errSize:(n,s)=>`«${n}» слишком большой (макс. ${s})`,
      errCount:n=>`Можно загрузить до ${n} файлов`, errTotal:s=>`Превышен допустимый общий размер (${s})`,
      errNone:'Выберите хотя бы один файл', errName:'Введите полное имя', errEmail:'Введите корректный адрес эл. почты', remove:'Удалить',
      uploadFail:'Ошибка загрузки, попробуйте снова', added:n=>`Добавлено файлов: ${n}`,
    },
  };
  const LNAME = { he:'עברית', en:'English', ru:'Русский' };

  let lang='he', t=I18N.he;
  let req=null, token=null, unlocked=false, demo=false;
  let files=[];            // {id,file,name,ext,kind,size,done}
  let uid=1, uploading=false;

  function toast(msg){ const b=el('toast'); b.textContent=msg; b.classList.add('show'); clearTimeout(b._t); b._t=setTimeout(()=>b.classList.remove('show'),1900); }
  function ls(k){ return KR.ls(k); }
  function daysWord(n){ n=+n; return n===1? t.day : t.days(n); }

  function show(id){ ['loadingState','noticeState','pwState','uploadView','successState'].forEach(s=>el(s).classList.toggle('hidden', s!==id)); }
  function notice(tk,bk){ el('noticeTitle').textContent=t[tk]; el('noticeBody').textContent=t[bk]; show('noticeState'); }

  function allowedTypes(){ return (req && req.types && req.types.length)? req.types : null; }
  function typeLbl(k){ return t['t'+k.charAt(0).toUpperCase()+k.slice(1)]; }
  function acceptAttr(){
    const at=allowedTypes(); if(!at) return '';
    let exts=[]; at.forEach(k=>{ exts=exts.concat((KR.TYPES[k]||[]).map(e=>'.'+e)); }); return exts.join(',');
  }

  // ---------- feature cards + dropzone note ----------
  function fcard(icon,title,sub){
    return `<div class="fcard"><div class="fc-top"><span class="fc-ic">${icon}</span><span class="fc-t">${KR.escapeHtml(title)}</span></div><div class="fc-s">${KR.escapeHtml(sub)}</div></div>`;
  }
  function renderFeatures(){
    const at=allowedTypes();
    const cards=[];
    cards.push(fcard(clockSvg(), t.featSizeT, req.maxFileMB? t.featSize(mb(req.maxFileMB)) : t.featSizeAny));
    cards.push(fcard(gridSvg(), req.maxCount? t.featCountT(req.maxCount) : t.featCountAnyT, req.maxCount? t.featCountS : t.featCountAnyS));
    cards.push(fcard(heartSvg(), at? t.featTypesSomeT : t.featTypesAllT, at? at.map(typeLbl).join(' · ') : t.featTypesAllS));
    el('featRow').innerHTML=cards.join('');
  }
  function mb(n){ return n>=1000? (n/1000)+' GB' : n+' MB'; }

  // ---------- file intake with validation ----------
  // accepts a FileList/File[] or an array of {file,path}; keeps each file's relative path so
  // dropped folders keep their structure (stored on the submission the owner receives)
  function pathItems(list){ return Array.from(list||[]).map(f=>({file:f, path:f.webkitRelativePath||f.name})); }
  function addFiles(items){
    const at=allowedTypes();
    let msg='';
    (items||[]).forEach(it=>{
      const file = it.file || it;
      const path = (it.path || file.webkitRelativePath || file.name);
      const ext=KR.extOf(file.name), kind=KR.kindOf(ext);
      if(at && at.indexOf(kind)<0){ msg=t.errType(file.name); return; }
      if(req.maxFileMB && file.size> req.maxFileMB*1048576){ msg=t.errSize(file.name, mb(req.maxFileMB)); return; }
      if(req.maxCount && files.length>=req.maxCount){ msg=t.errCount(req.maxCount); return; }
      const projected=files.reduce((a,f)=>a+f.size,0)+file.size;
      if(req.maxTotalMB && projected> req.maxTotalMB*1048576){ msg=t.errTotal(mb(req.maxTotalMB)); return; }
      files.push({ id:'kf'+KR.randToken()+(uid++), file, name:file.name, path, ext, kind, size:file.size, done:false });
    });
    el('upErr').textContent=msg;
    renderFiles();
  }

  // walk dropped directories via the entries API so whole folders keep their tree
  async function addFromDataTransfer(dt){
    let items;
    try{ items = await filesFromDataTransfer(dt); }
    catch(_){ items = pathItems(dt.files); }
    addFiles(items);
  }
  function filesFromDataTransfer(dt){
    const list = dt.items ? Array.from(dt.items) : [];
    const entries = list.map(it=> it.webkitGetAsEntry ? it.webkitGetAsEntry() : null).filter(Boolean);
    if(!entries.length){ return Promise.resolve(pathItems(dt.files)); }
    const out=[];
    return Promise.all(entries.map(en=>walkEntry(en,'',out))).then(()=>out);
  }
  function walkEntry(entry, prefix, out){
    return new Promise(resolve=>{
      if(!entry){ resolve(); return; }
      if(entry.isFile){ entry.file(f=>{ out.push({file:f, path:prefix+entry.name}); resolve(); }, ()=>resolve()); }
      else if(entry.isDirectory){
        const reader=entry.createReader(), kids=[];
        const readBatch=()=>reader.readEntries(batch=>{
          if(!batch.length){ Promise.all(kids.map(k=>walkEntry(k, prefix+entry.name+'/', out))).then(resolve); }
          else { kids.push(...batch); readBatch(); }
        }, ()=>resolve());
        readBatch();
      } else resolve();
    });
  }
  function removeFile(id){ files=files.filter(f=>f.id!==id); renderFiles(); }
  function renderFiles(){
    el('flist').innerHTML = files.map(f=>`
      <div class="frow${f.done?' done':''}" data-id="${f.id}">
        <span class="fico ${f.kind}">${KR.FICON[f.kind]}</span>
        <span class="fn"><div class="nm" title="${KR.escapeHtml(f.path||f.name)}">${KR.escapeHtml(f.path||f.name)}</div><div class="sz">${KR.fmtBytes(f.size)}</div>
          <div class="fbar"><i style="width:${f.done?100:0}%"></i></div></span>
        ${f.done? `<span class="tick">${checkSvg()}</span>` : `<button class="rm" data-rm="${f.id}" title="${KR.escapeHtml(t.remove)}">${xSvg()}</button>`}
      </div>`).join('');
    updateBtn();
  }
  function updateBtn(){
    el('uploadBtn').disabled = uploading;
    el('uploadBtnLbl').textContent = uploading? t.uploading : t.sendBtn;
  }

  // ---------- submit ----------
  async function submit(){
    if(uploading) return;
    const name=el('cName').value.trim(), email=el('cEmail').value.trim();
    if(!files.length){ el('upErr').textContent=t.errNone; return; }
    if(!name){ el('upErr').textContent=t.errName; el('cName').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ el('upErr').textContent=t.errEmail; el('cEmail').focus(); return; }
    el('upErr').textContent='';

    // demo preview (opened without a real request link): simulate a successful upload
    if(demo){
      uploading=true; updateBtn();
      document.querySelectorAll('#flist .rm').forEach(b=>b.style.display='none');
      document.querySelectorAll('#flist .frow').forEach(r=>{ r.classList.add('up','done'); const bar=r.querySelector('.fbar i'); if(bar) bar.style.width='100%'; });
      setTimeout(()=>{ uploading=false; el('successBody').textContent=req.thankYou||t.successDefault; show('successState'); window.scrollTo({top:0,behavior:'smooth'}); }, 650);
      return;
    }

    // re-fetch to respect any owner changes; re-check gate
    const fresh=KR.getRequest(token);
    if(!fresh){ notice('ntMissingT','ntMissingB'); return; }
    if(KR.statusOf(fresh)==='closed'){ notice('ntClosedT','ntClosedB'); return; }
    if(KR.statusOf(fresh)==='expired'){ notice('ntExpiredT','ntExpiredB'); return; }
    req=fresh;

    uploading=true; updateBtn();
    document.querySelectorAll('#flist .rm').forEach(b=>b.style.display='none');
    document.querySelectorAll('#flist .frow').forEach(r=>r.classList.add('up'));

    const subId='s'+KR.randToken();
    const metas=[];
    try{
      for(let i=0;i<files.length;i++){
        const f=files[i];
        const row=document.querySelector('.frow[data-id="'+f.id+'"]');
        const bar=row? row.querySelector('.fbar i') : null;
        if(bar){ bar.style.width='35%'; }
        await KR.putBlob(f.id, f.file);
        if(bar){ bar.style.width='100%'; }
        f.done=true; if(row){ row.classList.add('done'); }
        metas.push({ id:f.id, subId, name:(f.path||f.name), ext:f.ext, kind:f.kind, size:f.size, at:Date.now(), seen:false });
        await new Promise(r=>setTimeout(r,120));
      }
    }catch(_){
      uploading=false; el('upErr').textContent=t.uploadFail; updateBtn(); return;
    }

    const sub={ id:subId, name, phone:el('cPhone').value.trim(),
      email, note:el('cNote').value.trim(), at:Date.now(), fileIds:metas.map(m=>m.id) };
    req.submissions = (req.submissions||[]).concat([sub]);
    req.files = (req.files||[]).concat(metas);
    KR.upsertRequest(req);
    KR.post({ type:'upload', token, count:metas.length, who:sub.name });

    uploading=false;
    el('successBody').textContent = req.thankYou || t.successDefault;
    show('successState');
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function resetForm(){
    files=[]; uploading=false;
    el('cName').value=''; el('cPhone').value=''; el('cEmail').value=''; el('cNote').value='';
    renderFiles(); el('upErr').textContent=''; show('uploadView');
    window.scrollTo({top:0,behavior:'smooth'});
  }

  // ---------- password ----------
  async function tryUnlock(e){
    e.preventDefault();
    const val=el('pwInput').value;
    if(await KR.hashPass(val)===req.password){ unlocked=true; el('pwForm').classList.remove('bad'); el('pwErr').textContent=''; enterUpload(); }
    else { el('pwForm').classList.add('bad'); el('pwErr').textContent=t.pwWrong; }
  }

  function enterUpload(){
    el('reqName').textContent=req.name || 'KOLKLI Request';
    el('reqDesc').textContent=req.desc || t.heroSub;
    el('fileInput').setAttribute('accept', acceptAttr());
    renderFeatures(); renderFiles(); show('uploadView');
  }

  // ---------- i18n + theme ----------
  function applyStatic(){
    document.querySelectorAll('[data-i18n]').forEach(n=>{ const k=n.getAttribute('data-i18n'); if(typeof t[k]==='string') n.textContent=t[k]; });
    document.querySelectorAll('[data-i18n-ph]').forEach(n=>{ const k=n.getAttribute('data-i18n-ph'); if(typeof t[k]==='string') n.setAttribute('placeholder',t[k]); });
  }
  function applyLang(l){
    if(!I18N[l]) l='he';
    lang=l; t=I18N[l];
    document.documentElement.lang=l; document.documentElement.dir=t.dir;
    applyStatic(); KR.lsSet('ac_lang', l);
    const nm=el('langName'); if(nm) nm.textContent=LNAME[l]||l;
    document.querySelectorAll('#langMenu button').forEach(b=>b.classList.toggle('on', b.getAttribute('data-lang')===l));
    if(req){
      if(!el('uploadView').classList.contains('hidden')){ el('reqDesc').textContent=req.desc || t.heroSub; renderFeatures(); renderFiles(); }
      if(!el('successState').classList.contains('hidden')) el('successBody').textContent = req.thankYou || t.successDefault;
    }
  }
  function applyTheme(th){ const dark=(th==='dark'); document.documentElement.setAttribute('data-theme',dark?'dark':'light'); KR.lsSet('theme',dark?'dark':'light'); }

  // ---------- svg atoms ----------
  function gridSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>'; }
  function clockSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>'; }
  function heartSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 1 0-7.8 7.8l1.1 1L12 21l7.7-7.5 1.1-1a5.5 5.5 0 0 0 0-7.9Z"/></svg>'; }
  function xSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>'; }
  function checkSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'; }

  // ---------- events ----------
  const drop=el('drop'), input=el('fileInput'), folderInput=el('folderInput');
  el('chooseBtn').addEventListener('click',e=>{ e.stopPropagation(); input.click(); });
  el('chooseFolderBtn').addEventListener('click',e=>{ e.stopPropagation(); folderInput.click(); });
  drop.addEventListener('click',()=>input.click());
  input.addEventListener('change',()=>{ addFiles(pathItems(input.files)); input.value=''; });
  folderInput.addEventListener('change',()=>{ addFiles(pathItems(folderInput.files)); folderInput.value=''; });
  ;['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.add('over'); }));
  ;['dragleave','dragend'].forEach(ev=>drop.addEventListener(ev,()=>drop.classList.remove('over')));
  drop.addEventListener('drop',e=>{ e.preventDefault(); drop.classList.remove('over'); if(e.dataTransfer) addFromDataTransfer(e.dataTransfer); });
  document.addEventListener('dragover',e=>{ if(e.dataTransfer && Array.from(e.dataTransfer.types||[]).includes('Files')) e.preventDefault(); });
  document.addEventListener('drop',e=>{ if(e.target!==drop && e.dataTransfer && Array.from(e.dataTransfer.types||[]).includes('Files')) e.preventDefault(); });
  el('flist').addEventListener('click',e=>{ const b=e.target.closest('[data-rm]'); if(b) removeFile(b.getAttribute('data-rm')); });
  el('uploadBtn').addEventListener('click',submit);
  el('moreBtn').addEventListener('click',resetForm);
  el('pwForm').addEventListener('submit',tryUnlock);

  // language picker
  const langWrap=el('langWrap'), langBtn=el('langBtn');
  langBtn.addEventListener('click',e=>{ e.stopPropagation(); const open=langWrap.classList.toggle('open'); langBtn.setAttribute('aria-expanded', open?'true':'false'); });
  el('langMenu').addEventListener('click',e=>{ const b=e.target.closest('[data-lang]'); if(!b) return; applyLang(b.getAttribute('data-lang')); langWrap.classList.remove('open'); langBtn.setAttribute('aria-expanded','false'); });
  document.addEventListener('click',e=>{ if(!langWrap.contains(e.target)){ langWrap.classList.remove('open'); langBtn.setAttribute('aria-expanded','false'); } });
  window.__setLang=applyLang;

  // ---------- init ----------
  applyTheme(ls('theme')||'light');
  applyLang(KR.detectLang());
  token=(location.search.match(/[?&]req=([^&]+)/)||[])[1];
  token = token? decodeURIComponent(token) : null;
  if(!token){
    // no link → local design preview with a demo request (nothing is stored)
    demo=true;
    req={ name:'טל זימר', desc:'', types:[], maxFileMB:7000, maxCount:5, maxTotalMB:0, expiresAt:null, thankYou:'' };
    enterUpload();
    return;
  }
  req=KR.getRequest(token);
  if(!req){ notice('ntMissingT','ntMissingB'); return; }
  const st=KR.statusOf(req);
  if(st==='expired'){ notice('ntExpiredT','ntExpiredB'); return; }
  if(st==='closed'){ notice('ntClosedT','ntClosedB'); return; }
  if(req.password){ show('pwState'); setTimeout(()=>el('pwInput').focus(),40); return; }
  enterUpload();
})();
</script>
</body>
</html>
