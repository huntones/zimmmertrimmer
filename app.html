<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AudioCut — Cut. Normalize. Perfect.</title>
<style>
  :root {
    --bg:#eef0f6; --panel:#ffffff; --panel-2:#f5f6fa; --line:#e5e8f0; --line-2:#eef0f6;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#7c3aed; --accent-dim:#6a2fe0; --accent-ink:#ffffff; --accent-soft:#efe9fe;
    --success:#22b04b; --success-dim:#1c9a41; --success-soft:#e6f6ec;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --danger:#e5484d; --danger-soft:#fdecec;
    --warm-soft:#fff5da; --warm-line:#f2d98a;
    --ok:#22b04b; --warn:#c88a04; --err:#e5484d;
    /* one unified brand gradient (matches the CTA button): purple -> blue -> green */
    --grad:linear-gradient(105deg,#8b2fe0 0%,#3b6ff6 52%,#22d3a0 100%);
    --grad-h:linear-gradient(105deg,#7d22d6 0%,#2f63ec 52%,#16c493 100%);
    --grad-soft:linear-gradient(120deg,#efe9fe,#e6f0ff);
    --grad-shadow:rgba(93,79,240,0.30);
    /* glossy CTA button gradient (same ramp, with sheen) */
    --grad-btn:linear-gradient(105deg,#8b2fe0 0%,#3b6ff6 52%,#22d3a0 100%);
    --grad-btn-glow:rgba(59,111,246,0.38);
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-sm:0 1px 2px rgba(20,24,44,0.05);
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --sans:'Space Grotesk',system-ui,'Segoe UI','Heebo',sans-serif;
  }
  html[data-theme="dark"] {
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a303c; --line-2:#232833;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --accent:#a06bff; --accent-dim:#7c3aed; --accent-ink:#ffffff; --accent-soft:#241a3a;
    --success:#37c26a; --success-dim:#2fae5e; --success-soft:#132a1c;
    --info:#5b95f8; --info-dim:#4f8ef7; --info-soft:#182338;
    --danger:#ff6b6b; --danger-soft:#2a1719;
    --warm-soft:#2c2718; --warm-line:#5a4d24;
    --ok:#4ec98a; --warn:#e8b84b; --err:#ff6b6b;
    --grad:linear-gradient(105deg,#9a45f0 0%,#4d7bff 52%,#2fe0ad 100%);
    --grad-h:linear-gradient(105deg,#a659ff 0%,#5d89ff 52%,#48e9bd 100%);
    --grad-soft:linear-gradient(120deg,#1c1633,#11242a);
    --grad-shadow:rgba(77,123,255,0.42);
    --grad-btn:linear-gradient(105deg,#9a45f0 0%,#4d7bff 52%,#2fe0ad 100%);
    --grad-btn-glow:rgba(77,123,255,0.45);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{zoom:1.25;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;}
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:var(--grad);z-index:100;}
  .wrap{max-width:900px;margin:0 auto;padding:26px 20px 60px;}
  button{font-family:var(--sans);}

  /* ---------- header ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .logo{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    background:var(--grad);color:#fff;box-shadow:0 4px 12px var(--grad-shadow);flex-shrink:0;}
  .brand .logo svg{width:22px;height:22px;}
  .brand h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-0.01em;line-height:1.1;}
  .brand .tag{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:0.02em;margin-top:1px;direction:ltr;}
  html[dir=rtl] .brand .tag{text-align:right;}
  .toolbtns{display:flex;align-items:center;gap:9px;}
  .pillbtn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:999px;
    background:var(--panel);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;font-size:13.5px;
    box-shadow:var(--shadow-sm);transition:border-color .12s,transform .08s,background .12s;}
  .pillbtn:hover{border-color:var(--accent);}
  .pillbtn:active{transform:scale(0.97);}
  .iconbtn{width:38px;height:38px;padding:0;justify-content:center;font-size:16px;line-height:1;}
  .pillbtn svg{width:15px;height:15px;}

  /* ---------- cards ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 24px;
    margin-top:18px;box-shadow:var(--shadow);transition:background-color .25s ease,border-color .25s ease;}
  .cardhead{display:flex;align-items:flex-start;gap:13px;margin-bottom:18px;}
  .stepnum{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:var(--grad);color:#fff;font-weight:700;font-size:15px;
    font-family:var(--mono);box-shadow:0 4px 12px var(--grad-shadow);}
  .cardhead .t{margin:0;font-size:17px;font-weight:700;letter-spacing:-0.01em;}
  .cardhead .s{margin:2px 0 0;font-size:13px;color:var(--muted);}

  /* ---------- dropzone ---------- */
  .drop{border:1.6px dashed var(--line);border-radius:14px;padding:34px 20px;text-align:center;cursor:pointer;
    background:var(--panel-2);transition:border-color .15s,background .15s;}
  .drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);}
  .drop .cloud{width:52px;height:52px;margin:0 auto 12px;border-radius:14px;display:flex;align-items:center;
    justify-content:center;background:var(--accent-soft);color:var(--accent);}
  .drop .cloud svg{width:26px;height:26px;}
  .drop .big{font-size:15.5px;font-weight:600;color:var(--ink);}
  .drop .or{font-size:12.5px;color:var(--faint);margin:7px 0;font-family:var(--mono);}
  .choose{display:inline-flex;align-items:center;gap:8px;color:#fff;border:none;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:600;font-size:14px;padding:11px 24px;border-radius:999px;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.14),0 6px 16px var(--grad-btn-glow);
    transition:filter .14s,transform .08s,box-shadow .14s;}
  .choose:hover{filter:brightness(1.05);} .choose:active{transform:translateY(1px);}
  .drop .fmts{margin-top:16px;font-size:12px;color:var(--faint);font-family:var(--mono);direction:ltr;}
  input[type=file]{display:none;}

  /* ---------- file table ---------- */
  .listhead{display:flex;align-items:center;justify-content:space-between;margin:20px 0 8px;}
  .listhead h3{margin:0;font-size:14px;font-weight:700;}
  .linkbtn{background:none;border:none;color:var(--danger);cursor:pointer;font-size:13px;
    display:inline-flex;align-items:center;gap:5px;padding:4px 2px;}
  .linkbtn:hover{text-decoration:underline;}
  .linkbtn svg{width:13px;height:13px;}
  .tbl{width:100%;border-collapse:collapse;font-size:13.5px;}
  .tbl thead th{text-align:start;font-weight:600;color:var(--muted);font-size:12px;padding:8px 10px;
    border-bottom:1px solid var(--line);white-space:nowrap;}
  .tbl tbody td{padding:11px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle;}
  .tbl tbody tr:last-child td{border-bottom:none;}
  .tbl .fname{display:flex;align-items:center;gap:9px;min-width:0;}
  .tbl .fname .fico{width:26px;height:26px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;
    justify-content:center;background:var(--accent-soft);color:var(--accent);}
  .tbl .fname .fico svg{width:14px;height:14px;}
  .tbl .fname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tbl .num{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);white-space:nowrap;}
  .badge{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;
    background:var(--panel-2);border:1px solid var(--line);color:var(--muted);}
  .rmbtn{background:none;border:none;color:var(--faint);cursor:pointer;padding:5px;border-radius:6px;line-height:0;
    transition:color .12s,background .12s;}
  .rmbtn:hover{color:var(--danger);background:var(--danger-soft);}
  .rmbtn svg{width:15px;height:15px;}
  .listfoot{margin-top:12px;padding:11px 14px;background:var(--panel-2);border-radius:10px;font-family:var(--mono);
    font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;}
  .listfoot svg{width:14px;height:14px;color:var(--faint);}
  .hidden{display:none !important;}
  /* analysis (BPM + key) cells */
  .aprog{display:flex;align-items:center;gap:8px;}
  .aprog .minibar{width:64px;max-width:22vw;}
  .apct{font-family:var(--mono);font-size:11px;color:var(--info);white-space:nowrap;}
  .bpmval{font-weight:700;color:var(--ink);}
  .bpmval small{font-weight:400;color:var(--faint);font-size:10.5px;margin-inline-start:2px;}
  .keybadge{background:var(--accent-soft);border-color:transparent;color:var(--accent-dim);}
  .afaint{color:var(--faint);font-family:var(--mono);font-size:12px;}
  .aspin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--info);
    border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:-2px;margin-inline-end:6px;}

  /* ---------- settings ---------- */
  .setgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media (max-width:950px){.setgrid{grid-template-columns:1fr;}}
  .setgroup{background:var(--panel-2);border:1px solid var(--line-2);border-radius:13px;padding:15px 15px 16px;}
  .setgroup .gh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:12px;}
  .setgroup .gh svg{width:15px;height:15px;color:var(--accent);}
  .setgroup .gh .q{margin-inline-start:auto;color:var(--faint);cursor:help;font-size:12px;font-family:var(--mono);}
  .seghint{font-size:11.5px;color:var(--muted);margin:0 0 9px;font-family:var(--mono);}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{border:1px solid var(--line);background:var(--panel);color:var(--ink-2);border-radius:9px;cursor:pointer;
    font-family:var(--mono);font-size:12.5px;padding:8px 12px;transition:all .12s;flex:0 0 auto;}
  .chip:hover{border-color:var(--accent);}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  /* clip length grid */
  .clipgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
  .clipgrid .chip{text-align:center;padding:9px 0;}
  .sel{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:9px;
    font-family:var(--mono);font-size:13px;padding:9px 11px;cursor:pointer;}
  .sel:focus{outline:none;border-color:var(--accent);}
  .lbl{display:block;font-size:11.5px;color:var(--muted);margin:12px 0 7px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;}
  .wave{margin-top:13px;height:46px;display:flex;align-items:center;gap:2px;padding:0 2px;overflow:hidden;}
  .wave i{flex:1;border-radius:2px;background:linear-gradient(180deg,#8b2fe0,#22d3a0);opacity:.5;min-width:2px;}
  .wave i.hot{opacity:1;background:linear-gradient(180deg,var(--success),#5fd486);}
  /* loudness good/ok classes reuse chip.on but green for -14 recommendation */
  .chip.rec.on{background:var(--success);border-color:var(--success);}
  .recnote{margin-top:10px;font-size:11.5px;color:var(--success-dim);display:flex;align-items:center;gap:6px;font-family:var(--mono);}
  .recnote svg{width:13px;height:13px;}
  /* mastering chips 2-col with icon */
  .mastergrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
  .mchip{display:flex;align-items:center;gap:7px;justify-content:flex-start;border:1px solid var(--line);background:var(--panel);
    color:var(--ink-2);border-radius:9px;cursor:pointer;font-size:12.5px;padding:9px 10px;transition:all .12s;}
  .mchip:hover{border-color:var(--accent);}
  .mchip .mi{font-size:14px;line-height:1;}
  .mchip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-dim);font-weight:600;}
  .toggleorig{margin-top:9px;}
  .toggleorig .mchip{width:100%;justify-content:center;}
  .toggleorig .mchip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-dim);}
  /* real-time preview */
  .preview{margin-top:16px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:13px;padding:14px 16px;}
  .pvtop{display:flex;align-items:center;gap:13px;}
  .pvplay{width:44px;height:44px;border-radius:50%;flex-shrink:0;border:none;cursor:pointer;color:#fff;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.14),0 4px 12px var(--grad-btn-glow);transition:filter .14s,transform .08s;}
  .pvplay:hover:not(:disabled){filter:brightness(1.05);} .pvplay:active:not(:disabled){transform:scale(.94);}
  .pvplay:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;}
  .pvplay svg{width:20px;height:20px;}
  .pvmid{flex:1;min-width:0;}
  .pvname{font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pvsub{font-size:11.5px;color:var(--muted);font-family:var(--mono);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pvfilesel{margin-top:4px;max-width:100%;width:auto;background:var(--panel);border:1px solid var(--line);color:var(--ink);
    border-radius:8px;font-family:var(--mono);font-size:12px;padding:5px 8px;cursor:pointer;text-overflow:ellipsis;}
  .pvfilesel:focus{outline:none;border-color:var(--accent);}
  .pvfilesel:disabled{color:var(--muted);cursor:default;}
  .abtoggle{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-shrink:0;background:var(--panel);}
  .abtoggle button{background:none;border:none;cursor:pointer;font-family:var(--mono);font-size:12.5px;padding:8px 15px;color:var(--muted);transition:all .12s;}
  .abtoggle button.on{background:var(--accent);color:#fff;font-weight:600;}
  .pvbar{height:5px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:12px;}
  .pvbar>i{display:block;height:100%;width:0%;background:var(--accent);border-radius:999px;transition:width .1s linear;}
  .pvfoot{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .pvnote{font-size:11px;color:var(--faint);font-family:var(--mono);display:flex;align-items:center;gap:6px;line-height:1.4;}
  .pvnote svg{width:12px;height:12px;flex-shrink:0;}
  .pvmatch{display:inline-flex;align-items:center;gap:8px;flex-shrink:0;background:none;border:none;cursor:pointer;
    font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;}
  .pvmatch .sw{width:32px;height:18px;border-radius:999px;background:var(--line);position:relative;transition:background .15s;flex-shrink:0;}
  .pvmatch .sw::after{content:'';position:absolute;top:2px;inset-inline-start:2px;width:14px;height:14px;border-radius:50%;
    background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s;}
  .pvmatch.on{color:var(--accent-dim);}
  .pvmatch.on .sw{background:var(--accent);}
  .pvmatch.on .sw::after{transform:translateX(14px);}
  html[dir=rtl] .pvmatch.on .sw::after{transform:translateX(-14px);}

  .setrow{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;}
  @media (max-width:775px){.setrow{grid-template-columns:1fr;}}
  .field .gh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:11px;}
  .field .gh svg{width:15px;height:15px;color:var(--accent);}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .suffixrow{display:grid;grid-template-columns:auto 1fr;gap:9px;}
  .txt{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:9px;
    font-family:var(--mono);font-size:13px;padding:9px 11px;}
  .txt:focus{outline:none;border-color:var(--accent);}

  .go{width:100%;margin-top:20px;color:#fff;border:none;font-weight:700;font-size:16px;
    background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--grad-btn);
    padding:16px;border-radius:999px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;text-shadow:0 1px 2px rgba(0,0,0,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 5px rgba(0,0,0,.16),0 8px 22px var(--grad-btn-glow);transition:filter .14s,transform .08s,box-shadow .14s;}
  .go:hover:not(:disabled){filter:brightness(1.05);} .go:active:not(:disabled){transform:translateY(1px);}
  .go:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;}
  .go svg{width:17px;height:17px;}
  .enginechip{margin-top:11px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted);
    display:flex;align-items:center;justify-content:center;gap:8px;}
  .enginechip .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);}
  .enginechip .dot.ready{background:var(--ok);} .enginechip .dot.err{background:var(--err);}
  .enginechip .dot.busy{background:var(--accent);animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{50%{opacity:.35;}}

  /* ---------- progress ---------- */
  .overall{margin-bottom:6px;}
  .overall .top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);
    font-family:var(--mono);margin-bottom:8px;}
  .overall .top b{color:var(--ink);}
  .obar{height:10px;background:var(--panel-2);border-radius:999px;overflow:hidden;border:1px solid var(--line-2);}
  .obar>i{display:block;height:100%;width:0%;border-radius:999px;background:var(--grad);
    transition:width .3s ease;}
  .prtbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:18px;}
  .prtbl thead th{text-align:start;font-weight:600;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  .prtbl tbody td{padding:11px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle;}
  .prtbl tbody tr:last-child td{border-bottom:none;}
  .prtbl .pname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;font-family:var(--mono);font-size:12.5px;}
  .st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-family:var(--mono);white-space:nowrap;}
  .st svg{width:14px;height:14px;}
  .st.queued{color:var(--faint);} .st.processing{color:var(--info);} .st.done{color:var(--success);}
  .st.skip{color:var(--warn);} .st.error{color:var(--err);}
  .st.processing svg{animation:spin 1s linear infinite;} @keyframes spin{to{transform:rotate(360deg);}}
  .minibar{height:7px;width:130px;max-width:40vw;background:var(--panel-2);border-radius:999px;overflow:hidden;border:1px solid var(--line-2);}
  .minibar>i{display:block;height:100%;width:0%;border-radius:999px;background:var(--grad);transition:width .25s ease;}
  .minibar.done>i{background:linear-gradient(90deg,var(--success-dim),var(--success));}
  .dlrow{background:none;border:1px solid var(--line);color:var(--muted);width:34px;height:32px;border-radius:8px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;transition:all .12s;}
  .dlrow:not(:disabled):hover{border-color:var(--info);color:var(--info);background:var(--info-soft);}
  .dlrow:disabled{opacity:.4;cursor:not-allowed;}
  .dlrow svg{width:15px;height:15px;}

  .prfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap;}
  .btn-danger{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--danger);
    color:var(--danger);font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:999px;cursor:pointer;transition:background .12s;}
  .btn-danger:hover{background:var(--danger-soft);} .btn-danger svg{width:15px;height:15px;}

    },
  };

  // mastering preset -> ffmpeg audio filter chain (applied before loudnorm)
  const PRESETS = {
    none:  '',
    warm:  'bass=g=2.5:f=110:w=0.6,treble=g=-1.5:f=8000',
    punch: 'acompressor=threshold=-22dB:ratio=4:attack=5:release=150,bass=g=3:f=90:w=0.7,equalizer=f=3500:t=q:w=1.4:g=2.5',
    bright:'highpass=f=35,treble=g=3.5:f=7000',
    natural:'equalizer=f=3000:t=q:w=1.3:g=2.5,treble=g=3:f=9500',
    radio: 'highpass=f=90,lowpass=f=13500,acompressor=threshold=-16dB:ratio=4:attack=8:release=120',
    stream:'acompressor=threshold=-20dB:ratio=2.5:attack=20:release=250,bass=g=2.5:f=90,treble=g=2:f=8500',
  };
  const TRUE_PEAK = -1.0, LRA = 11;
  const FMT = {
    mp3:  { ext:'mp3',  mime:'audio/mpeg', args:br=>['-c:a','libmp3lame','-b:a',br+'k','-ar','44100'] },
    aac:  { ext:'aac',  mime:'audio/aac',  args:br=>['-c:a','aac','-b:a',br+'k','-ar','44100'] },
    m4a:  { ext:'m4a',  mime:'audio/mp4',  args:br=>['-c:a','aac','-b:a',br+'k','-ar','44100','-f','ipod'] },
    wav:  { ext:'wav',  mime:'audio/wav',  args:()=>['-c:a','pcm_s16le','-ar','44100'] },
    flac: { ext:'flac', mime:'audio/flac', args:()=>['-c:a','flac','-ar','44100'] },
  };

  const el = id => document.getElementById(id);
  const $ = (sel,root=document) => root.querySelector(sel);

  // ---- state ----
  let ffmpeg=null, ready=false, busy=false, encoding=false, currentItem=null;
  let lang='he', t=I18N.he;
  let items=[]; // {file,name,ext,size,dur,status,prog,out}
  let settings={ clip:30, start:'random', lufs:'-14', preset:'none', fmt:'mp3', br:'320', nameMode:'suffix', suffix:'_30s_normal' };
  let runStart=0, elapsedTimer=null;

  // ---- helpers ----
  function fmtBytes(n){ if(n==null) return '—'; if(n>=1048576) return (n/1048576).toFixed(1)+' MB'; if(n>=1024) return (n/1024).toFixed(0)+' KB'; return n+' B'; }
  function fmtDur(s){ if(s==null||isNaN(s)) return '—'; const m=Math.floor(s/60), sec=Math.round(s%60); return m+':'+String(sec).padStart(2,'0'); }
  function fmtClock(ms){ const s=Math.floor(ms/1000); const m=Math.floor(s/60), sec=s%60; return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0'); }
  function extOf(name){ const m=name.match(/\.([^.]+)$/); return m?m[1].toUpperCase():'—'; }

  // ---- i18n ----
  function applyLang(l){
    lang=l; t=I18N[l];
    document.documentElement.lang=l; document.documentElement.dir=t.dir;
    document.querySelectorAll('[data-i18n]').forEach(n=>{ const k=n.getAttribute('data-i18n'); if(typeof t[k]==='string') n.textContent=t[k]; });
    document.querySelectorAll('[data-i18n-opt]').forEach(n=>{ const k=n.getAttribute('data-i18n-opt'); if(typeof t[k]==='string') n.textContent=t[k]; });
    el('langIco').textContent=t.langIco;
    if(ready) el('engineText').textContent = busy? t.engineWorking : t.engineReady;
    else el('engineText').textContent = t.engineLoading;
    startBtn_updateLabel();
    renderList(); renderProgress(); updateTotals(); renderPreviewFiles();
  }

  // ---- file list ----
  function renderList(){
    const sec=el('listSection'), rows=el('fileRows');
    if(!items.length){ sec.classList.add('hidden'); return; }
    sec.classList.remove('hidden');
    el('listTitle').textContent = t.listTitle(items.length);
    rows.innerHTML='';
    items.forEach((it,idx)=>{
      const tr=document.createElement('tr'); it._lrow=tr;
      tr.innerHTML =
        `<td><div class="fname"><span class="fico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span><span title="${escapeHtml(it.name)}">${escapeHtml(it.name)}</span></div></td>`+
        `<td class="num" data-dur>${fmtDur(it.dur)}</td>`+
        `<td class="num">${fmtBytes(it.size)}</td>`+
        `<td><span class="badge">${it.ext}</span></td>`+
        `<td class="bpmcell">${bpmCellHtml(it)}</td>`+
        `<td class="keycell">${keyCellHtml(it)}</td>`+
        `<td style="text-align:end;"></td>`;
      const rm=document.createElement('button'); rm.className='rmbtn'; rm.type='button';
      rm.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
      rm.addEventListener('click',()=>{ items.splice(idx,1); renderList(); updateTotals(); maybeEnable(); refreshPreviewSource(); });
      tr.lastElementChild.appendChild(rm);
      rows.appendChild(tr);
    });
  }
  function updateTotals(){
    const total=items.reduce((a,it)=>a+it.size,0);
    if(items.length) el('listFoot').textContent = t.listFoot(fmtBytes(total), items.length);
  }
  function escapeHtml(s){ return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  // ==================== BPM + musical key analysis ====================
  // Runs fully in-browser via essentia.js (WASM). Detects each file's tempo
  // (BPM) and musical key/scale right after it is added, showing per-row
  // progress in the file table until a result is obtained.
  const EssentiaWASM = window.EssentiaWASM, EssentiaCls = window.Essentia;
  let essentia=null, analyzerErr=false;
  const analyzerReady = (async ()=>{
    if(!EssentiaWASM || !EssentiaCls){ analyzerErr=true; return; }
    try{
      const dir=location.href.replace(/[^/]*$/,'')+'vendor/';
      const mod = await EssentiaWASM({ locateFile:(p)=>dir+p });
      essentia = new EssentiaCls(mod);
    }catch(e){ console.error('analyzer load failed',e); analyzerErr=true; }
  })();

  const SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const PC={'C':0,'B#':0,'C#':1,'DB':1,'D':2,'D#':3,'EB':3,'E':4,'FB':4,'F':5,'E#':5,'F#':6,'GB':6,'G':7,'G#':8,'AB':8,'A':9,'A#':10,'BB':10,'B':11,'CB':11};
  const CAM_MAJ=['8B','3B','10B','5B','12B','7B','2B','9B','4B','11B','6B','1B'];
  const CAM_MIN=['5A','12A','7A','2A','9A','4A','11A','6A','1A','8A','3A','10A'];
  function formatKey(key,scale){
    const pc=PC[String(key).trim().toUpperCase()];
    if(pc==null) return { display:'—', id3:'', camelot:'' };
    const minor=/min/i.test(scale);
    const display=SHARP[pc]+(minor?'m':'');
    return { display, id3:display, camelot:(minor?CAM_MIN:CAM_MAJ)[pc], minor, pc };
  }

  function bpmCellHtml(it){
    if(it.astatus==='done') return it.bpm? `<span class="num bpmval">${it.bpm}<small>BPM</small></span>` : `<span class="afaint">—</span>`;
    if(it.astatus==='error') return `<span class="afaint">—</span>`;
    if(it.astatus==='analyzing') return `<div class="aprog"><div class="minibar"><i style="width:${it.aprog}%"></i></div><span class="apct">${it.aprog}%</span></div>`;
    return `<span class="afaint"><span class="aspin"></span></span>`; // queued
  }
  function keyCellHtml(it){
    if(it.astatus==='done') return (it.key && it.key!=='—')? `<span class="badge keybadge">${it.key}${it.camelot?' · '+it.camelot:''}</span>` : `<span class="afaint">—</span>`;
    if(it.astatus==='error') return `<span class="afaint">—</span>`;
    return `<span class="afaint">…</span>`;
  }
  function updateAnalysisCell(it){
    const tr=it._lrow; if(!tr||!tr.children[4]) return;
    tr.children[4].innerHTML=bpmCellHtml(it);
    tr.children[5].innerHTML=keyCellHtml(it);
  }

  // decode any supported file to a mono Float32Array resampled to 44.1kHz
  // (matches essentia's default sampleRate); window capped to keep it fast.
  async function decodeMono44k(file){
    const AC = window.OfflineAudioContext||window.webkitOfflineAudioContext;
    if(!AC) throw new Error('OfflineAudioContext unavailable');
    const buf = await file.arrayBuffer();
    const ctx = new AC(1,1,44100);
    const audio = await new Promise((res,rej)=>{ const p=ctx.decodeAudioData(buf,res,rej); if(p&&p.then) p.then(res,rej); });
    const ch=audio.numberOfChannels, len=audio.length;
    let mono;
    if(ch===1){ mono=audio.getChannelData(0).slice(); }
    else{ mono=new Float32Array(len); for(let c=0;c<ch;c++){ const d=audio.getChannelData(c); for(let i=0;i<len;i++) mono[i]+=d[i]; } for(let i=0;i<len;i++) mono[i]/=ch; }
    const MAX=180*44100;                          // analyze at most a centered 3-minute window
    if(mono.length>MAX){ const s=Math.floor((mono.length-MAX)/2); mono=mono.subarray(s,s+MAX); }
    return mono;
  }

  async function analyzeItem(it){
    it.astatus='analyzing'; it.aprog=6; updateAnalysisCell(it);
    let mono;
    try{ mono=await decodeMono44k(it.file); }
    catch(e){ console.error('decode failed',it.name,e); it.astatus='error'; updateAnalysisCell(it); return; }
    it.aprog=45; updateAnalysisCell(it);
    await new Promise(r=>setTimeout(r,0));         // let the UI paint before the blocking WASM calls
    let vec=null;
    try{
      vec=essentia.arrayToVector(mono);
      it.bpm=Math.round(essentia.PercivalBpmEstimator(vec).bpm);
      it.aprog=78; updateAnalysisCell(it);
      const k=essentia.KeyExtractor(vec);
      const f=formatKey(k.key,k.scale);
      it.key=f.display; it.keyId3=f.id3; it.camelot=f.camelot; it.keyStrength=k.strength;
      it.astatus='done'; it.aprog=100; updateAnalysisCell(it);
    }catch(e){ console.error('analysis failed',it.name,e); it.astatus='error'; updateAnalysisCell(it); }
    finally{ if(vec&&vec.delete) vec.delete(); }
  }

  // one file at a time — essentia is a single WASM instance and the calls block
  let aQueue=[], aBusy=false;
  function enqueueAnalysis(it){ aQueue.push(it); drainAnalysis(); }
  async function drainAnalysis(){
    if(aBusy) return; aBusy=true;
    await analyzerReady;
    while(aQueue.length){
      const it=aQueue.shift();
      if(!items.includes(it)){ it._resolveA&&it._resolveA(); continue; }                 // removed
      if(it.astatus==='done'){ it._resolveA&&it._resolveA(); continue; }                 // already analyzed
      if(analyzerErr||!essentia){ it.astatus='error'; updateAnalysisCell(it); it._resolveA&&it._resolveA(); maybeEnable(); continue; }
      await analyzeItem(it);
      it._resolveA&&it._resolveA();
      maybeEnable();                                  // re-check the Start button as each file settles
    }
    aBusy=false;
  }

  function acceptFiles(list){
    const arr=[...list].filter(f=>/\.(mp3|wav|flac|aac|m4a|ogg)$/i.test(f.name)||/^audio\//.test(f.type));
    if(!arr.length) return;
    arr.forEach(f=>{
      const it={ file:f, name:f.name, ext:extOf(f.name), size:f.size, dur:null, status:'queued', prog:0, out:null,
                 astatus:'queued', aprog:0, bpm:null, key:null, keyId3:'', camelot:'', keyStrength:0 };
      it.analysisDone = new Promise(res=>{ it._resolveA = res; });
      items.push(it);
      // read duration via <audio> metadata (no ffmpeg needed for the table)
      try{
        const a=new Audio(); const u=URL.createObjectURL(f);
        a.preload='metadata'; a.src=u;
        a.addEventListener('loadedmetadata',()=>{ it.dur=a.duration; URL.revokeObjectURL(u); renderList(); },{once:true});
        a.addEventListener('error',()=>{ URL.revokeObjectURL(u); },{once:true});
      }catch(_){}
      enqueueAnalysis(it);                          // kick off BPM + key detection
    });
    renderList(); updateTotals(); maybeEnable(); refreshPreviewSource();
  }

  // ---- decorative waveform ----
  function buildWave(){
    const w=el('wave'); w.innerHTML=''; const N=64;
    // deterministic pseudo-random pattern so it looks like audio, not noise
    for(let i=0;i<N;i++){
      const bar=document.createElement('i');
      const v=Math.abs(Math.sin(i*0.7)*0.6 + Math.sin(i*0.23)*0.4 + Math.sin(i*1.9)*0.25);
      bar.style.height = (18+v*80).toFixed(0)+'%';
      bar.dataset.i=i;
      w.appendChild(bar);
    }
    highlightWave();
  }
  function highlightWave(){
    const bars=[...el('wave').children]; const N=bars.length;
    // highlight a slice representing where the clip is taken from
    let s;
    if(settings.start==='start') s=0;
    else if(settings.start==='middle') s=Math.floor(N*0.38);
    else s=Math.floor(N*0.30);
    const len=Math.max(6,Math.floor(N*0.34));
    bars.forEach((b,i)=> b.classList.toggle('hot', i>=s && i<s+len));
  }

  // ---- engine ----
  async function loadEngine(){
    if(!FFmpeg||!fetchFile){ engineFail(t.errNoEngine); return; }
    ffmpeg=new FFmpeg();
    ffmpeg.on('progress',({progress})=>{
      if(currentItem&&encoding){ currentItem.prog=Math.max(currentItem.prog,Math.min(99,Math.round(progress*100))); updateRow(currentItem); updateOverallLive(); }
    });
    try{
      const dir=location.href.replace(/[^/]*$/,'')+'vendor/';
      await ffmpeg.load({ coreURL:dir+'ffmpeg-core.js', wasmURL:dir+'ffmpeg-core.wasm' });
      ready=true; el('dot').className='dot ready'; el('engineText').textContent=t.engineReady;
      el('engineChip').classList.add('hidden'); maybeEnable();
    }catch(err){ console.error(err); engineFail(location.protocol==='file:'?t.errFileProto:t.errNoEngine); }
  }
  function engineFail(msg){ el('dot').className='dot err'; el('engineText').textContent=msg; el('engineChip').classList.remove('hidden'); }

  // analysis (BPM + key) is still pending if any file hasn't settled to done/error
  function analysisPending(){ return items.some(it=> it.astatus!=='done' && it.astatus!=='error'); }
  function startBtn_updateLabel(){
    const span=$('#startBtn span'); if(!span) return;
    if(busy) span.textContent=t.processing;
    else if(items.length && analysisPending()) span.textContent=t.analyzing;
    else span.textContent=t.start;
  }
  // enabled only once the engine is ready, files exist, nothing is running,
  // and every file finished BPM/key analysis (uploaded "successfully")
  function maybeEnable(){ el('startBtn').disabled = !(ready && items.length && !busy && !analysisPending()); startBtn_updateLabel(); }

  // ---- processing ----
  async function getDuration(inName){
    let dur=null;
    const h=({message})=>{ const m=message.match(/Duration:\s*(\d+):(\d+):(\d+\.?\d*)/); if(m) dur=(+m[1])*3600+(+m[2])*60+parseFloat(m[3]); };
    ffmpeg.on('log',h);
    try{ await ffmpeg.exec(['-i',inName,'-f','null','-']); }catch(_){}
    ffmpeg.off('log',h);
    return dur;
  }

  // Pass 1 of two-pass loudnorm: run the exact clip (with the mastering preset
  // applied) through loudnorm in analysis mode and parse the JSON stats it
  // prints. These feed pass 2 so the final gain hits the target LUFS exactly —
  // boosting quiet clips and attenuating loud ones by an exact, linear amount.
  async function measureLoudnorm(inName, startAt, clip, preChain){
    const pre = preChain ? preChain+',' : '';
    const af = `${pre}loudnorm=I=${settings.lufs}:TP=${TRUE_PEAK}:LRA=${LRA}:print_format=json`;
    let buf='';
    const h=({message})=>{ buf+=message+'\n'; };
    ffmpeg.on('log',h);
    try{ await ffmpeg.exec(['-ss',startAt.toFixed(3),'-t',clip.toFixed(3),'-i',inName,'-af',af,'-f','null','-']); }catch(_){}
    ffmpeg.off('log',h);
    const m=buf.match(/\{[^{}]*\}/);
    if(!m) return null;
    try{ return JSON.parse(m[0]); }catch(_){ return null; }
  }

  // ffmpeg metadata args carrying the detected BPM + musical key into the output.
  // MP3 gets the standard ID3v2 TBPM/TKEY frames (read by DJ software, players,
  // Windows Explorer); other formats get generic BPM/KEY tags. A human-readable
  // comment is always added as a fallback.
  function buildMeta(it,f){
    const meta=[];
    if(!(it.bpm || (it.key && it.key!=='—'))) return meta;
    const parts=[];
    if(it.bpm) parts.push(it.bpm+' BPM');
    if(it.key && it.key!=='—') parts.push('Key '+it.key+(it.camelot?' ('+it.camelot+')':''));
    meta.push('-metadata','comment='+parts.join('  ·  '));
    if(f.ext==='mp3'){
      if(it.bpm) meta.push('-metadata','TBPM='+it.bpm);
      if(it.keyId3) meta.push('-metadata','TKEY='+it.keyId3);
      meta.push('-id3v2_version','3');
    }else{
      if(it.bpm) meta.push('-metadata','BPM='+it.bpm);
      if(it.keyId3) meta.push('-metadata','KEY='+it.keyId3);
    }
    return meta;
  }

  async function processOne(it,idx){
    const stem=it.name.replace(/\.[^.]+$/,'');
    const f=FMT[settings.fmt]||FMT.mp3;
    const safeIn=`in_${idx}.${it.ext.toLowerCase()||'dat'}`;
    const outName = (settings.nameMode==='keep'? stem : stem+settings.suffix) + '.' + f.ext;
    it.status='processing'; it.prog=0; currentItem=it; updateRow(it);

    await ffmpeg.writeFile(safeIn, await fetchFile(it.file));
    const dur = it.dur!=null ? it.dur : await getDuration(safeIn);
    const clip = settings.clip;
    if(dur==null){ it.status='error'; updateRow(it); await ffmpeg.deleteFile(safeIn).catch(()=>{}); return; }
    if(dur < clip){ it.status='skip'; it.prog=100; updateRow(it); await ffmpeg.deleteFile(safeIn).catch(()=>{}); return; }

    let startAt;
    if(settings.start==='start') startAt=0;
    else if(settings.start==='middle') startAt=(dur-clip)/2;
    else startAt=Math.random()*(dur-clip);

    const preChain = PRESETS[settings.preset] || '';
    // Two-pass loudnorm: measure the exact clip (preset already applied), then
    // feed those stats back so pass 2 lands on the target LUFS precisely. Falls
    // back to single-pass loudnorm if measurement is unavailable (e.g. silence).
    const meas = await measureLoudnorm(safeIn, startAt, clip, preChain);
    const mkeys = ['input_i','input_tp','input_lra','input_thresh','target_offset'];
    const okMeas = meas && mkeys.every(k=>isFinite(parseFloat(meas[k])));
    let ln = `loudnorm=I=${settings.lufs}:TP=${TRUE_PEAK}:LRA=${LRA}`;
    if(okMeas){
      ln += `:measured_I=${meas.input_i}:measured_TP=${meas.input_tp}`
          + `:measured_LRA=${meas.input_lra}:measured_thresh=${meas.input_thresh}`
          + `:offset=${meas.target_offset}:linear=true`;
    }
    const af = preChain ? preChain+','+ln : ln;
    const outFile=`out_${idx}.${f.ext}`;
    if(it.analysisDone){ try{ await it.analysisDone; }catch(_){} }   // ensure BPM/key detected before tagging
    const meta=buildMeta(it,f);

    try{
      encoding=true;
      await ffmpeg.exec(['-ss',startAt.toFixed(3),'-t',clip.toFixed(3),'-i',safeIn,'-af',af,...f.args(settings.br),...meta,outFile]);
      encoding=false;
      const data=await ffmpeg.readFile(outFile);
      const blob=new Blob([data.buffer],{type:f.mime});
      it.out={ name:outName, url:URL.createObjectURL(blob), blob, size:blob.size };
      it.status='done'; it.prog=100; updateRow(it);
      await ffmpeg.deleteFile(safeIn).catch(()=>{}); await ffmpeg.deleteFile(outFile).catch(()=>{});
    }catch(err){ encoding=false; console.error(err); it.status='error'; updateRow(it); await ffmpeg.deleteFile(safeIn).catch(()=>{}); }
  }

  async function run(){
    if(busy||!ready||!items.length||analysisPending()) return;
    busy=true; maybeEnable(); startBtn_updateLabel();
    el('dot').className='dot busy'; el('engineText').textContent=t.engineWorking;
    el('dlAll').disabled=true;
    items.forEach(it=>{ if(it.out){URL.revokeObjectURL(it.out.url);} it.out=null; it.status='queued'; it.prog=0; });
    renderProgress();
    runStart=Date.now(); startElapsed();

    for(let i=0;i<items.length;i++){
      try{ await processOne(items[i],i); }catch(e){ items[i].status='error'; updateRow(items[i]); }
      updateOverall();
    }
    currentItem=null; stopElapsed();
    busy=false; maybeEnable(); startBtn_updateLabel();
    el('dot').className='dot ready'; el('engineText').textContent=t.engineReady;
    const anyOut=items.some(it=>it.out); el('dlAll').disabled=!anyOut;
    updateTotalsOut();
  }

  // ---- progress rendering ----
  function stIcon(s){
    if(s==='done') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    if(s==='processing') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.5"/></svg>';
    if(s==='skip') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>';
    if(s==='error') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  }
  function stText(s){ return {queued:t.stQueued,processing:t.stProcessing,done:t.stDone,skip:t.stSkip,error:t.stError}[s]||''; }

  function renderProgress(){
    const tbl=el('prTable'), rows=el('prRows'), empty=el('emptyProg');
    if(!items.length){ tbl.classList.add('hidden'); empty.classList.remove('hidden'); resetOverall(); return; }
    tbl.classList.remove('hidden'); empty.classList.add('hidden');
    rows.innerHTML='';
    items.forEach(it=>{
      const tr=document.createElement('tr'); it._row=tr;
      tr.innerHTML=
        `<td class="pname" title="${escapeHtml(it.name)}">${escapeHtml(it.name)}</td>`+
        `<td><span class="st ${it.status}">${stIcon(it.status)}${stText(it.status)}</span></td>`+
        `<td><div class="minibar ${it.status==='done'?'done':''}"><i style="width:${it.prog}%"></i></div></td>`+
        `<td class="num">${it.out?fmtBytes(it.out.size):'—'}</td>`+
        `<td style="text-align:end;"></td>`;
      const dl=document.createElement('button'); dl.className='dlrow'; dl.type='button'; dl.disabled=!it.out;
      dl.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>';
      dl.addEventListener('click',()=>{ if(it.out) triggerDownload(it.out.url,it.out.name); });
      tr.lastElementChild.appendChild(dl);
      rows.appendChild(tr);
    });
    updateOverall();
  }
  function updateRow(it){
    const tr=it._row; if(!tr) return;
    tr.children[1].innerHTML=`<span class="st ${it.status}">${stIcon(it.status)}${stText(it.status)}</span>`;
    const mb=tr.children[2].firstElementChild; mb.className='minibar '+(it.status==='done'?'done':''); mb.firstElementChild.style.width=it.prog+'%';
    tr.children[3].textContent=it.out?fmtBytes(it.out.size):'—';
    const dl=tr.children[4].firstElementChild; if(dl){ dl.disabled=!it.out; }
  }
  function completedCount(){ return items.filter(it=>it.status==='done'||it.status==='skip'||it.status==='error').length; }
  function updateOverall(){
    const done=completedCount(), n=items.length||1;
    const pct=Math.round((done/n)*100);
    el('obarFill').style.width=pct+'%'; el('pctText').textContent=pct+'%';
    el('doneCount').textContent=done; el('doneLabel').textContent=t.doneLabel(done,items.length);
  }
  function updateOverallLive(){
    const done=completedCount(), n=items.length||1;
    const frac=(done + (currentItem?currentItem.prog/100:0))/n;
    const pct=Math.min(100,Math.round(frac*100));
    el('obarFill').style.width=pct+'%'; el('pctText').textContent=pct+'%';
  }
  function resetOverall(){ el('obarFill').style.width='0%'; el('pctText').textContent='0%'; el('doneCount').textContent='0'; el('doneLabel').textContent=t.doneLabel(0,0); el('totOut').textContent='—'; el('elapsed').textContent='00:00'; }
  function updateTotalsOut(){ const tot=items.reduce((a,it)=>a+(it.out?it.out.size:0),0); el('totOut').textContent=tot?fmtBytes(tot):'—'; }

  function startElapsed(){ stopElapsed(); elapsedTimer=setInterval(()=>{ el('elapsed').textContent=fmtClock(Date.now()-runStart); },500); }
  function stopElapsed(){ if(elapsedTimer){ clearInterval(elapsedTimer); elapsedTimer=null; } el('elapsed').textContent=fmtClock(Date.now()-runStart); }

  // ---- downloads ----
  function triggerDownload(url,name){ const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
  async function downloadZip(){
    const outs=items.filter(it=>it.out);
    if(!outs.length) return;
    if(typeof JSZip==='undefined'){ outs.forEach((o,i)=>setTimeout(()=>triggerDownload(o.out.url,o.out.name),i*300)); return; }
    const btn=el('dlAll'); const prev=btn.innerHTML; btn.disabled=true;
    const zip=new JSZip();
    outs.forEach(it=>zip.file(it.out.name,it.out.blob));
    const blob=await zip.generateAsync({type:'blob'});
    const url=URL.createObjectURL(blob);
    triggerDownload(url,`AudioCut_${outs.length}_files.zip`);
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    btn.innerHTML=prev; btn.disabled=false;
  }

  function clearAll(){
    items.forEach(it=>{ if(it.out) URL.revokeObjectURL(it.out.url); });
    items=[]; renderList(); updateTotals(); renderProgress(); resetOverall();
    el('dlAll').disabled=true; maybeEnable(); refreshPreviewSource();
  }

  // ---- theme ----
  function applyTheme(theme){
    const isLight = theme!=='dark';
    document.documentElement.setAttribute('data-theme', isLight?'light':'dark');
    el('themeIco').textContent = isLight? '🌙' : '☀️';
    try{ localStorage.setItem('theme', isLight?'light':'dark'); }catch(_){}
  }

  // ================= real-time mastering preview (Web Audio) =================
  // Each preset is mirrored as a chain of BiquadFilter / DynamicsCompressor nodes
  // that approximate the ffmpeg filter chain. Loudness is matched in real time by
  // measuring the post-preset integrated loudness (BS.1770 K-weighting) offline and
  // applying an auto-gain toward the target LUFS — so A/B is a clean tonal compare.
  const PV_CHAIN = {
    none:   { nodes:[] },
    warm:   { nodes:[ {t:'lowshelf',f:110,g:2.5}, {t:'highshelf',f:8000,g:-1.5} ] },
    bright: { nodes:[ {t:'highpass',f:35}, {t:'highshelf',f:7000,g:3.5} ] },
    natural:{ nodes:[ {t:'peaking',f:3000,q:1.3,g:2.5}, {t:'highshelf',f:9500,g:3} ] },
    punch:  { nodes:[ {t:'comp',th:-22,ratio:4,atk:0.005,rel:0.15}, {t:'lowshelf',f:90,g:3}, {t:'peaking',f:3500,q:1.4,g:2.5} ] },
    radio:  { nodes:[ {t:'highpass',f:90}, {t:'lowpass',f:13500}, {t:'comp',th:-16,ratio:4,atk:0.008,rel:0.12} ] },
    stream: { nodes:[ {t:'comp',th:-20,ratio:2.5,atk:0.02,rel:0.25}, {t:'lowshelf',f:90,g:2.5}, {t:'highshelf',f:8500,g:2} ] },
  };
  const pvAudio = el('pvAudio');
  let pvCtx=null, pvSrc=null, pvGain=null, pvNormGain=null, pvChain=[], pvMode='master',
      pvItem=null, pvUrl=null, pvRAF=null, pvMeasureTok=0, pvNorm=true;

  function pvMakeNode(ctx, spec){
    if(spec.t==='comp'){
      const c=ctx.createDynamicsCompressor();
      c.threshold.value=spec.th; c.ratio.value=spec.ratio; c.knee.value=6;
      c.attack.value=spec.atk; c.release.value=spec.rel; return c;
    }
    const b=ctx.createBiquadFilter(); b.type=spec.t; b.frequency.value=spec.f;
    if(spec.q!=null) b.Q.value=spec.q; if(spec.g!=null) b.gain.value=spec.g; return b;
  }
  function pvBuildGraph(){
    if(!pvCtx) return;
    try{ pvSrc.disconnect(); }catch(_){}
    pvChain.forEach(n=>{ try{n.disconnect();}catch(_){} }); pvChain=[];
    const desc=PV_CHAIN[settings.preset]||PV_CHAIN.none;
    let end=pvSrc;
    if(pvMode==='master' && desc.nodes.length){
      desc.nodes.forEach(spec=>{ const n=pvMakeNode(pvCtx,spec); end.connect(n); end=n; pvChain.push(n); });
    }
    end.connect(pvNormGain);
    if(pvNorm) pvMeasureGain();                                    // refine toward target LUFS
    else pvNormGain.gain.setTargetAtTime(1, pvCtx.currentTime, 0.06); // raw preset loudness
  }
  function pvEnsure(){
    if(pvCtx) return;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    pvCtx=new AC(); pvSrc=pvCtx.createMediaElementSource(pvAudio);
    pvNormGain=pvCtx.createGain(); pvGain=pvCtx.createGain();
    pvNormGain.connect(pvGain); pvGain.connect(pvCtx.destination); pvBuildGraph();
  }
  // BS.1770 gated integrated loudness of an (already K-weighted) rendered buffer.
  function integratedLUFS(buf){
    const chs=[]; for(let c=0;c<buf.numberOfChannels;c++) chs.push(buf.getChannelData(c));
    const sr=buf.sampleRate, block=Math.round(0.4*sr), hop=Math.round(0.1*sr), G=[1,1,1,1.41,1.41];
    const toL=z=>-0.691+10*Math.log10(z+1e-12);
    const meanL=arr=>{ let s=0; arr.forEach(z=>s+=z); return toL(s/arr.length); };
    const blocks=[];
    for(let st=0; st+block<=chs[0].length; st+=hop){
      let z=0;
      for(let c=0;c<chs.length;c++){ let s=0; const d=chs[c]; for(let i=0;i<block;i++){ const v=d[st+i]; s+=v*v; } z+=(G[c]||1)*(s/block); }
      blocks.push(z);
    }
    if(!blocks.length) return -70;
    let g1=blocks.filter(z=>toL(z)>-70); if(!g1.length) return -70;   // absolute gate
    const rel=meanL(g1)-10;                                           // relative gate
    const g2=g1.filter(z=>toL(z)>rel);
    return meanL(g2.length?g2:g1);
  }
  async function pvMeasureGain(){
    if(!pvCtx || !pvItem || !pvNormGain || !pvNorm) return;
    const tok=++pvMeasureTok, item=pvItem;
    try{ if(!item._pvBuf){ const ab=await item.file.arrayBuffer(); item._pvBuf=await pvCtx.decodeAudioData(ab); } }
    catch(_){ item._pvBuf=null; }
    if(tok!==pvMeasureTok) return;
    const buf=item._pvBuf; if(!buf) return;
    const sr=buf.sampleRate, nCh=buf.numberOfChannels, len=Math.min(buf.length, Math.floor(30*sr));
    let off; try{ off=new OfflineAudioContext(nCh, len, sr); }catch(_){ return; }
    const slice=off.createBuffer(nCh,len,sr);
    for(let c=0;c<nCh;c++) slice.copyToChannel(buf.getChannelData(c).subarray(0,len),c);
    const src=off.createBufferSource(); src.buffer=slice;
    let end=src; const desc=PV_CHAIN[settings.preset]||PV_CHAIN.none;
    if(pvMode==='master') desc.nodes.forEach(spec=>{ const n=pvMakeNode(off,spec); end.connect(n); end=n; });
    const sh=off.createBiquadFilter(); sh.type='highshelf'; sh.frequency.value=1500; sh.gain.value=4; end.connect(sh);
    const hp=off.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=38; hp.Q.value=0.5; sh.connect(hp);
    hp.connect(off.destination); src.start();
    let rendered; try{ rendered=await off.startRendering(); }catch(_){ return; }
    if(tok!==pvMeasureTok) return;
    const measured=integratedLUFS(rendered);
    let gdb=parseFloat(settings.lufs)-measured; gdb=Math.max(-24,Math.min(24,gdb));
    pvNormGain.gain.setTargetAtTime(Math.pow(10,gdb/20), pvCtx.currentTime, 0.06);
  }
  function pvIcon(playing){ el('pvIco').innerHTML = playing
    ? '<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>'
    : '<path d="M8 5v14l11-7z"/>'; }
  function renderPreviewFiles(){
    const sel=el('pvFileSel'); if(!sel) return; sel.innerHTML='';
    if(!items.length){ const o=document.createElement('option'); o.value=''; o.textContent=t.prevHint; sel.appendChild(o); sel.disabled=true; return; }
    sel.disabled=false;
    items.forEach((it,i)=>{ const o=document.createElement('option'); o.value=String(i); o.textContent=it.name; sel.appendChild(o); });
    const idx=items.indexOf(pvItem); sel.value = idx>=0 ? String(idx) : '0';
  }
  function pvSetFile(item, keepPlaying){
    const wasPlaying = keepPlaying && pvItem && !pvAudio.paused;
    pvItem=item||null;
    if(pvUrl){ URL.revokeObjectURL(pvUrl); pvUrl=null; }
    el('pvFill').style.width='0%';
    if(pvItem){
      pvUrl=URL.createObjectURL(pvItem.file); pvAudio.src=pvUrl; el('pvPlay').disabled=false;
      if(wasPlaying){ pvAudio.play().then(()=>{pvIcon(true);pvTrack();}).catch(()=>{}); }
      else { try{ pvAudio.pause(); }catch(_){} pvIcon(false); }
      if(pvCtx) pvBuildGraph();   // re-measure loudness for the new file
    } else {
      try{ pvAudio.pause(); }catch(_){} pvIcon(false);
      pvAudio.removeAttribute('src'); el('pvPlay').disabled=true;
    }
  }
  function refreshPreviewSource(){
    if(items.length){ if(!pvItem || items.indexOf(pvItem)<0) pvSetFile(items[0]); }
    else pvSetFile(null);
    renderPreviewFiles();
  }
  function pvTrack(){ if(pvRAF) cancelAnimationFrame(pvRAF);
    const step=()=>{ if(pvAudio.duration) el('pvFill').style.width=(pvAudio.currentTime/pvAudio.duration*100).toFixed(1)+'%';
      if(!pvAudio.paused) pvRAF=requestAnimationFrame(step); }; step(); }
  async function pvToggle(){
    if(!pvItem) return; pvEnsure();
    if(pvCtx && pvCtx.state==='suspended'){ try{ await pvCtx.resume(); }catch(_){} }
    if(pvAudio.paused){ try{ await pvAudio.play(); pvIcon(true); pvTrack(); }catch(_){} }
    else { pvAudio.pause(); pvIcon(false); }
  }

  // ================= wire up =================
  el('chooseBtn').addEventListener('click',()=>el('fileInput').click());
  el('drop').addEventListener('click',e=>{ if(e.target.closest('#chooseBtn')) return; el('fileInput').click(); });
  el('fileInput').addEventListener('change',e=>{ acceptFiles(e.target.files); e.target.value=''; });
  ['dragenter','dragover'].forEach(ev=>el('drop').addEventListener(ev,e=>{ e.preventDefault(); el('drop').classList.add('over'); }));
  ['dragleave','drop'].forEach(ev=>el('drop').addEventListener(ev,e=>{ e.preventDefault(); el('drop').classList.remove('over'); }));
  el('drop').addEventListener('drop',e=>acceptFiles(e.dataTransfer.files));
  el('clearBtn').addEventListener('click',showConfirmClear);

  el('clipSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
    [...el('clipSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); settings.clip=+b.dataset.len; });
  el('startSel').addEventListener('change',e=>{ settings.start=e.target.value; highlightWave(); });
  el('lufsSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
    [...el('lufsSeg').children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); settings.lufs=b.dataset.lufs;
    el('recNote').style.visibility = (b.dataset.lufs==='-14')?'visible':'hidden';
    if(pvCtx) pvMeasureGain(); });
  function selectPreset(name){
    settings.preset=name;
    [...el('masterSeg').children].forEach(x=>x.classList.toggle('on',x.dataset.preset===name));
    el('origToggle').classList.toggle('on',name==='none');
    pvBuildGraph();   // live-update the running preview to the new preset
  }
  el('masterSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) selectPreset(b.dataset.preset); });
  el('origToggle').addEventListener('click',()=>selectPreset('none'));
  el('pvPlay').addEventListener('click',pvToggle);
  el('abToggle').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
    pvMode=b.dataset.ab; [...el('abToggle').children].forEach(x=>x.classList.toggle('on',x===b)); pvBuildGraph(); });
  el('pvFileSel').addEventListener('change',e=>{ const it=items[+e.target.value]; if(it) pvSetFile(it,true); });
  el('pvNormBtn').addEventListener('click',()=>{
    pvNorm=!pvNorm;
    el('pvNormBtn').classList.toggle('on',pvNorm);
    el('pvNormBtn').setAttribute('aria-checked', pvNorm?'true':'false');
    if(pvCtx){ if(pvNorm) pvMeasureGain(); else pvNormGain.gain.setTargetAtTime(1, pvCtx.currentTime, 0.06); }
  });
  pvAudio.addEventListener('pause',()=>pvIcon(false));
  pvAudio.addEventListener('play',()=>pvIcon(true));
  el('fmtSel').addEventListener('change',e=>{ settings.fmt=e.target.value; el('brSel').disabled=((FMT[e.target.value]||FMT.mp3).args.length===0); });
  el('brSel').addEventListener('change',e=>settings.br=e.target.value);
  el('nameMode').addEventListener('change',e=>{ settings.nameMode=e.target.value; el('suffixInput').disabled=(e.target.value==='keep'); });
  el('suffixInput').addEventListener('input',e=>settings.suffix=e.target.value);

  el('startBtn').addEventListener('click',run);
  el('dlAll').addEventListener('click',downloadZip);
  el('restartBtn').addEventListener('click',showConfirmClear);

  el('helpBtn').addEventListener('click',()=>el('helpOverlay').classList.add('show'));
  el('helpClose').addEventListener('click',()=>el('helpOverlay').classList.remove('show'));
  el('helpOverlay').addEventListener('click',e=>{ if(e.target===el('helpOverlay')) el('helpOverlay').classList.remove('show'); });

  // ---- clear-all confirmation ----
  function showConfirmClear(){ el('confirmOverlay').classList.add('show'); }
  function hideConfirmClear(){ el('confirmOverlay').classList.remove('show'); }
  el('confirmYes').addEventListener('click',()=>{ hideConfirmClear(); clearAll(); });
  el('confirmNo').addEventListener('click',hideConfirmClear);
  el('confirmOverlay').addEventListener('click',e=>{ if(e.target===el('confirmOverlay')) hideConfirmClear(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape' && el('confirmOverlay').classList.contains('show')) hideConfirmClear(); });

  el('langBtn').addEventListener('click',()=>applyLang(lang==='he'?'en':'he'));
  el('themeToggle').addEventListener('click',()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));

  // init
  let savedTheme='light'; try{ savedTheme=localStorage.getItem('theme')||'light'; }catch(_){}
  applyTheme(savedTheme);
  buildWave();
  applyLang('he');
  loadEngine();
})();
</script>
