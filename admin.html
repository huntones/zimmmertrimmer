<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>KOLKLI — Admin Center</title>
<link rel="canonical" href="https://kolkli.com/admin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300..800&family=Overpass:wght@300..800&family=Rubik:wght@300..900&display=swap" rel="stylesheet">
<meta name="description" content="KOLKLI Admin Center — the control room for the whole platform.">
<style>
  :root {
    --bg:#eef0f6; --panel:#ffffff; --panel-2:#f5f6fa; --panel-3:#eef0f6;
    --line:#e5e8f0; --line-2:#eef0f6;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#7c3aed; --accent-dim:#6a2fe0; --accent-ink:#ffffff; --accent-soft:#efe9fe;
    --success:#22b04b; --success-dim:#1c9a41; --success-soft:#e6f6ec;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --warn:#e08c12; --warn-dim:#c67a09; --warn-soft:#fdf1dc;
    --danger:#e5484d; --danger-dim:#cf3238; --danger-soft:#fdecec;
    --violet:#8b5cf6; --violet-soft:#f0eafe;
    --grad:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-h:linear-gradient(105deg,#6a29e6 0%,#2f74f0 100%);
    --grad-soft:linear-gradient(120deg,#efe9fe,#e6f0ff);
    --grad-shadow:rgba(93,79,240,0.30);
    --grad-btn:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn-glow:rgba(59,111,246,0.38);
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-lg:0 2px 6px rgba(20,24,44,0.05), 0 20px 50px rgba(20,24,44,0.10);
    --shadow-sm:0 1px 2px rgba(20,24,44,0.05);
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --sans:'Overpass','Rubik',system-ui,'Segoe UI',sans-serif;
    --sidew:266px;
    --toph:62px;
  }
  html[data-theme="dark"] {
    --bg:#0b0d12; --panel:#151922; --panel-2:#1b202a; --panel-3:#20262f;
    --line:#2a303c; --line-2:#222833;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --accent:#a06bff; --accent-dim:#8f52ff; --accent-ink:#ffffff; --accent-soft:#241a3a;
    --success:#37c26a; --success-dim:#2fae5e; --success-soft:#122a1b;
    --info:#5b95f8; --info-dim:#4f8ef7; --info-soft:#152238;
    --warn:#e9a63a; --warn-dim:#d8942a; --warn-soft:#2c2314;
    --danger:#ff6b6b; --danger-dim:#f5545b; --danger-soft:#2a1719;
    --violet:#a78bfa; --violet-soft:#221a3a;
    --grad:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-h:linear-gradient(105deg,#9a63ff 0%,#6aa2ff 100%);
    --grad-soft:linear-gradient(120deg,#1c1633,#11212e);
    --grad-shadow:rgba(77,123,255,0.42);
    --grad-btn:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn-glow:rgba(77,123,255,0.45);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,0.45), 0 24px 60px rgba(0,0,0,0.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;overflow:hidden;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--sans);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:2px solid var(--panel);}
  ::-webkit-scrollbar-thumb:hover{background:var(--faint);}

  /* ======================= app shell ======================= */
  .ac-shell{display:grid;grid-template-columns:var(--sidew) 1fr;height:100vh;height:100dvh;transition:grid-template-columns .18s ease;}
  body.collapsed{--sidew:76px;}

  /* --------- sidebar --------- */
  .ac-side{background:var(--panel);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;
    min-height:0;position:relative;z-index:40;}
  html[dir="ltr"] .ac-side{border-inline-start:none;border-inline-end:1px solid var(--line);}
  .ac-brand{display:flex;align-items:center;gap:11px;padding:16px 18px;height:var(--toph);flex-shrink:0;
    border-bottom:1px solid var(--line);}
  .ac-brand .logo{width:36px;height:36px;flex-shrink:0;border-radius:11px;display:flex;align-items:center;justify-content:center;
    background:var(--grad);color:#fff;font-size:18px;font-weight:800;box-shadow:0 5px 14px var(--grad-shadow);}
  .ac-brand .bx{min-width:0;line-height:1.15;}
  .ac-brand .bx b{font-size:15px;font-weight:800;letter-spacing:-0.01em;display:block;}
  .ac-brand .bx small{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-dim);font-weight:700;}
  body.collapsed .ac-brand .bx{display:none;}
  body.collapsed .ac-brand{justify-content:center;padding:16px 0;}

  .ac-nav{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px 12px 24px;}
  .ac-grp{margin-top:14px;}
  .ac-grp:first-child{margin-top:2px;}
  .ac-grp-h{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);
    font-weight:700;padding:6px 12px 7px;white-space:nowrap;}
  body.collapsed .ac-grp-h{text-align:center;padding:6px 0 7px;font-size:8px;opacity:.7;}
  .ac-item{display:flex;align-items:center;gap:11px;width:100%;border:none;background:none;cursor:pointer;
    color:var(--ink-2);font-family:var(--sans);font-size:13.5px;font-weight:600;text-align:start;
    padding:9px 12px;border-radius:11px;margin-bottom:2px;position:relative;transition:background .12s,color .12s;white-space:nowrap;}
  .ac-item:hover{background:var(--panel-2);color:var(--ink);}
  .ac-item .ic{width:19px;height:19px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .ac-item .ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .ac-item .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;}
  .ac-item .bdg{font-family:var(--mono);font-size:10px;font-weight:800;color:var(--accent-dim);background:var(--accent-soft);
    border-radius:999px;padding:1px 7px;flex-shrink:0;}
  .ac-item .bdg.soon{color:var(--faint);background:var(--panel-3);}
  .ac-item.on{color:#fff;background:var(--grad);box-shadow:0 6px 16px var(--grad-shadow);}
  .ac-item.on .bdg{color:#fff;background:rgba(255,255,255,.22);}
  body.collapsed .ac-item{justify-content:center;padding:11px 0;}
  body.collapsed .ac-item .lb,body.collapsed .ac-item .bdg{display:none;}
  body.collapsed .ac-item::after{content:attr(data-tip);position:absolute;inset-inline-start:calc(100% + 8px);top:50%;
    transform:translateY(-50%);background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;
    white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:60;box-shadow:var(--shadow);}
  html[dir="rtl"] body.collapsed .ac-item::after{inset-inline-start:auto;inset-inline-end:calc(100% + 8px);}
  body.collapsed .ac-item:hover::after{opacity:1;}

  /* --------- main column --------- */
  .ac-main{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg);position:relative;}
  .ac-main::before{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(48% 34% at 100% 0%,rgba(124,58,237,0.07),transparent 60%),
      radial-gradient(44% 32% at 0% 0%,rgba(59,111,246,0.06),transparent 60%);}
  .ac-top{height:var(--toph);flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 20px;
    background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;}
  .ac-scroll{flex:1;min-height:0;overflow-y:auto;position:relative;z-index:1;}
  .ac-page{padding:24px 26px 72px;max-width:1500px;margin:0 auto;}

  .tbtn{width:38px;height:38px;flex-shrink:0;border:1px solid var(--line);background:var(--panel);border-radius:11px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--ink-2);transition:border-color .12s,background .12s;box-shadow:var(--shadow-sm);}
  .tbtn:hover{border-color:var(--accent);color:var(--accent);}
  .tbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .ac-crumb{display:flex;flex-direction:column;line-height:1.2;min-width:0;}
  .ac-crumb b{font-size:15.5px;font-weight:800;letter-spacing:-0.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ac-crumb small{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.05em;}
  .ac-sp{flex:1;}
  .gsearch{position:relative;display:flex;align-items:center;width:min(320px,32vw);}
  .gsearch svg{position:absolute;inset-inline-start:12px;width:16px;height:16px;color:var(--faint);
    stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;}
  .gsearch input{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:11px;
    font-family:var(--sans);font-size:13px;padding:9px 14px;padding-inline-start:36px;transition:border-color .12s,box-shadow .12s;}
  .gsearch input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .ac-avatar{width:38px;height:38px;flex-shrink:0;border-radius:11px;display:flex;align-items:center;justify-content:center;
    background:var(--grad);color:#fff;font-size:15px;font-weight:800;box-shadow:0 4px 12px var(--grad-shadow);cursor:pointer;}
  @media (max-width:1080px){ .gsearch{width:180px;} .ac-crumb small{display:none;} }
  @media (max-width:720px){ .gsearch{display:none;} }

  /* ======================= UI KIT ======================= */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);}
  .card + .card{margin-top:16px;}
  .card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
  .card-h.tight{margin-bottom:12px;}
  .card-h h2{font-size:16px;font-weight:800;margin:0 0 3px;letter-spacing:-0.01em;}
  .card-h .sub{font-size:12.5px;color:var(--muted);margin:0;}
  .card-h .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .sec-h{display:flex;align-items:center;gap:14px;margin:0 0 20px;flex-wrap:wrap;}
  .sec-h .ico{width:46px;height:46px;flex-shrink:0;border-radius:14px;display:flex;align-items:center;justify-content:center;
    background:var(--grad-soft);color:var(--accent-dim);}
  .sec-h .ico svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .sec-h h1{font-size:clamp(20px,2.6vw,25px);font-weight:800;letter-spacing:-0.02em;margin:0 0 2px;}
  .sec-h p{font-size:13px;color:var(--muted);margin:0;}
  .sec-h .r{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

  .grid{display:grid;gap:16px;}
  .g-2{grid-template-columns:repeat(2,1fr);}
  .g-3{grid-template-columns:repeat(3,1fr);}
  .g-4{grid-template-columns:repeat(4,1fr);}
  @media (max-width:1080px){ .g-4{grid-template-columns:repeat(2,1fr);} .g-3{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:640px){ .g-2,.g-3,.g-4{grid-template-columns:1fr;} }

  /* KPI */
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 17px;box-shadow:var(--shadow-sm);
    position:relative;overflow:hidden;}
  .kpi-top{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
  .kpi-ic{width:34px;height:34px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);color:var(--accent);}
  .kpi-ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .kpi.hl .kpi-ic{background:var(--grad);color:#fff;box-shadow:0 4px 12px var(--grad-shadow);}
  .kpi-lb{font-size:12px;font-weight:600;color:var(--muted);line-height:1.2;}
  .kpi-val{font-size:26px;font-weight:800;letter-spacing:-0.02em;line-height:1;}
  .kpi-foot{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11.5px;font-weight:700;color:var(--muted);}
  .delta{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;}
  .delta.up{color:var(--success-dim);background:var(--success-soft);}
  .delta.down{color:var(--danger-dim);background:var(--danger-soft);}
  .delta svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}

  /* pills / badges */
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .pill svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .pill.dot::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
  .p-green{color:var(--success-dim);background:var(--success-soft);}
  .p-blue{color:var(--info-dim);background:var(--info-soft);}
  .p-amber{color:var(--warn-dim);background:var(--warn-soft);}
  .p-red{color:var(--danger-dim);background:var(--danger-soft);}
  .p-violet{color:var(--accent-dim);background:var(--accent-soft);}
  .p-grey{color:var(--muted);background:var(--panel-3);}

  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;font-family:var(--sans);
    font-weight:700;font-size:13px;padding:9px 15px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);
    transition:filter .14s,transform .08s,border-color .12s,background .12s;box-shadow:var(--shadow-sm);}
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .btn.sm{padding:6px 11px;font-size:12px;border-radius:9px;}
  .btn.primary{color:#fff;border:none;text-shadow:0 1px 2px rgba(0,0,0,.18);
    background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--grad-btn);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 16px var(--grad-btn-glow);}
  .btn.primary:hover{filter:brightness(1.06);color:#fff;}
  .btn.danger{color:var(--danger);border-color:var(--danger);}
  .btn.danger:hover{background:var(--danger-soft);color:var(--danger);}
  .btn.ghost{background:transparent;box-shadow:none;}
  .icon-btn{width:34px;height:34px;padding:0;border-radius:9px;flex-shrink:0;}
  .icon-btn svg{width:16px;height:16px;}

  /* segmented + toggle */
  .seg{display:inline-flex;gap:3px;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:3px;}
  .seg button{border:none;background:none;color:var(--muted);cursor:pointer;font-family:var(--sans);font-size:12.5px;font-weight:700;
    padding:6px 13px;border-radius:8px;transition:color .12s,background .12s,box-shadow .12s;white-space:nowrap;}
  .seg button.on{background:var(--panel);color:var(--accent-dim);box-shadow:var(--shadow-sm);}
  .sw{position:relative;width:44px;height:25px;flex-shrink:0;border-radius:999px;background:var(--line);border:none;cursor:pointer;transition:background .16s;}
  .sw::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:19px;height:19px;border-radius:50%;background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .16s;}
  .sw.on{background:var(--accent);}
  html[dir="ltr"] .sw.on::after{transform:translateX(19px);}
  html[dir="rtl"] .sw.on::after{transform:translateX(-19px);}
  .sw:disabled{opacity:.5;cursor:not-allowed;}

  /* forms */
  .fld{display:block;margin-bottom:14px;}
  .fld > span{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px;}
  .in,.sel,.ta{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:11px;
    font-family:var(--sans);font-size:13.5px;padding:10px 13px;transition:border-color .12s,box-shadow .12s;}
  .ta{min-height:88px;resize:vertical;}
  .in:focus,.sel:focus,.ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}

  /* tables */
  .tbl-wrap{overflow-x:auto;margin:0 -4px;}
  table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;}
  table.tbl th{text-align:start;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;
    color:var(--faint);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
  table.tbl td{padding:12px;border-bottom:1px solid var(--line-2);color:var(--ink-2);vertical-align:middle;}
  table.tbl tbody tr{transition:background .1s;}
  table.tbl tbody tr:hover{background:var(--panel-2);}
  table.tbl tr:last-child td{border-bottom:none;}
  .u-cell{display:flex;align-items:center;gap:11px;min-width:0;}
  .u-av{width:36px;height:36px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center;
    background:var(--grad-soft);color:var(--accent-dim);font-size:14px;font-weight:800;}
  .u-meta{min-width:0;}
  .u-name{font-size:13.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .u-email{font-family:var(--mono);font-size:11px;color:var(--muted);direction:ltr;text-align:start;
    overflow:hidden;text-overflow:ellipsis;max-width:220px;white-space:nowrap;}
  .youtag{font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    color:var(--info-dim);background:var(--info-soft);border:1px solid var(--info);border-radius:5px;padding:1px 5px;}
  .mono{font-family:var(--mono);font-size:11.5px;color:var(--muted);direction:ltr;}

  /* mini menu (row actions) */
  .menu{position:relative;}
  .menu-pop{position:absolute;inset-inline-end:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);
    border-radius:13px;box-shadow:var(--shadow-lg);padding:6px;min-width:190px;z-index:50;display:none;}
  .menu-pop.open{display:block;}
  .menu-pop button{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;cursor:pointer;
    color:var(--ink-2);font-family:var(--sans);font-size:13px;font-weight:600;text-align:start;padding:8px 10px;border-radius:9px;}
  .menu-pop button:hover{background:var(--panel-2);color:var(--ink);}
  .menu-pop button.danger{color:var(--danger);}
  .menu-pop button.danger:hover{background:var(--danger-soft);}
  .menu-pop button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  .menu-pop hr{border:none;border-top:1px solid var(--line-2);margin:5px 2px;}

  /* charts */
  .chart{width:100%;display:block;}
  .chart-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;}
  .chart-legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);}
  .chart-legend i{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .barrow{display:flex;align-items:center;gap:12px;margin-bottom:11px;}
  .barrow .bl{width:120px;flex-shrink:0;font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .barrow .bt{flex:1;height:9px;border-radius:5px;background:var(--panel-3);overflow:hidden;}
  .barrow .bt i{display:block;height:100%;border-radius:5px;background:var(--grad);}
  .barrow .bv{width:64px;flex-shrink:0;text-align:end;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink);}

  /* live feed */
  .feed{display:flex;flex-direction:column;gap:2px;}
  .feed-i{display:flex;align-items:flex-start;gap:11px;padding:10px 8px;border-radius:11px;transition:background .1s;}
  .feed-i:hover{background:var(--panel-2);}
  .feed-ic{width:32px;height:32px;flex-shrink:0;border-radius:9px;display:flex;align-items:center;justify-content:center;}
  .feed-ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .feed-tx{min-width:0;flex:1;}
  .feed-tx b{font-size:13px;font-weight:700;color:var(--ink);}
  .feed-tx p{margin:1px 0 0;font-size:12.5px;color:var(--muted);}
  .feed-tx .tm{font-family:var(--mono);font-size:10.5px;color:var(--faint);}

  /* drawer / sheet */
  .ov{position:fixed;inset:0;background:rgba(10,12,20,.5);backdrop-filter:blur(2px);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;}
  .ov.show{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(520px,100vw);background:var(--panel);z-index:95;
    box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease;}
  html[dir="rtl"] .drawer{transform:translateX(-100%);}
  .drawer.show{transform:translateX(0)!important;}
  .drawer-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-shrink:0;}
  .drawer-h h3{font-size:16px;font-weight:800;margin:0;flex:1;min-width:0;}
  .drawer-b{flex:1;min-height:0;overflow-y:auto;padding:20px;}
  .drawer-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;flex-shrink:0;flex-wrap:wrap;}
  .x{width:34px;height:34px;border:1px solid var(--line);background:var(--panel);border-radius:9px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;}
  .x:hover{border-color:var(--danger);color:var(--danger);}
  .x svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}

  /* modal */
  .modal{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);
    width:min(480px,100%);max-height:90vh;overflow:auto;padding:24px;}
  .modal .box h3{font-size:18px;font-weight:800;margin:0 0 6px;}
  .modal .box p.md{font-size:13.5px;color:var(--muted);margin:0 0 18px;}

  /* def list */
  .dl{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:13px;}
  .dl dt{color:var(--muted);font-weight:600;white-space:nowrap;}
  .dl dd{margin:0;color:var(--ink);font-weight:600;text-align:end;overflow-wrap:anywhere;}
  .prof-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
  .prof-head .pa{width:58px;height:58px;flex-shrink:0;border-radius:16px;display:flex;align-items:center;justify-content:center;
    background:var(--grad);color:#fff;font-size:24px;font-weight:800;box-shadow:0 6px 16px var(--grad-shadow);}
  .prof-head b{font-size:18px;font-weight:800;display:block;}
  .prof-head .pe{font-family:var(--mono);font-size:12px;color:var(--muted);direction:ltr;}
  .prof-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto;}
  .prof-tabs button{border:none;background:none;cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:700;color:var(--muted);
    padding:9px 12px;border-bottom:2px solid transparent;white-space:nowrap;}
  .prof-tabs button.on{color:var(--accent-dim);border-bottom-color:var(--accent);}

  /* module scaffold */
  .backend-note{display:flex;align-items:flex-start;gap:12px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);
    border-radius:14px;padding:14px 16px;margin-bottom:18px;}
  .backend-note .bn-ic{width:34px;height:34px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center;
    background:var(--warn);color:#fff;}
  .backend-note .bn-ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .backend-note b{font-size:13.5px;color:var(--ink);}
  .backend-note p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2);}
  .feat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
  .feat{display:flex;align-items:flex-start;gap:11px;background:var(--panel-2);border:1px solid var(--line);border-radius:13px;padding:13px 14px;}
  .feat .fi{width:32px;height:32px;flex-shrink:0;border-radius:9px;display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);color:var(--accent);}
  .feat .fi svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .feat b{font-size:13px;font-weight:700;color:var(--ink);display:block;}
  .feat span{font-size:12px;color:var(--muted);}

  /* empty */
  .empty{text-align:center;padding:44px 20px;}
  .empty .ei{width:64px;height:64px;margin:0 auto 15px;border-radius:18px;display:flex;align-items:center;justify-content:center;
    background:var(--grad-soft);color:var(--accent);}
  .empty .ei svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .empty h3{margin:0 0 6px;font-size:16px;}
  .empty p{margin:0 auto;font-size:13px;color:var(--muted);max-width:44ch;}

  /* toast */
  #toaster{position:fixed;inset-block-end:22px;inset-inline-end:22px;z-index:120;display:flex;flex-direction:column;gap:10px;pointer-events:none;}
  .toast{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);border-radius:13px;
    box-shadow:var(--shadow-lg);padding:12px 16px;font-size:13.5px;font-weight:600;color:var(--ink);min-width:250px;max-width:380px;
    transform:translateY(12px);opacity:0;transition:transform .2s,opacity .2s;pointer-events:auto;}
  .toast.show{transform:translateY(0);opacity:1;}
  .toast .ti{width:28px;height:28px;flex-shrink:0;border-radius:8px;display:flex;align-items:center;justify-content:center;}
  .toast .ti svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;}
  .toast.ok .ti{background:var(--success-soft);color:var(--success-dim);}
  .toast.info .ti{background:var(--info-soft);color:var(--info-dim);}
  .toast.warn .ti{background:var(--warn-soft);color:var(--warn-dim);}
  .toast.err .ti{background:var(--danger-soft);color:var(--danger-dim);}

  /* deny */
  .deny{max-width:520px;margin:9vh auto;text-align:center;padding:20px;}
  .deny .di{width:78px;height:78px;margin:0 auto 20px;border-radius:22px;display:flex;align-items:center;justify-content:center;
    background:var(--danger-soft);color:var(--danger);}
  .deny .di svg{width:38px;height:38px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .deny h2{margin:0 0 8px;font-size:22px;font-weight:800;}
  .deny p{margin:0 auto 24px;font-size:14px;color:var(--muted);max-width:42ch;}
  .deny .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

  /* mobile off-canvas */
  .scrim{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:39;opacity:0;pointer-events:none;transition:opacity .18s;}
  @media (max-width:920px){
    .ac-shell{grid-template-columns:1fr;}
    .ac-side{position:fixed;inset-block:0;inset-inline-end:0;width:280px;transform:translateX(100%);transition:transform .2s ease;
      border-inline-start:1px solid var(--line);box-shadow:var(--shadow-lg);}
    html[dir="ltr"] .ac-side{inset-inline-start:0;inset-inline-end:auto;transform:translateX(-100%);}
    body.side-open .ac-side{transform:translateX(0);}
    body.side-open .scrim{opacity:1;pointer-events:auto;}
    body.collapsed{--sidew:266px;}
    body.collapsed .ac-item{justify-content:flex-start;padding:9px 12px;}
    body.collapsed .ac-item .lb,body.collapsed .ac-item .bdg{display:block;}
    body.collapsed .ac-brand .bx{display:block;}
  }
  .hide{display:none!important;}
</style>
</head>
<body>
  <div class="scrim" id="scrim"></div>
  <div class="ac-shell" id="shell">
    <aside class="ac-side" id="side">
      <div class="ac-brand">
        <div class="logo">K</div>
        <div class="bx"><b>KOLKLI</b><small>Admin Center</small></div>
      </div>
      <nav class="ac-nav" id="acNav"></nav>
    </aside>
    <div class="ac-main">
      <header class="ac-top">
        <button class="tbtn" id="menuBtn" aria-label="menu"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <div class="ac-crumb"><b id="crumbT">—</b><small id="crumbS"></small></div>
        <div class="ac-sp"></div>
        <label class="gsearch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="topSearch" type="text" placeholder="חיפוש גלובלי…" autocomplete="off"></label>
        <button class="tbtn" id="langBtn" aria-label="language"><span id="langIco" style="font-size:13px;font-weight:800;font-family:var(--mono)">EN</span></button>
        <button class="tbtn" id="themeBtn" aria-label="theme"><span id="themeIco" style="font-size:16px">🌙</span></button>
        <div class="ac-avatar" id="topAv" title="admin">A</div>
      </header>
      <div class="ac-scroll" id="scroll">
        <div class="ac-page" id="page"></div>
      </div>
    </div>
  </div>
  <div id="toaster"></div>

  <script src="./admin-core.js"></script>
  <script src="./admin-sections.js"></script>
  <script>
    (function(){
      if (window.KAdmin && KAdmin.boot) KAdmin.boot();
    })();
  </script>
</body>
</html>
