<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOLKLI — מנקה HTML</title>
<meta name="description" content="Free online HTML cleaner — strip tags, inline styles, classes, IDs and data-attributes, remove comments, scripts and empty tags, and clean messy Microsoft Word / Google Docs markup in one click. Paste, clean and copy. Fast, private, right in your browser.">
<style>
  :root {
    --bg:#eef0f6; --panel:#ffffff; --panel-2:#f5f6fa; --line:#e5e8f0; --line-2:#eef0f6;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#7c3aed; --accent-dim:#6a2fe0; --accent-ink:#ffffff; --accent-soft:#efe9fe;
    --success:#22b04b; --success-dim:#1c9a41; --success-soft:#e6f6ec;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --danger:#e5484d; --danger-soft:#fdecec;
    --warm-soft:#fff5da; --warm-line:#f2d98a;
    --ok:#22b04b; --warn:#c88a04; --err:#e5484d;
    --grad:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn-glow:rgba(59,111,246,0.38);
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-lg:0 2px 6px rgba(20,24,44,0.05), 0 20px 50px rgba(20,24,44,0.10);
    --shadow-sm:0 1px 2px rgba(20,24,44,0.05);
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --sans:'Space Grotesk',system-ui,'Segoe UI','Heebo',sans-serif;
  }
  html[data-theme="dark"] {
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a303c; --line-2:#232833;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --accent:#a06bff; --accent-dim:#7c3aed; --accent-ink:#ffffff; --accent-soft:#241a3a;
    --success:#37c26a; --success-dim:#2fae5e; --success-soft:#132a1c;
    --info:#5b95f8; --info-dim:#4f8ef7; --info-soft:#182338;
    --danger:#ff6b6b; --danger-soft:#2a1719;
    --warm-soft:#2c2718; --warm-line:#5a4d24;
    --ok:#4ec98a; --warn:#e8b84b; --err:#ff6b6b;
    --grad:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn-glow:rgba(77,123,255,0.45);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,0.45), 0 24px 60px rgba(0,0,0,0.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;}
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:var(--grad);z-index:100;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--sans);}
  .wrap{max-width:1040px;margin:0 auto;padding:26px 20px 64px;}

  /* page intro */
  .pagehead{margin:4px 0 22px;}
  .pagehead h1{font-size:clamp(23px,3vw,32px);font-weight:700;letter-spacing:-0.02em;margin:0 0 8px;}
  .pagehead .kick{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);
    padding:4px 11px;border-radius:999px;margin-bottom:12px;}
  .pagehead p{font-size:14.5px;color:var(--muted);margin:0;max-width:70ch;}

  /* reused helpers (from box-shadow.html / color-convert.html) */
  .gbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--ink-2);font-size:13px;font-weight:600;padding:10px 12px;border-radius:11px;
    cursor:pointer;transition:all .12s;}
  .gbtn:hover{border-color:var(--accent);color:var(--accent-dim);background:var(--accent-soft);}
  .gbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .gbtn.hidden{display:none;}
  .copybtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);
    color:var(--muted);font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:9px;cursor:pointer;transition:all .12s;}
  .copybtn:hover{border-color:var(--accent);color:var(--accent-dim);background:var(--accent-soft);}
  .copybtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .fstr{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ink);background:var(--panel-2);
    border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;margin-bottom:12px;overflow-x:auto;white-space:nowrap;
    direction:ltr;text-align:start;}
  .numwrap{display:inline-flex;align-items:center;gap:5px;direction:ltr;}
  .numin{width:58px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:9px;
    font-family:var(--mono);font-size:13px;font-weight:600;text-align:center;padding:6px 4px;transition:border-color .12s,box-shadow .12s;}
  .numin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .numin::-webkit-outer-spin-button,.numin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .unit{font-family:var(--mono);font-size:12px;color:var(--faint);}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);}
  .cardtitle{font-size:13px;font-weight:800;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;margin-bottom:14px;}

  /* ---- html-cleaner tool ---- */
  .optcard{padding:18px;margin-bottom:18px;}
  .optgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 20px;margin-bottom:16px;}
  .optrow{display:flex;align-items:flex-start;gap:9px;cursor:pointer;font-size:13px;color:var(--ink-2);line-height:1.35;
    user-select:none;}
  .optrow input{margin:0;margin-top:1px;flex-shrink:0;width:16px;height:16px;accent-color:var(--accent);cursor:pointer;}
  .presets{display:flex;flex-wrap:wrap;gap:9px;padding-top:16px;border-top:1px solid var(--line);}
  .presets .gbtn{flex:0 0 auto;}

  .io{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;}
  @media (max-width:820px){ .io{grid-template-columns:1fr;} }
  .iocard{padding:18px;display:flex;flex-direction:column;}
  .iohead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;min-height:26px;}
  .iohead .cardtitle{margin-bottom:0;}
  .ioactions{display:flex;gap:8px;flex-shrink:0;}
  .codearea{width:100%;min-height:300px;resize:vertical;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    border-radius:12px;font-family:var(--mono);font-size:12.5px;line-height:1.55;padding:12px 13px;
    direction:ltr;text-align:start;unicode-bidi:isolate;transition:border-color .12s,box-shadow .12s;}
  .codearea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .codearea::placeholder{color:var(--faint);}

  .statstrip{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;}
  .statbox{flex:1;min-width:130px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow-sm);padding:13px 16px;}
  .statlabel{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
  .statval{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--ink);
    direction:ltr;unicode-bidi:isolate;text-align:start;}
  .statval.accent{color:var(--accent-dim);}

  .note{display:flex;align-items:flex-start;gap:9px;margin-top:18px;padding:12px 14px;border-radius:12px;
    background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);
    font-size:12px;color:var(--ink-2);line-height:1.55;}
  .note svg{width:16px;height:16px;color:var(--accent-dim);flex-shrink:0;margin-top:1px;
    stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  footer{margin-top:34px;text-align:center;color:var(--faint);font-size:12px;font-family:var(--mono);}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:11px 18px;border-radius:999px;
    box-shadow:var(--shadow-lg);transition:opacity .2s,transform .2s;z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
<link rel="stylesheet" href="./header.css">
</head>
<body>
<div id="site-header"></div>
<script src="./header.js"></script>
<div class="wrap">

  <div class="pagehead">
    <span class="kick" data-i18n="kick"></span>
    <h1 data-i18n="pageTitle"></h1>
    <p data-i18n="pageSub"></p>
  </div>

  <!-- options -->
  <div class="card optcard">
    <div class="cardtitle" data-i18n="optionsTitle"></div>
    <div class="optgrid">
      <label class="optrow"><input type="checkbox" id="optStripAll"><span data-i18n="optStripAll"></span></label>
      <label class="optrow"><input type="checkbox" id="optStyles" checked><span data-i18n="optStyles"></span></label>
      <label class="optrow"><input type="checkbox" id="optClass"><span data-i18n="optClass"></span></label>
      <label class="optrow"><input type="checkbox" id="optId"><span data-i18n="optId"></span></label>
      <label class="optrow"><input type="checkbox" id="optData"><span data-i18n="optData"></span></label>
      <label class="optrow"><input type="checkbox" id="optSpan"><span data-i18n="optSpan"></span></label>
      <label class="optrow"><input type="checkbox" id="optEmpty"><span data-i18n="optEmpty"></span></label>
      <label class="optrow"><input type="checkbox" id="optComments" checked><span data-i18n="optComments"></span></label>
      <label class="optrow"><input type="checkbox" id="optScripts" checked><span data-i18n="optScripts"></span></label>
      <label class="optrow"><input type="checkbox" id="optWord" checked><span data-i18n="optWord"></span></label>
      <label class="optrow"><input type="checkbox" id="optCollapse"><span data-i18n="optCollapse"></span></label>
    </div>
    <div class="presets">
      <button class="gbtn" id="presetWord" type="button">
        <svg viewBox="0 0 24 24"><path d="M3 3h18v18H3z"/><path d="M7 8l2.5 8L12 8l2.5 8L17 8"/></svg>
        <span data-i18n="presetWord"></span>
      </button>
      <button class="gbtn" id="presetPlain" type="button">
        <svg viewBox="0 0 24 24"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
        <span data-i18n="presetPlain"></span>
      </button>
      <button class="gbtn" id="presetStyles" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span data-i18n="presetStyles"></span>
      </button>
      <button class="gbtn" id="presetReset" type="button">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9 9 0 0 0-6.4 2.7L3 8"/><path d="M3 3v5h5"/></svg>
        <span data-i18n="presetReset"></span>
      </button>
    </div>
  </div>

  <!-- input | output -->
  <div class="io">
    <div class="card iocard">
      <div class="iohead"><div class="cardtitle" data-i18n="inputTitle"></div></div>
      <textarea id="inArea" class="codearea" spellcheck="false" data-i18n-ph="inputPh"></textarea>
    </div>

    <div class="card iocard">
      <div class="iohead">
        <div class="cardtitle" data-i18n="outputTitle"></div>
        <div class="ioactions">
          <button class="copybtn" id="copyBtn" type="button"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span data-i18n="copy"></span></button>
          <button class="copybtn" id="dlBtn" type="button"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg><span data-i18n="download"></span></button>
        </div>
      </div>
      <textarea id="outArea" class="codearea" readonly spellcheck="false"></textarea>
    </div>
  </div>

  <!-- stats -->
  <div class="statstrip">
    <div class="statbox"><div class="statlabel" data-i18n="statBefore"></div><div class="statval" id="statBefore">0</div></div>
    <div class="statbox"><div class="statlabel" data-i18n="statAfter"></div><div class="statval" id="statAfter">0</div></div>
    <div class="statbox"><div class="statlabel" data-i18n="statSaved"></div><div class="statval accent" id="statSaved">0%</div></div>
  </div>

  <div class="note">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <span data-i18n="note"></span>
  </div>

  <footer data-i18n="foot"></footer>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const el = id => document.getElementById(id);

  const I18N = {
    he:{ dir:'rtl',
      kick:'מנקה HTML',
      pageTitle:'מנקה HTML — ניקוי קוד, סגנונות וזבל של Word',
      pageSub:'הדביקו קוד HTML מבולגן ונקו אותו בלחיצה — הסירו תגיות, סגנונות מוטבעים, מחלקות ומזהים, מחקו הערות וסקריפטים, ונקו את הזבל של Microsoft Word ו-Google Docs. הכול רץ בדפדפן, שום דבר לא נשלח לשרת.',
      optionsTitle:'אפשרויות ניקוי', inputTitle:'קלט', outputTitle:'פלט מנוקה',
      optStripAll:'הסרת כל התגיות → טקסט בלבד',
      optStyles:'הסרת סגנונות מוטבעים (style="...")',
      optClass:'הסרת מאפייני class',
      optId:'הסרת מאפייני id',
      optData:'הסרת מאפייני data-*',
      optSpan:'פירוק תגיות <span> (השארת הטקסט)',
      optEmpty:'הסרת תגיות ריקות',
      optComments:'הסרת הערות HTML',
      optScripts:'הסרת בלוקים של <script> ו-<style>',
      optWord:'ניקוי זבל של Microsoft Word / Google Docs',
      optCollapse:'כיווץ רווחים / הסרת שורות ריקות',
      presetWord:'ניקוי Word/Docs', presetPlain:'טקסט בלבד', presetStyles:'סגנונות בלבד', presetReset:'איפוס',
      inputPh:'הדביקו כאן את קוד ה-HTML המבולגן…',
      download:'הורדה', statBefore:'לפני', statAfter:'אחרי', statSaved:'חיסכון',
      note:'הניקוי מתבצע לגמרי בדפדפן שלכם באמצעות DOMParser — קוד מודבק לעולם אינו מורץ ושום דבר אינו נשלח לשרת. שנו את האפשרויות למעלה כדי לכוונן את התוצאה; היא מתעדכנת בזמן אמת.',
      copy:'העתקה', copiedMsg:'הועתק ✓', dlMsg:'הורד ✓', errMsg:'לא ניתן לנקות את הקלט',
      foot:'KOLKLI · מנקה HTML · פרטי ומהיר, ישירות בדפדפן' },
    en:{ dir:'ltr',
      kick:'HTML Cleaner',
      pageTitle:'HTML Cleaner — strip tags, styles & Word junk',
      pageSub:'Paste messy HTML and clean it in one click — remove tags, inline styles, classes and IDs, delete comments and scripts, and clean up Microsoft Word and Google Docs junk. Everything runs in your browser; nothing is sent to a server.',
      optionsTitle:'Cleaning options', inputTitle:'Input', outputTitle:'Cleaned output',
      optStripAll:'Strip ALL tags → plain text',
      optStyles:'Remove inline styles (style="...")',
      optClass:'Remove class attributes',
      optId:'Remove id attributes',
      optData:'Remove data-* attributes',
      optSpan:'Unwrap <span> tags (keep their text)',
      optEmpty:'Remove empty tags',
      optComments:'Remove HTML comments',
      optScripts:'Remove <script> and <style> blocks',
      optWord:'Clean Microsoft Word / Google Docs junk',
      optCollapse:'Collapse whitespace / remove blank lines',
      presetWord:'Word/Docs cleanup', presetPlain:'Plain text', presetStyles:'Strip styles only', presetReset:'Reset',
      inputPh:'Paste your messy HTML here…',
      download:'Download', statBefore:'Before', statAfter:'After', statSaved:'Saved',
      note:'Cleaning happens entirely in your browser using DOMParser — pasted markup is never executed and nothing is sent to a server. Toggle the options above to fine-tune the result; it updates live as you type.',
      copy:'Copy', copiedMsg:'Copied ✓', dlMsg:'Downloaded ✓', errMsg:'Could not clean the input',
      foot:'KOLKLI · HTML Cleaner · Private and fast, right in your browser' },
    ru:{ dir:'ltr',
      kick:'Очистка HTML',
      pageTitle:'Очистка HTML — удаление тегов, стилей и мусора Word',
      pageSub:'Вставьте грязный HTML и очистите его одним щелчком — уберите теги, встроенные стили, классы и идентификаторы, удалите комментарии и скрипты, а также мусор Microsoft Word и Google Docs. Всё работает в браузере; ничего не отправляется на сервер.',
      optionsTitle:'Параметры очистки', inputTitle:'Ввод', outputTitle:'Очищенный вывод',
      optStripAll:'Удалить ВСЕ теги → только текст',
      optStyles:'Удалить встроенные стили (style="...")',
      optClass:'Удалить атрибуты class',
      optId:'Удалить атрибуты id',
      optData:'Удалить атрибуты data-*',
      optSpan:'Развернуть теги <span> (оставить текст)',
      optEmpty:'Удалить пустые теги',
      optComments:'Удалить HTML-комментарии',
      optScripts:'Удалить блоки <script> и <style>',
      optWord:'Очистить мусор Microsoft Word / Google Docs',
      optCollapse:'Сжать пробелы / убрать пустые строки',
      presetWord:'Очистка Word/Docs', presetPlain:'Только текст', presetStyles:'Только стили', presetReset:'Сброс',
      inputPh:'Вставьте сюда грязный HTML…',
      download:'Скачать', statBefore:'До', statAfter:'После', statSaved:'Экономия',
      note:'Очистка выполняется полностью в вашем браузере с помощью DOMParser — вставленный код никогда не выполняется, и ничего не отправляется на сервер. Меняйте параметры выше для точной настройки; результат обновляется в реальном времени.',
      copy:'Копировать', copiedMsg:'Скопировано ✓', dlMsg:'Скачано ✓', errMsg:'Не удалось очистить ввод',
      foot:'KOLKLI · Очистка HTML · Приватно и быстро, прямо в браузере' }
  };

  const OPTIDS = { stripAll:'optStripAll', styles:'optStyles', cls:'optClass', ids:'optId', data:'optData',
    span:'optSpan', empty:'optEmpty', comments:'optComments', scripts:'optScripts', word:'optWord', collapse:'optCollapse' };
  const VOID_TAGS = { br:1, hr:1, img:1, input:1, area:1, base:1, col:1, embed:1, source:1, track:1, wbr:1, meta:1, link:1 };

  let lang='he', t=I18N.he;

  // ---- cleaning logic ----
  function getOpts(){
    const o={};
    Object.keys(OPTIDS).forEach(function(k){ const e=el(OPTIDS[k]); o[k]=!!(e&&e.checked); });
    return o;
  }

  function stripWordJunk(str){
    return str
      // conditional comments  <!--[if ...]> ... <![endif]-->
      .replace(/<!--\[if[\s\S]*?\[endif\]-->/gi,'')
      // revealed conditional comments  <![if ...]> ... <![endif]>
      .replace(/<!\[if[\s\S]*?\[endif\]>/gi,'')
      // <xml>...</xml> islands
      .replace(/<xml[\s\S]*?<\/xml>/gi,'')
      // office / word / meta namespaced tags:  <o:p>, </o:p>, <w:...>, <m:...>, <v:...>, <st1:...>
      .replace(/<\/?(?:o|w|m|v|st1|st2|x):[^>]*>/gi,'')
      // stray <xml ...> / </xml> openers left behind
      .replace(/<\/?xml[^>]*>/gi,'')
      // mso-* style declarations
      .replace(/mso-[^:;"'{}]+:[^;"'{}]*;?/gi,'')
      // xmlns:* namespace attributes
      .replace(/\s+xmlns:[a-z0-9_-]+="[^"]*"/gi,'')
      // Word Mso* classes
      .replace(/\s+class="Mso[^"]*"/gi,'');
  }

  function isEmpty(node, tag){
    if(VOID_TAGS[tag]) return false;
    if(node.children.length) return false;
    return node.textContent.replace(/[\s ]+/g,'')==='';
  }

  function walk(node, o){
    const kids=Array.prototype.slice.call(node.childNodes);
    kids.forEach(function(child){
      if(child.nodeType===8){ // comment
        if(o.comments) child.parentNode.removeChild(child);
        return;
      }
      if(child.nodeType!==1) return; // keep text nodes as-is
      const tag=child.tagName.toLowerCase();

      // drop script/style blocks entirely
      if(o.scripts && (tag==='script'||tag==='style')){ child.parentNode.removeChild(child); return; }

      // attribute scrubbing
      if(o.styles) child.removeAttribute('style');
      if(o.cls) child.removeAttribute('class');
      if(o.ids) child.removeAttribute('id');
      if(o.data){
        Array.prototype.slice.call(child.attributes).forEach(function(a){
          if(a.name.indexOf('data-')===0) child.removeAttribute(a.name);
        });
      }

      // recurse into (now cleaned) children first
      walk(child, o);

      // unwrap <span> — replace element with its own child nodes
      if(o.span && tag==='span'){
        const parent=child.parentNode;
        while(child.firstChild) parent.insertBefore(child.firstChild, child);
        parent.removeChild(child);
        return;
      }

      // drop elements that ended up empty
      if(o.empty && isEmpty(child, tag)){ child.parentNode.removeChild(child); return; }
    });
  }

  function collapse(str){
    return str
      .replace(/[ \t\f\v]+/g,' ')       // runs of horizontal whitespace → single space
      .replace(/[ \t]*\n[ \t]*/g,'\n')  // trim around line breaks
      .replace(/\n{2,}/g,'\n')          // drop blank lines
      .replace(/^\s+|\s+$/g,'');        // trim ends
  }

  function clean(){
    const raw = el('inArea').value;
    let out='';
    try{
      let str=raw;
      if(getOpts().word) str=stripWordJunk(str);
      const o=getOpts();
      if(o.scripts){
        str=str.replace(/<script[\s\S]*?<\/script\s*>/gi,'')
               .replace(/<style[\s\S]*?<\/style\s*>/gi,'');
      }
      const doc=new DOMParser().parseFromString(str,'text/html');
      const body=doc.body;
      walk(body, o);
      out = o.stripAll ? body.textContent : body.innerHTML;
      if(o.collapse) out=collapse(out);
    }catch(err){
      toast(t.errMsg);
      return;
    }
    el('outArea').value=out;
    updateStats(raw.length, out.length);
  }

  function num(n){ try{ return Number(n).toLocaleString('en-US'); }catch(_){ return String(n); } }
  function updateStats(before, after){
    el('statBefore').textContent=num(before);
    el('statAfter').textContent=num(after);
    const pct = before>0 ? Math.max(0, Math.round((1-after/before)*100)) : 0;
    el('statSaved').textContent=pct+'%';
  }

  function setOpts(map){
    Object.keys(OPTIDS).forEach(function(k){ const e=el(OPTIDS[k]); if(e) e.checked=!!map[k]; });
    clean();
  }

  function download(){
    const text=el('outArea').value;
    const stripAll=el('optStripAll').checked;
    const ext=stripAll?'txt':'html';
    const mime=stripAll?'text/plain':'text/html';
    try{
      const blob=new Blob([text],{type:mime+';charset=utf-8'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download='cleaned.'+ext;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); },1000);
      toast(t.dlMsg);
    }catch(_){ toast(t.errMsg); }
  }

  // ---- toast + copy ----
  function toast(msg){ const e=el('toast'); e.textContent=msg; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),1700); }
  function copy(text){
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).catch(fallbackCopy.bind(null,text)); }
    else fallbackCopy(text);
    toast(t.copiedMsg);
  }
  function fallbackCopy(text){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(_){} document.body.removeChild(ta);
  }

  // ---- events ----
  el('inArea').addEventListener('input', clean);
  Object.keys(OPTIDS).forEach(function(k){ const e=el(OPTIDS[k]); if(e) e.addEventListener('change', clean); });

  el('presetWord').addEventListener('click', function(){ setOpts({word:1,scripts:1,comments:1,styles:1,cls:1,ids:1,span:1,empty:1,collapse:1}); });
  el('presetPlain').addEventListener('click', function(){ setOpts({stripAll:1,scripts:1,comments:1,collapse:1}); });
  el('presetStyles').addEventListener('click', function(){ setOpts({styles:1}); });
  el('presetReset').addEventListener('click', function(){ setOpts({styles:1,comments:1,scripts:1,word:1}); });

  el('copyBtn').addEventListener('click', function(){ copy(el('outArea').value); });
  el('dlBtn').addEventListener('click', download);

  // ---- i18n + theme ----
  function applyLang(l){
    if(!I18N[l]) l='en';
    lang=l; t=I18N[l];
    document.documentElement.lang=l; document.documentElement.dir=t.dir;
    document.querySelectorAll('[data-i18n]').forEach(n=>{ const k=n.getAttribute('data-i18n'); if(typeof t[k]==='string') n.textContent=t[k]; });
    document.querySelectorAll('[data-i18n-ph]').forEach(n=>{ const k=n.getAttribute('data-i18n-ph'); if(typeof t[k]==='string') n.setAttribute('placeholder', t[k]); });
    try{ localStorage.setItem('ac_lang', l); }catch(_){}
  }
  function ls(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
  function detectLang(){
    const chosen=ls('ac_lang'); if(chosen) return chosen;
    const cc=ls('ac_country'); if(cc) return cc==='IL'?'he':'en';
    let tz=''; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(_){}
    const navHe=(navigator.language||'').toLowerCase().indexOf('he')===0;
    return (tz==='Asia/Jerusalem'||navHe)?'he':'en';
  }
  function applyTheme(th){
    const dark=(th==='dark');
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
    const ti=el('themeIco'); if(ti) ti.textContent = dark?'☀️':'🌙';
    try{ localStorage.setItem('theme', dark?'dark':'light'); }catch(_){}
  }
  window.__setLang=applyLang;
  const tb=el('themeToggle'); if(tb) tb.addEventListener('click',()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));

  // ---- init ----
  applyTheme(ls('theme')||'light');
  applyLang(detectLang());
  clean();
})();
</script>
</body>
</html>
