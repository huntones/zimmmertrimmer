  /* ================= face recognition — group / filter the gallery by person =================
     Runs 100% in the browser via the vendored @vladmandic/human engine (./vendor/human.js +
     ./vendor/human-models/). Nothing is uploaded and no biometric data leaves the device. Opt-in
     only (an explicit button + first-run consent). Per image we detect faces and compute a 1024-d
     embedding; results (incl. a small face-crop thumbnail) are cached in the IndexedDB 'faces' store
     keyed by blobKey, so each photo is analysed at most once. Embeddings are clustered into people;
     the lightweight people index (labels/members/avatars) is persisted per project in localStorage. */
  const FACE = (function(){
    const MODEL_VERSION = 'human1|blazeface+facemesh+faceres';
    const SIM = 0.55;                 // cosine-similarity threshold for "same person" (tunable)
    const MIN_MEMBERS = 2;            // a person needs to appear in >= 2 photos to earn a chip
    const MAX_DIM = 1024;            // downscale the longest edge before inference (speed + memory)
    const PEOPLE_KEY = 'kolkli_select_people';
    const CONSENT_KEY = 'kolkli_face_consent';

    let human = null, loading = null, busy = false, cancel = false;
    const avatarUrl = {};            // personId -> object URL for the representative face thumbnail

    /* ---- capability check (WebGL + createImageBitmap) ---- */
    function supported(){
      if(typeof createImageBitmap !== 'function') return false;
      try{ const c=document.createElement('canvas'); return !!(c.getContext('webgl2')||c.getContext('webgl')); }
      catch(e){ return false; }
    }

    /* ---- people index persistence (per project, in localStorage) ---- */
    function pkey(){ return PEOPLE_KEY+'::'+SEL_STORE.scope(); }
    function readIndex(){ try{ const o=JSON.parse(ls(pkey())||'null'); return (o&&Array.isArray(o.people))?o:null; }catch(e){ return null; } }
    function writeIndex(){ try{ lsSet(pkey(), JSON.stringify({ modelVersion:MODEL_VERSION, threshold:SIM, updatedAt:Date.now(), people:PEOPLE })); }catch(e){ console.error('[face] writeIndex',e); } }

    /* ---- cosine similarity between two embeddings ---- */
    function cosine(a,b){ let d=0,na=0,nb=0; const n=Math.min(a.length,b.length); for(let i=0;i<n;i++){ d+=a[i]*b[i]; na+=a[i]*a[i]; nb+=b[i]*b[i]; } return (na&&nb)? d/Math.sqrt(na*nb) : 0; }

    /* ---- clustering: greedy centroid assignment + one merge sweep (k unknown) ---- */
    function cluster(faces){
      const cl=[];
      for(const fc of faces){
        let best=-1, bs=SIM;
        for(let i=0;i<cl.length;i++){ const s=cosine(fc.embedding, cl[i].centroid); if(s>=bs){ bs=s; best=i; } }
        if(best<0){ cl.push({ members:[fc], sum:fc.embedding.slice(), centroid:fc.embedding.slice() }); }
        else { const c=cl[best]; c.members.push(fc); for(let k=0;k<c.sum.length;k++) c.sum[k]+=fc.embedding[k]; const n=c.members.length; c.centroid=c.sum.map(v=>v/n); }
      }
      let merged=true;
      while(merged){ merged=false;
        for(let i=0;i<cl.length && !merged;i++){ for(let j=i+1;j<cl.length;j++){
          if(cosine(cl[i].centroid, cl[j].centroid)>=SIM){ const a=cl[i], b=cl[j];
            a.members=a.members.concat(b.members); for(let k=0;k<a.sum.length;k++) a.sum[k]+=b.sum[k];
            const n=a.members.length; a.centroid=a.sum.map(v=>v/n); cl.splice(j,1); merged=true; break; }
        }}
      }
      return cl;
    }

    /* ---- turn raw clusters into the people index, carrying over prior labels/hidden by centroid match ---- */
    function buildPeople(clusters){
      clusters = clusters.filter(c=>c.members.length>=MIN_MEMBERS).sort((a,b)=>b.members.length-a.members.length);
      const old = PEOPLE.slice(); const used = {}; let seq = 0;
      return clusters.map(cl=>{
        let rep = cl.members[0]; for(const m of cl.members){ if((m.score||0)>(rep.score||0)) rep=m; }
        let label='', hidden=false, manual=false, personId='p'+Date.now().toString(36)+(seq++);
        let best=null, bsim=0.5;
        for(const op of old){ if(used[op.personId]||!op.centroid) continue; const s=cosine(cl.centroid, op.centroid); if(s>bsim){ bsim=s; best=op; } }
        if(best){ label=best.label||''; hidden=!!best.hidden; manual=!!best.manual; personId=best.personId; used[best.personId]=1; }
        return { personId, label, hidden, manual,
                 avatar:{ blobKey:rep.blobKey, faceIdx:rep.faceIdx },
                 centroid:cl.centroid,
                 members: cl.members.map(m=>({ blobKey:m.blobKey, faceIdx:m.faceIdx })) };
      });
    }

    /* ---- rebuild the fast blobKey lookup used by visible() ---- */
    function rebuildSets(){
      PEOPLE_SETS = {};
      PEOPLE.forEach(p=>{ const s=new Set(); (p.members||[]).forEach(m=>{ if(m.blobKey) s.add(m.blobKey); }); PEOPLE_SETS[p.personId]=s; });
      if(activePerson && !PEOPLE.some(p=>p.personId===activePerson && !p.hidden)) activePerson=null;
    }

    /* ---- lazy model loading ---- */
    function loadScript(src){ return new Promise((res,rej)=>{ if(window.Human){ res(); return; } const s=document.createElement('script'); s.src=src; s.onload=()=>res(); s.onerror=()=>rej(new Error('failed to load '+src)); document.head.appendChild(s); }); }
    function ensure(){
      if(human) return Promise.resolve(human);
      if(!loading){
        loading = (async()=>{
          await loadScript('./vendor/human.js');
          const NS = window.Human; const Ctor = (typeof NS==='function') ? NS : (NS.Human || NS.default);
          const base = new URL('./vendor/human-models/', document.baseURI).href;
          const h = new Ctor({
            backend:'humangl', modelBasePath:base, cacheModels:true, warmup:'none', debug:false,
            filter:{ enabled:true, equalization:false },
            face:{ enabled:true,
              detector:{ enabled:true, rotation:false, maxDetected:30, minConfidence:0.2, return:false },
              mesh:{ enabled:true }, attention:{ enabled:false }, iris:{ enabled:false },
              description:{ enabled:true }, emotion:{ enabled:false }, antispoof:{ enabled:false }, liveness:{ enabled:false } },
            body:{ enabled:false }, hand:{ enabled:false }, object:{ enabled:false }, gesture:{ enabled:false }, segmentation:{ enabled:false }
          });
          await h.load();
          human = h; return h;
        })();
      }
      return loading;
    }

    /* ---- decode + downscale a stored blob onto a working canvas ---- */
    async function toCanvas(blob){
      const bmp = await createImageBitmap(blob);
      let w=bmp.width, h=bmp.height; const md=Math.max(w,h);
      if(md>MAX_DIM){ const sc=MAX_DIM/md; w=Math.max(1,Math.round(w*sc)); h=Math.max(1,Math.round(h*sc)); }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      try{ c.getContext('2d').drawImage(bmp,0,0,w,h); }catch(e){}
      try{ bmp.close(); }catch(e){}
      return c;
    }
    /* ---- square, padded face crop (96×96 JPEG) for the person avatar ---- */
    function faceThumb(src, box){
      const x=box[0], y=box[1], w=box[2], h=box[3];
      const size=Math.max(w,h)*1.6, cx=x+w/2, cy=y+h/2;
      let sx=Math.max(0,Math.min(cx-size/2, src.width-1)), sy=Math.max(0,Math.min(cy-size/2, src.height-1));
      const s=Math.max(8, Math.min(size, src.width-sx, src.height-sy));
      const c=document.createElement('canvas'); c.width=96; c.height=96;
      try{ c.getContext('2d').drawImage(src, sx, sy, s, s, 0,0,96,96); }catch(e){}
      return new Promise(r=>{ if(c.toBlob) c.toBlob(b=>r(b),'image/jpeg',0.82); else r(null); });
    }

    /* ---- analyse one image (uses the IDB cache when fresh) ---- */
    async function analyse(f){
      let rec=null; try{ rec = await SEL_STORE.getFaces(f.blobKey); }catch(e){}
      if(rec && rec.modelVersion===MODEL_VERSION && Array.isArray(rec.faces)) return rec;
      const blob = await SEL_STORE.getBlob(f.blobKey);
      if(!blob){ return { blobKey:f.blobKey, modelVersion:MODEL_VERSION, faces:[] }; }
      const canvas = await toCanvas(blob);
      const out=[];
      try{
        const res = await human.detect(canvas);
        const arr = (res && res.face) || [];
        for(const fc of arr){
          const emb = fc.embedding || fc.descriptor;
          if(!emb || !emb.length) continue;
          const score = fc.faceScore || fc.score || fc.boxScore || 1;
          if(score < 0.4) continue;
          const box = (fc.box && fc.box.length===4) ? fc.box.map(Number) : [0,0,canvas.width,canvas.height];
          if(Math.max(box[2],box[3]) < 24) continue;   // skip tiny background faces
          const thumb = await faceThumb(canvas, box);
          out.push({ bbox:box, score:score, embedding:Array.from(emb), thumb:thumb });
        }
      }catch(e){ console.warn('[face] detect failed on', f.name, e); }
      rec = { blobKey:f.blobKey, projectId:SEL_STORE.scope(), modelVersion:MODEL_VERSION, faces:out };
      try{ await SEL_STORE.putFaces(f.blobKey, rec); }catch(e){ console.warn('[face] putFaces',e); }
      return rec;
    }

    /* ---- the whole opt-in run ---- */
    async function run(){
      if(busy) return;
      const targets = FILES.filter(f=>f.kind==='image' && f.uploaded && f.blobKey);
      if(!targets.length){ toast(t.faceNoImages,'warn'); return; }
      busy=true; cancel=false;
      openProgress(0, targets.length);
      try{ await ensure(); }
      catch(e){ console.error('[face] model load failed',e); busy=false; closeOverlay(); toast(t.faceUnsupported,'warn'); return; }
      const allFaces=[];
      for(let i=0;i<targets.length;i++){
        if(cancel) break;
        const f=targets[i];
        try{ const rec = await analyse(f); (rec.faces||[]).forEach((fa,idx)=> allFaces.push({ blobKey:f.blobKey, faceIdx:idx, embedding:fa.embedding, score:fa.score })); }
        catch(e){ console.warn('[face] analyse error', f.name, e); }
        updateProgress(i+1, targets.length);
        await new Promise(r=>setTimeout(r,0));   // yield to keep the UI responsive
      }
      if(!cancel){
        PEOPLE = buildPeople(cluster(allFaces));
        writeIndex(); rebuildSets();
        for(const k in avatarUrl){ try{ URL.revokeObjectURL(avatarUrl[k]); }catch(e){} delete avatarUrl[k]; }
        renderPeople(); refreshAll(); loadAvatars();
        toast(t.faceDone(PEOPLE.filter(p=>!p.hidden && (p.members||[]).length>=MIN_MEMBERS).length), 'ok');
      }
      busy=false; closeOverlay();
    }

    /* ---- representative face thumbnails, loaded lazily from IDB and cached as object URLs ---- */
    async function loadAvatars(){
      const jobs = PEOPLE.filter(p=>p.avatar && !avatarUrl[p.personId]).map(async p=>{
        try{ const rec = await SEL_STORE.getFaces(p.avatar.blobKey); const fa = rec && rec.faces && rec.faces[p.avatar.faceIdx];
          if(fa && fa.thumb){ avatarUrl[p.personId] = URL.createObjectURL(fa.thumb); } }catch(e){}
      });
      if(jobs.length){ await Promise.all(jobs); renderPeople(); }
    }

    /* ---- drop cached faces + prune the people index for deleted uploads (called by selRemove) ---- */
    function prune(blobKeys){
      if(!blobKeys || !blobKeys.length) return;
      const drop={}; blobKeys.forEach(k=>{ if(k){ drop[k]=1; SEL_STORE.delFaces(k); } });
      let changed=false;
      PEOPLE.forEach(p=>{ const n0=(p.members||[]).length; p.members=(p.members||[]).filter(m=>!drop[m.blobKey]); if(p.members.length!==n0) changed=true;
        if(p.avatar && drop[p.avatar.blobKey]){ p.avatar = p.members[0] ? { blobKey:p.members[0].blobKey, faceIdx:p.members[0].faceIdx } : null;
          if(avatarUrl[p.personId]){ try{ URL.revokeObjectURL(avatarUrl[p.personId]); }catch(e){} delete avatarUrl[p.personId]; } } });
      PEOPLE = PEOPLE.filter(p=>(p.members||[]).length>0);
      if(changed){ writeIndex(); rebuildSets(); renderPeople(); loadAvatars(); }
    }

    /* ---- wipe all face/people data for this project ---- */
    function clearAll(){
      openConfirm(t.faceClearTitle, t.faceClearBody, t.faceClear, t.delCancel, ()=>{
        try{ localStorage.removeItem(pkey()); }catch(e){}
        SEL_STORE.clearFaces();
        for(const k in avatarUrl){ try{ URL.revokeObjectURL(avatarUrl[k]); }catch(e){} delete avatarUrl[k]; }
        PEOPLE=[]; activePerson=null; rebuildSets(); closeOverlay(); renderPeople(); refreshAll();
        toast(t.faceCleared,'ok');
      });
    }

    /* ---- modals ---- */
    function openConsent(onOk){
      openOverlay(`${closeBtnHtml()}<h3>${esc(t.faceConsentTitle)}</h3><p>${esc(t.faceConsentBody)}</p>`+
        `<div class="mactions"><button class="mbtn ghost" data-close type="button">${esc(t.delCancel)}</button>`+
        `<button class="mbtn primary" id="faceConsentOk" type="button">${esc(t.faceConsentAgree)}</button></div>`);
      const ok=el('faceConsentOk'); if(ok) ok.addEventListener('click', onOk);
    }
    function openProgress(done,total){
      const pct = total ? Math.round(done/total*100) : 0;
      openOverlay(`<h3>${esc(t.faceRunTitle)}</h3><p>${esc(t.faceRunSub)}</p>`+
        `<div class="fprog"><span id="fprogBar" style="width:${pct}%"></span></div>`+
        `<div class="fprogtxt" id="fprogTxt">${done} / ${total}</div>`+
        `<div class="mactions"><button class="mbtn ghost" id="fCancel" type="button">${esc(t.cancel)}</button></div>`);
      const cb=el('fCancel'); if(cb) cb.addEventListener('click', ()=>{ cancel=true; cb.disabled=true; cb.textContent=t.canceling; });
    }
    function updateProgress(done,total){ const b=el('fprogBar'); if(b) b.style.width=(total?Math.round(done/total*100):0)+'%'; const x=el('fprogTxt'); if(x) x.textContent=done+' / '+total; }
    function openEdit(personId){
      const p = PEOPLE.find(x=>x.personId===personId); if(!p) return;
      openOverlay(`${closeBtnHtml()}<h3>${esc(t.faceEditTitle)}</h3><p>${esc(t.faceEditSub)}</p>`+
        `<div class="shrow"><input type="text" id="pName" value="${esc(p.label||'')}" placeholder="${esc(t.faceNamePh)}"></div>`+
        `<div class="mactions"><button class="mbtn ghost" id="pHide" type="button">${esc(p.hidden?t.faceUnhide:t.faceHide)}</button>`+
        `<button class="mbtn primary" id="pSave" type="button">${esc(t.save)}</button></div>`);
      const inp=el('pName'); if(inp) inp.focus();
      const sv=el('pSave'); if(sv) sv.addEventListener('click', ()=>{ p.label=((el('pName')||{}).value||'').trim(); p.manual=true; writeIndex(); closeOverlay(); renderPeople(); });
      const hd=el('pHide'); if(hd) hd.addEventListener('click', ()=>{ p.hidden=!p.hidden; p.manual=true; if(p.hidden && activePerson===personId) activePerson=null; writeIndex(); closeOverlay(); refreshAll(); });
    }

    /* ---- render the "people" chips row ---- */
    function render(){
      const wrap=el('peopleChips'), row=el('peopleRow'); if(!wrap) return;
      const shown = PEOPLE.filter(p=>!p.hidden && (p.members||[]).length>=MIN_MEMBERS);
      if(!shown.length){ if(row) row.style.display='none'; wrap.innerHTML=''; return; }
      if(row) row.style.display='';
      let html='';
      shown.forEach((p,i)=>{
        const on = p.personId===activePerson, url=avatarUrl[p.personId];
        const av = url ? `<img class="pav" src="${esc(url)}" alt="">` : `<span class="pav ph">${esc((p.label||'?').trim().charAt(0)||'?')}</span>`;
        const name = p.label || (t.facePerson+' '+(i+1));
        html += `<span class="pchipwrap"><button class="chip pchip${on?' on':''}" type="button" data-person="${esc(p.personId)}" title="${esc(name)}">`+
          `${av}<span>${esc(name)}</span><em class="pcount">${(p.members||[]).length}</em></button>`+
          `<button class="pedit" type="button" data-edit="${esc(p.personId)}" title="${esc(t.faceEditTitle)}" aria-label="${esc(t.faceEditTitle)}">`+
          `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button></span>`;
      });
      html += `<button class="pclear" type="button" id="peopleClear" title="${esc(t.faceClearTitle)}">${esc(t.faceClearShort)}</button>`;
      wrap.innerHTML = html;
    }

    /* ---- click routing (delegated) ---- */
    function onClick(e){
      const tg=e.target; if(!tg || !tg.closest) return;
      if(tg.closest('#organizeBtn')){ e.preventDefault(); trigger(); return; }
      const ed=tg.closest('[data-edit]'); if(ed){ e.preventDefault(); if(!MANAGER) openEdit(ed.getAttribute('data-edit')); return; }
      if(tg.closest('#peopleClear')){ e.preventDefault(); if(!MANAGER) clearAll(); return; }
      const ch=tg.closest('[data-person]'); if(ch){ e.preventDefault(); const id=ch.getAttribute('data-person'); activePerson=(activePerson===id)?null:id; refreshAll(); return; }
    }
    function trigger(){
      if(busy) return;
      if(!supported()){ toast(t.faceUnsupported,'warn'); return; }
      const targets = FILES.filter(f=>f.kind==='image' && f.uploaded && f.blobKey);
      if(!targets.length){ toast(t.faceNoImages,'warn'); return; }
      if(ls(CONSENT_KEY)!=='1'){ openConsent(()=>{ lsSet(CONSENT_KEY,'1'); run(); }); }
      else run();
    }

    /* ---- boot: wire clicks + restore the saved people index (fast, no recompute) ---- */
    function init(){
      const btn=el('organizeBtn'); if(btn && !supported()){ btn.disabled=true; btn.title=t.faceUnsupported; }
      document.addEventListener('click', onClick);
      const idx = readIndex();
      if(idx){ PEOPLE = idx.people||[]; rebuildSets(); render(); loadAvatars(); }
    }

    return { init, render, trigger, prune, supported };
  })();
  function renderPeople(){ try{ FACE.render(); }catch(e){} }

  /* ---------------- init ---------------- */
  if(MANAGER){ document.body.classList.add('manager'); var _mb=el('mgrBanner'); if(_mb) _mb.classList.remove('hidden'); }
  applyTheme(ls('theme')||'light');
  selHydrate();   // rebuild uploaded files from storage BEFORE the first render (fetch from storage, not memory)
  FACE.init();    // wire the "organize by people" button + restore any saved people groups for this project
  { const _picks = selReadPicks(); if(_picks) selected = new Set(_picks); }   // restore the client's saved picks for this project
  finished = selReadDone();   // restore the client's "finished picking" flag for this project
  const saved=ls('ac_lang'); applyLang(saved==='en'||saved==='ru'||saved==='he'?saved:'he');
})();
</script>
<script src="./notify-sound.js" defer></script>
<script src="./accessibility.js" defer></script>
<script src="./cookie-consent.js" defer></script>
</body>
</html>
