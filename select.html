<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOLKLI — בחירת חומרים ללקוח</title>
<link rel="canonical" href="https://kolkli.com/select">
<meta name="description" content="A branded gallery where your client hand-picks the photos and videos they want — with live quotas, folders and one-click sharing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#eef0f6; --panel:#ffffff; --panel-2:#f5f6fa; --line:#e5e8f0; --line-2:#eef0f6;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#2563eb; --accent-dim:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#e8f0fe;
    --success:#22b04b; --success-dim:#1c9a41; --success-soft:#e6f6ec;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --danger:#e5484d; --danger-soft:#fdecec;
    --warm:#c88a04; --warm-soft:#fff5da; --warm-line:#f2d98a;
    --grad:linear-gradient(105deg,#3b82f6 0%,#1d4ed8 100%);
    --grad-soft:linear-gradient(120deg,#e8f0fe,#dbeafe);
    --grad-shadow:rgba(29,78,216,0.30);
    --grad-btn:linear-gradient(105deg,#3b82f6 0%,#1d4ed8 100%);
    --grad-btn-glow:rgba(37,99,235,0.38);
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-lg:0 2px 6px rgba(20,24,44,0.05), 0 20px 50px rgba(20,24,44,0.10);
    --shadow-sm:0 1px 2px rgba(20,24,44,0.05);
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --sans:'Space Grotesk','Rubik',system-ui,'Segoe UI',sans-serif;
    --card-size:172px;
  }
  html[data-theme="dark"] {
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a303c; --line-2:#232833;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --accent:#60a5fa; --accent-dim:#2563eb; --accent-ink:#ffffff; --accent-soft:#13233d;
    --success:#37c26a; --success-dim:#2fae5e; --success-soft:#132a1c;
    --info:#5b95f8; --info-dim:#4f8ef7; --info-soft:#182338;
    --danger:#ff6b6b; --danger-soft:#2a1719;
    --warm:#e8b84b; --warm-soft:#2c2718; --warm-line:#5a4d24;
    --grad:linear-gradient(105deg,#60a5fa 0%,#2563eb 100%);
    --grad-soft:linear-gradient(120deg,#13233d,#101d33);
    --grad-shadow:rgba(96,165,250,0.42);
    --grad-btn:linear-gradient(105deg,#60a5fa 0%,#2563eb 100%);
    --grad-btn-glow:rgba(96,165,250,0.45);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,0.45), 0 24px 60px rgba(0,0,0,0.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;overflow-x:clip;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;}
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:var(--grad);z-index:100;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--sans);}
  .wrap{width:100%;max-width:none;margin:0 auto;padding:22px 22px 104px;}

  /* ---------- buttons ---------- */
  .pillbtn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:999px;
    background:var(--panel);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;font-size:13.5px;font-weight:600;
    box-shadow:var(--shadow-sm);transition:border-color .12s,transform .08s,color .12s,background .12s;white-space:nowrap;}
  .pillbtn:hover{border-color:var(--accent);color:var(--accent-dim);}
  .pillbtn:active{transform:scale(0.97);}
  .pillbtn.ico{width:38px;padding:0;justify-content:center;font-size:15px;}
  .pillbtn svg{width:15px;height:15px;}
  .langwrap{position:relative;display:inline-flex;}
  .langbtn{padding:0 13px;}
  .langbtn .chev{width:13px;height:13px;transition:transform .18s;}
  .langwrap.open .langbtn .chev{transform:rotate(180deg);}
  .langmenu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;z-index:220;min-width:166px;padding:6px;
    border-radius:13px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-lg);
    opacity:0;visibility:hidden;transform:translateY(-6px);pointer-events:none;
    transition:opacity .16s ease,transform .16s ease,visibility .16s;}
  .langwrap.open .langmenu{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto;}
  .langopt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
    padding:9px 11px;border:0;border-radius:10px;background:none;color:var(--ink-2);cursor:pointer;
    font-size:13px;font-weight:700;text-align:start;transition:background .12s,color .12s;}
  .langopt:hover{background:var(--panel-2);color:var(--accent-dim);}
  .langopt.active{color:var(--accent-dim);}
  .langopt svg{width:15px;height:15px;opacity:0;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
  .langopt.active svg{opacity:1;}
  .cta{display:inline-flex;align-items:center;gap:8px;color:#fff;border:none;cursor:pointer;height:38px;padding:0 18px;border-radius:999px;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:600;font-size:13.5px;text-shadow:0 1px 2px rgba(0,0,0,.18);white-space:nowrap;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.14),0 6px 16px var(--grad-btn-glow);
    transition:filter .14s,transform .08s;}
  .cta:hover{filter:brightness(1.05);} .cta:active{transform:translateY(1px);}
  .cta svg{width:15px;height:15px;}

  /* ---------- page header ---------- */
  .pageheader{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin:4px 0 20px;}
  .pagehead{min-width:0;}
  .pagehead h1{font-size:clamp(23px,3vw,31px);font-weight:800;letter-spacing:-0.02em;margin:0 0 8px;line-height:1.1;}
  .pagehead p{font-size:14px;color:var(--muted);margin:0;max-width:70ch;line-height:1.6;}
  .headactions{display:flex;align-items:center;gap:9px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
  .headactions .sep{width:1px;height:26px;background:var(--line);margin:0 2px;}

  /* ---------- stats row ---------- */
  .statrow{display:grid;grid-template-columns:1.15fr 1fr 1.1fr 1.1fr 1fr;gap:13px;margin-bottom:18px;}
  @media (max-width:1080px){ .statrow{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:620px){ .statrow{grid-template-columns:repeat(2,1fr);} }
  .statcard{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px 16px;box-shadow:var(--shadow-sm);
    display:flex;flex-direction:column;gap:11px;min-width:0;transition:border-color .14s,box-shadow .14s;}
  .statcard:hover{box-shadow:var(--shadow);}
  .st-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .st-tx{min-width:0;}
  .st-label{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .st-val{font-size:22px;font-weight:800;letter-spacing:-0.01em;line-height:1;display:inline-flex;align-items:center;gap:8px;direction:ltr;}
  .st-val .cur{color:var(--accent-dim);}
  html[data-theme="dark"] .st-val .cur{color:var(--accent);}
  .st-val .sep{color:var(--faint);font-weight:600;font-size:18px;}
  .st-val .max{color:var(--muted);font-size:18px;font-weight:700;}
  .st-ic{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:var(--panel-2);color:var(--muted);}
  .st-ic svg{width:19px;height:19px;}
  .st-ic.v{background:var(--accent-soft);color:var(--accent);}
  .st-ic.i{background:var(--success-soft);color:var(--success);}
  .st-ic.g{background:var(--info-soft);color:var(--info);}
  .st-bar{height:7px;border-radius:999px;background:var(--line);overflow:hidden;}
  .st-bar span{display:block;height:100%;border-radius:999px;transition:width .35s cubic-bezier(.4,0,.2,1);}
  .st-bar.v span{background:var(--grad);}
  .st-bar.i span{background:linear-gradient(90deg,var(--success),var(--success-dim));}
  /* near-limit warning states (amber ≥80%, red at cap) — defined last so they win */
  .st-bar.near span{background:linear-gradient(90deg,var(--warm),#f0b429);}
  .st-bar.full span{background:linear-gradient(90deg,var(--danger),#ff8a8a);}
  /* compact stat strip matching the gallery-selection reference */
  .statrow{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;background:transparent;border:0;
    border-radius:0;box-shadow:none;overflow:visible;}
  html[data-theme="dark"] .statrow{box-shadow:none;}
  .statcard{position:relative;min-width:0;min-height:78px;padding:17px 24px 15px;background:transparent;border:0;border-radius:0;
    box-shadow:none;display:flex;flex-direction:column;justify-content:center;gap:8px;transition:background .14s;}
  .statcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);}
  .statcard + .statcard{border-inline-start:1px solid var(--line);}
  .statcard:hover{background:var(--panel);box-shadow:var(--shadow);}
  .st-top{flex-direction:column-reverse;align-items:center;justify-content:center;gap:9px;min-width:0;}
  .st-tx{min-width:0;text-align:center;}
  .st-label{font-size:12px;font-weight:700;margin-bottom:5px;}
  .st-val{letter-spacing:0;align-items:baseline;justify-content:center;color:var(--ink);}
  .statcard.total .st-top{justify-content:center;}
  .statcard.total .cur,.statcard.videos .cur{color:var(--accent-dim);}
  html[data-theme="dark"] .statcard.total .cur,html[data-theme="dark"] .statcard.videos .cur{color:var(--accent);}
  .statcard.images .cur{color:var(--success);}
  .st-val .sep{font-weight:700;}
  .st-val .max{color:var(--ink-2);font-weight:800;}
  .st-ic{width:40px;height:40px;border-radius:12px;flex:0 0 auto;border:1px solid var(--line);}
  .st-ic svg{width:20px;height:20px;}
  .st-ic.v,.st-ic.g{background:var(--accent-soft);color:var(--accent);}
  .st-ic.i{background:var(--success-soft);color:var(--success);}
  .st-bar{width:min(230px,82%);height:4px;margin:2px auto 0;direction:ltr;}
  .st-bar.v span{background:var(--grad);}
  .st-bar.i span{background:linear-gradient(90deg,var(--success),var(--success-dim));}
  .st-bar.near span{background:linear-gradient(90deg,var(--warn),#f0b429);}
  .st-bar.full span{background:linear-gradient(90deg,var(--danger),#ff8a8a);}
  @media (max-width:760px){
    .statrow{grid-template-columns:repeat(2,minmax(0,1fr));}
    .statcard{min-height:86px;padding:16px 18px;}
    .statcard + .statcard{border-inline-start:1px solid var(--line);}
    .statcard:nth-child(even){border-inline-start:1px solid var(--line);}
    .statcard:nth-child(n+3){border-top:1px solid var(--line);}
  }
  @media (max-width:460px){
    .statrow{grid-template-columns:1fr;}
    .statcard:nth-child(even){border-inline-start:1px solid var(--line);}
    .statcard + .statcard{border-top:1px solid var(--line);}
  }

  /* ---------- toolbar ---------- */
  .toolbar{display:flex;align-items:center;gap:11px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:11px 13px;box-shadow:var(--shadow-sm);margin-bottom:16px;}
  .filterset{display:flex;align-items:center;gap:9px;flex-wrap:wrap;min-width:0;}
  .filterlabel{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;}
  .filterlabel svg{width:15px;height:15px;color:var(--faint);}
  .chips{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:999px;cursor:pointer;
    font-size:12.5px;font-weight:600;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2);
    transition:all .12s;white-space:nowrap;}
  .chip:hover{border-color:var(--accent);color:var(--accent-dim);}
  .chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-dim);}
  html[data-theme="dark"] .chip.on{color:var(--accent);}
  .chip .dotc{width:16px;height:16px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:9px;font-weight:800;flex-shrink:0;}
  .chip svg{width:13px;height:13px;}
  .toolactions{display:flex;align-items:center;gap:8px;margin-inline-start:auto;flex-wrap:wrap;}
  .viewtoggle{display:inline-flex;align-items:center;gap:2px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:10px;padding:3px;}
  .viewtoggle .vbtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:30px;border-radius:8px;
    border:none;background:none;color:var(--muted);cursor:pointer;transition:background .12s,color .12s;}
  .viewtoggle .vbtn svg{width:17px;height:17px;}
  .viewtoggle .vbtn:hover{color:var(--accent);}
  .viewtoggle .vbtn.on{background:var(--panel);color:var(--accent);box-shadow:var(--shadow-sm);}
  .btnline{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:999px;cursor:pointer;
    font-size:13px;font-weight:600;background:var(--panel);border:1px solid var(--line);color:var(--ink-2);transition:all .12s;white-space:nowrap;}
  .btnline:hover{border-color:var(--accent);color:var(--accent-dim);}
  .btnline svg{width:14px;height:14px;}
  .btnline:disabled{opacity:.45;cursor:not-allowed;}
  .btnline:disabled:hover{border-color:var(--line);color:var(--ink-2);}
  .btnline.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line));}
  .btnline.danger:hover{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);}
  .btnline.danger:disabled:hover{background:var(--panel);}
  /* the "add more files" button — the small extra upload affordance */
  .btnline.addfiles{color:var(--accent-dim);border:1px dashed color-mix(in srgb,var(--accent) 55%,var(--line));background:var(--panel);font-weight:700;}
  .btnline.addfiles:hover{background:var(--accent-soft);border-style:solid;border-color:var(--accent);}
  html[data-theme="dark"] .btnline.addfiles{color:var(--accent);}
  /* compact upload bar (drag files or whole folders) */
  .drop{display:flex;align-items:center;gap:14px;border:2px dashed color-mix(in srgb,var(--accent) 55%,var(--line));border-radius:14px;
    padding:11px 15px;cursor:pointer;background:var(--panel-2);transition:border-color .15s,background .15s;margin-bottom:16px;}
  .drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);}
  .drop .cloud{width:40px;height:40px;flex:0 0 auto;border-radius:12px;display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);color:var(--accent);}
  .drop .cloud svg{width:22px;height:22px;}
  .drop .dinfo{flex:1;min-width:0;text-align:start;}
  .drop .big{font-size:14.5px;font-weight:600;color:var(--ink);}
  .drop .dhint{margin-top:2px;font-size:11.5px;color:var(--faint);font-family:var(--mono);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .drop .dbtns{display:flex;align-items:center;gap:8px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end;}
  .drop .choose{display:inline-flex;align-items:center;gap:7px;color:#fff;border:none;white-space:nowrap;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:600;font-size:13px;padding:9px 16px;border-radius:999px;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.14),0 6px 16px var(--grad-btn-glow);transition:filter .14s,transform .08s;}
  .drop .choose:hover{filter:brightness(1.05);} .drop .choose:active{transform:translateY(1px);}
  .drop .choose svg{width:15px;height:15px;}
  .drop .choose.ghost{color:var(--accent-dim,var(--accent));background:var(--panel);border:1px solid var(--accent);text-shadow:none;box-shadow:none;}
  html[data-theme="dark"] .drop .choose.ghost{color:var(--accent);}
  .drop .choose.ghost:hover{background:var(--accent-soft);filter:none;}
  @media (max-width:560px){ .drop{flex-wrap:wrap;} .drop .dinfo{flex:1 1 auto;} .drop .dbtns{flex:1 1 100%;} .drop .choose{flex:1;justify-content:center;} }
  .movesel{height:38px;padding:0 12px;font-size:13px;font-weight:600;color:var(--ink-2);background:var(--panel);
    border:1px solid var(--line);border-radius:999px;cursor:pointer;font-family:var(--sans);transition:border-color .12s;max-width:170px;}
  .movesel:hover:not(:disabled){border-color:var(--accent);}
  .movesel:focus{outline:none;border-color:var(--accent);}
  .movesel:disabled{opacity:.5;cursor:not-allowed;}

  /* ---------- workspace ---------- */
  .workspace{display:grid;grid-template-columns:296px 1fr;gap:18px;align-items:start;}
  @media (max-width:900px){ .workspace{grid-template-columns:1fr;} }

  /* ---------- sidebar ---------- */
  .side{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:var(--shadow);
    position:sticky;top:16px;}
  @media (max-width:900px){ .side{position:static;} }
  .side-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .side-h b{font-size:14px;font-weight:700;}
  .addf{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--accent);
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;}
  .addf:hover{border-color:var(--accent);background:var(--accent-soft);}
  .addf svg{width:16px;height:16px;}
  .side-search{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;
    padding:0 12px;height:42px;margin-bottom:13px;}
  .side-search svg{width:16px;height:16px;color:var(--faint);flex-shrink:0;}
  .side-search input{border:none;background:none;outline:none;color:var(--ink);font-family:var(--sans);font-size:13.5px;width:100%;}
  .newfolder{display:none;gap:7px;margin-bottom:11px;}
  .newfolder.show{display:flex;}
  .newfolder input{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--accent);color:var(--ink);border-radius:10px;
    font-family:var(--sans);font-size:13px;padding:0 11px;height:38px;outline:none;}
  .newfolder button{height:38px;padding:0 14px;border-radius:10px;border:none;background:var(--grad-btn);color:#fff;font-weight:700;
    font-size:13px;cursor:pointer;box-shadow:0 4px 12px var(--grad-btn-glow);}
  .folders{display:flex;flex-direction:column;gap:3px;}
  .fitem{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:11px;cursor:pointer;font-size:13.5px;
    color:var(--ink-2);transition:background .12s,border-color .12s;border:1px solid transparent;}
  .fitem:hover{background:var(--panel-2);}
  .fitem.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-dim);font-weight:700;}
  html[data-theme="dark"] .fitem.on{color:var(--accent);}
  .fitem .fi-ic{width:18px;height:18px;flex-shrink:0;color:var(--muted);}
  .fitem.on .fi-ic{color:var(--accent);}
  .fitem .fi-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fitem .fi-count{font-family:var(--mono);font-size:11.5px;color:var(--faint);flex-shrink:0;}
  .fitem.on .fi-count{color:var(--accent);}
  .fitem.extra{display:none;}
  .fitem.extra.show{display:flex;}
  .showmore{margin-top:8px;width:100%;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel-2);
    color:var(--muted);font-weight:600;font-size:12.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
    transition:all .12s;}
  .showmore:hover{border-color:var(--accent);color:var(--accent-dim);}
  .showmore svg{width:14px;height:14px;transition:transform .2s;}
  .showmore.open svg{transform:rotate(180deg);}

  /* ---------- main / grid ---------- */
  .main{min-width:0;}
  .filegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card-size),1fr));gap:15px;}
  .fcard{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:var(--shadow);
    transition:transform .14s,border-color .14s,box-shadow .14s;display:flex;flex-direction:column;}
  .fcard:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow-lg);}
  .fcard.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent),var(--shadow);}
  .fthumb{position:relative;aspect-ratio:1/1;background:var(--panel-2);display:flex;align-items:center;justify-content:center;
    overflow:hidden;cursor:pointer;}
  .fthumb .gradthumb{position:absolute;inset:0;}
  .fthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  .fthumb .docph{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:9px;color:var(--danger);}
  .fthumb .docph svg{width:38px;height:38px;}
  .fthumb .docph .pext{font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.06em;}
  /* order badge */
  .badge{position:absolute;top:9px;right:9px;z-index:4;height:28px;min-width:42px;padding:0 10px;
    display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:800;
    letter-spacing:.04em;color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 62%),var(--grad-btn);
    border-radius:8px;box-shadow:0 4px 12px rgba(80,54,210,.28),inset 0 1px 0 rgba(255,255,255,.45);}
  /* video duration + film rails */
  .filmstrip{position:absolute;inset:0;z-index:3;pointer-events:none;}
  .filmstrip::before,.filmstrip::after{content:'';position:absolute;top:0;bottom:0;width:13px;
    background-color:rgba(12,12,16,.82);background-image:linear-gradient(to bottom,rgba(240,240,244,.9) 0 6px,transparent 6px 12px);
    background-size:6px 12px;background-position:center 3px;background-repeat:repeat-y;}
  .filmstrip::before{inset-inline-start:0;} .filmstrip::after{inset-inline-end:0;}
  .dur{position:absolute;bottom:9px;inset-inline-start:9px;z-index:4;display:inline-flex;align-items:center;gap:5px;
    font-family:var(--mono);font-size:10.5px;font-weight:700;color:#fff;background:rgba(10,12,20,.66);backdrop-filter:blur(3px);
    border-radius:7px;padding:3px 8px;}
  .dur svg{width:10px;height:10px;}
  /* centered selection circle */
  .fcheck{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;
    border:2px solid rgba(255,255,255,.96);background:transparent;cursor:pointer;
    display:flex;align-items:center;justify-content:center;z-index:5;box-shadow:none;opacity:1;
    transition:opacity .14s,background .14s,border-color .14s,transform .12s;}
  .fcheck svg{width:25px;height:25px;color:#fff;opacity:0;transition:opacity .12s;}
  .fthumb:hover .fcheck{opacity:1;}
  .fcheck:hover{background:transparent;transform:translate(-50%,-50%) scale(1.06);}
  .fcard.sel .fcheck{opacity:1;background:var(--success);border-color:rgba(255,255,255,.96);box-shadow:0 3px 14px rgba(34,176,75,.55);}
  .fcard.sel .fcheck svg{opacity:1;}
  .fcard.sel .fcheck:hover{background:var(--success-dim);border-color:#fff;transform:translate(-50%,-50%) scale(1.06);}
  /* at-cap: dim the circle */
  .fcard.atcap .fcheck{opacity:.28;cursor:not-allowed;}
  .fcard.atcap .fthumb:hover .fcheck{opacity:.4;}
  .fcard.atcap .fcheck:hover{transform:translate(-50%,-50%);background:transparent;}
  /* hover: darken + reveal name overlay */
  .fthumb::before{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .16s;
    background:linear-gradient(to top,rgba(6,8,16,.72) 0%,rgba(6,8,16,.10) 46%,rgba(6,8,16,.14) 100%);}
  .fthumb:hover::before{opacity:1;}
  /* footer */
  .fmeta{padding:9px 11px 10px;display:flex;align-items:center;gap:8px;min-width:0;}
  .fmeta .fm-tx{flex:1;min-width:0;}
  .fmeta .fn{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fmeta .fsub{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:1px;}
  .kebab{width:28px;height:28px;flex-shrink:0;border-radius:8px;border:1px solid transparent;background:none;color:var(--faint);
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;position:relative;}
  .kebab:hover{background:var(--panel-2);border-color:var(--line);color:var(--accent);}
  .kebab svg{width:16px;height:16px;}

  /* ---------- list view ---------- */
  .filelist{display:flex;flex-direction:column;gap:9px;}
  .filelist .fcard{flex-direction:row;align-items:center;gap:13px;border-radius:13px;padding:9px 13px;overflow:visible;}
  .filelist .fcard:hover{transform:none;}
  .lrow-check{flex:0 0 auto;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:var(--panel-2);
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .12s,background .12s;}
  .lrow-check svg{width:14px;height:14px;color:#fff;opacity:0;transition:opacity .12s;}
  .lrow-check:hover{border-color:var(--accent);}
  .fcard.sel .lrow-check{background:var(--success);border-color:var(--success);}
  .fcard.sel .lrow-check svg{opacity:1;}
  .fcard.atcap .lrow-check{opacity:.35;cursor:not-allowed;}
  .lrow-thumb{flex:0 0 auto;width:50px;height:50px;border-radius:10px;overflow:hidden;position:relative;background:var(--panel-2);
    display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .lrow-thumb .gradthumb{position:absolute;inset:0;} .lrow-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .lrow-thumb .docph{position:relative;z-index:2;color:var(--danger);} .lrow-thumb .docph svg{width:22px;height:22px;} .lrow-thumb .docph .pext{display:none;}
  .lrow-main{flex:1 1 auto;min-width:0;}
  .lrow-name{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}
  .lrow-name:hover{color:var(--accent);}
  .lrow-sub{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:2px;}
  .lrow-meta{flex:0 0 auto;font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap;}
  @media (max-width:560px){ .lrow-meta{display:none;} }

  /* ---------- empty state ---------- */
  .empty{grid-column:1/-1;text-align:center;padding:56px 20px;color:var(--muted);}
  .empty .ei{width:62px;height:62px;margin:0 auto 15px;border-radius:18px;display:flex;align-items:center;justify-content:center;
    background:var(--grad-soft);color:var(--accent);}
  .empty .ei svg{width:30px;height:30px;}
  .empty h3{margin:0 0 6px;font-size:16px;color:var(--ink);}
  .empty p{margin:0;font-size:13.5px;}

  /* ---------- bottom bar ---------- */
  .bottombar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--panel) 92%,transparent);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);box-shadow:0 -6px 26px rgba(20,24,44,.07);}
  html[data-theme="dark"] .bottombar{box-shadow:0 -6px 26px rgba(0,0,0,.4);}
  .bottombar-in{width:100%;max-width:none;margin:0 auto;padding:13px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .bb-remain{font-size:13.5px;font-weight:700;color:var(--ink);}
  .bb-remain b{color:var(--accent-dim);}
  html[data-theme="dark"] .bb-remain b{color:var(--accent);}
  .bb-limit{font-size:12.5px;color:var(--muted);text-align:center;flex:1;min-width:160px;}
  .bb-save{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--success-dim);}
  html[data-theme="dark"] .bb-save{color:var(--success);}
  .bb-save svg{width:16px;height:16px;}
  .bb-actions{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .finishbtn:not(:disabled){color:var(--success-dim);border-color:color-mix(in srgb,var(--success) 45%,var(--line));}
  .finishbtn:not(:disabled):hover{background:var(--success-soft);border-color:var(--success);color:var(--success-dim);}
  html[data-theme="dark"] .finishbtn:not(:disabled){color:var(--success);}
  .finishbtn.is-edit:not(:disabled){color:var(--muted);border-color:var(--line);}
  .finishbtn.is-edit:not(:disabled):hover{background:var(--panel-2);color:var(--accent-dim);border-color:var(--accent);}
  .finishbtn svg{width:16px;height:16px;}
  .dlzip{background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),linear-gradient(120deg,var(--success),var(--success-dim));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.14),0 6px 16px rgba(34,176,75,.30);}
  .dlzip svg{width:16px;height:16px;}
  .dlzip:disabled{opacity:.4;box-shadow:none;text-shadow:none;cursor:not-allowed;filter:saturate(.55);}
  .dlzip:disabled:hover{filter:saturate(.55);transform:none;}
  @media (max-width:680px){ .bb-limit{order:3;flex-basis:100%;text-align:start;} }

  /* ---------- modal / overlay ---------- */
  .overlay{position:fixed;inset:0;background:rgba(10,12,20,0.62);display:none;align-items:center;justify-content:center;
    padding:20px;z-index:80;}
  .overlay.show{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:460px;width:100%;
    padding:24px;box-shadow:var(--shadow-lg);position:relative;animation:pop .18s ease;}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:none;}}
  .modal h3{margin:0 0 12px;font-size:17px;padding-inline-end:32px;}
  .modal p{font-size:13.5px;color:var(--muted);margin:0 0 10px;line-height:1.6;}
  .mclose{position:absolute;top:16px;inset-inline-end:16px;width:32px;height:32px;padding:0;border-radius:9px;
    background:var(--panel-2);border:1px solid var(--line);color:var(--muted);cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s;}
  .mclose:hover{background:var(--line);color:var(--ink);}
  .mclose svg{width:17px;height:17px;}
  .helprow{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line-2);}
  .helprow:last-child{border-bottom:none;}
  .helprow .hi{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);color:var(--accent);}
  .helprow .hi svg{width:17px;height:17px;}
  .helprow .ht b{display:block;font-size:13.5px;color:var(--ink);margin-bottom:2px;}
  .helprow .ht span{font-size:12.5px;color:var(--muted);line-height:1.5;}
  .shrow{display:flex;gap:8px;margin-top:8px;}
  .shrow input{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;
    font-family:var(--mono);font-size:12.5px;padding:11px 12px;}
  .shrow input:focus{outline:none;border-color:var(--accent);}
  .mbtn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:11px;font-weight:600;
    font-size:13.5px;cursor:pointer;font-family:inherit;transition:filter .14s,transform .08s,background .12s;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);}
  .mbtn:active{transform:translateY(1px);}
  .mbtn.primary{border:none;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.18);
    background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--grad-btn);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 16px var(--grad-btn-glow);}
  .mbtn.primary:hover{filter:brightness(1.05);}
  .mbtn.danger{border:none;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.18);
    background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,0) 55%),var(--danger);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 16px rgba(229,72,77,.32);}
  .mbtn.danger:hover{filter:brightness(1.05);}
  .mbtn.ghost:hover{background:var(--panel-2);}
  .mactions{display:flex;gap:10px;margin-top:20px;}
  .mactions .mbtn{flex:1;}
  /* ---- people (face recognition) filter row + chips ---- */
  .peoplebar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 14px;}
  .peoplebar .chips{gap:8px;}
  .btnline.faceorg{color:var(--accent-dim);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));font-weight:700;}
  .btnline.faceorg:hover{background:var(--accent-soft);border-color:var(--accent);}
  html[data-theme="dark"] .btnline.faceorg{color:var(--accent);}
  .pchipwrap{display:inline-flex;align-items:center;}
  .pchip{padding-inline-start:5px;}
  .pchip .pav{width:22px;height:22px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--panel-2);}
  .pchip .pav.ph{display:inline-flex;align-items:center;justify-content:center;background:var(--grad);color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;}
  .pchip .pcount{font-style:normal;font-size:11px;color:var(--faint);font-family:var(--mono);margin-inline-start:2px;}
  .pchip.on .pcount{color:var(--accent-dim);}
  .pedit{width:26px;height:26px;margin-inline-start:-2px;padding:0;border:none;background:transparent;color:var(--faint);
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;opacity:.7;transition:opacity .12s,color .12s,background .12s;}
  .pedit:hover{opacity:1;color:var(--accent);background:var(--accent-soft);}
  .pedit svg{width:13px;height:13px;}
  body.manager .pedit,body.manager .pclear{display:none;}
  .pclear{height:30px;padding:0 12px;border-radius:999px;border:1px dashed var(--line);background:transparent;color:var(--muted);
    font-family:inherit;font-size:12px;cursor:pointer;transition:color .12s,border-color .12s;}
  .pclear:hover{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line));}
  .fprog{height:10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden;margin:6px 0 8px;}
  .fprog span{display:block;height:100%;width:0;background:var(--grad);transition:width .2s ease;}
  .fprogtxt{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;}

  /* ---------- lightbox ---------- */
  .lightbox{position:fixed;inset:0;background:rgba(6,8,16,0.9);display:none;flex-direction:column;z-index:90;}
  .lightbox.show{display:flex;}
  .lb-bar{display:flex;align-items:center;gap:12px;padding:15px 20px;color:#fff;}
  .lb-bar .lb-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;font-size:15px;}
  .lb-bar .lb-sub{font-family:var(--mono);font-size:11.5px;color:rgba(255,255,255,.6);}
  .lb-bar button{background:rgba(255,255,255,.12);border:none;color:#fff;cursor:pointer;border-radius:10px;width:40px;height:40px;
    display:flex;align-items:center;justify-content:center;transition:background .12s;}
  .lb-bar button:hover{background:rgba(255,255,255,.22);}
  .lb-bar button svg{width:18px;height:18px;}
  .lb-body{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 24px 28px;min-height:0;}
  .lb-body .lb-stage{max-width:min(90vw,1000px);width:100%;aspect-ratio:1/1;max-height:78vh;border-radius:14px;overflow:hidden;
    position:relative;box-shadow:0 20px 60px rgba(0,0,0,.55);background:#0b0d14;}
  .lb-body .lb-stage .gradthumb{position:absolute;inset:0;} .lb-body .lb-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .lb-pick{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;border:none;cursor:pointer;
    font-weight:700;font-size:14px;color:#fff;background:var(--grad-btn);box-shadow:0 6px 18px var(--grad-btn-glow);}
  .lb-pick.on{background:var(--success);box-shadow:0 6px 18px rgba(34,176,75,.4);}
  .lb-pick svg{width:17px;height:17px;}
  /* prev / next arrows shown while an image is enlarged */
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:52px;height:52px;border-radius:50%;
    border:none;cursor:pointer;background:rgba(255,255,255,.12);color:#fff;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;transition:background .12s,transform .12s;}
  .lb-nav:hover{background:rgba(255,255,255,.26);}
  .lb-nav:active{transform:translateY(-50%) scale(.93);}
  .lb-nav svg{width:26px;height:26px;}
  .lb-nav.lb-nav-l{inset-inline-start:18px;left:18px;} .lb-nav.lb-nav-r{inset-inline-end:18px;right:18px;}
  @media (max-width:560px){ .lb-nav{width:44px;height:44px;} .lb-nav svg{width:22px;height:22px;} .lb-nav.lb-nav-l{left:8px;} .lb-nav.lb-nav-r{right:8px;} }

  /* ---------- kebab popover ---------- */
  .popover{position:fixed;z-index:95;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;
    box-shadow:var(--shadow-lg);min-width:172px;display:none;}
  .popover.show{display:block;animation:pop .12s ease;}
  .popover button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border:none;background:none;cursor:pointer;
    border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;color:var(--ink-2);text-align:start;transition:background .1s;}
  .popover button:hover{background:var(--panel-2);color:var(--accent-dim);}
  .popover button.dz:hover{color:var(--danger);background:var(--danger-soft);}
  .popover button svg{width:15px;height:15px;flex-shrink:0;color:var(--muted);}
  .popover button:hover svg{color:inherit;}
  .popover .sepline{height:1px;background:var(--line-2);margin:4px 2px;}

  /* ---------- toast ---------- */
  .toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(14px);z-index:120;
    background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:999px;
    box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;
    max-width:88vw;text-align:center;display:inline-flex;align-items:center;gap:8px;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast svg{width:16px;height:16px;flex-shrink:0;}

  .poweredby{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin:26px auto 0;font-size:11.5px;
    color:var(--faint);font-family:var(--mono);letter-spacing:.02em;transition:opacity .12s;}
  .poweredby:hover{opacity:.72;} .poweredby img{height:18px;width:auto;display:block;}
  html[data-theme="dark"] .poweredby img{filter:brightness(1.12);}
  .pbwrap{text-align:center;}
  /* ---------- manager (read-only) view ---------- */
  .mgr-banner{display:flex;gap:14px;align-items:flex-start;margin:0 0 20px;padding:15px 18px;border-radius:16px;
    background:var(--grad-soft);border:1px solid var(--accent-soft);box-shadow:var(--shadow-sm);}
  html[data-theme="dark"] .mgr-banner{border-color:var(--line);}
  .mgr-banner .mgr-ic{width:42px;height:42px;flex:0 0 auto;border-radius:12px;display:flex;align-items:center;justify-content:center;
    background:var(--panel);border:1px solid var(--accent-soft);color:var(--accent-dim);}
  .mgr-banner .mgr-ic svg{width:22px;height:22px;}
  .mgr-badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:700;
    letter-spacing:.05em;text-transform:uppercase;color:var(--accent-dim);}
  .mgr-title{font-size:15.5px;font-weight:700;color:var(--ink);margin-top:3px;}
  .mgr-desc{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.55;max-width:82ch;}
  body.manager #addFilesBtn,
  body.manager #selectAllBtn,
  body.manager #moveSel,
  body.manager #deleteBtn,
  body.manager #addFolderBtn,
  body.manager #drop,
  body.manager .lb-pick,
  body.manager #popover [data-act="pick"],
  body.manager #popover [data-act="del"],
  body.manager #popover .sepline{display:none !important;}
  body.manager .fcheck,
  body.manager .lrow-check{pointer-events:none;}
  body.manager .fthumb:hover .fcheck{opacity:0;}
  body.manager .fcard.sel .fcheck{opacity:1;}
  body.manager .fcard:hover{transform:none;border-color:var(--line);box-shadow:var(--shadow);}
  .hidden{display:none !important;}
</style>

<body>
<div class="wrap">

  <!-- ============ manager (read-only) banner ============ -->

  function ls(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

  /* ---------------- persistence: uploaded files survive refresh / reopen / re-login ----------------
     The FILES / FOLDERS arrays above are only the demo gallery seed (no real bytes). Anything the
     client UPLOADS is persisted exactly the way the rest of the app does it (see request-store.js and
     processed-files.js): one metadata row per file in project-scoped localStorage, plus the raw bytes
     in IndexedDB. On load we rebuild the gallery from that store (not from the in-memory seed), so
     uploads never vanish. Bytes are written to storage FIRST; only on success is the metadata row
     recorded, so a row can never point at missing bytes. */
  const SEL_STORE = (function(){
    const META_KEY='kolkli_select_files', FOLDER_KEY='kolkli_select_folders', DB_NAME='kolkli_select', DB_STORE='blobs';
    function safeId(v){ return String(v==null?'':v).toLowerCase().replace(/[^a-z0-9_.@-]+/g,'_') || 'guest'; }
    // Owner = the studio account when signed in (recorded on each row as the User ID). Not part of the
    // storage key on purpose: the client uploads with no login, and we must NOT lose their files if the
    // studio later opens the same gallery signed in. The PROJECT is what scopes storage.
    function ownerId(){
      const email=(ls('ac_session')||'').toLowerCase(); if(!email) return 'guest';
      try{ const users=JSON.parse(ls('ac_users')||'[]')||[];
        for(let i=0;i<users.length;i++){ if((users[i].email||'').toLowerCase()===email) return safeId(users[i].id||users[i].userId||email); }
      }catch(e){}
      return safeId(email);
    }
    // Project scope from the URL (?p= / ?project= / ?id= / ?token=) so a gallery ALWAYS saves and loads
    // under the same key. One function feeds both save and fetch, so they can never disagree.
    function projectId(){
      try{ const q=new URLSearchParams(location.search); return safeId(q.get('p')||q.get('project')||q.get('id')||q.get('token')||'default'); }
      catch(e){ return 'default'; }
    }
    const S={}; S.ownerId=ownerId; S.projectId=projectId;
    S.scope=function(){ return projectId(); };
    function metaKey(){ return META_KEY+'::'+S.scope(); }
    function folderKey(){ return FOLDER_KEY+'::'+S.scope(); }
    S.readMeta=function(){ try{ const a=JSON.parse(ls(metaKey())||'[]'); return Array.isArray(a)?a:[]; }catch(e){ console.error('[select] readMeta failed',e); return []; } };
    S.writeMeta=function(a){ try{ lsSet(metaKey(),JSON.stringify(a||[])); }catch(e){ console.error('[select] writeMeta failed',e); } };
    S.readFolders=function(){ try{ const a=JSON.parse(ls(folderKey())||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } };
    S.writeFolders=function(a){ try{ lsSet(folderKey(),JSON.stringify(a||[])); }catch(e){ console.error('[select] writeFolders failed',e); } };
    S.persistFolder=function(id,label){ const a=S.readFolders(); if(!a.some(x=>x.id===id)){ a.push({id:id,label:label}); S.writeFolders(a); } };
    function idb(){ return new Promise((res,rej)=>{ let r; try{ r=indexedDB.open(DB_NAME,2); }catch(e){ rej(e); return; }
      r.onupgradeneeded=()=>{ const db=r.result;
        if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);   // 'blobs' (file bytes) — unchanged
        if(!db.objectStoreNames.contains('faces')) db.createObjectStore('faces'); };  // face detections/embeddings cache
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
    S.putBlob=function(k,v){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction(DB_STORE,'readwrite'); tx.objectStore(DB_STORE).put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); })); };
    S.getBlob=function(k){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction(DB_STORE,'readonly'); const rq=tx.objectStore(DB_STORE).get(k); rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error); })); };
    S.delBlob=function(k){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction(DB_STORE,'readwrite'); tx.objectStore(DB_STORE).delete(k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); })).catch(()=>{}); };
    // Face-recognition cache: {blobKey, modelVersion, faces:[{bbox,score,embedding,thumb}]} keyed by blobKey.
    // Computed at most once per image (see the FACE module) and kept in the same DB as the file bytes.
    const FACE_STORE='faces';
    S.putFaces=function(k,v){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction(FACE_STORE,'readwrite'); tx.objectStore(FACE_STORE).put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); })); };
    S.getFaces=function(k){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction(FACE_STORE,'readonly'); const rq=tx.objectStore(FACE_STORE).get(k); rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error); })); };
    S.delFaces=function(k){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction(FACE_STORE,'readwrite'); tx.objectStore(FACE_STORE).delete(k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); })).catch(()=>{}); };
    S.clearFaces=function(){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction(FACE_STORE,'readwrite'); tx.objectStore(FACE_STORE).clear(); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); })).catch(()=>{}); };
    return S;
  })();
  // The client's "I've finished picking" flag — persisted per project so it survives refresh/reopen,
  // exactly like the uploaded bytes above. This is what flips the download button from pale to active.
  const DONE_KEY='kolkli_select_done';
  function selReadDone(){ try{ return ls(DONE_KEY+'::'+SEL_STORE.scope())==='1'; }catch(e){ return false; } }
  function selWriteDone(v){ try{ lsSet(DONE_KEY+'::'+SEL_STORE.scope(), v?'1':'0'); }catch(e){} }
  // The client's chosen file ids — persisted per project (like the done flag and the uploaded
  // bytes) so a refresh/reopen restores the exact picks instead of falling back to the seed.
  const PICKS_KEY='kolkli_select_picks';
  function selReadPicks(){ try{ const a=JSON.parse(ls(PICKS_KEY+'::'+SEL_STORE.scope())||'null'); return Array.isArray(a)?a:null; }catch(e){ return null; } }
  function selWritePicks(){ try{ lsSet(PICKS_KEY+'::'+SEL_STORE.scope(), JSON.stringify(Array.from(selected))); }catch(e){} }
  function extOf(n){ const m=/\.([a-z0-9]+)$/i.exec(n||''); return m?m[1].toUpperCase():'FILE'; }
  function fmtSize(mb){ if(mb>=1) return mb.toFixed(1)+' MB'; return Math.round(mb*1024)+' KB'; }
  function mmss(s){ s=Math.max(0,Math.floor(s||0)); const m=Math.floor(s/60), r=s%60; return m+':'+String(r).padStart(2,'0'); }
  function pad3(n){ return String(n).padStart(3,'0'); }
  function nf(n){ try{ return n.toLocaleString(lang==='he'?'he-IL':lang==='ru'?'ru-RU':'en-US'); }catch(e){ return String(n); } }
  function counts(){ let i=0,v=0; selected.forEach(id=>{ const f=FILES.find(x=>x.id===id); if(!f) return; if(f.kind==='image') i++; else if(f.kind==='video') v++; }); return {i,v}; }

  // rich abstract "bokeh" thumbnail so the demo reads like real photography without external assets
  function gradStyle(hue){
    const h=hue, h2=(hue+38)%360, h3=(hue+318)%360;
    return `background:`+
      `radial-gradient(120% 90% at 22% 16%, hsl(${h2} 88% 74% / .95), transparent 55%),`+
      `radial-gradient(120% 110% at 84% 24%, hsl(${h} 82% 60% / .95), transparent 60%),`+
      `radial-gradient(150% 130% at 60% 108%, hsl(${h3} 72% 42% / .96), transparent 72%),`+
      `linear-gradient(155deg, hsl(${h} 56% 42%), hsl(${h2} 62% 28%));`;
  }
  function thumbInner(f){
    if(f.kind==='doc'){
      return `<div class="docph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2v6h6"/><path d="M4 2h10l6 6v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/></svg><span class="pext">${esc(extOf(f.name))}</span></div>`;
    }
    if(f.url){ return `<img src="${esc(f.url)}" alt="${esc(f.name)}">`; }
    return `<div class="gradthumb" style="${gradStyle(f.hue)}"></div>`;
  }

  /* ---------------- filtering ---------------- */
  function visible(){
    return FILES.filter(f=>{
      if(activeAlbum!=='all' && f.album!==activeAlbum) return false;
      if(activeChip){
        if(activeChip==='selected'){ if(!selected.has(f.id)) return false; }
        else if(activeChip==='yael'){ if(!f.tags.includes('yael')) return false; }
        else if(f.kind!==activeChip) return false;
      }
      if(activePerson){
        const set = PEOPLE_SETS[activePerson];
        if(!set || !f.blobKey || !set.has(f.blobKey)) return false;   // person filter → only analysed uploads match
      }
      if(query && !f.name.toLowerCase().includes(query)) return false;
      return true;
    });
  }
  function atCap(f){
    if(selected.has(f.id)) return false;
    const c=counts();
    if(f.kind==='image') return c.i>=IMG_CAP;
    if(f.kind==='video') return c.v>=VID_CAP;
    return false; // docs are unlimited / not quota'd
  }

  /* ---------------- render: grid / list ---------------- */
  function cardHtml(f, i){
    const sel = selected.has(f.id);
    const cap = atCap(f);
    const badge = `<span class="badge">${pad3(i+1)}</span>`;
    const film = f.kind==='video' ? `<span class="filmstrip"></span>` : '';
    const dur = f.kind==='video' ? `<span class="dur"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>${mmss(f.dur)}</span>` : '';
    return `<div class="fcard${sel?' sel':''}${cap?' atcap':''}" data-id="${f.id}">
      <div class="fthumb" data-open="${f.id}">
        ${thumbInner(f)}
        ${badge}${film}${dur}
        <div class="fcheck" data-pick="${f.id}" role="button" aria-label="select">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
      </div>
      <div class="fmeta">
        <div class="fm-tx">
          <div class="fn" title="${esc(f.name)}">${esc(f.name)}</div>
          <div class="fsub"><bdi>${esc(fmtSize(f.mb))}</bdi></div>
        </div>
        <button class="kebab" data-kebab="${f.id}" type="button" aria-label="more"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>
      </div>
    </div>`;
  }
  function rowHtml(f){
    const sel = selected.has(f.id);
    const cap = atCap(f);
    const sub = f.kind==='video' ? `${extOf(f.name)} · ${mmss(f.dur)}` : extOf(f.name);
    return `<div class="fcard${sel?' sel':''}${cap?' atcap':''}" data-id="${f.id}">
      <div class="lrow-check" data-pick="${f.id}" role="button" aria-label="select"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
      <div class="lrow-thumb" data-open="${f.id}">${thumbInner(f)}</div>
      <div class="lrow-main"><div class="lrow-name" data-open="${f.id}" title="${esc(f.name)}">${esc(f.name)}</div><div class="lrow-sub"><bdi>${esc(sub)}</bdi></div></div>
      <div class="lrow-meta"><bdi>${esc(fmtSize(f.mb))}</bdi></div>
      <button class="kebab" data-kebab="${f.id}" type="button" aria-label="more"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>
    </div>`;
  }
  function renderGrid(){
    const g = el('grid');
    const items = visible();
    g.className = view==='grid' ? 'filegrid' : 'filelist';
    if(!items.length){
      g.innerHTML = `<div class="empty"><div class="ei"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></div><h3>${esc(t.emptyT)}</h3><p>${esc(t.emptyP)}</p></div>`;
      return;
    }
    g.innerHTML = items.map(view==='grid'?cardHtml:rowHtml).join('');
  }

  /* ---------------- render: stats + bars + bottom bar ---------------- */
  // animated count-up for the stat numbers (respects reduced-motion; snaps on first paint / big jumps)
  const _shown = {};
  const _reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  function animNum(id, to, fmt){
    fmt = fmt || (n=>String(n));
    const node = el(id); if(!node) return;
    const from = _shown[id]; _shown[id] = to;
    if(from == null || from === to || _reduceMotion || Math.abs(to-from) > 400){ node.textContent = fmt(to); return; }
    const dur = 380, start = performance.now(), delta = to - from;
    (function step(now){
      const p = Math.min(1, (now-start)/dur), e = 1 - Math.pow(1-p, 3);
      node.textContent = fmt(Math.round(from + delta*e));
      if(p < 1) requestAnimationFrame(step);
    })(performance.now());
  }
  // set a progress bar width + amber (≥80%) / red (at cap) warning state
  function setBar(id, ratio){
    const span = el(id); if(!span) return;
    ratio = Math.max(0, Math.min(1, ratio));
    span.style.width = (ratio*100)+'%';
    const bar = span.parentElement;
    bar.classList.toggle('near', ratio >= 0.8 && ratio < 1);
    bar.classList.toggle('full', ratio >= 1);
  }
  function updateStats(){
    const c = counts();
    const total = c.i + c.v, cap = IMG_CAP + VID_CAP;
    el('totalMax').textContent = cap;
    el('vidMax').textContent = VID_CAP;
    el('imgMax').textContent = IMG_CAP;
    animNum('totalCur', total);
    animNum('vidCur', c.v);
    animNum('imgCur', c.i);
    animNum('galTotal', galleryTotal, nf);
    setBar('vidBar', c.v/VID_CAP);
    setBar('imgBar', c.i/IMG_CAP);

    // bottom bar
    const ri = Math.max(0, IMG_CAP-c.i), rv = Math.max(0, VID_CAP-c.v);
    el('bbRemain').innerHTML = (ri===0&&rv===0) ? esc(t.remainDone)
      : t.remainLine('<b>'+ri+'</b>','<b>'+rv+'</b>');
    el('bbLimit').textContent = t.limitLine;

    // toolbar buttons enabled by selection
    const has = selected.size>0;
    el('deleteBtn').disabled = !has;
    el('moveSel').disabled = !has;
  }

  /* ---------------- sidebar ---------------- */
  function renderFolders(){
    el('folders').innerHTML = FOLDERS.map((f,idx)=>{
      const on = f.id===activeAlbum;
      const extra = idx>=6 ? ' extra'+(foldersExpanded?' show':'') : '';
      const ic = f.id==='all'
        ? '<svg class="fi-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>'
        : '<svg class="fi-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>';
      return `<div class="fitem${on?' on':''}${extra}" data-album="${f.id}">${ic}<span class="fi-name">${esc(t[f.key]||f.key)}</span><span class="fi-count">${nf(f.count)}</span></div>`;
    }).join('');
    // show/hide the "show more" control only when there are extra folders
    el('showMoreBtn').style.display = FOLDERS.length>6 ? '' : 'none';
    el('showMoreBtn').classList.toggle('open', foldersExpanded);
    el('showMoreBtn').querySelector('span').textContent = foldersExpanded ? t.showLess : t.showMore;
  }
  function renderChips(){
    el('chips').innerHTML = CHIPS.map(c=>{
      const on = c.id===activeChip;
      const av = c.avatar ? `<span class="dotc">${esc((t[c.key]||'?').charAt(0))}</span>` : '';
      return `<button class="chip${on?' on':''}" type="button" data-chip="${c.id}">${av}<span>${esc(t[c.key]||c.key)}</span></button>`;
    }).join('');
  }
  function renderMoveSel(){
    const opts = FOLDERS.filter(f=>f.id!=='all')
      .map(f=>`<option value="${f.id}">${esc(t[f.key]||f.key)}</option>`).join('');
    el('moveSel').innerHTML = `<option value="" selected disabled>${esc(t.moveDefault)}</option>${opts}`;
  }

  /* ---------------- selection ---------------- */
  function togglePick(id){ if(MANAGER) return;
    const f = FILES.find(x=>x.id===id); if(!f) return;
    if(selected.has(id)){ selected.delete(id); }
    else{
      const c = counts();
      if(f.kind==='image' && c.i>=IMG_CAP){ toast(t.capImg,'warn'); return; }
      if(f.kind==='video' && c.v>=VID_CAP){ toast(t.capVid,'warn'); return; }
      selected.add(id);
    }
    markDirty();
    refreshAll();
  }
  function selectAll(){ if(MANAGER) return;
    const items = visible();
    let c = counts(), changed=false;
    for(const f of items){
      if(selected.has(f.id)) continue;
      if(f.kind==='image'){ if(c.i>=IMG_CAP) continue; selected.add(f.id); c.i++; changed=true; }
      else if(f.kind==='video'){ if(c.v>=VID_CAP) continue; selected.add(f.id); c.v++; changed=true; }
      else { selected.add(f.id); changed=true; }
    }
    if(!changed) toast(t.allSelected,'ok'); else markDirty();
    refreshAll();
  }
  function deleteSelected(){ if(MANAGER) return;
    const n = selected.size; if(!n) return;
    openConfirm(t.delTitle, t.delSub(n), t.delConfirm, t.delCancel, ()=>{
      const _removed=[];
      FILES = FILES.filter(f=>{
        if(!selected.has(f.id)) return true;
        // decrement catalog counts
        galleryTotal = Math.max(0, galleryTotal-1);
        const fol = FOLDERS.find(x=>x.id===f.album); if(fol) fol.count=Math.max(0,fol.count-1);
        if(f.url){ try{ URL.revokeObjectURL(f.url); }catch(e){} }
        if(f.uploaded) _removed.push(f.id);
        return false;
      });
      selRemove(_removed);   // stored rows + blobs go too, so the delete survives a reload
      selected.clear(); markDirty();
      closeOverlay(); toast(t.deleted(n),'ok'); refreshAll();
    });
  }
  function moveSelected(dest){ if(MANAGER) return;
    const n = selected.size; if(!n || !dest) return;
    const folder = FOLDERS.find(f=>f.id===dest); const label = folder ? (t[folder.key]||folder.key) : dest;
    selected.forEach(id=>{ const f=FILES.find(x=>x.id===id); if(f && f.album!==dest){
      const from=FOLDERS.find(x=>x.id===f.album); if(from) from.count=Math.max(0,from.count-1);
      f.album=dest; if(folder) folder.count++;
    }});
    el('moveSel').value=''; selSyncAlbums(); toast(t.moved(n,label),'ok'); refreshAll();
  }

  function refreshAll(){ renderGrid(); renderFolders(); renderChips(); renderPeople(); updateStats(); updateBottomActions(); }

  /* ---------------- finish selection + download-as-zip ----------------
     Requirement: once the client has FINISHED picking (explicit "I'm done" button), show an active
     download button that zips every selected file. While they are still picking, that button stays
     visible but disabled in a pale colour. Any change to the picked set re-opens the selection. */
  function markDirty(){ if(finished){ finished=false; selWriteDone(false); } selWritePicks(); }

  function toggleFinish(){ if(MANAGER) return;
    if(!finished){
      if(selected.size===0){ toast(t.needPick,'warn'); return; }
      finished=true; selWriteDone(true); toast(t.selDone,'ok');
    } else {
      finished=false; selWriteDone(false);   // reopen for editing
    }
    updateBottomActions();
  }

  function updateBottomActions(){
    const has=selected.size>0;
    const fb=el('finishBtn'), fl=el('finishLbl'), db=el('dlZipBtn'), dl=el('dlZipLbl');
    if(fb){
      fb.classList.toggle('is-edit', finished);
      if(fl) fl.textContent = finished ? t.editSelect : t.finishSelect;
      fb.disabled = MANAGER ? true : (finished ? false : !has);   // studio view is read-only
    }
    if(db){
      const ready = finished && has;
      db.disabled = !ready;
      db.setAttribute('aria-disabled', ready?'false':'true');
      db.title = ready ? '' : t.finishFirst;
      if(dl && !db.dataset.busy) dl.textContent = t.downloadZip;
    }
  }

  function triggerDownload(blob, name){
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=name||'download';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ a.remove(); try{ URL.revokeObjectURL(url); }catch(_){} }, 1500);
  }
  function baseName(n){ return String(n||'file').replace(/\.[^.\/]+$/,''); }

  // Demo-gallery seed files carry no real bytes (only client UPLOADS do). Synthesise a labelled
  // placeholder that mirrors the on-screen bokeh thumbnail so a demo zip is never empty/broken.
  function placeholderFile(f){
    return new Promise(resolve=>{
      if(f.kind==='doc'){
        const note=(lang==='he'?'קובץ הדגמה מהגלריה (ללא תוכן אמיתי).':lang==='ru'?'Демонстрационный файл галереи (без реального содержимого).':'Demo gallery placeholder (no real content).');
        resolve({ blob:new Blob(['KOLKLI — '+f.name+'\r\n\r\n'+note],{type:'text/plain'}), name:baseName(f.name)+'.txt' }); return;
      }
      try{
        const W=1280,H=854, c=document.createElement('canvas'); c.width=W; c.height=H;
        const g=c.getContext('2d'); const h=(((f.hue||210)%360)+360)%360;
        const blob360=(cx,cy,r,hue,a)=>{ const rg=g.createRadialGradient(cx,cy,0,cx,cy,r); rg.addColorStop(0,'hsla('+hue+',82%,64%,'+a+')'); rg.addColorStop(1,'hsla('+hue+',82%,64%,0)'); g.fillStyle=rg; g.fillRect(0,0,W,H); };
        g.fillStyle='hsl('+((h+318)%360)+',60%,32%)'; g.fillRect(0,0,W,H);
        blob360(W*0.22,H*0.16,W*0.72,(h+38)%360,0.95);
        blob360(W*0.84,H*0.24,W*0.75,h,0.9);
        blob360(W*0.6,H*1.08,W*0.9,(h+318)%360,0.95);
        if(f.kind==='video'){
          g.fillStyle='rgba(255,255,255,.92)'; g.beginPath(); g.arc(W/2,H/2-40,74,0,Math.PI*2); g.fill();
          g.fillStyle='hsl('+h+',70%,38%)'; g.beginPath(); g.moveTo(W/2-24,H/2-80); g.lineTo(W/2-24,H/2-0); g.lineTo(W/2+44,H/2-40); g.closePath(); g.fill();
        }
        g.fillStyle='rgba(0,0,0,.30)'; g.fillRect(0,H-150,W,150);
        g.fillStyle='#fff'; g.textBaseline='middle'; g.font='600 46px system-ui,Segoe UI,Arial,sans-serif';
        g.fillText(f.name, 54, H-75, W-108);
        c.toBlob(b=>{ resolve({ blob:b||new Blob([f.name],{type:'text/plain'}), name:baseName(f.name)+'.png' }); },'image/png',0.9);
      }catch(e){ resolve({ blob:new Blob([f.name],{type:'text/plain'}), name:baseName(f.name)+'.txt' }); }
    });
  }

  async function fileBlobForZip(f){
    if(f && (f.uploaded || f.blobKey)){
      try{ const b=await SEL_STORE.getBlob(f.blobKey||f.id); if(b) return { blob:b, name:f.name }; }
      catch(e){ console.warn('[select] getBlob for zip failed', f && f.name, e); }
    }
    return placeholderFile(f);
  }

  async function downloadZip(){
    if(MANAGER && !finished) return;
    if(!finished || !selected.size) return;
    const db=el('dlZipBtn'), dl=el('dlZipLbl');
    if(db.dataset.busy) return;
    const ids=Array.from(selected);
    db.dataset.busy='1'; db.disabled=true; if(dl) dl.textContent=t.zipping;
    try{
      const items=[];
      for(const id of ids){ const f=FILES.find(x=>x.id===id); if(f) items.push(await fileBlobForZip(f)); }
      if(!items.length){ toast(t.dlFail,'warn'); return; }
      if(window.JSZip){
        const zip=new JSZip(), used={};
        items.forEach(it=>{ const base=baseName(it.name), ext=it.name.slice(base.length); let n=it.name,i=2; while(used[n]){ n=base+' ('+i+')'+ext; i++; } used[n]=1; zip.file(n, it.blob); });
        const out=await zip.generateAsync({type:'blob'});
        triggerDownload(out, 'kolkli-selection.zip');
      } else {
        items.forEach((it,i)=>setTimeout(()=>triggerDownload(it.blob, it.name), i*250));  // no zip lib -> spaced singles
      }
      toast(t.dlDone,'ok');
    }catch(e){ console.error('[select] zip build failed', e); toast(t.dlFail,'warn'); }
    finally{ delete db.dataset.busy; if(dl) dl.textContent=t.downloadZip; updateBottomActions(); }
  }

  /* ---------------- persistence wiring (uploads only) ---------------- */
  // Store one uploaded file: bytes to IndexedDB FIRST, then the metadata row. If storage fails we roll
  // the file back out of the in-memory gallery so what is on screen always matches what will reload.
  function selPersistUploaded(f, file){
    return SEL_STORE.putBlob(f.blobKey, file).then(()=>{
      const rec={ id:f.id, name:f.name, kind:f.kind, album:f.album, mb:f.mb, dur:f.dur||0, tags:f.tags||[], hue:f.hue,
                  blobKey:f.blobKey, ownerId:SEL_STORE.ownerId(), projectId:SEL_STORE.projectId(), status:'stored', createdAt:Date.now() };
      const arr=SEL_STORE.readMeta(); arr.unshift(rec); SEL_STORE.writeMeta(arr);
      console.info('[select] saved upload', rec.name, '-> project', SEL_STORE.scope(), 'folder', rec.album);
      return rec;
    }).catch(e=>{
      console.error('[select] upload persist FAILED for', f.name, e);
      FILES=FILES.filter(x=>x.id!==f.id); galleryTotal=Math.max(0,galleryTotal-1);
      const fol=FOLDERS.find(x=>x.id===f.album); if(fol) fol.count=Math.max(0,fol.count-1);
      if(f.url){ try{ URL.revokeObjectURL(f.url); }catch(_){} }
      toast((lang==='he'?'\u05dc\u05d0 \u05e0\u05d9\u05ea\u05df \u05dc\u05e9\u05de\u05d5\u05e8 \u05d0\u05ea \u05d4\u05e7\u05d5\u05d1\u05e5: ':lang==='ru'?'\u041d\u0435 \u0443\u0434\u0430\u043b\u043e\u0441\u044c \u0441\u043e\u0445\u0440\u0430\u043d\u0438\u0442\u044c \u0444\u0430\u0439\u043b: ':'Could not save file: ')+f.name,'warn'); refreshAll();
      return null;
    });
  }
  // Mirror in-memory album moves onto the stored rows (same folder id on save and on fetch).
  function selSyncAlbums(){
    const arr=SEL_STORE.readMeta(); if(!arr.length) return; let changed=false;

  // Drop stored rows + blobs for deleted uploads so a delete also survives a reload.
  function selRemove(ids){
    if(!ids||!ids.length) return;
    const drop={}; ids.forEach(id=>{ drop[id]=1; });
    const arr=SEL_STORE.readMeta(); const keep=arr.filter(r=>!drop[r.id]);
    if(keep.length!==arr.length) SEL_STORE.writeMeta(keep);
    const goneKeys=[];
    arr.forEach(r=>{ if(drop[r.id]){ const bk=r.blobKey||r.id; SEL_STORE.delBlob(bk); goneKeys.push(bk); } });
    try{ FACE.prune(goneKeys); }catch(e){}   // drop cached faces + prune people for the deleted uploads
  }
  // Keep the id counter ahead of any restored id so new uploads never collide with rehydrated ones.
  function selBumpUid(id){ const m=String(id||'').match(/[0-9]+$/); if(m){ const n=parseInt(m[0],10); if(n>uid) uid=n; } }
  // On load: rebuild uploaded folders + files from the store (req: fetch from storage, not memory).
  function selHydrate(){
    let folders=[], meta=[];
    try{ folders=SEL_STORE.readFolders(); meta=SEL_STORE.readMeta(); }
    catch(e){ console.error('[select] hydrate read failed', e); return; }
    folders.forEach(fo=>{ if(fo && fo.id && !FOLDERS.some(x=>x.id===fo.id)){
      FOLDERS.push({ id:fo.id, key:'__'+fo.id, count:0 });
      I18N.he['__'+fo.id]=fo.label; I18N.en['__'+fo.id]=fo.label; I18N.ru['__'+fo.id]=fo.label; t['__'+fo.id]=fo.label;
      selBumpUid(fo.id);
    }});
    console.info('[select] hydrate:', meta.length, 'stored file(s), project', SEL_STORE.scope());
    const restores=[];
    meta.slice().reverse().forEach(rec=>{ // oldest first so unshift restores newest-on-top order
      if(!rec || !rec.id || FILES.some(x=>x.id===rec.id)) return;
      const f={ id:rec.id, name:rec.name, kind:rec.kind, album:rec.album, mb:rec.mb, dur:rec.dur||0,
                tags:rec.tags||[], url:null, hue:rec.hue, blobKey:rec.blobKey||rec.id, uploaded:true };
      if(!FOLDERS.some(x=>x.id===f.album)) f.album=(activeAlbum!=='all'?activeAlbum:'more');
      FILES.unshift(f); galleryTotal++;
      const fol=FOLDERS.find(x=>x.id===f.album); if(fol) fol.count++;
      selBumpUid(rec.id);
      if(f.kind==='image'){
        restores.push(SEL_STORE.getBlob(f.blobKey).then(blob=>{ if(blob){ try{ f.url=URL.createObjectURL(blob); }catch(_){} } })
          .catch(e=>{ console.error('[select] getBlob failed', rec.name, e); }));
      }
    });
    if(restores.length) Promise.all(restores).then(()=>refreshAll()).catch(()=>{});
  }

  /* ---------------- add files (upload button + drag-drop of files or folders) ---------------- */
  // A dropped/selected folder is preserved as albums: one album per sub-folder path (the album
  // model here is flat, so the original tree is captured as album names like "Trip/Day1").
  function pathItems(list){ return Array.from(list||[]).map(f=>({file:f, path:f.webkitRelativePath||f.name})); }
  function ensureAlbumByPath(dirPath){
    if(!dirPath) return activeAlbum!=='all' ? activeAlbum : 'more';
    let found = FOLDERS.find(f=>(t[f.key]||f.key)===dirPath);   // reuse an existing album of the same name
    if(found) return found.id;
    const id='fol'+(++uid);
    FOLDERS.push({ id, key:'__'+id, count:0 });
    I18N.he['__'+id]=dirPath; I18N.en['__'+id]=dirPath; I18N.ru['__'+id]=dirPath; t['__'+id]=dirPath;
    foldersExpanded=true;
    SEL_STORE.persistFolder(id, dirPath);
    return id;
  }
  function handleFiles(items){ if(MANAGER) return;
    const arr = (items||[]); if(!arr.length) return;
    arr.forEach(it=>{
      const file = it.file || it;
      const rel = (it.path || file.webkitRelativePath || file.name);
      const segs = String(rel).split('/').filter(Boolean); segs.pop();   // strip filename -> folder path
      const dest = segs.length ? ensureAlbumByPath(segs.join('/')) : (activeAlbum!=='all' ? activeAlbum : 'more');
      let kind='doc';
      if(/^image\//.test(file.type)) kind='image';
      else if(/^video\//.test(file.type)) kind='video';
      const f = mk(file.name, kind, dest, Math.max(0.01, file.size/1048576), 0, []);
      if(kind==='image'){ try{ f.url=URL.createObjectURL(file); }catch(e){} }
      f.blobKey=f.id; f.uploaded=true;
      FILES.unshift(f);
      galleryTotal++;
      const fol=FOLDERS.find(x=>x.id===dest); if(fol) fol.count++;
      selPersistUploaded(f, file);   // persist bytes to storage + metadata row (never lost on reload)
    });
    toast(t.added(arr.length),'ok');
    renderMoveSel(); refreshAll();
  }

  // walk dropped directories via the entries API so whole folders keep their tree
  async function addFromDataTransfer(dt){
    let items;
    try{ items = await filesFromDataTransfer(dt); }
    catch(_){ items = pathItems(dt.files); }
    handleFiles(items);
  }
  function filesFromDataTransfer(dt){
    const list = dt.items ? Array.from(dt.items) : [];
    const entries = list.map(it=> it.webkitGetAsEntry ? it.webkitGetAsEntry() : null).filter(Boolean);
    if(!entries.length){ return Promise.resolve(pathItems(dt.files)); }
    const out=[];
    return Promise.all(entries.map(en=>walkEntry(en,'',out))).then(()=>out);
  }
  function walkEntry(entry, prefix, out){
    return new Promise(resolve=>{
      if(!entry){ resolve(); return; }
      if(entry.isFile){ entry.file(f=>{ out.push({file:f, path:prefix+entry.name}); resolve(); }, ()=>resolve()); }
      else if(entry.isDirectory){
        const reader=entry.createReader(), kids=[];
        const readBatch=()=>reader.readEntries(batch=>{
          if(!batch.length){ Promise.all(kids.map(k=>walkEntry(k, prefix+entry.name+'/', out))).then(resolve); }
          else { kids.push(...batch); readBatch(); }
        }, ()=>resolve());
        readBatch();
      } else resolve();
    });
  }
