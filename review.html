<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOLKLI — Client Review</title>
<meta name="description" content="Send work to your client for sign-off — share a private, branded link, collect comments, and get approval.">
<style>
  :root {
    --bg:#eef0f6; --panel:#ffffff; --panel-2:#f5f6fa; --line:#e5e8f0; --line-2:#eef0f6;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#7c3aed; --accent-dim:#6a2fe0; --accent-ink:#ffffff; --accent-soft:#efe9fe;
    --success:#22b04b; --success-dim:#1c9a41; --success-soft:#e6f6ec;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --danger:#e5484d; --danger-soft:#fdecec;
    --warm-soft:#fff5da; --warm-line:#f2d98a;
    --ok:#22b04b; --warn:#c88a04; --err:#e5484d;
    --grad:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-h:linear-gradient(105deg,#6a29e6 0%,#2f74f0 100%);
    --grad-soft:linear-gradient(120deg,#efe9fe,#e6f0ff);
    --grad-shadow:rgba(93,79,240,0.30);
    --grad-btn:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn-glow:rgba(59,111,246,0.38);
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-lg:0 2px 6px rgba(20,24,44,0.05), 0 20px 50px rgba(20,24,44,0.10);
    --shadow-sm:0 1px 2px rgba(20,24,44,0.05);
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --sans:'Space Grotesk',system-ui,'Segoe UI','Heebo',sans-serif;
  }
  html[data-theme="dark"] {
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a303c; --line-2:#232833;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --accent:#a06bff; --accent-dim:#7c3aed; --accent-ink:#ffffff; --accent-soft:#241a3a;
    --success:#37c26a; --success-dim:#2fae5e; --success-soft:#132a1c;
    --info:#5b95f8; --info-dim:#4f8ef7; --info-soft:#182338;
    --danger:#ff6b6b; --danger-soft:#2a1719;
    --warm-soft:#2c2718; --warm-line:#5a4d24;
    --ok:#4ec98a; --warn:#e8b84b; --err:#ff6b6b;
    --grad:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-h:linear-gradient(105deg,#9a63ff 0%,#6aa2ff 100%);
    --grad-soft:linear-gradient(120deg,#1c1633,#11242a);
    --grad-shadow:rgba(77,123,255,0.42);
    --grad-btn:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn-glow:rgba(77,123,255,0.45);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,0.45), 0 24px 60px rgba(0,0,0,0.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;overflow-x:clip;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;}
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:var(--grad);z-index:100;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--sans);}
  .wrap{width:100%;max-width:none;margin:0 auto;padding:16px 0 18px;}
  @media (max-width:840px){ .wrap{width:100%;max-width:none;padding:18px 14px 48px;} }

  /* page intro */
  .pagehead{text-align:center;margin:0 auto 12px;}
  .pagehead h2{font-size:clamp(25px,3.3vw,34px);font-weight:700;letter-spacing:-0.02em;margin:0 0 6px;}
  .pagehead .kick{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:13px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);
    padding:4px 11px;border-radius:999px;margin-bottom:11px;}
  .pagehead p{font-size:16px;color:var(--muted);margin:0 auto;max-width:70ch;}

  /* tabs */
  .tabs{display:flex;width:max-content;max-width:100%;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin:0 auto 14px;box-shadow:var(--shadow-sm);}
  .tab{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border:none;border-radius:9px;background:transparent;
    color:var(--muted);cursor:pointer;font-size:15px;font-weight:600;transition:color .14s,background .14s,box-shadow .14s;}
  .tab.on{background:var(--accent-soft);color:var(--accent-dim);box-shadow:var(--shadow-sm);}
  .tab svg{width:16px;height:16px;}
  .tab .count{font-family:var(--mono);font-size:12.5px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--muted);}
  .tab.on .count{background:var(--panel);color:var(--accent-dim);}
  #tabManage{order:0;}
  #tabCreate{order:1;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,280px);gap:16px;align-items:start;}
  @media (max-width:840px){ .grid{grid-template-columns:1fr;} }
  .col{min-width:0;}
  .hidden{display:none !important;}

  /* form */
  .form{padding:20px;}
  .form h3{font-size:16.5px;margin:0 0 16px;font-weight:700;}
  .opt{margin-bottom:16px;}
  .opt > label,.optlbl{display:block;font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:7px;}
  .optlbl .req{color:var(--danger);}
  .hint{font-size:12.5px;color:var(--faint);margin-top:6px;}
  .inp,.ta{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;
    font-family:var(--sans);font-size:15px;padding:10px 12px;transition:border-color .12s,box-shadow .12s;}
  .inp:focus,.ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .ta{resize:vertical;min-height:64px;}
  .inp[dir=ltr]{text-align:start;}
  select.inp{cursor:pointer;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:520px){ .two{grid-template-columns:1fr;} }
  .chkline{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;margin-bottom:8px;}
  .chkline input{accent-color:var(--accent);width:15px;height:15px;}

  /* perms toggle rows */
  .perms{display:flex;flex-direction:column;gap:2px;}
  .permrow{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel-2);cursor:pointer;margin-bottom:8px;transition:border-color .12s,background .12s;}
  .permrow:hover{border-color:var(--accent);}
  .permrow.on{border-color:var(--accent);background:var(--accent-soft);}
  .permrow .pk{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--panel);color:var(--accent);border:1px solid var(--line-2);}
  .permrow.on .pk{background:var(--accent);color:#fff;border-color:transparent;}
  .permrow .pk svg{width:17px;height:17px;}
  .permrow .pt{flex:1;min-width:0;}
  .permrow .pt b{display:block;font-size:14.5px;font-weight:600;color:var(--ink);}
  .permrow .pt span{font-size:13px;color:var(--muted);}
  .permrow input{accent-color:var(--accent);width:16px;height:16px;flex-shrink:0;}

  /* brand editor */
  .brandbox{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel-2);}
  .brandrow{display:flex;align-items:center;gap:12px;margin-top:12px;}
  .logoprev{width:56px;height:56px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:var(--panel);border:1px dashed var(--line);overflow:hidden;color:var(--faint);}
  .logoprev img{max-width:100%;max-height:100%;object-fit:contain;}
  .logoprev svg{width:22px;height:22px;}
  .minibtn2{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink-2);cursor:pointer;font-size:14px;font-weight:600;transition:border-color .12s;}
  .minibtn2:hover{border-color:var(--accent);} .minibtn2 svg{width:14px;height:14px;}
  .colorwrap{display:flex;align-items:center;gap:9px;}
  .colorwrap input[type=color]{width:40px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--panel);cursor:pointer;padding:2px;}

  /* materials uploader */
  .drop{display:flex;align-items:center;gap:14px;border:2px dashed color-mix(in srgb,var(--accent) 55%,var(--line));border-radius:14px;
    padding:11px 15px;cursor:pointer;background:var(--panel-2);transition:border-color .15s,background .15s;}
  .drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);}
  .drop .cloud{width:40px;height:40px;flex:0 0 auto;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);}
  .drop .cloud svg{width:22px;height:22px;}
  .drop .dinfo{flex:1;min-width:0;text-align:start;}
  .drop .big{font-size:16px;font-weight:600;color:var(--ink);}
  .drop .dhint{margin-top:2px;font-size:13px;color:var(--faint);font-family:var(--mono);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .drop .dbtns{display:flex;align-items:center;gap:8px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end;}
  .drop .choose{display:inline-flex;align-items:center;gap:7px;color:#fff;border:none;white-space:nowrap;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:600;font-size:14.5px;padding:9px 16px;border-radius:999px;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 12px var(--grad-btn-glow);transition:filter .14s;}
  .drop .choose:hover{filter:brightness(1.05);} .drop .choose:active{transform:translateY(1px);}
  .drop .choose svg{width:15px;height:15px;}
  .drop .choose.ghost{color:var(--accent-dim,var(--accent));background:var(--panel);border:1px solid var(--accent);text-shadow:none;box-shadow:none;}
  html[data-theme="dark"] .drop .choose.ghost{color:var(--accent);}
  .drop .choose.ghost:hover{background:var(--accent-soft);filter:none;}
  @media (max-width:560px){ .drop{flex-wrap:wrap;} .drop .dinfo{flex:1 1 auto;} .drop .dbtns{flex:1 1 100%;} .drop .choose{flex:1;justify-content:center;} }
  input[type=file]{display:none;}
  .mlist{display:flex;flex-direction:column;gap:8px;margin-top:12px;max-height:340px;overflow-y:auto;overscroll-behavior:contain;}
  .mlist::-webkit-scrollbar{width:10px;}
  .mlist::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:999px;border:3px solid var(--panel);}
  .mlist::-webkit-scrollbar-thumb:hover{background:var(--muted);}
  .mrow{display:flex;align-items:center;gap:11px;padding:9px 11px;border:1px solid var(--line-2);border-radius:11px;background:var(--panel);}
  .mrow .fico{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);overflow:hidden;}
  .mrow .fico.image{color:var(--info);background:var(--info-soft);} .mrow .fico.video{color:#e5484d;background:var(--danger-soft);}
  .mrow .fico.doc{color:var(--info-dim);background:var(--info-soft);}
  .mrow .fico img{width:100%;height:100%;object-fit:cover;} .mrow .fico svg{width:16px;height:16px;}
  .mrow .fn{flex:1;min-width:0;}
  .mrow .fn .nm{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mrow .fn .sz{font-family:var(--mono);font-size:12px;color:var(--faint);}
  .mrow .rm{width:28px;height:28px;flex-shrink:0;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;}
  .mrow .rm:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft);} .mrow .rm svg{width:14px;height:14px;}

  .primary{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:9px;color:#fff;border:none;cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:600;font-size:16.5px;padding:13px 20px;border-radius:999px;text-shadow:0 1px 2px rgba(0,0,0,.18);margin-top:4px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.14),0 8px 20px var(--grad-btn-glow);
    transition:filter .14s,transform .08s;}
  .primary:hover{filter:brightness(1.05);} .primary:active{transform:translateY(1px);}
  .primary:disabled{opacity:.5;cursor:not-allowed;filter:none;transform:none;}
  .primary svg{width:17px;height:17px;}
  .opterr{font-size:13px;color:var(--danger);margin-top:8px;min-height:14px;text-align:center;}

  /* live client preview */
  .side{padding:18px;position:sticky;top:16px;}
  .side .plabel{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:10px;}
  .pvcard{border:1px solid var(--line-2);border-radius:14px;overflow:hidden;background:var(--panel-2);}
  .pvhero{padding:20px 16px;text-align:center;position:relative;background:var(--grad-soft);border-bottom:1px solid var(--line-2);}
  .pvhero .pvlogo{background:#fff;border-radius:11px;padding:7px 12px;display:inline-block;margin-bottom:9px;box-shadow:var(--shadow-sm);}
  .pvhero .pvlogo img{display:block;max-height:34px;max-width:150px;object-fit:contain;}
  .pvhero.br .pv-name{color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.3);}
  .pvhero.br .pv-desc{color:rgba(255,255,255,.9);}
  .pvcard .pv-name{font-size:16.5px;font-weight:700;color:var(--ink);word-break:break-word;}
  .pvcard .pv-desc{font-size:13.5px;color:var(--muted);margin-top:4px;white-space:pre-wrap;word-break:break-word;}
  .pvcard .pv-body{padding:14px;}
  .pvthumbs{display:flex;flex-wrap:wrap;gap:6px;}
  .pvthumb{width:44px;height:44px;border-radius:9px;background:var(--panel);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;color:var(--accent);overflow:hidden;}
  .pvthumb img{width:100%;height:100%;object-fit:cover;} .pvthumb svg{width:18px;height:18px;}
  .pvempty{border:1.4px dashed var(--line);border-radius:11px;padding:18px;text-align:center;color:var(--faint);font-size:13.5px;background:var(--panel);}
  .pv-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}

  /* chips */
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-family:var(--mono);color:var(--muted);
    background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;}
  .chip svg{width:13px;height:13px;color:var(--accent);}
  .chip.warn{background:var(--warm-soft);border-color:var(--warm-line);color:var(--warn);}
  .chip.warn svg{color:var(--warn);}

  @media (min-width:841px){
    .wrap{padding-top:8px;padding-bottom:8px;}
    .pagehead{margin-bottom:10px;}
    .pagehead .kick{font-size:12px;padding:3px 9px;margin-bottom:7px;}
    .pagehead h2{font-size:clamp(23px,2.5vw,30px);margin-bottom:3px;}
    .pagehead p{font-size:14.5px;line-height:1.36;max-width:58ch;}
    .tabs{margin-bottom:12px;}
    .tab{height:34px;padding:0 13px;font-size:14px;}
    .grid{grid-template-columns:minmax(0,1fr) minmax(210px,260px);gap:14px;}
    .form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 12px;padding:14px;}
    .form h3{grid-column:1/-1;margin:0;font-size:15.5px;}
    .form > .opt{margin-bottom:0;}
    .form > .opt:nth-child(2),
    .form > .opt:nth-child(3),
    .form > .opt:nth-child(4),
    .form > .opt:nth-child(5),
    .form > .opt:nth-child(8){grid-column:span 2;}
    .form > .opt:nth-child(6){grid-column:1/-1;}
    .form > .two{grid-column:span 2;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px;}
    .form > .two .opt{margin-bottom:0;}
    .form > .opt:nth-child(9){align-self:end;}
    .opt > label,.optlbl{font-size:13.5px;margin-bottom:4px;}
    .inp,.ta{padding:7px 10px;font-size:14px;}
    .ta{min-height:44px;}
    .hint{margin-top:3px;line-height:1.25;}
    .drop{padding:9px 12px;gap:10px;}
    .drop .cloud{width:34px;height:34px;border-radius:10px;}
    .drop .big{font-size:14.5px;}
    .drop .dhint{font-size:12px;}
    .drop .choose{padding:7px 10px;font-size:13px;}
    .form > .opt:nth-child(5) .hint{display:none;}
    .mlist{max-height:58px;margin-top:8px;gap:6px;}
    .mrow{padding:7px 9px;}
    .perms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;}
    .permrow{min-width:0;margin-bottom:0;padding:7px;gap:7px;}
    .permrow .pk{width:30px;height:30px;border-radius:8px;}
    .permrow .pt b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .permrow .pt span{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .permrow input{width:14px;height:14px;}
    .brandbox{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:8px;padding:10px;}
    .brandbox > .opt{grid-column:1;margin-bottom:0!important;}
    .brandrow{grid-column:2;grid-row:1;margin-top:0;gap:8px;}
    .brandbox > .hint{grid-column:1/-1;display:none;}
    .logoprev{width:34px;height:34px;border-radius:9px;}
    .minibtn2{height:31px;padding:0 10px;font-size:13px;}
    .colorwrap input[type=color]{width:36px;height:31px;}
    .chkline{margin-bottom:0;}
    .primary{grid-column:span 2;align-self:end;min-height:38px;padding:9px 16px;margin-top:0;font-size:15.5px;}
    .opterr{grid-column:span 2;margin-top:0;align-self:center;}
    .mlist:empty,.opterr:empty{display:none;}
    .side{position:static;padding:14px;}
    .side .plabel{margin-bottom:7px;}
    .pvhero{padding:12px;}
    .pvhero .pvlogo{padding:5px 10px;margin-bottom:7px;}
    .pvhero .pvlogo img{max-height:28px;}
    .pvcard .pv-body{padding:11px;}
    .pvempty{padding:12px;}
    .pvthumb{width:38px;height:38px;}
    .pv-chips{margin-top:9px;}
    #createView:not(.hidden) ~ footer{display:none;}
  }

  @media (min-width:841px) and (max-width:1099px){
    .grid{grid-template-columns:minmax(0,1fr) minmax(190px,220px);gap:12px;}
    .form{grid-template-columns:repeat(6,minmax(0,1fr));gap:7px 8px;padding:12px;}
    .form > .opt:nth-child(2),
    .form > .opt:nth-child(3),
    .form > .opt:nth-child(4),
    .form > .opt:nth-child(5),
    .form > .opt:nth-child(8),
    .form > .two{grid-column:span 3;}
    .form > .opt:nth-child(6){grid-column:1/-1;}
    .form > .opt:nth-child(9){grid-column:span 1;}
    .primary{grid-column:span 2;padding-inline:10px;font-size:14.5px;}
    .opterr{grid-column:1/-1;}
    .drop{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:7px 9px;padding:8px 10px;}
    .drop .cloud{width:30px;height:30px;border-radius:9px;}
    .drop .big{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .drop .dhint{display:none;}
    .drop .dbtns{grid-column:1/-1;justify-content:flex-start;gap:6px;flex-wrap:nowrap;}
    .drop .choose{height:29px;padding:0 9px;font-size:12.5px;}
    .perms{gap:5px;}
    .permrow{padding:6px;gap:6px;}
    .permrow .pk{width:26px;height:26px;border-radius:8px;}
    .permrow .pt span{display:none;}
    .brandbox{padding:8px;}
    .logoprev{display:none;}
    .minibtn2{height:29px;padding:0 8px;font-size:12.5px;}
    .colorwrap input[type=color]{width:32px;height:29px;}
  }

  /* wide screens: taller fields & buttons only — matches "File Request" (קבלת קבצים) proportions.
     Height-only overrides (padding / min-height / height); text, cards & images stay the same size. */

  body.review-dashboard .rcard{min-height:218px;padding:0;background:#fff;border:1.5px solid #bda4ff;border-radius:13px;box-shadow:0 4px 13px rgba(96,69,170,.08);display:grid;grid-template-columns:245px 1fr;grid-template-rows:1fr 82px;gap:0;overflow:hidden;direction:ltr}
  body.review-dashboard .rc-main{grid-column:1/-1;direction:rtl;padding:24px 30px 18px;display:flex;flex-direction:column;align-items:flex-start}
  body.review-dashboard .rc-top{margin:0 0 22px;align-self:flex-start}
  body.review-dashboard .rc-name{font-size:20px}.review-dashboard .badge{font-size:12px}
  body.review-dashboard .rc-meta{gap:42px;width:100%;justify-content:center}
  body.review-dashboard .chip{border:0;background:transparent;font-family:var(--sans);font-size:14px;padding:6px;color:#687188}
  body.review-dashboard .chip svg{width:18px;height:18px}
  body.review-dashboard .rc-actions{grid-column:1/-1;border-top:1px solid #e8eaf0;direction:rtl;padding:18px 28px;display:flex;align-items:center;gap:10px}
  body.review-dashboard .minibtn{height:41px;padding:0 18px;background:#fff;border-radius:8px}
  body.review-dashboard .minibtn.go{margin-inline-start:auto;background:#fff;color:#7040ed;border-color:#9b73ff}
  body.review-dashboard .minibtn[data-act="copy"]{background:#7037f5;color:#fff;border:0}
  .review-stats{margin-top:28px;height:92px;border-radius:12px;background:linear-gradient(90deg,#fbf9ff,#f6f3ff);display:grid;grid-template-columns:repeat(4,1fr) 1.25fr;align-items:center;text-align:center;color:#6e768b}

<body>

    <input type="file" id="verInput" multiple>

  <footer data-i18n="foot"></footer>
</div>

  // ---------- helpers ----------
  function toast(msg){ const b=el('toast'); b.textContent=msg; b.classList.add('show'); clearTimeout(b._t); b._t=setTimeout(()=>b.classList.remove('show'),1900); }
  function withUsage(tool,payload,work){
    if(window.KolkliUsage && window.KolkliUsage.guard) return window.KolkliUsage.guard(tool,payload,work);
    return Promise.resolve().then(work);
  }
  function showUsageLimit(info){
    if(window.KolkliUsage && window.KolkliUsage.showBlocked) window.KolkliUsage.showBlocked(info,'review-files');
    else toast(t.errNoFiles);
  }
  function confirmDialog(opts){
    return new Promise(resolve=>{
      const overlay=el('cf'), okBtn=el('cfConfirm'), cancelBtn=el('cfCancel'), ico=el('cfIco');
      const tone=opts.tone==='warn'?' warn':'';
      ico.className='cf-ico'+tone; ico.innerHTML=opts.icon||trashSvg();
      el('cfTitle').textContent=opts.title||''; el('cfMsg').textContent=opts.message||'';
      okBtn.className='cf-confirm'+tone; okBtn.textContent=opts.confirmLabel||t.aDel;
      cancelBtn.textContent=opts.cancelLabel||t.confCancel;
      overlay.classList.add('show');
      let settled=false;
      function done(res){ if(settled) return; settled=true; overlay.classList.remove('show');
        okBtn.onclick=cancelBtn.onclick=overlay.onclick=null; document.removeEventListener('keydown',onKey); resolve(res); }
      function onKey(e){ if(e.key==='Escape'){ done(false); } else if(e.key==='Enter'){ done(true); } }
      okBtn.onclick=()=>done(true); cancelBtn.onclick=()=>done(false);
      overlay.onclick=e=>{ if(e.target===overlay) done(false); };
      document.addEventListener('keydown',onKey);
      setTimeout(()=>{ try{ okBtn.focus(); }catch(_){} },30);
    });
  }
  function ls(k){ return RV.ls(k); }
  function proofUrl(token){ return new URL('proof.html?p='+token, location.href).href; }
  function daysWord(n){ n=+n; return n===1? t.dayU : t.daysU(n); }
  function fmtDate(ms){
    if(!ms) return '';
    const d=new Date(ms), now=new Date();
    const sameDay=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
    const yest=new Date(now.getTime()-86400000);
    if(sameDay(d,now)) return t.today;
    if(sameDay(d,yest)) return t.yesterday;
    try{ return d.toLocaleDateString(lang==='he'?'he-IL':lang==='ru'?'ru-RU':'en-US',{day:'numeric',month:'short'}); }catch(_){ return d.toISOString().slice(0,10); }
  }
  function fmtDateTime(ms){
    const d=new Date(ms);
    try{ return d.toLocaleString(lang==='he'?'he-IL':lang==='ru'?'ru-RU':'en-US',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
    catch(_){ return d.toISOString().slice(0,16).replace('T',' '); }
  }
  function mmss(s){ s=Math.max(0,Math.floor(s||0)); const m=Math.floor(s/60), r=s%60; return m+':'+String(r).padStart(2,'0'); }

  // ---------- create ----------
  function typeIcon(kind){ return RV.FICON[kind]||RV.FICON.doc; }
  // accepts a FileList/File[] or an array of {file,path}; keeps each file's relative path so
  // dropped folders keep their structure (stored on the materials the client receives)
  function pathItems(list){ return Array.from(list||[]).map(f=>({file:f, path:f.webkitRelativePath||f.name})); }
  function addFiles(items){
    const incoming=(items||[]).filter(it=>it && (it.file||it));
    // Paid plans (Lite/Pro/Business) are unlimited — the 1-file cap is free-tier only.
    const usageExempt=!!(window.KolkliUsage && window.KolkliUsage.isExempt && window.KolkliUsage.isExempt());
    if(!usageExempt && newItems.length + incoming.length > 1){
      showUsageLimit({ code:'payload_limit', field:'files', max:1, actual:newItems.length + incoming.length });
      return;
    }
    incoming.forEach(it=>{
      const file = it.file || it;
      const path = (it.path || file.webkitRelativePath || file.name);
      const ext=RV.extOf(file.name), kind=RV.kindOf(ext);
      newItems.push({ id:'ri'+RV.randToken()+(uid++), file, name:file.name, path, ext, kind, size:file.size });
    });
    renderMaterials(); renderPreview();
  }

  // walk dropped directories via the entries API so whole folders keep their tree
  async function addFromDataTransfer(dt){
    let items;
    try{ items = await filesFromDataTransfer(dt); }
    catch(_){ items = pathItems(dt.files); }
    addFiles(items);
  }
  function filesFromDataTransfer(dt){
    const list = dt.items ? Array.from(dt.items) : [];
    const entries = list.map(it=> it.webkitGetAsEntry ? it.webkitGetAsEntry() : null).filter(Boolean);
    if(!entries.length){ return Promise.resolve(pathItems(dt.files)); }
    const out=[];
    return Promise.all(entries.map(en=>walkEntry(en,'',out))).then(()=>out);
  }
  function walkEntry(entry, prefix, out){
    return new Promise(resolve=>{
      if(!entry){ resolve(); return; }
      if(entry.isFile){ entry.file(f=>{ out.push({file:f, path:prefix+entry.name}); resolve(); }, ()=>resolve()); }
      else if(entry.isDirectory){
        const reader=entry.createReader(), kids=[];
        const readBatch=()=>reader.readEntries(batch=>{
          if(!batch.length){ Promise.all(kids.map(k=>walkEntry(k, prefix+entry.name+'/', out))).then(resolve); }
          else { kids.push(...batch); readBatch(); }
        }, ()=>resolve());
        readBatch();
      } else resolve();
    });
  }
  function removeItem(id){ newItems=newItems.filter(f=>f.id!==id); renderMaterials(); renderPreview(); }
  function renderMaterials(){
    el('mlist').innerHTML = newItems.map(f=>{

      return `<div class="mrow" data-id="${f.id}">

        <button class="rm" data-rm="${f.id}" title="${RV.escapeHtml(t.aDel)}">${xSvg()}</button>

  function shade(hex,amt){
    const m=/^#?([0-9a-f]{6})$/i.exec(hex||''); if(!m) return hex;
    const n=parseInt(m[1],16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    r=Math.round(r+(255-r)*amt); g=Math.round(g+(255-g)*amt); b=Math.round(b+(255-b)*amt);
    return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
  }

  async function createProject(){
    el('createErr').textContent='';
    const name=el('fName').value.trim();
    if(!name){ el('createErr').textContent=t.errName; return; }
    if(!newItems.length){ el('createErr').textContent=t.errNoFiles; return; }
    const pwOn=el('fPwToggle').checked, pwVal=el('fPassword').value;
    if(pwOn && !pwVal){ el('createErr').textContent=t.errPw; return; }

    let proj;
    try{
      proj = await withUsage('review-files', { files:newItems.length }, async()=>{
        const days=+el('fExpiry').value;
        const items = newItems.map(f=>({ id:f.id, name:(f.path||f.name), ext:f.ext, kind:f.kind, size:f.size, at:Date.now(), version:1 }));
        const next={
          token: RV.randToken(),
          name, client: el('fClient').value.trim(), message: el('fMessage').value.trim(),
          brand: collectBrand(),
          perms:{ comment:el('pmComment').checked, download:el('pmDownload').checked, approve:el('pmApprove').checked },
          password: pwOn? await RV.hashPass(pwVal) : null,
          expiresAt: days? Date.now()+days*86400000 : 0,
          createdAt: Date.now(),
          notify: el('fNotify').checked,
          status:'draft', activeVersion:1, maxVersion:1,
          items, comments:[], events:[], decision:null
        };
        if(window.KolkliProjectNumbers) await KolkliProjectNumbers.assign('review', next);
        // persist blobs
        try{ for(const f of newItems){ await RV.putBlob(f.id, f.file); } }
        catch(_){ el('createErr').textContent=t.errNoFiles; throw new Error('blob_write_failed'); }
        RV.upsertProject(next);
        return next;
      });
    }catch(err){
      if(err && err.usage) return;
      if(err && err.message==='blob_write_failed') return;
      if(err && err.message==='project_number_allocation_failed'){
        el('createErr').textContent = lang==='he' ? 'לא ניתן להקצות מספר פרויקט כרגע. נסו שוב.' : 'Could not allocate a project number. Please try again.';
        return;
      }
      throw err;
    }
    lastToken=proj.token;
    showShare(proj);
    updateCount();
  }

    el('shareLink').textContent=url;

  function renderProject(){
    const p=RV.getProject(dToken); if(!p){ setView('manage'); return; }
    const st=RV.statusOf(p);
    el('dName').textContent=p.name;
    el('dStatus').innerHTML=`<span class="badge b-${st}">${statusLabel(st)}</span>`;

    const meta=[];
    const num=projectNumberText(p);
    if(num) meta.push(`<span class="chip">${RV.escapeHtml(num)}</span>`);
    if(p.client) meta.push(`<span class="chip">${userSvg()} ${RV.escapeHtml(t.chipClient(p.client))}</span>`);
    meta.push(`<span class="chip">${clockSvg()} ${t.chipCreated(fmtDate(p.createdAt))}</span>`);
    if(p.expiresAt) meta.push(`<span class="chip">${clockSvg()} ${t.chipExpires(fmtDate(p.expiresAt))}</span>`);
    else meta.push(`<span class="chip">${t.chipNoExpiry}</span>`);
    el('dMeta').innerHTML=meta.join('');

    // actions
    const acts=[];
    acts.push(`<button class="btn" data-dact="open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>${t.openClient}</button>`);
    acts.push(`<button class="btn" data-dact="copy">${copySvg()}${t.aCopy}</button>`);
    if(st!=='closed'&&st!=='expired') acts.push(`<button class="btn" data-dact="addver">${layersSvg()}${t.aAddVer}</button>`);
    if(st==='closed') acts.push(`<button class="btn" data-dact="reopen">${refreshSvg()}${t.aReopen}</button>`);
    else if(st!=='expired') acts.push(`<button class="btn" data-dact="close">${lockSvg()}${t.aClose}</button>`);
    el('dActions').innerHTML=acts.join('');

    // version switcher
    const vs=el('vSwitch');
    if(p.maxVersion>1){
      vs.classList.remove('hidden');
      let html=`<span class="vlbl">${t.chipVersion('').trim()||'V'}</span>`;
      for(let v=1;v<=p.maxVersion;v++) html+=`<button class="vbtn${v===dVersion?' on':''}" data-ver="${v}">${t.chipVersion(v)}</button>`;
      vs.innerHTML=html;
    } else vs.classList.add('hidden');

    // decision box
    renderDecision(p);

    // items of the shown version
    const items=RV.itemsOfVersion(p, dVersion);
    el('dItemsN').textContent=items.length;
    el('itemGrid').innerHTML = items.map(it=>{
      const cc=RV.commentsOf(p,it.id).length;
      return `<div class="icard" data-item="${it.id}">
        <div class="ith" data-thumb="${it.id}">${RV.FICON[it.kind]||RV.FICON.doc}${cc?`<span class="cc">${cc}</span>`:''}</div>
        <div class="imeta"><div class="nm" title="${RV.escapeHtml(it.name)}">${RV.escapeHtml(it.name)}</div><div class="sz">${RV.fmtBytes(it.size)}</div></div>
      </div>`;
    }).join('');
    fillThumbs(items);

    // feedback for this version's items
    const ids=new Set(items.map(i=>i.id));
    const comments=(p.comments||[]).filter(c=>ids.has(c.itemId)).sort((a,b)=>b.at-a.at);
    el('dFeedbackN').textContent=comments.length;
    el('feedEmpty').classList.toggle('hidden', comments.length>0);
    el('feed').innerHTML = comments.map(c=>{
      const it=(p.items||[]).find(i=>i.id===c.itemId)||{name:''};
      const who=(c.author&&c.author.trim())?c.author.trim():t.anonymous;
      const av=(who||'?').trim().charAt(0).toUpperCase()||'?';
      let pos='';
      if(c.tcode!=null) pos=`<span class="fc-pos">${clockSvg()} ${mmss(c.tcode)}</span>`;
      else if(c.page!=null) pos=`<span class="fc-pos">${fileSvg()} ${t.posPage(c.page)}</span>`;
      return `<div class="fcard${c.resolved?' res':''}" data-cid="${c.id}">
        <div class="fc-top">
          <span class="fc-av">${RV.escapeHtml(av)}</span>
          <span class="fc-who">${RV.escapeHtml(who)}</span>
          <span class="fc-on">${RV.escapeHtml(it.name)} · ${fmtDateTime(c.at)}</span>
          ${pos}
        </div>
        <div class="fc-body">${RV.escapeHtml(c.body)}</div>
        <div class="fc-foot">
          <button class="fc-res${c.resolved?' done':''}" data-res="${c.id}">${checkSvg()} ${c.resolved?t.resolved:t.resolve}</button>
        </div>
      </div>`;
    }).join('');
  }
  function renderDecision(p){
    const box=el('decisionBox');
    if(p.decision && p.decision.state==='approved'){
      box.innerHTML=`<div class="decisionbox approved"><div class="di">${checkSvg()}</div><div class="dt"><b>${t.decApprovedT}</b><span>${t.decApprovedS(RV.escapeHtml(p.decision.by||t.anonymous), fmtDateTime(p.decision.at))}</span></div></div>`;
    } else if(p.decision && p.decision.state==='changes'){
      box.innerHTML=`<div class="decisionbox changes"><div class="di">${refreshSvg()}</div><div class="dt"><b>${t.decChangesT}</b><span>${t.decChangesS(RV.escapeHtml(p.decision.by||t.anonymous), fmtDateTime(p.decision.at))}</span></div></div>`;
    } else {
      box.innerHTML=`<div class="decisionbox pending"><div class="di">${clockSvg()}</div><div class="dt"><b>${t.decPendingT}</b><span>${t.decPendingS}</span></div></div>`;
    }
  }
  async function fillThumbs(items){
    for(const it of items){
      if(it.kind!=='image') continue;
      try{
        const blob=await RV.getBlob(it.id); if(!blob) continue;
        const holder=document.querySelector(`[data-thumb="${it.id}"]`); if(!holder) continue;
        const url=URL.createObjectURL(blob);
        const cc=holder.querySelector('.cc'); const ccHtml=cc?cc.outerHTML:'';
        holder.innerHTML=`<img src="${url}" alt="">`+ccHtml;
      }catch(_){}
    }
  }
  async function addVersionFiles(list){
    const p=RV.getProject(dToken); if(!p) return;
    const arr=Array.from(list||[]); if(!arr.length) return;
    const nv=(p.maxVersion||1)+1;
    const metas=[];
    try{
      for(const file of arr){
        const ext=RV.extOf(file.name), kind=RV.kindOf(ext), id='ri'+RV.randToken()+(uid++);
        await RV.putBlob(id, file);
        metas.push({ id, name:file.name, ext, kind, size:file.size, at:Date.now(), version:nv });
      }
    }catch(_){ return; }
    p.items=(p.items||[]).concat(metas);
    p.maxVersion=nv; p.activeVersion=nv;
    p.versions=(p.versions||[]).concat([{v:nv, at:Date.now()}]);
    if(p.status==='approved'||p.status==='changes'||p.status==='viewed') p.status='sent';
    RV.upsertProject(p);
    dVersion=nv; renderProject(); toast(t.verAddedToast(nv));
  }

  async function previewItem(id){
    const p=RV.getProject(dToken); if(!p) return;
    const it=(p.items||[]).find(i=>i.id===id); if(!it) return;
    const blob=await RV.getBlob(id); if(!blob) return;
    const url=URL.createObjectURL(blob);
    el('pvTitle').textContent=it.name; const body=el('pvBody');
    if(it.kind==='image') body.innerHTML=`<img src="${url}" alt="">`;

    else if(it.kind==='audio') body.innerHTML=`<audio src="${url}" controls autoplay></audio>`;
    else if(it.ext==='pdf') body.innerHTML=`<iframe src="${url}"></iframe>`;
    else { const a=document.createElement('a'); a.href=url; a.download=it.name; document.body.appendChild(a); a.click(); a.remove(); return; }
    el('pv').classList.add('show');
  }

  // ---------- incoming client activity ----------
  function onIncoming(d){
    if(!d || !d.token) return;
    const p=RV.getProject(d.token); if(!p) return;
    const who=(d.who && d.who.trim())? d.who.trim() : t.anonymous;
    let msg='';
    if(d.type==='viewed') msg=t.actViewed(who);
    else if(d.type==='commented') msg=t.actCommented(who);
    else if(d.type==='approved') msg=t.actApproved(who);
    else if(d.type==='changes') msg=t.actChanges(who);
    if(msg){
      toast(msg);
      if(p.notify){ try{ if('Notification'in window && Notification.permission==='granted') new Notification(t.notifTitle,{body:msg}); }catch(_){} }
    }
    if(view==='manage') renderManage();
    else if(view==='project' && dToken===d.token) renderProject();
    updateCount();
  }

  // ---------- modern custom video player (no native controls → no download / speed / PiP menu) ----------
  function videoPlayerHTML(url,autoplay){
    const play='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
    const pause='<svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
    const volOn='<svg class="ic-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
    const volOff='<svg class="ic-unmute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>';
    const fs='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M21 16v3a2 2 0 0 1-2 2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/></svg>';
    return `<div class="vplayer" tabindex="0">
      <video src="${url}"${autoplay?' autoplay':''} playsinline preload="metadata" controlslist="nodownload noplaybackrate noremoteplayback" disablepictureinpicture disableremoteplayback></video>
      <button class="vp-big" type="button" aria-label="נגן" data-vpbig>${play}</button>
      <div class="vp-bar">
        <button class="vp-btn" type="button" aria-label="הפעל / השהה" data-vptoggle><span class="ic-play">${play}</span>${pause}</button>
        <span class="vp-time" data-vpcur>0:00</span>
        <div class="vp-seek" data-vpseek><div class="vp-seek-track"><div class="vp-seek-buf" data-vpbuf></div><div class="vp-seek-fill" data-vpfill></div></div><div class="vp-seek-knob" data-vpknob></div></div>
        <span class="vp-time" data-vpdur>0:00</span>
        <div class="vp-volwrap">
          <button class="vp-btn" type="button" aria-label="השתקה" data-vpmute>${volOn}${volOff}</button>
          <div class="vp-vol"><div class="vp-seek" data-vpvol><div class="vp-seek-track"><div class="vp-seek-fill" data-vpvolfill></div></div><div class="vp-seek-knob" data-vpvolknob></div></div></div>
        </div>
        <button class="vp-btn" type="button" aria-label="מסך מלא" data-vpfs>${fs}</button>
      </div>
    </div>`;
  }
  function wireVideoPlayer(root){
    if(!root) return;
    const v=root.querySelector('video'); if(!v) return;
    const q=s=>root.querySelector(s);
    const bigBtn=q('[data-vpbig]'), toggleBtn=q('[data-vptoggle]'), muteBtn=q('[data-vpmute]'), fsBtn=q('[data-vpfs]');
    const cur=q('[data-vpcur]'), dur=q('[data-vpdur]');
    const seek=q('[data-vpseek]'), fill=q('[data-vpfill]'), buf=q('[data-vpbuf]'), knob=q('[data-vpknob]');
    const vol=q('[data-vpvol]'), volFill=q('[data-vpvolfill]'), volKnob=q('[data-vpvolknob]');
    const setPlaying=p=>root.classList.toggle('playing',p);
    const togglePlay=()=>{ if(v.paused) v.play().catch(()=>{}); else v.pause(); };
    v.addEventListener('play',()=>setPlaying(true));
    v.addEventListener('pause',()=>setPlaying(false));
    v.addEventListener('ended',()=>setPlaying(false));
    bigBtn.addEventListener('click',togglePlay);
    toggleBtn.addEventListener('click',togglePlay);
    v.addEventListener('click',togglePlay);
    const fmtDur=()=>{ dur.textContent=isFinite(v.duration)?mmss(v.duration):'0:00'; };
    v.addEventListener('loadedmetadata',fmtDur); v.addEventListener('durationchange',fmtDur); fmtDur();
    const paintSeek=()=>{ const d=v.duration||0, p=d?Math.min(1,v.currentTime/d):0; fill.style.width=(p*100)+'%'; knob.style.left=(p*100)+'%'; cur.textContent=mmss(v.currentTime); };
    v.addEventListener('timeupdate',paintSeek); paintSeek();
    v.addEventListener('progress',()=>{ try{ if(v.buffered.length){ const end=v.buffered.end(v.buffered.length-1), d=v.duration||0; buf.style.width=(d?Math.min(1,end/d)*100:0)+'%'; } }catch(_){} });
    // seek scrubbing
    const posOf=(elm,e)=>{ const r=elm.getBoundingClientRect(); const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left; return Math.max(0,Math.min(1,x/(r.width||1))); };
    let seeking=false;
    const doSeek=e=>{ const d=v.duration||0; if(!d) return; const p=posOf(seek,e); v.currentTime=p*d; paintSeek(); };
    const seekMove=e=>{ if(seeking){ doSeek(e); e.preventDefault(); } };
    const seekUp=()=>{ seeking=false; document.removeEventListener('pointermove',seekMove); document.removeEventListener('pointerup',seekUp); };
    seek.addEventListener('pointerdown',e=>{ seeking=true; doSeek(e); document.addEventListener('pointermove',seekMove); document.addEventListener('pointerup',seekUp); });
    // volume
    const paintVol=()=>{ const p=v.muted?0:v.volume; volFill.style.width=(p*100)+'%'; volKnob.style.left=(p*100)+'%'; root.classList.toggle('muted',v.muted||v.volume===0); };
    v.addEventListener('volumechange',paintVol);
    muteBtn.addEventListener('click',()=>{ if(!v.muted && v.volume===0) v.volume=1; v.muted=!v.muted; });
    let voldrag=false;
    const doVol=e=>{ const p=posOf(vol,e); v.muted=false; v.volume=p; };
    const volMove=e=>{ if(voldrag){ doVol(e); e.preventDefault(); } };
    const volUp=()=>{ voldrag=false; document.removeEventListener('pointermove',volMove); document.removeEventListener('pointerup',volUp); };
    vol.addEventListener('pointerdown',e=>{ voldrag=true; doVol(e); document.addEventListener('pointermove',volMove); document.addEventListener('pointerup',volUp); });
    paintVol();
    // fullscreen
    fsBtn.addEventListener('click',()=>{ const fe=document.fullscreenElement||document.webkitFullscreenElement; if(fe){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); } else { (root.requestFullscreen||root.webkitRequestFullscreen||(()=>{})).call(root); } });
    // keyboard (when player focused)
    root.addEventListener('keydown',e=>{
      if(e.target.closest('input,textarea')) return;
      if(e.key===' '||e.key==='k'){ e.preventDefault(); togglePlay(); }
      else if(e.key==='ArrowLeft'){ e.preventDefault(); v.currentTime=Math.max(0,v.currentTime-5); }
      else if(e.key==='ArrowRight'){ e.preventDefault(); v.currentTime=Math.min(v.duration||0,v.currentTime+5); }
      else if(e.key==='m'){ v.muted=!v.muted; }
      else if(e.key==='f'){ fsBtn.click(); }
    });
    setPlaying(!v.paused);
  }

  // ---------- svg atoms ----------
  function clockSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>'; }
  function fileSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2v6h6"/><path d="M4 2h10l6 6v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/></svg>'; }
  function lockSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'; }
  function copySvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'; }
  function trashSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>'; }
  function eyeSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>'; }
  function checkSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'; }
  function refreshSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L3 8"/></svg>'; }
  function layersSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>'; }
  function commentSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'; }
  function userSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'; }
  function xSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>'; }

  // ---------- events ----------
  el('tabCreate').addEventListener('click',()=>setView('create'));
  el('tabManage').addEventListener('click',()=>setView('manage'));
  el('newReqBtn').addEventListener('click',()=>{ resetCreate(); setView('create'); });
  el('emptyNewBtn').addEventListener('click',()=>{ resetCreate(); setView('create'); });
  el('toManageBtn').addEventListener('click',()=>setView('manage'));
  el('backBtn').addEventListener('click',()=>setView('manage'));

  // materials uploader
  const drop=el('drop'), input=el('fileInput'), folderInput=el('folderInput');
  el('chooseBtn').addEventListener('click',e=>{ e.stopPropagation(); input.click(); });
  el('chooseFolderBtn').addEventListener('click',e=>{ e.stopPropagation(); folderInput.click(); });
  drop.addEventListener('click',()=>input.click());
  input.addEventListener('change',()=>{ addFiles(pathItems(input.files)); input.value=''; });
  folderInput.addEventListener('change',()=>{ addFiles(pathItems(folderInput.files)); folderInput.value=''; });
  ;['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.add('over'); }));
  ;['dragleave','dragend'].forEach(ev=>drop.addEventListener(ev,()=>drop.classList.remove('over')));
  drop.addEventListener('drop',e=>{ e.preventDefault(); drop.classList.remove('over'); if(e.dataTransfer) addFromDataTransfer(e.dataTransfer); });
  el('mlist').addEventListener('click',e=>{ const b=e.target.closest('[data-rm]'); if(b) removeItem(b.getAttribute('data-rm')); });

  // perms + preview inputs
  el('perms').addEventListener('change',()=>{ syncPermRows(); renderPreview(); });
  ['fName','fMessage'].forEach(id=>el(id).addEventListener('input',renderPreview));
  el('brName').addEventListener('input',()=>{ brand.name=el('brName').value.trim(); RV.saveBrand(brand); renderPreview(); });
  el('brColor').addEventListener('input',()=>{ brand.color=el('brColor').value; RV.saveBrand(brand); renderPreview(); });
  el('fPwToggle').addEventListener('change',e=>{ el('fPassword').classList.toggle('hidden',!e.target.checked); if(e.target.checked) el('fPassword').focus(); renderPreview(); });

  // logo upload
  el('logoBtn').addEventListener('click',()=>el('logoInput').click());
  el('logoInput').addEventListener('change',()=>{
    const f=el('logoInput').files&&el('logoInput').files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>{ brand.logo=r.result; RV.saveBrand(brand); setLogoPreview(brand.logo); renderPreview(); }; r.readAsDataURL(f);
    el('logoInput').value='';
  });
  el('logoRmBtn').addEventListener('click',()=>{ brand.logo=''; RV.saveBrand(brand); setLogoPreview(''); renderPreview(); });

  el('createBtn').addEventListener('click',createProject);
  el('copyBtn').addEventListener('click',()=>{ if(lastToken) copyLink(lastToken); toast(t.copied); });
  el('qrDlBtn').addEventListener('click',downloadQR);
  el('emailShareBtn').addEventListener('click',()=>{
    if(!lastToken) return; const p=RV.getProject(lastToken); const url=proofUrl(lastToken);
    const href='mailto:?subject='+encodeURIComponent(t.emailSubject(p.name))+'&body='+encodeURIComponent(t.emailBody(p.name,url,p.message));
    const a=document.createElement('a'); a.href=href; a.style.display='none'; document.body.appendChild(a); a.click(); a.remove();
  });

  el('reqList').addEventListener('click',e=>{
    const card=e.target.closest('[data-token]'); if(!card) return;
    const token=card.getAttribute('data-token');
    const btn=e.target.closest('[data-act]');
    if(!btn){ openProject(token); return; }
    const act=btn.getAttribute('data-act');
    if(act==='open') openProject(token);
    else if(act==='copy') copyLink(token);
    else if(act==='close') closeProject(token);
    else if(act==='reopen') reopenProject(token);
    else if(act==='del') deleteProject(token);
  });

  el('dActions').addEventListener('click',e=>{
    const b=e.target.closest('[data-dact]'); if(!b) return;
    const a=b.getAttribute('data-dact');
    if(a==='open') window.open(proofUrl(dToken),'_blank','noopener');
    else if(a==='copy') copyLink(dToken);
    else if(a==='addver') el('verInput').click();
    else if(a==='close') closeProject(dToken);
    else if(a==='reopen') reopenProject(dToken);
  });
  el('verInput').addEventListener('change',()=>{ addVersionFiles(el('verInput').files); el('verInput').value=''; });
  el('vSwitch').addEventListener('click',e=>{ const b=e.target.closest('[data-ver]'); if(!b) return; dVersion=+b.getAttribute('data-ver'); renderProject(); });
  el('itemGrid').addEventListener('click',e=>{ const c=e.target.closest('[data-item]'); if(c) previewItem(c.getAttribute('data-item')); });
  el('feed').addEventListener('click',e=>{ const b=e.target.closest('[data-res]'); if(b) toggleResolve(b.getAttribute('data-res')); });

  el('pvClose').addEventListener('click',closePreview);
  el('pv').addEventListener('click',e=>{ if(e.target===el('pv')) closePreview(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePreview(); });

  window.__setLang=applyLang;
  const themeBtn=el('themeToggle'); if(themeBtn) themeBtn.addEventListener('click',()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));

  // listen for client activity (this browser) + poll fallback
  RV.listen(onIncoming);
  let lastSig='';
  setInterval(()=>{
    const list=RV.loadProjects();
    const sig=list.map(p=>p.token+':'+(p.comments||[]).length+':'+p.status+':'+(p.decision?p.decision.state:'')).join('|');
    if(sig!==lastSig){ lastSig=sig; if(view==='manage') renderManage(); else if(view==='project') renderProject(); updateCount(); }
  },3500);

  // ---------- init ----------
  applyTheme(ls('theme')||'light');
  loadBrandUI();
  applyLang(RV.detectLang());
  syncPermRows(); renderMaterials(); renderPreview(); updateCount();
  requestNotifyPerm();
  const openTok=(location.search.match(/[?&]p=([^&]+)/)||[])[1];
  if(openTok && RV.getProject(decodeURIComponent(openTok))){ openProject(decodeURIComponent(openTok)); }
  else { document.body.classList.add('review-dashboard'); setView('manage'); }
})();
</script>
