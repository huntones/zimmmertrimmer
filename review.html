      perms:{ view:true, download:true, comment:true, replyToComments:true, approve:true, requestChanges:true, reject:true, approvePerFile:true, approveWholeProject:true, markTimeline:true, markImageRegion:true, markPdfPage:true },
      responses:{ freeComment:true, approved:true, needsChanges:true },
      approval:{ mode:'wholeProject', requireNoteOnReject:true, requireStatusEachFile:false, requireFullViewBeforeApprove:false, lockAfterDecision:false, allowChangeAfter:true, versioning:true, closeOnFinalApproval:true, allowReopen:true },
      changeReq:{ priority:true, exampleFile:true, screenshot:true, voiceNote:false, externalLink:true },
      annotate:{ avTimeline:true, avSegment:true, avPlayFromPoint:true, imgPoint:true, imgDraw:true, imgRect:true, imgArrow:true, imgCircle:true, imgText:true, imgColor:true, pdfPageComment:true, pdfMarkup:true },
      security:{ private:true, maxViews:0, requireEmailVerify:false, passwordOn:false, expiryDays:30, watermarkVisual:false, watermarkAudio:false, blockDownload:false },
      notify:{ master:true, opened:true, viewed:true, downloaded:true, commented:true, requestedChanges:true, approved:true, rejected:true, finished:true },
      branding:{ openMsg:'', closeMsg:'', signature:'' },
      statuses:{ showProgressBar:true }
    };
  }
  function rsGet(o,path){ return path.split('.').reduce((a,k)=> (a==null? undefined : a[k]), o); }
  function rsSet(o,path,v){ const ks=path.split('.'); let a=o; for(let i=0;i<ks.length-1;i++){ if(a[ks[i]]==null||typeof a[ks[i]]!=='object') a[ks[i]]={}; a=a[ks[i]]; } a[ks[ks.length-1]]=v; }
  function rsInput(path){ return document.querySelector('#rsContent [data-rs="'+path+'"]'); }
  function rsChecked(path){ const i=rsInput(path); return i? !!i.checked : false; }

  // relocate the existing inline blocks into their studio panels (once)
  function rsMountInline(){
    if(rsMounted) return; rsMounted=true;
    const move=(sel,mountId)=>{ const node=document.querySelector(sel), mount=el(mountId); if(node&&mount) mount.appendChild(node); };
    move('.rvf-pw','rsMountPw');
    move('.rvf-exp','rsMountExp');
    move('.rvf-wm','rsMountWm');
    move('.rvf-brand','rsMountBrand');
    move('.rvf-notify','rsMountNotify');
    const trio=document.querySelector('.rvf-trio'); if(trio) trio.style.display='none';
  }

  function collectReviewSettings(){
    const s=defaultReviewSettings();
    document.querySelectorAll('#rsContent [data-rs]').forEach(inp=>{
      const path=inp.getAttribute('data-rs'); let v;
      if(inp.type==='checkbox') v=inp.checked;
      else if(inp.type==='number') v=Math.max(0,parseInt(inp.value,10)||0);
      else v=inp.value;
      rsSet(s,path,v);
    });
    // enrich from the relocated inline controls (single source of truth for these)
    if(el('fPwToggle')) s.security.passwordOn=!!el('fPwToggle').checked;
    if(el('fExpiry')) s.security.expiryDays=+el('fExpiry').value||0;
    s.security.watermarkVisual=!!(wm.on && wm.visual.on);
    s.security.watermarkAudio=!!(wm.on && wm.audio.on);
    s.security.blockDownload=!(el('pmDownload') && el('pmDownload').checked);
    if(el('fNotify')) s.notify.master=!!el('fNotify').checked;
    return s;
  }
  function applyReviewSettings(s){
    if(!s) return;
    document.querySelectorAll('#rsContent [data-rs]').forEach(inp=>{
      const v=rsGet(s,inp.getAttribute('data-rs')); if(v===undefined||v===null) return;
      if(inp.type==='checkbox') inp.checked=!!v; else inp.value=v;
    });
    if(el('fNotify') && typeof s.notify==='object' && typeof s.notify.master==='boolean') el('fNotify').checked=s.notify.master;
    rsSyncSegs(); rsSyncDeps();
  }
  function rsSyncSegs(){
    document.querySelectorAll('#rsContent [data-seg]').forEach(btn=>{
      const hidden=rsInput(btn.getAttribute('data-seg'));
      btn.classList.toggle('on', !!hidden && hidden.value===btn.getAttribute('data-val'));
    });
  }
  // grey-out rows whose parent capability is off
  function rsDep(path,on){ const i=rsInput(path); const row=i? i.closest('.st-toggle') : null; if(row) row.classList.toggle('dis', !on); }
  function rsSyncDeps(){
    const canComment=rsChecked('perms.comment');
    ['perms.replyToComments','perms.markTimeline','perms.markImageRegion','perms.markPdfPage',
     'annotate.avTimeline','annotate.avSegment','annotate.avPlayFromPoint','annotate.imgPoint',
     'annotate.imgDraw','annotate.imgColor','annotate.pdfPageComment','annotate.pdfMarkup'].forEach(p=>rsDep(p,canComment));
    const canDraw=canComment && rsChecked('annotate.imgDraw');
    ['annotate.imgRect','annotate.imgArrow','annotate.imgCircle','annotate.imgText'].forEach(p=>rsDep(p,canDraw));
    const canChanges=rsChecked('perms.requestChanges');
    ['changeReq.priority','changeReq.exampleFile','changeReq.screenshot','changeReq.voiceNote','changeReq.externalLink','responses.needsChanges'].forEach(p=>rsDep(p,canChanges));
    rsDep('responses.approved', rsChecked('perms.approve'));
    rsDep('approval.allowChangeAfter', !rsChecked('approval.lockAfterDecision'));
  }

  // Relocate the studio's section nav + content host from the (now unused) modal shell into the
  // docked sidebar, once. Every listener bound to the moved nodes survives the move.
  let rsDocked=false;
  function dockReviewStudio(){
    if(rsDocked) return;
    const navHost=el('rvSDockBody'), navHostL=el('rvSDockBodyL'), content=el('rsContent');
    if(!navHost||!navHostL||!content) return;
    const railBody=document.querySelector('#rsRail .rs-draw-body');
    const sideBody=document.querySelector('#rsSide .rs-draw-body');
    if(railBody){ while(railBody.firstChild) navHost.appendChild(railBody.firstChild); }   // approval-flow group → right dock
    if(sideBody){ while(sideBody.firstChild) navHostL.appendChild(sideBody.firstChild); }  // protection + presentation groups → left dock (brings their own labels)
    navHost.appendChild(content);   // content host starts in the right dock; showStudioSection repositions it under the active tab (either dock)
    rsDocked=true;
  }
  function setDockCollapsed(on,persist){
    const g=el('createGrid'); if(g) g.classList.toggle('sdock-collapsed', !!on);
    const b=el('rvSDockToggle'); if(b) b.setAttribute('aria-expanded', on?'false':'true');
    if(persist) RV.lsSet('rv_studio_dock_collapsed', on?'1':'0');
  }
  function toggleDockCollapsed(){ const g=el('createGrid'); setDockCollapsed(!(g&&g.classList.contains('sdock-collapsed')), true); }
  function setDockLCollapsed(on,persist){
    const g=el('createGrid'); if(g) g.classList.toggle('sdockl-collapsed', !!on);
    const b=el('rvSDockLToggle'); if(b) b.setAttribute('aria-expanded', on?'false':'true');
    if(persist) RV.lsSet('rv_studio_dockl_collapsed', on?'1':'0');
  }
  function toggleDockLCollapsed(){ const g=el('createGrid'); setDockLCollapsed(!(g&&g.classList.contains('sdockl-collapsed')), true); }
  // the section nav now lives across BOTH side docks; treat them as one logical nav
  function rsNavHosts(){ return [el('rvSDockBody'), el('rvSDockBodyL')].filter(Boolean); }
  function rsAllNav(){ const out=[]; rsNavHosts().forEach(h=>out.push(...h.querySelectorAll('.st-nav'))); return out; }
  function rsActiveNav(){ return rsAllNav().find(b=>b.classList.contains('on'))||null; }
  function showStudioSection(id, allowToggle){
    const content=el('rsContent'); const nav=rsAllNav(); if(!content||!nav.length) return;
    const cur=rsActiveNav();
    // accordion toggle: a click on the already-open section collapses it (so every header can be seen);
    // programmatic calls (init) force-open instead of toggling.
    const target=(allowToggle && cur && cur.getAttribute('data-sec')===id) ? null : id;
    nav.forEach(b=>b.classList.toggle('on', b.getAttribute('data-sec')===target));
    document.querySelectorAll('#rsContent .st-sec').forEach(s=>s.classList.toggle('on', s.getAttribute('data-sec')===target));
    const active=rsActiveNav();
    if(active){ content.style.display=''; active.insertAdjacentElement('afterend', content); } // controls render under the open tab, in whichever dock holds it
    else { content.style.display='none'; (el('rvSDockBody')||el('rvSDockBodyL')).appendChild(content); } // fully collapsed
  }

  function buildStatusLegend(){
    const box=el('rsLegend'); if(!box) return;
    const items=[['#e0a020','rsLgPending'],['#3b82f6','rsLgViewed'],['#6366f1','rsLgComment'],['#e0803a','rsLgChanges'],
      ['#8b5cf6','rsLgProgress'],['#0ea5e9','rsLgNewVer'],['#f59e0b','rsLgAwaiting'],['#0f9a4d','rsLgApproved'],
      ['#e5484d','rsLgRejected'],['#758a80','rsLgClosed']];
    box.innerHTML=items.map(([c,k])=>`<span class="rs-lg" style="color:${c}"><span class="dot"></span><span style="color:var(--ink-2)">${(t[k]||k)}</span></span>`).join('');
  }

  function updateChips(){
    const s=reviewSettings||collectReviewSettings();
    const c=[];
    const chip=(txt,muted)=>`<span class="rs-chip${muted?' muted':''}">${txt}</span>`;
    c.push(chip(eyeSvg()+' '+t.pcView));
    if(s.perms.comment) c.push(chip(t.pcComment));
    if(s.perms.approve) c.push(chip(t.pcApprove));
    if(s.perms.download) c.push(chip(t.pcDownload)); else c.push(chip('🚫 '+t.pcDownload,true));
    if(s.security.passwordOn) c.push(chip('🔒 '+t.rsChipPw));
    if(s.security.expiryDays) c.push(chip('⏳ '+t.rsChipExp(daysWord(s.security.expiryDays))));
    if(s.security.maxViews) c.push(chip('👁 '+t.rsChipViews(s.security.maxViews)));
    if(s.security.requireEmailVerify) c.push(chip('✉️ '+t.rsChipVerify));
    if(s.security.watermarkVisual) c.push(chip('🛡️ '+t.wmVisualChip));
    if(s.security.watermarkAudio) c.push(chip('🔊 '+t.wmAudioChip));
    if(el('rsChips')) el('rsChips').innerHTML=c.join('');
  }

  function persistReviewSettings(){
    try{ if(RV.saveReviewPrefs) RV.saveReviewPrefs(reviewSettings); else RV.lsSet(RS_PREFS_KEY, JSON.stringify(reviewSettings)); }catch(_){}
  }
  function loadReviewPrefs(){
    try{ if(RV.loadReviewPrefs){ const s=RV.loadReviewPrefs(); if(s) return s; } }catch(_){}
    try{ const s=JSON.parse(RV.ls(RS_PREFS_KEY)||'null'); if(s) return s; }catch(_){}
    return null;
  }
  function onStudioChange(){
    reviewSettings=collectReviewSettings();
    persistReviewSettings();
    rsSyncSegs(); rsSyncDeps(); updateChips(); renderPreview();
  }

  async function createProject(){
    el('createErr').textContent='';
    const name=el('fName').value.trim();
    if(!name){ el('createErr').textContent=t.errName; return; }
    if(!newItems.length){ el('createErr').textContent=t.errNoFiles; return; }
    const pwOn=el('fPwToggle').checked, pwVal=el('fPassword').value;
    if(pwOn && !pwVal){ el('createErr').textContent=t.errPw; return; }

    let proj;
    try{
      proj = await withUsage('review-files', { files:newItems.length }, async()=>{
        const days=+el('fExpiry').value;
        const items = newItems.map(f=>({ id:f.id, name:(f.path||f.name), ext:f.ext, kind:f.kind, size:f.size, at:Date.now(), version:1 }));
        const wmSettings = wmForItems(items);
        reviewSettings = collectReviewSettings();       // snapshot the full approval config
        const settings = JSON.parse(JSON.stringify(reviewSettings));
        const next={
          token: RV.randToken(),
          name, client: el('fClient').value.trim(), message: el('fMessage').value.trim(),
          brand: collectBrand(),
          watermark: wmSettings,
          perms:{ comment:el('pmComment').checked, download:el('pmDownload').checked, approve:el('pmApprove').checked },
          settings,                                      // full Review Studio config (§1–§12)
          password: pwOn? await RV.hashPass(pwVal) : null,
          expiresAt: days? Date.now()+days*86400000 : 0,
          createdAt: Date.now(),
          notify: el('fNotify').checked,
          status:'draft', activeVersion:1, maxVersion:1,
          items, comments:[], events:[], decision:null
        };
        if(window.KolkliProjectNumbers) await KolkliProjectNumbers.assign('review', next);
        // persist blobs — the original is stored untouched; when a watermark is
        // configured a protected preview is baked and saved alongside it.
        try{
          for(const f of newItems){
            const extra=await saveWithWatermark(next.token, f.id, f.file, f.kind, f.ext, wmSettings);
            const meta=items.find(m=>m.id===f.id); if(meta) Object.assign(meta, extra);
          }
        }
        catch(_){ el('createErr').textContent=t.errNoFiles; throw new Error('blob_write_failed'); }
        RV.upsertProject(next);
        return next;
      });
    }catch(err){
      if(err && err.usage) return;
      if(err && err.message==='blob_write_failed') return;
      if(err && err.message==='project_number_allocation_failed'){
        el('createErr').textContent = lang==='he' ? 'לא ניתן להקצות מספר פרויקט כרגע. נסו שוב.' : 'Could not allocate a project number. Please try again.';
        return;
      }
      throw err;
    }
    lastToken=proj.token;
    showShare(proj);
    updateCount();
  }

  function showShare(proj){
    const url=proofUrl(proj.token);
    el('shareLink').textContent=url;
    el('openClientBtn').href=url;
    el('waShareBtn').href='https://wa.me/?text='+encodeURIComponent(t.waText(proj.name,url));
    const chips=[];
    const num=projectNumberText(proj);
    if(num) chips.push(`<span class="chip">${RV.escapeHtml(num)}</span>`);
    chips.push(`<span class="chip">${clockSvg()} ${proj.expiresAt? t.chipExpSoon(daysWord(Math.ceil((proj.expiresAt-Date.now())/86400000))) : t.chipNoExpiry}</span>`);
    chips.push(`<span class="chip">${fileSvg()} ${t.chipItems(proj.items.length)}</span>`);
    chips.push(`<span class="chip">${eyeSvg()} ${t.pcView}</span>`);
    if(proj.perms.comment) chips.push(`<span class="chip">${t.pcComment}</span>`);
    if(proj.perms.approve) chips.push(`<span class="chip">${t.pcApprove}</span>`);
    if(proj.perms.download) chips.push(`<span class="chip">${t.pcDownload}</span>`);
    if(proj.password) chips.push(`<span class="chip">${lockSvg()} ${t.fPwLbl}</span>`);
    el('shareChips').innerHTML=chips.join('');
    renderQR(url);
    el('createGrid').classList.add('hidden');
    el('shareCard').classList.add('show');
    el('shareCard').scrollIntoView({behavior:'smooth',block:'center'});
    if(proj.notify) requestNotifyPerm();
  }
  function requestNotifyPerm(){
    if('Notification'in window){
      if(Notification.permission==='granted'){ notifyEnabled=true; }
      else if(Notification.permission!=='denied'){ Notification.requestPermission().then(p=>{ notifyEnabled=(p==='granted'); }); }
    }
  }
  function renderQR(url){
    const box=el('qrBox'), wrap=el('qrWrap');
    try{ const qr=qrcode(0,'M'); qr.addData(url); qr.make(); box.innerHTML=qr.createImgTag(5,10);
      const img=box.querySelector('img'); if(img) img.alt='QR'; box._png=qr.createDataURL(8,10); wrap.style.display=''; }
    catch(_){ wrap.style.display='none'; }
  }
  function downloadQR(){ const png=el('qrBox')._png; if(!png) return; const a=document.createElement('a'); a.href=png; a.download='kolkli-review-qr.png'; document.body.appendChild(a); a.click(); a.remove(); }

  function resetCreate(){
    el('fName').value=''; el('fClient').value=''; el('fMessage').value=''; el('fPassword').value='';
    el('fPwToggle').checked=false; el('fPassword').classList.add('hidden');
    el('fNotify').checked=true; el('fExpiry').value='30';
    el('pmComment').checked=true; el('pmApprove').checked=true; el('pmDownload').checked=false;
    syncPermRows();
    newItems=[]; renderMaterials(); renderWmUI();
    el('createErr').textContent=''; lastToken=null;
    el('shareCard').classList.remove('show'); el('createGrid').classList.remove('hidden');
    renderPreview();
  }
  function syncPermRows(){
    document.querySelectorAll('.permrow').forEach(row=>{ const cb=row.querySelector('input'); row.classList.toggle('on', cb.checked); });
  }

  // ---------- manage ----------
  function updateCount(){ el('mgCount').textContent = RV.loadProjects().length; }
  function statusLabel(s){ return t['st'+s.charAt(0).toUpperCase()+s.slice(1)] || s; }
  // the "reopen" action is offered only when the project's settings allow it
  function reopenAllowed(pr){ return !(pr && pr.settings && pr.settings.approval && pr.settings.approval.allowReopen===false); }
  // "add version" is offered only when versioning is enabled in the project settings
  function versioningOn(pr){ return !(pr && pr.settings && pr.settings.approval && pr.settings.approval.versioning===false); }
  function projectNumberText(proj){
    return window.KolkliProjectNumbers ? KolkliProjectNumbers.display('review', proj, lang) : '';
  }

  function projCardHtml(proj){
    const st=RV.statusOf(proj);
    const openC=RV.openComments(proj);
    const kind=RV.mainKind(proj);
    const chips=[];
    const num=projectNumberText(proj);
    if(num) chips.push(`<span class="chip">${RV.escapeHtml(num)}</span>`);
    if(proj.client) chips.push(`<span class="chip">${userSvg()} ${RV.escapeHtml(t.chipClient(proj.client))}</span>`);
    chips.push(`<span class="chip">${kind?RV.FICON[kind]:fileSvg()} ${t.chipItems(proj.items.length)}</span>`);
    if(proj.maxVersion>1) chips.push(`<span class="chip">${layersSvg()} ${t.chipVersion(proj.maxVersion)}</span>`);
    chips.push(`<span class="chip">${clockSvg()} ${t.chipActivity(fmtDate(RV.lastActivity(proj)))}</span>`);
    if(openC) chips.push(`<span class="chip warn">${commentSvg()} ${t.chipComments(openC)}</span>`);

    const actions=[];
    actions.push(`<button class="minibtn go" data-act="open">${eyeSvg()} ${t.aOpen}</button>`);
    actions.push(`<button class="minibtn" data-act="copy">${copySvg()} ${t.aCopy}</button>`);
    if(st==='closed'){ if(reopenAllowed(proj)) actions.push(`<button class="minibtn" data-act="reopen">${t.aReopen}</button>`); }
    else if(st!=='expired') actions.push(`<button class="minibtn" data-act="close">${t.aClose}</button>`);
    actions.push(`<button class="minibtn danger" data-act="del">${trashSvg()} ${t.aDel}</button>`);

    const unseen = openC>0 && st!=='closed';
    return `<div class="rcard${unseen?' unseen':''}" data-token="${proj.token}">
      <div class="rc-main">
        <div class="rc-top">
          <span class="rc-name">${RV.escapeHtml(proj.name)}</span>
          <span class="badge b-${st}">${statusLabel(st)}</span>
          ${unseen?`<span class="newbadge">${t.newN(openC)}</span>`:''}
        </div>
        <div class="rc-meta">${chips.join('')}</div>
      </div>
      <div class="rc-actions">${actions.join('')}</div>
    </div>`;
  }
  function renderManage(){
    updateCount();
    const list=(window.KolkliProjectNumbers ? KolkliProjectNumbers.ensureAll('review', RV.loadProjects(), RV.saveProjects) : RV.loadProjects());
    list.sort((a,b)=>RV.lastActivity(b)-RV.lastActivity(a));
    el('reqList').innerHTML = list.map(projCardHtml).join('');
    el('mgEmpty').classList.toggle('hidden', list.length>0);
    el('reqList').classList.toggle('hidden', list.length===0);
    const comments=list.reduce((n,p)=>n+(p.comments||[]).length,0);
    const pending=list.reduce((n,p)=>n+RV.openComments(p),0);
    el('statActive').textContent=list.filter(p=>!['closed','expired'].includes(RV.statusOf(p))).length;
    el('statComments').textContent=comments; el('statPending').textContent=pending;
    el('statDone').textContent=list.filter(p=>['approved','closed'].includes(RV.statusOf(p))).length;
  }

  function copyLink(token){
    const url=proofUrl(token);
    const done=()=>toast(t.copiedShort);
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done).catch(fb); else fb();
    function fb(){ const ta=document.createElement('textarea'); ta.value=url; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(_){}; ta.remove(); done(); }
  }
  async function closeProject(token){
    const ok=await confirmDialog({tone:'warn',icon:lockSvg(),title:t.confTitleClose,message:t.confClose,confirmLabel:t.aClose});
    if(!ok) return;
    const p=RV.getProject(token); if(!p) return; p.status='closed'; RV.upsertProject(p);
    if(view==='project'&&dToken===token) renderProject(); else renderManage();
    toast(t.closedToast);
  }
  async function reopenProject(token){
    const ok=await confirmDialog({tone:'warn',icon:refreshSvg(),title:t.confTitleReopen,message:t.confReopen,confirmLabel:t.aReopen});
    if(!ok) return;
    const p=RV.getProject(token); if(!p) return;
    p.status = p.decision? (p.decision.state==='approved'?'approved':'changes') : (p.events&&p.events.some(e=>e.type==='viewed')?'viewed':'sent');
    RV.upsertProject(p);
    if(view==='project'&&dToken===token) renderProject(); else renderManage();
    toast(t.reopenedToast);
  }
  async function deleteProject(token){
    const ok=await confirmDialog({title:t.confTitleDel,message:t.confDel,confirmLabel:t.aDel});
    if(!ok) return;
    RV.deleteProject(token).then(()=>{ if(view==='project'&&dToken===token) setView('manage'); else renderManage(); updateCount(); toast(t.delToast); });
  }

  // ---------- project detail ----------
  function openProject(token){
    dToken=token; const p=RV.getProject(token); if(!p){ setView('manage'); return; }
    dVersion=p.activeVersion||p.maxVersion||1;
    renderProject(); setView('project');
  }
  function renderProject(){
    const p=RV.getProject(dToken); if(!p){ setView('manage'); return; }
    const st=RV.statusOf(p);
    el('dName').textContent=p.name;
    el('dStatus').innerHTML=`<span class="badge b-${st}">${statusLabel(st)}</span>`;

    const meta=[];
    const num=projectNumberText(p);
    if(num) meta.push(`<span class="chip rd-num">${folderSvg()} ${RV.escapeHtml(t.projForApproval)} · ${RV.escapeHtml(num)}</span>`);
    if(p.client) meta.push(`<span class="chip">${userSvg()} ${RV.escapeHtml(t.chipClient(p.client))}</span>`);
    meta.push(`<span class="chip">${clockSvg()} ${t.chipCreated(fmtDate(p.createdAt))}</span>`);
    if(p.expiresAt){
      const dleft=Math.ceil((p.expiresAt-Date.now())/86400000);
      meta.push(`<span class="chip">${clockSvg()} ${dleft>0? t.chipExpSoon(daysWord(dleft)) : t.chipExpires(fmtDate(p.expiresAt))}</span>`);
    } else meta.push(`<span class="chip">${t.chipNoExpiry}</span>`);
    el('dMeta').innerHTML=meta.join('');

    // actions
    const acts=[];
    acts.push(`<button class="btn" data-dact="open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>${t.openClient}</button>`);
    acts.push(`<button class="btn" data-dact="copy">${copySvg()}${t.aCopy}</button>`);
    if(st!=='closed'&&st!=='expired'&&versioningOn(p)) acts.push(`<button class="btn" data-dact="addver">${layersSvg()}${t.aAddVer}</button>`);
    acts.push(`<button class="btn" data-dact="access">${lockSvg()}${t.aAccess}</button>`);
    if(st==='closed'){ if(reopenAllowed(p)) acts.push(`<button class="btn rd-primary" data-dact="reopen">${refreshSvg()}${t.aReopen}</button>`); }

      vs.innerHTML=html;
    } else vs.classList.add('hidden');

      const cc=RV.commentsOf(p,it.id).length;

        <div class="ith" data-thumb="${it.id}"><span class="ith-badge">${folderSvg()}</span>${RV.FICON[it.kind]||RV.FICON.doc}${cc?`<span class="cc">${cc}</span>`:''}</div>
        <div class="imeta">
          <div class="imeta-txt"><div class="nm" title="${RV.escapeHtml(it.name)}">${RV.escapeHtml(it.name)}</div><div class="sz">${RV.fmtBytes(it.size)}${typ?` · ${typ}`:''}</div></div>
          <button class="rd-cmenu" data-menu="${it.id}" type="button" aria-label="${RV.escapeHtml(t.filePreview)}">${dotsSvg()}</button>
        </div>
      </div>`;
    }).join('');
    fillThumbs(items);

    // feedback for this version's items
    const ids=new Set(items.map(i=>i.id));
    const comments=(p.comments||[]).filter(c=>ids.has(c.itemId)).sort((a,b)=>b.at-a.at);
    el('dFeedbackN').textContent=comments.length;
    el('feedEmpty').classList.toggle('hidden', comments.length>0);
    el('feed').innerHTML = comments.map(c=>{
      const it=(p.items||[]).find(i=>i.id===c.itemId)||{name:''};
      const who=(c.author&&c.author.trim())?c.author.trim():t.anonymous;
      const av=(who||'?').trim().charAt(0).toUpperCase()||'?';
      let pos='';
      if(c.tcodeEnd!=null) pos=`<span class="fc-pos">${clockSvg()} ${mmss(c.tcode)}–${mmss(c.tcodeEnd)}</span>`;
      else if(c.tcode!=null) pos=`<span class="fc-pos">${clockSvg()} ${mmss(c.tcode)}</span>`;
      else if(c.page!=null) pos=`<span class="fc-pos">${fileSvg()} ${t.posPage(c.page)}</span>`;
      const prio=c.priority?`<span class="fc-chip prio-${c.priority}">${t['fcPrio'+c.priority.charAt(0).toUpperCase()+c.priority.slice(1)]||c.priority}</span>`:'';
      const extras=[];
      if(c.anno) extras.push(`<span class="fc-chip" style="color:${c.anno.color||'var(--accent-dim)'}">📍 ${t.fcAnno}</span>`);
      if(c.link) extras.push(`<a class="fc-chip lnk" href="${RV.escapeHtml(c.link)}" target="_blank" rel="noopener noreferrer">🔗 ${t.fcLink}</a>`);
      if(c.voice) extras.push(`<span class="fc-chip">🎙️ ${t.fcVoice}${c.voice.dur?' '+mmss(c.voice.dur):''}</span>`);
      const extrasRow=(prio||extras.length)?`<div class="fc-extras">${prio}${extras.join('')}</div>`:'';
      return `<div class="fcard${c.resolved?' res':''}" data-cid="${c.id}">
        <div class="fc-top">
          <span class="fc-av">${RV.escapeHtml(av)}</span>
          <span class="fc-who">${RV.escapeHtml(who)}</span>
          <span class="fc-on">${RV.escapeHtml(it.name)} · ${fmtDateTime(c.at)}</span>
          ${pos}
        </div>
        ${c.body?`<div class="fc-body">${RV.escapeHtml(c.body)}</div>`:''}
        ${extrasRow}
        <div class="fc-foot">

        </div>

  function renderDecision(p){
    const box=el('decisionBox');
    if(p.decision && p.decision.state==='approved'){
      box.innerHTML=`<div class="decisionbox approved"><div class="di">${checkSvg()}</div><div class="dt"><b>${t.decApprovedT}</b><span>${t.decApprovedS(RV.escapeHtml(p.decision.by||t.anonymous), fmtDateTime(p.decision.at))}</span></div></div>`;
    } else if(p.decision && p.decision.state==='changes'){
      box.innerHTML=`<div class="decisionbox changes"><div class="di">${refreshSvg()}</div><div class="dt"><b>${t.decChangesT}</b><span>${t.decChangesS(RV.escapeHtml(p.decision.by||t.anonymous), fmtDateTime(p.decision.at))}</span></div></div>`;
    } else if(p.decision && p.decision.state==='rejected'){
      box.innerHTML=`<div class="decisionbox rejected"><div class="di">${xSvg()}</div><div class="dt"><b>${t.decRejectedT}</b><span>${t.decChangesS(RV.escapeHtml(p.decision.by||t.anonymous), fmtDateTime(p.decision.at))}</span></div></div>`;
    } else {
      box.innerHTML=`<div class="decisionbox pending"><div class="di">${clockSvg()}</div><div class="dt"><b>${t.decPendingT}</b><span>${t.decPendingS}</span></div></div>`;
    }
  }
  async function fillThumbs(items){
    for(const it of items){
      if(it.kind!=='image') continue;
      try{
        const blob=await RV.loadItemBlob(dToken, it.id); if(!blob) continue;
        const holder=document.querySelector(`[data-thumb="${it.id}"]`); if(!holder) continue;
        const url=URL.createObjectURL(blob);
        const badge=holder.querySelector('.ith-badge'); const badgeHtml=badge?badge.outerHTML:'';
        const cc=holder.querySelector('.cc'); const ccHtml=cc?cc.outerHTML:'';
        holder.innerHTML=badgeHtml+`<img src="${url}" alt="">`+ccHtml;
      }catch(_){}
    }
  }
  async function addVersionFiles(list){
    const p=RV.getProject(dToken); if(!p) return;
    const arr=Array.from(list||[]); if(!arr.length) return;
    const nv=(p.maxVersion||1)+1;
    const metas=[];
    try{
      for(const file of arr){
        const ext=RV.extOf(file.name), kind=RV.kindOf(ext), id='ri'+RV.randToken()+(uid++);
        const extra=await saveWithWatermark(p.token, id, file, kind, ext, p.watermark);
        metas.push(Object.assign({ id, name:file.name, ext, kind, size:file.size, at:Date.now(), version:nv }, extra));
      }
    }catch(_){ return; }
    p.items=(p.items||[]).concat(metas);
    p.maxVersion=nv; p.activeVersion=nv;
    p.versions=(p.versions||[]).concat([{v:nv, at:Date.now()}]);
    if(p.status==='approved'||p.status==='changes'||p.status==='viewed') p.status='sent';
    RV.upsertProject(p);
    dVersion=nv; renderProject(); toast(t.verAddedToast(nv));
  }
  function toggleResolve(cid){
    const p=RV.getProject(dToken); if(!p) return;
    const c=(p.comments||[]).find(x=>x.id===cid); if(!c) return;
    c.resolved=!c.resolved; RV.upsertProject(p); renderProject();

  async function previewItem(id){
    const p=RV.getProject(dToken); if(!p) return;
    const it=(p.items||[]).find(i=>i.id===id); if(!it) return;
    const blob=await RV.getBlob(id); if(!blob) return;
    const url=URL.createObjectURL(blob);
    el('pvTitle').textContent=it.name; const body=el('pvBody');
    if(it.kind==='image') body.innerHTML=`<img src="${url}" alt="">`;
    else if(it.kind==='video'){ body.innerHTML=videoPlayerHTML(url,true); wireVideoPlayer(body.querySelector('.vplayer')); }
    else if(it.kind==='audio') body.innerHTML=`<audio src="${url}" controls controlsList="nodownload noplaybackrate" autoplay></audio>`;
    else if(it.ext==='pdf') body.innerHTML=`<iframe src="${url}"></iframe>`;
    else { const a=document.createElement('a'); a.href=url; a.download=it.name; document.body.appendChild(a); a.click(); a.remove(); return; }
    el('pv').classList.add('show');
  }

  // ---------- access-settings info + per-file menu (detail skin) ----------
  function infoDialog(opts){
    return new Promise(resolve=>{
      const overlay=el('cf'), okBtn=el('cfConfirm'), cancelBtn=el('cfCancel'), ico=el('cfIco');
      ico.className='cf-ico warn'; ico.innerHTML=opts.icon||lockSvg();
      el('cfTitle').textContent=opts.title||''; el('cfMsg').textContent=opts.message||'';
      el('cfMsg').style.whiteSpace='pre-line';
      okBtn.className='cf-confirm warn'; okBtn.textContent=opts.okLabel||t.close;
      cancelBtn.style.display='none';
      overlay.classList.add('show');
      function done(){ overlay.classList.remove('show'); cancelBtn.style.display=''; el('cfMsg').style.whiteSpace='';
        okBtn.onclick=overlay.onclick=null; document.removeEventListener('keydown',onKey); resolve(); }
      function onKey(e){ if(e.key==='Escape'||e.key==='Enter') done(); }
      okBtn.onclick=done; overlay.onclick=e=>{ if(e.target===overlay) done(); };
      document.addEventListener('keydown',onKey);
      setTimeout(()=>{ try{ okBtn.focus(); }catch(_){} },30);
    });
  }
  function showAccess(p){
    const lines=[];
    lines.push(p.password? t.accPwOn : t.accPwOff);
    lines.push(p.expiresAt? t.accExp(fmtDate(p.expiresAt)) : t.accExpNever);
    const can=[t.pcView];
    if(p.perms && p.perms.comment) can.push(t.pcComment);
    if(p.perms && p.perms.approve) can.push(t.pcApprove);
    if(p.perms && p.perms.download) can.push(t.pcDownload);
    lines.push(t.accCan(can.join(', ')));
    infoDialog({ title:t.accessTitle, message:lines.join('\n'), icon:lockSvg(), okLabel:t.close });
  }

  function onDocMenu(e){ if(!e.target.closest('#rdMenu')) closeCardMenu(); }
  function openCardMenu(btn,itemId){
    closeCardMenu();

    const it=(p.items||[]).find(i=>i.id===itemId); if(!it) return;
    const canDl=!!(p.perms && p.perms.download);

    menu.innerHTML=html; document.body.appendChild(menu);
    const r=btn.getBoundingClientRect(), mw=menu.offsetWidth||176;
    let left=r.right+window.scrollX-mw; if(left<8+window.scrollX) left=r.left+window.scrollX;
    menu.style.top=(r.bottom+window.scrollY+6)+'px'; menu.style.left=left+'px';
    menu.addEventListener('click',e=>{

  async function downloadItem(id){
    const p=RV.getProject(dToken); if(!p) return;
    const it=(p.items||[]).find(i=>i.id===id); if(!it) return;
    const blob=await RV.getBlob(id); if(!blob) return;

  // ---------- incoming client activity ----------
  function onIncoming(d){
    if(!d || !d.token) return;
    const p=RV.getProject(d.token); if(!p) return;
    const who=(d.who && d.who.trim())? d.who.trim() : t.anonymous;
    let msg='';
    if(d.type==='viewed') msg=t.actViewed(who);
    else if(d.type==='commented') msg=t.actCommented(who);
    else if(d.type==='approved') msg=t.actApproved(who);
    else if(d.type==='changes') msg=t.actChanges(who);
    else if(d.type==='rejected') msg=t.actRejected(who);
    if(msg){
      toast(msg);
      // browser push honors the master toggle AND the per-event switches in the Review Studio
      if(p.notify){
        const nk={viewed:'viewed',commented:'commented',approved:'approved',changes:'requestedChanges',rejected:'rejected',opened:'opened',downloaded:'downloaded'}[d.type];
        const gn=p.settings&&p.settings.notify;
        const allowed = !gn || nk===undefined || gn[nk]!==false;
        if(allowed){ try{ if('Notification'in window && Notification.permission==='granted') new Notification(t.notifTitle,{body:msg}); }catch(_){} }
      }
    }
    if(view==='manage') renderManage();
    else if(view==='project' && dToken===d.token) renderProject();
    updateCount();
  }

  // ---------- modern custom video player (no native controls → no download / speed / PiP menu) ----------
  function videoPlayerHTML(url,autoplay){
    const play='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
    const pause='<svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
    const volOn='<svg class="ic-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
    const volOff='<svg class="ic-unmute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>';
    const fs='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M21 16v3a2 2 0 0 1-2 2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/></svg>';
    return `<div class="vplayer" tabindex="0">
      <video src="${url}"${autoplay?' autoplay':''} playsinline preload="metadata" controlslist="nodownload noplaybackrate noremoteplayback" disablepictureinpicture disableremoteplayback></video>
      <button class="vp-big" type="button" aria-label="נגן" data-vpbig>${play}</button>
      <div class="vp-bar">
        <button class="vp-btn" type="button" aria-label="הפעל / השהה" data-vptoggle><span class="ic-play">${play}</span>${pause}</button>
        <span class="vp-time" data-vpcur>0:00</span>
        <div class="vp-seek" data-vpseek><div class="vp-seek-track"><div class="vp-seek-buf" data-vpbuf></div><div class="vp-seek-fill" data-vpfill></div></div><div class="vp-seek-knob" data-vpknob></div></div>
        <span class="vp-time" data-vpdur>0:00</span>
        <div class="vp-volwrap">
          <button class="vp-btn" type="button" aria-label="השתקה" data-vpmute>${volOn}${volOff}</button>
          <div class="vp-vol"><div class="vp-seek" data-vpvol><div class="vp-seek-track"><div class="vp-seek-fill" data-vpvolfill></div></div><div class="vp-seek-knob" data-vpvolknob></div></div></div>
        </div>
        <button class="vp-btn" type="button" aria-label="מסך מלא" data-vpfs>${fs}</button>
      </div>
    </div>`;

  function wireVideoPlayer(root){
    if(!root) return;
    const v=root.querySelector('video'); if(!v) return;
    const q=s=>root.querySelector(s);
    const bigBtn=q('[data-vpbig]'), toggleBtn=q('[data-vptoggle]'), muteBtn=q('[data-vpmute]'), fsBtn=q('[data-vpfs]');
    const cur=q('[data-vpcur]'), dur=q('[data-vpdur]');
    const seek=q('[data-vpseek]'), fill=q('[data-vpfill]'), buf=q('[data-vpbuf]'), knob=q('[data-vpknob]');
    const vol=q('[data-vpvol]'), volFill=q('[data-vpvolfill]'), volKnob=q('[data-vpvolknob]');
    const setPlaying=p=>root.classList.toggle('playing',p);
    const togglePlay=()=>{ if(v.paused) v.play().catch(()=>{}); else v.pause(); };
    v.addEventListener('play',()=>setPlaying(true));
    v.addEventListener('pause',()=>setPlaying(false));
    v.addEventListener('ended',()=>setPlaying(false));
    bigBtn.addEventListener('click',togglePlay);
    toggleBtn.addEventListener('click',togglePlay);
    v.addEventListener('click',togglePlay);
    const fmtDur=()=>{ dur.textContent=isFinite(v.duration)?mmss(v.duration):'0:00'; };
    v.addEventListener('loadedmetadata',fmtDur); v.addEventListener('durationchange',fmtDur); fmtDur();
    const paintSeek=()=>{ const d=v.duration||0, p=d?Math.min(1,v.currentTime/d):0; fill.style.width=(p*100)+'%'; knob.style.left=(p*100)+'%'; cur.textContent=mmss(v.currentTime); };
    v.addEventListener('timeupdate',paintSeek); paintSeek();
    v.addEventListener('progress',()=>{ try{ if(v.buffered.length){ const end=v.buffered.end(v.buffered.length-1), d=v.duration||0; buf.style.width=(d?Math.min(1,end/d)*100:0)+'%'; } }catch(_){} });
    // seek scrubbing
    const posOf=(elm,e)=>{ const r=elm.getBoundingClientRect(); const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left; return Math.max(0,Math.min(1,x/(r.width||1))); };
    let seeking=false;
    const doSeek=e=>{ const d=v.duration||0; if(!d) return; const p=posOf(seek,e); v.currentTime=p*d; paintSeek(); };
    const seekMove=e=>{ if(seeking){ doSeek(e); e.preventDefault(); } };
    const seekUp=()=>{ seeking=false; document.removeEventListener('pointermove',seekMove); document.removeEventListener('pointerup',seekUp); };
    seek.addEventListener('pointerdown',e=>{ seeking=true; doSeek(e); document.addEventListener('pointermove',seekMove); document.addEventListener('pointerup',seekUp); });
    // volume
    const paintVol=()=>{ const p=v.muted?0:v.volume; volFill.style.width=(p*100)+'%'; volKnob.style.left=(p*100)+'%'; root.classList.toggle('muted',v.muted||v.volume===0); };
    v.addEventListener('volumechange',paintVol);
    muteBtn.addEventListener('click',()=>{ if(!v.muted && v.volume===0) v.volume=1; v.muted=!v.muted; });
    let voldrag=false;
    const doVol=e=>{ const p=posOf(vol,e); v.muted=false; v.volume=p; };
    const volMove=e=>{ if(voldrag){ doVol(e); e.preventDefault(); } };
    const volUp=()=>{ voldrag=false; document.removeEventListener('pointermove',volMove); document.removeEventListener('pointerup',volUp); };
    vol.addEventListener('pointerdown',e=>{ voldrag=true; doVol(e); document.addEventListener('pointermove',volMove); document.addEventListener('pointerup',volUp); });
    paintVol();
    // fullscreen
    fsBtn.addEventListener('click',()=>{ const fe=document.fullscreenElement||document.webkitFullscreenElement; if(fe){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); } else { (root.requestFullscreen||root.webkitRequestFullscreen||(()=>{})).call(root); } });
    // keyboard (when player focused)
    root.addEventListener('keydown',e=>{
      if(e.target.closest('input,textarea')) return;
      if(e.key===' '||e.key==='k'){ e.preventDefault(); togglePlay(); }
      else if(e.key==='ArrowLeft'){ e.preventDefault(); v.currentTime=Math.max(0,v.currentTime-5); }
      else if(e.key==='ArrowRight'){ e.preventDefault(); v.currentTime=Math.min(v.duration||0,v.currentTime+5); }
      else if(e.key==='m'){ v.muted=!v.muted; }
      else if(e.key==='f'){ fsBtn.click(); }
    });
    setPlaying(!v.paused);
  }

  // ---------- events ----------
  el('modeAdmin').addEventListener('click',()=>setMode('admin'));
  el('modeClient').addEventListener('click',()=>setMode('client'));
  el('tabManage').addEventListener('click',()=>setView('manage'));
  el('newReqBtn').addEventListener('click',()=>{ resetCreate(); viewMode='admin'; setView('create'); });
  el('emptyNewBtn').addEventListener('click',()=>{ resetCreate(); viewMode='admin'; setView('create'); });
  el('toManageBtn').addEventListener('click',()=>setView('manage'));
  el('backBtn').addEventListener('click',()=>setView('manage'));
  el('createBackBtn').addEventListener('click',()=>setView('manage'));

  // ---------- hero cover image ----------
  // Owner-scoped cover for the create-screen hero. When set it replaces the
  // default hero art; the original file is never touched (see request/received).
  function applyCover(){
    const cover=RV.loadCover();
    const bg=document.querySelector('.rv-hero-bg');
    if(bg) bg.style.backgroundImage = cover ? 'url("'+cover+'")' : "url('assets/hero-bg.jpg')";
    const rm=el('coverRmBtn'); if(rm) rm.classList.toggle('hidden', !cover);
  }
  function readCoverFile(file){
    if(!file) return;
    if(!/^image\//.test(file.type) || file.size>8*1024*1024){ alert(t.coverErr); return; }
    const reader=new FileReader();
    reader.onload=function(){
      const img=new Image();
      img.onload=function(){
        // downscale wide covers so the data URL stays localStorage-friendly
        const maxW=1600, scale=Math.min(1, maxW/(img.width||maxW));
        const w=Math.max(1,Math.round((img.width||maxW)*scale)), h=Math.max(1,Math.round((img.height||1)*scale));
        let out;
        try{ const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); out=c.toDataURL('image/jpeg',0.85); }
        catch(_){ out=reader.result; }
        RV.saveCover(out); applyCover();
      };
      img.onerror=function(){ RV.saveCover(reader.result); applyCover(); };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  }
  el('coverBtn').addEventListener('click',()=>el('coverInput').click());
  el('coverInput').addEventListener('change',()=>{ readCoverFile(el('coverInput').files[0]); el('coverInput').value=''; });
  el('coverRmBtn').addEventListener('click',()=>{ RV.saveCover(''); applyCover(); });

  // materials uploader
  const drop=el('drop'), input=el('fileInput'), folderInput=el('folderInput');
  el('chooseBtn').addEventListener('click',e=>{ e.stopPropagation(); input.click(); });
  el('chooseFolderBtn').addEventListener('click',e=>{ e.stopPropagation(); folderInput.click(); });
  drop.addEventListener('click',()=>input.click());
  input.addEventListener('change',()=>{ addFiles(pathItems(input.files)); input.value=''; });
  folderInput.addEventListener('change',()=>{ addFiles(pathItems(folderInput.files)); folderInput.value=''; });
  ;['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.add('over'); }));
  ;['dragleave','dragend'].forEach(ev=>drop.addEventListener(ev,()=>drop.classList.remove('over')));
  drop.addEventListener('drop',e=>{ e.preventDefault(); drop.classList.remove('over'); if(e.dataTransfer) addFromDataTransfer(e.dataTransfer); });
  el('mlist').addEventListener('click',e=>{ const b=e.target.closest('[data-rm]'); if(b) removeItem(b.getAttribute('data-rm')); });

  // perms + preview inputs
  // ---------- Review Studio wiring (docked sidebar) ----------
  const rsNavClick = e=>{ const b=e.target.closest('[data-sec]'); if(b) showStudioSection(b.getAttribute('data-sec'), true); };
  if(el('rvSDockBody')) el('rvSDockBody').addEventListener('click', rsNavClick);
  if(el('rvSDockBodyL')) el('rvSDockBodyL').addEventListener('click', rsNavClick);
  if(el('rvSDockToggle')) el('rvSDockToggle').addEventListener('click', toggleDockCollapsed);
  if(el('rvSDockLToggle')) el('rvSDockLToggle').addEventListener('click', toggleDockLCollapsed);
  el('rsContent').addEventListener('click', e=>{
    const seg=e.target.closest('[data-seg]'); if(!seg) return;
    const hidden=rsInput(seg.getAttribute('data-seg')); if(hidden) hidden.value=seg.getAttribute('data-val');
    onStudioChange();
  });
  el('rsContent').addEventListener('change', onStudioChange);
  el('rsContent').addEventListener('input', onStudioChange);
  ['fName','fMessage'].forEach(id=>el(id).addEventListener('input',renderPreview));
  el('brName').addEventListener('input',()=>{ brand.name=el('brName').value.trim(); RV.saveBrand(brand); renderPreview(); });
  el('brColor').addEventListener('input',()=>{ brand.color=el('brColor').value; RV.saveBrand(brand); renderPreview(); });
  el('fPwToggle').addEventListener('change',e=>{ el('fPassword').classList.toggle('hidden',!e.target.checked); if(e.target.checked) el('fPassword').focus(); renderPreview(); });

  // logo upload
  el('logoBtn').addEventListener('click',()=>el('logoInput').click());
  el('logoInput').addEventListener('change',()=>{
    const f=el('logoInput').files&&el('logoInput').files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>{ brand.logo=r.result; RV.saveBrand(brand); setLogoPreview(brand.logo); renderPreview(); }; r.readAsDataURL(f);
    el('logoInput').value='';
  });
  el('logoRmBtn').addEventListener('click',()=>{ brand.logo=''; RV.saveBrand(brand); setLogoPreview(''); renderPreview(); });

  // watermark controls
  el('wmOn').addEventListener('change',e=>{ wm.on=e.target.checked; el('wmSec').classList.toggle('on',wm.on); saveWmPrefs(); renderPreview(); });
  el('wmVisOn').addEventListener('change',e=>{ wm.visual.on=e.target.checked; el('wmVisualBlock').classList.toggle('off',!wm.visual.on); saveWmPrefs(); renderPreview(); });
  el('wmAudOn').addEventListener('change',e=>{ wm.audio.on=e.target.checked; el('wmAudioBlock').classList.toggle('off',!wm.audio.on); saveWmPrefs(); renderPreview(); });
  el('wmTypeSeg').addEventListener('click',e=>{ const b=e.target.closest('[data-wmtype]'); if(!b) return; wm.visual.type=b.getAttribute('data-wmtype'); renderWmUI(); saveWmPrefs(); scheduleWmPreview(); });
  el('wmTextInp').addEventListener('input',e=>{ wm.visual.text=e.target.value; saveWmPrefs(); scheduleWmPreview(); });
  el('wmColor').addEventListener('input',e=>{ wm.visual.color=e.target.value; saveWmPrefs(); scheduleWmPreview(); });
  el('wmPos').addEventListener('click',e=>{ const b=e.target.closest('[data-pos]'); if(!b) return; wm.visual.position=b.getAttribute('data-pos'); document.querySelectorAll('#wmPos button').forEach(x=>x.classList.toggle('on',x===b)); saveWmPrefs(); scheduleWmPreview(); });
  el('wmSize').addEventListener('input',e=>{ wm.visual.size=+e.target.value; el('wmSizeV').textContent=e.target.value+'%'; saveWmPrefs(); scheduleWmPreview(); });
  el('wmOpacity').addEventListener('input',e=>{ wm.visual.opacity=+e.target.value; el('wmOpacityV').textContent=e.target.value+'%'; saveWmPrefs(); scheduleWmPreview(); });
  el('wmRotation').addEventListener('input',e=>{ wm.visual.rotation=+e.target.value; el('wmRotationV').textContent=e.target.value+'°'; saveWmPrefs(); scheduleWmPreview(); });
  el('wmTile').addEventListener('change',e=>{ wm.visual.tile=e.target.checked; el('wmPos').classList.toggle('tiled',wm.visual.tile); saveWmPrefs(); scheduleWmPreview(); });
  el('wmLogoBtn').addEventListener('click',()=>el('wmLogoInput').click());
  el('wmLogoInput').addEventListener('change',()=>{
    const f=el('wmLogoInput').files&&el('wmLogoInput').files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>{ wm.visual.logo=r.result; setWmLogoPreview(wm.visual.logo); saveWmPrefs(); scheduleWmPreview(); }; r.readAsDataURL(f);
    el('wmLogoInput').value='';
  });
  el('wmLogoRm').addEventListener('click',()=>{ wm.visual.logo=''; setWmLogoPreview(''); saveWmPrefs(); scheduleWmPreview(); });
  el('wmInterval').addEventListener('input',e=>{ wm.audio.interval=+e.target.value; el('wmIntervalV').textContent=e.target.value+'s'; saveWmPrefs(); });
  el('wmRandom').addEventListener('change',e=>{ wm.audio.random=e.target.checked; saveWmPrefs(); });
  el('wmVolume').addEventListener('input',e=>{ wm.audio.volume=+e.target.value; el('wmVolumeV').textContent=e.target.value+'%'; saveWmPrefs(); });
  el('wmPlacement').addEventListener('change',e=>{ wm.audio.placement=e.target.value; saveWmPrefs(); });

  el('createBtn').addEventListener('click',createProject);
  el('copyBtn').addEventListener('click',()=>{ if(lastToken) copyLink(lastToken); toast(t.copied); });
  el('qrDlBtn').addEventListener('click',downloadQR);
  el('emailShareBtn').addEventListener('click',()=>{
    if(!lastToken) return; const p=RV.getProject(lastToken); const url=proofUrl(lastToken);
    const href='mailto:?subject='+encodeURIComponent(t.emailSubject(p.name))+'&body='+encodeURIComponent(t.emailBody(p.name,url,p.message));
    const a=document.createElement('a'); a.href=href; a.style.display='none'; document.body.appendChild(a); a.click(); a.remove();
  });

  el('reqList').addEventListener('click',e=>{
    const card=e.target.closest('[data-token]'); if(!card) return;
    const token=card.getAttribute('data-token');
    const btn=e.target.closest('[data-act]');
    if(!btn){ openProject(token); return; }
    const act=btn.getAttribute('data-act');
    if(act==='open') openProject(token);
    else if(act==='copy') copyLink(token);
    else if(act==='close') closeProject(token);
    else if(act==='reopen') reopenProject(token);
    else if(act==='del') deleteProject(token);
  });

  el('dActions').addEventListener('click',e=>{
    const b=e.target.closest('[data-dact]'); if(!b) return;
    const a=b.getAttribute('data-dact');
    if(a==='open') window.open(proofUrl(dToken),'_blank','noopener');
    else if(a==='copy') copyLink(dToken);
    else if(a==='addver') el('verInput').click();
    else if(a==='access'){ const p=RV.getProject(dToken); if(p) showAccess(p); }
    else if(a==='close') closeProject(dToken);
    else if(a==='reopen') reopenProject(dToken);
  });
  el('verInput').addEventListener('change',()=>{ addVersionFiles(el('verInput').files); el('verInput').value=''; });
  el('vSwitch').addEventListener('click',e=>{ const b=e.target.closest('[data-ver]'); if(!b) return; dVersion=+b.getAttribute('data-ver'); renderProject(); });
  el('itemGrid').addEventListener('click',e=>{
    const mb=e.target.closest('[data-menu]');
    if(mb){ e.stopPropagation(); openCardMenu(mb, mb.getAttribute('data-menu')); return; }
    const c=e.target.closest('[data-item]'); if(c) previewItem(c.getAttribute('data-item'));
  });
  el('feed').addEventListener('click',e=>{ const b=e.target.closest('[data-res]'); if(b) toggleResolve(b.getAttribute('data-res')); });
  el('rdShareBtn').addEventListener('click',()=>{ if(dToken) copyLink(dToken); });
  el('dCopyIco').addEventListener('click',()=>{ if(dToken) copyLink(dToken); });
  el('rdA11y').addEventListener('click',()=>toast(t.a11yToast));
  window.addEventListener('scroll',()=>closeCardMenu(),true);

  el('pvClose').addEventListener('click',closePreview);
  el('pv').addEventListener('click',e=>{ if(e.target===el('pv')) closePreview(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePreview(); });

  window.__setLang=applyLang;
  const themeBtn=el('themeToggle'); if(themeBtn) themeBtn.addEventListener('click',()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));

  // listen for client activity (this browser) + poll fallback
  RV.listen(onIncoming);
  let lastSig='';
  setInterval(()=>{
    const list=RV.loadProjects();
    const sig=list.map(p=>p.token+':'+(p.comments||[]).length+':'+p.status+':'+(p.decision?p.decision.state:'')).join('|');
    if(sig!==lastSig){ lastSig=sig; if(view==='manage') renderManage(); else if(view==='project') renderProject(); updateCount(); }
  },3500);

  // ---------- init ----------
  applyTheme(ls('theme')||'light');
  loadBrandUI();
  applyCover();
  loadWmPrefs();
  // Review Studio: relocate inline blocks into their sections, dock the sidebar, hydrate saved settings
  rsMountInline();
  dockReviewStudio();
  setDockCollapsed(ls('rv_studio_dock_collapsed')==='1', false);
  setDockLCollapsed(ls('rv_studio_dockl_collapsed')==='1', false);
  const savedRS=loadReviewPrefs(); reviewSettings = savedRS ? Object.assign(defaultReviewSettings(), savedRS) : defaultReviewSettings();
  applyReviewSettings(reviewSettings);
  showStudioSection('perms');
  applyLang(RV.detectLang());
  renderMaterials(); renderWmUI(); renderPreview(); updateChips(); updateCount();
  requestNotifyPerm();
  const openTok=(location.search.match(/[?&]p=([^&]+)/)||[])[1];
  const routeInitial=function(){
    const tk=openTok?decodeURIComponent(openTok):'';
    if(tk && RV.getProject(tk)){ openProject(tk); }
    else if(/[?&]view=manage/.test(location.search)){ setView('manage'); }
    else { setView('create'); }
  };
  // Cross-device: hydrate this owner's projects from the server into the local
  // mirror first (instant no-op when Supabase is unconfigured), then route. If a
  // project is opened directly by token and isn't local yet, fetch just that one.
  (RV.pullMine ? RV.pullMine() : Promise.resolve()).then(function(){
    updateCount();
    const tk=openTok?decodeURIComponent(openTok):'';
    if(tk && !RV.getProject(tk) && RV.pullToken){ RV.pullToken(tk).then(routeInitial); }
    else routeInitial();
  });
})();
