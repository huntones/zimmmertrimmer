<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOLKLI — Client Review</title>
<link rel="canonical" href="https://kolkli.com/review">
<meta name="description" content="Send work to your client for sign-off — share a private, branded link, collect comments, and get approval.">
<style>
  :root {
    --bg:#edf5f0; --panel:#ffffff; --panel-2:#f0f7f3; --line:#dfeae2; --line-2:#ecf4ef;
    --ink:#16241c; --ink-2:#2a3d34; --muted:#63776b; --faint:#92a89b;
    --accent:#0b7a41; --accent-dim:#076f39; --accent-ink:#ffffff; --accent-soft:#dcefe4;
    --success:#0f9a4d; --success-dim:#0b7d3e; --success-soft:#dff3e8;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --danger:#e5484d; --danger-soft:#fdecec;
    --warm-soft:#fff5da; --warm-line:#f2d98a;
    --ok:#0f9a4d; --warn:#c88a04; --err:#e5484d;
    --grad:linear-gradient(105deg,#16a35a 0%,#076f39 100%);
    --grad-h:linear-gradient(105deg,#1aad61 0%,#0a7c40 100%);
    --grad-soft:linear-gradient(120deg,#e2f3e9,#d4ecdd);
    --grad-shadow:rgba(7,111,57,0.30);
    --grad-btn:linear-gradient(105deg,#16a35a 0%,#076f39 100%);
    --grad-btn-glow:rgba(7,111,57,0.36);
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-lg:0 2px 6px rgba(20,24,44,0.05), 0 20px 50px rgba(20,24,44,0.10);
    --shadow-sm:0 1px 2px rgba(20,24,44,0.05);
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --sans:'Overpass','Rubik',system-ui,'Segoe UI',sans-serif;
  }
  html[data-theme="dark"] {
    --bg:#0c1310; --panel:#131d18; --panel-2:#18261f; --line:#263831; --line-2:#1f3029;
    --ink:#ecf3ef; --ink-2:#d8e7de; --muted:#8aa096; --faint:#667a70;
    --accent:#35c07e; --accent-dim:#5fd39a; --accent-ink:#0c1310; --accent-soft:#123023;
    --success:#3fce85; --success-dim:#2fbd77; --success-soft:#10281c;
    --info:#5b95f8; --info-dim:#4f8ef7; --info-soft:#182338;
    --danger:#ff6b6b; --danger-soft:#2a1719;
    --warm-soft:#2c2718; --warm-line:#5a4d24;
    --ok:#3fce85; --warn:#e8b84b; --err:#ff6b6b;
    --grad:linear-gradient(105deg,#16a35a 0%,#076f39 100%);
    --grad-h:linear-gradient(105deg,#2ecb7c 0%,#109455 100%);
    --grad-soft:linear-gradient(120deg,#0f2a1c,#0b2617);
    --grad-shadow:rgba(20,160,95,0.42);
    --grad-btn:linear-gradient(105deg,#16a35a 0%,#076f39 100%);
    --grad-btn-glow:rgba(20,160,95,0.40);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,0.45), 0 24px 60px rgba(0,0,0,0.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;overflow-x:clip;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;}
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:var(--grad);z-index:100;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--sans);}
  .wrap{width:100%;max-width:none;margin:0 auto;padding:16px 0 18px;}
  @media (max-width:840px){ .wrap{width:100%;max-width:none;padding:18px 14px 48px;} }

  /* page intro */
  .pagehead{text-align:center;margin:0 auto 12px;}
  .pagehead h2{font-size:clamp(25px,3.3vw,34px);font-weight:700;letter-spacing:-0.02em;margin:0 0 6px;}
  .pagehead .kick{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:13px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);
    padding:4px 11px;border-radius:999px;margin-bottom:11px;}
  .pagehead p{font-size:16px;color:var(--muted);margin:0 auto;max-width:70ch;}

  /* tabs */
  .tabs{display:flex;width:max-content;max-width:100%;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin:0 auto 14px;box-shadow:var(--shadow-sm);}
  .tab{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border:none;border-radius:9px;background:transparent;
    color:var(--muted);cursor:pointer;font-size:15px;font-weight:600;transition:color .14s,background .14s,box-shadow .14s;}
  .tab.on{background:var(--accent-soft);color:var(--accent-dim);box-shadow:var(--shadow-sm);}
  .tab svg{width:16px;height:16px;}
  .tab .count{font-family:var(--mono);font-size:12.5px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--muted);}
  .tab.on .count{background:var(--panel);color:var(--accent-dim);}
  #tabManage{order:0;}
  #tabCreate{order:1;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,280px);gap:16px;align-items:start;}
  @media (max-width:840px){ .grid{grid-template-columns:1fr;} }
  .col{min-width:0;}
  .hidden{display:none !important;}

  /* form */
  .form{padding:20px;}
  .form h3{font-size:16.5px;margin:0 0 16px;font-weight:700;}
  .opt{margin-bottom:16px;}
  .opt > label,.optlbl{display:block;font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:7px;}
  .optlbl .req{color:var(--danger);}
  .hint{font-size:12.5px;color:var(--faint);margin-top:6px;}
  .inp,.ta{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;
    font-family:var(--sans);font-size:15px;padding:10px 12px;transition:border-color .12s,box-shadow .12s;}
  .inp:focus,.ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .ta{resize:vertical;min-height:64px;}
  .inp[dir=ltr]{text-align:start;}
  select.inp{cursor:pointer;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:520px){ .two{grid-template-columns:1fr;} }
  .chkline{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;margin-bottom:8px;}
  .chkline input{accent-color:var(--accent);width:15px;height:15px;}

  /* perms toggle rows */
  .perms{display:flex;flex-direction:column;gap:2px;}
  .permrow{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel-2);cursor:pointer;margin-bottom:8px;transition:border-color .12s,background .12s;}
  .permrow:hover{border-color:var(--accent);}
  .permrow.on{border-color:var(--accent);background:var(--accent-soft);}
  .permrow .pk{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--panel);color:var(--accent);border:1px solid var(--line-2);}
  .permrow.on .pk{background:var(--accent);color:#fff;border-color:transparent;}
  .permrow .pk svg{width:17px;height:17px;}
  .permrow .pt{flex:1;min-width:0;}
  .permrow .pt b{display:block;font-size:14.5px;font-weight:600;color:var(--ink);}
  .permrow .pt span{font-size:13px;color:var(--muted);}
  .permrow input{accent-color:var(--accent);width:16px;height:16px;flex-shrink:0;}

  /* brand editor */
  .brandbox{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel-2);}
  .brandrow{display:flex;align-items:center;gap:12px;margin-top:12px;}
  .logoprev{width:56px;height:56px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:var(--panel);border:1px dashed var(--line);overflow:hidden;color:var(--faint);}
  .logoprev img{max-width:100%;max-height:100%;object-fit:contain;}
  .logoprev svg{width:22px;height:22px;}
  .minibtn2{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink-2);cursor:pointer;font-size:14px;font-weight:600;transition:border-color .12s;}
  .minibtn2:hover{border-color:var(--accent);} .minibtn2 svg{width:14px;height:14px;}
  .colorwrap{display:flex;align-items:center;gap:9px;}
  .colorwrap input[type=color]{width:40px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--panel);cursor:pointer;padding:2px;}

  /* materials uploader */
  .drop{display:flex;align-items:center;gap:14px;border:2px dashed color-mix(in srgb,var(--accent) 55%,var(--line));border-radius:14px;
    padding:11px 15px;cursor:pointer;background:var(--panel-2);transition:border-color .15s,background .15s;}
  .drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);}
  .drop .cloud{width:40px;height:40px;flex:0 0 auto;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);}
  .drop .cloud svg{width:22px;height:22px;}
  .drop .dinfo{flex:1;min-width:0;text-align:start;}
  .drop .big{font-size:16px;font-weight:600;color:var(--ink);}
  .drop .dhint{margin-top:2px;font-size:13px;color:var(--faint);font-family:var(--mono);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .drop .dbtns{display:flex;align-items:center;gap:8px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end;}
  .drop .choose{display:inline-flex;align-items:center;gap:7px;color:#fff;border:none;white-space:nowrap;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:600;font-size:14.5px;padding:9px 16px;border-radius:999px;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 12px var(--grad-btn-glow);transition:filter .14s;}
  .drop .choose:hover{filter:brightness(1.05);} .drop .choose:active{transform:translateY(1px);}
  .drop .choose svg{width:15px;height:15px;}
  .drop .choose.ghost{color:var(--accent-dim,var(--accent));background:var(--panel);border:1px solid var(--accent);text-shadow:none;box-shadow:none;}
  html[data-theme="dark"] .drop .choose.ghost{color:var(--accent);}
  .drop .choose.ghost:hover{background:var(--accent-soft);filter:none;}
  @media (max-width:560px){ .drop{flex-wrap:wrap;} .drop .dinfo{flex:1 1 auto;} .drop .dbtns{flex:1 1 100%;} .drop .choose{flex:1;justify-content:center;} }
  input[type=file]{display:none;}
  .mlist{display:flex;flex-direction:column;gap:8px;margin-top:12px;max-height:340px;overflow-y:auto;overscroll-behavior:contain;}
  .mlist::-webkit-scrollbar{width:10px;}
  .mlist::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:999px;border:3px solid var(--panel);}
  .mlist::-webkit-scrollbar-thumb:hover{background:var(--muted);}
  .mrow{display:flex;align-items:center;gap:11px;padding:9px 11px;border:1px solid var(--line-2);border-radius:11px;background:var(--panel);}
  .mrow .fico{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);overflow:hidden;}
  .mrow .fico.image{color:var(--info);background:var(--info-soft);} .mrow .fico.video{color:#e5484d;background:var(--danger-soft);}
  .mrow .fico.doc{color:var(--info-dim);background:var(--info-soft);}
  .mrow .fico img{width:100%;height:100%;object-fit:cover;} .mrow .fico svg{width:16px;height:16px;}
  .mrow .fn{flex:1;min-width:0;}
  .mrow .fn .nm{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mrow .fn .sz{font-family:var(--mono);font-size:12px;color:var(--faint);}
  .mrow .rm{width:28px;height:28px;flex-shrink:0;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;}
  .mrow .rm:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft);} .mrow .rm svg{width:14px;height:14px;}

  .primary{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:9px;color:#fff;border:none;cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:600;font-size:16.5px;padding:13px 20px;border-radius:999px;text-shadow:0 1px 2px rgba(0,0,0,.18);margin-top:4px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.14),0 8px 20px var(--grad-btn-glow);
    transition:filter .14s,transform .08s;}
  .primary:hover{filter:brightness(1.05);} .primary:active{transform:translateY(1px);}
  .primary:disabled{opacity:.5;cursor:not-allowed;filter:none;transform:none;}
  .primary svg{width:17px;height:17px;}
  .opterr{font-size:13px;color:var(--danger);margin-top:8px;min-height:14px;text-align:center;}

  /* live client preview */
  .side{padding:18px;position:sticky;top:16px;}
  .side .plabel{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:10px;}
  .pvcard{border:1px solid var(--line-2);border-radius:14px;overflow:hidden;background:var(--panel-2);}
  .pvhero{padding:20px 16px;text-align:center;position:relative;background:var(--grad-soft);border-bottom:1px solid var(--line-2);}
  .pvhero .pvlogo{background:#fff;border-radius:11px;padding:7px 12px;display:inline-block;margin-bottom:9px;box-shadow:var(--shadow-sm);}
  .pvhero .pvlogo img{display:block;max-height:34px;max-width:150px;object-fit:contain;}
  .pvhero.br .pv-name{color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.3);}
  .pvhero.br .pv-desc{color:rgba(255,255,255,.9);}
  .pvcard .pv-name{font-size:16.5px;font-weight:700;color:var(--ink);word-break:break-word;}
  .pvcard .pv-desc{font-size:13.5px;color:var(--muted);margin-top:4px;white-space:pre-wrap;word-break:break-word;}
  .pvcard .pv-body{padding:14px;}
  .pvthumbs{display:flex;flex-wrap:wrap;gap:6px;}
  .pvthumb{width:44px;height:44px;border-radius:9px;background:var(--panel);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;color:var(--accent);overflow:hidden;}
  .pvthumb img{width:100%;height:100%;object-fit:cover;} .pvthumb svg{width:18px;height:18px;}
  .pvempty{border:1.4px dashed var(--line);border-radius:11px;padding:18px;text-align:center;color:var(--faint);font-size:13.5px;background:var(--panel);}
  .pv-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}

  /* chips */
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-family:var(--mono);color:var(--muted);
    background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;}
  .chip svg{width:13px;height:13px;color:var(--accent);}
  .chip.warn{background:var(--warm-soft);border-color:var(--warm-line);color:var(--warn);}
  .chip.warn svg{color:var(--warn);}

  @media (min-width:841px){
    .wrap{padding-top:8px;padding-bottom:8px;}
    .pagehead{margin-bottom:10px;}
    .pagehead .kick{font-size:12px;padding:3px 9px;margin-bottom:7px;}
    .pagehead h2{font-size:clamp(23px,2.5vw,30px);margin-bottom:3px;}
    .pagehead p{font-size:14.5px;line-height:1.36;max-width:58ch;}
    .tabs{margin-bottom:12px;}
    .tab{height:34px;padding:0 13px;font-size:14px;}
    .grid{grid-template-columns:minmax(0,1fr) minmax(210px,260px);gap:14px;}
    .form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 12px;padding:14px;}
    .form h3{grid-column:1/-1;margin:0;font-size:15.5px;}
    .form > .opt{margin-bottom:0;}
    .form > .opt:nth-child(2),
    .form > .opt:nth-child(3),
    .form > .opt:nth-child(4),
    .form > .opt:nth-child(5),
    .form > .opt:nth-child(8){grid-column:span 2;}
    .form > .opt:nth-child(6){grid-column:1/-1;}
    .form > .two{grid-column:span 2;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px;}
    .form > .two .opt{margin-bottom:0;}
    .form > .opt:nth-child(9){align-self:end;}
    .opt > label,.optlbl{font-size:13.5px;margin-bottom:4px;}
    .inp,.ta{padding:7px 10px;font-size:14px;}
    .ta{min-height:44px;}
    .hint{margin-top:3px;line-height:1.25;}
    .drop{padding:9px 12px;gap:10px;}
    .drop .cloud{width:34px;height:34px;border-radius:10px;}
    .drop .big{font-size:14.5px;}
    .drop .dhint{font-size:12px;}
    .drop .choose{padding:7px 10px;font-size:13px;}
    .form > .opt:nth-child(5) .hint{display:none;}
    .mlist{max-height:58px;margin-top:8px;gap:6px;}
    .mrow{padding:7px 9px;}
    .perms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;}
    .permrow{min-width:0;margin-bottom:0;padding:7px;gap:7px;}
    .permrow .pk{width:30px;height:30px;border-radius:8px;}
    .permrow .pt b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .permrow .pt span{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .permrow input{width:14px;height:14px;}
    .brandbox{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:8px;padding:10px;}
    .brandbox > .opt{grid-column:1;margin-bottom:0!important;}
    .brandrow{grid-column:2;grid-row:1;margin-top:0;gap:8px;}
    .brandbox > .hint{grid-column:1/-1;display:none;}
    .logoprev{width:34px;height:34px;border-radius:9px;}
    .minibtn2{height:31px;padding:0 10px;font-size:13px;}
    .colorwrap input[type=color]{width:36px;height:31px;}
    .chkline{margin-bottom:0;}
    .primary{grid-column:span 2;align-self:end;min-height:38px;padding:9px 16px;margin-top:0;font-size:15.5px;}
    .opterr{grid-column:span 2;margin-top:0;align-self:center;}
    .mlist:empty,.opterr:empty{display:none;}
    .side{position:static;padding:14px;}
    .side .plabel{margin-bottom:7px;}
    .pvhero{padding:12px;}
    .pvhero .pvlogo{padding:5px 10px;margin-bottom:7px;}
    .pvhero .pvlogo img{max-height:28px;}
    .pvcard .pv-body{padding:11px;}
    .pvempty{padding:12px;}
    .pvthumb{width:38px;height:38px;}
    .pv-chips{margin-top:9px;}
    #createView:not(.hidden) ~ footer{display:none;}
  }

  @media (min-width:841px) and (max-width:1099px){
    .grid{grid-template-columns:minmax(0,1fr) minmax(190px,220px);gap:12px;}
    .form{grid-template-columns:repeat(6,minmax(0,1fr));gap:7px 8px;padding:12px;}
    .form > .opt:nth-child(2),
    .form > .opt:nth-child(3),
    .form > .opt:nth-child(4),
    .form > .opt:nth-child(5),
    .form > .opt:nth-child(8),
    .form > .two{grid-column:span 3;}
    .form > .opt:nth-child(6){grid-column:1/-1;}
    .form > .opt:nth-child(9){grid-column:span 1;}
    .primary{grid-column:span 2;padding-inline:10px;font-size:14.5px;}
    .opterr{grid-column:1/-1;}
    .drop{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:7px 9px;padding:8px 10px;}
    .drop .cloud{width:30px;height:30px;border-radius:9px;}
    .drop .big{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .drop .dhint{display:none;}
    .drop .dbtns{grid-column:1/-1;justify-content:flex-start;gap:6px;flex-wrap:nowrap;}
    .drop .choose{height:29px;padding:0 9px;font-size:12.5px;}
    .perms{gap:5px;}
    .permrow{padding:6px;gap:6px;}
    .permrow .pk{width:26px;height:26px;border-radius:8px;}
    .permrow .pt span{display:none;}
    .brandbox{padding:8px;}
    .logoprev{display:none;}
    .minibtn2{height:29px;padding:0 8px;font-size:12.5px;}
    .colorwrap input[type=color]{width:32px;height:29px;}
  }

  /* wide screens: taller fields & buttons only — matches "File Request" (קבלת קבצים) proportions.
     Height-only overrides (padding / min-height / height); text, cards & images stay the same size. */

  .rf-search{direction:rtl}.rf-select{direction:rtl;text-align:right}

  body.review-dashboard .rc-main{grid-column:1/-1;direction:rtl;padding:24px 30px 18px;display:flex;flex-direction:column;align-items:flex-start}

  /* ======================================================================
     GREEN "SEND FOR APPROVAL" REDESIGN — hero banner + create layout
     ====================================================================== */

  /* Show the shared site header (logo on the start/right, centered nav,
     account on the end/left) above the hero — same as every other in-app
     page. It stays sticky at the top; the green hero sits right below it.
     Only the focused project-detail view hides it (it has its own compact
     top bar) — see body.review-detail below. */
  body::before{z-index:5;}

  /* ---- hero banner (background illustration lives here) ---- */
  .rv-hero{position:relative;isolation:isolate;text-align:center;overflow:hidden;
    padding:54px 20px 172px;background:linear-gradient(160deg,#e3f3ea 0%,#d2ecdd 58%,#e3f3ea 100%);}
  .rv-hero-bg{position:absolute;inset:0;z-index:-2;
    background:url('assets/hero-bg.jpg') center top/cover no-repeat;}
  .rv-hero::after{content:'';position:absolute;inset:0;z-index:-1;
    background:radial-gradient(125% 92% at 50% 32%,rgba(255,255,255,.66),rgba(255,255,255,0) 60%);}
  html[data-theme="dark"] .rv-hero{background:#0c1a13;}
  html[data-theme="dark"] .rv-hero-bg{background-color:#0c1a13;opacity:.85;}
  html[data-theme="dark"] .rv-hero::after{background:radial-gradient(125% 92% at 50% 32%,rgba(12,19,15,.55),rgba(12,19,15,0) 62%);}
  .rv-hero-inner{position:relative;max-width:760px;margin:0 auto;}
  .rv-kick{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;font-weight:700;
    letter-spacing:.16em;text-transform:uppercase;color:var(--accent-dim);
    background:rgba(255,255,255,.72);border:1px solid #c2e3d0;padding:5px 14px;border-radius:999px;
    box-shadow:0 2px 10px rgba(9,105,55,.10);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
  html[data-theme="dark"] .rv-kick{background:rgba(16,32,23,.7);border-color:#254a35;color:var(--accent);}
  .rv-title{margin:16px 0 0;font-size:clamp(28px,4vw,42px);font-weight:800;letter-spacing:-.02em;line-height:1.12;color:#1a3024;}
  html[data-theme="dark"] .rv-title{color:#e8f3ec;}
  .rv-sub{margin:12px auto 0;max-width:54ch;font-size:clamp(14px,1.55vw,16.5px);line-height:1.5;color:#556b60;}
  html[data-theme="dark"] .rv-sub{color:#a1b6ab;}
  .rv-cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:26px;}
  .rv-btn{display:inline-flex;align-items:center;gap:9px;height:52px;padding:0 26px;border-radius:14px;cursor:pointer;
    font-family:var(--sans);font-size:16px;font-weight:700;border:1px solid transparent;
    transition:filter .14s,transform .08s,box-shadow .14s,border-color .14s,background .14s,color .14s;}
  .rv-btn svg{width:18px;height:18px;}
  .rv-btn:active{transform:translateY(1px);}
  .rv-btn.rv-primary{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--grad-btn);
    text-shadow:0 1px 2px rgba(0,0,0,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 26px var(--grad-btn-glow);}
  .rv-btn.rv-primary:hover{filter:brightness(1.05);}
  .rv-btn.rv-ghost{color:var(--ink-2);background:rgba(255,255,255,.94);border-color:#d3e7dc;box-shadow:0 6px 18px rgba(8,90,48,.12);}
  html[data-theme="dark"] .rv-btn.rv-ghost{background:rgba(20,34,26,.9);border-color:#293d33;color:var(--ink-2);}
  .rv-btn.rv-ghost:hover,.rv-btn.rv-ghost.on{border-color:var(--accent);color:var(--accent-dim);background:var(--accent-soft);}
  .rv-btn .count{font-family:var(--mono);font-size:13px;font-weight:700;min-width:22px;height:22px;padding:0 6px;border-radius:999px;
    display:inline-flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent-dim);}

  /* ---- admin / client / projects view toggle — one unified pill, on a single
         row (mirrors the "New request" screen's .viewseg) ---- */
  .rv-cta{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:center;gap:13px;}
  .rv-seg{display:inline-flex;padding:5px;gap:4px;border-radius:16px;background:rgba(255,255,255,.9);
    border:1px solid #c2e3d0;box-shadow:0 8px 22px rgba(8,90,48,.13);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);}
  html[data-theme="dark"] .rv-seg{background:rgba(20,34,26,.9);border-color:#293d33;}
  .rv-segbtn{display:inline-flex;align-items:center;gap:9px;height:46px;padding:0 20px;border:0;border-radius:12px;cursor:pointer;
    font-family:var(--sans);font-size:16px;font-weight:700;color:var(--ink-2);background:transparent;
    transition:background .16s,color .16s,box-shadow .16s;}
  .rv-segbtn svg{width:18px;height:18px;}
  .rv-segbtn:hover{color:var(--accent-dim);}
  html[data-theme="dark"] .rv-segbtn:not(.on):hover{color:var(--accent);}
  .rv-segbtn.on{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--grad-btn);
    text-shadow:0 1px 2px rgba(0,0,0,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 20px var(--grad-btn-glow);}
  /* the projects segment carries a count of saved projects */
  .rv-segbtn .count{font-family:var(--mono);font-size:12.5px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:999px;
    display:inline-flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent-dim);}
  .rv-segbtn.on .count{background:rgba(255,255,255,.28);color:#fff;}
  /* secondary link back to the projects list */
  .rv-projlink{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 15px;border-radius:11px;cursor:pointer;
    font-family:var(--sans);font-size:14.5px;font-weight:600;color:var(--ink-2);background:rgba(255,255,255,.55);
    border:1px solid transparent;transition:color .14s,background .14s,border-color .14s;}
  html[data-theme="dark"] .rv-projlink{background:rgba(20,34,26,.5);}
  .rv-projlink svg{width:16px;height:16px;opacity:.85;}
  .rv-projlink:hover,.rv-projlink.on{color:var(--accent-dim);background:var(--accent-soft);border-color:#c2e3d0;}
  .rv-projlink .count{font-family:var(--mono);font-size:12.5px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:999px;
    display:inline-flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent-dim);}
  html[data-theme="dark"] .rv-projlink .count{background:rgba(22,163,90,.16);}

  /* ---- hero back button + cover-image control (mirror the "received files" screen) ---- */
  .rv-hero-back{position:absolute;top:16px;right:18px;z-index:6;display:none;align-items:center;gap:7px;height:38px;padding:0 15px;
    border-radius:999px;border:1px solid #c2e3d0;background:rgba(255,255,255,.92);color:var(--ink-2);
    font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 6px 16px rgba(8,90,48,.12);
    -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);transition:border-color .14s,color .14s,background .14s;}
  .rv-hero-back svg{width:15px;height:15px;}
  .rv-hero-back:hover{border-color:var(--accent);color:var(--accent-dim);}
  html[data-theme="dark"] .rv-hero-back{background:rgba(20,34,26,.9);border-color:#293d33;color:var(--ink-2);}
  body.review-create .rv-hero-back{display:inline-flex;}

  .rv-hero-cover{position:absolute;top:16px;left:18px;z-index:6;display:none;gap:8px;}
  body.review-create .rv-hero-cover{display:inline-flex;}
  .rv-cover-btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:999px;
    border:1px solid #c2e3d0;background:rgba(255,255,255,.92);color:var(--ink-2);
    font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 6px 16px rgba(8,90,48,.12);
    -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);transition:border-color .14s,color .14s,background .14s;}
  .rv-cover-btn svg{width:16px;height:16px;}
  .rv-cover-btn:hover{border-color:var(--accent);color:var(--accent-dim);}
  .rv-cover-btn.rv-cover-rm{padding:0 13px;color:var(--muted);}
  .rv-cover-btn.rv-cover-rm:hover{border-color:#d98a8a;color:#c0392b;}
  html[data-theme="dark"] .rv-cover-btn{background:rgba(20,34,26,.9);border-color:#293d33;color:var(--ink-2);}

  /* create screen: admin = approval form + docked settings sidebar; client = live preview, alone */
  #createGrid.mode-admin{grid-template-columns:minmax(276px,344px) minmax(0,1fr) minmax(276px,344px);}
  #createGrid.mode-admin>.rv-sdock{order:1;display:flex;}       /* order:1 → leading column → inline-start (right in RTL): approval-flow settings */
  #createGrid.mode-admin>.rv-formcol{order:2;}                  /* center: the create form is the main area between the two side docks */
  #createGrid.mode-admin>.rv-sdock-l{order:3;display:flex;}     /* order:3 → trailing column → inline-end (left in RTL): protection + tracking settings */
  #createGrid.mode-admin>.rv-prevcol{display:none;}
  /* either side dock collapses independently to a slim rail */
  #createGrid.mode-admin.sdock-collapsed{grid-template-columns:56px minmax(0,1fr) minmax(276px,344px);}
  #createGrid.mode-admin.sdockl-collapsed{grid-template-columns:minmax(276px,344px) minmax(0,1fr) 56px;}
  #createGrid.mode-admin.sdock-collapsed.sdockl-collapsed{grid-template-columns:56px minmax(0,1fr) 56px;}
  /* full-bleed the create wrap in admin mode so both settings docks pin flush to their edges (right + left), framing the centered form — mirrors the File-Request studio */
  @media (min-width:1081px){
    .wrap:has(> #createView:not(.hidden) > #createGrid.mode-admin:not(.hidden)){max-width:none;padding-inline:0;}
  }

  #createGrid.mode-client{grid-template-columns:minmax(0,1fr);}
  #createGrid.mode-client>.rv-formcol{display:none;}
  #createGrid.mode-client>.rv-sdock{display:none;}
  #createGrid.mode-client>.rv-prevcol{max-width:560px;margin-inline:auto;width:100%;}
  #createGrid.mode-client .rvside{position:static;top:auto;}

  @media (max-width:1080px){
    #createGrid.mode-admin,#createGrid.mode-admin.sdock-collapsed,#createGrid.mode-admin.sdockl-collapsed,#createGrid.mode-admin.sdock-collapsed.sdockl-collapsed{grid-template-columns:1fr;}
    #createGrid.mode-admin>.rv-formcol{order:1;}   /* stack under one column: form first, then the two settings docks */
    #createGrid.mode-admin>.rv-sdock{order:2;}
    #createGrid.mode-admin>.rv-sdock-l{order:3;}
  }

  /* ---- content container pulled up over the hero ---- */
  .wrap{max-width:1200px;margin:0 auto;padding:14px 22px 46px;position:relative;z-index:3;}
  #createGrid{grid-template-columns:minmax(0,1fr) minmax(244px,304px);gap:18px;margin-top:-128px;position:relative;z-index:3;}

  /* ---- create form ---- */
  .rvform{padding:26px 26px 24px;}
  .rvform .opt{margin-bottom:0;}
  .rvf-title{margin:0 0 20px;font-size:20px;font-weight:800;letter-spacing:-.01em;color:var(--ink);text-align:start;}
  .rvf-row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  .rvf-mat{display:grid;grid-template-columns:1.12fr .88fr;gap:16px;margin-bottom:18px;align-items:stretch;}
  .rvf-msg{display:flex;flex-direction:column;}
  .rvf-msg .ta{flex:1;min-height:150px;}
  .rvf-permsopt{margin-bottom:18px;}
  .rvf-trio{display:grid;grid-template-columns:.9fr 1fr 1.5fr;gap:16px;margin-bottom:22px;align-items:start;}

  /* dropzone matched to the mockup */
  .rvf-drop{display:flex;flex-direction:column;}
  .rvf-drop .drop{flex:1;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:15px;
    border:2px dashed color-mix(in srgb,var(--accent) 52%,var(--line));border-radius:16px;padding:20px 18px;min-height:150px;
    background:var(--panel-2);cursor:pointer;text-align:center;transition:border-color .15s,background .15s;}
  .rvf-drop .drop:hover,.rvf-drop .drop.over{border-color:var(--accent);background:var(--accent-soft);}
  .drop-head{display:flex;align-items:center;justify-content:center;gap:12px;}
  .drop-head .cloud{width:44px;height:44px;flex:0 0 auto;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);}
  .drop-head .cloud svg{width:23px;height:23px;}
  .drop-txt{text-align:start;}
  .drop-txt .big{font-size:16px;font-weight:700;color:var(--ink);line-height:1.25;}
  .drop-txt .dhint{margin-top:3px;font-size:12.5px;color:var(--faint);}
  .rvf-drop .dbtns{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;}
  .rvf-drop .mlist{max-height:140px;}
  .rvf-drop .mlist:empty{display:none;}

  /* perm cards: green filled checkbox (right) · text · icon (left) */
  .perms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
  .perms .permrow{position:relative;display:flex;align-items:center;gap:10px;padding:12px;margin-bottom:0;
    border:1px solid var(--line);border-radius:13px;background:var(--panel-2);cursor:pointer;
    transition:border-color .14s,background .14s,box-shadow .14s;}
  .perms .permrow:hover{border-color:var(--accent);}
  .perms .permrow.on{border-color:var(--accent);background:var(--accent-soft);}
  .perms .permrow input{position:absolute;opacity:0;width:0;height:0;pointer-events:none;}
  .perms .pchk{flex:0 0 auto;width:22px;height:22px;border-radius:7px;border:1.8px solid var(--line);background:var(--panel);
    display:grid;place-items:center;color:#fff;transition:background .14s,border-color .14s;}
  .perms .pchk svg{width:13px;height:13px;opacity:0;transition:opacity .12s;}
  .perms .permrow.on .pchk{background:var(--accent);border-color:var(--accent);}
  .perms .permrow.on .pchk svg{opacity:1;}
  .perms .pt{flex:1;min-width:0;text-align:start;}
  .perms .pt b{display:block;font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .perms .pt span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .perms .pk{flex:0 0 auto;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
    background:var(--panel);color:var(--accent);border:1px solid var(--line-2);}
  .perms .permrow.on .pk{background:#fff;color:var(--accent-dim);border-color:transparent;box-shadow:0 2px 6px rgba(11,122,65,.16);}
  html[data-theme="dark"] .perms .permrow.on .pk{background:var(--panel);}
  .perms .pk svg{width:19px;height:19px;}

  /* expiry select with calendar + chevron */
  .selwrap{position:relative;}
  .selwrap select.inp{width:100%;padding-inline-start:40px;padding-inline-end:38px;cursor:pointer;-webkit-appearance:none;appearance:none;}
  .selwrap .selico{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--accent);pointer-events:none;display:flex;}
  .selwrap .selico svg{width:17px;height:17px;}
  .selwrap .selchev{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none;display:flex;}
  .selwrap .selchev svg{width:16px;height:16px;}

  /* brand inline row: business name · logo btn · colour swatch */
  .brand-inline{display:flex;align-items:center;gap:8px;}
  .brand-inline .inp{flex:1;min-width:60px;}
  .brand-inline .minibtn2{flex:0 0 auto;white-space:nowrap;}
  .brand-inline .logoprev{display:none;}
  .brand-inline .colorwrap{flex:0 0 auto;display:flex;}
  .brand-inline .colorwrap input[type=color]{width:44px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;padding:3px;}

  /* submit + notify */
  .rvform .rvf-submit{width:100%;min-height:52px;padding:14px 24px;margin-top:2px;font-size:16.5px;}
  .rvf-notify{justify-content:flex-end;margin:12px 0 0;}
  .rvform .opterr{margin-top:8px;}

  /* ---- live client preview (left rail) ---- */
  .rvside{padding:18px;align-self:start;position:sticky;top:16px;text-align:center;}
  .rvside-top{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--accent-dim);margin-bottom:12px;}
  .rvside-top svg{width:15px;height:15px;}
  .rvside .pvlogo{background:#fff;border-radius:11px;padding:6px 10px;display:inline-block;margin-bottom:10px;box-shadow:var(--shadow-sm);}
  .rvside .pvlogo img{display:block;max-height:30px;max-width:140px;object-fit:contain;}
  .rvside-title{font-size:16px;font-weight:800;color:var(--ink);line-height:1.3;word-break:break-word;padding:0 4px;}
  .rvside-desc{font-size:12.5px;color:var(--muted);margin-top:5px;white-space:pre-wrap;word-break:break-word;padding:0 4px;}
  .rvside-heroholder{display:none;}
  .pvmedia{margin-top:14px;}
  .rvside .pvempty{border:1px solid var(--line-2);border-radius:16px;min-height:152px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;color:var(--muted);
    background:linear-gradient(155deg,var(--accent-soft),color-mix(in srgb,var(--accent) 8%,var(--panel)));}
  .pv-play{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.92);
    color:var(--accent-dim);box-shadow:0 8px 22px rgba(9,105,55,.22);}
  html[data-theme="dark"] .pv-play{background:rgba(16,32,23,.9);}
  .pv-play svg{width:24px;height:24px;margin-inline-start:3px;}
  .pv-cap{font-size:12.5px;color:var(--muted);}
  .rvside .pvthumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;}
  .rvside .pvthumb{aspect-ratio:1;border-radius:11px;background:var(--panel);border:1px solid var(--line-2);
    display:flex;align-items:center;justify-content:center;color:var(--accent);overflow:hidden;font-family:var(--mono);font-weight:700;font-size:13px;}
  .rvside .pvthumb img{width:100%;height:100%;object-fit:cover;}
  .rvside .pvthumb svg{width:22px;height:22px;}
  .rvside .pv-chips{display:none;}

  .studio-hd-t{flex:1;min-width:0;}
  .studio-hd-t h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em;color:var(--ink);}
  .studio-hd-t p{margin:2px 0 0;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .studio-x{width:36px;height:36px;flex-shrink:0;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:all .12s;}
  .studio-x:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft);}
  .studio-x svg{width:18px;height:18px;}

  /* 3-column dashboard layout: advanced rail | content | approval rail (rails are integral columns, not floating) */
  .studio-main{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;}
  .rs-draw{position:relative;flex:0 0 248px;z-index:6;display:flex;flex-direction:column;overflow:hidden;
    background:var(--panel-2);border:0;border-radius:0;box-shadow:none;
    transition:flex-basis .28s cubic-bezier(.4,0,.2,1),opacity .22s;}
  .rs-draw-r{border-inline-end:1px solid var(--line);}   /* approval flow — leading column, divider toward centre */
  .rs-draw-l{border-inline-start:1px solid var(--line);} /* advanced — trailing column, divider toward centre */
  .studio-main:not(.rs-r-on) .rs-draw-r{flex-basis:0;border-inline-end-width:0;opacity:0;pointer-events:none;}
  .studio-main:not(.rs-l-on) .rs-draw-l{flex-basis:0;border-inline-start-width:0;opacity:0;pointer-events:none;}
  .rs-draw-hd{display:flex;align-items:center;gap:9px;padding:12px 12px 11px;border-bottom:1px solid var(--line-2);flex-shrink:0;}
  .rs-draw-ic{width:28px;height:28px;flex-shrink:0;border-radius:9px;display:grid;place-items:center;color:var(--accent-dim);background:var(--accent-soft);}
  .rs-draw-ic svg{width:15px;height:15px;}
  .rs-draw-t{flex:1;min-width:0;font:800 12.5px var(--sans);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:start;}
  .rs-draw-x{width:28px;height:28px;flex-shrink:0;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:all .12s;}
  .rs-draw-x:hover{color:var(--accent-dim);border-color:var(--accent);background:var(--accent-soft);}
  .rs-draw-x svg{width:16px;height:16px;}
  .rs-draw-body{flex:1;min-height:0;overflow-y:auto;padding:9px 10px 14px;}
  /* edge pull-tabs shown only while the matching drawer is closed */
  .rs-tab{position:absolute;top:50%;transform:translateY(-50%);z-index:7;display:none;place-items:center;
    width:30px;height:66px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--accent-dim);cursor:pointer;
    box-shadow:0 8px 22px rgba(8,14,11,.16);transition:transform .15s,color .15s,border-color .15s;}
  .rs-tab svg{width:18px;height:18px;}
  .rs-tab-r{right:0;border-radius:12px 0 0 12px;border-right:none;}
  .rs-tab-l{left:0;border-radius:0 12px 12px 0;border-left:none;}
  .rs-tab:hover{color:var(--accent);border-color:var(--accent);}
  .rs-tab-r:hover{transform:translateY(-50%) translateX(-2px);}
  .rs-tab-l:hover{transform:translateY(-50%) translateX(2px);}
  .studio-main:not(.rs-r-on) .rs-tab-r{display:grid;}
  .studio-main:not(.rs-l-on) .rs-tab-l{display:grid;}
  .st-glabel{font:600 10.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:14px 10px 7px;}
  .st-nav{display:flex;align-items:center;gap:11px;width:100%;padding:10px 11px;border-radius:11px;border:none;background:transparent;color:var(--ink-2);cursor:pointer;font:600 13.5px var(--sans);text-align:start;margin-bottom:2px;transition:background .12s,color .12s;}
  .st-nav:hover{background:var(--panel);}
  .st-nav.on{background:var(--accent-soft);color:var(--accent-dim);box-shadow:var(--shadow-sm);}
  .st-nav svg{width:18px;height:18px;flex-shrink:0;}
  .st-nav span{flex:1;min-width:0;}
  .st-nav .st-count{margin-inline-start:auto;flex:none;}


  .studio-content{position:relative;flex:1 1 auto;min-width:0;overflow-y:auto;padding:22px 26px 26px;}
  .st-sec{display:none;}
  .st-sec.on{display:block;animation:stFade .22s ease;}
  @keyframes stFade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .st-sec-h{font-size:16px;font-weight:800;color:var(--ink);margin:0 0 3px;letter-spacing:-.01em;}
  .st-sec-sub{font-size:13px;color:var(--muted);margin:0 0 18px;line-height:1.5;}

  .studio-ft{display:flex;align-items:center;gap:12px;padding:11px 18px;border-top:1px solid var(--line-2);background:var(--panel-2);}
  .studio-ft-note{font-size:12px;color:var(--faint);display:inline-flex;align-items:center;gap:7px;min-width:0;}
  .studio-ft-note svg{width:15px;height:15px;color:var(--success-dim);flex-shrink:0;}
  .studio-done{margin-inline-start:auto;height:40px;padding:0 28px;border-radius:11px;border:none;cursor:pointer;color:#fff;font:700 14px var(--sans);
    background:var(--grad-btn);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 16px var(--grad-btn-glow);transition:filter .14s,transform .08s;}
  .studio-done:hover{filter:brightness(1.05);} .studio-done:active{transform:translateY(1px);}
  .st-count{font:600 11px var(--mono);background:var(--accent-soft);color:var(--accent-dim);border-radius:999px;padding:2px 9px;}

  /* sub-group heading inside a section */
  .st-sub{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;color:var(--ink-2);margin:22px 0 11px;}
  .st-sub:first-of-type{margin-top:4px;}
  .st-sub::after{content:'';flex:1;height:1px;background:var(--line-2);}
  .st-sub svg{width:15px;height:15px;color:var(--accent);flex-shrink:0;}

  /* toggle row (reuses review .sw switch) */
  .st-toggle{display:flex;align-items:center;gap:14px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);margin-bottom:9px;}
  .st-toggle.dis{opacity:.5;pointer-events:none;}
  .st-toggle-tx{flex:1;min-width:0;}
  .st-toggle-nm{font-size:13.5px;font-weight:600;color:var(--ink);}
  .st-toggle-ds{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4;}

  /* generic fields */
  .st-field{margin-bottom:16px;}
  .st-flabel{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:7px;}
  .st-hint{font-size:12px;color:var(--faint);margin-top:7px;line-height:1.45;}
  .st-row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:560px){ .st-row2{grid-template-columns:1fr;} }
  .st-note{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--muted);line-height:1.5;
    background:var(--panel-2);border:1px solid var(--line-2);border-radius:11px;padding:11px 13px;margin-bottom:16px;}
  .st-note svg{width:16px;height:16px;color:var(--accent);flex-shrink:0;margin-top:1px;}
  .st-seg{display:inline-flex;flex-wrap:wrap;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;}
  .st-seg button{border:none;background:transparent;border-radius:8px;padding:8px 16px;font:600 13px var(--sans);color:var(--muted);cursor:pointer;transition:all .12s;}
  .st-seg button.on{background:var(--panel);color:var(--accent-dim);box-shadow:var(--shadow-sm);}
  /* section mount points wrap relocated inline blocks */
  .st-mount{margin-bottom:4px;}
  .st-mount .opt{margin-bottom:16px;}
  .st-mount .optlbl{font-size:13px;}
  .st-mount .rvf-notify{margin:0;}

  /* status legend */
  .rs-legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;}
  .rs-lg{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);font-size:13px;font-weight:600;color:var(--ink-2);}
  .rs-lg .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 16%,transparent);}
  .st-field input[type=number].inp{width:160px;}

  @media (max-width:720px){
    .studio-box{inset:0;width:100%;height:100%;max-width:none;border-radius:0;transform:none;}
    .studio.show .studio-box{transform:none;}
    /* not enough room for 3 fixed columns — rails revert to floating overlay drawers that slide over the content */
    .studio-content{position:absolute;inset:0;flex:none;padding:22px 26px 26px;}
    .rs-draw{position:absolute;top:10px;bottom:10px;flex-basis:auto;width:min(300px,84vw);
      border:1px solid var(--line-2);border-radius:16px;
      box-shadow:0 20px 52px rgba(8,14,11,.22),0 3px 10px rgba(8,14,11,.10);
      transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .22s;}
    .rs-draw-r{right:10px;left:auto;} .rs-draw-l{left:10px;right:auto;}
    .studio-main:not(.rs-r-on) .rs-draw-r{flex-basis:auto;transform:translateX(calc(100% + 24px));}
    .studio-main:not(.rs-l-on) .rs-draw-l{flex-basis:auto;transform:translateX(calc(-100% - 24px));}
    .st-nav{width:100%;}
    .st-nav .st-count{display:none;}
  }

  /* ===== docked approval settings (integral sidebar — replaces the floating modal) ===== */
  .rv-sdock{flex-direction:column;position:sticky;top:16px;align-self:stretch;max-height:calc(100vh - 32px);
    background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-sm);overflow:hidden;}
  .rv-sdock-hd{display:flex;align-items:center;gap:11px;padding:13px 14px;border-bottom:1px solid var(--line-2);background:var(--panel-2);flex-shrink:0;}
  .rv-sdock-ico{width:36px;height:36px;flex-shrink:0;border-radius:11px;display:grid;place-items:center;color:#fff;background:var(--grad-btn);box-shadow:0 6px 16px var(--grad-btn-glow);}
  .rv-sdock-ico svg{width:19px;height:19px;}
  .rv-sdock-tx{flex:1;min-width:0;}
  .rv-sdock-tx h3{margin:0;font-size:14px;font-weight:800;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rv-sdock-tx p{margin:2px 0 0;font-size:11px;color:var(--muted);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rv-sdock-collapse{width:30px;height:30px;flex-shrink:0;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:all .12s;}
  .rv-sdock-collapse:hover{border-color:var(--accent);color:var(--accent-dim);background:var(--accent-soft);}
  .rv-sdock-collapse svg{width:16px;height:16px;transition:transform .25s;}
  .rv-sdock-body{flex:1;min-height:0;overflow-y:auto;padding:12px 12px 16px;}
  .rv-sdock-ft{display:flex;align-items:center;gap:7px;padding:10px 14px;border-top:1px solid var(--line-2);background:var(--panel-2);font-size:11.5px;color:var(--faint);flex-shrink:0;}
  .rv-sdock-ft svg{width:14px;height:14px;color:var(--success-dim);flex-shrink:0;}

  /* nav list + the relocated content host live together so controls can render right under the active tab (accordion) */
  .rv-sdock-body .st-nav::after{content:'';flex:none;width:7px;height:7px;margin-inline-start:auto;
    border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);
    opacity:.45;transition:transform .2s,opacity .2s;}
  .rv-sdock-body .st-nav.on::after{transform:rotate(225deg);opacity:.85;}
  .rv-sdock-body .st-glabel{margin:14px 4px 7px;}
  .rv-sdock-body .st-glabel:first-child{margin-top:2px;}
  .rv-sdock-body > #rsContent{position:static;flex:none;overflow:visible;padding:4px 2px 6px;}
  .rv-sdock-body .st-sec-h{font-size:14.5px;}
  .rv-sdock-body .st-sec-sub{font-size:12px;margin-bottom:14px;}
  /* reflow the richer relocated blocks (watermark / brand / two-up rows) into the narrow column */
  .rv-sdock-body .wm-grid2{grid-template-columns:1fr;}
  .rv-sdock-body .st-row2{grid-template-columns:1fr;}
  .rv-sdock-body .brand-inline{flex-wrap:wrap;}
  .rv-sdock-body .st-mount .opt{margin-bottom:14px;}
  .rv-sdock-body .rs-legend{grid-template-columns:1fr;}

  /* collapsed: shrink to a slim rail, keep just the icon + expand affordance (scoped per-dock so collapsing one never hides the other) */
  #createGrid.sdock-collapsed  #rvSDock  .rv-sdock-body,
  #createGrid.sdock-collapsed  #rvSDock  .rv-sdock-ft,
  #createGrid.sdockl-collapsed #rvSDockL .rv-sdock-body,
  #createGrid.sdockl-collapsed #rvSDockL .rv-sdock-ft{display:none;}
  #createGrid.sdock-collapsed  #rvSDock  .rv-sdock-tx,
  #createGrid.sdockl-collapsed #rvSDockL .rv-sdock-tx{display:none;}
  #createGrid.sdock-collapsed  #rvSDock  .rv-sdock-hd,
  #createGrid.sdockl-collapsed #rvSDockL .rv-sdock-hd{flex-direction:column;gap:10px;padding:12px 0;justify-content:center;}
  #createGrid.sdock-collapsed  #rvSDock  .rv-sdock-collapse svg,
  #createGrid.sdockl-collapsed #rvSDockL .rv-sdock-collapse svg{transform:rotate(180deg);}

  @media (max-width:1080px){
    .rv-sdock{position:static;max-height:none;}
    #createGrid.sdock-collapsed  #rvSDock  .rv-sdock-body,#createGrid.sdock-collapsed  #rvSDock  .rv-sdock-ft,
    #createGrid.sdockl-collapsed #rvSDockL .rv-sdock-body,#createGrid.sdockl-collapsed #rvSDockL .rv-sdock-ft{display:block;}
    #createGrid.sdock-collapsed  #rvSDock  .rv-sdock-tx,#createGrid.sdockl-collapsed #rvSDockL .rv-sdock-tx{display:block;}
    #createGrid.sdock-collapsed  #rvSDock  .rv-sdock-hd,#createGrid.sdockl-collapsed #rvSDockL .rv-sdock-hd{flex-direction:row;padding:13px 14px;}
  }
</style>
</head>
<body>
<div id="site-header"></div>
<script src="./header.js"></script>
<header class="rv-hero">
  <div class="rv-hero-bg" aria-hidden="true"></div>
  <div class="rv-hero-inner">
    <span class="rv-kick" data-i18n="kick"></span>
    <h1 class="rv-title" data-i18n="pageTitle"></h1>
    <p class="rv-sub" data-i18n="pageSub"></p>
    <div class="rv-cta" id="tabs">
      <div class="rv-seg" id="viewToggle" role="tablist" aria-label="Admin / client view">
        <button class="rv-segbtn on" id="modeAdmin" type="button" role="tab" aria-selected="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
          <span data-i18n="modeAdmin"></span>
        </button>
        <button class="rv-segbtn" id="modeClient" type="button" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          <span data-i18n="modeClient"></span>
        </button>
        <button class="rv-segbtn rv-seg-list" id="tabManage" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
          <span data-i18n="tabManage"></span>
          <span class="count" id="mgCount">0</span>
        </button>
      </div>
    </div>
  </div>

  <!-- top-right back button (mirrors the "received files" screen) -->
  <button class="rv-hero-back" id="createBackBtn" type="button" data-i18n-al="back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <span data-i18n="back"></span>
  </button>

  <!-- change the hero cover image (mirrors the "received files" cover mechanism) -->
  <div class="rv-hero-cover" id="heroCover">
    <button class="rv-cover-btn" id="coverBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      <span data-i18n="coverChange"></span>
    </button>
    <button class="rv-cover-btn rv-cover-rm hidden" id="coverRmBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
      <span data-i18n="coverRemove"></span>
    </button>
    <input type="file" id="coverInput" accept="image/png,image/jpeg,image/webp" hidden>
  </div>
</header>

<div class="wrap">

  <!-- ============ CREATE ============ -->
  <div id="createView">
    <div class="grid mode-admin" id="createGrid">
      <div class="col rv-formcol">
        <div class="card rvform">
          <div class="rvf-hd">
            <h3 class="rvf-title" data-i18n="formTitle"></h3>
          </div>
          <div class="rs-chips" id="rsChips"></div>

          <!-- project name + client -->
          <div class="rvf-row2">
            <div class="opt">
              <div class="optlbl"><span data-i18n="fName"></span> <span class="req">*</span></div>
              <input class="inp" id="fName" type="text" data-i18n-ph="fNamePh">
            </div>
            <div class="opt">
              <div class="optlbl" data-i18n="fClient"></div>
              <input class="inp" id="fClient" type="text" data-i18n-ph="fClientPh">
            </div>
          </div>

          <!-- materials dropzone + message -->
          <div class="rvf-mat">
            <div class="opt rvf-drop">
              <div class="drop" id="drop">
                <div class="drop-head">
                  <span class="cloud"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"/><path d="M12 12v9"/><path d="m8 17 4-4 4 4"/></svg></span>
                  <div class="drop-txt">
                    <div class="big" data-i18n="dropBig"></div>
                    <div class="dhint" data-i18n="dropHint"></div>
                  </div>
                </div>
                <div class="dbtns">
                  <button class="choose" type="button" id="chooseBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    <span data-i18n="choose"></span>
                  </button>
                  <button class="choose ghost" type="button" id="chooseFolderBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>
                    <span data-i18n="chooseFolder"></span>
                  </button>
                </div>
              </div>
              <input type="file" id="fileInput" multiple>
              <input type="file" id="folderInput" webkitdirectory directory multiple>
              <div class="mlist" id="mlist"></div>
            </div>
            <div class="opt rvf-msg">
              <div class="optlbl" data-i18n="fMessage"></div>
              <textarea class="ta" id="fMessage" data-i18n-ph="fMessagePh"></textarea>
            </div>
          </div>

          <!-- preview watermark (protects the client preview; original stays untouched) -->
          <div class="opt rvf-wm">
            <div class="wmsec" id="wmSec">
              <label class="wmsec-head">
                <span class="wmi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="M9 12l2 2 4-4"/></svg></span>
                <span class="wmt"><b data-i18n="wmTitle"></b><span data-i18n="wmSub"></span></span>
                <span class="sw"><input type="checkbox" id="wmOn"><span class="track"></span><span class="knob"></span></span>
              </label>
              <div class="wmsec-body">
                <div class="wm-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg><span data-i18n="wmNote"></span></div>

                <!-- VISUAL — images & video -->
                <div class="wm-block" id="wmVisualBlock">
                  <div class="wblbl">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
                    <span data-i18n="wmVisualT"></span>

  // walk dropped directories via the entries API so whole folders keep their tree
  async function addFromDataTransfer(dt){
    let items;

    catch(_){ items = pathItems(dt.files); }

  function filesFromDataTransfer(dt){
    const list = dt.items ? Array.from(dt.items) : [];
    const entries = list.map(it=> it.webkitGetAsEntry ? it.webkitGetAsEntry() : null).filter(Boolean);
    if(!entries.length){ return Promise.resolve(pathItems(dt.files)); }
    const out=[];
    return Promise.all(entries.map(en=>walkEntry(en,'',out))).then(()=>out);
  }
  function walkEntry(entry, prefix, out){
    return new Promise(resolve=>{
      if(!entry){ resolve(); return; }
      if(entry.isFile){ entry.file(f=>{ out.push({file:f, path:prefix+entry.name}); resolve(); }, ()=>resolve()); }
      else if(entry.isDirectory){
        const reader=entry.createReader(), kids=[];
        const readBatch=()=>reader.readEntries(batch=>{
          if(!batch.length){ Promise.all(kids.map(k=>walkEntry(k, prefix+entry.name+'/', out))).then(resolve); }
          else { kids.push(...batch); readBatch(); }
        }, ()=>resolve());
        readBatch();
      } else resolve();
    });
  }

  function shade(hex,amt){
    const m=/^#?([0-9a-f]{6})$/i.exec(hex||''); if(!m) return hex;
    const n=parseInt(m[1],16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    r=Math.round(r+(255-r)*amt); g=Math.round(g+(255-g)*amt); b=Math.round(b+(255-b)*amt);
    return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
  }
