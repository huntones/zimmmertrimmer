<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOLKLI — Review & approve</title>
<link rel="canonical" href="https://kolkli.com/proof">
<meta name="description" content="Review the work, leave your comments and approve — no account needed.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#eef0f6; --panel:#ffffff; --panel-2:#f5f6fa; --line:#e5e8f0; --line-2:#eef0f6;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#7c3aed; --accent-dim:#6a2fe0; --accent-ink:#ffffff; --accent-soft:#efe9fe;
    --success:#22b04b; --success-dim:#1c9a41; --success-soft:#e6f6ec;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --danger:#e5484d; --danger-soft:#fdecec;
    --warm-soft:#fff5da; --warm-line:#f2d98a;
    --ok:#22b04b; --warn:#c88a04; --err:#e5484d;
    --grad:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-soft:linear-gradient(120deg,#efe9fe,#e6f0ff);
    --grad-shadow:rgba(93,79,240,0.30);
    --grad-btn:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn-glow:rgba(59,111,246,0.38);
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-lg:0 2px 6px rgba(20,24,44,0.05), 0 20px 50px rgba(20,24,44,0.10);
    --shadow-sm:0 1px 2px rgba(20,24,44,0.05);
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --sans:'Space Grotesk','Rubik',system-ui,'Segoe UI',sans-serif;
    /* responsive player height: scales with the viewport but stays compact so the whole page fits one screen */
    --playerH:clamp(200px,38vh,400px);
  }
  html[data-theme="dark"] {
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a303c; --line-2:#232833;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --accent:#a06bff; --accent-dim:#7c3aed; --accent-ink:#ffffff; --accent-soft:#241a3a;
    --success:#37c26a; --success-dim:#2fae5e; --success-soft:#132a1c;
    --info:#5b95f8; --info-dim:#4f8ef7; --info-soft:#182338;
    --danger:#ff6b6b; --danger-soft:#2a1719;
    --warm-soft:#2c2718; --warm-line:#5a4d24;
    --ok:#4ec98a; --warn:#e8b84b; --err:#ff6b6b;
    --grad:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-soft:linear-gradient(120deg,#1c1633,#11242a);
    --grad-shadow:rgba(77,123,255,0.42);
    --grad-btn:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn-glow:rgba(77,123,255,0.45);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,0.45), 0 24px 60px rgba(0,0,0,0.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;overflow-x:clip;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;}
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:var(--grad);z-index:100;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--sans);}
  .wrap{width:100%;max-width:none;margin:0 auto;padding:16px 20px 28px;}

  .topbar{display:flex;align-items:center;justify-content:flex-end;gap:9px;margin-bottom:14px;}
  .pillbtn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:999px;
    background:var(--panel);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;font-size:12.5px;font-weight:600;
    box-shadow:var(--shadow-sm);transition:border-color .12s,transform .08s;}
  .pillbtn:hover{border-color:var(--accent);} .pillbtn:active{transform:scale(0.97);}
  .pillbtn.ico{width:36px;padding:0;justify-content:center;font-size:14px;}
  .pillbtn svg{width:15px;height:15px;}
  .langwrap{position:relative;display:inline-flex;}
  .langbtn .chev{width:13px;height:13px;transition:transform .18s;}
  .langwrap.open .langbtn .chev{transform:rotate(180deg);}
  .langmenu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;z-index:220;min-width:166px;padding:6px;
    border-radius:13px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-lg);
    opacity:0;visibility:hidden;transform:translateY(-6px);pointer-events:none;
    transition:opacity .16s ease,transform .16s ease,visibility .16s;}
  .langwrap.open .langmenu{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto;}
  .langopt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
    padding:9px 11px;border:0;border-radius:10px;background:none;color:var(--ink-2);cursor:pointer;
    font-size:13px;font-weight:700;text-align:start;transition:background .12s,color .12s;}
  .langopt:hover{background:var(--panel-2);color:var(--accent-dim);}
  .langopt.active{color:var(--accent-dim);}
  .langopt svg{width:15px;height:15px;opacity:0;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
  .langopt.active svg{opacity:1;}
  /* guest auth: log in + sign up so a reviewing client can open an account */
  .tb-signup{display:inline-flex;align-items:center;height:36px;padding:0 15px;border-radius:999px;color:#fff;
    font-size:12.5px;font-weight:700;white-space:nowrap;cursor:pointer;
    background:var(--grad-btn);box-shadow:0 4px 12px var(--grad-btn-glow);transition:filter .14s,transform .08s;}
  .tb-signup:hover{filter:brightness(1.06);} .tb-signup:active{transform:scale(0.97);}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);padding:24px;}

  /* branded hero (ported from download.html) */
  .brandhero{position:relative;border-radius:20px;overflow:hidden;margin-bottom:16px;border:1px solid var(--line);box-shadow:var(--shadow-lg);}
  .bh-bg{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;}
  .bh-scrim{position:absolute;inset:0;}
  .bh-in{position:relative;padding:32px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:11px;}
  .bh-logo{background:#fff;border-radius:15px;padding:11px 17px;box-shadow:0 8px 24px rgba(0,0,0,.20);}
  .bh-logo img{display:block;max-height:50px;max-width:min(220px,60vw);object-fit:contain;}
  .bh-name{font-size:clamp(19px,4vw,25px);font-weight:800;letter-spacing:-0.01em;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.30);}
  .bh-tag{font-size:14px;color:rgba(255,255,255,.92);text-shadow:0 1px 8px rgba(0,0,0,.30);max-width:46ch;}

  .dhead{text-align:center;margin-bottom:16px;}
  .dhead h1{font-size:22px;margin:0 0 6px;font-weight:700;word-break:break-word;}
  .dhead .who{font-size:13.5px;color:var(--muted);}
  .msgbox{background:var(--panel-2);border:1px solid var(--line-2);border-radius:12px;padding:13px 15px;font-size:14px;color:var(--ink-2);
    line-height:1.6;margin-bottom:16px;white-space:pre-wrap;word-break:break-word;}

  /* version switch */
  .vswitch{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:14px;justify-content:center;}
  .vswitch .vlbl{font-size:12px;color:var(--muted);font-weight:600;}
  .vbtn{height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);cursor:pointer;font-size:12.5px;font-weight:600;font-family:var(--mono);}
  .vbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-dim);}

  /* filmstrip */
  .strip{display:flex;gap:9px;overflow-x:auto;padding:4px 2px 10px;margin-bottom:6px;}
  .sthumb{flex:0 0 auto;width:88px;cursor:pointer;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel);transition:border-color .12s,transform .08s;position:relative;}
  .sthumb:hover{border-color:var(--accent);} .sthumb.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .sthumb .sth{height:58px;display:flex;align-items:center;justify-content:center;background:var(--panel-2);color:var(--accent);overflow:hidden;}
  .sthumb .sth img{width:100%;height:100%;object-fit:cover;} .sthumb .sth svg{width:22px;height:22px;}
  .sthumb .snm{font-size:10px;padding:5px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);}
  .sthumb .cc{position:absolute;top:5px;inset-inline-end:5px;font-family:var(--mono);font-size:9.5px;font-weight:700;background:var(--grad);color:#fff;border-radius:999px;padding:1px 6px;}

  /* stage */
  .stage{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start;}
  @media (max-width:800px){ .stage{grid-template-columns:1fr;} }
  .media{background:#0b0d14;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:180px;display:flex;align-items:center;justify-content:center;}
  .media img{max-width:100%;max-height:var(--playerH);display:block;object-fit:contain;}
  /* image region annotation overlay */
  .imgstage{position:relative;display:inline-block;max-width:100%;max-height:var(--playerH);line-height:0;}
  .imgstage img{max-height:var(--playerH);}
  .anno-svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
  .anno-svg.arm{cursor:crosshair;}
  .anno-tools{position:absolute;top:8px;inset-inline-start:8px;display:flex;gap:5px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:5px;box-shadow:var(--shadow);z-index:4;flex-wrap:wrap;max-width:calc(100% - 16px);}
  .anno-tool{width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--ink-2);cursor:pointer;display:grid;place-items:center;}
  .anno-tool:hover{background:var(--panel-2);}
  .anno-tool.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-dim);}
  .anno-tool svg{width:17px;height:17px;}
  .anno-color{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);padding:2px;cursor:pointer;background:var(--panel-2);}
  .anno-clear{height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;}
  .anno-clear:hover{border-color:var(--danger);color:var(--danger);}
  .anno-num{fill:#fff;font:700 13px var(--sans);}
  .anno-hint{position:absolute;inset-block-end:8px;inset-inline-start:50%;transform:translateX(-50%);z-index:4;background:rgba(15,18,15,.82);color:#fff;font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;white-space:nowrap;pointer-events:none;}
  .media audio{width:92%;margin:26px 0;}
  .media iframe{width:100%;height:var(--playerH);border:none;background:#fff;}
  .media .dlonly{padding:40px 20px;text-align:center;color:#c7ccda;}
  .media .dlonly .di{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);color:#fff;}
  .media .dlonly .di svg{width:28px;height:28px;}
  .media .dlonly .nm{font-size:14px;font-weight:600;color:#fff;margin-bottom:14px;word-break:break-word;}

  /* ---- modern custom video player ---- */
  /* large 16:9 player that fills the stage column (matches the reference size) */
  .vplayer{position:relative;width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:#000;line-height:0;user-select:none;}
  .vplayer video{width:100%;height:100%;max-width:100%;max-height:none;display:block;object-fit:contain;background:#000;cursor:pointer;}
  /* preview watermark overlay (video is not baked — drawn live over the player) */
  .vp-wm{position:absolute;inset:0;pointer-events:none;z-index:3;}
  .vp-wm img{width:100%;height:100%;object-fit:contain;display:block;}
  .vp-big{position:absolute;inset:0;margin:auto;width:74px;height:74px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(12,15,26,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;
    display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(0,0,0,.45);
    transition:opacity .22s ease,transform .16s ease,background .22s ease;}
  .vp-big svg{width:32px;height:32px;margin-inline-start:3px;}
  .vp-big:hover{transform:scale(1.07);background:var(--grad);box-shadow:0 10px 34px var(--grad-shadow);}
  .vplayer.playing .vp-big{opacity:0;transform:scale(.85);pointer-events:none;}
  .vp-bar{position:absolute;left:0;right:0;bottom:0;direction:ltr;display:flex;align-items:center;gap:9px;padding:26px 14px 12px;
    background:linear-gradient(to top,rgba(6,8,16,.86) 0%,rgba(6,8,16,.34) 62%,transparent 100%);
    opacity:0;transform:translateY(8px);transition:opacity .2s ease,transform .2s ease;pointer-events:none;}
  .vplayer:hover .vp-bar,.vplayer:focus-within .vp-bar,.vplayer:not(.playing) .vp-bar{opacity:1;transform:none;pointer-events:auto;}
  .vp-btn{width:34px;height:34px;flex:0 0 auto;border:none;background:transparent;color:#fff;cursor:pointer;border-radius:9px;
    display:flex;align-items:center;justify-content:center;transition:background .15s ease,transform .1s ease;}
  .vp-btn:hover{background:rgba(255,255,255,.16);} .vp-btn:active{transform:scale(.9);}
  .vp-btn svg{width:20px;height:20px;pointer-events:none;}
  .vp-btn .ic-pause,.vplayer.playing .vp-btn .ic-play{display:none;}
  .vplayer.playing .vp-btn .ic-pause{display:block;}
  .vp-btn .ic-unmute{display:none;} .vplayer.muted .vp-btn .ic-unmute{display:block;} .vplayer.muted .vp-btn .ic-mute{display:none;}
  .vp-time{color:#eef1f6;font:600 12px/1 var(--mono);min-width:40px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.01em;}
  .vp-seek{position:relative;flex:1 1 auto;height:18px;display:flex;align-items:center;cursor:pointer;touch-action:none;min-width:60px;}
  .vp-seek-track{position:absolute;left:0;right:0;height:5px;border-radius:999px;background:rgba(255,255,255,.24);overflow:hidden;}
  .vp-seek-buf{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.26);}
  .vp-seek-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--grad);}
  .vp-seek-knob{position:absolute;top:50%;left:0;width:13px;height:13px;border-radius:50%;background:#fff;
    transform:translate(-50%,-50%);box-shadow:0 1px 5px rgba(0,0,0,.5);opacity:0;transition:opacity .15s ease;}
  .vp-seek:hover .vp-seek-knob,.vplayer:not(.playing) .vp-seek-knob{opacity:1;}
  .vp-vol{position:relative;width:0;overflow:hidden;transition:width .2s ease;flex:0 0 auto;}
  .vp-volwrap:hover .vp-vol,.vp-volwrap:focus-within .vp-vol{width:66px;}
  .vp-volwrap{display:flex;align-items:center;}
  .vp-vol .vp-seek{min-width:56px;width:56px;margin-inline:4px 2px;}
  .vplayer:fullscreen,.vplayer:-webkit-full-screen{aspect-ratio:auto;}
  .vplayer:fullscreen video,.vplayer:-webkit-full-screen video{max-height:100vh;height:100vh;}

  .side{display:flex;flex-direction:column;gap:12px;}
  .sbar{display:flex;align-items:center;gap:10px;}
  .sbar .snm2{flex:1;min-width:0;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .iconbtn{width:36px;height:36px;flex-shrink:0;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;}
  .iconbtn:hover{border-color:var(--accent);color:var(--accent);} .iconbtn svg{width:16px;height:16px;}

  .thread{display:flex;flex-direction:column;gap:9px;max-height:clamp(150px,26vh,300px);overflow-y:auto;padding-inline-end:2px;}
  .cmt{border:1px solid var(--line-2);border-radius:11px;padding:10px 12px;background:var(--panel-2);}
  .cmt-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap;}
  .cmt-av{width:24px;height:24px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--grad);color:#fff;font-weight:700;font-size:11px;}
  .cmt-who{font-size:12.5px;font-weight:700;color:var(--ink);}
  .cmt-pos{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;font-weight:600;color:var(--accent-dim);background:var(--accent-soft);border-radius:999px;padding:2px 8px;cursor:pointer;}
  .cmt-pos svg{width:10px;height:10px;}
  .cmt-when{font-size:10.5px;color:var(--faint);font-family:var(--mono);margin-inline-start:auto;}
  .cmt-body{font-size:13px;color:var(--ink-2);line-height:1.5;white-space:pre-wrap;word-break:break-word;}
  .cmt.mine{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,var(--line));}
  .threadEmpty{font-size:12.5px;color:var(--faint);text-align:center;padding:18px 10px;font-family:var(--mono);}

  .addbox{border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--panel);}
  .addbox .nmrow{margin-bottom:8px;}
  .inp,.ta{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;
    font-family:var(--sans);font-size:13px;padding:9px 11px;transition:border-color .12s,box-shadow .12s;}
  .inp:focus,.ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .ta{resize:vertical;min-height:56px;}
  .addfoot{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .pinchip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent-dim);background:var(--accent-soft);border-radius:999px;padding:5px 10px;}
  .pinchip svg{width:12px;height:12px;}
  .pagepick{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);}
  .pagepick input{width:52px;text-align:center;padding:6px 6px;}
  .postbtn{margin-inline-start:auto;display:inline-flex;align-items:center;gap:7px;color:#fff;border:none;cursor:pointer;
    background:var(--grad-btn);font-weight:600;font-size:13px;padding:9px 16px;border-radius:999px;box-shadow:0 4px 12px var(--grad-btn-glow);transition:filter .14s;}
  .postbtn:hover{filter:brightness(1.05);} .postbtn:disabled{opacity:.5;cursor:not-allowed;filter:none;} .postbtn svg{width:14px;height:14px;}
  .viewonly{font-size:12px;color:var(--faint);text-align:center;padding:12px;font-family:var(--mono);border:1px dashed var(--line);border-radius:11px;}

  /* decision bar */
  .decidebar{margin-top:18px;border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--panel);box-shadow:var(--shadow);}
  .decidebar h3{font-size:15px;margin:0 0 4px;font-weight:700;text-align:center;}
  .decidebar .dsub{font-size:12.5px;color:var(--muted);text-align:center;margin:0 0 14px;}
  .decrow{display:flex;gap:11px;flex-wrap:wrap;}
  .decbtn{flex:1;min-width:150px;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:14px 18px;border-radius:12px;
    font-size:14.5px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);transition:filter .12s,border-color .12s,transform .08s;}
  .decbtn:active{transform:translateY(1px);} .decbtn svg{width:18px;height:18px;}
  .decbtn.approve{border:none;color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--success);box-shadow:0 8px 20px rgba(34,176,75,.32);}
  .decbtn.approve:hover{filter:brightness(1.04);}
  .decbtn.changes:hover{border-color:var(--warn);color:var(--warn);background:var(--warm-soft);}
  .decstate{display:flex;align-items:center;gap:12px;padding:4px 2px;}
  .decstate .di{width:46px;height:46px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .decstate .di svg{width:24px;height:24px;}
  .decstate.approved .di{background:var(--success);color:#fff;} .decstate.changes .di{background:var(--warn);color:#fff;}
  .decstate .dt b{display:block;font-size:15px;font-weight:700;color:var(--ink);}
  .decstate .dt span{font-size:12.5px;color:var(--muted);}
  .decstate .redo{margin-inline-start:auto;height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);cursor:pointer;font-size:12px;font-weight:600;}

  /* change-request priority picker */
  .prio-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px;}
  .prio-lbl{font-size:12.5px;font-weight:600;color:var(--muted);margin-inline-end:2px;}

  .decbtn.approve.locked{opacity:.5;filter:grayscale(.4);cursor:not-allowed;box-shadow:none;}
  .dec-hint{margin-top:9px;font-size:12px;color:var(--muted);text-align:center;}

  /* states */
  .state{text-align:center;padding:26px 12px;}
  .state .si{width:64px;height:64px;margin:0 auto 16px;border-radius:18px;display:flex;align-items:center;justify-content:center;}
  .state .si.warn{background:var(--warm-soft);color:var(--warn);} .state .si.lock{background:var(--accent-soft);color:var(--accent);}
  .state .si svg{width:32px;height:32px;}
  .state h2{font-size:19px;margin:0 0 8px;}
  .state p{font-size:14px;color:var(--muted);margin:0 auto 18px;max-width:44ch;line-height:1.6;}
  .pwform{display:flex;gap:8px;max-width:340px;margin:0 auto;}
  .pwform input{flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;font-family:var(--sans);font-size:14px;padding:11px 13px;}
  .pwform input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .pwform.bad input{border-color:var(--danger);}
  .pwform button{border:none;color:#fff;cursor:pointer;border-radius:10px;padding:0 18px;font-weight:600;font-size:14px;background:var(--grad-btn);box-shadow:0 4px 12px var(--grad-btn-glow);}
  .pwerr{font-size:12px;color:var(--danger);margin-top:10px;min-height:14px;}
  .hidden{display:none !important;}

  .poweredby{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin:22px auto 0;font-size:11.5px;color:var(--faint);font-family:var(--mono);letter-spacing:.02em;transition:opacity .12s;}
  .poweredby:hover{opacity:.72;} .poweredby img{height:19px;width:auto;display:block;}
  html[data-theme="dark"] .poweredby img{filter:brightness(1.12);}
  .pbwrap{text-align:center;}
  footer{margin-top:14px;text-align:center;color:var(--faint);font-size:12px;font-family:var(--mono);}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:11px 18px;border-radius:999px;
    box-shadow:var(--shadow-lg);transition:opacity .2s,transform .2s;z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ============ mockup upgrade (built on top, player kept) ============ */
  .topbar{justify-content:space-between;}
  .tb-start{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
  .tb-logo img{display:block;height:24px;width:auto;}
  .tb-grid{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .tb-grid:hover{border-color:var(--accent);color:var(--accent);} .tb-grid svg{width:16px;height:16px;}
  .tb-title{flex:2;min-width:0;text-align:center;font-size:14px;font-weight:600;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tb-end{display:flex;align-items:center;gap:9px;flex:1;justify-content:flex-end;}
  @media (max-width:820px){ .tb-title{display:none;} }
  .markbtn{border:none;color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 60%),var(--success);
    box-shadow:0 4px 12px rgba(34,176,75,.28);height:36px;padding:0 15px;}
  .markbtn:hover{filter:brightness(1.05);border:none;} .markbtn svg{width:16px;height:16px;}

  .rv-head{text-align:center;margin-bottom:16px;}
  .rv-head h1{font-size:20px;margin:0 0 5px;font-weight:700;word-break:break-word;}
  .rv-head .who{font-size:13px;color:var(--muted);}
  .rv-head .msgbox{max-width:70ch;margin:12px auto 0;text-align:start;}

  .review-grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:18px;align-items:start;}
  @media (max-width:980px){ .review-grid{grid-template-columns:1fr;} }
  .sidecol{display:flex;flex-direction:column;gap:14px;min-width:0;}
  .stagecol{display:flex;flex-direction:column;gap:16px;min-width:0;}

  .card.filecard,.card.composer,.card.cmtwrap,.card.tlcard,.card.panel{padding:16px;border-radius:16px;box-shadow:var(--shadow);}
  .filecard .fc-head{display:flex;align-items:flex-start;gap:12px;}
  .fc-ic{width:44px;height:44px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);}
  .fc-ic svg{width:22px;height:22px;}
  .fc-meta{flex:1;min-width:0;}
  .fc-name{font-size:14px;font-weight:700;color:var(--ink);word-break:break-word;line-height:1.35;}
  .fc-sub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px;}
  .fc-actions{display:flex;gap:7px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line-2);}

  .composer .sec-h,.cmtwrap .sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;}
  .composer .sec-h h3,.cmtwrap .sec-h h3{font-size:14px;font-weight:700;margin:0;color:var(--ink);}
  .composer .inp{margin-bottom:8px;}
  .composer .ta{margin-bottom:0;}
  .attchip{display:flex;align-items:center;gap:8px;margin-top:8px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);font-size:12px;color:var(--ink-2);}
  .attchip svg{width:14px;height:14px;flex-shrink:0;} .attchip span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .attchip .ax{cursor:pointer;color:var(--faint);border:none;background:none;font-size:17px;line-height:1;padding:0;} .attchip .ax:hover{color:var(--danger);}
  .cf-mini{min-width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center;transition:all .12s;padding:0 8px;font-size:11.5px;font-weight:600;}
  .cf-mini:hover{border-color:var(--accent);color:var(--accent);} .cf-mini svg{width:15px;height:15px;}
  .cf-mini.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-dim);}
  .cr-link{flex:1;min-width:120px;} .cr-link input{width:100%;padding:7px 10px;font-size:12.5px;}
  .addfoot{flex-wrap:wrap;}

  .filterbtn{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);background:none;border:none;cursor:pointer;font-weight:600;}
  .filterbtn svg{width:13px;height:13px;}
  .filterbtn.on{color:var(--accent);}
  .filterbtn.on svg{fill:currentColor;stroke:currentColor;}
  /* numbered comment cards */
  .cmt{cursor:pointer;transition:border-color .12s,background .12s;} .cmt:hover{border-color:var(--accent);}
  .cmt-num{width:22px;height:22px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--grad);color:#fff;font-family:var(--mono);font-weight:700;font-size:11px;}
  .cmt-tc{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--info-dim);background:var(--info-soft);border-radius:999px;padding:2px 7px;}
  .cmt-tc svg{width:10px;height:10px;}
  .cmt-title{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:2px;}
  .cmt-att{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:11.5px;color:var(--accent-dim);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer;}
  .cmt-att svg{width:12px;height:12px;}
  .cmt-badge{display:inline-flex;align-items:center;margin-top:8px;font-size:10px;font-weight:700;border-radius:999px;padding:2px 8px;}
  .cmt-badge.changes{background:var(--warm-soft);color:var(--warn);} .cmt-badge.rejected{background:var(--danger-soft);color:var(--danger);}
  .cmt-prio{display:inline-flex;align-items:center;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;border-radius:999px;padding:2px 7px;}
  .cmt-prio.p-low{background:var(--info-soft);color:var(--info-dim);} .cmt-prio.p-medium{background:var(--warm-soft);color:var(--warn);} .cmt-prio.p-high{background:var(--danger-soft);color:var(--danger);}
  .cmt-extra{display:inline-flex;align-items:center;gap:5px;margin-top:8px;margin-inline-end:6px;font-size:11.5px;font-weight:600;}
  .cmt-extra svg{width:14px;height:14px;}
  a.cmt-att{text-decoration:none;}

  /* comment pins on the player seek bar */
  .vp-pin{position:absolute;top:50%;transform:translate(-50%,-50%);width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:9.5px;font-weight:700;color:#fff;border:2px solid #fff;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.45);z-index:4;}

  /* comments timeline */
  .tlcard .tl-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;}
  .tlcard .tl-head h3{font-size:15px;font-weight:700;margin:0;}
  .tl-tools{display:flex;align-items:center;gap:8px;}
  .tl-live{width:22px;height:22px;border-radius:50%;border:1px solid var(--success);display:flex;align-items:center;justify-content:center;}
  .tl-live i{width:8px;height:8px;border-radius:50%;background:var(--success);display:block;animation:tlpulse 2s infinite;}
  @keyframes tlpulse{0%{box-shadow:0 0 0 0 rgba(34,176,75,.45);}70%{box-shadow:0 0 0 7px rgba(34,176,75,0);}100%{box-shadow:0 0 0 0 rgba(34,176,75,0);}}
  .tl-scroll{overflow-x:auto;padding:0 14px 4px;}
  .tl-track{position:relative;height:78px;min-width:100%;direction:ltr;}
  .tl-base{position:absolute;left:0;right:0;bottom:26px;height:2px;background:var(--line);border-radius:2px;}
  .tl-tick{position:absolute;bottom:6px;transform:translateX(-50%);font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap;}
  .tl-tick::before{content:'';position:absolute;left:50%;bottom:16px;width:1px;height:8px;background:var(--line);}
  .tl-pin{position:absolute;bottom:26px;transform:translate(-50%,0);display:flex;flex-direction:column;align-items:center;cursor:pointer;}
  .tl-pin .pdot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--mono);font-size:11.5px;font-weight:700;border:2px solid var(--panel);box-shadow:0 3px 8px rgba(20,24,44,.22);}
  .tl-pin .pstem{width:2px;height:16px;background:currentColor;opacity:.35;}
  .tl-playhead{position:absolute;top:4px;bottom:20px;width:2px;background:var(--accent);border-radius:2px;left:8px;}
  .tl-playhead::before{content:'';position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:9px;height:9px;border-radius:50%;background:var(--accent);}

  /* status + progress row */
  .botrow{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:720px){ .botrow{grid-template-columns:1fr;} }
  .panel-h{display:flex;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:700;margin-bottom:15px;}
  .panel-h .qm{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);color:var(--faint);display:inline-flex;align-items:center;justify-content:center;font-size:11px;}
  #statusPanel .decidebar{margin:0;border:0;padding:0;background:none;box-shadow:none;}
  #statusPanel .decrow{gap:9px;} #statusPanel .decbtn{min-width:0;padding:12px 8px;font-size:13px;flex:1;}
  .decbtn.reject{color:var(--danger);} .decbtn.reject:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft);}
  .decbtn.changes{color:var(--warn);}
  .decstate.rejected .di{background:var(--danger);color:#fff;}

  .tracker{display:flex;align-items:flex-start;justify-content:space-between;direction:ltr;gap:4px;}
  .tstep{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}
  .tstep .tnode{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;z-index:2;background:var(--panel);border:2px solid var(--line);color:var(--faint);transition:all .18s;}
  .tstep .tnode svg{width:17px;height:17px;}
  .tstep .tlbl{font-size:11px;font-weight:600;color:var(--faint);line-height:1.25;}
  .tstep::before{content:'';position:absolute;top:19px;height:2px;background:var(--line);z-index:1;left:-50%;right:50%;}
  .tstep:first-child::before{display:none;}
  .tstep.done .tnode{background:var(--success-soft);border-color:var(--success);color:var(--success-dim);}
  .tstep.done .tlbl{color:var(--ink-2);}
  .tstep.done::before{background:var(--success);}
  .tstep.current .tnode{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 4px var(--accent-soft);}
  .tstep.current .tlbl{color:var(--accent-dim);font-weight:700;}

  .footbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow-sm);}
  .footbar .fmid{flex:1;text-align:center;color:var(--faint);font-size:12px;font-family:var(--mono);}
  .flink{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;background:none;border:none;}
  .flink:hover{color:var(--accent-dim);} .flink svg{width:15px;height:15px;}
  @media (max-width:640px){ .footbar .fmid{display:none;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="tb-start">
      <a class="tb-logo" href="./" aria-label="KOLKLI"><img src="./assets/logo.png" alt="KOLKLI" width="98" height="24" decoding="async"></a>
      <button class="tb-grid" id="appsBtn" type="button" aria-label="Apps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
    </div>
    <div class="tb-title" data-i18n="reviewSub"></div>
    <div class="tb-end">
      <button class="pillbtn markbtn hidden" id="markBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg><span data-i18n="markComment"></span></button>
      <div class="langwrap" id="langWrap">
        <button class="pillbtn langbtn" id="langBtn" type="button" aria-label="Language" aria-haspopup="listbox" aria-expanded="false" aria-controls="langMenu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 0 20"/><path d="M12 2a15.3 15.3 0 0 0 0 20"/></svg>
        <span id="langIco">&#1506;&#1489;&#1512;&#1497;&#1514;</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="langmenu" id="langMenu" role="listbox" aria-label="Language"></div>
      </div>
      <button class="pillbtn ico" id="themeToggle" type="button" aria-label="Theme"><span id="themeIco">🌙</span></button>
      <a class="pillbtn" href="./auth">התחברות</a>
      <a class="tb-signup" href="./auth?mode=signup">הרשמה</a>
    </div>
  </div>

  <div class="brandhero hidden" id="brandHero">
    <div class="bh-bg" id="bhBg"></div>
    <div class="bh-scrim" id="bhScrim"></div>
    <div class="bh-in">
      <div class="bh-logo hidden" id="bhLogo"><img id="bhLogoImg" alt=""></div>
      <div class="bh-name hidden" id="bhName"></div>
      <div class="bh-tag hidden" id="bhTag"></div>
    </div>
  </div>

  <div class="card" id="gateCard">
    <!-- loading -->
    <div class="state" id="loadingState">
      <div class="si lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.2-8.5"/></svg></div>

    <!-- notice: expired / closed / not found -->

      <div class="si warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg></div>
      <h2 id="noticeTitle"></h2>
      <p id="noticeBody"></p>
    </div>

    <!-- password gate -->
    <div class="state hidden" id="pwState">
      <div class="si lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
      <h2 data-i18n="pwTitle"></h2>

      <div class="pwerr" id="pwErr"></div>
    </div>

    <!-- email verification gate -->

  <!-- review -->
  <div class="hidden" id="reviewView">

      <h1 id="projName"></h1>
      <div class="who" id="projWho"></div>
      <div class="msgbox hidden" id="msgBox"></div>

    <div class="review-grid">
      <!-- sidebar: file card + composer + comments -->
      <div class="sidecol">
        <div class="card filecard">
          <div class="fc-head">
            <div class="fc-ic" id="fcIc"></div>
            <div class="fc-meta">
              <div class="fc-name" id="activeName"></div>
              <div class="fc-sub" id="fcSub"></div>

          </div>
          <div class="fc-actions">
            <button class="iconbtn hidden" id="dlBtn" type="button" aria-label="Download"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg></button>

  function wireAnnoStage(){

    const clr=el('annoClear'); if(clr) clr.addEventListener('click',clearPendingAnno);

  function annoShapeSVG(a,W,H,n){

    if(a.type==='point'){ const x=a.x*W, y=a.y*H; return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" fill="${c}" stroke="#fff" stroke-width="2"/>`+numAt(x, y-16); }

    if(a.type==='arrow'){ const x1=a.x*W,y1=a.y*H,x2=a.x2*W,y2=a.y2*H; const ang=Math.atan2(y2-y1,x2-x1),h=12; const ax1=x2-h*Math.cos(ang-0.45),ay1=y2-h*Math.sin(ang-0.45),ax2=x2-h*Math.cos(ang+0.45),ay2=y2-h*Math.sin(ang+0.45);
      return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${c}" stroke-width="${sw}" stroke-linecap="round"/><path d="M${x2.toFixed(1)} ${y2.toFixed(1)} L${ax1.toFixed(1)} ${ay1.toFixed(1)} M${x2.toFixed(1)} ${y2.toFixed(1)} L${ax2.toFixed(1)} ${ay2.toFixed(1)}" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" fill="none"/>`+numAt(x1,y1-14); }

  }

    el('evErr').textContent='';
    RV.lsSet('rv_verified::'+token, evPendingEmail);
    if(!ls('rv_client_name')) RV.lsSet('rv_client_name', evPendingEmail);
    enterReview();
  }

  function enterReview(){
    activeVer=proj.activeVersion||proj.maxVersion||1;
    const items=itemsOf(activeVer); activeId=items.length? items[0].id : null;
    const savedName=ls('rv_client_name'); if(savedName) el('cName').value=savedName;
    el('gateCard').classList.add('hidden'); el('reviewView').classList.remove('hidden');
    renderHead(); renderVersions(); renderStrip(); renderPerms();
    selectItem(activeId);
    markViewed();
  }

  // Paint the preview watermark over a video player. Video previews are NOT
  // re-encoded (that is heavy in-browser) — the mark is drawn live at the video's
  // native aspect and letterboxed the same way (object-fit:contain) so it lands
  // on the picture, and the download button is hidden for these items.
  async function attachVideoWatermark(vplayer, video, visual){
    if(!vplayer || !video || !window.KolkliWatermark) return;
    if(!KolkliWatermark.hasVisualContent(visual)) return;
    let logo=null;
    if(visual.type==='logo'){ try{ logo=await KolkliWatermark.loadLogo(visual.logo); }catch(_){ return; } }
    const paint=()=>{
      const w=video.videoWidth||1280, h=video.videoHeight||720; if(!w||!h) return;
      let layer=vplayer.querySelector('.vp-wm');
      if(!layer){ layer=document.createElement('div'); layer.className='vp-wm'; vplayer.appendChild(layer); }
      try{ layer.innerHTML='<img src="'+KolkliWatermark.layerDataURL(visual, w, h, logo)+'" alt="">'; }catch(_){}
    };
    if(video.readyState>=1 && video.videoWidth) paint();
    else video.addEventListener('loadedmetadata', paint, {once:true});
  }

  // ---- modern custom video player (no native controls → no download / speed / PiP menu) ----
  function videoPlayerHTML(url){
    const play='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
    const pause='<svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
    const volOn='<svg class="ic-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
    const volOff='<svg class="ic-unmute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>';
    const fs='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M21 16v3a2 2 0 0 1-2 2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/></svg>';
    return `<div class="vplayer" tabindex="0">
      <video src="${url}" playsinline preload="metadata" controlslist="nodownload noplaybackrate noremoteplayback" disablepictureinpicture disableremoteplayback></video>
      <button class="vp-big" type="button" aria-label="נגן" data-vpbig>${play}</button>
      <div class="vp-bar">
        <button class="vp-btn" type="button" aria-label="הפעל / השהה" data-vptoggle><span class="ic-play">${play}</span>${pause}</button>
        <span class="vp-time" data-vpcur>0:00</span>
        <div class="vp-seek" data-vpseek><div class="vp-seek-track"><div class="vp-seek-buf" data-vpbuf></div><div class="vp-seek-fill" data-vpfill></div></div><div class="vp-seek-knob" data-vpknob></div></div>
        <span class="vp-time" data-vpdur>0:00</span>
        <div class="vp-volwrap">
          <button class="vp-btn" type="button" aria-label="השתקה" data-vpmute>${volOn}${volOff}</button>
          <div class="vp-vol"><div class="vp-seek" data-vpvol><div class="vp-seek-track"><div class="vp-seek-fill" data-vpvolfill></div></div><div class="vp-seek-knob" data-vpvolknob></div></div></div>
        </div>
        <button class="vp-btn" type="button" aria-label="מסך מלא" data-vpfs>${fs}</button>
      </div>
    </div>`;
  }
  function wireVideoPlayer(root){
    if(!root) return;
    const v=root.querySelector('video'); if(!v) return;
    const q=s=>root.querySelector(s);
    const bigBtn=q('[data-vpbig]'), toggleBtn=q('[data-vptoggle]'), muteBtn=q('[data-vpmute]'), fsBtn=q('[data-vpfs]');
    const cur=q('[data-vpcur]'), dur=q('[data-vpdur]');
    const seek=q('[data-vpseek]'), fill=q('[data-vpfill]'), buf=q('[data-vpbuf]'), knob=q('[data-vpknob]');
    const vol=q('[data-vpvol]'), volFill=q('[data-vpvolfill]'), volKnob=q('[data-vpvolknob]');
    const setPlaying=p=>root.classList.toggle('playing',p);
    const togglePlay=()=>{ if(v.paused) v.play().catch(()=>{}); else v.pause(); };
    v.addEventListener('play',()=>setPlaying(true));
    v.addEventListener('pause',()=>setPlaying(false));
    v.addEventListener('ended',()=>setPlaying(false));
    bigBtn.addEventListener('click',togglePlay);
    toggleBtn.addEventListener('click',togglePlay);
    v.addEventListener('click',togglePlay);
    const fmtDur=()=>{ dur.textContent=isFinite(v.duration)?mmss(v.duration):'0:00'; };
    v.addEventListener('loadedmetadata',fmtDur); v.addEventListener('durationchange',fmtDur); fmtDur();
    const paintSeek=()=>{ const d=v.duration||0, p=d?Math.min(1,v.currentTime/d):0; fill.style.width=(p*100)+'%'; knob.style.left=(p*100)+'%'; cur.textContent=mmss(v.currentTime); };
    v.addEventListener('timeupdate',paintSeek); paintSeek();
    v.addEventListener('progress',()=>{ try{ if(v.buffered.length){ const end=v.buffered.end(v.buffered.length-1), d=v.duration||0; buf.style.width=(d?Math.min(1,end/d)*100:0)+'%'; } }catch(_){} });
    // seek scrubbing
    const posOf=(elm,e)=>{ const r=elm.getBoundingClientRect(); const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left; return Math.max(0,Math.min(1,x/(r.width||1))); };
    let seeking=false;
    const doSeek=e=>{ const d=v.duration||0; if(!d) return; const p=posOf(seek,e); v.currentTime=p*d; paintSeek(); };
    const seekMove=e=>{ if(seeking){ doSeek(e); e.preventDefault(); } };
    const seekUp=()=>{ seeking=false; document.removeEventListener('pointermove',seekMove); document.removeEventListener('pointerup',seekUp); };
    seek.addEventListener('pointerdown',e=>{ seeking=true; doSeek(e); document.addEventListener('pointermove',seekMove); document.addEventListener('pointerup',seekUp); });
    // volume
    const paintVol=()=>{ const p=v.muted?0:v.volume; volFill.style.width=(p*100)+'%'; volKnob.style.left=(p*100)+'%'; root.classList.toggle('muted',v.muted||v.volume===0); };
    v.addEventListener('volumechange',paintVol);
    muteBtn.addEventListener('click',()=>{ if(!v.muted && v.volume===0) v.volume=1; v.muted=!v.muted; });
    let voldrag=false;
    const doVol=e=>{ const p=posOf(vol,e); v.muted=false; v.volume=p; };
    const volMove=e=>{ if(voldrag){ doVol(e); e.preventDefault(); } };
    const volUp=()=>{ voldrag=false; document.removeEventListener('pointermove',volMove); document.removeEventListener('pointerup',volUp); };
    vol.addEventListener('pointerdown',e=>{ voldrag=true; doVol(e); document.addEventListener('pointermove',volMove); document.addEventListener('pointerup',volUp); });
    paintVol();
    // fullscreen
    fsBtn.addEventListener('click',()=>{ const fe=document.fullscreenElement||document.webkitFullscreenElement; if(fe){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); } else { (root.requestFullscreen||root.webkitRequestFullscreen||(()=>{})).call(root); } });
    // keyboard (when player focused)
    root.addEventListener('keydown',e=>{
      if(e.target.closest('input,textarea')) return;
      if(e.key===' '||e.key==='k'){ e.preventDefault(); togglePlay(); }
      else if(e.key==='ArrowLeft'){ e.preventDefault(); v.currentTime=Math.max(0,v.currentTime-5); }
      else if(e.key==='ArrowRight'){ e.preventDefault(); v.currentTime=Math.min(v.duration||0,v.currentTime+5); }
      else if(e.key==='m'){ v.muted=!v.muted; }
      else if(e.key==='f'){ fsBtn.click(); }
    });
    setPlaying(!v.paused);
  }

  // ---- svg atoms ----
  function clockSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>'; }
  function checkSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'; }
  function refreshSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L3 8"/></svg>'; }
  function xSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>'; }
  function uploadSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>'; }
  function eyeSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>'; }
  function chatSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'; }
  function clipSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>'; }

  // ---- i18n + theme ----
  function applyStatic(){
    document.querySelectorAll('[data-i18n]').forEach(n=>{ const k=n.getAttribute('data-i18n'); if(typeof t[k]==='string') n.textContent=t[k]; });
    document.querySelectorAll('[data-i18n-ph]').forEach(n=>{ const k=n.getAttribute('data-i18n-ph'); if(typeof t[k]==='string') n.setAttribute('placeholder',t[k]); });
    document.querySelectorAll('[data-i18n-tip]').forEach(n=>{ const k=n.getAttribute('data-i18n-tip'); if(typeof t[k]==='string') n.setAttribute('title',t[k]); });
  }
  function applyLang(l){
    lang=l; t=I18N[l];
    document.documentElement.lang=l; document.documentElement.dir=t.dir;
    applyStatic(); RV.lsSet('ac_lang', l);
    const li=el('langIco'); if(li) li.textContent=langName(l);
    renderLangMenu();
    if(proj && !el('reviewView').classList.contains('hidden')){
      renderHead(); renderVersions(); renderStrip(); renderThread(); renderAddFoot(); renderTimeline(); renderPerms(); onTime();
      document.querySelectorAll('.sthumb').forEach(s=>s.classList.toggle('on', s.getAttribute('data-item')===activeId));
    }
  }
  function applyTheme(th){ const dark=(th==='dark'); document.documentElement.setAttribute('data-theme',dark?'dark':'light'); const ti=el('themeIco'); if(ti) ti.textContent=dark?'☀️':'🌙'; RV.lsSet('theme',dark?'dark':'light'); }
  function renderLangMenu(){
    const menu=el('langMenu'); if(!menu) return;
    menu.innerHTML=LANGS.map(L=>`<button class="langopt${L.code===lang?' active':''}" type="button" role="option" data-lang="${L.code}" lang="${L.code}" dir="${L.dir}" aria-selected="${L.code===lang?'true':'false'}"><span>${L.name}</span><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></button>`).join('');
  }
  function closeLangMenu(){
    const wrap=el('langWrap'), btn=el('langBtn');
    if(wrap) wrap.classList.remove('open');
    if(btn) btn.setAttribute('aria-expanded','false');
  }
  function toggleLangMenu(e){
    e.preventDefault(); e.stopPropagation();
    const wrap=el('langWrap'), btn=el('langBtn');
    if(!wrap || !btn) return;
    const open=wrap.classList.toggle('open');
    btn.setAttribute('aria-expanded',open?'true':'false');
  }

  // ---- events ----
  el('strip').addEventListener('click',e=>{ const s=e.target.closest('[data-item]'); if(s) selectItem(s.getAttribute('data-item')); });
  el('vSwitch').addEventListener('click',e=>{ const b=e.target.closest('[data-ver]'); if(!b) return; activeVer=+b.getAttribute('data-ver'); const items=itemsOf(activeVer); activeId=items.length?items[0].id:null; renderVersions(); renderStrip(); selectItem(activeId); });
  el('thread').addEventListener('click',e=>{
    const vc=e.target.closest('[data-voice]'); if(vc){ playVoice(vc.getAttribute('data-voice')); return; }
    if(e.target.closest('a[href]')) return;   // let external links open
    const att=e.target.closest('[data-att]'); if(att){ fetchAtt(att.getAttribute('data-att'),att.getAttribute('data-attn')); return; }
    const s=e.target.closest('[data-seek]'); if(s){ const v=s.getAttribute('data-seek'); if(v!=='') seekTo(+v); }
  });
  el('postBtn').addEventListener('click',addComment);
  el('filterBtn').addEventListener('click',()=>{
    cmtFilter=CMT_FILTERS[(CMT_FILTERS.indexOf(cmtFilter)+1)%CMT_FILTERS.length];
    el('filterBtn').classList.toggle('on', cmtFilter!=='all');
    toast(filterName(cmtFilter));
    renderThread();
  });
  el('dlBtn').addEventListener('click',async()=>{ const it=activeItem(); if(!it) return; if(it.wmOverlay){ toast(t.dlWmBlocked); return; } if(!proj.perms.download||isDemo){ toast(t.dlBlocked); return; } const blob=await RV.loadItemBlob(token, it.previewId||it.id); if(!blob) return; const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=dlFileName(it); document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); });
  el('decideBar').addEventListener('click',e=>{
    const p=e.target.closest('[data-prio]');
    if(p){ changePriority=p.getAttribute('data-prio'); el('decideBar').querySelectorAll('[data-prio]').forEach(b=>b.classList.toggle('on', b===p)); return; }
    const ap=e.target.closest('#approveBtn');
    if(ap){ if(ap.getAttribute('data-locked')){ toast(t.needFullView); return; } decide('approved'); return; }
    if(e.target.closest('#changesBtn')) decide('changes');
    else if(e.target.closest('#rejectBtn')) decide('rejected');
    else if(e.target.closest('#redoBtn')) redo();
  });
  // ---- new controls (upgraded layout) ----
  function playerFs(){ const root=document.querySelector('#media .vplayer'); const fe=document.fullscreenElement||document.webkitFullscreenElement; if(fe){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); } else if(root){ (root.requestFullscreen||root.webkitRequestFullscreen||(()=>{})).call(root); } }
  el('markBtn').addEventListener('click',()=>{ if(activeMedia&&!activeMedia.paused) activeMedia.pause(); el('addBox').scrollIntoView({behavior:'smooth',block:'center'}); el('cTitle').focus(); });
  el('shareBtn').addEventListener('click',()=>{ try{ navigator.clipboard.writeText(location.href); }catch(_){} toast(t.linkCopied); });
  el('infoBtn').addEventListener('click',()=>{ const it=activeItem(); if(it) toast(it.name+'  ·  '+(el('fcSub').textContent||'')); });
  el('fsBtn').addEventListener('click',playerFs);
  el('tlZoomIn').addEventListener('click',()=>{ tlZoom=Math.min(6,tlZoom+0.5); renderTimeline(); });
  el('tlZoomOut').addEventListener('click',()=>{ tlZoom=Math.max(1,tlZoom-0.5); renderTimeline(); });
  el('attBtn').addEventListener('click',()=>el('attInput').click());
  el('attInput').addEventListener('change',e=>{ const f=e.target.files&&e.target.files[0]; if(f) setAtt(f); });
  el('attX').addEventListener('click',clearAtt);
  el('mentionBtn').addEventListener('click',()=>{ const ta=el('cBody'); ta.value+=(ta.value&&!/\s$/.test(ta.value)?' ':'')+'@'; ta.focus(); });
  el('backBtn').addEventListener('click',()=>{ location.href='./review'; });
  el('helpBtn').addEventListener('click',()=>toast(t.helpMsg));
  el('appsBtn').addEventListener('click',()=>{ location.href='./'; });
  el('pwForm').addEventListener('submit',unlock);
  el('evForm').addEventListener('submit',evSendCode);
  el('evCodeForm').addEventListener('submit',evVerify);
  el('langBtn').addEventListener('click',toggleLangMenu);
  el('langMenu').addEventListener('click',e=>{
    const b=e.target.closest('[data-lang]');
    if(!b) return;
    applyLang(b.getAttribute('data-lang'));
    closeLangMenu();
  });
  document.addEventListener('click',e=>{ const w=el('langWrap'); if(w && !w.contains(e.target)) closeLangMenu(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeLangMenu(); });
  el('themeToggle').addEventListener('click',()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));
  window.__setLang=applyLang;

  // ---- init ----
  applyTheme(ls('theme')||'light');
  applyLang(RV.detectLang());
  token=(location.search.match(/[?&]p=([^&]+)/)||[])[1];
  token = token? decodeURIComponent(token) : null;
  const wantsDemo = /[?&]demo=1/.test(location.search) || token==='demo';
  if(wantsDemo){ isDemo=true; proj=demoProject(); token='demo'; if(!ls('rv_client_name')) RV.lsSet('rv_client_name','טל זימר'); enterReview(); return; }
  if(!token){ notice('ntMissingT','ntMissingB'); return; }
  // Cross-device: fetch this project by its token from the server into the local
  // mirror first (the token is the access secret). Instant local read when
  // Supabase is unconfigured — behaves exactly as the old demo.
  (RV.pullToken ? RV.pullToken(token) : Promise.resolve(RV.getProject(token))).then(function(){
    proj=RV.getProject(token);
    if(!proj){ notice('ntMissingT','ntMissingB'); return; }
    applyBrand(proj.brand);
    const st=RV.statusOf(proj);
    if(st==='expired'){ notice('ntExpiredT','ntExpiredB'); return; }
    if(st==='closed'){ notice('ntClosedT','ntClosedB'); return; }
    if(proj.password){ show('pwState'); setTimeout(()=>el('pwInput').focus(),40); return; }
    proceedToReview();
  });
})();
