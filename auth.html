<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOLKLI — התחברות / הרשמה</title>
<link rel="canonical" href="https://kolkli.com/auth">
<meta name="description" content="Sign in or create an KOLKLI account to save your files, keep share links and access your history.">
<style>
  :root {
    --bg:#eef0f6; --panel:#ffffff; --panel-2:#f5f6fa; --line:#e5e8f0; --line-2:#eef0f6;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#7c3aed; --accent-dim:#6a2fe0; --accent-ink:#ffffff; --accent-soft:#efe9fe;
    --success:#22b04b; --success-dim:#1c9a41; --success-soft:#e6f6ec;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --danger:#e5484d; --danger-soft:#fdecec;
    --warm-soft:#fff5da; --warm-line:#f2d98a;
    --ok:#22b04b; --warn:#c88a04; --err:#e5484d;
    --grad:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-h:linear-gradient(105deg,#6a29e6 0%,#2f74f0 100%);
    --grad-soft:linear-gradient(120deg,#efe9fe,#e6f0ff);
    --grad-shadow:rgba(93,79,240,0.30);
    --grad-btn:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn-glow:rgba(59,111,246,0.38);
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-lg:0 2px 6px rgba(20,24,44,0.05), 0 20px 50px rgba(20,24,44,0.10);
    --shadow-sm:0 1px 2px rgba(20,24,44,0.05);
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --sans:'Space Grotesk',system-ui,'Segoe UI','Heebo',sans-serif;
  }
  html[data-theme="dark"] {
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a303c; --line-2:#232833;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --accent:#a06bff; --accent-dim:#7c3aed; --accent-ink:#ffffff; --accent-soft:#241a3a;
    --success:#37c26a; --success-dim:#2fae5e; --success-soft:#132a1c;
    --info:#5b95f8; --info-dim:#4f8ef7; --info-soft:#182338;
    --danger:#ff6b6b; --danger-soft:#2a1719;
    --warm-soft:#2c2718; --warm-line:#5a4d24;
    --ok:#4ec98a; --warn:#e8b84b; --err:#ff6b6b;
    --grad:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-h:linear-gradient(105deg,#9a63ff 0%,#6aa2ff 100%);
    --grad-soft:linear-gradient(120deg,#1c1633,#11242a);
    --grad-shadow:rgba(77,123,255,0.42);
    --grad-btn:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn-glow:rgba(77,123,255,0.45);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,0.45), 0 24px 60px rgba(0,0,0,0.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;
    display:flex;flex-direction:column;min-height:100vh;overflow-x:clip;}
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:var(--grad);z-index:100;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--sans);}

  /* soft background orbs, like the landing hero */
  .orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.4;z-index:0;pointer-events:none;}
  .orb.a{width:420px;height:420px;background:radial-gradient(circle,#8b2fe0,transparent 66%);top:-140px;inset-inline-start:-120px;}
  .orb.b{width:460px;height:460px;background:radial-gradient(circle,#3f85ff,transparent 66%);bottom:-160px;inset-inline-end:-140px;opacity:.32;}

  /* ---------- top bar ---------- */
  .top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;
    width:100%;max-width:none;margin:0 auto;padding:18px 22px;}
  .brand{display:flex;align-items:center;gap:11px;}
  .brand .logo{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    background:var(--grad);color:#fff;box-shadow:0 4px 12px var(--grad-shadow);flex-shrink:0;}
  .brand .logo svg{width:21px;height:21px;}
  .brand b{font-size:18px;font-weight:700;letter-spacing:-0.01em;}
  .toptools{display:flex;align-items:center;gap:8px;}
  .pillbtn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:999px;
    background:var(--panel);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;font-size:13.5px;
    box-shadow:var(--shadow-sm);transition:border-color .12s,transform .08s,background .12s;}
  .pillbtn:hover{border-color:var(--accent);}
  .pillbtn:active{transform:scale(0.97);}
  .iconbtn{width:38px;height:38px;padding:0;justify-content:center;font-size:15px;line-height:1;}

  /* ---------- centered auth card ---------- */
  .stage{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;padding:24px 20px 48px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);
    width:100%;max-width:768px;overflow:hidden;}
  /* horizontal (two-column) auth: brand panel + form panel side by side */
  .split{display:flex;align-items:stretch;}
  .brandside{flex:0 0 41%;position:relative;overflow:hidden;color:#fff;background:var(--grad);
    padding:36px 30px;display:flex;flex-direction:column;justify-content:center;gap:22px;}
  .brandside .borb{position:absolute;border-radius:50%;filter:blur(48px);pointer-events:none;}
  .brandside .borb.x{width:220px;height:220px;background:rgba(255,255,255,.34);top:-72px;inset-inline-start:-60px;}
  .brandside .borb.y{width:240px;height:240px;background:rgba(0,0,0,.16);bottom:-90px;inset-inline-end:-70px;}
  .brandside h2{position:relative;font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.28;margin:0;
    text-shadow:0 1px 3px rgba(0,0,0,.16);}
  .brandside ul{position:relative;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;}
  .brandside li{display:flex;align-items:flex-start;gap:11px;font-size:13.5px;line-height:1.45;color:rgba(255,255,255,.95);}
  .brandside li svg{width:22px;height:22px;flex-shrink:0;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
    background:rgba(255,255,255,.2);border-radius:50%;padding:4px;box-sizing:border-box;}
  .formside{flex:1;min-width:0;padding:26px 30px 22px;}
  .card .head{text-align:center;margin-bottom:16px;}
  .card .head .biglogo-img{height:34px;width:auto;display:block;margin:0 auto 12px;}
  .card .head h1{font-size:20px;font-weight:700;letter-spacing:-0.02em;margin:0 0 4px;}
  .card .head p{font-size:13px;color:var(--muted);margin:0;}

  /* social sign-in buttons (Google / Facebook / Apple) */
  .social{display:flex;gap:9px;margin-bottom:14px;}
  .sbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;height:44px;cursor:pointer;
    border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--ink-2);
    box-shadow:var(--shadow-sm);transition:border-color .12s,background .12s,transform .08s;}
  .sbtn:hover{border-color:var(--accent);background:var(--panel-2);}
  .sbtn:active{transform:translateY(1px);}
  .sbtn:disabled{opacity:.55;cursor:default;transform:none;}
  .sbtn svg{width:21px;height:21px;flex-shrink:0;display:block;}

  @media (max-width:700px){
    .card{max-width:400px;}
    .split{flex-direction:column;}
    .brandside{display:none;}
    .formside{padding:24px 26px 22px;}
  }

  /* segmented control */
  .seg{display:flex;gap:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px;}
  .segbtn{flex:1;height:36px;border:none;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;
    font-size:14px;font-weight:600;transition:color .14s,background .14s,box-shadow .14s;}
  .segbtn.on{background:var(--panel);color:var(--accent-dim);box-shadow:var(--shadow-sm);}

  /* fields */
  .field{margin-bottom:11px;}
  .field.hidden{display:none;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px;}
  .inwrap{position:relative;display:flex;align-items:center;}
  .field input{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;
    font-family:var(--sans);font-size:14px;padding:11px 12px;transition:border-color .12s,box-shadow .12s;}
  .field input::placeholder{color:var(--faint);}
  .field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .field input[dir="ltr"]{text-align:start;}
  .field.bad input{border-color:var(--danger);}
  .field.bad input:focus{box-shadow:0 0 0 3px var(--danger-soft);}
  /* Password is always dir=ltr (text-align:start → left), so the reveal
     toggle sits on the right in both languages and the input reserves room
     for it. Using logical inset-inline-end here would put the eye on the
     left in RTL, on top of the left-aligned password text. */
  .eye{position:absolute;right:6px;left:auto;width:32px;height:32px;border:none;background:none;color:var(--faint);
    cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:color .12s,background .12s;}
  .inwrap:has(.eye) input{padding-right:42px;}
  .eye:hover{color:var(--accent);background:var(--panel);}
  .eye svg{width:18px;height:18px;}
  .err{font-size:11.5px;color:var(--danger);margin-top:5px;min-height:14px;line-height:1.3;}

  .forgot{display:inline-block;font-size:12.5px;color:var(--accent-dim);margin:-4px 0 4px;cursor:pointer;}
  .forgot:hover{text-decoration:underline;}
  .forgot.hidden{display:none;}

  .authbtn{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:9px;color:#fff;border:none;cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:600;font-size:14.5px;padding:12px 20px;border-radius:999px;text-shadow:0 1px 2px rgba(0,0,0,.18);margin-top:6px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.14),0 8px 20px var(--grad-btn-glow);
    transition:filter .14s,transform .08s;}
  .authbtn:hover{filter:brightness(1.05);} .authbtn:active{transform:translateY(1px);}
  .authbtn:disabled{opacity:.6;cursor:default;filter:none;transform:none;}
  .authbtn svg{width:17px;height:17px;}

  /* form-level message */
  .formmsg{font-size:13px;border-radius:10px;padding:10px 12px;margin-bottom:14px;display:none;line-height:1.5;}
  .formmsg.show{display:block;}
  .formmsg.err{background:var(--danger-soft);color:var(--danger);}
  .formmsg.info{background:var(--info-soft);color:var(--info-dim);}

  /* divider + guest */
  .divider{display:flex;align-items:center;gap:12px;margin:16px 0 14px;color:var(--faint);font-size:12px;font-family:var(--mono);}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line);}
  .guest{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:999px;
    font-size:14px;font-weight:600;background:var(--panel);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;
    box-shadow:var(--shadow-sm);transition:border-color .12s,transform .08s;}
  .guest:hover{border-color:var(--accent);} .guest:active{transform:translateY(1px);}
  .guest svg{width:16px;height:16px;color:var(--muted);}

  .switchrow{text-align:center;font-size:13.5px;color:var(--muted);margin-top:16px;}
  .switchrow a{color:var(--accent-dim);font-weight:600;cursor:pointer;}
  .switchrow a:hover{text-decoration:underline;}

  .note{display:flex;align-items:flex-start;gap:8px;margin-top:16px;padding:11px 13px;border-radius:11px;
    background:var(--panel-2);border:1px solid var(--line-2);font-size:11.5px;color:var(--muted);line-height:1.55;}
  .note svg{width:15px;height:15px;color:var(--success);flex-shrink:0;margin-top:1px;}

  /* logged-in state */
  .signed{text-align:center;display:none;padding:38px 30px;}
  .signed.show{display:block;}
  .signed .avatar{width:64px;height:64px;margin:0 auto 16px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--grad);color:#fff;font-size:26px;font-weight:700;box-shadow:0 6px 18px var(--grad-shadow);}
  .signed h2{font-size:20px;margin:0 0 4px;font-weight:700;}
  .signed .who{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-bottom:22px;direction:ltr;}
  .signed .actions{display:flex;flex-direction:column;gap:10px;max-width:330px;margin:0 auto;}
  .authhidden{display:none !important;}

  footer{position:relative;z-index:2;text-align:center;color:var(--faint);font-size:12px;font-family:var(--mono);padding:18px;}
</style>
<link rel="stylesheet" href="./header.css">
</head>
<body>
<div id="site-header"></div>
<script src="./header.js"></script>
<span class="orb a"></span><span class="orb b"></span>

<!-- ============ auth card ============ -->
<div class="stage">
  <div class="card">

    <!-- form view -->
    <div id="formView" class="split">
      <aside class="brandside">
        <span class="borb x"></span><span class="borb y"></span>
        <h2 id="brandHead" data-i18n="brandHead"></h2>
        <ul>
          <li><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg><span data-i18n="brandB1"></span></li>
          <li><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg><span data-i18n="brandB2"></span></li>
          <li><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg><span data-i18n="brandB3"></span></li>
        </ul>
      </aside>

      <div class="formside">
      <div class="head">
        <img class="biglogo-img" src="./assets/logo.png" alt="KOLKLI" width="139" height="34" decoding="async">
        <h1 id="cardTitle"></h1>
        <p id="cardSub"></p>
      </div>

      <div class="seg" role="tablist">
        <button class="segbtn on" id="tabLogin" type="button" data-i18n="tabLogin"></button>
        <button class="segbtn" id="tabSignup" type="button" data-i18n="tabSignup"></button>
      </div>

      <div class="formmsg" id="formMsg"></div>

      <div class="social">
        <button class="sbtn" id="btnGoogle" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1Z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.24 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23Z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1-.34-2.1c0-.73.13-1.44.34-2.1V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84Z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38Z"/></svg>
        </button>
        <button class="sbtn" id="btnFacebook" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#1877F2" d="M24 12a12 12 0 1 0-13.88 11.85v-8.38H7.08V12h3.04V9.36c0-3 1.79-4.66 4.53-4.66 1.31 0 2.68.23 2.68.23v2.95h-1.5c-1.49 0-1.96.93-1.96 1.87V12h3.33l-.53 3.47h-2.8v8.38A12 12 0 0 0 24 12Z"/></svg>
        </button>
        <button class="sbtn" id="btnApple" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.05 12.72c-.03-2.6 2.12-3.84 2.22-3.91-1.21-1.77-3.09-2.01-3.76-2.04-1.6-.16-3.12.94-3.93.94-.81 0-1.83-.92-3.01-.9-1.55.02-2.98.9-3.78 2.29-1.61 2.8-.41 6.94 1.16 9.21.76 1.11 1.67 2.36 2.86 2.31 1.15-.05 1.58-.74 2.97-.74 1.38 0 1.77.74 2.98.72 1.23-.02 2.01-1.13 2.76-2.24.87-1.28 1.23-2.52 1.25-2.58-.03-.01-2.4-.92-2.42-3.65-.02-2.28 1.86-3.37 1.95-3.42-1.07-1.56-2.72-1.73-3.3-1.77ZM14.5 5.15c.64-.78 1.07-1.86.95-2.94-.92.04-2.04.61-2.7 1.39-.59.69-1.11 1.79-.97 2.85 1.03.08 2.08-.52 2.72-1.3Z"/></svg>
        </button>
      </div>

      <div class="divider" data-i18n="orEmail"></div>

      <form id="authForm" novalidate autocomplete="on">
        <div class="field" id="emailField">
          <label for="emailInput" data-i18n="emailLabel"></label>
          <div class="inwrap"><input id="emailInput" type="email" dir="ltr" autocomplete="email" data-i18n-ph="emailPh"></div>
          <div class="err" id="emailErr"></div>
        </div>

        <div class="field" id="passField">
          <label for="passInput" data-i18n="passLabel"></label>
          <div class="inwrap">
            <input id="passInput" type="password" dir="ltr" autocomplete="current-password" data-i18n-ph="passPh">
            <button class="eye" id="passEye" type="button" tabindex="-1" aria-label="show password">
              <svg id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eyeShut" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 10 8 10 8a13.2 13.2 0 0 1-1.67 2.68"/><path d="M6.6 6.6C3.6 8.3 2 12 2 12s3 8 10 8a9.3 9.3 0 0 0 5.4-1.6"/><path d="m2 2 20 20"/></svg>
            </button>
          </div>
          <div class="err" id="passErr"></div>
        </div>

        <div class="field hidden" id="confirmField">
          <label for="confirmInput" data-i18n="confirmLabel"></label>
          <div class="inwrap"><input id="confirmInput" type="password" dir="ltr" autocomplete="new-password" data-i18n-ph="confirmPh"></div>
          <div class="err" id="confirmErr"></div>
        </div>

        <a class="forgot" id="forgotLink" data-i18n="forgot"></a>

        <button class="authbtn" id="submitBtn" type="submit"></button>
      </form>

      <div class="switchrow">
        <span id="switchText"></span> <a id="switchLink"></a>
      </div>

      <a class="guest" href="./app">
        <span data-i18n="guest"></span>
      </a>

      <div class="note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg>
        <span data-i18n="privacy"></span>
      </div>
      </div>
    </div>

    <!-- signed-in view -->
    <div class="signed" id="signedView">
      <div class="avatar" id="avatar"></div>
      <h2 id="signedHi"></h2>
      <div class="who" id="signedWho"></div>
      <div class="actions">
        <a class="authbtn" id="goDashboard" href="./dashboard" style="text-decoration:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
          <span data-i18n="dashboard"></span>
        </a>
        <a class="guest" id="goFiles" href="./files" style="text-decoration:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>
          <span data-i18n="goFiles"></span>
        </a>
        <button class="guest" id="logoutBtn" type="button">

</div>

      errRequired:'Required field', errEmail:'Invalid email address', errPassShort:'Password must be at least 6 characters',

      brandB2:'Сохраняйте файлы и личные ссылки для обмена',
      brandB3:'Быстрый вход через Google, Facebook или Apple',
      switchToSignupText:'Нет аккаунта?', switchToSignupLink:'Зарегистрироваться',
      switchToLoginText:'Уже есть аккаунт?', switchToLoginLink:'Войти',
      privacy:'Быстро и просто: загрузите и получите результат профессионального качества за секунды — без установок и лишних действий.',
      dashboard:'В личный кабинет', goFiles:'К моим файлам', logout:'Выйти',
      signedHi:name=>`Привет, ${name}!`, welcomeBack:'Вы вошли 👋', accountCreated:'Аккаунт создан 🎉',
      errRequired:'Обязательное поле', errEmail:'Неверный адрес почты', errPassShort:'Пароль должен быть не менее 6 символов',
      errMatch:'Пароли не совпадают', errTaken:'Аккаунт с этой почтой уже существует', errNoUser:'Аккаунт с этой почтой не найден',
      errWrongPass:'Неверный пароль',
      forgotMsg:'Сброс пароля заработает после подключения сервера. Пока можно создать новый аккаунт.',
      checkEmail:'Мы отправили письмо для подтверждения — подтвердите и войдите.',
      resetSent:'Мы отправили ссылку для сброса пароля на вашу почту.',
      resetNeedEmail:'Сначала введите адрес электронной почты.',
      foot:'KOLKLI · Аккаунты локальные (демо). Быстро, просто и профессионального качества.',
    },
  };

  let lang='he', t=I18N.he;
  let mode='login';   // 'login' | 'signup'

  // =====================================================
  //  DEMO AUTH STORE  (localStorage)
  //  --- SEAM: replace these with real server API calls ---
  //  In production, sign-up / sign-in hit the backend (§16 of SPEC.md:
  //  Node/NestJS + PostgreSQL). Nothing here is real security — passwords
  //  are only hashed so the demo doesn't keep them in plain text.
  // =====================================================
  const USERS_KEY='ac_users', SESSION_KEY='ac_session';
  function loadUsers(){ try{ return JSON.parse(localStorage.getItem(USERS_KEY))||[]; }catch(_){ return []; } }
  function saveUsers(u){ try{ localStorage.setItem(USERS_KEY, JSON.stringify(u)); }catch(_){} }
  function findUser(email){ return loadUsers().find(u=>u.email===email.toLowerCase()); }
  function setSession(email){ try{ localStorage.setItem(SESSION_KEY, email.toLowerCase()); }catch(_){} }
  // 7-day free trial for freshly-registered users (fingerprint-gated in trial.js).
  function grantTrial(email){
    try{ return (window.KolkliTrial && KolkliTrial.grantOnSignup) ? KolkliTrial.grantOnSignup(email) : Promise.resolve(); }
    catch(_){ return Promise.resolve(); }
  }
  // Email-confirmation flow: no session yet, so remember to grant the trial the
  // moment this verified account signs in (trial.js autoClaim picks it up).
  function pendTrial(email){
    try{ if(window.KolkliTrial && KolkliTrial.markPending) KolkliTrial.markPending(email); }catch(_){}
  }
  function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(_){} }
  function currentSession(){ try{ return localStorage.getItem(SESSION_KEY); }catch(_){ return null; } }

  async function hashPass(str){
    try{
      if(window.crypto && crypto.subtle){
        const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
        return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
      }
    }catch(_){}
    let h=5381; for(let i=0;i<str.length;i++){ h=((h<<5)+h)+str.charCodeAt(i); h|=0; }
    return 'x'+(h>>>0).toString(16);
  }

  // =====================================================
  //  VALIDATION
  // =====================================================
  const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  function setErr(fieldId, errId, msg){
    el(fieldId).classList.toggle('bad', !!msg);
    el(errId).textContent = msg||'';
  }
  function clearErrors(){
    ['emailField','passField','confirmField'].forEach(f=>el(f).classList.remove('bad'));
    ['emailErr','passErr','confirmErr'].forEach(e=>el(e).textContent='');
    showMsg('');
  }
  function showMsg(text, kind){
    const m=el('formMsg');
    m.textContent=text||'';
    m.className='formmsg'+(text?(' show '+(kind||'info')):'');
  }

  // =====================================================
  //  SUBMIT
  // =====================================================
  async function onSubmit(e){
    e.preventDefault();
    clearErrors();
    const email=el('emailInput').value.trim().toLowerCase();
    const name=email? email.split('@')[0] : '';   // display name derived from email (no name field)
    const pass=el('passInput').value;
    const confirm=el('confirmInput').value;

    let ok=true;
    if(!email){ setErr('emailField','emailErr',t.errRequired); ok=false; }
    else if(!EMAIL_RE.test(email)){ setErr('emailField','emailErr',t.errEmail); ok=false; }
    else if(mode==='signup' && window.KolkliTrial && KolkliTrial.isDisposableEmail && KolkliTrial.isDisposableEmail(email)){ setErr('emailField','emailErr',(KolkliTrial.disposableMsg&&KolkliTrial.disposableMsg())||t.errEmail); ok=false; }
    if(!pass){ setErr('passField','passErr',t.errRequired); ok=false; }
    else if(pass.length<6){ setErr('passField','passErr',t.errPassShort); ok=false; }
    if(mode==='signup'){
      if(!confirm){ setErr('confirmField','confirmErr',t.errRequired); ok=false; }
      else if(confirm!==pass){ setErr('confirmField','confirmErr',t.errMatch); ok=false; }
    }
    if(!ok) return;

    el('submitBtn').disabled=true;
    try{
      // Backend seam: real server when Supabase is wired up, else demo store.
      if(window.KolkliAuth && window.KolkliAuth.configured()){
        if(mode==='signup'){
          const r=await window.KolkliAuth.signUp({ name, email, password:pass });
          if(r.ok){ if(r.code==='confirm'){ pendTrial(email); showMsg(t.checkEmail,'info'); } else { await grantTrial(email); showSigned(name, email, t.accountCreated); } }
          else if(r.code==='taken'){ setErr('emailField','emailErr',t.errTaken); }
          else if(r.code==='weak'){ setErr('passField','passErr',t.errPassShort); }
          else { showMsg(r.message||t.errRequired,'err'); }
        } else {
          const r=await window.KolkliAuth.signIn({ email, password:pass });
          if(r.ok){ const su=findUser(email); showSigned(su?su.name:email.split('@')[0], email, t.welcomeBack); }
          else if(r.code==='confirm'){ showMsg(t.checkEmail,'info'); }
          else if(r.code==='invalid'){ setErr('passField','passErr',t.errWrongPass); }
          else { showMsg(r.message||t.errRequired,'err'); }
        }
      } else if(mode==='signup'){
        if(findUser(email)){ setErr('emailField','emailErr',t.errTaken); return; }
        const users=loadUsers();
        users.push({ name, email, pass:await hashPass(pass), role:'user', plan:'free', created:Date.now() });
        saveUsers(users);
        setSession(email);
        await grantTrial(email);
        showSigned(name, email, t.accountCreated);
      } else {
        const u=findUser(email);
        if(!u){ setErr('emailField','emailErr',t.errNoUser); return; }
        if(u.pass!==await hashPass(pass)){ setErr('passField','passErr',t.errWrongPass); return; }
        setSession(email);
        showSigned(u.name, email, t.welcomeBack);
      }
    } finally {
      el('submitBtn').disabled=false;
    }
  }

  // =====================================================
  //  VIEWS
  // =====================================================
  function setMode(m){
    mode=m;
    el('tabLogin').classList.toggle('on', m==='login');
    el('tabSignup').classList.toggle('on', m==='signup');
    el('confirmField').classList.toggle('hidden', m!=='signup');
    el('forgotLink').classList.toggle('hidden', m!=='login');
    el('passInput').setAttribute('autocomplete', m==='signup'?'new-password':'current-password');
    el('cardTitle').textContent = m==='signup'? t.signupTitle : t.loginTitle;
    el('cardSub').textContent   = m==='signup'? t.signupSub   : t.loginSub;
    el('submitBtn').textContent = m==='signup'? t.submitSignup : t.submitLogin;
    el('switchText').textContent = m==='signup'? t.switchToLoginText : t.switchToSignupText;
    el('switchLink').textContent = m==='signup'? t.switchToLoginLink : t.switchToSignupLink;
    clearErrors();
  }

  function showSigned(name, email, msg){
    el('formView').classList.add('authhidden');
    const sv=el('signedView'); sv.classList.add('show');
    el('avatar').textContent=(name||email||'?').trim().charAt(0).toUpperCase();
    el('signedHi').textContent=t.signedHi(name||email.split('@')[0]);
    el('signedWho').textContent=email;
    if(msg) { /* brief confirmation lives in the greeting; msg reserved for future toast */ }
  }
  function showForm(){
    el('signedView').classList.remove('show');
    el('formView').classList.remove('authhidden');
  }

  // =====================================================
  //  I18N + THEME  (shares keys with the rest of the site)
  // =====================================================
  function applyLang(l){
    lang=l; t=I18N[l];
    document.documentElement.lang=l; document.documentElement.dir=t.dir;
    document.querySelectorAll('[data-i18n]').forEach(n=>{ const k=n.getAttribute('data-i18n'); if(typeof t[k]==='string') n.textContent=t[k]; });
    document.querySelectorAll('[data-i18n-ph]').forEach(n=>{ const k=n.getAttribute('data-i18n-ph'); if(typeof t[k]==='string') n.setAttribute('placeholder',t[k]); });
    [['btnGoogle',t.oauthGoogle],['btnFacebook',t.oauthFacebook],['btnApple',t.oauthApple]].forEach(p=>{ const b=el(p[0]); if(b){ b.setAttribute('aria-label',p[1]); b.title=p[1]; } });
    try{ localStorage.setItem('ac_lang', l); }catch(_){}
    setMode(mode);                          // re-label mode-specific strings
    const sess=currentSession();            // re-label signed-in view if visible
    if(sess){ const u=findUser(sess); if(u) { el('signedHi').textContent=t.signedHi(u.name||sess.split('@')[0]); } }
  }
  function ls(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
  function detectLang(){
    const chosen=ls('ac_lang'); if(chosen) return chosen;
    const cc=ls('ac_country'); if(cc) return cc==='IL'?'he':'en';
    let tz=''; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(_){}
    const navHe=(navigator.language||'').toLowerCase().indexOf('he')===0;
    return (tz==='Asia/Jerusalem'||navHe)?'he':'en';
  }
  function applyTheme(th){
    const dark=(th==='dark');
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
    el('themeIco').textContent = dark?'☀️':'🌙';
    try{ localStorage.setItem('theme', dark?'dark':'light'); }catch(_){}
  }

  // =====================================================
  //  EVENTS + INIT
  // =====================================================
  // Social sign-in: real OAuth via Supabase (redirects away); demo fallback msg.
  function onSocial(provider){
    clearErrors();
    if(window.KolkliAuth && window.KolkliAuth.configured()){
      const btns=document.querySelectorAll('.social .sbtn');
      btns.forEach(b=>{ b.disabled=true; });
      window.KolkliAuth.signInWithProvider(provider).then(r=>{
        if(!r || !r.ok){ showMsg((r&&r.message)||t.oauthErr,'err'); btns.forEach(b=>{ b.disabled=false; }); }
        // on success the browser redirects to the provider — nothing more to do
      });
    } else {
      showMsg(t.oauthSoon,'info');
    }
  }
  el('btnGoogle').addEventListener('click',()=>onSocial('google'));
  el('btnFacebook').addEventListener('click',()=>onSocial('facebook'));
  el('btnApple').addEventListener('click',()=>onSocial('apple'));

  el('tabLogin').addEventListener('click',()=>setMode('login'));
  el('tabSignup').addEventListener('click',()=>setMode('signup'));
  el('switchLink').addEventListener('click',()=>setMode(mode==='login'?'signup':'login'));
  el('authForm').addEventListener('submit',onSubmit);
  el('forgotLink').addEventListener('click',()=>{
    if(window.KolkliAuth && window.KolkliAuth.configured()){
      const em=el('emailInput').value.trim().toLowerCase();
      if(!em || !EMAIL_RE.test(em)){ showMsg(t.resetNeedEmail,'info'); return; }
      window.KolkliAuth.resetPassword(em).then(r=>showMsg(r.ok?t.resetSent:(r.message||t.forgotMsg), r.ok?'info':'err'));
      return;
    }
    showMsg(t.forgotMsg,'info');
  });
  el('passEye').addEventListener('click',()=>{
    const inp=el('passInput'), show=inp.type==='password';
    inp.type=show?'text':'password';
    el('eyeOpen').style.display=show?'none':''; el('eyeShut').style.display=show?'':'none';
  });
  el('logoutBtn').addEventListener('click',()=>{
    if(window.KolkliAuth && window.KolkliAuth.configured()) window.KolkliAuth.signOut();
    else clearSession();
    setMode('login'); showForm(); el('authForm').reset();
  });
  // Supabase restores the session asynchronously; when auth-store.js has synced
  // it (fires kolkli:auth), reflect the signed-in state on this page too.
  window.addEventListener('kolkli:auth',()=>{
    const sess=currentSession();
    if(sess){ const u=findUser(sess); showSigned(u?u.name:sess.split('@')[0], sess); }
    else { showForm(); }
  });
  window.__setLang=applyLang;
  el('themeToggle').addEventListener('click',()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));

  // allow ?mode=signup deep-link
  (function init(){
    applyTheme(ls('theme')||'light');
    applyLang(detectLang());
    const q=(location.search.match(/[?&]mode=(signup|login)/)||[])[1];
    if(q) setMode(q);
    const sess=currentSession();
    if(sess){ const u=findUser(sess); if(u){ showSigned(u.name, u.email); } else { clearSession(); } }
  })();
})();
