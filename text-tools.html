     served at deeper URLs too. Pin the base to the site root so relative
     asset/link references keep resolving from root, not the current segment. -->

<script>
  /* Embedded inside the dashboard (iframe / ?embed=1)? Strip the standalone chrome
     — header, dashboard rail, page hero and footer — so only the tool workspace shows.
     Set before first paint to avoid a flash of the full page. */

<style>
  :root {
    --bg:#eef0f6; --panel:#ffffff; --panel-2:#f5f6fa; --line:#e5e8f0; --line-2:#eef0f6;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#7c3aed; --accent-dim:#6a2fe0; --accent-ink:#ffffff; --accent-soft:#efe9fe;
    --success:#22b04b; --success-dim:#1c9a41; --success-soft:#e6f6ec;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --danger:#e5484d; --danger-soft:#fdecec;
    --warm-soft:#fff5da; --warm-line:#f2d98a;
    --ok:#22b04b; --warn:#c88a04; --err:#e5484d;
    --grad:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-h:linear-gradient(105deg,#6a29e6 0%,#2f74f0 100%);
    --grad-soft:linear-gradient(120deg,#efe9fe,#e6f0ff);
    --grad-shadow:rgba(93,79,240,0.30);
    --grad-btn:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn-glow:rgba(59,111,246,0.38);
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-lg:0 2px 6px rgba(20,24,44,0.05), 0 20px 50px rgba(20,24,44,0.10);
    --shadow-sm:0 1px 2px rgba(20,24,44,0.05);
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --sans:'Space Grotesk','Rubik',system-ui,'Segoe UI',sans-serif;
  }
  html[data-theme="dark"] {
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a303c; --line-2:#232833;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --accent:#a06bff; --accent-dim:#7c3aed; --accent-ink:#ffffff; --accent-soft:#241a3a;
    --success:#37c26a; --success-dim:#2fae5e; --success-soft:#132a1c;
    --info:#5b95f8; --info-dim:#4f8ef7; --info-soft:#182338;
    --danger:#ff6b6b; --danger-soft:#2a1719;
    --warm-soft:#2c2718; --warm-line:#5a4d24;
    --ok:#4ec98a; --warn:#e8b84b; --err:#ff6b6b;
    --grad:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-h:linear-gradient(105deg,#9a63ff 0%,#6aa2ff 100%);
    --grad-soft:linear-gradient(120deg,#1c1633,#11242a);
    --grad-shadow:rgba(77,123,255,0.42);
    --grad-btn:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn-glow:rgba(77,123,255,0.45);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,0.45), 0 24px 60px rgba(0,0,0,0.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;}
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:var(--grad);z-index:100;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--sans);}
  .wrap{width:100%;max-width:none;margin:0 auto;padding:22px 20px 60px;}

  /* page intro */
  .pagehead{margin:4px 0 20px;}
  .pagehead h2{font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:-0.02em;margin:0 0 6px;}
  .pagehead .kick{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);
    padding:4px 11px;border-radius:999px;margin-bottom:11px;}
  .pagehead p{font-size:14.5px;color:var(--muted);margin:0;max-width:70ch;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);}

  /* layout: workspace on top, tool picker along the bottom */
  .tt-grid{display:flex;flex-direction:column;gap:18px;}

  /* tool picker — full-width panel below the workspace */
  .tt-side{padding:16px 18px;display:flex;flex-direction:column;gap:14px;align-items:center;}
  .tt-grp-block{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;}
  .tt-grp{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);
    padding:0 2px;text-align:center;}
  /* tool picker chips — styled exactly like the "My Files" audio action pills (.toolrow a in dashboard.html) */
  .tt-nav-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
  .tt-nav{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border:1px solid var(--line);border-radius:999px;
    background:var(--panel);box-shadow:var(--shadow-sm);cursor:pointer;text-align:start;color:var(--ink-2);
    font-family:var(--sans);font-size:13.5px;font-weight:600;transition:border-color .12s,background .12s,color .12s;}
  .tt-nav:hover{border-color:var(--accent);}
  .tt-nav.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-dim);}
  .tt-nav .nvi{display:inline-flex;align-items:center;justify-content:center;color:currentColor;}
  .tt-nav .nvi svg{width:15px;height:15px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .tt-nav span{white-space:nowrap;}

  /* workspace */
  .tt-work{min-width:0;}
  .tt-toolhead{display:flex;align-items:center;gap:13px;margin-bottom:14px;}
  .tt-toolhead .thi{width:46px;height:46px;flex-shrink:0;border-radius:13px;display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);color:var(--accent);}
  .tt-toolhead .thi svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .tt-toolhead h3{font-size:19px;font-weight:700;margin:0 0 2px;}
  .tt-toolhead p{font-size:13px;color:var(--muted);margin:0;}

  /* options bar */
  .tt-opts{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;padding:15px 16px;margin-bottom:16px;}
  .tt-opts:empty{display:none;}
  .tt-opt{display:flex;flex-direction:column;gap:6px;min-width:0;}
  .tt-opt > label{font-size:11.5px;font-weight:700;color:var(--ink-2);}
  .tt-opt select,.tt-opt input[type=text],.tt-opt input[type=number]{
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:9px;
    font-family:var(--sans);font-size:13px;padding:8px 11px;transition:border-color .12s,box-shadow .12s;}
  .tt-opt input[type=text]{min-width:150px;}
  .tt-opt input[type=number]{width:92px;}
  .tt-opt select{cursor:pointer;}
  .tt-opt select:focus,.tt-opt input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .tt-checks{display:flex;flex-wrap:wrap;gap:8px;}
  .tt-check{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;
    background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;
    font-size:12.5px;font-weight:600;color:var(--ink-2);transition:border-color .12s,background .12s,color .12s;}
  .tt-check:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));}
  .tt-check input{accent-color:var(--accent);width:15px;height:15px;margin:0;cursor:pointer;}
  .tt-check.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent-dim);}

  /* input / output panes */
  .tt-io{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
  @media (max-width:820px){ .tt-io{grid-template-columns:1fr;} }
  .tt-pane{display:flex;flex-direction:column;min-width:0;}
  .tt-pane-h{display:flex;align-items:center;gap:10px;margin-bottom:8px;min-height:32px;}
  .tt-pane-h .ttl{font-size:13px;font-weight:700;color:var(--ink-2);}
  .tt-pane-h .stat{font-family:var(--mono);font-size:10.5px;color:var(--faint);white-space:nowrap;}
  .tt-pane-h .sp{flex:1;}
  .tt-mini{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:9px;
    border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;
    font-size:12px;font-weight:600;font-family:var(--sans);transition:border-color .12s,color .12s,background .12s;}
  .tt-mini:hover{border-color:var(--accent);color:var(--accent-dim);}
  .tt-mini svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .tt-mini.primary{color:#fff;border:none;
    background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--grad-btn);
    text-shadow:0 1px 2px rgba(0,0,0,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 12px var(--grad-btn-glow);}
  .tt-mini.primary:hover{filter:brightness(1.06);color:#fff;}
  textarea.tt-ta{width:100%;min-height:360px;resize:vertical;border:1px solid var(--line);border-radius:14px;
    background:var(--panel);color:var(--ink);padding:14px 15px;font-family:var(--mono);font-size:13px;line-height:1.6;
    box-shadow:var(--shadow-sm);transition:border-color .12s,box-shadow .12s;}
  textarea.tt-ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  textarea.tt-ta[readonly]{background:var(--panel-2);}

  /* validity / error note under the output */
  .tt-note{margin-top:12px;font-size:12.5px;min-height:16px;display:flex;align-items:center;gap:8px;}
  .tt-note.ok{color:var(--success-dim);}
  .tt-note.err{color:var(--danger);}
  .tt-note svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

  /* counter stats grid (replaces the output textarea for the counter tool) */
  .tt-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .tt-stat-card{border:1px solid var(--line-2);border-radius:13px;background:var(--panel-2);padding:14px 15px;}
  .tt-stat-card .num{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--accent-dim);line-height:1.1;}
  .tt-stat-card .lab{font-size:12px;color:var(--muted);margin-top:4px;}

  /* ---------- dashboard rail (right-hand column) — filled by dash-sidebar.js ---------- */
  .page-shell{display:flex;gap:20px;align-items:flex-start;}
  .page-main{flex:1;min-width:0;}
  /* menu/tools rail is an integral white column — no card, no border, no rounded corners;
     only a subtle line separates it from the main content */
  #dashRail{width:322px;flex-shrink:0;align-self:flex-start;position:sticky;top:88px;max-height:calc(100vh - 104px);overflow-y:auto;
    background:var(--panel);border:0;border-inline-end:1px solid var(--line);border-radius:0;padding:8px 14px;box-shadow:none;}
  @media (max-width:1000px){ .page-shell{flex-direction:column;} #dashRail{width:100%;position:static;max-height:none;border-inline-end:0;padding:8px 0;} }

  footer{margin-top:34px;text-align:center;color:var(--faint);font-size:12px;font-family:var(--mono);}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:11px 18px;border-radius:999px;
    box-shadow:var(--shadow-lg);transition:opacity .2s,transform .2s;z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- embedded mode: running inside the dashboard via same-origin iframe ---------- */
  html.tt-embed, html.tt-embed body{background:transparent;min-height:0;}
  html.tt-embed #site-header,
  html.tt-embed #dashRail,
  html.tt-embed .pagehead,
  html.tt-embed #foot{display:none !important;}
  html.tt-embed .wrap{padding:0;margin:0;max-width:none;}
  html.tt-embed .page-shell{display:block;gap:0;}
  html.tt-embed .page-main{padding:0;min-width:0;}
  html.tt-embed .tt-grid{margin-top:0;}
</style>

</head>
<body>
<div id="site-header"></div>
<script src="./header.js"></script>
<div class="wrap">
 <div class="page-shell">
  <aside id="dashRail" aria-label="Dashboard menu"></aside>
  <div class="page-main">

  <div class="pagehead">
    <span class="kick" id="kick"></span>
    <h2 id="pageTitle"></h2>

  <div class="tt-grid">

        </div>

        <div class="tt-pane">
          <div class="tt-pane-h">
            <span class="ttl" id="outLabel"></span>
            <span class="stat" id="outStat"></span>
            <span class="sp"></span>
            <button class="tt-mini" id="copyBtn" type="button"></button>
            <button class="tt-mini primary" id="dlBtn" type="button"></button>
          </div>
          <textarea class="tt-ta" id="ttOut" dir="auto" spellcheck="false" readonly></textarea>
          <div class="tt-stats" id="ttStats" style="display:none"></div>
        </div>
      </div>

      <div class="tt-note" id="ttNote"></div>
    </div>

    <aside class="tt-side card" id="ttSide"></aside>
  </div>

  <footer id="foot"></footer>
  </div><!-- /page-main -->
 </div><!-- /page-shell -->
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const el = id => document.getElementById(id);

  /* ---------- icons (Feather-style, inherit currentColor) ---------- */
  const IC = {
    flip:'<polyline points="17 2 21 6 17 10"/><path d="M3 12V9a3 3 0 0 1 3-3h15"/><polyline points="7 22 3 18 7 14"/><path d="M21 12v3a3 3 0 0 1-3 3H3"/>',
    type:'<polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/>',

    merge:'<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/>',
    plus:'<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>',
    listnum:'<line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-1.5 2-2.5S5 14 4 14.5"/>',
    at:'<circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/>',
    hash:'<line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/>',
    table:'<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="12" y1="9" x2="12" y2="21"/>',
    braces:'<path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1"/><path d="M16 3h1a2 2 0 0 1 2 2v5a2 2 0 0 0 2 2 2 2 0 0 0-2 2v5a2 2 0 0 1-2 2h-1"/>',
    copyIco:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
    dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
    trash:'<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
    spark:'<path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/>',
    ok:'<path d="M20 6 9 17l-5-5"/>',
    warn:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>'
  };
  const svg = n => '<svg viewBox="0 0 24 24" aria-hidden="true">'+(IC[n]||'')+'</svg>';

  /* ---------- helpers ---------- */
  const linesOf = s => s.split(/\r?\n/);
  const nl = a => a.join('\n');
  const escapeReg = s => String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  function alpha(i, upper){ let s=''; i=Math.max(1,i); while(i>0){ i--; s=String.fromCharCode(65+(i%26))+s; i=Math.floor(i/26); } return upper?s:s.toLowerCase(); }
  function sortKeys(v){ if(Array.isArray(v)) return v.map(sortKeys); if(v && typeof v==='object'){ const o={}; Object.keys(v).sort().forEach(k=>o[k]=sortKeys(v[k])); return o; } return v; }
  const EMAIL_RE = /[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/g;
  function dedupeArr(arr, ci){ const seen=new Set(), out=[]; arr.forEach(x=>{ const k=ci?x.toLowerCase():x; if(!seen.has(k)){ seen.add(k); out.push(x); } }); return out; }
  function parseCSV(text, delim){
    const rows=[]; let row=[], cur='', i=0, q=false;
    while(i<text.length){
      const ch=text[i];
      if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i+=2; continue; } q=false; i++; continue; } cur+=ch; i++; continue; }
      if(ch==='"'){ q=true; i++; continue; }
      if(ch===delim){ row.push(cur); cur=''; i++; continue; }
      if(ch==='\n' || ch==='\r'){ if(ch==='\r' && text[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; i++; continue; }
      cur+=ch; i++;
    }
    row.push(cur); rows.push(row);
    if(rows.length && rows[rows.length-1].length===1 && rows[rows.length-1][0]==='') rows.pop();
    return rows;
  }
  const csvCell = (c, d) => (c.indexOf(d)>-1 || c.indexOf('"')>-1 || /[\n\r]/.test(c)) ? '"'+c.replace(/"/g,'""')+'"' : c;
  const PAIRS = {'(':')',')':'(', '[':']',']':'[', '{':'}','}':'{', '<':'>','>':'<', '“':'”','”':'“', '‘':'’','’':'‘', '«':'»','»':'«'};
  const OPENERS = {'(':')','[':']','{':'}','<':'>'};
  const QUOTES = {'"':'"', "'":"'", '׳':'׳', '״':'״', '“':'”', '‘':'’', '«':'»'};
  const isSpace = ch => /\s/.test(ch);
  const isWordChar = ch => /[\p{L}\p{N}_-]/u.test(ch);
  const isPunct = ch => /[.,!?;:…،؛]/u.test(ch);
  const isInternalQuote = (arr,i) => ['"', "'", '׳', '״'].indexOf(arr[i])>-1 && i>0 && i<arr.length-1 && isWordChar(arr[i-1]) && isWordChar(arr[i+1]);
  const mirrorChar = ch => PAIRS[ch] || ch;
  function reverseGraphemes(text){
    return Array.from(text).reverse().map(mirrorChar).join('');
  }
  function findMatching(arr,start,close){
    var depth=1;
    for(var i=start+1;i<arr.length;i++){
      if(arr[i]===arr[start]) depth++;
      else if(arr[i]===close){ depth--; if(depth===0) return i; }
    }
    return -1;
  }
  function findQuote(arr,start,close){
    for(var i=start+1;i<arr.length;i++){ if(arr[i]===close) return i; }
    return -1;
  }
  function tokenizeSmartLine(line){
    const arr=Array.from(line), units=[];
    for(let i=0;i<arr.length;){
      const ch=arr[i];
      if(isSpace(ch)){
        let j=i+1; while(j<arr.length && isSpace(arr[j])) j++;
        units.push({type:'space', text:arr.slice(i,j).join('')}); i=j; continue;
      }
      if(OPENERS[ch]){
        const j=findMatching(arr,i,OPENERS[ch]);
        if(j>-1){ units.push({type:'group', open:ch, close:OPENERS[ch], text:arr.slice(i+1,j).join(''), suffix:''}); i=j+1; continue; }
      }
      if(QUOTES[ch] && !isInternalQuote(arr,i)){
        const j=findQuote(arr,i,QUOTES[ch]);
        if(j>-1){ units.push({type:'group', open:ch, close:QUOTES[ch], text:arr.slice(i+1,j).join(''), suffix:''}); i=j+1; continue; }
      }
      if(isWordChar(ch) || isInternalQuote(arr,i)){
        let j=i+1;
        while(j<arr.length && (isWordChar(arr[j]) || isInternalQuote(arr,j))) j++;
        units.push({type:'word', text:arr.slice(i,j).join(''), suffix:''}); i=j; continue;
      }
      if(isPunct(ch)){
        let j=i+1; while(j<arr.length && isPunct(arr[j])) j++;
        const p=arr.slice(i,j).join('');
        const prev=units[units.length-1];
        if(prev && prev.type!=='space') prev.suffix=(prev.suffix||'')+p;
        else units.push({type:'raw', text:p});
        i=j; continue;
      }
      units.push({type:'raw', text:mirrorChar(ch)}); i++;
    }
    return units;
  }
  function renderSmartUnit(u){
    if(u.type==='space') return u.text;
    if(u.type==='word') return reverseGraphemes(u.text)+(u.suffix||'');
    if(u.type==='group') return mirrorChar(u.close)+reverseSmartLine(u.text)+mirrorChar(u.open)+(u.suffix||'');
    return reverseGraphemes(u.text||'')+(u.suffix||'');
  }
  function reverseSmartLine(line){
    return tokenizeSmartLine(line).reverse().map(renderSmartUnit).join('');
  }
  function reverseSmartText(input){
    return input.split(/(\r\n|\n|\r)/).map(part => /\r\n|\n|\r/.test(part) ? part : reverseSmartLine(part)).join('');
  }

          {v:'emails', ...o3('אימיילים','Emails','Email')}, {v:'urls', ...o3('קישורים','Links / URLs','Ссылки')}, {v:'phones', ...o3('טלפונים','Phone numbers','Телефоны')} ]),
        chk('dedupe',true, o3('הסרת כפילויות','Dedupe','Без дублей')),

    { id:'count', grp:'dev', ic:'hash', stats:true,

      opts:[],

    { id:'hashtags', grp:'dev', ic:'hash',
      names:o3('יצירת האשטגים','Hashtag Maker','Генератор хэштегов'),
      desc:o3('ניקוי, הסרת כפילויות והוספת # לכל מונח.','Clean each term, dedupe and prepend a #.','Очистить, убрать дубли и добавить # к каждому.'),
      opts:[
        sel('sep','space', o3('מפריד','Separator','Разделитель'), [
          {v:'space', ...o3('רווח','Space','Пробел')}, {v:'newline', ...o3('שורה','New line','Строка')}, {v:'comma', ...o3('פסיק','Comma','Запятая')} ]),
        chk('camel',true, o3('CamelCase','CamelCase','CamelCase')),

      run(input,o){

        let tags=toks.map(t=>{ const words=(t.replace(/^#+/,'').match(/[\p{L}\p{N}]+/gu))||[]; if(!words.length) return '';

    { id:'csv', grp:'dev', ic:'table', ext:'csv', mime:'text/csv',
      names:o3('ניקוי CSV','CSV Cleaner','Очистка CSV'),
      desc:o3('ניקוי רשימות שמודבקות מאקסל או CRM.','Clean up lists pasted from Excel or a CRM.','Очистить списки, вставленные из Excel или CRM.'),
      opts:[
        sel('delim','comma', o3('מפריד מקור','Input delimiter','Разделитель'), [
          {v:'comma', ...o3('פסיק ,','Comma ,','Запятая ,')}, {v:'semicolon', ...o3('נקודה-פסיק ;','Semicolon ;','Точка с запятой ;')}, {v:'tab', ...o3('טאב','Tab','Таб')} ]),
        chk('trim',true, o3('גזירת תאים','Trim cells','Обрезать ячейки')),

      run(input,o){ const d=o.delim==='semicolon'?';':(o.delim==='tab'?'\t':',');
        let rows=parseCSV(input,d);

    { id:'url', grp:'dev', ic:'link',

  /* ---------- options ---------- */
  function renderOpts(tool){

  /* ---------- run + render output ---------- */
  // Tools are path-routed (/text-tools/word-counter) instead of #hash.
  function ttBase(){
    const p=location.pathname.replace(/[?#].*$/,'').replace(/\/+$/,'');

    return (i<0?'':p.slice(0,i))+'/text-tools';

  function ttSeg(){
    const m=location.pathname.replace(/[?#].*$/,'').match(/\/text-tools(?:\.html)?\/([^/]+)/i);

  }
  function selectTool(id, fromRoute){
    const tool=TOOL_BY_ID[id]||TOOLS[0];

  function run(){
    readOpts();
    const tool=TOOL_BY_ID[curId];
    const input=el('ttIn').value;
    el('inStat').textContent = statLine(input);
    const note=el('ttNote'); note.className='tt-note'; note.innerHTML='';

    if(tool.stats){ renderCount(input); el('outStat').textContent=''; return; }

    let out='';
    try{
      out=tool.run(input, vals);
      el('ttOut').value=out;
      el('outStat').textContent = statLine(out);
      if(tool.id==='json' && input.trim()!==''){ note.className='tt-note ok'; note.innerHTML=svg('ok')+'<span>'+t.okJson+'</span>'; }

      const msg=String(err && err.message || err);
      if(msg.indexOf('__JSON__')===0){ el('ttOut').value=''; el('outStat').textContent=''; note.className='tt-note err'; note.innerHTML=svg('warn')+'<span>'+t.errJson+escapeHtml(msg.slice(8))+'</span>'; }
      else if(msg.indexOf('__URL_ERR__')===0){ el('ttOut').value=''; el('outStat').textContent=''; note.className='tt-note err'; note.innerHTML=svg('warn')+'<span>'+t.errUrl+'</span>'; }
      else { el('ttOut').value=''; el('outStat').textContent=''; note.className='tt-note err'; note.innerHTML=svg('warn')+'<span>'+escapeHtml(msg)+'</span>'; }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function renderCount(input){
    const chars=Array.from(input).length;
    const charsNs=Array.from(input.replace(/\s/g,'')).length;
    const words=(input.match(/\S+/g)||[]).length;
    const lines=input===''?0:input.split(/\r?\n/).length;
    const sentences=(input.match(/[^.!?…]+[.!?…]+/g)||[]).length;
    const paras=input.trim()===''?0:input.trim().split(/\n\s*\n/).filter(p=>p.trim()!=='').length;
    const read=Math.max(words?1:0, Math.ceil(words/200));
    const C=t.cnt;
    const cards=[[C.chars,chars],[C.charsNs,charsNs],[C.words,words],[C.lines,lines],[C.sentences,sentences],[C.paragraphs,paras],[C.read,read+' '+C.min]];
    el('ttStats').innerHTML=cards.map(c=>'<div class="tt-stat-card"><div class="num">'+c[1]+'</div><div class="lab">'+c[0]+'</div></div>').join('');
  }
  function countSummary(input){
    renderCount(input);

    const C=t.cnt; return C.chars+': '+chars+'\n'+C.words+': '+words+'\n'+C.lines+': '+lines;

  el('dlBtn').addEventListener('click', downloadOut);
  window.addEventListener('popstate', ()=>{ const id=ttSeg(); if(id && TOOL_BY_ID[id] && id!==curId) selectTool(id, true); });

  const tb=el('themeToggle'); if(tb) tb.addEventListener('click', ()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));

  /* ---------- init ---------- */
  applyTheme(ls('theme')||'light');
  const startId=ttSeg() || location.hash.replace(/^#/,'');   // path seg, or legacy #tool
  if(startId && TOOL_BY_ID[startId]){
    curId=startId;
    try{ history.replaceState(null,'',ttBase()+'/'+startId+location.search); }catch(_){}
  }
  applyLang(detectLang());

  /* ---------- embedded height sync ---------- */
  // When running inside the dashboard iframe, report our content height to the parent
  // so it can size the frame — the tool then scrolls with the dashboard, not inside a box.
  if(document.documentElement.classList.contains('tt-embed')){
    const postH=()=>{ try{ parent.postMessage({type:'kolkli-tt-height', height:Math.ceil(document.body.getBoundingClientRect().height)}, '*'); }catch(_){} };
    if(window.ResizeObserver){ new ResizeObserver(postH).observe(document.body); }
    window.addEventListener('load', postH);
    postH(); setTimeout(postH,150); setTimeout(postH,500);
  }
})();
</script>
</body>
</html>
