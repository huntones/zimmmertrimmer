<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בלוג — KOLKLI</title>
<link rel="canonical" href="https://kolkli.com/blog">
<meta name="description" content="הבלוג של KOLKLI — מדריכים, טיפים ועדכונים על עבודה עם קבצים מול לקוחות. בקרוב.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef0f6; --panel:#ffffff; --panel-2:#f5f6fa; --line:#e5e8f0;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#7c3aed; --accent-dim:#6a2fe0; --accent-ink:#ffffff;
    --grad:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --shadow:0 1px 2px rgba(20,24,44,.04), 0 8px 26px rgba(20,24,44,.06);
    --sans:'Space Grotesk','Rubik',system-ui,'Segoe UI',sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a303c;
      --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
      --accent:#a06bff; --accent-dim:#7c3aed; --accent-ink:#ffffff;
      --grad:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:32px 22px 80px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
  .brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700;font-size:20px;letter-spacing:.2px}
  .brand .dot{width:26px;height:26px;border-radius:8px;background:var(--grad);box-shadow:var(--shadow)}
  .back{color:var(--accent);text-decoration:none;font-weight:600;font-size:14px}
  .back:hover{text-decoration:underline}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:52px 34px;text-align:center}
  h1{margin:0 0 10px;font-size:32px;line-height:1.2}
  p{margin:0 auto 18px;color:var(--ink-2);max-width:560px}
  .cta{display:inline-block;margin-top:6px;background:var(--grad);color:#fff;text-decoration:none;font-weight:600;font-size:15px;padding:11px 22px;border-radius:999px;box-shadow:var(--shadow)}
  footer{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;color:var(--muted);font-size:14px;margin-top:34px}
  footer a{color:var(--muted);text-decoration:none}
  footer a:hover{color:var(--accent)}
  .sep{opacity:.5}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="brand" href="/"><span class="dot"></span>KOLKLI</a>
    <a class="back" href="/">← חזרה לאתר</a>
  </div>

  <div class="card">
    <h1>הבלוג בדרך 🚀</h1>
    <p>
      אנחנו מכינים מדריכים, טיפים ועדכונים על עבודה חכמה עם קבצים מול לקוחות —
      קבלה, שליחה, אישור וניהול תהליכים. חזרו בקרוב.
    </p>
    <p>בינתיים אפשר להתחיל לעבוד — בחינם, בלי כרטיס אשראי.</p>
    <a class="cta" href="/auth?mode=signup">יצירת חשבון חינם</a>
  </div>

  <footer>
    <span>© KOLKLI</span>
    <span class="sep">·</span>
    <a href="/about">אודות</a>
    <span class="sep">·</span>
    <a href="/pricing/">מסלולים</a>
    <span class="sep">·</span>
    <a href="/">דף הבית</a>
  </footer>
</div>
</body>
</html>
