<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOLKLI — תמונה ל-Base64</title>
<meta name="description" content="Free image to Base64 encoder — drag in a PNG, JPG, SVG or GIF and instantly get a copy-ready data URI, CSS background-image and HTML img tag. Fast, simple and professional-quality.">
<style>
  :root {
    --bg:#eef0f6; --panel:#ffffff; --panel-2:#f5f6fa; --line:#e5e8f0; --line-2:#eef0f6;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#7c3aed; --accent-dim:#6a2fe0; --accent-ink:#ffffff; --accent-soft:#efe9fe;
    --success:#22b04b; --success-dim:#1c9a41; --success-soft:#e6f6ec;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --danger:#e5484d; --danger-soft:#fdecec;
    --warm-soft:#fff5da; --warm-line:#f2d98a;
    --ok:#22b04b; --warn:#c88a04; --err:#e5484d;
    --grad:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn-glow:rgba(59,111,246,0.38);
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-lg:0 2px 6px rgba(20,24,44,0.05), 0 20px 50px rgba(20,24,44,0.10);
    --shadow-sm:0 1px 2px rgba(20,24,44,0.05);
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --sans:'Space Grotesk',system-ui,'Segoe UI','Heebo',sans-serif;
  }
  html[data-theme="dark"] {
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a303c; --line-2:#232833;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --accent:#a06bff; --accent-dim:#7c3aed; --accent-ink:#ffffff; --accent-soft:#241a3a;
    --success:#37c26a; --success-dim:#2fae5e; --success-soft:#132a1c;
    --info:#5b95f8; --info-dim:#4f8ef7; --info-soft:#182338;
    --danger:#ff6b6b; --danger-soft:#2a1719;
    --warm-soft:#2c2718; --warm-line:#5a4d24;
    --ok:#4ec98a; --warn:#e8b84b; --err:#ff6b6b;
    --grad:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn-glow:rgba(77,123,255,0.45);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,0.45), 0 24px 60px rgba(0,0,0,0.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;}
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:var(--grad);z-index:100;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--sans);}
  .wrap{width:100%;max-width:none;margin:0 auto;padding:26px 20px 64px;}

  /* page intro */
  .pagehead{margin:4px 0 22px;}
  .pagehead h1{font-size:clamp(23px,3vw,32px);font-weight:700;letter-spacing:-0.02em;margin:0 0 8px;}
  .pagehead .kick{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);
    padding:4px 11px;border-radius:999px;margin-bottom:12px;}
  .pagehead p{font-size:14.5px;color:var(--muted);margin:0;max-width:70ch;}

  /* reused helpers (from color-convert.html) */
  input[type=color]{-webkit-appearance:none;appearance:none;width:56px;height:44px;padding:0;border:1px solid var(--line);
    border-radius:12px;background:var(--panel-2);cursor:pointer;flex-shrink:0;}
  input[type=color]::-webkit-color-swatch-wrapper{padding:4px;}
  input[type=color]::-webkit-color-swatch{border:none;border-radius:8px;}
  .gbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--ink-2);font-size:13px;font-weight:600;padding:10px 12px;border-radius:11px;
    cursor:pointer;transition:all .12s;}
  .gbtn:hover{border-color:var(--accent);color:var(--accent-dim);background:var(--accent-soft);}
  .gbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .gbtn.hidden{display:none;}
  .copybtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);
    color:var(--muted);font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:9px;cursor:pointer;transition:all .12s;}
  .copybtn:hover{border-color:var(--accent);color:var(--accent-dim);background:var(--accent-soft);}
  .copybtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .fstr{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ink);background:var(--panel-2);
    border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;margin-bottom:12px;overflow-x:auto;white-space:nowrap;
    direction:ltr;text-align:start;}

  /* ---- image → base64 tool ---- */
  .tool{display:grid;grid-template-columns:1fr 350px;gap:18px;align-items:start;}
  @media (max-width:820px){ .tool{grid-template-columns:1fr;} }
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);}

  .dropcard{padding:18px;}
  .drop{border:2px dashed var(--line);border-radius:14px;background:var(--panel-2);min-height:210px;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:26px;cursor:pointer;
    transition:border-color .15s,background .15s;}
  .drop.drag{border-color:var(--accent);background:var(--accent-soft);}
  .drop-empty{display:flex;flex-direction:column;align-items:center;gap:11px;}
  .drop-empty svg.imgico{width:46px;height:46px;color:var(--faint);stroke:currentColor;fill:none;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round;}
  .drop-empty .dtitle{font-size:15px;font-weight:700;color:var(--ink-2);}
  .drop-empty .dsub{font-size:12.5px;color:var(--muted);max-width:36ch;line-height:1.5;}
  .drop-empty .gbtn{flex:none;margin-top:2px;padding:9px 16px;}

  .preview{display:flex;gap:16px;align-items:center;width:100%;text-align:start;}
  .thumb{width:100px;height:100px;border-radius:12px;flex-shrink:0;object-fit:contain;
    background-image:
      linear-gradient(45deg,rgba(128,128,128,.14) 25%,transparent 25%,transparent 75%,rgba(128,128,128,.14) 75%),
      linear-gradient(45deg,rgba(128,128,128,.14) 25%,transparent 25%,transparent 75%,rgba(128,128,128,.14) 75%);
    background-size:16px 16px;background-position:0 0,8px 8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);}
  .pinfo{min-width:0;}
  .pname{font-size:14px;font-weight:700;color:var(--ink);word-break:break-all;direction:ltr;unicode-bidi:isolate;text-align:start;}
  .psub{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:5px;direction:ltr;unicode-bidi:isolate;}

  .outs{margin-top:18px;}
  .outblock{margin-bottom:14px;}
  .outblock:last-child{margin-bottom:0;}
  .outblock .fstr{margin-bottom:0;}
  .fstr.out{max-height:190px;overflow-y:auto;}
  .fstr.wrap{white-space:pre-wrap;word-break:break-all;overflow-x:hidden;}

  /* info + options column */
  .infocard{padding:18px;position:sticky;top:16px;}
  .statrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-2);}
  .statrow:first-child{padding-top:0;}
  .statrow:last-of-type{border-bottom:0;}
  .statrow .k{font-size:12.5px;font-weight:600;color:var(--muted);flex-shrink:0;}
  .statrow .v{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink);direction:ltr;unicode-bidi:isolate;
    text-align:end;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .statrow .v.hl{color:var(--accent-dim);}

  .optrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
  .optrow > label{font-size:13px;font-weight:600;color:var(--ink-2);}
  .btnrow2{display:flex;gap:9px;}

  /* generic helpers kept from box-shadow.html */
  .switch{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0;direction:ltr;}
  .switch input{position:absolute;opacity:0;width:0;height:0;}
  .switch .track{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .15s;cursor:pointer;}
  .switch .track::before{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
    background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s;}
  .switch input:checked + .track{background:var(--accent);}
  .switch input:checked + .track::before{transform:translateX(20px);}

  .divider{height:1px;background:var(--line);margin:16px 0;border:0;}
  .fhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
  .ftitle{font-size:13px;font-weight:800;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;}

  .note{display:flex;align-items:flex-start;gap:9px;margin-top:18px;padding:12px 14px;border-radius:12px;
    background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);
    font-size:12px;color:var(--ink-2);line-height:1.55;}
  .note svg{width:16px;height:16px;color:var(--accent-dim);flex-shrink:0;margin-top:1px;
    stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  footer{margin-top:34px;text-align:center;color:var(--faint);font-size:12px;font-family:var(--mono);}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:11px 18px;border-radius:999px;
    box-shadow:var(--shadow-lg);transition:opacity .2s,transform .2s;z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
<link rel="stylesheet" href="./header.css">
</head>
<body>
<div id="site-header"></div>
<script src="./header.js"></script>
<div class="wrap">

  <div class="pagehead">
    <span class="kick" data-i18n="kick"></span>
    <h1 data-i18n="pageTitle"></h1>
    <p data-i18n="pageSub"></p>
  </div>

  <div class="tool">
    <!-- drop zone + preview + outputs -->
    <div class="card dropcard">
      <div class="drop" id="drop">
        <input type="file" id="fileIn" accept="image/*" hidden>
        <div class="drop-empty" id="dropEmpty">
          <svg class="imgico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.5-3.5a2 2 0 0 0-2.8 0L6 21"/></svg>
          <div class="dtitle" data-i18n="emptyTitle"></div>
          <div class="dsub" data-i18n="emptySub"></div>
          <button class="gbtn" id="pickBtn" type="button">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5-5 5 5"/><path d="M12 5v12"/></svg>
            <span data-i18n="choose"></span>
          </button>
        </div>
        <div class="preview" id="preview" hidden>
          <img class="thumb" id="thumb" alt="">
          <div class="pinfo">
            <div class="pname" id="pName"></div>
            <div class="psub" id="pSub"></div>
          </div>
        </div>
      </div>

      <div class="outs" id="outs" hidden>
        <div class="outblock">
          <div class="fhead"><span class="ftitle" data-i18n="rawTitle"></span>
            <button class="copybtn" data-copy="rawOut" type="button"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span data-i18n="copy"></span></button>
          </div>
          <div class="fstr out" id="rawOut"></div>
        </div>

        <div class="outblock">
          <div class="fhead"><span class="ftitle">CSS</span>
            <button class="copybtn" data-copy="cssOut" type="button"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span data-i18n="copy"></span></button>
          </div>
          <div class="fstr out" id="cssOut"></div>
        </div>

        <div class="outblock">
          <div class="fhead"><span class="ftitle">HTML</span>
            <button class="copybtn" data-copy="htmlOut" type="button"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span data-i18n="copy"></span></button>
          </div>
          <div class="fstr out" id="htmlOut"></div>
        </div>
      </div>
    </div>

    <!-- info + options -->
    <div class="card infocard">
      <div class="statrow"><span class="k" data-i18n="fName"></span><span class="v" id="sName">—</span></div>
      <div class="statrow"><span class="k" data-i18n="fType"></span><span class="v" id="sType">—</span></div>
      <div class="statrow"><span class="k" data-i18n="fDims"></span><span class="v" id="sDims">—</span></div>
      <div class="statrow"><span class="k" data-i18n="fOrig"></span><span class="v" id="sOrig">—</span></div>
      <div class="statrow"><span class="k" data-i18n="fEnc"></span><span class="v" id="sEnc">—</span></div>
      <div class="statrow"><span class="k" data-i18n="fOver"></span><span class="v hl" id="sOver">—</span></div>

      <hr class="divider">

      <div class="optrow">
        <label for="wrapChk" data-i18n="wrapLabel"></label>
        <label class="switch"><input type="checkbox" id="wrapChk"><span class="track"></span></label>
      </div>

      <div class="btnrow2">
        <button class="gbtn" id="chooseBtn" type="button">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5-5 5 5"/><path d="M12 5v12"/></svg>
          <span data-i18n="choose"></span>
        </button>
        <button class="gbtn hidden" id="clearBtn" type="button">
          <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          <span data-i18n="clear"></span>
        </button>
      </div>
    </div>
  </div>

  <div class="note">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <span data-i18n="note"></span>
  </div>

  <footer data-i18n="foot"></footer>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const el = id => document.getElementById(id);

  const I18N = {
    he:{ dir:'rtl',
      kick:'תמונה ל-Base64',
      pageTitle:'ממיר תמונה ל-Base64',
      pageSub:'גררו תמונה או בחרו קובץ, וקבלו מייד data URI מוכן להעתקה — כולל גרסת CSS ו-HTML. מהיר, פשוט ובאיכות מקצועית.',
      copy:'העתקה', copiedMsg:'הועתק ✓',
      emptyTitle:'גררו לכאן תמונה', emptySub:'PNG · JPG · SVG · GIF · WebP — או בחרו קובץ מהמחשב',
      choose:'בחירת קובץ', clear:'ניקוי',
      rawTitle:'Data URI', wrapLabel:'גלישת שורות',
      fName:'שם קובץ', fType:'סוג', fDims:'מידות', fOrig:'מקורי', fEnc:'מקודד', fOver:'תוספת',
      errType:'נא לבחור קובץ תמונה', errRead:'קריאת הקובץ נכשלה',
      note:'קידוד Base64 גדול בכ-33% מהקובץ המקורי. הוא מתאים בעיקר לאייקונים קטנים ול-SVG מוטבע — כדי לחסוך בקשת רשת ולהטמיע את התמונה ישירות בקוד. מהיר, פשוט ובאיכות מקצועית.',
      foot:'KOLKLI · תמונה ל-Base64 · מהיר, פשוט ובאיכות מקצועית' },
    en:{ dir:'ltr',
      kick:'Image to Base64',
      pageTitle:'Image to Base64 Encoder',
      pageSub:'Drag in an image or choose a file and instantly get a copy-ready data URI — plus CSS and HTML variants. Fast, simple and professional-quality.',
      copy:'Copy', copiedMsg:'Copied ✓',
      emptyTitle:'Drop an image here', emptySub:'PNG · JPG · SVG · GIF · WebP — or choose a file from your computer',
      choose:'Choose file', clear:'Clear',
      rawTitle:'Data URI', wrapLabel:'Wrap long lines',
      fName:'File name', fType:'Type', fDims:'Dimensions', fOrig:'Original', fEnc:'Encoded', fOver:'Overhead',
      errType:'Please choose an image file', errRead:'Could not read the file',
      note:'Base64 encoding is about 33% larger than the original file. It is best for tiny icons and inline SVGs — to save an HTTP request and embed the image right in your code. Fast, simple and professional-quality.',
      foot:'KOLKLI · Image to Base64 · Fast, simple and professional quality' },
    ru:{ dir:'ltr',
      kick:'Изображение в Base64',
      pageTitle:'Кодировщик изображения в Base64',
      pageSub:'Перетащите изображение или выберите файл и мгновенно получите готовый data URI для копирования — вместе с вариантами для CSS и HTML. Быстро, просто и профессионального качества.',
      copy:'Копировать', copiedMsg:'Скопировано ✓',
      emptyTitle:'Перетащите изображение сюда', emptySub:'PNG · JPG · SVG · GIF · WebP — или выберите файл на компьютере',
      choose:'Выбрать файл', clear:'Очистить',
      rawTitle:'Data URI', wrapLabel:'Перенос строк',
      fName:'Имя файла', fType:'Тип', fDims:'Размеры', fOrig:'Оригинал', fEnc:'В Base64', fOver:'Прирост',
      errType:'Выберите файл изображения', errRead:'Не удалось прочитать файл',
      note:'Кодирование в Base64 примерно на 33% больше исходного файла. Оно лучше всего подходит для маленьких иконок и встроенных SVG — чтобы сэкономить сетевой запрос и встроить изображение прямо в код. Быстро, просто и профессионального качества.',
      foot:'KOLKLI · Изображение в Base64 · Быстро, просто и профессионального качества' }
  };

  let lang='he', t=I18N.he;
  let wrapOn=false;
  const state = { name:'', mime:'', origBytes:0, dataUri:'', w:0, h:0 };

  // ---- helpers ----
  function fmtSize(bytes){
    if(bytes>=1048576) return (bytes/1048576).toFixed(2)+' MB';
    if(bytes>=1024) return (bytes/1024).toFixed(1)+' KB';
    return bytes+' B';
  }
  function encBytes(){ const b64=(state.dataUri.split(',')[1]||''); return b64.length; }

  // ---- render ----
  function outputs(){
    const uri=state.dataUri;
    el('rawOut').textContent=uri;
    el('cssOut').textContent='background-image: url("'+uri+'");';
    el('htmlOut').textContent='<img src="'+uri+'" alt="">';
  }
  function applyWrap(){
    document.querySelectorAll('.fstr.out').forEach(e=>e.classList.toggle('wrap', wrapOn));
  }
  function renderPreview(){
    el('pName').textContent=state.name;
    el('pSub').textContent=(state.w?state.w+' × '+state.h+' px · ':'')+fmtSize(state.origBytes);
  }
  function renderStats(){
    const has=!!state.dataUri, dash='—';
    el('sName').textContent = has ? state.name : dash;
    el('sType').textContent = has ? state.mime : dash;
    el('sDims').textContent = has && state.w ? state.w+' × '+state.h+' px' : dash;
    el('sOrig').textContent = has ? fmtSize(state.origBytes) : dash;
    el('sEnc').textContent  = has ? fmtSize(encBytes()) : dash;
    el('sOver').textContent = has && state.origBytes ? '+'+Math.round((encBytes()/state.origBytes-1)*100)+'%' : dash;
  }

  function showLoaded(){
    el('dropEmpty').hidden=true;
    el('preview').hidden=false;
    el('outs').hidden=false;
    el('clearBtn').classList.remove('hidden');
  }
  function clearFile(){
    state.name=''; state.mime=''; state.origBytes=0; state.dataUri=''; state.w=0; state.h=0;
    el('fileIn').value='';
    el('thumb').removeAttribute('src');
    el('preview').hidden=true;
    el('dropEmpty').hidden=false;
    el('outs').hidden=true;
    el('clearBtn').classList.add('hidden');
    renderStats();
  }

  function loadFile(f){
    if(!f){ return; }
    if(!/^image\//.test(f.type||'')){ toast(t.errType); return; }
    const reader=new FileReader();
    reader.onload=function(){
      state.name=f.name; state.mime=f.type||'image/*'; state.origBytes=f.size; state.dataUri=reader.result; state.w=0; state.h=0;
      el('thumb').src=state.dataUri;
      showLoaded(); outputs(); applyWrap(); renderPreview(); renderStats();
      const img=new Image();
      img.onload=function(){ state.w=img.naturalWidth; state.h=img.naturalHeight; renderPreview(); renderStats(); };
      img.src=state.dataUri;
    };
    reader.onerror=function(){ toast(t.errRead); };
    reader.readAsDataURL(f);
  }

  // ---- toast + copy ----
  function toast(msg){ const e=el('toast'); e.textContent=msg; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),1700); }
  function copy(text){
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).catch(fallbackCopy.bind(null,text)); }
    else fallbackCopy(text);
    toast(t.copiedMsg);
  }
  function fallbackCopy(text){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(_){} document.body.removeChild(ta);
  }

  // ---- events ----
  el('fileIn').addEventListener('change',e=>{ const f=e.target.files && e.target.files[0]; if(f) loadFile(f); });
  el('drop').addEventListener('click',e=>{ if(e.target.closest('.copybtn')) return; el('fileIn').click(); });
  el('pickBtn').addEventListener('click',e=>{ e.stopPropagation(); el('fileIn').click(); });
  el('chooseBtn').addEventListener('click',()=>el('fileIn').click());
  el('clearBtn').addEventListener('click',clearFile);

  const drop=el('drop');
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.add('drag'); }));
  ['dragleave','dragend'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.remove('drag'); }));
  drop.addEventListener('drop',e=>{ e.preventDefault(); drop.classList.remove('drag'); const f=e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if(f) loadFile(f); });

  el('wrapChk').addEventListener('change',()=>{ wrapOn=el('wrapChk').checked; applyWrap(); });

  document.querySelectorAll('.copybtn').forEach(b=>{
    b.addEventListener('click',()=>{ const target=el(b.getAttribute('data-copy')); if(target) copy(target.textContent); });
  });

  // ---- i18n + theme ----
  function applyLang(l){
    if(!I18N[l]) l='en';
    lang=l; t=I18N[l];
    document.documentElement.lang=l; document.documentElement.dir=t.dir;
    document.querySelectorAll('[data-i18n]').forEach(n=>{ const k=n.getAttribute('data-i18n'); if(typeof t[k]==='string') n.textContent=t[k]; });
    if(!state.dataUri) renderStats();
    try{ localStorage.setItem('ac_lang', l); }catch(_){}
  }
  function ls(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
  function detectLang(){
    const chosen=ls('ac_lang'); if(chosen) return chosen;
    const cc=ls('ac_country'); if(cc) return cc==='IL'?'he':'en';
    let tz=''; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(_){}
    const navHe=(navigator.language||'').toLowerCase().indexOf('he')===0;
    return (tz==='Asia/Jerusalem'||navHe)?'he':'en';
  }
  function applyTheme(th){
    const dark=(th==='dark');
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
    const ti=el('themeIco'); if(ti) ti.textContent = dark?'☀️':'🌙';
    try{ localStorage.setItem('theme', dark?'dark':'light'); }catch(_){}
  }
  window.__setLang=applyLang;
  const tb=el('themeToggle'); if(tb) tb.addEventListener('click',()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));

  // ---- init ----
  applyTheme(ls('theme')||'light');
  applyLang(detectLang());
  renderStats();
})();
</script>
</body>
</html>
