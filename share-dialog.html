<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOLKLI — חלון שיתוף</title>
<meta name="description" content="Share dialog — share a KOLKLI link with people, copy the URL, or send it to Facebook, WhatsApp, X and Discord.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#eef0f6; --panel:#ffffff; --panel-2:#f5f6fa; --line:#e5e8f0; --line-2:#eef0f6;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#7c3aed; --accent-dim:#6a2fe0; --accent-ink:#ffffff; --accent-soft:#efe9fe;
    --success:#22b04b; --success-dim:#1c9a41; --success-soft:#e6f6ec;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --danger:#e5484d; --danger-soft:#fdecec;
    --grad:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-soft:linear-gradient(120deg,#efe9fe,#e6f0ff);
    --grad-shadow:rgba(93,79,240,0.30);
    --grad-btn:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn-glow:rgba(59,111,246,0.38);
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-lg:0 2px 6px rgba(20,24,44,0.05), 0 24px 60px rgba(20,24,44,0.14);
    --shadow-sm:0 1px 2px rgba(20,24,44,0.05);
    --sans:'Heebo','Space Grotesk',system-ui,'Segoe UI',sans-serif;
    --mono:'Space Grotesk',ui-monospace,'SFMono-Regular',Menlo,monospace;
  }
  html[data-theme="dark"] {
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a303c; --line-2:#232833;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --accent:#a06bff; --accent-dim:#7c3aed; --accent-ink:#ffffff; --accent-soft:#241a3a;
    --success:#37c26a; --success-dim:#2fae5e; --success-soft:#132a1c;
    --info:#5b95f8; --info-dim:#4f8ef7; --info-soft:#182338;
    --danger:#ff6b6b; --danger-soft:#2a1719;
    --grad:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-soft:linear-gradient(120deg,#1c1633,#11242a);
    --grad-shadow:rgba(77,123,255,0.42);
    --grad-btn:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn-glow:rgba(77,123,255,0.45);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,0.45), 0 28px 70px rgba(0,0,0,0.6);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;min-height:100vh;padding:40px 18px;}
  body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(58% 40% at 15% 4%,rgba(124,58,237,0.10),transparent 60%),
      radial-gradient(52% 40% at 88% 2%,rgba(34,211,160,0.07),transparent 60%),
      radial-gradient(60% 50% at 50% 100%,rgba(59,111,246,0.06),transparent 62%);}
  button{font-family:inherit;}
  svg{display:block;}

  /* page intro */
  .intro{text-align:center;max-width:52ch;}
  .intro .kick{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);
    padding:5px 13px;border-radius:999px;margin-bottom:12px;}
  .intro h1{font-size:clamp(22px,3.4vw,30px);font-weight:800;letter-spacing:-0.02em;margin:0 0 8px;}
  .intro p{font-size:14px;color:var(--muted);margin:0;}

  /* demo open button */
  .opener{display:inline-flex;align-items:center;gap:10px;color:#fff;border:none;cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:700;font-size:15.5px;padding:14px 30px;border-radius:999px;text-shadow:0 1px 2px rgba(0,0,0,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 22px var(--grad-btn-glow);transition:filter .14s,transform .08s;}
  .opener:hover{filter:brightness(1.06);} .opener:active{transform:translateY(1px);}
  .opener svg{width:19px;height:19px;}

  /* ====================== OVERLAY ====================== */
  .overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;
    background:color-mix(in srgb,var(--ink) 42%,transparent);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
    opacity:0;visibility:hidden;transition:opacity .24s ease,visibility .24s ease;}
  .overlay.open{opacity:1;visibility:visible;}

  .sheet{width:100%;max-width:500px;background:var(--panel);border:1px solid var(--line);border-radius:26px;
    box-shadow:var(--shadow-lg);padding:26px 26px 28px;position:relative;
    transform:translateY(14px) scale(.97);opacity:.4;transition:transform .3s cubic-bezier(.22,1,.36,1),opacity .3s ease;}
  .overlay.open .sheet{transform:none;opacity:1;}

  /* --- top row: search + close --- */
  .sheet-top{display:flex;align-items:center;gap:12px;}
  .searchbox{flex:1;position:relative;}
  .searchbox .mag{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint);pointer-events:none;}
  .searchbox input{width:100%;height:46px;border:1px solid var(--line);background:var(--panel-2);border-radius:13px;
    padding-inline-start:42px;padding-inline-end:14px;font-size:15px;color:var(--ink);font-family:inherit;
    transition:border-color .12s,box-shadow .12s,background .12s;}
  .searchbox input::placeholder{color:var(--faint);}
  .searchbox input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--panel);}
  .closebtn{width:42px;height:42px;flex-shrink:0;border:none;border-radius:13px;background:transparent;color:var(--muted);
    display:grid;place-items:center;cursor:pointer;transition:background .12s,color .12s,transform .08s;}
  .closebtn:hover{background:var(--panel-2);color:var(--ink);}
  .closebtn:active{transform:scale(.94);}
  .closebtn svg{width:22px;height:22px;}

  .rule{height:1px;background:var(--line-2);margin:22px -26px 0;}

  /* --- section heading --- */
  .sec-h{font-size:17px;font-weight:800;letter-spacing:-.01em;margin:22px 0 15px;color:var(--ink);}

  /* --- people --- */
  .people{display:flex;gap:14px;flex-wrap:wrap;}
  .person{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:none;padding:0;cursor:pointer;
    font-family:inherit;width:56px;}
  .pav{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:19px;
    box-shadow:var(--shadow-sm);position:relative;transition:transform .14s,box-shadow .14s;
    outline:2px solid transparent;outline-offset:2px;}
  .person:hover .pav{transform:translateY(-2px);box-shadow:var(--shadow);}
  .person[aria-pressed="true"] .pav{outline-color:var(--accent);}
  .pav .chk{position:absolute;inset-block-end:-2px;inset-inline-end:-2px;width:20px;height:20px;border-radius:50%;
    background:var(--accent);border:2px solid var(--panel);display:grid;place-items:center;color:#fff;
    transform:scale(0);transition:transform .16s cubic-bezier(.22,1.4,.4,1);}
  .person[aria-pressed="true"] .pav .chk{transform:scale(1);}
  .pav .chk svg{width:11px;height:11px;}
  .person .pname{font-size:12px;color:var(--muted);max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .person[aria-pressed="true"] .pname{color:var(--accent-dim);font-weight:600;}
  html[data-theme="dark"] .person[aria-pressed="true"] .pname{color:var(--accent);}
  .g1{background:linear-gradient(135deg,#a78bfa,#6366f1);}
  .g2{background:linear-gradient(135deg,#5eead4,#3b82f6);}
  .g3{background:linear-gradient(135deg,#fca5a5,#f43f5e);}
  .g4{background:linear-gradient(135deg,#fdba74,#f97316);}
  .g5{background:linear-gradient(135deg,#7dd3fc,#2563eb);}
  .g6{background:linear-gradient(135deg,#86efac,#16a34a);}
  .people .empty{font-size:13.5px;color:var(--faint);padding:8px 2px;}

  /* --- link field --- */
  .linkfield{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel-2);border-radius:15px;
    padding:8px;padding-inline-start:16px;transition:border-color .12s,box-shadow .12s;}
  .linkfield:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .linkfield input{flex:1;min-width:0;border:none;background:transparent;font-size:13.5px;color:var(--ink-2);
    font-family:var(--mono);direction:ltr;text-align:left;}
  .linkfield input:focus{outline:none;}
  .copybtn{flex-shrink:0;display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 22px;border:none;border-radius:11px;
    color:#fff;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;
    background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--grad-btn);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 16px var(--grad-btn-glow);transition:filter .12s,transform .08s,background .2s;}
  .copybtn:hover{filter:brightness(1.06);} .copybtn:active{transform:translateY(1px);}
  .copybtn svg{width:16px;height:16px;}
  .copybtn.done{background:var(--success);box-shadow:none;}

  /* --- share links --- */
  .share-links{display:flex;gap:6px;justify-content:space-between;}
  .slink{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:9px;background:none;border:none;padding:4px 0;
    cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:600;font-family:inherit;transition:color .12s;}
  .slink:hover{color:var(--ink);}
  .slink .ic{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);
    background:var(--panel-2);color:var(--ink-2);transition:transform .14s,box-shadow .14s,border-color .14s;}
  .slink:hover .ic{transform:translateY(-3px);box-shadow:var(--shadow);border-color:transparent;}
  .slink .ic svg{width:26px;height:26px;}
  .slink .ic.brand{border-color:transparent;color:#fff;}
  .ic.fb{background:#1877f2;}
  .ic.wa{background:#25d366;}
  .ic.x{background:#000;}
  html[data-theme="dark"] .ic.x{background:#fff;color:#000;}
  .ic.dc{background:#5865f2;}

  /* theme toggle + toast */
  .themebtn{position:fixed;inset-block-start:16px;inset-inline-end:16px;width:40px;height:40px;border-radius:12px;
    background:var(--panel);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;box-shadow:var(--shadow-sm);
    display:flex;align-items:center;justify-content:center;z-index:60;transition:border-color .12s;}
  .themebtn:hover{border-color:var(--accent);}
  .themebtn svg{width:19px;height:19px;}
  .toast{position:fixed;inset-block-end:24px;inset-inline-start:50%;transform:translateX(50%) translateY(20px);opacity:0;pointer-events:none;
    background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:11px 20px;border-radius:999px;
    box-shadow:var(--shadow-lg);transition:opacity .2s,transform .2s;z-index:200;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(50%) translateY(0);}

  @media (max-width:440px){
    .sheet{padding:22px 18px 24px;border-radius:22px;}
    .rule{margin-inline:-18px;}
    .slink{font-size:11px;}
    .slink .ic{width:52px;height:52px;}
  }
</style>
</head>
<body>

<button class="themebtn" id="themeBtn" aria-label="החלף מצב תצוגה" title="מצב כהה / בהיר">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>

<div class="intro">
  <span class="kick">חלון שיתוף</span>
  <h1>שיתוף קישור</h1>
  <p>שולחים קישור לאנשים, מעתיקים כתובת, או מפיצים לרשתות — הכל מחלון אחד.</p>
</div>

<button class="opener" id="openBtn" type="button">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
  פתח חלון שיתוף
</button>

<!-- ====================== THE DIALOG ====================== -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="shareWith">
  <div class="sheet" id="sheet">

    <!-- search + close -->
    <div class="sheet-top">
      <div class="searchbox">
        <svg class="mag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="search" placeholder="חיפוש איש קשר…" autocomplete="off" aria-label="חיפוש אנשים">
      </div>
      <button class="closebtn" id="closeBtn" type="button" aria-label="סגירה">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="rule"></div>

    <!-- share with people -->
    <h3 class="sec-h" id="shareWith">שיתוף עם</h3>
    <div class="people" id="people">
      <button class="person" type="button" aria-pressed="false" data-name="דנה כהן">
        <span class="pav g1">דכ<span class="chk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></span>
        <span class="pname">דנה</span>
      </button>
      <button class="person" type="button" aria-pressed="false" data-name="יוסי לוי">
        <span class="pav g2">יל<span class="chk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></span>
        <span class="pname">יוסי</span>
      </button>
      <button class="person" type="button" aria-pressed="false" data-name="מאיה בר">
        <span class="pav g3">מב<span class="chk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></span>
        <span class="pname">מאיה</span>
      </button>
      <button class="person" type="button" aria-pressed="false" data-name="עומר אדרי">
        <span class="pav g4">עא<span class="chk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></span>
        <span class="pname">עומר</span>
      </button>
      <button class="person" type="button" aria-pressed="false" data-name="נועה שגב">
        <span class="pav g5">נש<span class="chk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></span>
        <span class="pname">נועה</span>
      </button>
      <button class="person" type="button" aria-pressed="false" data-name="איתי רון">
        <span class="pav g6">אר<span class="chk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></span>
        <span class="pname">איתי</span>
      </button>
    </div>

    <!-- copy link -->
    <div class="linkfield" style="margin-top:22px">
      <input type="text" id="linkInput" value="https://kolkli.com/s/judj4ueFyriPj20?si=WxUypJ" readonly aria-label="קישור לשיתוף">
      <button class="copybtn" id="copyBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span>העתק</span>
      </button>
    </div>

    <div class="rule"></div>

    <!-- share links -->
    <h3 class="sec-h">קישורי שיתוף</h3>
    <div class="share-links">
      <button class="slink" type="button" data-share="embed">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 6-6 6 6 6M16 6l6 6-6 6"/></svg></span>
        הטמעה
      </button>
      <button class="slink" type="button" data-share="facebook">
        <span class="ic brand fb"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07c0 6.02 4.39 11.01 10.13 11.93v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.97h-1.5c-1.49 0-1.96.93-1.96 1.87v2.25h3.33l-.53 3.49h-2.8V24C19.61 23.07 24 18.09 24 12.07"/></svg></span>
        פייסבוק
      </button>
      <button class="slink" type="button" data-share="whatsapp">
        <span class="ic brand wa"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.08-.3-.15-1.26-.47-2.39-1.48-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.6.14-.14.3-.35.44-.53.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.06 2.88 1.21 3.07.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.62.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2-1.41.25-.7.25-1.29.17-1.42-.07-.12-.27-.2-.57-.34M12.05 21.79h-.01a9.9 9.9 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37A9.86 9.86 0 0 1 2.1 11.9C2.1 6.45 6.54 2.01 12 2.01c2.64 0 5.12 1.03 6.99 2.9a9.83 9.83 0 0 1 2.89 6.99c0 5.45-4.44 9.89-9.83 9.89M20.52 3.45A11.82 11.82 0 0 0 12.05 0C5.46 0 .1 5.36.1 11.95c0 2.1.55 4.14 1.6 5.95L0 24l6.34-1.66a11.93 11.93 0 0 0 5.7 1.45h.01c6.58 0 11.94-5.36 11.95-11.95a11.86 11.86 0 0 0-3.48-8.4"/></svg></span>
        וואטסאפ
      </button>
      <button class="slink" type="button" data-share="copy">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg></span>
        העתק קישור
      </button>
      <button class="slink" type="button" data-share="x">
        <span class="ic brand x"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 1.15h3.68l-8.04 9.19L24 22.85h-7.41l-5.8-7.58-6.64 7.58H.46l8.6-9.83L0 1.15h7.6l5.24 6.93zm-1.29 19.5h2.04L6.49 3.24H4.3z"/></svg></span>
        אקס
      </button>
      <button class="slink" type="button" data-share="discord">
        <span class="ic brand dc"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.32 4.37A19.8 19.8 0 0 0 15.42 3c-.2.36-.44.85-.6 1.23a18.3 18.3 0 0 0-5.64 0A12.4 12.4 0 0 0 8.57 3a19.7 19.7 0 0 0-4.9 1.37C.55 8.98-.3 13.48.12 17.9a19.9 19.9 0 0 0 6.07 3.08c.49-.67.93-1.38 1.3-2.13-.71-.27-1.4-.6-2.04-.99.17-.13.34-.26.5-.4a14.2 14.2 0 0 0 12.1 0c.17.14.34.27.5.4-.65.39-1.34.72-2.05.99.38.75.82 1.46 1.3 2.13a19.8 19.8 0 0 0 6.07-3.08c.5-5.12-.84-9.58-3.55-13.53M8.02 15.19c-1.18 0-2.15-1.08-2.15-2.4 0-1.33.95-2.42 2.15-2.42 1.2 0 2.17 1.09 2.15 2.42 0 1.32-.95 2.4-2.15 2.4m7.96 0c-1.18 0-2.15-1.08-2.15-2.4 0-1.33.95-2.42 2.15-2.42 1.2 0 2.17 1.09 2.15 2.42 0 1.32-.95 2.4-2.15 2.4"/></svg></span>
        דיסקורד
      </button>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));

  /* ---- theme ---- */
  const root = document.documentElement, themeBtn = $('#themeBtn');
  try { if (localStorage.getItem('kolkli_theme') === 'dark') root.setAttribute('data-theme','dark'); } catch(_){}
  themeBtn.addEventListener('click', () => {
    const dark = root.getAttribute('data-theme') === 'dark';
    if (dark) root.removeAttribute('data-theme'); else root.setAttribute('data-theme','dark');
    try { localStorage.setItem('kolkli_theme', dark ? 'light' : 'dark'); } catch(_){}
  });

  /* ---- toast ---- */
  let toastT;
  const toast = $('#toast');
  function showToast(msg){
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => toast.classList.remove('show'), 2000);
  }
  async function copy(text){
    try { await navigator.clipboard.writeText(text); return true; }
    catch(_){
      try { const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); return true; }
      catch(e){ return false; }
    }
  }

  const link = () => $('#linkInput').value.trim();

  /* ---- open / close ---- */
  const overlay = $('#overlay'), search = $('#search');
  let lastFocus = null;
  function openDialog(){
    lastFocus = document.activeElement;
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    setTimeout(() => search.focus(), 60);
  }
  function closeDialog(){
    overlay.classList.remove('open');
    document.body.style.overflow = '';
    if (lastFocus) lastFocus.focus();
  }
  $('#openBtn').addEventListener('click', openDialog);
  $('#closeBtn').addEventListener('click', closeDialog);
  overlay.addEventListener('mousedown', e => { if (e.target === overlay) closeDialog(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && overlay.classList.contains('open')) closeDialog(); });

  /* ---- search filter ---- */
  const people = $('#people');
  const cards = $$('#people .person');
  search.addEventListener('input', () => {
    const q = search.value.trim().toLowerCase();
    let shown = 0;
    cards.forEach(c => {
      const hit = c.dataset.name.toLowerCase().includes(q);
      c.style.display = hit ? '' : 'none';
      if (hit) shown++;
    });
    let empty = people.querySelector('.empty');
    if (!shown){
      if (!empty){ empty = document.createElement('div'); empty.className = 'empty'; empty.textContent = 'לא נמצאו אנשי קשר'; people.appendChild(empty); }
    } else if (empty){ empty.remove(); }
  });

  /* ---- select people ---- */
  cards.forEach(c => c.addEventListener('click', () => {
    const on = c.getAttribute('aria-pressed') === 'true';
    c.setAttribute('aria-pressed', on ? 'false' : 'true');
    const n = cards.filter(x => x.getAttribute('aria-pressed') === 'true').length;
    // no toast on every toggle; keep it quiet
  }));

  /* ---- copy button ---- */
  const copyBtn = $('#copyBtn'), copyLbl = copyBtn.querySelector('span');
  let copyT;
  copyBtn.addEventListener('click', async () => {
    if (await copy(link())){
      copyBtn.classList.add('done'); copyLbl.textContent = 'הועתק ✓';
      showToast('הקישור הועתק ✓');
      clearTimeout(copyT); copyT = setTimeout(() => { copyBtn.classList.remove('done'); copyLbl.textContent = 'העתק'; }, 1800);
    } else showToast('ההעתקה נכשלה');
  });

  /* ---- share links ---- */
  function openWin(url){ window.open(url, '_blank', 'noopener,width=680,height=640'); }
  $$('.slink').forEach(b => b.addEventListener('click', async () => {
    const u = encodeURIComponent(link());
    const t = encodeURIComponent('הנה הקבצים ששלחתי לך דרך KOLKLI:');
    switch (b.dataset.share){
      case 'facebook': openWin('https://www.facebook.com/sharer/sharer.php?u=' + u); break;
      case 'whatsapp': openWin('https://wa.me/?text=' + t + '%20' + u); break;
      case 'x':        openWin('https://twitter.com/intent/tweet?url=' + u + '&text=' + t); break;
      case 'discord':
        if (await copy(link())) showToast('הקישור הועתק — הדבק אותו בדיסקורד ✓');
        openWin('https://discord.com/channels/@me');
        break;
      case 'copy':
        if (await copy(link())) showToast('הקישור הועתק ✓'); break;
      case 'embed':
        if (await copy('<iframe src="' + link() + '" width="640" height="480" frameborder="0" allowfullscreen></iframe>'))
          showToast('קוד ההטמעה הועתק ✓');
        break;
    }
  }));
})();
</script>
<script src="./cookie-consent.js" defer></script>
</body>
