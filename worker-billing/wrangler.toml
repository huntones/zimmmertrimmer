# ============================================================
# KOLKLI billing Worker — Cloudflare config.
# Deploy:  cd worker-billing && npm install && npx wrangler deploy
# ============================================================
name = "kolkli-billing"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
SUPABASE_URL      = "https://YOUR-PROJECT.supabase.co"
SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY"
# Lock to your site origin in production (used for redirects + CORS).
ALLOWED_ORIGIN    = "https://kolkli.com"
SUCCESS_URL       = "https://kolkli.com/dashboard/team"
CANCEL_URL        = "https://kolkli.com/pricing/"
# Map each plan name to its Stripe recurring (per-seat) Price id:
PLAN_PRICES       = '{"creator":"price_XXX","studio":"price_YYY"}'

# --- Secrets (set with `wrangler secret put NAME`; never commit) ------
#   STRIPE_SECRET_KEY            ← Stripe → Developers → API keys
#   STRIPE_WEBHOOK_SECRET        ← Stripe → Webhooks → your endpoint signing secret
#   SUPABASE_SERVICE_ROLE_KEY    ← Supabase → Project Settings → API → service_role
