<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOLKLI — סיכום חבילה</title>
<meta name="description" content="Package summary stat row — downloads, total size, files and expiry, with the order number, for a KOLKLI package.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#eef0f6; --panel:#ffffff; --panel-2:#f5f6fa; --line:#e5e8f0; --line-2:#eef0f6; --sep:#d3d9e6;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --success:#22b04b; --success-soft:#e6f6ec;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --accent:#7c3aed; --accent-dim:#6a2fe0; --accent-soft:#efe9fe;
    --send:#f97316; --send-soft:#fff1e6;
    --grad:linear-gradient(105deg,#3f85ff 0%,#7b34ff 100%);
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-lg:0 2px 6px rgba(20,24,44,0.05), 0 22px 55px rgba(20,24,44,0.10);
    --sans:'Heebo','Space Grotesk',system-ui,'Segoe UI',sans-serif;
    --mono:'Space Grotesk',ui-monospace,'SFMono-Regular',Menlo,monospace;
  }
  html[data-theme="dark"] {
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a303c; --line-2:#232833; --sep:#39414f;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --success:#37c26a; --success-soft:#132a1c;
    --info:#5b95f8; --info-dim:#5b95f8; --info-soft:#182338;
    --accent:#a06bff; --accent-dim:#a06bff; --accent-soft:#241a3a;
    --send:#fb923c; --send-soft:#2c2012;
    --grad:linear-gradient(105deg,#5a97ff 0%,#8f52ff 100%);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,0.45), 0 24px 60px rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;
    display:flex;flex-direction:column;align-items:center;gap:26px;padding:48px 18px 64px;}
  body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(58% 40% at 15% 4%,rgba(124,58,237,0.07),transparent 60%),
      radial-gradient(52% 40% at 88% 2%,rgba(59,130,246,0.06),transparent 60%);}
  svg{display:block;}

  /* theme toggle */
  .themebtn{position:fixed;top:18px;inset-inline-start:18px;width:40px;height:40px;border-radius:12px;
    border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow);z-index:9;}
  .themebtn:hover{color:var(--ink);}
  .themebtn svg{width:19px;height:19px;}

  /* page intro */
  .intro{text-align:center;max-width:52ch;}
  .intro .kick{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--info-dim);background:var(--info-soft);
    padding:5px 13px;border-radius:999px;margin-bottom:12px;}
  .intro h1{font-size:clamp(22px,3.4vw,30px);font-weight:800;letter-spacing:-0.02em;margin:0 0 8px;}
  .intro p{font-size:14px;color:var(--muted);margin:0;}

  /* ====================== PACKAGE SUMMARY ====================== */
  .summary{width:100%;max-width:760px;display:flex;flex-direction:column;align-items:center;gap:20px;}

  /* no outer frame — flat until pressed, then the whole box fills gray (mouse-down / :active) */
  .statgrid{width:100%;background:var(--panel);border-radius:22px;
    box-shadow:var(--shadow-lg);display:grid;grid-template-columns:repeat(4,1fr);overflow:hidden;transition:background .12s ease;}
  .statgrid:active{background:var(--panel-2);}
  .stat{padding:26px 16px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;
    position:relative;}
  /* thin separators between cells (RTL-aware: border on the inline-start edge) */
  .stat + .stat::before{content:'';position:absolute;inset-inline-start:0;top:18px;bottom:18px;width:1px;
    background:var(--sep);}

  .stat .ic{width:34px;height:34px;}
  .stat.dl   .ic{color:var(--send);}
  .stat.size .ic{color:var(--success);}
  .stat.file .ic{color:var(--info);}
  .stat.exp  .ic{color:var(--accent);}
  .stat .ic svg{width:100%;height:100%;}

  .stat .val{font-size:26px;font-weight:800;letter-spacing:-0.02em;color:var(--ink);line-height:1;}
  /* number + unit (e.g. "0 B") reads left-to-right even inside the RTL card */
  .stat.dl .val,.stat.size .val,.stat.file .val{direction:ltr;unicode-bidi:isolate;}
  .stat.exp .val{font-size:19px;}
  .stat .lbl{font-size:14px;font-weight:600;color:var(--muted);}

  /* order number */
  .ordernum{font-size:16px;font-weight:800;color:var(--ink-2);letter-spacing:-0.01em;}
  .ordernum .num{font-family:var(--mono);font-weight:700;letter-spacing:.02em;
    direction:ltr;unicode-bidi:isolate;display:inline-block;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}

  @media (max-width:560px){
    .statgrid{grid-template-columns:repeat(2,1fr);}
    /* on a 2-col layout, redo the separators so the wrap looks clean */
    .stat + .stat::before{display:none;}
    .stat{border-top:1px solid var(--sep);}
    .stat:nth-child(-n+2){border-top:none;}
    .stat:nth-child(odd){border-inline-start:1px solid var(--sep);}
  }
</style>
</head>
<body>
  <button class="themebtn" id="themeBtn" aria-label="החלפת ערכת נושא" title="מצב כהה / בהיר">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>

  <div class="intro">
    <span class="kick">Package summary</span>
    <h1>סיכום חבילה</h1>
    <p>שורת הנתונים של החבילה — הורדות, נפח, קבצים ותפוגה, עם מספר ההזמנה.</p>
  </div>

  <div class="summary">
    <!-- DOM order runs first→last = right→left in RTL, so to match the reference
         (downloads on the left, expiry on the right) the cells are listed exp→dl. -->
    <div class="statgrid">
      <div class="stat exp">
        <span class="ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
        </span>
        <span class="val" data-expiry>עד 5 ימים</span>
        <span class="lbl">תפוגה</span>
      </div>

      <div class="stat file">
        <span class="ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
        </span>
        <span class="val" data-files>0</span>
        <span class="lbl">קבצים</span>
      </div>

      <div class="stat size">
        <span class="ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="12" x2="2" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" y1="16" x2="6.01" y2="16"/><line x1="10" y1="16" x2="10.01" y2="16"/></svg>
        </span>
        <span class="val" data-size>0 B</span>
        <span class="lbl">נפח כולל</span>
      </div>

      <div class="stat dl">
        <span class="ic" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </span>
        <span class="val" data-downloads>0</span>
        <span class="lbl">הורדות</span>
      </div>
    </div>

    <div class="ordernum">מספר הזמנה: <span class="num" data-order>#10002</span></div>
  </div>

  <script>
    // theme toggle — remembers choice, mirrors the sibling component pages
    (function(){
      var root=document.documentElement, btn=document.getElementById('themeBtn');
      try{ if(localStorage.getItem('kolkli-theme')==='dark') root.setAttribute('data-theme','dark'); }catch(e){}
      btn.addEventListener('click',function(){
        var dark=root.getAttribute('data-theme')==='dark';
        if(dark){ root.removeAttribute('data-theme'); } else { root.setAttribute('data-theme','dark'); }
        try{ localStorage.setItem('kolkli-theme',dark?'light':'dark'); }catch(e){}
      });
    })();

    // Fill the summary from data. Call setPackageStats({...}) to update in place.
    function setPackageStats(d){
      d=d||{};
      var q=function(sel){ return document.querySelector(sel); };
      if('downloads' in d) q('[data-downloads]').textContent=d.downloads;
      if('size'      in d) q('[data-size]').textContent=d.size;
      if('files'     in d) q('[data-files]').textContent=d.files;
      if('expiry'    in d) q('[data-expiry]').textContent=d.expiry;
      if('order'     in d) q('[data-order]').textContent=String(d.order).replace(/^#?/,'#');
    }
    // demo values (matches the reference):
    setPackageStats({ downloads:0, size:'0 B', files:0, expiry:'עד 5 ימים', order:'10002' });
  </script>
</body>
</html>
