  // ---- supported types ----
  const TYPES = {
    image:['jpg','jpeg','png','gif','heic','heif','webp','bmp','avif'],
    video:['mp4','mov','avi','webm','mkv','m4v'],
    audio:['mp3','wav','aac','m4a','flac','ogg','oga','opus'],
    // "אחר" — everything that isn't image / video / audio: documents, spreadsheets,
    // slides, archives, and design source files (incl. svg/psd/ai/eps). Executables
    // never reach here — they're caught by EXEC_BLOCK below and rejected on upload.
    other:['pdf','doc','docx','xls','xlsx','ppt','pptx','txt','csv','rtf',
           'zip','rar','7z','tar','gz','svg','psd','ai','eps','indd','sketch','fig'],
  };
  // Hard-blocked no matter what: executables & installers are never uploadable.
  const EXEC_BLOCK=['exe','msi','bat','cmd','com','scr','cpl','vbs','ps1',
                    'dmg','pkg','app','apk','deb','rpm','sh','jar'];
  function kindOf(ext){
    ext=(ext||'').toLowerCase();
    if(EXEC_BLOCK.includes(ext)) return null; // executable -> always blocked
    for(const k in TYPES){ if(TYPES[k].includes(ext)) return k; }
    return null; // unsupported -> blocked
  }

  // ---- state ----
  let lang='he', t=I18N.he;
  let folders=[];                 // {id,name}
  let files=[];                   // {id,file,name,ext,kind,size,folderId,note,url,selected}
  let currentFolder='all';        // 'all' | folderId  (also the upload target)
  let showMovedInMain=true;       // show folder-assigned (locked) files in the "all files" view
  let query='';
  let folderQuery='';             // sidebar folder-name filter (independent of the grid search)
  let uid=1; const nid = () => 'x'+(uid++)+'_'+Date.now().toString(36);
  let albumMgr = null;            // cached client selection-limit config (drives the GREEN check quota); set in init()
  let quotaState = null;          // per-render snapshot of the active limit + live selected counts
  let wmState = null;             // per-render snapshot of the resolved watermark (logo/text) to paint on thumbs
  let selConfirmed=false;         // client has locked in their album pick — green selection frozen
  let selPromptShown=false;       // the "are you finished?" dialog was already offered for the current full-cap state
  let organizerUsageStarted=false;
  let settingsIsNewProject=false;
  // project status is no longer edited from the settings popup — preserve the
  // loaded value so saving the form doesn't drop/reset it.
  let settingsStatus='draft';

  // ===================================================================
  //  PERSISTENT GALLERY STORE  (files + client selections survive refresh,
  //  browser close, re-login and the client share link — via
  //  kolkli-file-sync.js -> Supabase, with an instant IndexedDB/localStorage
  //  fallback when the backend is not configured). Scope = the GALLERY id
  //  (owner: ac_share id; client: ?g=) so owner and client read/write the SAME
  //  project; deliberately NOT owner-scoped.
  // ===================================================================
  const CID = (window.KolkliSync ? KolkliSync.clientId() : 'c_local');
  function galleryId(){
    if(isClientView()){ try{ return new URLSearchParams(location.search).get('g')||'default'; }catch(_){ return 'default'; } }
    try{ return shareState().id; }catch(_){ return 'default'; }
  }
  // Arriving from the dashboard "יצירת גלריית בחירה" (files?new=1): every click must open a
  // BRAND-NEW, empty gallery. The gallery id lives in ONE owner-scoped key (ac_share), so
  // without this it gets reused and the previous project's files reappear. Mint a fresh id
  // and wipe the live per-project scratch (album settings + client details) BEFORE GID is
  // read, so the store hydrates with nothing. Never touch a client share view (?g=).
  (function freshGalleryIfNew(){
    try{
      if(!/[?&]new=1/.test(location.search) || isClientView()) return;
      persistShare({ id: genId() });                    // new gallery id → empty file store
      localStorage.removeItem(scopedKey('ac_album'));   // blank title/brand/watermark/perms
      localStorage.removeItem(scopedKey('ac_client'));  // blank client name/email/phone
    }catch(_){}
  })();
  const GID = galleryId();
  const GAL = (window.KolkliSync ? KolkliSync.store({
      service:'select', token:GID, role:(isClientView()?'client':'owner'),
      dbName:'kolkli_gallery', metaKey:'kolkli_gallery_files', picksKey:'kolkli_gallery_picks'
  }) : null);
  const GAL_DONE_KEY='kolkli_gallery_done::'+GID+'::'+CID;
  let galHydrated=false;          // true once init() has loaded the stored gallery
  let galRemoteSelOthers=[];      // OTHER clients' picks (merge target so we never overwrite them)
  let galLastHash='';             // structural fingerprint — skip needless pushes on view switches
  let galTitle='';                // project name from the synced gallery record (a real client has no owner localStorage)
  let galMetaTimer=null, galWatchTimer=null;
  const GAL_T={
    he:{ saving:'שומר…', failed:'✕ נכשל · לחצו לניסיון חוזר', errEmpty:'אין קבצים שמורים בגלריה — יש להעלות קבצים לפני שליחת הקישור.', errPending:'העלאה עדיין בתהליך — יש להמתין לסיום השמירה לפני שליחת הקישור.', errFailed:'חלק מהקבצים לא נשמרו — יש להעלות אותם מחדש לפני השליחה.', stSaving:'שומר…', stSaved:'✓ נשמר', stError:'שמירה נכשלה — מנסה שוב…' },
    en:{ saving:'saving…', failed:'✕ Failed · click to retry', errEmpty:'No saved files in the gallery yet — upload files before sending the link.', errPending:'Upload still in progress — wait for saving to finish before sending the link.', errFailed:'Some files failed to save — re-upload them before sending.', stSaving:'saving…', stSaved:'✓ saved', stError:'save failed — retrying…' },
    ru:{ saving:'сохранение…', failed:'✕ Ошибка · нажмите для повтора', errEmpty:'В галерее ещё нет сохранённых файлов — загрузите файлы перед отправкой ссылки.', errPending:'Загрузка ещё идёт — дождитесь завершения сохранения перед отправкой ссылки.', errFailed:'Некоторые файлы не сохранились — загрузите их заново перед отправкой.', stSaving:'сохранение…', stSaved:'✓ сохранено', stError:'ошибка сохранения — повтор…' }
  };
  function galT(k){ return (GAL_T[lang]||GAL_T.he)[k]; }

  // one metadata row per file (exactly the fields the spec lists)
  function galFileMeta(){
    return files.map((f,i)=>({
      id:f.id, name:f.name, ext:f.ext, kind:f.kind,
      type:(f.file&&f.file.type)||f.mime||'', size:f.size||0,
      folderId:(f.folderId==null?null:f.folderId), note:f.note||'',
      order:i, status:f.status||'stored', storagePath:'select/'+GID+'/'+f.id
    }));
  }
  function galRecord(){
    let alb={},cli={}; try{alb=loadAlbum();}catch(_){ } try{cli=loadClient();}catch(_){}
    return { token:GID, service:'select', files:galFileMeta(),
             folders:folders.map(fo=>({id:fo.id,name:fo.name,parentId:fo.parentId||null})),
             title:(alb.alTitle||cli.name||''), status:(cli.status||settingsStatus||'draft'), updated:Date.now() };
  }
  function galSnapshotHash(rec){ rec=rec||galRecord(); return JSON.stringify(rec.files)+'|'+JSON.stringify(rec.folders)+'|'+rec.title+'|'+rec.status; }
  // persist gallery STRUCTURE (owner only), debounced + fingerprinted; never touches picks
  function persistGallery(){
    if(!GAL || isClientView() || !galHydrated) return;
    const rec=galRecord(), h=galSnapshotHash(rec);
    if(h===galLastHash) return;
    galLastHash=h;
    if(galMetaTimer) clearTimeout(galMetaTimer);
    galMetaTimer=setTimeout(()=>{ try{ GAL.writeMeta(rec); }catch(_){} }, 150);
  }

  // per-file upload-status badge
  function galStatusHtml(f){
    if(!f || !f.status || f.status==='stored') return '';
    if(f.status==='failed') return '<div class="gal-status failed"><button type="button" class="gal-retry" data-galretry="'+f.id+'">'+escapeHtml(galT('failed'))+'</button></div>';
    return '<div class="gal-status uploading"><span class="gal-spin"></span>'+escapeHtml(galT('saving'))+'</div>';
  }
  function updateCardStatus(f){
    const card=document.querySelector('.fcard[data-id="'+f.id+'"]'); if(!card) return;
    card.classList.toggle('gal-uploading', f.status==='uploading');
    card.classList.toggle('gal-failed', f.status==='failed');
    const th=card.querySelector('.fthumb'); if(!th) return;
    let badge=th.querySelector('.gal-status');
    if(!f.status || f.status==='stored'){ if(badge) badge.remove(); return; }
    if(!badge){ badge=document.createElement('div'); th.appendChild(badge); }
    badge.outerHTML=galStatusHtml(f);
  }
  // write the bytes FIRST + verify, only THEN mark "stored"; on failure show a retry badge
  // and keep the file OUT of the "ready to send" set (never reported uploaded before proven)
  function persistBlob(f){
    if(!GAL || !f.file){ f.status='stored'; return; }
    f.status='uploading';
    GAL.putBlob(f.id, f.file).then(function(ok){
      f.status = ok ? 'stored' : 'failed';
      updateCardStatus(f); persistGallery(); renderStats();
    }).catch(function(){ f.status='failed'; updateCardStatus(f); });
  }
  function retryBlob(id){
    const f=fileById(id); if(!f) return;
    if(!f.file){ f.status='stored'; renderGrid(); return; }
    persistBlob(f); updateCardStatus(f);
  }

  // ---- client selections ----
  function galSelectionEntries(){
    return files.filter(f=>f.selected).map(f=>({ fileId:f.id, clientId:CID, at:Date.now(), confirmed:!!selConfirmed }));
  }
  // save picks now (local) + server (debounced+retried); server array = mine UNION others'
  function persistPicks(){
    if(!GAL || !isClientView()) return;    // only a real client (?g) persists; owner preview is ephemeral
    const mine=galSelectionEntries();
    const union=galRemoteSelOthers.concat(mine);
    GAL.savePicks(union, mine, { confirmed:!!selConfirmed });
    try{ localStorage.setItem(GAL_DONE_KEY, selConfirmed?'1':'0'); }catch(_){}
  }
  function applyServerSelection(sel, forClientOnly){
    sel=Array.isArray(sel)?sel:[];
    galRemoteSelOthers=sel.filter(e=>e&&e.clientId&&e.clientId!==CID);
    const apply = forClientOnly ? sel.filter(e=>e.clientId===CID) : sel;
    const ids=new Set(apply.map(e=>e.fileId));
    let changed=false;
    files.forEach(f=>{ const s=ids.has(f.id); if(s!==f.selected){ f.selected=s; changed=true; } });
    return changed;
  }

  // ---- hydrate on load (owner + client) ----
  async function hydrateGallery(){
    if(!GAL){ galHydrated=true; return; }
    let meta=GAL.readMeta();               // instant local (offline-safe)
    if(meta && meta.title) galTitle=String(meta.title);
    let remoteSel=null;
    try{
      const remote=await GAL.pull();       // owner: pullService; client: pullToken (cross-device)
      if(remote){
        if(remote.title) galTitle=String(remote.title);
        if(remote.files){ meta={ files:remote.files, folders:remote.folders||[], title:galTitle }; if(!isClientView()) GAL.writeMetaLocal(meta); }
        if(remote.selection) remoteSel=remote.selection;
      }
    }catch(_){}
    if(meta && Array.isArray(meta.folders)) folders=meta.folders.map(fo=>({id:fo.id,name:fo.name,parentId:(fo.parentId||null),open:true}));
    if(meta && Array.isArray(meta.files)){
      const ordered=meta.files.slice().sort((a,b)=>((a.order||0)-(b.order||0)));
      files=ordered.map(m=>({ id:m.id, file:null, name:m.name, ext:m.ext, kind:m.kind, mime:m.type||'', size:m.size||0,
        folderId:(m.folderId==null?null:m.folderId), note:m.note||'', url:null, selected:false, picked:false,
        status:m.status||'stored', storagePath:m.storagePath }));
    }
    if(!remoteSel){ const lp=GAL.readPicks(); if(lp&&lp.selection) remoteSel=lp.selection; }
    applyServerSelection(remoteSel, isClientView());
    if(isClientView()){
      let done=false; try{ done=localStorage.getItem(GAL_DONE_KEY)==='1'; }catch(_){}
      const mineConfirmed=(remoteSel||[]).some(e=>e.clientId===CID && e.confirmed);
      selConfirmed = done || mineConfirmed;
    }
    await restoreThumbs();
    galLastHash=galSnapshotHash();         // don't re-push the record we just loaded
    galHydrated=true;
  }
  async function restoreThumbs(){
    if(!GAL) return;
    const jobs=files.map(f=> GAL.blobUrl(f.id).then(u=>{ if(u) f.url=u; }).catch(()=>{}));
    try{ await Promise.all(jobs); }catch(_){}
  }
  // owner watches the client's live picks (only when a real backend is configured)
  function startOwnerSelectionWatch(){
    if(!GAL || isClientView() || !GAL.enabled()) return;
    const tick=()=>{ GAL.pullSelection().then(sel=>{ if(sel && applyServerSelection(sel,false)){ renderGrid(); renderStats(); } }); };
    galWatchTimer=setInterval(tick, 6000);
    try{ window.addEventListener('focus', tick); }catch(_){}
  }

  // ---- share/send guardrails ----
  function galleryReadyForShare(){
    if(!files.length) return { ok:false, reason:galT('errEmpty') };
    if(files.some(f=>f.status==='uploading')) return { ok:false, reason:galT('errPending') };
    if(files.some(f=>f.status==='failed')) return { ok:false, reason:galT('errFailed') };
    return { ok:true };
  }
  function guardShare(){ const r=galleryReadyForShare(); if(!r.ok){ showToast(r.reason); return false; } return true; }

  // ---- save-status pill + injected styles ----
  function injectGalStyles(){
    if(document.getElementById('gal-sync-styles')) return;
    const s=document.createElement('style'); s.id='gal-sync-styles';
    s.textContent='.fcard.gal-uploading{opacity:.72}.fcard.gal-failed{outline:2px solid #e5484d;outline-offset:-2px}'
      +'.gal-status{position:absolute;inset-inline-start:6px;bottom:6px;z-index:6;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;color:#fff;background:rgba(20,20,26,.74)}'
      +'.gal-status.failed{background:#e5484d;cursor:pointer}.gal-status.failed .gal-retry{all:unset;cursor:pointer;color:#fff;font-weight:600;font:inherit}'
      +'.gal-spin{width:10px;height:10px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:galspin .7s linear infinite;display:inline-block}@keyframes galspin{to{transform:rotate(360deg)}}'
      +'#galSavePill{position:fixed;z-index:99999;inset-inline-end:16px;bottom:16px;display:none;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:999px;color:#fff;background:#3a3a44;box-shadow:0 6px 22px rgba(0,0,0,.22);transition:opacity .25s}'
      +'#galSavePill.saving{background:#5b5bd6}#galSavePill.saved{background:#30a46c}#galSavePill.error{background:#e5484d}';
    document.head.appendChild(s);
  }
  function initSavePill(){
    injectGalStyles();
    let pill=document.getElementById('galSavePill');
    if(!pill){ pill=document.createElement('div'); pill.id='galSavePill'; document.body.appendChild(pill); }
    let hideT=null;
    if(window.KolkliSync && KolkliSync.onStatus){
      KolkliSync.onStatus(function(state){
        if(hideT){ clearTimeout(hideT); hideT=null; }
        if(state==='saving'){ pill.className='saving'; pill.textContent=galT('stSaving'); pill.style.display='inline-flex'; pill.style.opacity='1'; }
        else if(state==='saved'){ pill.className='saved'; pill.textContent=galT('stSaved'); pill.style.display='inline-flex'; pill.style.opacity='1'; hideT=setTimeout(function(){ pill.style.opacity='0'; setTimeout(function(){ pill.style.display='none'; },260); },1400); }
        else if(state==='error'||state==='retrying'){ pill.className='error'; pill.textContent=galT('stError'); pill.style.display='inline-flex'; pill.style.opacity='1'; }
      });
    }
  }


  // ---- helpers ----
  function organizerPayloadError(payload){
    if(payload.files > 5) return { code:'payload_limit', field:'files', max:5, actual:payload.files };
    if(payload.folders > 3) return { code:'payload_limit', field:'folders', max:3, actual:payload.folders };
    return null;
  }
  function showOrganizerUsageLimit(info){
    if(window.KolkliUsage && window.KolkliUsage.showBlocked) window.KolkliUsage.showBlocked(info,'organize-files');
    else showToast(info && info.field==='folders' ? 'Folder limit reached' : 'File limit reached');
  }
  function usageExempt(){ return !!(window.KolkliUsage && window.KolkliUsage.isExempt && window.KolkliUsage.isExempt()); }
  async function withOrganizerUsage(payload, work){
    // Paid plans (Lite/Pro/Business) are unlimited on files & folders — only free users hit the cap.
    if(!usageExempt()){
      const localErr=organizerPayloadError(payload);
      if(localErr){ showOrganizerUsageLimit(localErr); return false; }
    }
    if(window.KolkliUsage && window.KolkliUsage.guard && !organizerUsageStarted){
      try{
        await window.KolkliUsage.guard('organize-files', payload, async()=>{
          const value=await work();
          organizerUsageStarted=true;
          return value;
        });
        return true;
      }catch(err){
        if(err && err.usage) return false;
        throw err;
      }
    }
    await work();
    organizerUsageStarted=true;
    return true;
  }
  function estimateNewFolders(items, baseParentId){
    const seen=new Set();
    let extra=0;
    (items||[]).forEach(it=>{
      let parent=baseParentId||null;
      let pseudo='p:'+(parent||'root');
      (it.segs||[]).forEach(seg=>{
        const name=String(seg||'').trim();
        if(!name) return;
        const existing = (typeof parent === 'string' && parent.indexOf('new:') === 0)
          ? null
          : folders.find(x=>(x.parentId||null)===(parent||null) && x.name===name);
        if(existing){ parent=existing.id; pseudo='p:'+parent; return; }
        pseudo += '/' + name.toLowerCase();
        if(!seen.has(pseudo)){ seen.add(pseudo); extra++; }
        parent='new:'+pseudo;
      });
    });
    return extra;
  }
  function safeOwnerId(v){ return String(v||'guest').toLowerCase().replace(/[^a-z0-9_.@-]+/g,'_') || 'guest'; }

  async function createSelectionProjectRecord(client, album){
    const now=Date.now();
    const bytes=files.reduce((sum,f)=>sum+(Number(f.size)||0),0);
    const selected=files.filter(f=>f.selected).length;
    const share=shareState();
    const project={
      id:'sel_'+now.toString(36)+'_'+Math.random().toString(36).slice(2,8),
      name:album.alTitle || client.event || client.name || 'Selection gallery',
      client:client.name || '',

      phone:client.phone || '',
      desc:album.alDesc || '',
      status:client.status || 'draft',
      files:files.length,

      link:shareLinkFor(share.id),

  function fmtBytes(n){ if(n==null) return '—'; if(n>=1048576) return (n/1048576).toFixed(1)+' MB'; if(n>=1024) return (n/1024).toFixed(0)+' KB'; return n+' B'; }
  function pad3(n){ return String(n).padStart(3,'0'); }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function folderDescendantSearchSet(q){
    const ids=new Set();
    const addWithKids=id=>{
      if(ids.has(id)) return;
      ids.add(id);
      folders.filter(f=>(f.parentId||null)===id).forEach(child=>addWithKids(child.id));
    };
    folders.forEach(fo=>{ if(fo.name.toLowerCase().includes(q)) addWithKids(fo.id); });
    return ids;
  }

  // live "picked / total" counter shown next to a folder (or "all") in the rail
  function folderSelCount(fid){
    if(fid==='all') return { sel:files.filter(f=>f.selected).length, total:files.length };
    return { sel:files.filter(f=>f.folderId===fid && f.selected).length,
             total:files.filter(f=>f.folderId===fid).length };
  }
  function folderCountHtml(fid){
    const {sel,total}=folderSelCount(fid);
    return `<span class="fi-count${sel>0?' on':''}" dir="ltr" data-fcount="${fid}"><b>${sel}</b>/${total}</span>`;
  }
  // refresh just the numbers in the folder rail without rebuilding the whole tree
  function updateFolderCounts(){
    document.querySelectorAll('#folderList [data-fcount]').forEach(sp=>{
      const {sel,total}=folderSelCount(sp.getAttribute('data-fcount'));
      sp.innerHTML=`<b>${sel}</b>/${total}`;
      sp.classList.toggle('on', sel>0);
    });
  }

  function addFolderAncestors(show,id){
    let cur=folders.find(x=>x.id===id);
    while(cur){
      show.add(cur.id);
      cur = cur.parentId!=null ? folders.find(x=>x.id===cur.parentId) : null;
    }
  }

  function fileSearchMatches(q){
    const matchingFolders = folderDescendantSearchSet(q);
    return files.some(f=>f.name.toLowerCase().includes(q) || (f.folderId!=null && matchingFolders.has(f.folderId)));
  }

  // Folders (and parents of matching files) to keep visible for a sidebar search query.
  function folderSearchSet(q){
    const show=new Set();
    folders.forEach(fo=>{
      if(fo.name.toLowerCase().includes(q)) addFolderAncestors(show, fo.id);
    });
    files.forEach(f=>{
      if(f.folderId==null || !f.name.toLowerCase().includes(q)) return;
      addFolderAncestors(show, f.folderId);
    });
    return show;
  }

  function renderFolders(){
    const list=el('folderList');
    const q=folderQuery.trim().toLowerCase();
    const show = q ? folderSearchSet(q) : null;
    let renderedFolders = 0;
    let ordN = 0;   // running 1-based counter → the "01, 02, 03…" badge shown at the start of each folder row
    let html = `<div class="fitem ${currentFolder==='all'?'on':''}" data-folder="all" data-drop="all">
        <span class="fi-num" dir="ltr" aria-hidden="true">ALL</span>

        ${folderCountHtml('all')}
      </div>`;
    const renderLevel=(parentId,depth)=>{
      folders.filter(f=>(f.parentId||null)===parentId).forEach(fo=>{
        if(show && !show.has(fo.id)) return;
        const hasKids=folders.some(f=>(f.parentId||null)===fo.id);
        const open = q ? true : (fo.open!==false);   // force-open the tree while searching
        const tw=hasKids
          ? `<button class="tw ${open?'open':''}" data-ftoggle="${fo.id}" aria-label="toggle">${ICON.chev}</button>`
          : '';
        ordN++;

        html+=`<div class="fitem ${currentFolder===fo.id?'on':''}" data-folder="${fo.id}" data-drop="${fo.id}" draggable="true">

          <button class="fi-grip" data-fgrip="${fo.id}" title="${escapeHtml(t.reorderFolderTip||'')}" aria-label="${escapeHtml(t.reorderFolderTip||'')}">${ICON.grip}</button>
          <span class="fi-tw" style="margin-inline-start:${depth*15}px">${tw}</span>
          <span class="fi-ic">${ICON.folder}</span>

        return `<img loading="lazy" class="vposter" src="${f.poster}" alt=""><span class="filmstrip"></span>`;
      }
      return `<span class="ph video" data-vthumbph="${f.id}">${ICON.video}</span><span class="filmstrip"></span>`;
    }
    const cls=f.kind==='audio'?'audio':(f.ext==='pdf'?'pdf':'doc');
    const ic=f.kind==='audio'?ICON.audio:(f.ext==='pdf'?ICON.pdf:ICON.doc);

  // Resolve the album's saved watermark settings into what should actually paint on a thumb.
  // type "logo" uses the uploaded brand logo; if none was uploaded it falls back to the
  // watermark text, and then to the business name.
  function computeWm(){
    let a; try{ a=loadAlbum(); }catch(_){ return null; }
    if(!a || !a.alWmOn) return null;
    const pos=a.alWmPos||'br';
    const op=Math.max(5, Math.min(100, +a.alWmOpacity||35))/100;
    if(a.alWmType==='logo' && a.alBrandLogo){
      return { kind:'logo', src:a.alBrandLogo, pos, op };
    }
    const txt=((a.alWmText||'').trim()) || ((a.alBrandName||'').trim());
    if(!txt) return null;
    return { kind:'text', text:txt, pos, op };
  }

  function fileXButtonHtml(f){

  // Grab a still frame from a video clip to use as its thumbnail. Runs once per file,
  // decodes off-screen, and patches any already-rendered placeholders when the frame is ready.
  function makeVideoPoster(f){
    if(f.kind!=='video' || f.poster || f.posterTried) return;
    f.posterTried=true;
    const v=document.createElement('video');
    v.muted=true; v.preload='auto'; v.playsInline=true; v.setAttribute('playsinline','');
    let settled=false, timer=null;
    const release=()=>{ v.removeAttribute('src'); try{ v.load(); }catch(e){} };
    const finish=(grab)=>{
      if(settled) return; settled=true;
      if(timer){ clearTimeout(timer); timer=null; }
      if(grab){
        try{
          const w=v.videoWidth, h=v.videoHeight;
          if(w && h){
            const MAX=400, s=Math.min(1, MAX/Math.max(w,h));
            const cw=Math.max(1,Math.round(w*s)), ch=Math.max(1,Math.round(h*s));
            const c=document.createElement('canvas'); c.width=cw; c.height=ch;
            c.getContext('2d').drawImage(v,0,0,cw,ch);
            f.poster=c.toDataURL('image/jpeg',0.72);
            applyPosterToDom(f);
          }
        }catch(e){ /* undecodable/tainted — keep the film icon */ }
      }
      release();
    };
    v.addEventListener('loadeddata', ()=>{
      // seek a touch into the clip so we don't capture a black lead-in frame
      const d=(isFinite(v.duration) && v.duration>0) ? v.duration : 0;
      if(d && !f.dur){ f.dur=d; applyDurToDom(f); }
      const target = d ? Math.min(d*0.1, 1) : 0.1;
      v.addEventListener('seeked', ()=>finish(true), {once:true});
      try{ v.currentTime=target; }
      catch(e){ finish(true); }
    }, {once:true});
    v.addEventListener('error', ()=>finish(false), {once:true});
    timer=setTimeout(()=>finish(v.readyState>=2), 8000); // give up gracefully on slow/odd files
    v.src=urlFor(f);
  }

  // stamp the captured clip length onto any grid card already on screen
  function applyDurToDom(f){
    if(!f.dur) return;
    document.querySelectorAll('.fcard[data-id="'+f.id+'"] .fthumb').forEach(th=>{
      if(th.querySelector('.dur')) return;
      const sp=document.createElement('span'); sp.className='dur';
      sp.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'+mmss(f.dur);
      th.appendChild(sp);
    });
  }
  // swap the film-icon placeholder for the captured frame wherever this file is on screen
  function applyPosterToDom(f){
    document.querySelectorAll('[data-vthumbph="'+f.id+'"]').forEach(ph=>{
      const img=document.createElement('img');
      img.loading='lazy'; img.className='vposter'; img.src=f.poster; img.alt='';
      ph.replaceWith(img);
    });
  }

  // ---- stats strip: gallery total + live client-pick quotas ----
  function videosEnabled(m){
    if(!m || !m.limitOn) return true;
    return !(m.maxVideos===0 || m.preset==='album' || m.preset==='prints');
  }
  // "other" files (audio / documents) get their own cap only in split mode; a combined pool
  // lets any file type fill maxTotal, so there's no separate "other" restriction there.
  function otherEnabled(m){
    if(!m || !m.limitOn || !m.separate) return true;
    return (m.maxOther||0) > 0;
  }
  function statQuota(){
    const m = albumMgr && albumMgr.limitOn ? albumMgr : null;
    if(!m) return { photos:50, videos:5, total:55 };
    if(m.separate){
      const videos = videosEnabled(m) ? m.maxVideos : null;
      const other  = otherEnabled(m)  ? m.maxOther : 0;
      return { photos:m.maxPhotos, videos, other:otherEnabled(m)?m.maxOther:null,
               total:m.maxPhotos + (videos||0) + other };
    }
    // one combined pool (no separate video/other quota) -> no dedicated numbers to show (em dash)
    return { photos:m.maxTotal, videos:null, other:null, total:m.maxTotal };
  }
  function setStatBar(id, cur, max){
    const span=el(id); if(!span) return;

    bar.classList.toggle('near', ratio>=0.8 && ratio<1);
    bar.classList.toggle('full', ratio>=1);
  }

  // =====================================================
  //  FILE INTAKE  (+ duplicate handling)
  // =====================================================
  // Build (or reuse) a nested folder chain from path segments; returns the deepest folder id.
  // Matches existing folders by (parent, name) so repeated uploads and multiple files from the
  // same directory land in one folder instead of creating duplicates.
  function ensureFolderPath(segs, baseParentId){
    let parent = baseParentId || null;
    for(const raw of segs){
      const name = String(raw).trim() || String(raw);
      if(!name) continue;
      let f = folders.find(x=>(x.parentId||null)===(parent||null) && x.name===name);
      if(!f){ f={id:nid(), name, parentId:parent||null, open:true}; folders.push(f); }
      else { f.open=true; }
      if(parent){ const p=folders.find(x=>x.id===parent); if(p) p.open=true; }
      parent = f.id;
    }
    return parent;
  }

  // entry point for a plain FileList (file <input>; the folder <input webkitdirectory> also
  // lands here — its files carry a webkitRelativePath that rebuilds the tree).
  function addFiles(fileList){
    if(!clientCan('upload')) return;
    intake(Array.from(fileList||[]).map(f=>({file:f, path:f.webkitRelativePath || f.name}))).catch(err=>console.error(err));
  }

  // entry point for a drag-drop — walks any dropped directories via the entries API so folders
  // keep their full structure (subfolders + names). Falls back to a flat file list if unsupported.
  async function addFromDataTransfer(dt){
    if(!clientCan('upload')) return;
    let items;
    try{ items = await filesFromDataTransfer(dt); }
    catch(_){ items = Array.from(dt.files||[]).map(f=>({file:f, path:f.webkitRelativePath||f.name})); }
    await intake(items);
  }
  function filesFromDataTransfer(dt){
    const list = dt.items ? Array.from(dt.items) : [];
    // webkitGetAsEntry() must be read synchronously while the drop event is live
    const entries = list.map(it=> it.webkitGetAsEntry ? it.webkitGetAsEntry() : null).filter(Boolean);
    if(!entries.length){
      return Promise.resolve(Array.from(dt.files||[]).map(f=>({file:f, path:f.webkitRelativePath||f.name})));
    }
    const out=[];
    return Promise.all(entries.map(en=>walkEntry(en,'',out))).then(()=>out);
  }
  function walkEntry(entry, prefix, out){
    return new Promise(resolve=>{
      if(!entry){ resolve(); return; }
      if(entry.isFile){
        entry.file(f=>{ out.push({file:f, path:prefix+entry.name}); resolve(); }, ()=>resolve());
      } else if(entry.isDirectory){
        const reader=entry.createReader(), kids=[];
        const readBatch=()=>reader.readEntries(batch=>{
          if(!batch.length){ Promise.all(kids.map(k=>walkEntry(k, prefix+entry.name+'/', out))).then(resolve); }
          else { kids.push(...batch); readBatch(); }   // readEntries returns in chunks — keep going until empty
        }, ()=>resolve());
        readBatch();
      } else resolve();
    });
  }

  let dupQueue=null;
  // Normalize a batch of {file,path} into accepted items, filtering unsupported types and
  // resolving each file's target folder from its path (nested under the current folder).
  async function intake(rawItems){
    const incoming=(rawItems||[]).filter(r=>r && r.file);
    if(!incoming.length) return;
    const blocked=[], accepted=[];
    const base=targetFolderId();
    incoming.forEach(({file,path})=>{
      const ext=extOf(file.name), kind=kindOf(ext);
      if(!kind){ blocked.push(file.name); return; }
      const segs=String(path||file.name).split('/').filter(Boolean);
      segs.pop();                                        // drop the filename → directory chain
      accepted.push({file,ext,kind,segs});
    });
    if(blocked.length) showBlocked(blocked);
    if(!accepted.length){ return; }
    const extraFolders=estimateNewFolders(accepted, base);
    const ok=await withOrganizerUsage({ files:files.length + accepted.length, folders:folders.length + extraFolders }, async()=>{
      accepted.forEach(it=>{ it.folderId = it.segs.length ? ensureFolderPath(it.segs, base) : base; });
      processQueue(accepted);
    });
    if(!ok) return;
  }

  function processQueue(queue){
    let applyAll=null; // 'keep'|'replace'|'skip'
    // Loop iteratively (folder uploads can be huge — avoid per-file recursion), and only pause
    // when a duplicate needs the user's decision; the dialog callback resumes the loop.
    const run=(start)=>{
      for(let i=start;i<queue.length;i++){
        const item=queue[i], folderId=item.folderId;
        const dupIdx=files.findIndex(f=>f.folderId===folderId && f.name.toLowerCase()===item.file.name.toLowerCase());
        if(dupIdx<0){ insertFile(item,folderId,null); continue; }
        const apply=(choice)=>{
          if(choice==='replace'){ const old=files[dupIdx]; revoke(old); files.splice(dupIdx,1); insertFile(item,folderId,null); }
          else if(choice==='keep'){ insertFile(item,folderId,uniqueName(item.file.name,folderId)); }
          // skip -> nothing
        };
        if(applyAll){ apply(applyAll); continue; }
        askDuplicate(item.file.name, (choice, all)=>{ if(all) applyAll=choice; apply(choice); run(i+1); });
        return; // wait for the dialog before continuing
      }
      renderAll();
    };
    run(0);
  }

  function uniqueName(name,folderId){
    const base=stripExt(name), ext=extOf(name);
    let n=2, cand;
    do{ cand=`${base} (${n}).${ext}`; n++; }
    while(files.some(f=>f.folderId===folderId && f.name.toLowerCase()===cand.toLowerCase()));
    return cand;
  }
  function insertFile(item,folderId,forcedName){
    const rec={ id:nid(), file:item.file, name:forcedName||item.file.name, ext:item.ext, kind:item.kind,
      size:item.file.size, folderId:folderId, note:'', url:null, selected:false, picked:false, status:'uploading' };
    files.push(rec); persistBlob(rec);
  }

  // duplicate dialog (promise-ish via callback)

  // paint the enlarged-view ✓ toggle to match the previewed file's selection state, so the

  // show the prev/next arrows only when there's more than one file to step through;
  // label each edge by its logical direction (RTL: forward/next = left edge)
  function syncPvNav(){

  //  FOLDERS
  // =====================================================
  let folderEditId=null;
  let folderCreateMovePicked=false;   // when true, the marked files move into the folder created by the modal
  let folderCreateMoveFileId=null;    // when set, this single file moves into the folder created by the modal
  function openFolderModal(editId,opts){
    if(editId ? !clientCan('folderManage') : !clientCan('folderCreate')) return;  // rename = manage, new = create
    folderEditId=editId||null;
    folderCreateMovePicked = !folderEditId && !!(opts && opts.movePicked);

    el('folderSave').textContent = isEdit? t.save : t.create;

  async function saveFolder(){
    const name=el('folderNameInput').value.trim();
    if(!name){ el('folderNameInput').focus(); return; }
    if(!folderEditId){
      const ok=await withOrganizerUsage({ files:files.length, folders:folders.length + 1 }, async()=>true);
      if(!ok) return;
    }
    if(folderEditId){ const f=folders.find(x=>x.id===folderEditId); if(f) f.name=name; }
    else {
      const id=nid();
      folders.push({id,name,parentId:null,open:true});
      if(folderCreateMovePicked){ files.forEach(f=>{ if(f.picked){ f.folderId=id; f.picked=false; } }); }  // opened from "move to folder" → carry the marked files in
      else if(folderCreateMoveFileId){ const mf=fileById(folderCreateMoveFileId); if(mf) mf.folderId=id; }  // opened from a single card's "+" → carry just that file in
      currentFolder=id;
    }
    folderCreateMovePicked=false; folderCreateMoveFileId=null;
    el('folderOverlay').classList.remove('show');
    renderAll();
  }
  // ---- nesting helpers: reparent a folder (its files + subfolders travel with it) ----
  function isDescendantFolder(id, ancestorId){
    let f=folders.find(x=>x.id===id);
    while(f && f.parentId!=null){
      if(f.parentId===ancestorId) return true;
      f=folders.find(x=>x.id===f.parentId);
    }
    return false;
  }
  function canDropFolder(dragId, targetId){
    if(targetId==='all') return true;                        // drop onto "all files" = move to root
    if(targetId===dragId) return false;                      // onto itself
    if(isDescendantFolder(targetId, dragId)) return false;   // into its own subtree
    return true;
  }
  function reparentFolder(dragId, newParentId){
    if(!clientCan('folderManage')) return;
    const f=folders.find(x=>x.id===dragId); if(!f) return;
    f.parentId=newParentId;
    if(newParentId){ const p=folders.find(x=>x.id===newParentId); if(p) p.open=true; }
  }
  // reorder a folder among its siblings by moving it just before/after another sibling in the
  // `folders` array (sibling order = array order within each parent group). Numbering re-derives on render.
  function reorderFolder(dragId, targetId, placeAfter){
    if(!clientCan('folderManage')) return;
    if(dragId===targetId) return;
    const from=folders.findIndex(f=>f.id===dragId); if(from<0) return;
    const moved=folders.splice(from,1)[0];
    const to=folders.findIndex(f=>f.id===targetId);
    if(to<0){ folders.splice(from,0,moved); return; }   // target vanished — put it back
    folders.splice(placeAfter?to+1:to, 0, moved);
  }
  function areFolderSiblings(aId, bId){
    const a=folders.find(f=>f.id===aId), b=folders.find(f=>f.id===bId);
    return !!(a && b && (a.parentId||null)===(b.parentId||null));
  }
  function clearFolderDropMarks(){
    document.querySelectorAll('#folderList .drop-before,#folderList .drop-after').forEach(n=>n.classList.remove('drop-before','drop-after'));
  }
  function deleteFolder(id){
    if(!clientCan('folderManage')) return;
    const fo=folders.find(f=>f.id===id); if(!fo) return;
    confirmAsk(t.confirmDelFolderTitle, t.confirmDelFolderBody(fo.name), ()=>{
      const up=fo.parentId||null;                            // promote contents one level up
      files.forEach(f=>{ if(f.folderId===id) f.folderId=up; });
      folders.forEach(f=>{ if((f.parentId||null)===id) f.parentId=up; });
      folders=folders.filter(f=>f.id!==id);
      if(currentFolder===id) currentFolder = up||'all';
      renderAll();
    });
  }

  // =====================================================

  function confirmAsk(title, body, cb, opts){

  // paint the current logo (data URL held in the hidden #alBrandLogo input) into the preview box
  function renderLogoPreview(){

  // read the picked image, downscale it (keeps localStorage small + transparency intact), stash the data URL
  function onLogoFile(e){
    const file=e.target.files && e.target.files[0]; e.target.value='';
    if(!file || !/^image\//.test(file.type)) return;
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=360; let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        if(!w || !h){ el('alBrandLogo').value=rd.result; renderLogoPreview(); return; }
        const s=Math.min(1, max/Math.max(w,h)); w=Math.max(1,Math.round(w*s)); h=Math.max(1,Math.round(h*s));
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        let out; try{ out=cv.toDataURL('image/png'); }catch(_){ out=rd.result; }
        el('alBrandLogo').value=out; renderLogoPreview();
      };
      img.onerror=()=>{ el('alBrandLogo').value=rd.result; renderLogoPreview(); };
      img.src=rd.result;
    };
    rd.readAsDataURL(file);
  }

  // the client message the owner has NOT hand-edited; tracked so quota changes can keep it in sync
  let amAutoMsg='';
  // join localized clauses as "A", "A and B", or "A, B and C" (RTL "ו" prefixes correctly)
  function joinAmList(parts){

  // compose the "message shown before selection" purely from the configured quota, so it always

  function buildAmMessage(m){
    if(!m || !m.limitOn) return '';
    const parts=[];
    if(m.separate){
      parts.push(t.amUpToItem(m.maxPhotos, t.amUnitPhotos));
      if(videosEnabled(m)) parts.push(t.amUpToItem(m.maxVideos, t.amUnitVideos));
      if(otherEnabled(m))  parts.push(t.amUpToItem(m.maxOther, t.amUnitOther));

  function saveAlbumMgr(){
    const onChip=document.querySelector('#amPresets .preset.on');

    const nm=el('amPresetName').value.trim();
    const m={

    const cp=pid?customPresets.find(p=>p.id===pid):null;

      // built-in preset renamed -> fork into a new named custom preset; the built-in stays put
      // (built-in labels are localized per language, so they can't be renamed in place)
      const p={ id:'c'+genId(), name:nm,
        limitOn:m.limitOn, separate:m.separate,
        maxTotal:m.maxTotal, maxPhotos:m.maxPhotos, maxVideos:m.maxVideos, maxOther:m.maxOther,
        message:m.message };

  // load persisted share settings; mint a stable gallery id on first use
  function shareState(){
    let s={}; try{ s=JSON.parse(localStorage.getItem(scopedKey('ac_share'))||'{}')||{}; }catch(_){}
    if(!s.id){ s.id=genId(); persistShare(s); }
    return s;

  // write a few fields into the stored album settings without touching the rest —
  // lets the share modal edit the SAME password/visibility the settings pane owns
  function patchAlbum(partial){
    let a={}; try{ a=JSON.parse(localStorage.getItem(scopedKey('ac_album'))||'{}')||{}; }catch(_){}
    Object.assign(a, partial);
    try{ localStorage.setItem(scopedKey('ac_album'), JSON.stringify(a)); }catch(_){}

                 alVisibility: el('share_block').checked?'private':'link' });

  function openShare(){

    if('pwOn' in s||'pw' in s||'blocked' in s){ delete s.pwOn; delete s.pw; delete s.blocked; persistShare(s); }
    const alb=loadAlbum();

  // =====================================================
  //  DOWNLOAD ALL  (one ZIP — names by gallery order + caption)
  // =====================================================
  // CRC-32 lookup table used for each ZIP entry
  const CRC32_TABLE=(function(){ const tb=new Uint32Array(256);
    for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++){ c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); } tb[n]=c>>>0; }
    return tb; })();
  function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++){ c=CRC32_TABLE[(c^u8[i])&0xFF]^(c>>>8); } return (c^0xFFFFFFFF)>>>0; }

  // build a store-only (uncompressed) ZIP Blob from [{name, blob}] — UTF-8 filenames (bit 11) so Hebrew names survive
  async function buildZip(items){
    const enc=new TextEncoder(), parts=[], central=[]; let offset=0;
    for(const it of items){
      const data=new Uint8Array(await it.blob.arrayBuffer());
      const nameBytes=enc.encode(it.name);
      const crc=crc32(data), size=data.length;
      const lfh=new DataView(new ArrayBuffer(30));
      lfh.setUint32(0,0x04034b50,true); lfh.setUint16(4,20,true); lfh.setUint16(6,0x0800,true);
      lfh.setUint16(8,0,true); lfh.setUint16(10,0,true); lfh.setUint16(12,0,true);
      lfh.setUint32(14,crc,true); lfh.setUint32(18,size,true); lfh.setUint32(22,size,true);
      lfh.setUint16(26,nameBytes.length,true); lfh.setUint16(28,0,true);
      parts.push(new Uint8Array(lfh.buffer), nameBytes, data);
      const cdh=new DataView(new ArrayBuffer(46));
      cdh.setUint32(0,0x02014b50,true); cdh.setUint16(4,20,true); cdh.setUint16(6,20,true);
      cdh.setUint16(8,0x0800,true); cdh.setUint16(10,0,true); cdh.setUint16(12,0,true); cdh.setUint16(14,0,true);
      cdh.setUint32(16,crc,true); cdh.setUint32(20,size,true); cdh.setUint32(24,size,true);
      cdh.setUint16(28,nameBytes.length,true); cdh.setUint16(30,0,true); cdh.setUint16(32,0,true);
      cdh.setUint16(34,0,true); cdh.setUint16(36,0,true); cdh.setUint32(38,0,true); cdh.setUint32(42,offset,true);
      central.push(new Uint8Array(cdh.buffer), nameBytes);
      offset += 30 + nameBytes.length + size;
    }
    let cdSize=0; central.forEach(p=>cdSize+=p.length);
    const eocd=new DataView(new ArrayBuffer(22));
    eocd.setUint32(0,0x06054b50,true); eocd.setUint16(4,0,true); eocd.setUint16(6,0,true);
    eocd.setUint16(8,items.length,true); eocd.setUint16(10,items.length,true);
    eocd.setUint32(12,cdSize,true); eocd.setUint32(16,offset,true); eocd.setUint16(20,0,true);
    return new Blob([...parts, ...central, new Uint8Array(eocd.buffer)], {type:'application/zip'});
  }

  // make caption text safe inside a filename (keep letters incl. Hebrew, drop path/illegal chars)
  function sanitizeName(s){
    return String(s||'').replace(/[\/\\:*?"<>|\x00-\x1f]/g,' ').replace(/\s+/g,' ').trim().slice(0,80);
  }

  let zipBusy=false;
  async function downloadAllZip(){
    if(zipBusy) return;
    const ordered=files.slice();                 // master gallery order = export order
    if(!ordered.length) return;
    zipBusy=true;
    const btn=el('downloadZipBtn'), span=btn.querySelector('span'), label=span?span.textContent:'';
    btn.disabled=true; if(span) span.textContent=t.preparingZip;
    try{
      const items=ordered.map((f,i)=>{
        const num=pad3(i+1), cap=sanitizeName(f.note);   // 001, 002 … + optional caption
        const base = cap ? `${num} - ${cap}` : num;
        return { name:`${base}.${f.ext}`, blob:f.file };
      });
      const blob=await buildZip(items);
      const zipName=sanitizeName(loadClient().name)||t.zipName;
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download=zipName+'.zip';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 60000);
    }catch(err){ console.error(err); alert(t.zipError); }
    finally{ zipBusy=false; btn.disabled=(files.length===0); if(span) span.textContent=label; }
  }

  // =====================================================
  //  GRID SIZING  (helpers used by both init() and the zoom controls in bindStatic)
  // =====================================================
  function applyGrid(v){
    const r=el('zoomRange');
    v=Math.max(+r.min, Math.min(+r.max, v));
    const changed = v !== +r.value;
    const before = changed ? new Map([...document.querySelectorAll('.filegrid .fcard')].map(card=>[card.dataset.id, card.getBoundingClientRect()])) : null;
    r.value=v;
    document.documentElement.style.setProperty('--card-size', v+'px');
    if(before){
      requestAnimationFrame(()=>{
        document.querySelectorAll('.filegrid .fcard').forEach(card=>{
          const first=before.get(card.dataset.id);
          if(!first) return;
          const last=card.getBoundingClientRect();
          if(!last.width || !last.height) return;
          const dx=first.left-last.left, dy=first.top-last.top;
          const sx=first.width/last.width, sy=first.height/last.height;
          if(Math.abs(dx)<.5 && Math.abs(dy)<.5 && Math.abs(sx-1)<.01 && Math.abs(sy-1)<.01) return;
          card.animate([
            {transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`,transformOrigin:'top left'},
            {transform:'translate(0,0) scale(1,1)',transformOrigin:'top left'}
          ],{duration:180,easing:'cubic-bezier(.2,.8,.2,1)'});
        });
      });
    }
    try{ localStorage.setItem('ac_grid', String(v)); }catch(_){}
    el('zoomMinus').disabled = v<=+r.min;
    el('zoomPlus').disabled  = v>=+r.max;
  }
  // The grid stretches its columns to fill the row (auto-fill + 1fr), so nudging
  // --card-size by a single 10px step usually lands inside the same column count and
  // looks identical — which felt like "nothing happens until the 2nd click". Instead,
  // +/- jump straight to the size that removes/adds one whole column, so every single
  // click visibly resizes the cards. (Drag on the slider keeps its raw px behaviour.)
  function gridColMetrics(){
    const grid=el('fileGrid');
    if(!grid || !grid.children.length || !grid.clientWidth) return null;
    const cs=getComputedStyle(grid);
    const cols=cs.gridTemplateColumns.split(/\s+/).filter(t=>t && t!=='none').length;
    if(!cols) return null;
    const gap=parseFloat(cs.columnGap)||parseFloat(cs.gap)||0;
    return {cols, gap, w:grid.clientWidth};
  }
  // Exact per-column width for n columns — slightly floored so auto-fill fits exactly n.
  const sizeForCols=(n,m)=>Math.floor((m.w-(n-1)*m.gap)/n);
  function stepGrid(bigger){
    const r=el('zoomRange'), step=+r.step||10, m=gridColMetrics();
    if(!m){ applyGrid(+r.value + (bigger?step:-step)); return; }   // empty grid: fall back to px step
    const target = bigger ? m.cols-1 : m.cols+1;
    applyGrid(target<1 ? +r.max : sizeForCols(target,m));
  }
  // Default grid density for a fresh project: exactly 6 cards per row on desktop.
  // Derived from the live grid width (works even while empty) so the row fills
  // precisely; on narrow layouts (organizer collapses at ≤820px) we keep the
  // neutral 170px so cards don't get tiny.
  function defaultGridSize(){
    const grid=el('fileGrid');
    if(window.innerWidth<=820 || !grid || !grid.clientWidth) return 170;
    const cs=getComputedStyle(grid);
    const gap=parseFloat(cs.columnGap)||parseFloat(cs.gap)||14;
    return Math.floor((grid.clientWidth-5*gap)/6);   // 6 columns, 5 inner gaps
  }

  // =====================================================
  //  EVENTS
  // =====================================================
  function bindStatic(){
    // upload
    const drop=el('drop'), input=el('fileInput'), folderInput=el('folderInput');
    el('chooseBtn').addEventListener('click',()=>input.click());
    el('chooseFolderBtn').addEventListener('click',()=>folderInput.click());
    drop.addEventListener('click',(e)=>{ if(e.target.closest('.choose')) return; input.click(); });
    input.addEventListener('change',()=>{ addFiles(input.files); input.value=''; });
    folderInput.addEventListener('change',()=>{ addFiles(folderInput.files); folderInput.value=''; });
    ;['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{
      if(draggingId||draggingFolderId) return; // internal reorder / move between cards — not an external file upload
      if(e.dataTransfer && Array.from(e.dataTransfer.types||[]).includes('Files')){ e.preventDefault(); drop.classList.add('over'); }
    }));
    ;['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{
      if(ev==='drop'){ e.preventDefault(); }
      if(e.target===document || e.relatedTarget===null) drop.classList.remove('over');
    }));
    drop.addEventListener('drop',e=>{ e.preventDefault(); drop.classList.remove('over'); if(draggingId||draggingFolderId) return; if(e.dataTransfer) addFromDataTransfer(e.dataTransfer); });
    document.addEventListener('drop',e=>{ if(e.dataTransfer && Array.from(e.dataTransfer.types||[]).includes('Files')){ e.preventDefault(); drop.classList.remove('over'); } });

    // search + zoom
    el('folderSearch').addEventListener('input',e=>{
      folderQuery=e.target.value;
      query=folderQuery.trim().toLowerCase();
      if(query) currentFolder='all';
      renderAll();
    });
    el('zoomRange').addEventListener('input',e=>applyGrid(+e.target.value));
    el('zoomMinus').addEventListener('click',()=>stepGrid(false)); // − → smaller cards, one more column
    el('zoomPlus').addEventListener('click',()=>stepGrid(true));   // + → bigger cards, one fewer column
    el('showMovedChk').addEventListener('change',e=>{
      showMovedInMain=e.target.checked;
      try{ localStorage.setItem('ac_showmoved', showMovedInMain?'1':'0'); }catch(_){}
      renderGrid();
    });

    // purple multi-select (batch) actions
    el('msPickAllBtn').addEventListener('click',()=>{
      if(!clientCan('multiSelect')) return;
      const vis=visibleFiles().filter(f=>!isLocked(f)); const allPick=vis.length>0 && vis.every(f=>f.picked);
      vis.forEach(f=>f.picked=!allPick); renderGrid();
    });
    el('clientSelectAllBtn').addEventListener('click',()=>{
      if(!clientCan('selection') || !clientCan('selectAll') || selConfirmed) return;
      const vis=visibleFiles().filter(f=>!isLocked(f));
      const allSelected=vis.length>0 && vis.every(f=>f.selected);
      if(allSelected){ vis.forEach(f=>f.selected=false); selPromptShown=false; }
      else for(const f of vis){ if(!f.selected && selBlocked(f)) break; f.selected=true; }
      renderGrid(); renderStats(); persistPicks(); maybePromptSelConfirm();
    });
    el('msDelBtn').addEventListener('click',()=>{
      if(!clientCan('delete')) return;
      const picked=files.filter(f=>f.picked); if(!picked.length) return;
      confirmAsk(t.confirmDelTitle, t.confirmDelBody(picked.length), ()=>{
        picked.forEach(function(f){ revoke(f); if(GAL) GAL.delBlob(f.id); }); files=files.filter(f=>!f.picked); renderAll();
      });
    });
    // custom move-to-folder dropdown (themed popup instead of a native <select>)
    (function(){
      const wrap=el('msMoveSel'), trig=el('msMoveTrigger'), menu=el('msMoveMenu');
      const openMenu=()=>{ if(trig.disabled) return; refreshMsMove(); menu.hidden=false; wrap.classList.add('open'); trig.setAttribute('aria-expanded','true'); };
      const closeMenu=()=>{ menu.hidden=true; wrap.classList.remove('open'); trig.setAttribute('aria-expanded','false'); };
      const isOpen=()=>wrap.classList.contains('open');
      trig.addEventListener('click',e=>{ e.stopPropagation(); isOpen()?closeMenu():openMenu(); });
      trig.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'||e.key==='Enter'||e.key===' '){ e.preventDefault(); openMenu(); const first=menu.querySelector('.fs-item'); if(first) first.focus(); } });
      menu.addEventListener('click',e=>{
        const add=e.target.closest('.fs-newbtn');
        if(add){ closeMenu(); trig.focus(); openFolderModal(null,{movePicked:true}); return; }   // "+" on the "no folder" row → create a new folder and drop the marked files into it
        const it=e.target.closest('.fs-item'); if(!it) return; closeMenu(); trig.focus(); doMsMove(it.getAttribute('data-val'));
      });
      menu.addEventListener('keydown',e=>{
        const items=[...menu.querySelectorAll('.fs-item')]; if(!items.length) return;
        const i=items.indexOf(document.activeElement);
        if(e.key==='ArrowDown'){ e.preventDefault(); (items[i+1]||items[0]).focus(); }
        else if(e.key==='ArrowUp'){ e.preventDefault(); (items[i-1]||items[items.length-1]).focus(); }
        else if(e.key==='Escape'){ e.preventDefault(); closeMenu(); trig.focus(); }
      });
      document.addEventListener('click',e=>{ if(isOpen() && !wrap.contains(e.target)) closeMenu(); });
      document.addEventListener('keydown',e=>{ if(e.key==='Escape' && isOpen()){ closeMenu(); trig.focus(); } });
    })();

    // folders sidebar (delegated)
    el('folderList').addEventListener('click',e=>{
      if(e.target.closest('[data-fgrip]')){ e.stopPropagation(); return; }   // grip is drag-only, never selects
      const tw=e.target.closest('[data-ftoggle]'); if(tw){ e.stopPropagation(); const f=folders.find(x=>x.id===tw.getAttribute('data-ftoggle')); if(f){ f.open=(f.open===false); renderFolders(); } return; }
      const editBtn=e.target.closest('[data-fedit]'); if(editBtn){ e.stopPropagation(); if(!clientCan('folderManage')) return; openFolderModal(editBtn.getAttribute('data-fedit')); return; }
      const delBtn=e.target.closest('[data-fdel]'); if(delBtn){ e.stopPropagation(); if(!clientCan('folderManage')) return; deleteFolder(delBtn.getAttribute('data-fdel')); return; }
      const item=e.target.closest('.fitem'); if(item){ const fid=item.getAttribute('data-folder'); currentFolder = fid==='all'?'all':fid; renderAll(); }
    });
    el('addFolderBtn').addEventListener('click',()=>{ if(!clientCan('folderCreate')) return; openFolderModal(null); });

    // folder drag-drop targets — three gestures:
    //   • drag a file card onto a folder     → assign the file (draggingId)
    //   • drag a folder row onto another      → reparent / nest it (draggingFolderId)
    //   • drag a folder by its six-dot grip   → reorder it among its siblings (reorderFolderId)
    el('folderList').addEventListener('pointerdown',e=>{ folderGripArmed=!!e.target.closest('[data-fgrip]'); });
    el('folderList').addEventListener('dragstart',e=>{
      const row=e.target.closest('.fitem[data-folder]'); if(!row) return;
      if(!clientCan('folderManage')){ e.preventDefault(); return; }   // reorder / nest a folder = folder management
      const fid=row.getAttribute('data-folder');
      if(fid==='all'){ e.preventDefault(); return; }
      if(folderGripArmed){                                    // grip drag = reorder among siblings
        reorderFolderId=fid; row.classList.add('dragging');
        e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain','reorder:'+fid); }catch(_){}
        return;
      }

  let draggingId=null, draggingFolderId=null, reorderFolderId=null, folderGripArmed=false;
  function fileById(id){ return files.find(f=>f.id===id); }
  // ---- album-selection quota (the GREEN check): count photos / videos / other across the WHOLE album ----
  // audio + documents (anything that isn't an image or video) fall into the "other" bucket
  function quotaKind(f){ return f.kind==='image'?'photo':(f.kind==='video'?'video':'other'); }
  function selLimit(){ const m=albumMgr||loadAlbumMgr(); return m&&m.limitOn?m:null; }
  function selCounts(){
    let photos=0,videos=0,other=0,total=0;
    files.forEach(f=>{ if(!f.selected) return; total++; const k=quotaKind(f);
      if(k==='photo') photos++; else if(k==='video') videos++; else other++; });
    return {photos,videos,other,total};
  }
  function computeQuota(){ return { m:selLimit(), c:selCounts() }; }
  // can this (currently unselected) file still be added under the active limit? uses the per-render snapshot
  function selAtCap(f){
    if(f.selected) return false;
    const q=quotaState; if(!q||!q.m) return false;
    const k=quotaKind(f);
    if(k==='video' && !videosEnabled(q.m)) return true;
    if(k==='other' && !otherEnabled(q.m)) return true;
    if(q.m.separate){
      if(k==='photo') return q.c.photos>=q.m.maxPhotos;
      if(k==='video') return q.c.videos>=q.m.maxVideos;
      if(k==='other') return q.c.other>=q.m.maxOther;
      return false; }
    return q.c.total>=q.m.maxTotal;
  }
  // event-time check: returns the relevant max when the file is blocked by the quota, else 0
  function selBlocked(f){
    const m=selLimit(); if(!m) return 0;
    const c=selCounts();
    const k=quotaKind(f);
    if(k==='video' && !videosEnabled(m)) return -1;
    if(k==='other' && !otherEnabled(m)) return -1;
    if(m.separate){
      if(k==='photo') return c.photos>=m.maxPhotos?m.maxPhotos:0;
      if(k==='video') return c.videos>=m.maxVideos?m.maxVideos:0;
      if(k==='other') return c.other>=m.maxOther?m.maxOther:0;
      return 0; }
    return c.total>=m.maxTotal?m.maxTotal:0;
  }
  let _toastTimer=null;
  function showToast(msg){
    const n=el('selToast'); if(!n||!msg) return;
    n.textContent=msg; n.classList.add('show');
    clearTimeout(_toastTimer); _toastTimer=setTimeout(()=>n.classList.remove('show'),2200);
  }
  function selLimitMsg(f){
    const m=selLimit(); if(!m) return '';
    const k=quotaKind(f);
    if(k==='video' && !videosEnabled(m)) return t.limitVideos(0);
    if(k==='other' && !otherEnabled(m)) return t.limitOther(0);
    if(m.separate){
      if(k==='video') return t.limitVideos(m.maxVideos);
      if(k==='other') return t.limitOther(m.maxOther);
      return t.limitPhotos(m.maxPhotos); }
    return t.limitTotal(m.maxTotal);
  }
  // popup title for the "you hit the quota" dialog (photos / videos / other / total, per active limit)
  function selLimitTitle(f){
    const m=selLimit(); if(!m) return '';
    const k=quotaKind(f);
    if(k==='video' && !videosEnabled(m)) return t.limitPopVideos(0);
    if(k==='other' && !otherEnabled(m)) return t.limitPopOther(0);
    if(m.separate){
      if(k==='video') return t.limitPopVideos(m.maxVideos);
      if(k==='other') return t.limitPopOther(m.maxOther);
      return t.limitPopPhotos(m.maxPhotos); }
    return t.limitPopFiles(m.maxTotal);
  }
  function openLimitPop(f){
    el('limitModalTitle').textContent=selLimitTitle(f);
    el('limitOverlay').classList.add('show');
  }
  // ---- "I'm done selecting" lock: once the client fills the whole quota, offer to freeze the pick ----
  function selQuotaFull(){
    const m=selLimit(); if(!m) return false;
    const c=selCounts();
    if(!m.separate) return c.total>=m.maxTotal;
    const photoFull = c.photos>=m.maxPhotos;
    const videoFull = !videosEnabled(m) || c.videos>=m.maxVideos;
    const otherFull = !otherEnabled(m)  || c.other>=m.maxOther;
    return photoFull && videoFull && otherFull;
  }
  function selDoneCountMsg(){
    const m=selLimit();
    const c=selCounts();
    if(!m) return t.selDoneCountAny(c.total);   // no quota configured -> show a plain selected-files count
    if(!m.separate) return t.selDoneCount(c.total, m.maxTotal);
    // split mode -> spell out each enabled category with its own count/cap
    const items=[ t.selDoneItem(c.photos, m.maxPhotos, t.amUnitPhotos) ];
    if(videosEnabled(m)) items.push(t.selDoneItem(c.videos, m.maxVideos, t.amUnitVideos));
    if(otherEnabled(m))  items.push(t.selDoneItem(c.other,  m.maxOther,  t.amUnitOther));
    return t.selDoneLead+joinAmList(items)+'.';
  }
  function renderSelDone(){
    el('selDoneTitle').textContent=t.selDoneTitle;
    el('selDoneCount').textContent=selDoneCountMsg();
    el('selDoneNote').textContent=t.selDoneNote;
    el('selDoneConfirm').textContent=t.selDoneConfirm;
  }
  function openSelDone(){ renderSelDone(); el('selDoneOverlay').classList.add('show'); }
  // fire automatically the moment the client reaches the full quota (unless already locked / already asked)
  function maybePromptSelConfirm(){
    if(selConfirmed || selPromptShown) return;
    if(selQuotaFull()){ selPromptShown=true; openSelDone(); }
  }
  function confirmSelection(){
    selConfirmed=true; persistPicks();
    el('selDoneOverlay').classList.remove('show');
    updateFinishBtn();
    renderGrid();
  }
  // ---- client "finish selecting" button ----
  // The owner edits the gallery at its plain URL; a client arrives via the shareable
  // "?g=<id>" link (see shareLinkFor). So the button is shown only when that param is present.
  function isClientView(){ try{ return new URLSearchParams(location.search).has('g'); }catch(_){ return false; } }
  // Owner-side "preview as client" toggle (top of the page). A real client always arrives
  // via the ?g share link, so they stay in client view; the owner can flip in and out with
  // no reload to preview exactly what the client sees.
  let clientPreview=false;
  function effectiveClientView(){ return isClientView() || clientPreview; }
  // Snapshot of what the client may do in client view. In the owner's own view it's null,
  // which clientCan() reads as "everything allowed" so the owner is never restricted.
  let viewPerms=null;
  function computeViewPerms(){
    if(!effectiveClientView()) return null;
    const p=Object.assign({}, CLIENT_DEFAULT.perms, (loadClient().perms||{}));
    if(p.viewOnly){ PERM_KEYS.forEach(k=>{ if(k!=='viewOnly') p[k]=false; }); }  // view-only overrides every other permission
    return p;
  }
  // Capability gate for every client-side mutation. Owner (viewPerms===null) always passes.
  function clientCan(cap){ return !viewPerms || !!viewPerms[cap]; }
  function applyPreviewMode(){
    const client=effectiveClientView();
    document.body.classList.toggle('clientview', client);
    viewPerms=computeViewPerms();
    // mirror each granted permission onto <body> so the permission-gated CSS can reveal its control
    PERM_KEYS.forEach(k=>{ document.body.classList.toggle('perm-'+k, !!(viewPerms && viewPerms[k])); });
    const u=el('vsUser'), c=el('vsClient');
    if(u){ u.classList.toggle('on', !client); u.setAttribute('aria-selected', String(!client)); }
    if(c){ c.classList.toggle('on', client); c.setAttribute('aria-selected', String(client)); }
    applyPageTitle();
    updateFinishBtn();
  }
  // The client sees the project's own name (set in settings → "שם הפרויקט") as the page
  // heading; the owner's manager view keeps the generic "בחירת קבצים" title. Falls back to
  // the generic title whenever no project name has been entered yet.
  function applyPageTitle(){
    const h=el('pageTitle'); if(!h) return;
    let title=t.pageTitle;
    if(effectiveClientView()){
      try{
        const a=loadAlbum(), c=loadClient();
        // owner preview reads the local settings; a real client (?g=) has none of the
        // owner's localStorage, so fall back to the synced gallery record's title
        const name=(a.alTitle||'').trim() || (c.name||'').trim() || String(galTitle||'').trim();
        if(name) title=name;
      }catch(_){}
    }
    h.textContent=title;
  }
  function updateFinishBtn(){
    const b=el('finishSelBtn'); if(!b) return;
    const client=effectiveClientView();
    if(client && !clientCan('selection')){ b.hidden=true; return; }  // no selection permission → the finish flow doesn't apply
    b.hidden=false;
    // Only a client may lock & submit the selection. In the owner's "user view" the button
    // is shown but disabled, so the owner sees it exactly where the client would press it.
    b.disabled = !client || selConfirmed;
    b.classList.toggle('done',selConfirmed);
    const lbl=b.querySelector('span');
    if(lbl) lbl.textContent = selConfirmed ? t.selLockedBadge : t.finishSelBtn;
  }
  function onFinishSel(){
    if(selConfirmed){ showToast(t.selLockedToast); return; }
    if(!selCounts().total){ showToast(t.finishNoneToast); return; }  // nothing picked yet -> nudge, don't open
    openSelDone();
  }
  function toggleSel(id){
    if(!clientCan('selection')) return;                            // client not allowed to change the selection
    if(selConfirmed){ showToast(t.selLockedToast); return; }        // selection frozen after the client confirmed
    const f=fileById(id); if(!f) return;
    if(!f.selected && selBlocked(f)){ openLimitPop(f); return; }    // at the client's quota -> popup, ask to deselect first
    f.selected=!f.selected;
    if(!f.selected) selPromptShown=false;                          // dropped below cap -> allow re-prompting on refill
    renderGrid(); renderStats(); persistPicks();
    maybePromptSelConfirm();
  }
  function togglePick(id){ if(!clientCan('multiSelect')) return; const f=fileById(id); if(f && !isLocked(f)){ f.picked=!f.picked; renderGrid(); } }
  // build the themed folder list for the custom move-to-folder popup (mirrors moveOptions' tree)
  function refreshMsMove(){
    const menu=el('msMoveMenu'); if(!menu) return;
    const folderRows=[];
    const walk=(parentId,depth)=>{
      folders.filter(f=>(f.parentId||null)===parentId).forEach(fo=>{
        folderRows.push({val:fo.id,label:fo.name,depth});
        walk(fo.id,depth+1);
      });
    };
    walk(null,0);
    const folderIco='<svg class="fs-mico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>';
    const noneIco='<svg class="fs-mico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.69.9H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';
    const plusIco='<svg class="fs-mico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/><path d="M12 10v6"/><path d="M9 13h6"/></svg>';
    // "no folder" destination, with an inline "+" that creates a new folder and moves the marked files into it
    let html =
      '<div class="fs-nonerow">'
      + `<button type="button" class="fs-item none" role="option" data-val="" style="--fs-depth:0">${noneIco}<span class="fs-itext">${escapeHtml(t.unsorted)}</span></button>`
      + `<button type="button" class="fs-newbtn" data-newfolder="1" title="${escapeHtml(t.newFolderTitle)}" aria-label="${escapeHtml(t.newFolderTitle)}">${plusIco}</button>`
      + '</div>';
    if(folderRows.length){
      html += '<div class="fs-sep"></div>'
        + folderRows.map(r=>
            `<button type="button" class="fs-item" role="option" data-val="${escapeHtml(r.val)}" style="--fs-depth:${r.depth}">${folderIco}<span class="fs-itext">${escapeHtml(r.label)}</span></button>`
          ).join('');
    }
    menu.innerHTML = html;
  }
  function doMsMove(v){
    if(!clientCan('folderMove')) return;
    const target = v===''?null:v;
    const picked=files.filter(f=>f.picked); if(!picked.length){ refreshMsMove(); return; }
    picked.forEach(f=>{ f.folderId=target; f.picked=false; });
    renderAll();
  }

  // ---- per-card "move to folder": one empty .fs-menu per card, opened/positioned via CSS (zoom-safe) ----
  const cmFolderIco='<svg class="fs-mico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>';
  const cmNoneIco='<svg class="fs-mico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.69.9H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';
  const cmPlusIco='<svg class="fs-mico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/><path d="M12 10v6"/><path d="M9 13h6"/></svg>';
  function cardMenuItemsHtml(currentId){
    const rows=[];
    const walk=(parentId,depth)=>{ folders.filter(f=>(f.parentId||null)===parentId).forEach(fo=>{ rows.push({val:fo.id,label:fo.name,depth}); walk(fo.id,depth+1); }); };
    walk(null,0);
    let html='<div class="fs-nonerow">'
      + `<button type="button" class="fs-item none${currentId==null?' on':''}" role="option" data-val="" style="--fs-depth:0">${cmNoneIco}<span class="fs-itext">${escapeHtml(t.unsorted)}</span></button>`
      + `<button type="button" class="fs-newbtn" data-newfolder="1" title="${escapeHtml(t.newFolderTitle)}" aria-label="${escapeHtml(t.newFolderTitle)}">${cmPlusIco}</button>`
      + '</div>';
    if(rows.length){
      html+='<div class="fs-sep"></div>'
        + rows.map(r=>`<button type="button" class="fs-item${r.val===currentId?' on':''}" role="option" data-val="${escapeHtml(r.val)}" style="--fs-depth:${r.depth}">${cmFolderIco}<span class="fs-itext">${escapeHtml(r.label)}</span></button>`).join('');
    }
    return html;
  }
  function closeAllCardMenus(){
    document.querySelectorAll('.cardmove-menu:not([hidden])').forEach(m=>{ m.hidden=true; m.classList.remove('up'); });
    document.querySelectorAll('.cardmove.open').forEach(b=>{ b.classList.remove('open'); b.setAttribute('aria-expanded','false'); });
    document.querySelectorAll('.fcard.cm-open').forEach(c=>c.classList.remove('cm-open'));
  }
  function toggleCardMove(trigger){
    const wrap=trigger.closest('.cardmovewrap'); if(!wrap) return;
    const menu=wrap.querySelector('.cardmove-menu'); if(!menu) return;
    const wasOpen=!menu.hidden;
    closeAllCardMenus();
    if(wasOpen) return;                                        // a second click on the same trigger just closes it
    const f=fileById(trigger.getAttribute('data-move'));
    menu.innerHTML=cardMenuItemsHtml(f?f.folderId:null);
    menu.hidden=false;
    trigger.classList.add('open'); trigger.setAttribute('aria-expanded','true');
    const card=trigger.closest('.fcard'); if(card) card.classList.add('cm-open');   // .fcard clips overflow; reveal the popup while open
    // flip upward only when the popup won't fit below and there IS room above
    // (getBoundingClientRect + innerHeight share one coordinate space, so this stays correct under body zoom)
    const tr=trigger.getBoundingClientRect(), mh=menu.getBoundingClientRect().height, pad=8;
    if(tr.bottom+6+mh > window.innerHeight-pad && tr.top-6-mh > pad) menu.classList.add('up');
  }
  function cardMoveApply(itemEl){
    const wrap=itemEl.closest('.cardmovewrap'); const trigger=wrap?wrap.querySelector('.cardmove'):null;
    const f=trigger?fileById(trigger.getAttribute('data-move')):null;
    closeAllCardMenus();
    if(!f || !clientCan('folderMove')) return;
    const val=itemEl.getAttribute('data-val'); const target=val===''?null:val;
    const picked=files.filter(x=>x.picked);
    if(picked.length>=2){ askMoveChoice(target,f,picked.length); return; }  // honor the purple multi-select "move all / just this one" prompt
    f.folderId=target; renderAll();
  }
  function cardMoveNewFolder(itemEl){
    if(!clientCan('folderCreate')) return;
    const wrap=itemEl.closest('.cardmovewrap'); const trigger=wrap?wrap.querySelector('.cardmove'):null;
    const f=trigger?fileById(trigger.getAttribute('data-move')):null;
    closeAllCardMenus();
    openFolderModal(null, f?{moveFileId:f.id}:undefined);
  }
  // close any open card folder-menu on an outside click or Escape; arrow keys navigate within an open menu
  document.addEventListener('click',e=>{ if(!e.target.closest('.cardmovewrap')) closeAllCardMenus(); });
  document.addEventListener('keydown',e=>{
    const menu=e.target.closest('.cardmove-menu');
    if(!menu){ if(e.key==='Escape') closeAllCardMenus(); return; }
    const items=[...menu.querySelectorAll('.fs-item')]; if(!items.length) return;
    const i=items.indexOf(document.activeElement);
    if(e.key==='ArrowDown'){ e.preventDefault(); (items[i+1]||items[0]).focus(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); (items[i-1]||items[items.length-1]).focus(); }
    else if(e.key==='Escape'){ e.preventDefault(); const b=menu.closest('.cardmovewrap').querySelector('.cardmove'); closeAllCardMenus(); if(b) b.focus(); }
  });

  // files that move together on a folder drop: the whole management selection when the
  // dragged card is part of it, otherwise just the single dragged card.
  function dragTargets(){
    const d=fileById(draggingId); if(!d) return [];
    return d.picked ? files.filter(f=>f.picked) : [d];
  }

  // move a file to a new position in the master order (relative to a target card)
  function reorderFiles(dragId, targetId, placeAfter){
    if(!clientCan('reorder')) return;
    const from=files.findIndex(f=>f.id===dragId); if(from<0) return;
    const [moved]=files.splice(from,1);
    let to=files.findIndex(f=>f.id===targetId);
    if(to<0){ files.push(moved); return; }
    if(placeAfter) to+=1;
    files.splice(to,0,moved);
  }
  // insertion point: horizontal (left/right) in the grid
  function reorderPlaceAfter(card, e){
    const rect=card.getBoundingClientRect();
    const rtl=document.documentElement.dir==='rtl';
    return rtl ? (e.clientX < rect.left+rect.width/2) : (e.clientX > rect.left+rect.width/2);
  }
  function markReorder(card, placeAfter){
    clearReorderMarks(); card.classList.add('rz');
    const rtl=document.documentElement.dir==='rtl';
    const physRight = rtl ? !placeAfter : placeAfter; // insertion bar on physical side
    card.setAttribute('data-rz-side', physRight?'r':'l');
  }
  function clearReorderMarks(){ document.querySelectorAll('.fcard.rz').forEach(n=>{ n.classList.remove('rz'); n.removeAttribute('data-rz-side'); }); }

  // =====================================================
  //  I18N + THEME
  // =====================================================
  function applyLang(l){
    lang=l; t=I18N[l];
    document.documentElement.lang=l; document.documentElement.dir=t.dir;
    document.querySelectorAll('[data-i18n]').forEach(n=>{ const k=n.getAttribute('data-i18n'); if(typeof t[k]==='string') n.textContent=t[k]; });
    document.querySelectorAll('[data-i18n-ph]').forEach(n=>{ const k=n.getAttribute('data-i18n-ph'); if(typeof t[k]==='string') n.setAttribute('placeholder',t[k]); });
    document.querySelectorAll('[data-i18n-title]').forEach(n=>{ const k=n.getAttribute('data-i18n-title'); if(typeof t[k]==='string') n.setAttribute('title',t[k]); });
    document.querySelectorAll('[data-i18n-aria]').forEach(n=>{ const k=n.getAttribute('data-i18n-aria'); if(typeof t[k]==='string') n.setAttribute('aria-label',t[k]); });
    applyPageTitle();  // client view keeps the project name after the generic i18n pass resets the heading
    try{ localStorage.setItem('ac_lang', l); }catch(_){}
    renderAll();
    if(el('selDoneOverlay').classList.contains('show')) renderSelDone();
  }
  function applyTheme(th){
    const dark=(th==='dark');
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
    el('themeIco').textContent = dark?'☀️':'🌙';
    try{ localStorage.setItem('theme', dark?'dark':'light'); }catch(_){}
  }

  // =====================================================
  //  INIT
  // =====================================================
  (async function init(){
    let th='light'; try{ th=localStorage.getItem('theme')||'light'; }catch(_){}
    applyTheme(th);
    albumMgr = loadAlbumMgr(); // safe here: AM_DEFAULT const is initialized by now
    const isNewProject=/[?&]new=1/.test(location.search);
    let gz=null; try{ gz=localStorage.getItem('ac_grid'); }catch(_){}
    // Fresh project (arriving via "+ New project"), or first-ever visit with no
    // saved preference → default to 6 cards per row on desktop. Otherwise honour
    // the size the user last dialled in.
    if(isNewProject || !gz){
      const d=defaultGridSize();
      if(d>+el('zoomRange').max) el('zoomRange').max=String(d); // ultra-wide: let the slider reach the 6-col size
      applyGrid(d);   // sets slider value, --card-size, persists ac_grid and +/- disabled state
    } else {
      applyGrid(+gz);
    }
    let sm=null; try{ sm=localStorage.getItem('ac_showmoved'); }catch(_){}
    showMovedInMain=(sm!=='0');
    el('showMovedChk').checked=showMovedInMain;
    bindStatic();
    initSavePill();
    await hydrateGallery();
    let sl='he'; try{ sl=localStorage.getItem('ac_lang')||'he'; }catch(_){}
    applyLang(sl);
    applyPreviewMode();
    startOwnerSelectionWatch();
    // Arriving from the dashboard "+ New project" — open album settings on a blank
    // form and strip the flag so a refresh doesn't reopen it.
    if(/[?&]new=1/.test(location.search)){
      openSettings(true);
      try{ history.replaceState(null,'',location.pathname); }catch(_){}
    }
  })();
})();
</script>
<div id="selToast" class="seltoast" role="status" aria-live="polite"></div>
</body>
