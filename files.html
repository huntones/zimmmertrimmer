<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AudioCut — סידור קבצים</title>
<meta name="description" content="Organize, sort and tag your media files. Images, video, audio and documents — all in your browser. Nothing gets uploaded.">
<style>
  :root {
    --bg:#eef0f6; --panel:#ffffff; --panel-2:#f5f6fa; --line:#e5e8f0; --line-2:#eef0f6;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#7c3aed; --accent-dim:#6a2fe0; --accent-ink:#ffffff; --accent-soft:#efe9fe;
    --success:#22b04b; --success-dim:#1c9a41; --success-soft:#e6f6ec;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --danger:#e5484d; --danger-soft:#fdecec;
    --warm-soft:#fff5da; --warm-line:#f2d98a;
    --ok:#22b04b; --warn:#c88a04; --err:#e5484d;
    --grad:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-h:linear-gradient(105deg,#6a29e6 0%,#2f74f0 100%);
    --grad-soft:linear-gradient(120deg,#efe9fe,#e6f0ff);
    --grad-shadow:rgba(93,79,240,0.30);
    --grad-btn:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn-glow:rgba(59,111,246,0.38);
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-lg:0 2px 6px rgba(20,24,44,0.05), 0 20px 50px rgba(20,24,44,0.10);
    --shadow-sm:0 1px 2px rgba(20,24,44,0.05);
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --sans:'Space Grotesk',system-ui,'Segoe UI','Heebo',sans-serif;
    --card-size:170px;
  }
  html[data-theme="dark"] {
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a303c; --line-2:#232833;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --accent:#a06bff; --accent-dim:#7c3aed; --accent-ink:#ffffff; --accent-soft:#241a3a;
    --success:#37c26a; --success-dim:#2fae5e; --success-soft:#132a1c;
    --info:#5b95f8; --info-dim:#4f8ef7; --info-soft:#182338;
    --danger:#ff6b6b; --danger-soft:#2a1719;
    --warm-soft:#2c2718; --warm-line:#5a4d24;
    --ok:#4ec98a; --warn:#e8b84b; --err:#ff6b6b;
    --grad:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-h:linear-gradient(105deg,#9a63ff 0%,#6aa2ff 100%);
    --grad-soft:linear-gradient(120deg,#1c1633,#11242a);
    --grad-shadow:rgba(77,123,255,0.42);
    --grad-btn:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn-glow:rgba(77,123,255,0.45);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,0.45), 0 24px 60px rgba(0,0,0,0.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;
    zoom:1.2;} /* proportional scale of the whole page - text, elements & spacing. tweak this one number. */
  #site-header{zoom:.833333;} /* keep the shared KOLKLI header at its normal size (cancels the body zoom = 1/1.2) */
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:var(--grad);z-index:100;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--sans);}
  .wrap{max-width:75%;margin:0 auto;padding:26px 20px 60px;}

  /* ---------- header ---------- */
  .topbar{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .logo{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    background:var(--grad);color:#fff;box-shadow:0 4px 12px var(--grad-shadow);flex-shrink:0;}
  .brand .logo svg{width:22px;height:22px;}
  .brand h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-0.01em;line-height:1.1;}
  .brand .tag{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:0.02em;margin-top:1px;}
  .toolbtns{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .pillbtn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:999px;
    background:var(--panel);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;font-size:13.5px;
    box-shadow:var(--shadow-sm);transition:border-color .12s,transform .08s,background .12s;}
  .pillbtn:hover{border-color:var(--accent);}
  .pillbtn:active{transform:scale(0.97);}
  .iconbtn{width:38px;height:38px;padding:0;justify-content:center;font-size:16px;line-height:1;}
  .pillbtn svg{width:15px;height:15px;}
  .cta{display:inline-flex;align-items:center;gap:8px;color:#fff;border:none;cursor:pointer;height:38px;padding:0 18px;border-radius:999px;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:600;font-size:13.5px;text-shadow:0 1px 2px rgba(0,0,0,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.14),0 6px 16px var(--grad-btn-glow);
    transition:filter .14s,transform .08s;}
  .cta:hover{filter:brightness(1.05);} .cta:active{transform:translateY(1px);}
  .cta svg{width:15px;height:15px;}

  /* ---------- page intro ---------- */
  .pagehead{margin:4px 0 18px;}
  .pagehead h2{font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:-0.02em;margin:0 0 6px;}
  .pagehead .kick{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border:1px solid transparent;
    padding:4px 11px;border-radius:999px;margin-bottom:11px;}
  .pagehead p{font-size:14.5px;color:var(--muted);margin:0;max-width:64ch;}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:12px 14px;box-shadow:var(--shadow-sm);margin-bottom:16px;}
  .search{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    padding:0 12px;height:40px;flex:1 1 240px;min-width:180px;}
  .search svg{width:16px;height:16px;color:var(--faint);flex-shrink:0;}
  .search input{border:none;background:none;outline:none;color:var(--ink);font-family:var(--sans);font-size:14px;width:100%;}
  .zoom{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-family:var(--mono);white-space:nowrap;}
  .zoom input[type=range]{accent-color:var(--accent);width:118px;cursor:pointer;}
  .zbtn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;flex:0 0 auto;
    border-radius:7px;cursor:pointer;font-size:16px;font-weight:700;line-height:1;
    background:var(--panel);border:1px solid var(--line);color:var(--ink-2);transition:all .12s;user-select:none;}
  .zbtn:hover{border-color:var(--accent);color:var(--accent);}
  .zbtn:active{background:var(--accent-soft);}
  .zbtn:disabled{opacity:.4;cursor:default;border-color:var(--line);color:var(--ink-2);}
  .toolchk{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-family:var(--mono);white-space:nowrap;cursor:pointer;user-select:none;}
  .toolchk input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer;flex-shrink:0;}
  .selbar{display:flex;align-items:center;gap:9px;margin-inline-start:auto;flex-wrap:wrap;}
  .selcount{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap;}
  .selcount b{color:var(--accent-dim);font-size:15px;font-weight:700;}
  html[data-theme="dark"] .selcount b{color:var(--accent);}
  /* purple multi-select (batch) toolbar group */
  .msgroup{display:inline-flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .msgroup[hidden]{display:none;}
  .mscount b{color:var(--accent-dim);}
  html[data-theme="dark"] .mscount b{color:var(--accent);}
  .msmovesel{height:38px;padding:0 12px;font-size:13px;color:var(--muted);background:var(--panel-2);
    border:1px solid var(--line);border-radius:999px;cursor:pointer;transition:border-color .12s;}
  .msmovesel:hover:not(:disabled){border-color:var(--accent);}
  .msmovesel:focus{outline:none;border-color:var(--accent);}
  .msmovesel:disabled{opacity:.5;cursor:not-allowed;}
  .btnline{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:999px;cursor:pointer;
    font-size:13px;font-weight:600;background:var(--panel);border:1px solid var(--line);color:var(--ink-2);transition:all .12s;}
  .btnline:hover{border-color:var(--accent);}
  .btnline svg{width:14px;height:14px;}
  .btnline.danger{color:var(--danger);border-color:var(--danger);}
  .btnline.danger:hover{background:var(--danger-soft);}
  .btnline:disabled{opacity:.45;cursor:not-allowed;}
  .btnline:disabled:hover{border-color:var(--line);color:var(--ink-2);background:var(--panel);}
  .btnline.dlbtn{color:#fff;border:none;text-shadow:0 1px 2px rgba(0,0,0,.18);
    background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--grad-btn);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 16px var(--grad-btn-glow);}
  .btnline.dlbtn:hover{filter:brightness(1.05);border:none;}
  .btnline.dlbtn:disabled{opacity:.5;cursor:not-allowed;filter:none;}
  .btnline.dlbtn:disabled:hover{filter:none;}
  .bottombar{display:flex;justify-content:center;margin-top:34px;}
  .btnline.dlbtn.dlbtn-lg{height:48px;padding:0 28px;font-size:15px;}
  .btnline.dlbtn-lg svg{width:17px;height:17px;}

  /* ---------- layout ---------- */
  .organizer{display:grid;grid-template-columns:236px 1fr;gap:18px;align-items:start;}
  @media (max-width:820px){ .organizer{grid-template-columns:1fr;} }

  /* ---------- sidebar / folders ---------- */
  .side{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);position:sticky;top:16px;}
  .side .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .side .sh b{font-size:13px;}
  .side .addf{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--accent);
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;}
  .side .addf:hover{border-color:var(--accent);background:var(--accent-soft);}
  .side .addf svg{width:16px;height:16px;}
  .folders{display:flex;flex-direction:column;gap:3px;}
  .fitem{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:13.5px;color:var(--ink-2);
    transition:background .12s;border:1px solid transparent;}
  .fitem:hover{background:var(--panel-2);}
  .fitem.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-dim);font-weight:600;}
  .fitem.dragover{background:var(--accent-soft);border-color:var(--accent);border-style:dashed;}
  .fitem .fi-ic{width:17px;height:17px;flex-shrink:0;color:var(--muted);}
  .fitem.on .fi-ic{color:var(--accent);}
  .fitem .fi-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fitem .fi-count{font-family:var(--mono);font-size:11px;color:var(--faint);}
  .fitem .fi-act{display:none;gap:2px;}
  .fitem:hover .fi-act{display:flex;}
  .fitem .fi-act button{background:none;border:none;color:var(--faint);cursor:pointer;padding:2px;border-radius:5px;line-height:0;}
  .fitem .fi-act button:hover{color:var(--accent);background:var(--panel);}
  .fitem .fi-act button.del:hover{color:var(--danger);}
  .fitem .fi-act svg{width:13px;height:13px;}
  .fitem .fi-tw{width:15px;height:15px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .fitem .fi-tw .tw{background:none;border:none;padding:0;margin:0;line-height:0;cursor:pointer;color:var(--faint);
    display:flex;transition:transform .15s ease,color .12s;transform:rotate(-90deg);}
  .fitem .fi-tw .tw.open{transform:rotate(0deg);}
  html[dir="rtl"] .fitem .fi-tw .tw{transform:rotate(90deg);}
  html[dir="rtl"] .fitem .fi-tw .tw.open{transform:rotate(0deg);}
  .fitem .fi-tw .tw svg{width:13px;height:13px;}
  .fitem .fi-tw .tw:hover{color:var(--accent);}
  .fitem.dragging{opacity:.45;}

  /* ---------- main / dropzone ---------- */
  .main{min-width:0;}
  .drop{border:1.6px dashed var(--line);border-radius:16px;padding:26px 20px;text-align:center;cursor:pointer;
    background:var(--panel-2);transition:border-color .15s,background .15s;margin-bottom:16px;}
  .drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);}
  .drop .cloud{width:48px;height:48px;margin:0 auto 10px;border-radius:14px;display:flex;align-items:center;
    justify-content:center;background:var(--accent-soft);color:var(--accent);}
  .drop .cloud svg{width:24px;height:24px;}
  .drop .big{font-size:15px;font-weight:600;color:var(--ink);}
  .drop .or{font-size:12px;color:var(--faint);margin:6px 0;font-family:var(--mono);}
  .drop .choose{display:inline-flex;align-items:center;gap:8px;color:#fff;border:none;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:600;font-size:13.5px;padding:10px 22px;border-radius:999px;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.14),0 6px 16px var(--grad-btn-glow);transition:filter .14s,transform .08s;}
  .drop .choose:hover{filter:brightness(1.05);} .drop .choose:active{transform:translateY(1px);}
  .drop .dfmts{margin-top:12px;font-size:11.5px;color:var(--faint);font-family:var(--mono);}
  .drop .sizenote{margin-top:6px;font-size:11.5px;color:var(--faint);font-family:var(--mono);}
  input[type=file]{display:none;}

  /* ---------- file grid ---------- */
  .filegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card-size),1fr));gap:14px;}
  .fcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);
    transition:transform .14s,border-color .14s,box-shadow .14s;display:flex;flex-direction:column;}
  .fcard:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow-lg);}
  .fcard.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent),var(--shadow);}
  /* purple check alone (management multi-select, not the green album pick): slight darkening */
  .fcard.picked:not(.sel) .fthumb::after,.fcard.picked:not(.sel) .frow-thumb::after{content:'';position:absolute;inset:0;background:rgba(6,8,16,.30);z-index:1;pointer-events:none;}
  .fthumb{position:relative;aspect-ratio:1/1;background:var(--panel-2);display:flex;align-items:center;justify-content:center;
    overflow:hidden;cursor:pointer;}
  .fthumb img,.fthumb video{width:100%;height:100%;object-fit:cover;display:block;}
  .fthumb .ph{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--accent);}
  .fthumb .ph svg{width:34%;height:34%;max-width:56px;max-height:56px;opacity:.85;}
  .fthumb .ph.img{color:var(--info);} .fthumb .ph.video{color:#e5484d;}
  .fthumb .ph.audio{color:var(--accent);} .fthumb .ph.pdf{color:#e5484d;} .fthumb .ph.doc{color:var(--info-dim);}
  .fthumb .ph .pext{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.05em;}
  /* video film-strip: dark perforated rails down both sides mark the thumb as a video — no play button needed */
  .fthumb .filmstrip{position:absolute;inset:0;z-index:3;pointer-events:none;}
  .fthumb .filmstrip::before,.fthumb .filmstrip::after{content:'';position:absolute;top:0;bottom:0;width:14px;
    background-color:#141417;background-image:linear-gradient(to bottom,#e9e9ec 0 6px,transparent 6px 12px);
    background-size:7px 12px;background-position:center 3px;background-repeat:repeat-y;}
  .fthumb .filmstrip::before{left:0;box-shadow:1px 0 0 rgba(0,0,0,.25);}
  .fthumb .filmstrip::after{right:0;box-shadow:-1px 0 0 rgba(0,0,0,.25);}
  /* ---------- centered selection circle: empty when unselected, green + check when selected ---------- */
  .fcheck{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;
    border:2.5px solid rgba(255,255,255,.9);background:rgba(10,12,20,.22);cursor:pointer;
    display:flex;align-items:center;justify-content:center;z-index:5;box-shadow:0 2px 9px rgba(0,0,0,.35);opacity:.6;
    transition:opacity .14s,background .14s,border-color .14s,transform .12s;}
  .fcheck svg{width:26px;height:26px;color:#fff;opacity:0;transition:opacity .12s;}
  .fthumb:hover .fcheck{opacity:1;}
  .fcheck:hover{background:rgba(10,12,20,.5);transform:translate(-50%,-50%) scale(1.07);}
  .fcard.sel .fcheck{opacity:1;background:var(--success);border-color:#fff;box-shadow:0 3px 14px rgba(34,176,75,.55);}
  .fcard.sel .fcheck svg{opacity:1;}
  .fcard.sel .fcheck:hover{background:var(--success-dim);transform:translate(-50%,-50%) scale(1.07);}
  /* ---------- hover: darken the thumb and reveal the file name along the bottom ---------- */
  .fthumb::before{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .16s;
    background:linear-gradient(to top,rgba(6,8,16,.82) 0%,rgba(6,8,16,.32) 34%,rgba(6,8,16,.10) 60%,rgba(6,8,16,.16) 100%);}
  .fcard:not(.locked) .fthumb:hover::before{opacity:1;}
  .fname-ov{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:16px 11px 9px;font-size:11.5px;font-weight:600;
    color:#fff;line-height:1.3;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-shadow:0 1px 3px rgba(0,0,0,.7);opacity:0;transform:translateY(5px);transition:opacity .16s,transform .16s;}
  .fthumb:hover .fname-ov{opacity:1;transform:none;}
  /* ---------- order number + drag-to-reorder ---------- */
  .fnum{position:absolute;top:8px;inset-inline-start:8px;z-index:4;height:24px;min-width:32px;padding:0 8px;
    display:flex;align-items:center;justify-content:center;border-radius:7px;font-family:var(--mono);
    font-size:11.5px;font-weight:700;letter-spacing:.04em;color:#fff;cursor:grab;
    background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 60%),var(--grad-btn);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 7px rgba(0,0,0,.3);}
  .fcard.locked .fnum{inset-inline-start:8px;cursor:default;filter:saturate(.55) brightness(.9);}
  .fcard.dragging{opacity:.4;}
  .fcard.rz::after{content:'';position:absolute;top:6%;bottom:6%;width:3px;border-radius:3px;background:var(--accent);
    z-index:6;box-shadow:0 0 9px 1px var(--accent);}
  .fcard.rz[data-rz-side="l"]::after{left:0;} .fcard.rz[data-rz-side="r"]::after{right:0;}
  /* caption field — replaces the file-size line; its text feeds the ZIP file names */
  .fmeta{padding:9px 11px 11px;display:flex;flex-direction:column;gap:8px;}
  .fmeta .fn{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fmeta .fsub{font-family:var(--mono);font-size:10.5px;color:var(--faint);display:flex;gap:8px;}
  .fcap{width:100%;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
    border-radius:8px;font-family:var(--sans);font-size:12px;padding:7px 9px;transition:border-color .12s,background .12s;}
  .fcap:focus{outline:none;border-color:var(--accent);background:var(--panel);}
  .fcap::placeholder{color:var(--faint);}
  .fcapview{font-size:11.5px;color:var(--muted);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .facts{display:flex;align-items:center;gap:5px;}
  .facts .ab{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;}
  .facts .ab:hover{border-color:var(--accent);color:var(--accent);}
  .facts .ab.del:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft);}
  .facts .ab svg{width:15px;height:15px;}
  /* purple Multi-Select checkbox in card actions - independent of the green favorite circle */
  .facts .ab.pick svg,.frow-acts .ab.pick svg{opacity:0;transition:opacity .1s;color:var(--accent);}
  .facts .ab.pick:hover,.frow-acts .ab.pick:hover{border-color:var(--accent);background:var(--accent-soft);}
  .facts .ab.pick:hover svg,.frow-acts .ab.pick:hover svg{opacity:.5;}
  .facts .ab.pick.on,.frow-acts .ab.pick.on{background:var(--accent);border-color:var(--accent);box-shadow:0 2px 8px var(--grad-shadow);}
  .facts .ab.pick.on svg,.frow-acts .ab.pick.on svg{opacity:1;color:#fff;}
  .facts .ab.pick.on:hover,.frow-acts .ab.pick.on:hover{background:var(--accent-dim);border-color:var(--accent-dim);}
  .facts .movesel{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);border-radius:8px;
    font-family:var(--mono);font-size:11px;padding:6px 6px;cursor:pointer;height:30px;}
  .facts .movesel:focus{outline:none;border-color:var(--accent);}

  /* ---------- locked (assigned) card — shown but unavailable in "all files" ---------- */
  .fcard.locked{cursor:default;}
  .fcard.locked:hover{transform:none;border-color:var(--line);box-shadow:var(--shadow);}
  .fcard.locked .fthumb{cursor:default;}
  .fcard.locked .fthumb img,.fcard.locked .fthumb video,.fcard.locked .fthumb .ph{filter:grayscale(.45) brightness(.5);}
  .fcard.locked .fthumb::after{content:'';position:absolute;inset:0;background:rgba(6,8,16,.42);z-index:1;pointer-events:none;}
  .lockbadge{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:9px;color:#fff;pointer-events:none;}
  .lockbadge .noentry{width:46px;height:46px;border-radius:50%;border:2.5px solid #fff;background:rgba(229,72,77,.32);
    display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(0,0,0,.45);}
  .lockbadge .noentry svg{width:26px;height:26px;color:#fff;}
  .lockbadge .lockfolder{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    background:rgba(10,12,20,.72);padding:3px 10px;border-radius:999px;}
  .fassigned{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent-dim);
    background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:7px 9px;overflow:hidden;}
  .fassigned svg{width:14px;height:14px;flex-shrink:0;color:var(--accent);}
  .fassigned span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ---------- view toggle (grid / list) ---------- */
  .viewtoggle{display:inline-flex;align-items:center;gap:2px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:10px;padding:3px;}
  .viewtoggle .vbtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:30px;border-radius:8px;
    border:none;background:none;color:var(--muted);cursor:pointer;transition:background .12s,color .12s;}
  .viewtoggle .vbtn svg{width:17px;height:17px;}
  .viewtoggle .vbtn:hover{color:var(--accent);}
  .viewtoggle .vbtn.on{background:var(--panel);color:var(--accent);box-shadow:var(--shadow-sm);}

  /* ---------- list view (rows) ---------- */
  .filelist{display:flex;flex-direction:column;gap:8px;}
  .filelist .fcard{position:relative;flex-direction:row;align-items:center;gap:12px;border-radius:12px;
    padding:8px 12px;overflow:visible;}
  .filelist .fcard:hover{transform:none;border-color:var(--accent);box-shadow:var(--shadow);}
  .filelist .fcard.locked:hover{border-color:var(--line);box-shadow:var(--shadow);}
  .frow-num{flex:0 0 auto;height:24px;min-width:34px;padding:0 8px;display:flex;align-items:center;justify-content:center;
    border-radius:7px;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.04em;color:#fff;cursor:grab;
    background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 60%),var(--grad-btn);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 7px rgba(0,0,0,.25);}
  .fcard.locked .frow-num{cursor:default;filter:saturate(.55) brightness(.9);}
  .frow-check{flex:0 0 auto;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:var(--panel-2);
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .12s,background .12s;}
  .frow-check svg{width:14px;height:14px;color:#fff;opacity:0;transition:opacity .12s;}
  .frow-check:hover{border-color:var(--accent);}
  .fcard.sel .frow-check{background:var(--success);border-color:var(--success);}
  .fcard.sel .frow-check svg{opacity:1;}
  .frow-check.locked-ic{border:none;background:none;cursor:default;}
  .frow-check.locked-ic svg{width:19px;height:19px;color:var(--danger);opacity:1;}
  .frow-thumb{flex:0 0 auto;width:46px;height:46px;border-radius:9px;overflow:hidden;background:var(--panel-2);
    display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;}
  .frow-thumb img,.frow-thumb video{width:100%;height:100%;object-fit:cover;display:block;}
  .frow-thumb .ph{display:flex;align-items:center;justify-content:center;}
  .frow-thumb .ph svg{width:22px;height:22px;opacity:.9;}
  .frow-thumb .ph .pext{display:none;}
  .frow-thumb .filmstrip{display:none;}
  .frow-thumb .ph.img{color:var(--info);} .frow-thumb .ph.video{color:#e5484d;}
  .frow-thumb .ph.audio{color:var(--accent);} .frow-thumb .ph.pdf{color:#e5484d;} .frow-thumb .ph.doc{color:var(--info-dim);}
  .fcard.locked .frow-thumb{cursor:default;}
  .fcard.locked .frow-thumb img,.fcard.locked .frow-thumb video,.fcard.locked .frow-thumb .ph{filter:grayscale(.5) brightness(.7);}
  .frow-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:5px;}
  .frow-name{font-size:13px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}
  .frow-name:hover{color:var(--accent);}
  .fcard.locked .frow-name{cursor:default;}
  .fcard.locked .frow-name:hover{color:var(--ink);}
  .filelist .fcap{max-width:340px;}
  .filelist .fcapview{margin:0;}
  .frow-meta{flex:0 0 auto;min-width:104px;text-align:end;font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap;}
  .frow-acts{flex:0 0 auto;display:flex;align-items:center;gap:6px;}
  .frow-acts .ab{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;}
  .frow-acts .ab:hover{border-color:var(--accent);color:var(--accent);}
  .frow-acts .ab.del:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft);}
  .frow-acts .ab svg{width:15px;height:15px;}
  .frow-acts .movesel{width:124px;height:30px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
    border-radius:8px;font-family:var(--mono);font-size:11px;padding:0 6px;cursor:pointer;}
  .frow-acts .movesel:focus{outline:none;border-color:var(--accent);}
  .frow-acts .fassigned{margin:0;}
  /* list reorder insertion bar (horizontal) */
  .filelist .fcard.rz::after{content:'';position:absolute;top:auto;bottom:auto;left:2%;right:2%;width:auto;height:3px;
    border-radius:3px;background:var(--accent);z-index:6;box-shadow:0 0 9px 1px var(--accent);}
  .filelist .fcard.rz[data-rz-side="t"]::after{top:-6px;}
  .filelist .fcard.rz[data-rz-side="b"]::after{bottom:-6px;}
  @media (max-width:640px){
    .filelist .fcap{display:none;}
    .frow-meta{display:none;}
    .frow-acts .movesel{width:96px;}
  }

  /* ---------- empty state ---------- */
  .empty{text-align:center;padding:60px 20px;color:var(--muted);}
  .empty .ei{width:64px;height:64px;margin:0 auto 16px;border-radius:18px;display:flex;align-items:center;justify-content:center;
    background:var(--grad-soft);color:var(--accent);}
  .empty .ei svg{width:32px;height:32px;}
  .empty h3{margin:0 0 6px;font-size:16px;color:var(--ink);}
  .empty p{margin:0;font-size:13.5px;}

  /* ---------- modals ---------- */
  .overlay{position:fixed;inset:0;background:rgba(10,12,20,0.62);display:none;align-items:center;justify-content:center;
    padding:20px;z-index:60;}
  .overlay.show{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:460px;width:100%;
    padding:24px;box-shadow:var(--shadow-lg);}
  .modal h3{margin:0 0 12px;font-size:17px;}
  .modal p{font-size:13.5px;color:var(--muted);margin:0 0 10px;line-height:1.6;}
  .modal .minput{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;
    font-family:var(--sans);font-size:14px;padding:11px 13px;margin-top:6px;}
  .modal .minput:focus{outline:none;border-color:var(--accent);}
  .modal .chkline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:14px;cursor:pointer;}
  .modal .chkline input{accent-color:var(--accent);width:15px;height:15px;}
  .modal .mactions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .modal .mbtn{flex:1;min-width:96px;padding:12px 14px;border-radius:999px;font-weight:600;font-size:13.5px;cursor:pointer;
    font-family:inherit;transition:filter .14s,transform .08s,background .12s;border:1px solid var(--line);}
  .modal .mbtn:active{transform:translateY(1px);}
  .modal .mbtn.ghost{background:var(--panel);color:var(--ink);}
  .modal .mbtn.ghost:hover{background:var(--panel-2);}
  .modal .mbtn.primary{border:none;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.18);
    background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--grad-btn);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 16px var(--grad-btn-glow);}
  .modal .mbtn.primary:hover{filter:brightness(1.05);}
  .modal .mbtn.danger{border:none;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.18);
    background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,0) 55%),var(--danger);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 16px rgba(229,72,77,.32);}
  .modal .mbtn.danger:hover{filter:brightness(1.05);}
  .modal .mactions.col{flex-direction:column;flex-wrap:nowrap;}
  .modal .mactions.col .mbtn{flex:none;width:100%;}
  .modal.movemodal{position:relative;}
  .modal.movemodal h3{padding-inline-end:34px;}
  .mclose{position:absolute;top:16px;inset-inline-end:16px;width:32px;height:32px;padding:0;border-radius:9px;
    background:var(--panel-2);border:1px solid var(--line);color:var(--muted);cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s;}
  .mclose:hover{background:var(--line);color:var(--ink);}
  .mclose svg{width:17px;height:17px;}

  /* ---------- preview modal ---------- */
  .pvoverlay{position:fixed;inset:0;background:rgba(6,8,16,0.86);display:none;flex-direction:column;z-index:70;padding:0;}
  .pvoverlay.show{display:flex;}
  .pvbar{display:flex;align-items:center;gap:12px;padding:14px 18px;color:#fff;}
  .pvbar .pvt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:14.5px;}
  .pvbar .pvsub2{font-family:var(--mono);font-size:11.5px;color:rgba(255,255,255,.6);}
  .pvbar button{background:rgba(255,255,255,.12);border:none;color:#fff;cursor:pointer;border-radius:10px;padding:9px 14px;
    font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:background .12s;}
  .pvbar button:hover{background:rgba(255,255,255,.22);}
  .pvbar button svg{width:15px;height:15px;}
  .pvbody{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 20px 26px;min-height:0;}
  .pvbody img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5);}
  .pvbody video{max-width:100%;max-height:100%;border-radius:8px;background:#000;}
  .pvbody iframe{width:min(920px,100%);height:100%;border:none;border-radius:8px;background:#fff;}
  .pvbody .pvaudio{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px;text-align:center;}
  .pvbody .pvaudio .aic{width:76px;height:76px;margin:0 auto 18px;border-radius:20px;background:var(--grad-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;}
  .pvbody .pvaudio .aic svg{width:40px;height:40px;}
  .pvbody .pvaudio audio{width:100%;margin-top:8px;}
  .pvbody .pvnone{color:#fff;text-align:center;}
  .pvbody .pvnone .ni{width:80px;height:80px;margin:0 auto 16px;border-radius:20px;background:rgba(255,255,255,.08);
    display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.75);}
  .pvbody .pvnone .ni svg{width:40px;height:40px;}
  .pvbody .pvnone p{color:rgba(255,255,255,.7);font-size:14px;}

  /* ---------- client settings (gear) button ---------- */
  .btnline.gearbtn{color:var(--accent-dim);border-color:var(--accent-soft);background:var(--accent-soft);}
  .btnline.gearbtn:hover{border-color:var(--accent);}
  html[data-theme="dark"] .btnline.gearbtn{color:var(--accent);}
  .btnline.gearbtn svg{transition:transform .35s ease;}
  .btnline.gearbtn:hover svg{transform:rotate(60deg);}

  /* ---------- client settings modal ---------- */
  .modal.clientmodal{max-width:560px;max-height:88vh;overflow-y:auto;position:relative;}
  .modal.clientmodal h3{padding-inline-end:34px;}
  .csec{margin-top:20px;}
  .csec-h{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:13px;}
  .csec-h::after{content:'';flex:1;height:1px;background:var(--line);}
  .cgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px 14px;}
  .cfield{display:flex;flex-direction:column;gap:6px;min-width:0;}
  .cfield.full{grid-column:1 / -1;}
  .cfield label{font-size:12px;color:var(--muted);font-weight:600;}
  .cfield input,.cfield select{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;font-family:var(--sans);font-size:13.5px;padding:10px 12px;}
  .cfield input:focus,.cfield select:focus{outline:none;border-color:var(--accent);}
  .permlist{display:flex;flex-direction:column;}
  .permrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line-2);
    cursor:pointer;user-select:none;}
  .permrow .pl{flex:1;min-width:0;}
  .permrow .pl b{display:block;font-size:13.5px;font-weight:600;color:var(--ink);}
  .permrow .pl small{font-size:11.5px;color:var(--faint);line-height:1.35;}
  .permrow.disabled{opacity:.42;pointer-events:none;}
  .permrow.viewonly{margin-top:8px;background:var(--warm-soft);border:1px solid var(--warm-line);
    border-radius:11px;padding:12px 13px;}
  .switch{position:relative;width:40px;height:23px;flex-shrink:0;}
  .switch input{position:absolute;opacity:0;width:0;height:0;}
  .switch .track{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .16s;}
  .switch .track::before{content:'';position:absolute;top:3px;inset-inline-start:3px;width:17px;height:17px;
    border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .16s;}
  .switch input:checked + .track{background:var(--accent);}
  html[dir="ltr"] .switch input:checked + .track::before{transform:translateX(17px);}
  html[dir="rtl"] .switch input:checked + .track::before{transform:translateX(-17px);}

  /* ---------- album settings modal (tabbed) ---------- */
  .modal.settingsmodal{max-width:min(620px,calc(100vw - 32px));max-height:min(78vh,calc(100vh - 32px));display:flex;flex-direction:column;overflow:hidden;position:relative;padding:0;}
  .setmodal-head{padding:22px 24px 0;}
  .setmodal-head h3{margin:0 0 6px;padding-inline-end:34px;font-size:17px;}
  .setmodal-head p{font-size:13px;color:var(--muted);margin:0;line-height:1.55;}
  .settingsmodal .mclose{top:18px;}
  /* selection-album mode banner */
  .selmode{margin:16px 24px 0;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;cursor:pointer;
    background:var(--grad-soft);border:1px solid var(--accent-soft);transition:border-color .12s;}
  .selmode:hover{border-color:var(--accent);}
  .selmode .sm-ic{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:var(--panel);color:var(--accent);box-shadow:var(--shadow-sm);}
  .selmode .sm-ic svg{width:18px;height:18px;}
  .selmode .sm-tx{flex:1;min-width:0;}
  .selmode .sm-tx b{display:block;font-size:13.5px;color:var(--ink);}
  .selmode .sm-tx small{font-size:11.5px;color:var(--muted);line-height:1.35;}
  /* tab rail */
  .settabs{display:flex;gap:4px;padding:14px 24px 0;overflow-x:auto;flex-shrink:0;}
  .settab{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:10px 10px 0 0;cursor:pointer;
    font-family:inherit;font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted);
    background:none;border:1px solid transparent;border-bottom:none;transition:color .12s,background .12s;}
  .settab svg{width:15px;height:15px;}
  .settab:hover{color:var(--accent);background:var(--panel-2);}
  .settab.on{color:var(--accent);background:var(--accent-soft);border-color:var(--accent-soft);}
  .setbody{flex:1;overflow-y:auto;padding:2px 24px 8px;border-top:1px solid var(--line);}
  .setbody .csec:first-child{margin-top:14px;}
  .setpane{display:none;}
  .setpane.on{display:block;animation:setfade .2s ease;}
  @keyframes setfade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  .settingsmodal .mactions{padding:14px 24px 20px;margin-top:0;border-top:1px solid var(--line);flex-shrink:0;}
  /* fields reused inside panes */
  .cfield textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;
    font-family:var(--sans);font-size:13.5px;padding:10px 12px;resize:vertical;min-height:62px;}
  .cfield textarea:focus{outline:none;border-color:var(--accent);}
  .cfield input[type=color]{padding:4px;height:42px;cursor:pointer;}
  .rangewrap{display:flex;align-items:center;gap:10px;}
  .rangewrap input[type=range]{accent-color:var(--accent);flex:1;cursor:pointer;}
  .rangeval{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:42px;text-align:end;}
  /* storage meter */
  .storbar{height:9px;border-radius:999px;background:var(--line);overflow:hidden;margin:6px 0;}
  .storbar span{display:block;height:100%;border-radius:999px;background:var(--grad);transition:width .3s ease;}
  .storrow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:11px;}
  /* inline action buttons + danger zone */
  .setact{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;cursor:pointer;
    font-size:12.5px;font-weight:600;background:var(--panel);border:1px solid var(--line);color:var(--ink-2);
    transition:all .12s;font-family:inherit;}
  .setact:hover{border-color:var(--accent);color:var(--accent);}
  .setact.ok{border-color:var(--success);color:var(--success);}
  .setact svg{width:14px;height:14px;}
  .setact.danger{color:var(--danger);border-color:var(--danger);}
  .setact.danger:hover{background:var(--danger-soft);}
  .setactrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;}
  .dangerzone{border:1px solid var(--danger);background:var(--danger-soft);border-radius:12px;padding:14px;}
  .dangerzone b{display:block;font-size:13px;color:var(--danger);margin-bottom:4px;}
  .dangerzone small{display:block;font-size:11.5px;color:var(--muted);margin-bottom:11px;line-height:1.4;}

  /* ---------- album manager button + modal ---------- */
  .btnline.ambtn{color:var(--accent-dim);border-color:var(--accent);background:var(--panel);font-weight:600;}
  .btnline.ambtn:hover{background:var(--accent-soft);border-color:var(--accent);}
  html[data-theme="dark"] .btnline.ambtn{color:var(--accent);}
  .modal.ammodal{max-width:min(560px,calc(100vw - 32px));}
  .ampresets{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px;margin-top:12px;}
  .preset{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;text-align:start;
    background:var(--panel-2);border:1px solid var(--line);cursor:pointer;font-family:inherit;
    transition:border-color .12s,background .12s,transform .08s;}
  .preset:hover{border-color:var(--accent);}
  .preset:active{transform:scale(.98);}
  .preset.on{border-color:var(--accent);background:var(--accent-soft);}
  .preset .pr-ic{width:32px;height:32px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:var(--grad);color:#fff;box-shadow:0 3px 8px var(--grad-shadow);}
  .preset .pr-ic svg{width:16px;height:16px;}
  .preset .pr-tx,.preset-new .pr-tx{min-width:0;display:flex;flex-direction:column;gap:2px;}
  .preset .pr-tx b,.preset-new .pr-tx b{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.2;}
  .preset .pr-tx small,.preset-new .pr-tx small{font-size:11px;color:var(--muted);line-height:1.2;}
  /* hover delete affordance on every preset card */
  .preset{position:relative;}
  .preset .pr-del{position:absolute;top:5px;inset-inline-end:5px;width:18px;height:18px;border-radius:6px;border:0;padding:0;
    display:none;align-items:center;justify-content:center;font-size:15px;line-height:1;cursor:pointer;font-family:inherit;
    color:var(--muted);background:var(--panel-2);}
  .preset:hover .pr-del{display:flex;}
  .preset .pr-del:hover{color:#e5484d;background:rgba(229,72,77,.14);}
  /* + create new preset card */
  .preset-new{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;text-align:start;
    background:transparent;border:1px dashed var(--line);cursor:pointer;font-family:inherit;
    transition:border-color .12s,background .12s,transform .08s;}
  .preset-new:hover{border-color:var(--accent);background:var(--accent-soft);}
  .preset-new:active{transform:scale(.98);}
  .preset-new .pr-ic-new{width:32px;height:32px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    border:1.5px dashed var(--accent);color:var(--accent);background:transparent;}
  .preset-new .pr-ic-new svg{width:16px;height:16px;}
  .amnote{margin-top:10px;font-size:11.5px;color:var(--faint);line-height:1.4;}

  /* ---------- share button ---------- */
  .pillbtn.sharebtn{color:var(--accent-dim);border-color:var(--accent-soft);background:var(--accent-soft);font-weight:600;}
  .pillbtn.sharebtn:hover{border-color:var(--accent);}
  html[data-theme="dark"] .pillbtn.sharebtn{color:var(--accent);}
  .pillbtn.sharebtn svg{width:15px;height:15px;}

  /* ---------- share modal ---------- */
  .modal.sharemodal{max-width:480px;max-height:88vh;overflow-y:auto;position:relative;}
  .modal.sharemodal h3{padding-inline-end:34px;text-align:center;}
  .shbox{margin-top:18px;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel-2);}
  .shbox-h{display:flex;align-items:center;justify-content:space-between;gap:10px 12px;flex-wrap:wrap;margin-bottom:11px;}
  .shlabel{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13.5px;color:var(--ink);}
  .shinfo{width:16px;height:16px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:var(--mono);
    font-size:10px;font-weight:700;font-style:normal;display:inline-flex;align-items:center;justify-content:center;cursor:help;}
  .shbox-acts{display:flex;gap:7px;}
  .shbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:9px;cursor:pointer;
    font-size:12.5px;font-weight:600;background:var(--panel);border:1px solid var(--line);color:var(--ink-2);
    transition:all .12s;font-family:inherit;}
  .shbtn:hover{border-color:var(--accent);color:var(--accent);}
  .shbtn svg{width:14px;height:14px;}
  .shbtn.ok{border-color:var(--success);color:var(--success);}
  .shbtn:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line);color:var(--muted);}
  .shlink{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:9px;
    font-family:var(--mono);font-size:12.5px;padding:10px 12px;}
  .shlink:focus{outline:none;border-color:var(--accent);}
  .shblocked-note{margin-top:12px;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--danger);
    background:var(--danger-soft);border:1px solid var(--danger);border-radius:10px;padding:10px 12px;}
  .shblocked-note svg{width:16px;height:16px;flex-shrink:0;}
  .shsec{margin-top:20px;}
  .shsec-h{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:13px;}
  .shsec-h::after{content:'';flex:1;height:1px;background:var(--line);}
  .shfield{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .shfield label{font-size:12px;color:var(--muted);font-weight:600;}
  .shfield input{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;font-family:var(--sans);font-size:13.5px;padding:10px 12px;}
  .shfield input:focus{outline:none;border-color:var(--accent);}
  .mbtn.shsend{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:2px;}
  .mbtn.shsend svg{width:15px;height:15px;}
  .mbtn.shsend:disabled{opacity:.5;cursor:not-allowed;filter:none;}
  .shtoggles{margin-top:20px;border-top:1px solid var(--line);}
  .shpw{padding:2px 4px 12px;}
  .shpw input{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;
    font-family:var(--sans);font-size:13.5px;padding:10px 12px;}
  .shpw input:focus{outline:none;border-color:var(--accent);}
  .sharemodal.blocked .shbox,.sharemodal.blocked .shsec{opacity:.5;pointer-events:none;}

  footer{margin-top:34px;text-align:center;color:var(--faint);font-size:12px;font-family:var(--mono);}
  /* ---------- album-selection quota: dim the GREEN check on cards that already hit the client's limit ---------- */
  .fcard.atcap .fcheck{opacity:.3;cursor:not-allowed;background:rgba(10,12,20,.22);}
  .fcard.atcap .fthumb:hover .fcheck{opacity:.42;}
  .fcard.atcap .fcheck:hover{transform:translate(-50%,-50%);background:rgba(10,12,20,.22);}
  .fcard.atcap .frow-check{opacity:.4;cursor:not-allowed;}
  .fcard.atcap .frow-check:hover{border-color:var(--line);}
  /* frozen album pick after the client confirms "I'm done selecting" */
  .sellock{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:12px;font-weight:700;
    color:var(--success);background:rgba(34,176,75,.13);border:1px solid rgba(34,176,75,.4);
    border-radius:999px;padding:3px 9px;white-space:nowrap;}
  .sellock svg{width:13px;height:13px;}
  .seldone-count{color:var(--ink);font-weight:600;}
  body.sel-locked .fcheck,body.sel-locked .frow-check{cursor:not-allowed;}
  body.sel-locked .fcard:not(.sel) .fcheck{opacity:.15;}
  body.sel-locked .fcard:not(.sel) .fthumb:hover .fcheck{opacity:.2;transform:translate(-50%,-50%);}
  /* ---------- selection-limit toast (brief notice when the client tries to exceed the quota) ---------- */
  .seltoast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);z-index:80;
    background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:999px;
    box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;
    max-width:88vw;text-align:center;}
  .seltoast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .hidden{display:none !important;}
</style>

<body>
<div id="site-header"></div>
<script src="./header.js"></script>
<div class="wrap">

  <!-- ============ header ============ -->

    <label class="toolchk">
      <input type="checkbox" id="showMovedChk" checked>

    <div class="selbar">
      <button class="btnline ambtn" id="albumMgrBtn" type="button" data-i18n-title="amTitle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
        <span data-i18n="amBtn"></span>
      </button>
      <button class="btnline gearbtn" id="clientBtn" type="button" data-i18n-title="setTitle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        <span data-i18n="setBtn"></span>

      <span class="selcount" id="selCount"></span>
      <span class="sellock" id="selLock" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span id="selLockTxt"></span></span>
      <span class="msgroup" id="msGroup" hidden>

    </div>
  </div>

  <div class="modal">

    <div class="mactions"><button class="mbtn primary" id="blockedClose" data-i18n="gotIt"></button></div>

<!-- album settings modal (tabbed) -->
<div class="overlay" id="settingsOverlay">
  <div class="modal settingsmodal">
    <button class="mclose" id="settingsClose" type="button" data-i18n-title="close" aria-label="close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
    <div class="setmodal-head">
      <h3 data-i18n="setTitle"></h3>
      <p data-i18n="setSub"></p>
    </div>

    <!-- selection-album mode -->
    <label class="selmode">
      <span class="sm-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.48 3.5a.5.5 0 0 1 1.04 0l2.06 4.18 4.6.67a.5.5 0 0 1 .28.85l-3.33 3.25.79 4.58a.5.5 0 0 1-.73.53L12 15.9l-4.12 2.16a.5.5 0 0 1-.72-.53l.78-4.58L4.6 9.7a.5.5 0 0 1 .28-.85l4.6-.67Z"/></svg></span>
      <span class="sm-tx"><b data-i18n="selModeTitle"></b><small data-i18n="selModeDesc"></small></span>
      <span class="switch"><input type="checkbox" id="alSelectionMode"><span class="track"></span></span>

  // ---- supported types ----
  const TYPES = {
    image:['jpg','jpeg','png','gif','heic','heif','webp','bmp','svg','avif'],
    video:['mp4','mov','avi','webm','mkv','m4v'],
    audio:['mp3','wav','aac','m4a','flac','ogg','oga','opus'],
    doc:['pdf','doc','docx','xls','xlsx','ppt','pptx','txt','csv','rtf'],
  };
  function kindOf(ext){
    ext=(ext||'').toLowerCase();
    for(const k in TYPES){ if(TYPES[k].includes(ext)) return k; }
    return null; // unsupported -> blocked
  }

  // ---- state ----
  let lang='he', t=I18N.he;
  let folders=[];                 // {id,name}
  let files=[];                   // {id,file,name,ext,kind,size,folderId,note,url,selected}
  let currentFolder='all';        // 'all' | folderId  (also the upload target)
  let showMovedInMain=true;       // show folder-assigned (locked) files in the "all files" view
  let query='';
  let uid=1; const nid = () => 'x'+(uid++)+'_'+Date.now().toString(36);
  let albumMgr = null;            // cached client selection-limit config (drives the GREEN check quota); set in init()
  let quotaState = null;          // per-render snapshot of the active limit + live selected counts
  let selConfirmed=false;         // client has locked in their album pick — green selection frozen
  let selPromptShown=false;       // the "are you finished?" dialog was already offered for the current full-cap state

  // ---- helpers ----
  function extOf(name){ const m=(name||'').match(/\.([^.\/\\]+)$/); return m?m[1].toLowerCase():''; }
  function stripExt(name){ return name.replace(/\.[^.\/\\]+$/,''); }
  function fmtBytes(n){ if(n==null) return '—'; if(n>=1048576) return (n/1048576).toFixed(1)+' MB'; if(n>=1024) return (n/1024).toFixed(0)+' KB'; return n+' B'; }
  function pad3(n){ return String(n).padStart(3,'0'); }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function urlFor(f){ if(!f.url) f.url=URL.createObjectURL(f.file); return f.url; }
  function revoke(f){ if(f.url){ URL.revokeObjectURL(f.url); f.url=null; } }
  function folderName(id){ if(id==null) return t.unsorted; const f=folders.find(x=>x.id===id); return f?f.name:t.unsorted; }

  // files visible in the current folder + search
  function visibleFiles(){
    return files.filter(f=>{
      if(currentFolder!=='all' && f.folderId!==currentFolder) return false;
      if(currentFolder==='all' && !showMovedInMain && f.folderId!=null) return false;
      if(query && !f.name.toLowerCase().includes(query)) return false;
      return true;
    });
  }
  // folderId that new uploads/moves default to for the current view
  function targetFolderId(){ return currentFolder==='all' ? null : currentFolder; }

  function moveOptions(sel){
    let o=`<option value="" ${sel==null?'selected':''}>${escapeHtml(t.unsorted)}</option>`;
    const walk=(parentId,depth)=>{
      folders.filter(f=>(f.parentId||null)===parentId).forEach(fo=>{
        const prefix = depth>0 ? '  '.repeat(depth)+'└ ' : '';
        o+=`<option value="${fo.id}" ${sel===fo.id?'selected':''}>${escapeHtml(prefix+fo.name)}</option>`;

  function thumbHtml(f){
    if(f.kind==='image'){
      return `<img loading="lazy" src="${urlFor(f)}" alt="">`;
    }
    if(f.kind==='video'){
      // show a real frame grabbed from the clip so the user can tell which video it is;
      // until it's ready (or if the codec can't be decoded) fall back to the film icon.
      makeVideoPoster(f);
      if(f.poster){
        return `<img loading="lazy" class="vposter" src="${f.poster}" alt=""><span class="filmstrip"></span>`;
      }
      return `<span class="ph video" data-vthumbph="${f.id}">${ICON.video}</span><span class="filmstrip"></span>`;
    }
    const cls=f.kind==='audio'?'audio':(f.ext==='pdf'?'pdf':'doc');
    const ic=f.kind==='audio'?ICON.audio:(f.ext==='pdf'?ICON.pdf:ICON.doc);
    return `<span class="ph ${cls}">${ic}<span class="pext">${escapeHtml(f.ext.toUpperCase())}</span></span>`;
  }

  // Grab a still frame from a video clip to use as its thumbnail. Runs once per file,
  // decodes off-screen, and patches any already-rendered placeholders when the frame is ready.
  function makeVideoPoster(f){
    if(f.kind!=='video' || f.poster || f.posterTried) return;
    f.posterTried=true;
    const v=document.createElement('video');
    v.muted=true; v.preload='auto'; v.playsInline=true; v.setAttribute('playsinline','');
    let settled=false, timer=null;
    const release=()=>{ v.removeAttribute('src'); try{ v.load(); }catch(e){} };
    const finish=(grab)=>{
      if(settled) return; settled=true;
      if(timer){ clearTimeout(timer); timer=null; }
      if(grab){
        try{
          const w=v.videoWidth, h=v.videoHeight;
          if(w && h){
            const MAX=400, s=Math.min(1, MAX/Math.max(w,h));
            const cw=Math.max(1,Math.round(w*s)), ch=Math.max(1,Math.round(h*s));
            const c=document.createElement('canvas'); c.width=cw; c.height=ch;
            c.getContext('2d').drawImage(v,0,0,cw,ch);
            f.poster=c.toDataURL('image/jpeg',0.72);
            applyPosterToDom(f);
          }
        }catch(e){ /* undecodable/tainted — keep the film icon */ }
      }
      release();
    };
    v.addEventListener('loadeddata', ()=>{
      // seek a touch into the clip so we don't capture a black lead-in frame
      const d=(isFinite(v.duration) && v.duration>0) ? v.duration : 0;
      const target = d ? Math.min(d*0.1, 1) : 0.1;
      v.addEventListener('seeked', ()=>finish(true), {once:true});
      try{ v.currentTime=target; }
      catch(e){ finish(true); }
    }, {once:true});
    v.addEventListener('error', ()=>finish(false), {once:true});
    timer=setTimeout(()=>finish(v.readyState>=2), 8000); // give up gracefully on slow/odd files
    v.src=urlFor(f);
  }

  // swap the film-icon placeholder for the captured frame wherever this file is on screen
  function applyPosterToDom(f){
    document.querySelectorAll('[data-vthumbph="'+f.id+'"]').forEach(ph=>{
      const img=document.createElement('img');
      img.loading='lazy'; img.className='vposter'; img.src=f.poster; img.alt='';
      ph.replaceWith(img);
    });
  }

  function renderGrid(){
    const grid=el('fileGrid'), empty=el('emptyState');

    if(!vis.length){ grid.innerHTML=''; empty.classList.remove('hidden'); updateSelBar(); return; }
    empty.classList.add('hidden');
    const cardHtml = viewMode==='list'
      ? (f,i)=> isLocked(f) ? lockedRowHtml(f,i+1) : activeRowHtml(f,i+1)
      : (f,i)=> isLocked(f) ? lockedCardHtml(f,i+1) : activeCardHtml(f,i+1);
    grid.innerHTML=vis.map(cardHtml).join('');
    updateSelBar();

  // =====================================================
  //  FILE INTAKE  (+ duplicate handling)
  // =====================================================
  let dupQueue=null;
  function addFiles(fileList){
    const incoming=Array.from(fileList||[]);
    if(!incoming.length) return;
    const blocked=[];
    const accepted=[];
    incoming.forEach(file=>{
      const ext=extOf(file.name);
      const kind=kindOf(ext);
      if(!kind){ blocked.push(file.name); return; }
      accepted.push({file,ext,kind});
    });
    if(blocked.length) showBlocked(blocked);
    if(!accepted.length){ return; }
    processQueue(accepted, targetFolderId());
  }

  function processQueue(queue, folderId){
    let applyAll=null; // 'keep'|'replace'|'skip'
    const step=(i)=>{
      if(i>=queue.length){ renderAll(); return; }
      const item=queue[i];
      const dupIdx=files.findIndex(f=>f.folderId===folderId && f.name.toLowerCase()===item.file.name.toLowerCase());
      if(dupIdx<0){ insertFile(item,folderId,null); return step(i+1); }
      const act=(choice)=>{
        if(choice==='replace'){ const old=files[dupIdx]; revoke(old); files.splice(dupIdx,1); insertFile(item,folderId,null); }
        else if(choice==='keep'){ insertFile(item,folderId,uniqueName(item.file.name,folderId)); }
        // skip -> nothing
        step(i+1);
      };
      if(applyAll){ return act(applyAll); }
      askDuplicate(item.file.name, (choice, all)=>{ if(all) applyAll=choice; act(choice); });
    };
    step(0);
  }

  function uniqueName(name,folderId){
    const base=stripExt(name), ext=extOf(name);
    let n=2, cand;
    do{ cand=`${base} (${n}).${ext}`; n++; }
    while(files.some(f=>f.folderId===folderId && f.name.toLowerCase()===cand.toLowerCase()));
    return cand;
  }
  function insertFile(item,folderId,forcedName){
    files.push({ id:nid(), file:item.file, name:forcedName||item.file.name, ext:item.ext, kind:item.kind,
      size:item.file.size, folderId:folderId, note:'', url:null, selected:false, picked:false });
  }

  // duplicate dialog (promise-ish via callback)
  let dupCb=null;
  function askDuplicate(name, cb){
    dupCb=cb;
    el('dupBody').textContent = t.dupBody(name);
    el('dupApplyAll').checked=false;
    el('dupOverlay').classList.add('show');
  }
  function resolveDup(choice){
    const all=el('dupApplyAll').checked;
    el('dupOverlay').classList.remove('show');
    const cb=dupCb; dupCb=null;
    if(cb) cb(choice, all);
  }

  function showBlocked(names){

    el('blockedOverlay').classList.add('show');

  // =====================================================
  //  FOLDERS
  // =====================================================
  let folderEditId=null;
  function openFolderModal(editId){
    folderEditId=editId||null;
    const isEdit=!!folderEditId;
    el('folderModalTitle').textContent = isEdit? t.renameFolderTitle : t.newFolderTitle;
    el('folderSave').textContent = isEdit? t.save : t.create;
    const inp=el('folderNameInput');
    inp.value = isEdit ? (folders.find(f=>f.id===folderEditId)||{}).name || '' : '';
    el('folderOverlay').classList.add('show');
    setTimeout(()=>inp.focus(),30);
  }
  function saveFolder(){
    const name=el('folderNameInput').value.trim();
    if(!name){ el('folderNameInput').focus(); return; }
    if(folderEditId){ const f=folders.find(x=>x.id===folderEditId); if(f) f.name=name; }
    else {
      const id=nid();
      folders.push({id,name,parentId:null,open:true});
      currentFolder=id;
    }
    el('folderOverlay').classList.remove('show');
    renderAll();
  }
  // ---- nesting helpers: reparent a folder (its files + subfolders travel with it) ----
  function isDescendantFolder(id, ancestorId){
    let f=folders.find(x=>x.id===id);
    while(f && f.parentId!=null){
      if(f.parentId===ancestorId) return true;
      f=folders.find(x=>x.id===f.parentId);
    }
    return false;
  }
  function canDropFolder(dragId, targetId){
    if(targetId==='all') return true;                        // drop onto "all files" = move to root
    if(targetId===dragId) return false;                      // onto itself
    if(isDescendantFolder(targetId, dragId)) return false;   // into its own subtree
    return true;
  }
  function reparentFolder(dragId, newParentId){
    const f=folders.find(x=>x.id===dragId); if(!f) return;
    f.parentId=newParentId;
    if(newParentId){ const p=folders.find(x=>x.id===newParentId); if(p) p.open=true; }
  }
  function deleteFolder(id){
    const fo=folders.find(f=>f.id===id); if(!fo) return;
    confirmAsk(t.confirmDelFolderTitle, t.confirmDelFolderBody(fo.name), ()=>{
      const up=fo.parentId||null;                            // promote contents one level up
      files.forEach(f=>{ if(f.folderId===id) f.folderId=up; });
      folders.forEach(f=>{ if((f.parentId||null)===id) f.parentId=up; });
      folders=folders.filter(f=>f.id!==id);
      if(currentFolder===id) currentFolder = up||'all';
      renderAll();
    });
  }

  // move-to-folder disambiguation when a multi-selection is active
  let moveCtx=null;
  function askMoveChoice(target, curFile, selCount){
    moveCtx={target, curFile};

    if(target==null){

  // =====================================================
  //  DOWNLOAD ALL  (one ZIP — names by gallery order + caption)
  // =====================================================
  // CRC-32 lookup table used for each ZIP entry
  const CRC32_TABLE=(function(){ const tb=new Uint32Array(256);
    for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++){ c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); } tb[n]=c>>>0; }
    return tb; })();
  function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++){ c=CRC32_TABLE[(c^u8[i])&0xFF]^(c>>>8); } return (c^0xFFFFFFFF)>>>0; }

  // build a store-only (uncompressed) ZIP Blob from [{name, blob}] — UTF-8 filenames (bit 11) so Hebrew names survive
  async function buildZip(items){
    const enc=new TextEncoder(), parts=[], central=[]; let offset=0;
    for(const it of items){
      const data=new Uint8Array(await it.blob.arrayBuffer());
      const nameBytes=enc.encode(it.name);
      const crc=crc32(data), size=data.length;
      const lfh=new DataView(new ArrayBuffer(30));
      lfh.setUint32(0,0x04034b50,true); lfh.setUint16(4,20,true); lfh.setUint16(6,0x0800,true);
      lfh.setUint16(8,0,true); lfh.setUint16(10,0,true); lfh.setUint16(12,0,true);
      lfh.setUint32(14,crc,true); lfh.setUint32(18,size,true); lfh.setUint32(22,size,true);
      lfh.setUint16(26,nameBytes.length,true); lfh.setUint16(28,0,true);
      parts.push(new Uint8Array(lfh.buffer), nameBytes, data);
      const cdh=new DataView(new ArrayBuffer(46));
      cdh.setUint32(0,0x02014b50,true); cdh.setUint16(4,20,true); cdh.setUint16(6,20,true);
      cdh.setUint16(8,0x0800,true); cdh.setUint16(10,0,true); cdh.setUint16(12,0,true); cdh.setUint16(14,0,true);
      cdh.setUint32(16,crc,true); cdh.setUint32(20,size,true); cdh.setUint32(24,size,true);
      cdh.setUint16(28,nameBytes.length,true); cdh.setUint16(30,0,true); cdh.setUint16(32,0,true);
      cdh.setUint16(34,0,true); cdh.setUint16(36,0,true); cdh.setUint32(38,0,true); cdh.setUint32(42,offset,true);
      central.push(new Uint8Array(cdh.buffer), nameBytes);
      offset += 30 + nameBytes.length + size;
    }
    let cdSize=0; central.forEach(p=>cdSize+=p.length);
    const eocd=new DataView(new ArrayBuffer(22));
    eocd.setUint32(0,0x06054b50,true); eocd.setUint16(4,0,true); eocd.setUint16(6,0,true);
    eocd.setUint16(8,items.length,true); eocd.setUint16(10,items.length,true);
    eocd.setUint32(12,cdSize,true); eocd.setUint32(16,offset,true); eocd.setUint16(20,0,true);
    return new Blob([...parts, ...central, new Uint8Array(eocd.buffer)], {type:'application/zip'});
  }

  // make caption text safe inside a filename (keep letters incl. Hebrew, drop path/illegal chars)
  function sanitizeName(s){
    return String(s||'').replace(/[\/\\:*?"<>|\x00-\x1f]/g,' ').replace(/\s+/g,' ').trim().slice(0,80);

  async function downloadAllZip(){
    if(zipBusy) return;
    const ordered=files.slice();                 // master gallery order = export order
    if(!ordered.length) return;
    zipBusy=true;
    const btn=el('downloadZipBtn'), span=btn.querySelector('span'), label=span?span.textContent:'';
    btn.disabled=true; if(span) span.textContent=t.preparingZip;
    try{
      const items=ordered.map((f,i)=>{
        const num=pad3(i+1), cap=sanitizeName(f.note);   // 001, 002 … + optional caption
        const base = cap ? `${num} - ${cap}` : num;
        return { name:`${base}.${f.ext}`, blob:f.file };
      });
      const blob=await buildZip(items);
      const zipName=sanitizeName(loadClient().name)||t.zipName;
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download=zipName+'.zip';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 60000);
    }catch(err){ console.error(err); alert(t.zipError); }
    finally{ zipBusy=false; btn.disabled=(files.length===0); if(span) span.textContent=label; }
  }

  let draggingId=null, draggingFolderId=null, viewMode='grid';
  function fileById(id){ return files.find(f=>f.id===id); }
  // ---- album-selection quota (the GREEN check): count photos / videos across the WHOLE album ----
  function quotaKind(f){ return f.kind==='image'?'photo':(f.kind==='video'?'video':null); }
  function selLimit(){ const m=albumMgr||loadAlbumMgr(); return m&&m.limitOn?m:null; }
  function selCounts(){
    let photos=0,videos=0,total=0;
    files.forEach(f=>{ if(!f.selected) return; total++; const k=quotaKind(f);
      if(k==='photo') photos++; else if(k==='video') videos++; });
    return {photos,videos,total};
  }
  function computeQuota(){ return { m:selLimit(), c:selCounts() }; }
  // can this (currently unselected) file still be added under the active limit? uses the per-render snapshot
  function selAtCap(f){
    if(f.selected) return false;
    const q=quotaState; if(!q||!q.m) return false;
    if(q.m.separate){ const k=quotaKind(f);
      if(k==='photo') return q.c.photos>=q.m.maxPhotos;
      if(k==='video') return q.c.videos>=q.m.maxVideos;
      return false; }
    return q.c.total>=q.m.maxTotal;
  }
  // event-time check: returns the relevant max when the file is blocked by the quota, else 0
  function selBlocked(f){
    const m=selLimit(); if(!m) return 0;
    const c=selCounts();
    if(m.separate){ const k=quotaKind(f);
      if(k==='photo') return c.photos>=m.maxPhotos?m.maxPhotos:0;
      if(k==='video') return c.videos>=m.maxVideos?m.maxVideos:0;
      return 0; }
    return c.total>=m.maxTotal?m.maxTotal:0;
  }
  let _toastTimer=null;
  function showToast(msg){
    const n=el('selToast'); if(!n||!msg) return;
    n.textContent=msg; n.classList.add('show');
    clearTimeout(_toastTimer); _toastTimer=setTimeout(()=>n.classList.remove('show'),2200);
  }
  function selLimitMsg(f){
    const m=selLimit(); if(!m) return '';
    if(m.separate){ const k=quotaKind(f);
      return k==='video'?t.limitVideos(m.maxVideos):t.limitPhotos(m.maxPhotos); }
    return t.limitTotal(m.maxTotal);
  }
  // popup title for the "you hit the quota" dialog (photos / videos / total, per active limit)
  function selLimitTitle(f){
    const m=selLimit(); if(!m) return '';
    if(m.separate){ const k=quotaKind(f);
      return k==='video'?t.limitPopVideos(m.maxVideos):t.limitPopPhotos(m.maxPhotos); }
    return t.limitPopFiles(m.maxTotal);
  }
  function openLimitPop(f){
    el('limitModalTitle').textContent=selLimitTitle(f);
    el('limitOverlay').classList.add('show');
  }
  // ---- "I'm done selecting" lock: once the client fills the whole quota, offer to freeze the pick ----
  function selQuotaFull(){
    const m=selLimit(); if(!m) return false;
    const c=selCounts();
    return m.separate ? (c.photos>=m.maxPhotos && c.videos>=m.maxVideos) : (c.total>=m.maxTotal);
  }
  function selDoneCountMsg(){
    const m=selLimit(); if(!m) return '';
    const c=selCounts();
    return m.separate ? t.selDoneCountSep(c.photos,m.maxPhotos,c.videos,m.maxVideos)
                      : t.selDoneCount(c.total,m.maxTotal);
  }
  function renderSelDone(){
    el('selDoneTitle').textContent=t.selDoneTitle;
    el('selDoneCount').textContent=selDoneCountMsg();
    el('selDoneNote').textContent=t.selDoneNote;
    el('selDoneConfirm').textContent=t.selDoneConfirm;
  }
  function openSelDone(){ renderSelDone(); el('selDoneOverlay').classList.add('show'); }
  // fire automatically the moment the client reaches the full quota (unless already locked / already asked)
  function maybePromptSelConfirm(){
    if(selConfirmed || selPromptShown) return;
    if(selQuotaFull()){ selPromptShown=true; openSelDone(); }
  }
  function confirmSelection(){
    selConfirmed=true;
    el('selDoneOverlay').classList.remove('show');
    renderGrid();
  }
  function toggleSel(id){
    if(selConfirmed){ showToast(t.selLockedToast); return; }        // selection frozen after the client confirmed
    const f=fileById(id); if(!f) return;
    if(!f.selected && selBlocked(f)){ openLimitPop(f); return; }    // at the client's quota -> popup, ask to deselect first
    f.selected=!f.selected;
    if(!f.selected) selPromptShown=false;                          // dropped below cap -> allow re-prompting on refill
    renderGrid();
    maybePromptSelConfirm();
  }
  function togglePick(id){ const f=fileById(id); if(f && !isLocked(f)){ f.picked=!f.picked; renderGrid(); } }
  function refreshMsMove(){ el('msMoveSel').innerHTML = `<option value="__ph" disabled selected hidden>${escapeHtml(t.msPh)}</option>` + moveOptions('__ph'); }
  // files that move together on a folder drop: the whole checkbox selection when the
  // dragged card is part of it, otherwise just the single dragged card.
  function dragTargets(){
    const d=fileById(draggingId); if(!d) return [];
    return d.selected ? files.filter(f=>f.selected) : [d];
  }

  // move a file to a new position in the master order (relative to a target card)
  function reorderFiles(dragId, targetId, placeAfter){
    const from=files.findIndex(f=>f.id===dragId); if(from<0) return;
    const [moved]=files.splice(from,1);
    let to=files.findIndex(f=>f.id===targetId);
    if(to<0){ files.push(moved); return; }
    if(placeAfter) to+=1;
    files.splice(to,0,moved);
  }
  // insertion point: vertical (above/below) in list view, horizontal (left/right) in grid view
  function reorderPlaceAfter(card, e){
    const rect=card.getBoundingClientRect();
    if(viewMode==='list') return e.clientY > rect.top+rect.height/2;
    const rtl=document.documentElement.dir==='rtl';
    return rtl ? (e.clientX < rect.left+rect.width/2) : (e.clientX > rect.left+rect.width/2);
  }
  function markReorder(card, placeAfter){
    clearReorderMarks(); card.classList.add('rz');
    if(viewMode==='list'){ card.setAttribute('data-rz-side', placeAfter?'b':'t'); return; }
    const rtl=document.documentElement.dir==='rtl';
    const physRight = rtl ? !placeAfter : placeAfter; // insertion bar on physical side
    card.setAttribute('data-rz-side', physRight?'r':'l');
  }
  function clearReorderMarks(){ document.querySelectorAll('.fcard.rz').forEach(n=>{ n.classList.remove('rz'); n.removeAttribute('data-rz-side'); }); }

  // =====================================================
  //  I18N + THEME
  // =====================================================
  function applyLang(l){
    lang=l; t=I18N[l];
    document.documentElement.lang=l; document.documentElement.dir=t.dir;
    document.querySelectorAll('[data-i18n]').forEach(n=>{ const k=n.getAttribute('data-i18n'); if(typeof t[k]==='string') n.textContent=t[k]; });
    document.querySelectorAll('[data-i18n-ph]').forEach(n=>{ const k=n.getAttribute('data-i18n-ph'); if(typeof t[k]==='string') n.setAttribute('placeholder',t[k]); });
    document.querySelectorAll('[data-i18n-title]').forEach(n=>{ const k=n.getAttribute('data-i18n-title'); if(typeof t[k]==='string') n.setAttribute('title',t[k]); });
    document.querySelectorAll('[data-i18n-aria]').forEach(n=>{ const k=n.getAttribute('data-i18n-aria'); if(typeof t[k]==='string') n.setAttribute('aria-label',t[k]); });
    try{ localStorage.setItem('ac_lang', l); }catch(_){}
    renderAll();
    if(el('selDoneOverlay').classList.contains('show')) renderSelDone();
  }
  function applyTheme(th){
    const dark=(th==='dark');
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
    el('themeIco').textContent = dark?'☀️':'🌙';
    try{ localStorage.setItem('theme', dark?'dark':'light'); }catch(_){}
  }

  // =====================================================
  //  INIT
  // =====================================================
  (function init(){
    let th='light'; try{ th=localStorage.getItem('theme')||'light'; }catch(_){}
    applyTheme(th);
    albumMgr = loadAlbumMgr(); // safe here: AM_DEFAULT const is initialized by now
    let gz='170'; try{ gz=localStorage.getItem('ac_grid')||'170'; }catch(_){}
    el('zoomRange').value=gz; document.documentElement.style.setProperty('--card-size', gz+'px');
    el('zoomMinus').disabled=(+gz<=+el('zoomRange').min); el('zoomPlus').disabled=(+gz>=+el('zoomRange').max);
    let vw='grid'; try{ vw=localStorage.getItem('ac_view')||'grid'; }catch(_){}
    viewMode = vw==='list' ? 'list' : 'grid';
    document.querySelectorAll('#viewToggle .vbtn').forEach(b=>b.classList.toggle('on', b.getAttribute('data-view')===viewMode));
    el('zoomWrap').classList.toggle('hidden', viewMode==='list');
    let sm=null; try{ sm=localStorage.getItem('ac_showmoved'); }catch(_){}
    showMovedInMain=(sm!=='0');
    el('showMovedChk').checked=showMovedInMain;
    bindStatic();
    let sl='he'; try{ sl=localStorage.getItem('ac_lang')||'he'; }catch(_){}
    applyLang(sl);
  })();
})();
</script>
<div id="selToast" class="seltoast" role="status" aria-live="polite"></div>
</body>
</html>
