  // =====================================================
  //  CLIENT SETTINGS  (per-gallery client details + permissions)
  // =====================================================
  const PERM_KEYS=['download','zip','editText','reorder','delete','upload','selection','viewOnly'];
  const CLIENT_DEFAULT={ name:'', email:'', phone:'', event:'', deadline:'', status:'draft',
    perms:{ download:true, zip:true, editText:false, reorder:true, delete:false, upload:false, selection:true, viewOnly:false } };
  function loadClient(){
    try{
      const raw=localStorage.getItem(scopedKey('ac_client'));

  // paint the current logo (data URL held in the hidden #alBrandLogo input) into the preview box
  function renderLogoPreview(){
    const data=el('alBrandLogo').value;
    const prev=el('alLogoPrev'), rm=el('alLogoRm');
    if(data){ prev.innerHTML=`<img src="${data}" alt="">`; rm.classList.remove('hidden'); }

  // read the picked image, downscale it (keeps localStorage small + transparency intact), stash the data URL
  function onLogoFile(e){
    const file=e.target.files && e.target.files[0]; e.target.value='';
    if(!file || !/^image\//.test(file.type)) return;
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=360; let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        if(!w || !h){ el('alBrandLogo').value=rd.result; renderLogoPreview(); return; }
        const s=Math.min(1, max/Math.max(w,h)); w=Math.max(1,Math.round(w*s)); h=Math.max(1,Math.round(h*s));
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        let out; try{ out=cv.toDataURL('image/png'); }catch(_){ out=rd.result; }
        el('alBrandLogo').value=out; renderLogoPreview();
      };
      img.onerror=()=>{ el('alBrandLogo').value=rd.result; renderLogoPreview(); };
      img.src=rd.result;
    };
    rd.readAsDataURL(file);
  }

  function saveAlbumMgr(){

    if(!s.id){ s.id=genId(); persistShare(s); }

  function patchAlbum(partial){
    let a={}; try{ a=JSON.parse(localStorage.getItem(scopedKey('ac_album'))||'{}')||{}; }catch(_){}
    Object.assign(a, partial);

  function saveShareState(){

                 alVisibility: el('share_block').checked?'private':'link' });
  }
  function openShare(){
    const s=shareState(), client=loadClient();
    // one-time migration: fold a legacy share-only password into the album, then forget the old keys
    if(s.pw||s.pwOn){ const a0=loadAlbum(); if(!a0.alPwOn&&!a0.alPw) patchAlbum({ alPwOn:!!s.pwOn, alPw:s.pw||'' }); }
    if('pwOn' in s||'pw' in s||'blocked' in s){ delete s.pwOn; delete s.pw; delete s.blocked; persistShare(s); }
    const alb=loadAlbum();
    el('shareLink').value=shareLinkFor(s.id);
    el('shareEmail').value=s.email||client.email||'';
    el('sharePhone').value=s.phone||client.phone||'';
    // password + link on/off mirror the album settings — single source of truth (ac_album)
    el('share_pw_on').checked=!!alb.alPwOn; el('sharePw').value=alb.alPw||'';
    el('share_block').checked=(alb.alVisibility!=='link');

  // =====================================================
  //  DOWNLOAD ALL  (one ZIP — names by gallery order + caption)
  // =====================================================
  // CRC-32 lookup table used for each ZIP entry
  const CRC32_TABLE=(function(){ const tb=new Uint32Array(256);
    for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++){ c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); } tb[n]=c>>>0; }
    return tb; })();
  function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++){ c=CRC32_TABLE[(c^u8[i])&0xFF]^(c>>>8); } return (c^0xFFFFFFFF)>>>0; }

  // build a store-only (uncompressed) ZIP Blob from [{name, blob}] — UTF-8 filenames (bit 11) so Hebrew names survive
  async function buildZip(items){
    const enc=new TextEncoder(), parts=[], central=[]; let offset=0;
    for(const it of items){
      const data=new Uint8Array(await it.blob.arrayBuffer());
      const nameBytes=enc.encode(it.name);
      const crc=crc32(data), size=data.length;
      const lfh=new DataView(new ArrayBuffer(30));
      lfh.setUint32(0,0x04034b50,true); lfh.setUint16(4,20,true); lfh.setUint16(6,0x0800,true);
      lfh.setUint16(8,0,true); lfh.setUint16(10,0,true); lfh.setUint16(12,0,true);
      lfh.setUint32(14,crc,true); lfh.setUint32(18,size,true); lfh.setUint32(22,size,true);
      lfh.setUint16(26,nameBytes.length,true); lfh.setUint16(28,0,true);
      parts.push(new Uint8Array(lfh.buffer), nameBytes, data);
      const cdh=new DataView(new ArrayBuffer(46));
      cdh.setUint32(0,0x02014b50,true); cdh.setUint16(4,20,true); cdh.setUint16(6,20,true);
      cdh.setUint16(8,0x0800,true); cdh.setUint16(10,0,true); cdh.setUint16(12,0,true); cdh.setUint16(14,0,true);
      cdh.setUint32(16,crc,true); cdh.setUint32(20,size,true); cdh.setUint32(24,size,true);
      cdh.setUint16(28,nameBytes.length,true); cdh.setUint16(30,0,true); cdh.setUint16(32,0,true);
      cdh.setUint16(34,0,true); cdh.setUint16(36,0,true); cdh.setUint32(38,0,true); cdh.setUint32(42,offset,true);
      central.push(new Uint8Array(cdh.buffer), nameBytes);
      offset += 30 + nameBytes.length + size;
    }
    let cdSize=0; central.forEach(p=>cdSize+=p.length);
    const eocd=new DataView(new ArrayBuffer(22));
    eocd.setUint32(0,0x06054b50,true); eocd.setUint16(4,0,true); eocd.setUint16(6,0,true);
    eocd.setUint16(8,items.length,true); eocd.setUint16(10,items.length,true);
    eocd.setUint32(12,cdSize,true); eocd.setUint32(16,offset,true); eocd.setUint16(20,0,true);
    return new Blob([...parts, ...central, new Uint8Array(eocd.buffer)], {type:'application/zip'});
  }

  // make caption text safe inside a filename (keep letters incl. Hebrew, drop path/illegal chars)
  function sanitizeName(s){
    return String(s||'').replace(/[\/\\:*?"<>|\x00-\x1f]/g,' ').replace(/\s+/g,' ').trim().slice(0,80);
  }

  let zipBusy=false;
  async function downloadAllZip(){
    if(zipBusy) return;
    const ordered=files.slice();                 // master gallery order = export order
    if(!ordered.length) return;
    zipBusy=true;
    const btn=el('downloadZipBtn'), span=btn.querySelector('span'), label=span?span.textContent:'';
    btn.disabled=true; if(span) span.textContent=t.preparingZip;
    try{
      const items=ordered.map((f,i)=>{
        const num=pad3(i+1), cap=sanitizeName(f.note);   // 001, 002 … + optional caption
        const base = cap ? `${num} - ${cap}` : num;
        return { name:`${base}.${f.ext}`, blob:f.file };
      });
      const blob=await buildZip(items);
      const zipName=sanitizeName(loadClient().name)||t.zipName;
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download=zipName+'.zip';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 60000);
    }catch(err){ console.error(err); alert(t.zipError); }
    finally{ zipBusy=false; btn.disabled=(files.length===0); if(span) span.textContent=label; }
  }

    function applyGrid(v){
      const r=el('zoomRange');
      v=Math.max(+r.min, Math.min(+r.max, v));
      const changed = v !== +r.value;
      const before = changed ? new Map([...document.querySelectorAll('.filegrid .fcard')].map(card=>[card.dataset.id, card.getBoundingClientRect()])) : null;
      r.value=v;
      document.documentElement.style.setProperty('--card-size', v+'px');
      if(before){
        requestAnimationFrame(()=>{
          document.querySelectorAll('.filegrid .fcard').forEach(card=>{
            const first=before.get(card.dataset.id);
            if(!first) return;
            const last=card.getBoundingClientRect();
            if(!last.width || !last.height) return;
            const dx=first.left-last.left, dy=first.top-last.top;
            const sx=first.width/last.width, sy=first.height/last.height;
            if(Math.abs(dx)<.5 && Math.abs(dy)<.5 && Math.abs(sx-1)<.01 && Math.abs(sy-1)<.01) return;
            card.animate([
              {transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`,transformOrigin:'top left'},
              {transform:'translate(0,0) scale(1,1)',transformOrigin:'top left'}
            ],{duration:180,easing:'cubic-bezier(.2,.8,.2,1)'});
          });
        });
      }
      try{ localStorage.setItem('ac_grid', String(v)); }catch(_){}
      el('zoomMinus').disabled = v<=+r.min;
      el('zoomPlus').disabled  = v>=+r.max;
    }

    el('folderList').addEventListener('pointerdown',e=>{ folderGripArmed=!!e.target.closest('[data-fgrip]'); });

        return;

    el('alDeleteBtn').addEventListener('click',deleteAlbum);
    el('alBackupBtn').addEventListener('click',downloadAllZip);
    el('alArchiveBtn').addEventListener('click',()=>flashActBtn(el('alArchiveBtn'), t.archivedMsg));
    el('alUpgradeBtn').addEventListener('click',()=>{ location.href='./pricing/'; });
    el('alCoverBtn').addEventListener('click',()=>el('fileInput').click());
    // album manager
    el('albumMgrBtn').addEventListener('click',openAlbumMgr);
    el('albumMgrSave').addEventListener('click',saveAlbumMgr);
    el('albumMgrCancel').addEventListener('click',()=>el('albumMgrOverlay').classList.remove('show'));
    el('albumMgrClose').addEventListener('click',()=>el('albumMgrOverlay').classList.remove('show'));
    el('amPresets').addEventListener('click',e=>{
      const del=e.target.closest('.pr-del');
      if(del){ e.stopPropagation(); const card=del.closest('.preset'); if(card) deletePreset(card.getAttribute('data-preset')); return; }
      if(e.target.closest('#amPresetNew')){ createPreset(); return; }
      const b=e.target.closest('.preset'); if(b) applyPreset(b.getAttribute('data-preset'));
    });
    el('amLimitOn').addEventListener('change',applyAlbumMgrDeps);
    el('amSeparate').addEventListener('change',()=>{ applyAlbumMgrDeps(); clearPresetMark(); });
    ['amMaxTotal','amMaxPhotos','amMaxVideos','amMessage'].forEach(id=>el(id).addEventListener('input',clearPresetMark));
    // share gallery
    el('shareBtn').addEventListener('click',openShare);
    el('shareClose').addEventListener('click',()=>{ saveShareState(); el('shareOverlay').classList.remove('show'); });
    el('shareCopy').addEventListener('click',copyShareLink);
    el('shareOpen').addEventListener('click',openShareLink);
    el('shareSend').addEventListener('click',sendShare);
    el('share_pw_on').addEventListener('change',applySharePw);
    el('share_block').addEventListener('change',applyShareBlock);
    ['shareEmail','sharePhone','sharePw'].forEach(id=>el(id).addEventListener('input',saveShareState));
    // close any open card ⋮ menu when clicking elsewhere (kebab clicks stopPropagation, so they don't reach here)
    document.addEventListener('click',e=>{ if(!e.target.closest('.cardmenu') && !e.target.closest('[data-kebab]')) closeAllCardMenus(); });
    document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeAllCardMenus(); closePreview(); if(moveCtx) closeMoveChoice(); document.querySelectorAll('.overlay.show').forEach(o=>o.classList.remove('show')); } });
    // click outside modal to close (non-destructive ones)
    ['helpOverlay','blockedOverlay','limitOverlay','selDoneOverlay','folderOverlay','settingsOverlay','shareOverlay','albumMgrOverlay'].forEach(idn=>{ el(idn).addEventListener('click',e=>{ if(e.target===el(idn)) el(idn).classList.remove('show'); }); });
    el('moveOverlay').addEventListener('click',e=>{ if(e.target===el('moveOverlay')) closeMoveChoice(); });
    el('pvOverlay').addEventListener('click',e=>{ if(e.target===el('pvOverlay')) closePreview(); });

    // lang + theme
    window.__setLang=applyLang;
    el('themeToggle').addEventListener('click',()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));
  }

  let draggingId=null, draggingFolderId=null, reorderFolderId=null, folderGripArmed=false;
  function fileById(id){ return files.find(f=>f.id===id); }
  // ---- album-selection quota (the GREEN check): count photos / videos across the WHOLE album ----
  function quotaKind(f){ return f.kind==='image'?'photo':(f.kind==='video'?'video':null); }
  function selLimit(){ const m=albumMgr||loadAlbumMgr(); return m&&m.limitOn?m:null; }
  function selCounts(){
    let photos=0,videos=0,total=0;
    files.forEach(f=>{ if(!f.selected) return; total++; const k=quotaKind(f);
      if(k==='photo') photos++; else if(k==='video') videos++; });
    return {photos,videos,total};
  }
  function computeQuota(){ return { m:selLimit(), c:selCounts() }; }
  // can this (currently unselected) file still be added under the active limit? uses the per-render snapshot
  function selAtCap(f){
    if(f.selected) return false;
    const q=quotaState; if(!q||!q.m) return false;
    if(quotaKind(f)==='video' && !videosEnabled(q.m)) return true;
    if(q.m.separate){ const k=quotaKind(f);
      if(k==='photo') return q.c.photos>=q.m.maxPhotos;
      if(k==='video') return q.c.videos>=q.m.maxVideos;
      return false; }
    return q.c.total>=q.m.maxTotal;
  }
  // event-time check: returns the relevant max when the file is blocked by the quota, else 0
  function selBlocked(f){
    const m=selLimit(); if(!m) return 0;
    const c=selCounts();
    if(quotaKind(f)==='video' && !videosEnabled(m)) return -1;
    if(m.separate){ const k=quotaKind(f);
      if(k==='photo') return c.photos>=m.maxPhotos?m.maxPhotos:0;
      if(k==='video') return c.videos>=m.maxVideos?m.maxVideos:0;
      return 0; }
    return c.total>=m.maxTotal?m.maxTotal:0;
  }
  let _toastTimer=null;
  function showToast(msg){
    const n=el('selToast'); if(!n||!msg) return;
    n.textContent=msg; n.classList.add('show');
    clearTimeout(_toastTimer); _toastTimer=setTimeout(()=>n.classList.remove('show'),2200);
  }
  function selLimitMsg(f){
    const m=selLimit(); if(!m) return '';
    if(quotaKind(f)==='video' && !videosEnabled(m)) return t.limitVideos(0);
    if(m.separate){ const k=quotaKind(f);
      return k==='video'?t.limitVideos(m.maxVideos):t.limitPhotos(m.maxPhotos); }
    return t.limitTotal(m.maxTotal);
  }
  // popup title for the "you hit the quota" dialog (photos / videos / total, per active limit)
  function selLimitTitle(f){
    const m=selLimit(); if(!m) return '';
    if(quotaKind(f)==='video' && !videosEnabled(m)) return t.limitPopVideos(0);
    if(m.separate){ const k=quotaKind(f);
      return k==='video'?t.limitPopVideos(m.maxVideos):t.limitPopPhotos(m.maxPhotos); }
    return t.limitPopFiles(m.maxTotal);
  }
  function openLimitPop(f){
    el('limitModalTitle').textContent=selLimitTitle(f);
    el('limitOverlay').classList.add('show');
  }
  // ---- "I'm done selecting" lock: once the client fills the whole quota, offer to freeze the pick ----
  function selQuotaFull(){
    const m=selLimit(); if(!m) return false;
    const c=selCounts();
    if(!videosEnabled(m)) return c.photos >= (m.separate ? m.maxPhotos : m.maxTotal);
    return m.separate ? (c.photos>=m.maxPhotos && c.videos>=m.maxVideos) : (c.total>=m.maxTotal);
  }
  function selDoneCountMsg(){
    const m=selLimit(); if(!m) return '';
    const c=selCounts();
    if(!videosEnabled(m)) return t.selDoneCount(c.photos, m.separate ? m.maxPhotos : m.maxTotal);
    return m.separate ? t.selDoneCountSep(c.photos,m.maxPhotos,c.videos,m.maxVideos)
                      : t.selDoneCount(c.total,m.maxTotal);
  }
  function renderSelDone(){
    el('selDoneTitle').textContent=t.selDoneTitle;
    el('selDoneCount').textContent=selDoneCountMsg();
    el('selDoneNote').textContent=t.selDoneNote;
    el('selDoneConfirm').textContent=t.selDoneConfirm;
  }
  function openSelDone(){ renderSelDone(); el('selDoneOverlay').classList.add('show'); }
  // fire automatically the moment the client reaches the full quota (unless already locked / already asked)
  function maybePromptSelConfirm(){
    if(selConfirmed || selPromptShown) return;
    if(selQuotaFull()){ selPromptShown=true; openSelDone(); }
  }
  function confirmSelection(){
    selConfirmed=true;
    el('selDoneOverlay').classList.remove('show');
    renderGrid();
  }
  function toggleSel(id){
    if(selConfirmed){ showToast(t.selLockedToast); return; }        // selection frozen after the client confirmed
    const f=fileById(id); if(!f) return;
    if(!f.selected && selBlocked(f)){ openLimitPop(f); return; }    // at the client's quota -> popup, ask to deselect first
    f.selected=!f.selected;
    if(!f.selected) selPromptShown=false;                          // dropped below cap -> allow re-prompting on refill
    renderGrid(); renderStats();
    maybePromptSelConfirm();
  }
  function togglePick(id){ const f=fileById(id); if(f && !isLocked(f)){ f.picked=!f.picked; renderGrid(); } }
  // build the themed folder list for the custom move-to-folder popup (mirrors moveOptions' tree)
  function refreshMsMove(){
    const menu=el('msMoveMenu'); if(!menu) return;
    const folderRows=[];
    const walk=(parentId,depth)=>{
      folders.filter(f=>(f.parentId||null)===parentId).forEach(fo=>{
        folderRows.push({val:fo.id,label:fo.name,depth});
        walk(fo.id,depth+1);
      });
    };
    walk(null,0);
    const folderIco='<svg class="fs-mico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>';
    const noneIco='<svg class="fs-mico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.69.9H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';
    const plusIco='<svg class="fs-mico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/><path d="M12 10v6"/><path d="M9 13h6"/></svg>';
    // "no folder" destination, with an inline "+" that creates a new folder and moves the marked files into it
    let html =
      '<div class="fs-nonerow">'
      + `<button type="button" class="fs-item none" role="option" data-val="" style="--fs-depth:0">${noneIco}<span class="fs-itext">${escapeHtml(t.unsorted)}</span></button>`
      + `<button type="button" class="fs-newbtn" data-newfolder="1" title="${escapeHtml(t.newFolderTitle)}" aria-label="${escapeHtml(t.newFolderTitle)}">${plusIco}</button>`
      + '</div>';
    if(folderRows.length){
      html += '<div class="fs-sep"></div>'
        + folderRows.map(r=>
            `<button type="button" class="fs-item" role="option" data-val="${escapeHtml(r.val)}" style="--fs-depth:${r.depth}">${folderIco}<span class="fs-itext">${escapeHtml(r.label)}</span></button>`
          ).join('');
    }
    menu.innerHTML = html;
  }
  function doMsMove(v){
    const target = v===''?null:v;
    const picked=files.filter(f=>f.picked); if(!picked.length){ refreshMsMove(); return; }
    picked.forEach(f=>{ f.folderId=target; f.picked=false; });
    renderAll();
  }

  // ---- per-card "move to folder": one empty .fs-menu per card, opened/positioned via CSS (zoom-safe) ----
  const cmFolderIco='<svg class="fs-mico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>';
  const cmNoneIco='<svg class="fs-mico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.69.9H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';
  const cmPlusIco='<svg class="fs-mico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/><path d="M12 10v6"/><path d="M9 13h6"/></svg>';
  function cardMenuItemsHtml(currentId){
    const rows=[];
    const walk=(parentId,depth)=>{ folders.filter(f=>(f.parentId||null)===parentId).forEach(fo=>{ rows.push({val:fo.id,label:fo.name,depth}); walk(fo.id,depth+1); }); };
    walk(null,0);
    let html='<div class="fs-nonerow">'
      + `<button type="button" class="fs-item none${currentId==null?' on':''}" role="option" data-val="" style="--fs-depth:0">${cmNoneIco}<span class="fs-itext">${escapeHtml(t.unsorted)}</span></button>`
      + `<button type="button" class="fs-newbtn" data-newfolder="1" title="${escapeHtml(t.newFolderTitle)}" aria-label="${escapeHtml(t.newFolderTitle)}">${cmPlusIco}</button>`
      + '</div>';
    if(rows.length){
      html+='<div class="fs-sep"></div>'
        + rows.map(r=>`<button type="button" class="fs-item${r.val===currentId?' on':''}" role="option" data-val="${escapeHtml(r.val)}" style="--fs-depth:${r.depth}">${cmFolderIco}<span class="fs-itext">${escapeHtml(r.label)}</span></button>`).join('');
    }
    return html;
  }
  function closeAllCardMenus(){
    document.querySelectorAll('.cardmove-menu:not([hidden])').forEach(m=>{ m.hidden=true; m.classList.remove('up'); });
    document.querySelectorAll('.cardmove.open').forEach(b=>{ b.classList.remove('open'); b.setAttribute('aria-expanded','false'); });
    document.querySelectorAll('.fcard.cm-open').forEach(c=>c.classList.remove('cm-open'));
  }
  function toggleCardMove(trigger){
    const wrap=trigger.closest('.cardmovewrap'); if(!wrap) return;
    const menu=wrap.querySelector('.cardmove-menu'); if(!menu) return;
    const wasOpen=!menu.hidden;
    closeAllCardMenus();
    if(wasOpen) return;                                        // a second click on the same trigger just closes it
    const f=fileById(trigger.getAttribute('data-move'));
    menu.innerHTML=cardMenuItemsHtml(f?f.folderId:null);
    menu.hidden=false;
    trigger.classList.add('open'); trigger.setAttribute('aria-expanded','true');
    const card=trigger.closest('.fcard'); if(card) card.classList.add('cm-open');   // .fcard clips overflow; reveal the popup while open
    // flip upward only when the popup won't fit below and there IS room above
    // (getBoundingClientRect + innerHeight share one coordinate space, so this stays correct under body zoom)
    const tr=trigger.getBoundingClientRect(), mh=menu.getBoundingClientRect().height, pad=8;
    if(tr.bottom+6+mh > window.innerHeight-pad && tr.top-6-mh > pad) menu.classList.add('up');
  }
  function cardMoveApply(itemEl){
    const wrap=itemEl.closest('.cardmovewrap'); const trigger=wrap?wrap.querySelector('.cardmove'):null;
    const f=trigger?fileById(trigger.getAttribute('data-move')):null;
    closeAllCardMenus();
    if(!f) return;
    const val=itemEl.getAttribute('data-val'); const target=val===''?null:val;
    const picked=files.filter(x=>x.picked);
    if(picked.length>=2){ askMoveChoice(target,f,picked.length); return; }  // honor the purple multi-select "move all / just this one" prompt
    f.folderId=target; renderAll();
  }
  function cardMoveNewFolder(itemEl){
    const wrap=itemEl.closest('.cardmovewrap'); const trigger=wrap?wrap.querySelector('.cardmove'):null;
    const f=trigger?fileById(trigger.getAttribute('data-move')):null;
    closeAllCardMenus();
    openFolderModal(null, f?{moveFileId:f.id}:undefined);
  }
  // close any open card folder-menu on an outside click or Escape; arrow keys navigate within an open menu
  document.addEventListener('click',e=>{ if(!e.target.closest('.cardmovewrap')) closeAllCardMenus(); });
  document.addEventListener('keydown',e=>{
    const menu=e.target.closest('.cardmove-menu');
    if(!menu){ if(e.key==='Escape') closeAllCardMenus(); return; }
    const items=[...menu.querySelectorAll('.fs-item')]; if(!items.length) return;
    const i=items.indexOf(document.activeElement);
    if(e.key==='ArrowDown'){ e.preventDefault(); (items[i+1]||items[0]).focus(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); (items[i-1]||items[items.length-1]).focus(); }
    else if(e.key==='Escape'){ e.preventDefault(); const b=menu.closest('.cardmovewrap').querySelector('.cardmove'); closeAllCardMenus(); if(b) b.focus(); }
  });

  // files that move together on a folder drop: the whole management selection when the
  // dragged card is part of it, otherwise just the single dragged card.
  function dragTargets(){
    const d=fileById(draggingId); if(!d) return [];
    return d.picked ? files.filter(f=>f.picked) : [d];
  }

  // move a file to a new position in the master order (relative to a target card)
  function reorderFiles(dragId, targetId, placeAfter){
    const from=files.findIndex(f=>f.id===dragId); if(from<0) return;
    const [moved]=files.splice(from,1);
    let to=files.findIndex(f=>f.id===targetId);
    if(to<0){ files.push(moved); return; }
    if(placeAfter) to+=1;
    files.splice(to,0,moved);
  }
  // insertion point: horizontal (left/right) in the grid
  function reorderPlaceAfter(card, e){
    const rect=card.getBoundingClientRect();
    const rtl=document.documentElement.dir==='rtl';
    return rtl ? (e.clientX < rect.left+rect.width/2) : (e.clientX > rect.left+rect.width/2);
  }
  function markReorder(card, placeAfter){
    clearReorderMarks(); card.classList.add('rz');
    const rtl=document.documentElement.dir==='rtl';
    const physRight = rtl ? !placeAfter : placeAfter; // insertion bar on physical side
    card.setAttribute('data-rz-side', physRight?'r':'l');
  }
  function clearReorderMarks(){ document.querySelectorAll('.fcard.rz').forEach(n=>{ n.classList.remove('rz'); n.removeAttribute('data-rz-side'); }); }

  // =====================================================
  //  I18N + THEME
  // =====================================================
  function applyLang(l){
    lang=l; t=I18N[l];
    document.documentElement.lang=l; document.documentElement.dir=t.dir;
    document.querySelectorAll('[data-i18n]').forEach(n=>{ const k=n.getAttribute('data-i18n'); if(typeof t[k]==='string') n.textContent=t[k]; });
    document.querySelectorAll('[data-i18n-ph]').forEach(n=>{ const k=n.getAttribute('data-i18n-ph'); if(typeof t[k]==='string') n.setAttribute('placeholder',t[k]); });
    document.querySelectorAll('[data-i18n-title]').forEach(n=>{ const k=n.getAttribute('data-i18n-title'); if(typeof t[k]==='string') n.setAttribute('title',t[k]); });
    document.querySelectorAll('[data-i18n-aria]').forEach(n=>{ const k=n.getAttribute('data-i18n-aria'); if(typeof t[k]==='string') n.setAttribute('aria-label',t[k]); });
    try{ localStorage.setItem('ac_lang', l); }catch(_){}
    renderAll();
    if(el('selDoneOverlay').classList.contains('show')) renderSelDone();
  }
  function applyTheme(th){
    const dark=(th==='dark');
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
    el('themeIco').textContent = dark?'☀️':'🌙';
    try{ localStorage.setItem('theme', dark?'dark':'light'); }catch(_){}
  }

  // =====================================================
  //  INIT
  // =====================================================
  (function init(){
    let th='light'; try{ th=localStorage.getItem('theme')||'light'; }catch(_){}
    applyTheme(th);
    albumMgr = loadAlbumMgr(); // safe here: AM_DEFAULT const is initialized by now
    let gz='170'; try{ gz=localStorage.getItem('ac_grid')||'170'; }catch(_){}
    el('zoomRange').value=gz; document.documentElement.style.setProperty('--card-size', gz+'px');
    el('zoomMinus').disabled=(+gz<=+el('zoomRange').min); el('zoomPlus').disabled=(+gz>=+el('zoomRange').max);
    let sm=null; try{ sm=localStorage.getItem('ac_showmoved'); }catch(_){}
    showMovedInMain=(sm!=='0');
    el('showMovedChk').checked=showMovedInMain;
    bindStatic();
    let sl='he'; try{ sl=localStorage.getItem('ac_lang')||'he'; }catch(_){}
    applyLang(sl);
    // Arriving from the dashboard "+ New project" — open album settings on a blank
    // form and strip the flag so a refresh doesn't reopen it.
    if(/[?&]new=1/.test(location.search)){
      openSettings(true);
      try{ history.replaceState(null,'',location.pathname); }catch(_){}
    }
  })();
})();
</script>
