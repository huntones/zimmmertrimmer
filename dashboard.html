<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOLKLI — דשבורד</title>
<meta name="description" content="Your KOLKLI dashboard — manage your profile, audio, video, files and transfers. See your plan, limits and current usage.">
<style>
  :root {
    --bg:#eef0f6; --panel:#ffffff; --panel-2:#f5f6fa; --line:#e5e8f0; --line-2:#eef0f6;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#7c3aed; --accent-dim:#6a2fe0; --accent-ink:#ffffff; --accent-soft:#efe9fe;
    --success:#22b04b; --success-dim:#1c9a41; --success-soft:#e6f6ec;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --danger:#e5484d; --danger-soft:#fdecec;
    --warm-soft:#fff5da; --warm-line:#f2d98a;
    --ok:#22b04b; --warn:#c88a04; --err:#e5484d;
    --grad:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-h:linear-gradient(105deg,#6a29e6 0%,#2f74f0 100%);
    --grad-soft:linear-gradient(120deg,#efe9fe,#e6f0ff);
    --grad-shadow:rgba(93,79,240,0.30);
    --grad-btn:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn-glow:rgba(59,111,246,0.38);
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-lg:0 2px 6px rgba(20,24,44,0.05), 0 20px 50px rgba(20,24,44,0.10);
    --shadow-sm:0 1px 2px rgba(20,24,44,0.05);
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --sans:'Space Grotesk',system-ui,'Segoe UI','Heebo',sans-serif;
  }
  html[data-theme="dark"] {
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a303c; --line-2:#232833;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --accent:#a06bff; --accent-dim:#7c3aed; --accent-ink:#ffffff; --accent-soft:#241a3a;
    --success:#37c26a; --success-dim:#2fae5e; --success-soft:#132a1c;
    --info:#5b95f8; --info-dim:#4f8ef7; --info-soft:#182338;
    --danger:#ff6b6b; --danger-soft:#2a1719;
    --warm-soft:#2c2718; --warm-line:#5a4d24;
    --ok:#4ec98a; --warn:#e8b84b; --err:#ff6b6b;
    --grad:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-h:linear-gradient(105deg,#9a63ff 0%,#6aa2ff 100%);
    --grad-soft:linear-gradient(120deg,#1c1633,#11242a);
    --grad-shadow:rgba(77,123,255,0.42);
    --grad-btn:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn-glow:rgba(77,123,255,0.45);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,0.45), 0 24px 60px rgba(0,0,0,0.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;overflow-x:clip;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;}
  body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(56% 38% at 12% 2%,rgba(124,58,237,0.09),transparent 60%),
      radial-gradient(52% 40% at 90% 0%,rgba(59,111,246,0.08),transparent 60%);}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--sans);}

  /* ---------- layout ---------- */
  /* content box matches the header's 75% bar (+44px for our 22px side padding)
     so the sidebar's right edge lines up with the header logo instead of falling short */
  .dash-wrap{max-width:calc(75% + 44px);width:100%;margin:0 auto;padding:22px 22px 60px;}
  .dash{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:start;}

  /* ---------- mobile bar ---------- */
  .dash-mbar{display:none;align-items:center;gap:12px;margin-bottom:14px;}
  .dash-mbar button{display:inline-flex;align-items:center;gap:9px;height:42px;padding:0 16px;border-radius:12px;
    background:var(--panel);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;font-size:14px;font-weight:600;box-shadow:var(--shadow-sm);}
  .dash-mbar button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .dash-mbar .mbar-title{font-weight:700;font-size:15px;}

  /* ---------- sidebar ---------- */
  .side{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow);
    position:sticky;top:88px;display:flex;flex-direction:column;gap:4px;}
  .side-scrim{display:none;}

  .cat{border-radius:12px;}
  .cat-head{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border:none;background:none;cursor:pointer;
    color:var(--ink-2);font-family:var(--sans);font-size:14.5px;font-weight:700;border-radius:11px;text-align:start;transition:background .12s,color .12s;}
  .cat-head:hover{background:var(--panel-2);}
  .cat-head .cat-ic{width:34px;height:34px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center;
    background:var(--grad-soft);color:var(--accent);}
  .cat-head .cat-ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .cat-head .cat-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cat-head .cat-chev{width:16px;height:16px;flex-shrink:0;color:var(--faint);transition:transform .2s ease;}
  .cat-head .cat-chev svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .cat.open .cat-head .cat-chev{transform:rotate(180deg);}
  .cat.on > .cat-head{color:var(--accent-dim);}
  .cat.on > .cat-head .cat-ic{background:var(--grad);color:#fff;box-shadow:0 4px 12px var(--grad-shadow);}

  .subs{display:none;flex-direction:column;gap:2px;padding:2px 4px 8px;}
  .cat.open .subs{display:flex;}
  .subitem{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--muted);
    font-size:13.5px;font-weight:600;transition:background .12s,color .12s;border:1px solid transparent;}
  .subitem .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5;flex-shrink:0;margin-inline-start:12px;}
  .subitem:hover{background:var(--panel-2);color:var(--ink-2);}
  .subitem.active{background:var(--accent-soft);color:var(--accent-dim);border-color:var(--accent);}
  .subitem.active .dot{opacity:1;}
  .client-subbar{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:6px;align-items:center;}
  .client-subbar .subitem{min-width:0;}
  .side-add-project{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:var(--panel);
    color:var(--accent-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-sm);
    transition:background .12s,border-color .12s,transform .08s;}
  .side-add-project:hover{background:var(--accent-soft);border-color:var(--accent);}
  .side-add-project:active{transform:translateY(1px);}
  .side-add-project svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .side-projects{display:flex;flex-direction:column;gap:3px;padding:4px 2px 2px;}
  .project-nav{display:flex;align-items:center;gap:8px;width:100%;min-height:34px;padding:7px 12px;border:none;border-radius:10px;
    background:none;color:var(--muted);font-family:var(--sans);font-size:12.8px;font-weight:600;text-align:start;cursor:pointer;
    transition:background .12s,color .12s;}
  .project-nav:hover{background:var(--panel-2);color:var(--ink-2);}
  .project-nav.active{background:var(--accent-soft);color:var(--accent-dim);}
  .project-nav .pn-dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.65;flex-shrink:0;}
  .project-nav .pn-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* Editable nav-item labels (pencil + inline save) */
  .subitem .lbl-txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .subitem .lbl-btn{width:26px;height:26px;flex-shrink:0;border:none;background:none;border-radius:8px;color:inherit;
    display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.5;
    transition:opacity .12s,background .12s,color .12s;}
  .subitem .lbl-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  /* rename pencil stays hidden until you hover (or keyboard-focus) its row — keeps the sidebar uncluttered */
  .subitem .lbl-btn.edit{opacity:0;pointer-events:none;}
  .subitem:hover .lbl-btn.edit,.subitem:focus-within .lbl-btn.edit{opacity:.85;pointer-events:auto;}
  .subitem .lbl-btn.edit:hover{opacity:1;}
  .subitem .lbl-btn:hover{background:var(--accent-soft);color:var(--accent-dim);opacity:1;}
  .subitem .lbl-btn.save{color:var(--accent-dim);opacity:1;}
  .subitem.editing{cursor:default;background:var(--panel-2);color:var(--ink-2);border-color:var(--line);}
  .subitem.editing:hover{background:var(--panel-2);}
  .subitem .lbl-input{flex:1;min-width:0;border:none;background:none;outline:none;color:var(--ink);
    font-family:var(--sans);font-size:13.5px;font-weight:600;padding:0;}

  /* plan chip pinned at the bottom of the sidebar */
  .side-plan{margin-top:8px;border-top:1px solid var(--line);padding-top:12px;}
  .planchip{display:flex;align-items:center;gap:11px;padding:12px;border-radius:14px;background:var(--grad-soft);border:1px solid var(--line);}
  .planchip .pc-ic{width:36px;height:36px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center;
    background:var(--grad);color:#fff;box-shadow:0 4px 12px var(--grad-shadow);}
  .planchip .pc-ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .planchip .pc-tx{min-width:0;flex:1;display:flex;flex-direction:column;}
  .planchip .pc-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
  .planchip .pc-name{font-size:15px;font-weight:800;line-height:1.2;}
  .side-plan .upg{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:9px;color:#fff;border:none;cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:700;font-size:13.5px;padding:11px 14px;border-radius:11px;text-shadow:0 1px 2px rgba(0,0,0,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 16px var(--grad-btn-glow);transition:filter .14s,transform .08s;}
  .side-plan .upg:hover{filter:brightness(1.05);} .side-plan .upg:active{transform:translateY(1px);}
  .side-plan .upg svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}

  /* admin-only shortcut, pinned above the nav */
  .side-admin{display:flex;align-items:center;gap:11px;padding:9px 12px;margin-bottom:6px;border-radius:12px;
    background:var(--grad-soft);border:1px solid var(--accent-soft);color:var(--accent-dim);font-weight:700;font-size:14.5px;
    transition:border-color .12s;}
  .side-admin:hover{border-color:var(--accent);}
  .side-admin .sa-ic{width:34px;height:34px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center;
    background:var(--grad);color:#fff;box-shadow:0 4px 12px var(--grad-shadow);}
  .side-admin .sa-ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  /* ---------- main ---------- */
  .main{min-width:0;}
  .guestnote{display:flex;align-items:center;gap:10px;background:var(--info-soft);border:1px solid var(--info);color:var(--info-dim);
    border-radius:14px;padding:12px 16px;font-size:13.5px;margin-bottom:16px;}
  .guestnote svg{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .guestnote a{font-weight:700;color:var(--accent-dim);cursor:pointer;text-decoration:underline;}

  .phead{display:flex;align-items:center;gap:16px;margin:2px 0 22px;}
  .phead .avatar{width:56px;height:56px;flex-shrink:0;border-radius:16px;display:flex;align-items:center;justify-content:center;
    background:var(--grad);color:#fff;font-size:24px;font-weight:800;box-shadow:0 6px 18px var(--grad-shadow);}
  .phead h1{font-size:clamp(22px,3vw,28px);font-weight:800;letter-spacing:-0.02em;margin:0 0 3px;}
  .phead p{font-size:14px;color:var(--muted);margin:0;}
  /* ---------- editable profile picture ---------- */
  .avatar-wrap{position:relative;flex-shrink:0;}
  .phead .avatar{overflow:hidden;position:relative;}
  button.avatar{padding:0;border:0;cursor:pointer;font:inherit;}
  .avatar-img{width:100%;height:100%;object-fit:cover;display:block;}
  .avatar-edit .avatar-ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.42);opacity:0;transition:opacity .15s;}
  .avatar-edit:hover .avatar-ov,.avatar-edit:focus-visible .avatar-ov{opacity:1;}
  .avatar-ov svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .avatar-cam{position:absolute;bottom:-4px;inset-inline-end:-4px;width:24px;height:24px;border-radius:50%;
    background:var(--grad);border:2px solid var(--panel);display:flex;align-items:center;justify-content:center;pointer-events:none;}
  .avatar-cam svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .avatar-remove{position:absolute;top:100%;inset-inline-start:0;margin-top:7px;background:none;border:0;
    color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;white-space:nowrap;padding:0;}
  .avatar-remove:hover{color:#e5484d;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px;}
  .card > h2{font-size:17px;font-weight:700;margin:0 0 4px;letter-spacing:-0.01em;}
  .card > .csub{font-size:13px;color:var(--muted);margin:0 0 16px;}
  .card > h2 + .csub{margin-top:2px;}

  /* ---------- subscription card ---------- */
  .subcard{position:relative;overflow:hidden;background:var(--grad-soft);}
  .subcard .sc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;}
  .sc-info{min-width:0;}
  .sc-kick{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .sc-planline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .sc-planname{font-size:30px;font-weight:800;letter-spacing:-0.02em;line-height:1;}
  .plan-badge{font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    padding:4px 11px;border-radius:999px;}
  .plan-badge.free{color:var(--muted);background:var(--panel);border:1px solid var(--line);}
  .plan-badge.lite{color:var(--info-dim);background:var(--info-soft);border:1px solid var(--info);}
  .plan-badge.pro{color:#fff;background:var(--grad);border:1px solid transparent;box-shadow:0 4px 12px var(--grad-shadow);}
  .plan-badge.business{color:#fff;background:linear-gradient(135deg,#1f2937,#4338ca);border:1px solid transparent;box-shadow:0 4px 12px rgba(67,56,202,.35);}
  .sc-price{font-size:14px;color:var(--muted);margin-top:10px;}
  .sc-price b{font-size:22px;color:var(--ink);font-weight:800;}
  .sc-actions{display:flex;flex-direction:column;gap:10px;align-items:stretch;}
  .btn-up{display:inline-flex;align-items:center;justify-content:center;gap:8px;color:#fff;border:none;cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:700;font-size:14px;padding:12px 22px;border-radius:12px;text-shadow:0 1px 2px rgba(0,0,0,.18);white-space:nowrap;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 20px var(--grad-btn-glow);transition:filter .14s,transform .08s;}
  .btn-up:hover{filter:brightness(1.05);} .btn-up:active{transform:translateY(1px);}
  .btn-up svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .sc-top-plan{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--success-dim);
    background:var(--success-soft);border:1px solid var(--success);padding:11px 18px;border-radius:12px;white-space:nowrap;}
  .sc-top-plan svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}

  /* demo plan switcher */
  .demoswitch{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);}
  .demoswitch .ds-lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin-bottom:8px;}
  .seg{display:inline-flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:var(--shadow-sm);}
  .seg-btn{border:none;background:none;color:var(--muted);cursor:pointer;font-family:var(--sans);font-size:13.5px;font-weight:700;
    padding:8px 18px;border-radius:9px;transition:color .14s,background .14s,box-shadow .14s;}
  .seg-btn.on{background:var(--accent-soft);color:var(--accent-dim);box-shadow:var(--shadow-sm);}

  /* ---------- usage metrics ---------- */
  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .metric{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:15px;}
  .metric-top{display:flex;align-items:center;gap:9px;margin-bottom:11px;}
  .metric-ic{width:32px;height:32px;flex-shrink:0;border-radius:9px;display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);color:var(--accent);}
  .metric-ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .metric-label{font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.2;}
  .metric-val{font-size:18px;font-weight:800;letter-spacing:-0.01em;margin-bottom:10px;}
  .metric-lim{font-size:12.5px;font-weight:600;color:var(--faint);}
  .bar{height:7px;border-radius:999px;background:var(--line);overflow:hidden;}
  .bar-fill{display:block;height:100%;border-radius:999px;background:var(--grad);transition:width .4s ease;}
  .bar-fill.warn{background:linear-gradient(90deg,#e5a904,#e5484d);}

  /* ---------- plan features list ---------- */
  .feats{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,1fr);gap:11px;}
  .feats li{display:flex;align-items:flex-start;gap:10px;font-size:13.7px;color:var(--ink-2);}
  .feats li svg{width:17px;height:17px;color:var(--success);flex-shrink:0;margin-top:2px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .compare{display:inline-flex;align-items:center;gap:7px;margin-top:18px;font-size:13.5px;font-weight:700;color:var(--accent-dim);}
  .compare svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}

  /* ---------- quick actions ---------- */
  .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .qcard{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:16px;box-shadow:var(--shadow-sm);transition:transform .14s,border-color .14s,box-shadow .14s;}
  .qcard:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow-lg);}
  .qcard .q-ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--grad-soft);color:var(--accent);}
  .qcard .q-ic svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .qcard .q-t{font-size:14.5px;font-weight:700;}
  .qcard .q-d{font-size:12.5px;color:var(--muted);line-height:1.4;}

  /* ---------- generic form rows ---------- */
  .frow{display:flex;flex-direction:column;gap:6px;margin-bottom:15px;}
  .frow label{font-size:12.5px;font-weight:600;color:var(--ink-2);}
  .frow input{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;
    font-family:var(--sans);font-size:14px;padding:11px 13px;transition:border-color .12s,box-shadow .12s;}
  .frow input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .frow input:disabled{color:var(--muted);cursor:not-allowed;}
  .frow .hint{font-size:11.5px;color:var(--faint);}
  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:0 16px;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-family:var(--sans);
    font-weight:700;font-size:13.5px;padding:11px 20px;border-radius:11px;transition:filter .14s,transform .08s,border-color .12s,background .12s;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{color:#fff;border:none;text-shadow:0 1px 2px rgba(0,0,0,.18);
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 16px var(--grad-btn-glow);}
  .btn.primary:hover{filter:brightness(1.05);}
  .btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--ink-2);box-shadow:var(--shadow-sm);}
  .btn.ghost:hover{border-color:var(--accent);}
  .btn.danger{background:var(--panel);border:1px solid var(--danger);color:var(--danger);}
  .btn.danger:hover{background:var(--danger-soft);}
  .btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .saved-msg{font-size:12.5px;color:var(--success-dim);font-weight:600;opacity:0;transition:opacity .2s;}
  .saved-msg.show{opacity:1;}

  /* settings option rows */
  .optrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line-2);}
  .optrow:last-child{border-bottom:none;}
  .optrow .opt-tx{min-width:0;}
  .optrow .opt-t{font-size:14px;font-weight:600;}
  .optrow .opt-d{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .segsm{display:inline-flex;gap:3px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px;flex-shrink:0;}
  .segsm button{border:none;background:none;color:var(--muted);cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:700;padding:7px 14px;border-radius:8px;}
  .segsm button.on{background:var(--panel);color:var(--accent-dim);box-shadow:var(--shadow-sm);}
  /* toggle */
  .toggle{position:relative;width:46px;height:26px;flex-shrink:0;border-radius:999px;background:var(--line);border:none;cursor:pointer;transition:background .16s;}
  .toggle::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .16s;}
  .toggle.on{background:var(--accent);}
  html[dir="ltr"] .toggle.on::after{transform:translateX(20px);}
  html[dir="rtl"] .toggle.on::after{transform:translateX(-20px);}

  .danger-zone{border-color:var(--danger);}
  .danger-zone > h2{color:var(--danger);}

  /* ---------- team / organization ---------- */
  .team-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
  .team-head h2{margin:0;}
  .team-head .csub{margin:4px 0 0;}
  .team-meta{text-align:end;}
  .team-meta .opt-t{font-size:14px;font-weight:700;}
  .team-meta .opt-d{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .tm-row{gap:12px;}
  .tm-row .opt-t,.tm-row .opt-d{display:block;}
  .tm-row .opt-t .tm-you{display:inline;margin-inline-start:5px;}
  .tm-id{display:flex;align-items:center;gap:11px;}
  .tm-av{width:36px;height:36px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--grad);color:#fff;font-size:15px;font-weight:700;box-shadow:0 3px 9px var(--grad-shadow);}
  .tm-you{font-size:11px;color:var(--muted);font-weight:600;}
  .tm-ctrl{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
  .tm-role{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:9px;font-family:var(--sans);
    font-size:13px;font-weight:600;padding:8px 10px;cursor:pointer;}
  .tm-badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--muted);
    background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;}
  .tm-badge.owner{color:var(--accent-dim);background:var(--accent-soft);border-color:transparent;}
  .tm-badge svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .btn.tm-rm{padding:8px 10px;}
  .btn.tm-rm svg{margin:0;}
  .tm-invite{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .tm-invite input[type="email"]{flex:1;min-width:200px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;font-family:var(--sans);font-size:14px;padding:11px 13px;}
  .tm-invite input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .tm-invite select{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;
    font-family:var(--sans);font-size:14px;font-weight:600;padding:11px 12px;cursor:pointer;}
  .tm-err{font-size:12.5px;color:var(--danger);margin-top:6px;min-height:1px;}
  .tm-link{margin-top:12px;}
  .tm-linkrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .tm-linkrow input{flex:1;min-width:220px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    border-radius:9px;font-family:var(--mono);font-size:12.5px;padding:10px 12px;}
  .team-head + .card{margin-top:0;}

  /* ---------- payments ---------- */
  .payrow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .pm-empty{display:flex;align-items:center;gap:12px;background:var(--panel-2);border:1px dashed var(--line);border-radius:12px;padding:16px;}
  .pm-empty .pm-ic{width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .pm-empty .pm-ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .pm-empty .pm-tx{flex:1;min-width:0;}
  .pm-empty .pm-t{font-size:14px;font-weight:600;}
  .pm-empty .pm-d{font-size:12.5px;color:var(--muted);}
  table.inv{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.inv th{text-align:start;font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);}
  table.inv td{padding:12px 10px;border-bottom:1px solid var(--line-2);color:var(--ink-2);}
  table.inv tr:last-child td{border-bottom:none;}
  .inv-status{font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--success-dim);background:var(--success-soft);border:1px solid var(--success);border-radius:6px;padding:2px 8px;}
  .inv-dl{color:var(--accent-dim);font-weight:700;cursor:pointer;}

  /* ---------- empty state (my audio/video/files/transfers) ---------- */
  .empty{text-align:center;padding:44px 20px;}
  .empty .ei{width:66px;height:66px;margin:0 auto 16px;border-radius:18px;display:flex;align-items:center;justify-content:center;
    background:var(--grad-soft);color:var(--accent);}
  .empty .ei svg{width:32px;height:32px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .empty h3{margin:0 0 6px;font-size:17px;}
  .empty p{margin:0 auto 20px;font-size:13.5px;color:var(--muted);max-width:44ch;}
  .toolrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
  .toolrow a{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink-2);
    background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 16px;box-shadow:var(--shadow-sm);transition:border-color .12s;}
  .toolrow a:hover{border-color:var(--accent);}
  .toolrow a svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  /* ---------- clients / projects ---------- */
  .projects-card{overflow:hidden;padding:0;}
  .project-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:22px;border-bottom:1px solid var(--line);}
  .project-head h2{font-size:18px;font-weight:800;margin:0 0 4px;letter-spacing:-0.01em;}
  .project-head .csub{font-size:13px;color:var(--muted);margin:0;}
  .project-list{display:flex;flex-direction:column;}
  .project-row{display:grid;grid-template-columns:minmax(220px,1.5fr) minmax(92px,.45fr) minmax(92px,.45fr) minmax(104px,.5fr) auto;
    gap:16px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line-2);background:var(--panel);
    transition:background .12s;}
  .project-row:last-child{border-bottom:none;}
  .project-row.on{background:var(--accent-soft);}
  .project-main{display:flex;align-items:center;gap:12px;min-width:0;}
  .project-mark{width:42px;height:42px;border-radius:12px;background:var(--grad-soft);color:var(--accent);display:flex;
    align-items:center;justify-content:center;flex-shrink:0;}
  .project-mark svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .project-title{display:block;font-size:15px;font-weight:800;color:var(--ink);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .project-client{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .project-stat{min-width:0;}
  .project-stat .ps-l{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin-bottom:2px;}
  .project-stat .ps-v{font-size:13.5px;font-weight:700;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .project-status{display:inline-flex;align-items:center;justify-content:center;min-height:28px;padding:5px 10px;border-radius:999px;
    font-size:12px;font-weight:800;color:var(--accent-dim);background:var(--accent-soft);border:1px solid rgba(124,58,237,.24);white-space:nowrap;}
  .project-status.sent{color:var(--info-dim);background:var(--info-soft);border-color:var(--info);}
  .project-status.approved{color:var(--success-dim);background:var(--success-soft);border-color:var(--success);}
  .project-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;}
  .project-actions .btn{padding:9px 12px;font-size:12.8px;border-radius:10px;white-space:nowrap;}
  .project-empty{padding:44px 22px;text-align:center;}

  footer.dfoot{text-align:center;color:var(--faint);font-size:12px;font-family:var(--mono);margin-top:30px;}

  /* ---------- responsive ---------- */
  @media (max-width:900px){
    .dash{grid-template-columns:1fr;}
    .dash-mbar{display:flex;}
    .side{position:fixed;top:0;inset-inline-start:0;height:100%;width:300px;max-width:86vw;border-radius:0;z-index:120;
      transform:translateX(-110%);transition:transform .22s ease;overflow-y:auto;border-inline-start:none;}
    html[dir="rtl"] .side{transform:translateX(110%);}
    .side.open{transform:translateX(0)!important;box-shadow:var(--shadow-lg);}
    .side-scrim{display:block;position:fixed;inset:0;background:rgba(10,12,20,.5);z-index:110;opacity:0;visibility:hidden;transition:opacity .2s;}
    .side-scrim.open{opacity:1;visibility:visible;}
    .metrics{grid-template-columns:repeat(2,1fr);}
    .quick{grid-template-columns:repeat(2,1fr);}
    .project-row{grid-template-columns:1fr 1fr;gap:12px;}
    .project-main,.project-actions{grid-column:1/-1;}
    .project-actions{justify-content:flex-start;}
  }
  @media (max-width:560px){
    .metrics,.quick,.feats,.grid2{grid-template-columns:1fr;}
    .sc-actions{width:100%;}
    .phead .avatar{width:48px;height:48px;font-size:20px;}
    .project-head{flex-direction:column;align-items:stretch;}
    .project-head .btn{width:100%;}
    .project-row{grid-template-columns:1fr;padding:15px;}
    .project-stat,.project-actions{grid-column:auto;}
    .project-actions{align-items:stretch;justify-content:stretch;}
    .project-actions .btn,.project-status{width:100%;}
  }

  /* ===== KOLKLI Request inbox (my-requests) — its own look, inspired not copied ===== */
  .ri-card{padding:20px 22px 22px;}
  .ri-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
  .ri-head h2{font-size:17px;font-weight:700;margin:0 0 4px;letter-spacing:-0.01em;}
  .ri-head .csub{font-size:13px;color:var(--muted);margin:0;}
  .ri-newbtn{white-space:nowrap;}
  .ri-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .ri-search{position:relative;flex:1;min-width:180px;}
  .ri-search svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--faint);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;}
  .ri-search input{width:100%;height:40px;padding:0 14px;padding-inline-start:36px;border:1px solid var(--line);border-radius:11px;background:var(--panel-2);color:var(--ink);font-family:var(--sans);font-size:13.5px;outline:none;transition:border-color .12s;}
  .ri-search input:focus{border-color:var(--accent);}
  .ri-sort{height:40px;padding:0 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel-2);color:var(--ink-2);font-family:var(--sans);font-size:13px;cursor:pointer;}
  .ri-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .ri-chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--muted);font-family:var(--sans);font-size:12.5px;font-weight:600;cursor:pointer;transition:all .12s;}
  .ri-chip:hover{border-color:var(--accent);color:var(--ink-2);}
  .ri-chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent-dim);}
  .ri-chip .n{font-family:var(--mono);font-size:11px;background:var(--panel-2);border-radius:999px;padding:1px 7px;color:var(--muted);}
  .ri-chip.on .n{background:var(--panel);color:var(--accent-dim);}
  .ri-body{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start;}
  .ri-list{display:flex;flex-direction:column;gap:10px;min-width:0;}
  .ri-row{position:relative;display:flex;align-items:flex-start;gap:13px;padding:14px 15px;border:1px solid var(--line);border-radius:14px;background:var(--panel);cursor:pointer;transition:border-color .12s,box-shadow .12s;box-shadow:var(--shadow-sm);}
  .ri-row:hover{border-color:var(--accent);}
  .ri-row.on{border-color:transparent;box-shadow:0 0 0 1.6px var(--accent),var(--shadow);}
  .ri-mark{flex-shrink:0;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--grad-soft);color:var(--accent-dim);}
  .ri-mark svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .ri-rmain{flex:1;min-width:0;}
  .ri-rtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .ri-name{font-size:14px;font-weight:700;color:var(--ink);letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .ri-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:5px;}
  .ri-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--faint);flex-shrink:0;}
  .ri-meta b{color:var(--ink-2);font-weight:600;}
  .ri-badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:0.01em;}
  .ri-badge.active{background:var(--success-soft);color:var(--success-dim);}
  .ri-badge.expired{background:var(--danger-soft);color:var(--danger);}
  .ri-badge.closed{background:var(--panel-2);color:var(--faint);border:1px solid var(--line);}
  .ri-exp{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;}
  .ri-exp svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .ri-unseen{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--grad);color:#fff;box-shadow:0 2px 8px var(--grad-shadow);}
  .ri-kebab{flex-shrink:0;width:32px;height:32px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:all .12s;}
  .ri-kebab:hover{background:var(--panel-2);border-color:var(--line);color:var(--ink-2);}
  .ri-kebab svg{width:18px;height:18px;}
  .ri-kebab svg circle{fill:currentColor;stroke:none;}
  .ri-menu{position:absolute;top:48px;inset-inline-end:12px;z-index:30;min-width:186px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;display:none;}
  .ri-menu.open{display:block;}
  .ri-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border:none;border-radius:8px;background:transparent;color:var(--ink-2);font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;text-align:start;transition:background .12s;}
  .ri-menu button:hover{background:var(--panel-2);}
  .ri-menu button.danger{color:var(--danger);}
  .ri-menu button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  .ri-menu .sep{height:1px;background:var(--line-2);margin:5px 4px;}
  .ri-detail{position:sticky;top:16px;border:1px solid var(--line);border-radius:16px;background:var(--panel-2);padding:18px;min-height:220px;}
  .ri-dempty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:44px 16px;color:var(--faint);}
  .ri-dempty svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  .ri-dempty p{margin:0;font-size:13px;max-width:230px;}
  .ri-dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .ri-dhead h3{font-size:16px;font-weight:700;margin:0 0 7px;letter-spacing:-0.01em;word-break:break-word;}
  .ri-dhead .btn{white-space:nowrap;}
  .ri-dstats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .ri-stat{flex:1;min-width:74px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 11px;}
  .ri-stat .v{font-size:16px;font-weight:700;color:var(--ink);font-family:var(--mono);}
  .ri-stat .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
  .ri-dlink{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:8px 10px;margin-bottom:14px;}
  .ri-dlink .lk{flex:1;min-width:0;font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:start;}
  .ri-dlink button{flex-shrink:0;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:all .12s;}
  .ri-dlink button:hover{border-color:var(--accent);color:var(--accent-dim);}
  .ri-dlink button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .ri-sub{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:10px;overflow:hidden;}
  .ri-sub-h{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line-2);}
  .ri-ava{flex-shrink:0;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--grad);color:#fff;font-weight:700;font-size:13px;}
  .ri-sub-id{min-width:0;flex:1;}
  .ri-sub-name{font-size:13px;font-weight:700;color:var(--ink);word-break:break-word;}
  .ri-sub-when{font-size:11px;color:var(--faint);margin-top:1px;}
  .ri-sub-contact{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .ri-cchip{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line-2);border-radius:999px;padding:2px 8px;direction:ltr;}
  .ri-cchip svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .ri-note{font-size:12px;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:7px 9px;margin:8px 12px 0;white-space:pre-wrap;word-break:break-word;}
  .ri-files{padding:6px;}
  .ri-frow{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;transition:background .12s;}
  .ri-frow:hover{background:var(--panel-2);}
  .ri-fico{flex-shrink:0;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--panel-2);color:var(--muted);}
  .ri-fico svg{width:16px;height:16px;}
  .ri-fico.image{color:var(--info-dim);}.ri-fico.video{color:#c026d3;}.ri-fico.audio{color:var(--accent-dim);}.ri-fico.doc{color:var(--muted);}
  .ri-fn{flex:1;min-width:0;}
  .ri-fn .nm{font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ri-fn .sz{font-size:11px;color:var(--faint);margin-top:1px;}
  .ri-fdl{flex-shrink:0;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:all .12s;}
  .ri-fdl:hover{border-color:var(--accent);color:var(--accent-dim);}
  .ri-fdl svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .ri-noresults{text-align:center;color:var(--faint);font-size:13px;padding:30px 10px;}
  .ri-toast{position:fixed;bottom:24px;inset-inline:0;margin-inline:auto;width:max-content;max-width:90vw;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:10px 18px;border-radius:999px;box-shadow:var(--shadow-lg);z-index:9999;opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:none;}
  .ri-toast.show{opacity:1;transform:translateY(0);}
  @media(max-width:860px){
    .ri-body{grid-template-columns:1fr;}
    .ri-detail{position:static;}
  }

  var USERS_KEY='ac_users', SESSION_KEY='ac_session', NOTIF_KEY='ac_notif', PROJECTS_KEY='ac_projects', LABELS_KEY='ac_navlabels';
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
  function loadUsers(){ try{ return JSON.parse(lsGet(USERS_KEY))||[]; }catch(e){ return []; } }
  function saveUsers(u){ lsSet(USERS_KEY, JSON.stringify(u)); }
  function safeOwnerId(v){ return String(v||'guest').toLowerCase().replace(/[^a-z0-9_.@-]+/g,'_') || 'guest'; }
  function currentOwnerId(){
    var email=(lsGet(SESSION_KEY)||'').toLowerCase();
    if(!email) return 'guest';
    var u=loadUsers().find(function(x){ return (x.email||'').toLowerCase()===email; });
    return safeOwnerId((u&&(u.id||u.userId))||email);
  }
  function scopedKey(k){ return k+'::'+currentOwnerId(); }
  function lsGetOwn(k){ return lsGet(scopedKey(k)); }
  function lsSetOwn(k,v){ return lsSet(scopedKey(k), v); }

  function activeRecord(x){ return !x.expiresAt || Date.now() <= x.expiresAt; }
  function sameMonth(ms){
    var d=new Date(ms||0), n=new Date();

  function currentUsage(){
    var projects=loadProjects();
    var reqs=window.KR ? KR.loadRequests() : readOwnArray('kr_requests');
    var sends=readOwnArray('kolkli_send_links');
    var reviews=readOwnArray('rv_projects');
    var bytes=0, filesCount=0, activeLinks=0;
    projects.forEach(function(p){ filesCount+=Number(p.files)||0; bytes+=(Number(p.sizeMB)||0)*1048576; });
    reqs.forEach(function(r){
      var fs=r.files||[]; filesCount+=fs.length; activeLinks+=activeRecord(r)?1:0;
      bytes+=fs.reduce(function(s,f){ return s+(Number(f.size)||0); },0);
    });
    sends.forEach(function(s){
      filesCount+=Number(s.files)||0; bytes+=Number(s.bytes)||0; activeLinks+=activeRecord(s)?1:0;
    });
    reviews.forEach(function(p){
      var items=p.items||[]; filesCount+=items.length; activeLinks+=activeRecord(p)?1:0;
      bytes+=items.reduce(function(s,f){ return s+(Number(f.size)||0); },0);
    });
    return {
      storageGB: Math.round((bytes/1073741824)*100)/100,
      transfersMo: sends.filter(function(s){ return sameMonth(s.createdAt); }).length,
      files: filesCount,
      links: activeLinks
    };
  }

  // Read an image file, downscale it to <=256px on a canvas (keeps localStorage
  // small) and store the result as the avatar.
  function readAvatarFile(file){
    if(!file) return;
    if(!/^image\//.test(file.type) || file.size>5*1024*1024){ alert(t.photoErr); return; }
    var reader=new FileReader();
    reader.onload=function(){
      var img=new Image();
      img.onload=function(){
        var max=256, scale=Math.min(1, max/Math.max(img.width, img.height));
        var cw=Math.max(1,Math.round(img.width*scale)), ch=Math.max(1,Math.round(img.height*scale));
        var cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
        var ctx=cv.getContext('2d');
        ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,cw,ch);
        ctx.drawImage(img,0,0,cw,ch);
        var data; try{ data=cv.toDataURL('image/jpeg',0.85); }catch(e){ data=reader.result; }
        user.avatar=data; persistUser(); render();
      };
      img.onerror=function(){ alert(t.photoErr); };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  }

  var EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  var Team = (function(){
    var orgId=null, myId=null;
    function demoInvites(){ try{ return JSON.parse(lsGet('kolkli_demo_invites'))||[]; }catch(e){ return []; } }
    function saveDemoInvites(a){ lsSet('kolkli_demo_invites', JSON.stringify(a)); }
    function sb(){ return (window.KolkliAuth && window.KolkliAuth.configured()) ? window.KolkliAuth.getClient() : Promise.resolve(null); }

    async function load(){
      var c=await sb();
      if(!c){
        return { demo:true, org:{ name:(user.name||'My')+' · '+(({he:'סביבת עבודה',en:'workspace',ru:'рабочая область'})[lang]||'workspace'), plan:plan, seats:3 },
          role:'owner', members:[{ id:'me', name:user.name||((user.email||'you').split('@')[0]), email:user.email||'you@example.com', role:'owner', you:true }],
          invites:demoInvites() };
      }
      myId=await window.KolkliAuth.userId();
      var orgs=((await c.from('organizations').select('id,name,plan,seats,owner')).data)||[];
      if(!orgs.length) return { org:null, members:[], invites:[], role:null };
      var mine=null; for(var i=0;i<orgs.length;i++){ if(orgs[i].owner===myId){ mine=orgs[i]; break; } }
      mine=mine||orgs[0]; orgId=mine.id;
      var mem=((await c.from('org_members').select('user_id,role').eq('org_id',orgId)).data)||[];
      var ids=mem.map(function(m){ return m.user_id; });
      var profs=ids.length ? (((await c.from('profiles').select('id,full_name,email').in('id',ids)).data)||[]) : [];
      var pmap={}; profs.forEach(function(p){ pmap[p.id]=p; });
      var members=mem.map(function(m){ var p=pmap[m.user_id]||{}; return { id:m.user_id, name:p.full_name||'', email:p.email||'', role:m.role, you:m.user_id===myId }; });
      members.sort(function(a,b){ var o={owner:0,admin:1,member:2}; return (o[a.role]-o[b.role]); });
      var myRole=(members.find(function(m){ return m.you; })||{}).role||'member';
      var invites=((await c.from('org_invites').select('id,email,role,token').eq('org_id',orgId).eq('accepted',false)).data)||[];
      return { org:mine, members:members, invites:invites, role:myRole };
    }
    async function invite(email, role){
      var c=await sb();
      if(!c){ var a=demoInvites(); var tok='demo-'+Math.random().toString(36).slice(2,10); a.push({ id:'d'+a.length+'-'+tok, email:email, role:role, token:tok }); saveDemoInvites(a); return { ok:true, token:tok }; }
      var res=await c.from('org_invites').insert({ org_id:orgId, email:email.toLowerCase(), role:role }).select('token').single();
      return res.error ? { ok:false, message:res.error.message } : { ok:true, token:res.data.token };
    }
    async function revokeInvite(id){
      var c=await sb();
      if(!c){ saveDemoInvites(demoInvites().filter(function(x){ return x.id!==id; })); return { ok:true }; }
      var res=await c.from('org_invites').delete().eq('id',id); return { ok:!res.error, message:res.error&&res.error.message };
    }
    async function setRole(uid, role){ var c=await sb(); if(!c) return { ok:true }; var res=await c.from('org_members').update({ role:role }).eq('org_id',orgId).eq('user_id',uid); return { ok:!res.error, message:res.error&&res.error.message }; }
    async function removeMember(uid){ var c=await sb(); if(!c) return { ok:true }; var res=await c.from('org_members').delete().eq('org_id',orgId).eq('user_id',uid); return { ok:!res.error, message:res.error&&res.error.message }; }
    async function acceptInvite(token){ var c=await sb(); if(!c) return { ok:false, message:'not configured' }; var res=await c.rpc('accept_invite',{ invite_token:token }); return res.error ? { ok:false, message:res.error.message } : { ok:true, orgId:res.data }; }
    return { load:load, invite:invite, revokeInvite:revokeInvite, setRole:setRole, removeMember:removeMember, acceptInvite:acceptInvite };
  })();

  function billingOn(){ return !!(typeof kolkliWorker==='function' && kolkliWorker('billing') && window.KolkliAuth && window.KolkliAuth.configured()); }
  async function billingGo(path, extra){
    var base=(typeof kolkliWorker==='function') && kolkliWorker('billing');
    if(!base){ location.href='pricing/'; return; }
    try{
      var token=await window.KolkliAuth.getToken();
      var d=await Team.load();
      var orgId=d && d.org && d.org.id;
      if(!token || !orgId){ location.href='pricing/'; return; }
      var payload=Object.assign({ orgId:orgId }, extra||{});
      if(path==='/checkout' && !payload.seats) payload.seats=Math.max(1, (d.members||[]).length);
      var r=await fetch(base+path, { method:'POST', headers:{ authorization:'Bearer '+token, 'content-type':'application/json' }, body:JSON.stringify(payload) }).then(function(x){ return x.json(); });
      if(r && r.url){ location.href=r.url; } else { alert((r && r.error) || tt().errGeneric); }
    }catch(e){ location.href='pricing/'; }
  }
  function billingCheckout(planName){ return billingGo('/checkout', { plan:planName }); }
  function billingPortal(){ return billingGo('/portal', {}); }

        '<div class="tm-err" id="tmErr"></div>'+

  function loadTeam(){
    var root=el('teamRoot'); if(!root) return Promise.resolve();
    return Team.load().then(function(d){
      var r=el('teamRoot'); if(!r) return;      // view may have changed while loading
      r.innerHTML = buildTeam(d);
      wireTeam(r);
      if(focusInvite){ focusInvite=false; var em=el('tmEmail'); if(em){ em.focus(); em.scrollIntoView({block:'center'}); } }
    }).catch(function(e){

  // Show the shareable invite link in #tmLink and bind its copy button.
  // Called AFTER loadTeam() rebuilds the panel, so it isn't wiped out.
  function showInviteLink(token){
    var x=tt(), lk=el('tmLink'); if(!lk) return;
    var link=inviteLink(token);
    lk.innerHTML='<div class="opt-d" style="margin-bottom:6px">'+esc(x.inviteCreated)+'</div>'+
      '<div class="tm-linkrow"><input type="text" readonly dir="ltr" value="'+esc(link)+'">'+
      '<button class="btn ghost" type="button" data-copy-token="'+esc(token)+'">'+s(ICON.copy)+esc(x.copyLink)+'</button></div>';
    var cb=lk.querySelector('[data-copy-token]');
    if(cb) cb.addEventListener('click', function(){
      var done=function(){ var old=cb.innerHTML; cb.innerHTML=s(ICON.check)+esc(x.copied); setTimeout(function(){ cb.innerHTML=old; }, 1400); };
      try{ navigator.clipboard.writeText(link).then(done, done); }catch(e){ done(); }
    });
  }
  function wireTeam(root){
    var x=tt();
    var inv=el('tmInvite');
    if(inv) inv.addEventListener('click', function(){
      var email=(el('tmEmail').value||'').trim().toLowerCase();
      var role=el('tmRole').value;
      var errBox=el('tmErr'); errBox.textContent='';
      if(!EMAIL_RE.test(email)){ errBox.textContent=x.errEmail; return; }
      inv.disabled=true;
      Team.invite(email, role).then(function(r){
        inv.disabled=false;
        if(!r.ok){ errBox.textContent=r.message||x.errGeneric; return; }
        // refresh the whole panel (new pending row + seat count), THEN
        // re-show the shareable link so the rebuild doesn't wipe it.
        loadTeam().then(function(){ showInviteLink(r.token); });
      });
    });
    root.querySelectorAll('[data-role-user]').forEach(function(sel){
      sel.addEventListener('change', function(){ Team.setRole(sel.getAttribute('data-role-user'), sel.value).then(loadTeam); });
    });
    root.querySelectorAll('[data-remove-user]').forEach(function(b){
      b.addEventListener('click', function(){ if(confirm(x.removeConfirm)) Team.removeMember(b.getAttribute('data-remove-user')).then(loadTeam); });
    });
    root.querySelectorAll('[data-revoke-invite]').forEach(function(b){
      b.addEventListener('click', function(){ Team.revokeInvite(b.getAttribute('data-revoke-invite')).then(loadTeam); });
    });
    root.querySelectorAll('[data-copy-token]').forEach(function(b){
      b.addEventListener('click', function(){
        var link=inviteLink(b.getAttribute('data-copy-token'));
        var done=function(){ var old=b.innerHTML; b.innerHTML=s(ICON.check)+esc(x.copied); setTimeout(function(){ b.innerHTML=old; }, 1400); };
        try{ navigator.clipboard.writeText(link).then(done, done); }catch(e){ done(); }
      });
    });
  }

  function riExpiry(r){
    if(!r.expiresAt) return '';
    var ms=r.expiresAt-Date.now();
    if(ms<=0) return t.ri.expiredOn;
    var d=Math.ceil(ms/86400000);
    return d<=1 ? t.ri.expToday : t.ri.expDays(d);
  }
  function riUploadUrl(token){
    var base=location.href.split(/[?#]/)[0].replace(/[^\/]*$/,'');
    return base+'upload.html?req='+token;

  function riFiltered(){
    var arr=riReqs();
    var q=reqState.q.trim().toLowerCase();
    if(q) arr=arr.filter(function(r){ return (r.name||'').toLowerCase().indexOf(q)>=0; });
    if(reqState.filter!=='all') arr=arr.filter(function(r){ return riStatus(r)===reqState.filter; });
    arr.sort(function(a,b){
      if(reqState.sort==='old') return a.createdAt-b.createdAt;
      if(reqState.sort==='name') return (a.name||'').localeCompare(b.name||'');
      if(reqState.sort==='files') return ((b.files||[]).length)-((a.files||[]).length);
      return b.createdAt-a.createdAt;
    });
    return arr;
  }

  function riCloseMenus(){ document.querySelectorAll('.ri-menu.open').forEach(function(m){ m.classList.remove('open'); }); }
  function riToast(msg){
    var box=el('riToast');
    if(!box){ box=document.createElement('div'); box.id='riToast'; box.className='ri-toast'; document.body.appendChild(box); }
    box.textContent=msg; box.classList.add('show');
    clearTimeout(box._t); box._t=setTimeout(function(){ box.classList.remove('show'); }, 1600);
  }
  function riCopy(token){
    var url=riUploadUrl(token), done=function(){ riToast(t.ri.copied); };
    try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done,done); return; } }catch(e){}
    var ta=document.createElement('textarea'); ta.value=url; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(_){ } ta.remove(); done();
  }
  function riDownload(id){
    if(!window.KR) return;
    KR.getBlob(id).then(function(blob){
      if(!blob) return;
      var r=KR.getRequest(reqState.sel), f=r&&(r.files||[]).filter(function(x){ return x.id===id; })[0];
      var url=URL.createObjectURL(blob), a=document.createElement('a');
      a.href=url; a.download=(f&&f.name)||'file'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    });
  }
  function riDuplicate(token){
    if(!window.KR) return;
    var src=KR.getRequest(token); if(!src) return;
    var copy=JSON.parse(JSON.stringify(src));
    copy.token=KR.randToken(); copy.name=(src.name||'')+t.ri.dupSuffix; copy.createdAt=Date.now();
    copy.status='active'; copy.submissions=[]; copy.files=[];
    if(src.expiresAt){ var span=src.expiresAt-src.createdAt; copy.expiresAt=Date.now()+Math.max(span,86400000); }
    KR.upsertRequest(copy); reqState.sel=copy.token; renderMain();
  }
  function riClose(token){
    if(!window.KR || !confirm(t.ri.confClose)) return;
    var r=KR.getRequest(token); if(!r) return; r.status='closed'; KR.upsertRequest(r); renderMain();
  }
  function riDelete(token){
    if(!window.KR || !confirm(t.ri.confDel)) return;
    KR.deleteRequest(token).then(function(){ if(reqState.sel===token) reqState.sel=null; renderMain(); });
  }
  function riMarkSeen(token){
    if(!window.KR) return;
    var r=KR.getRequest(token); if(!r) return;
    var ch=false; (r.files||[]).forEach(function(f){ if(!f.seen){ f.seen=true; ch=true; } });
    if(ch) KR.upsertRequest(r);
  }

  function wireReqInbox(){
    var listEl=el('riList'); if(!listEl) return;
    renderReqList();
    var search=el('riSearch');
    if(search) search.addEventListener('input', function(){ reqState.q=search.value; renderReqList(); });
    var sort=el('riSort');
    if(sort) sort.addEventListener('change', function(){ reqState.sort=sort.value; renderReqList(); });
    var filters=el('riFilters');
    if(filters) filters.addEventListener('click', function(e){
      var b=e.target.closest('[data-rfilter]'); if(!b) return;
      reqState.filter=b.getAttribute('data-rfilter'); renderReqList();
    });
    listEl.addEventListener('click', function(e){
      var actBtn=e.target.closest('[data-ract]');
      if(actBtn){
        e.stopPropagation(); riCloseMenus();
        var act=actBtn.getAttribute('data-ract'), token=actBtn.getAttribute('data-rtoken');
        if(act==='open') location.href='request.html?tab=manage';
        else if(act==='copy') riCopy(token);
        else if(act==='dup') riDuplicate(token);
        else if(act==='close') riClose(token);
        else if(act==='del') riDelete(token);
        return;
      }
      var kb=e.target.closest('[data-rmenu]');
      if(kb){
        e.stopPropagation();
        var tk=kb.getAttribute('data-rmenu');
        var menu=listEl.querySelector('.ri-menu[data-menu-for="'+(window.CSS&&CSS.escape?CSS.escape(tk):tk)+'"]');
        var wasOpen=menu&&menu.classList.contains('open');
        riCloseMenus();
        if(menu&&!wasOpen) menu.classList.add('open');
        return;
      }
      var row=e.target.closest('[data-rtoken]');
      if(row){
        riCloseMenus();
        reqState.sel=row.getAttribute('data-rtoken');
        riMarkSeen(reqState.sel);
        renderReqList();
      }
    });
    var detail=el('riDetail');
    if(detail) detail.addEventListener('click', function(e){
      var dl=e.target.closest('[data-rdl]'); if(dl){ riDownload(dl.getAttribute('data-rdl')); return; }
      var cp=e.target.closest('[data-rcopy]'); if(cp){ riCopy(cp.getAttribute('data-rcopy')); return; }
    });
    if(!wireReqInbox._docBound){
      document.addEventListener('click', function(e){
        if(!e.target.closest('.ri-menu') && !e.target.closest('[data-rmenu]')) riCloseMenus();
      });
      wireReqInbox._docBound=true;
    }
    if(!reqBC && window.KR && KR.listen){
      reqBC=KR.listen(function(){ if(view==='my-requests') renderMain(); });
    }
  }

  function selectView(id){
    view=id;
    if(id!=='my-files') activeProjectId=null;
    // keep the owning category open
    NAV.forEach(function(c){ if(c.items.some(function(it){return it.id===id;})) c.open=true; });
    closeDrawer();
    render();
    try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); }
  }

  function commitLabel(id){
    var inp=el('side').querySelector('[data-label-input="'+id+'"]');
    if(inp) setLabel(id, inp.value);
    editingLabel=null;
    renderSide();
  }
  function focusLabelInput(){
    var inp=el('side').querySelector('.lbl-input');
    if(inp){ inp.focus(); try{ inp.select(); }catch(e){} }
  }

  function wireSide(){
    el('side').addEventListener('click', function(e){
      var tog=e.target.closest('[data-cattoggle]');
      if(tog){
        var id=tog.getAttribute('data-cattoggle');
        var cat=NAV.find(function(c){ return c.id===id; });
        cat.open=!cat.open;
        renderSide();
        return;
      }
      // rename a sidebar label — must run before the data-view (navigate) check
      var editBtn=e.target.closest('[data-editlabel]');
      if(editBtn){ editingLabel=editBtn.getAttribute('data-editlabel'); renderSide(); focusLabelInput(); return; }
      var saveBtn=e.target.closest('[data-savelabel]');
      if(saveBtn){ commitLabel(saveBtn.getAttribute('data-savelabel')); return; }
      if(e.target.closest('.lbl-input')) return; // clicks inside the input shouldn't navigate
      var addProject=e.target.closest('#sideNewProject');
      if(addProject){ location.href='files.html?new=1'; return; }
      var addNav=e.target.closest('[data-add-href]');
      if(addNav){ location.href=addNav.getAttribute('data-add-href'); return; }
      var addView=e.target.closest('[data-add-view]');
      if(addView){ focusInvite=true; selectView(addView.getAttribute('data-add-view')); return; }
      var project=e.target.closest('[data-project]');
      if(project){ activeProjectId=project.getAttribute('data-project'); selectView('my-files'); return; }
      var item=e.target.closest('[data-view]');
      if(item){
        if(item.getAttribute('data-view')==='my-files') activeProjectId=null;
        selectView(item.getAttribute('data-view'));
        return;
      }
      var upg=e.target.closest('#sideUpg');
      if(upg){ location.href='pricing/'; }
    });
    el('side').addEventListener('keydown', function(e){
      var inp=e.target.closest('[data-label-input]');
      if(!inp) return;
      if(e.key==='Enter'){ e.preventDefault(); commitLabel(inp.getAttribute('data-label-input')); }
      else if(e.key==='Escape'){ e.preventDefault(); editingLabel=null; renderSide(); }
    });
  }

      b.addEventListener('click', function(){ applyLang(b.getAttribute('data-setlang')); lsSet('ac_lang', b.getAttribute('data-setlang')); });
    });
    // settings: theme
    host.querySelectorAll('[data-settheme]').forEach(function(b){
      b.addEventListener('click', function(){ applyTheme(b.getAttribute('data-settheme')); render(); });
    });
    // settings: toggles
    host.querySelectorAll('[data-toggle]').forEach(function(b){
      b.addEventListener('click', function(){
        var k=b.getAttribute('data-toggle'); notif[k]=!notif[k]; lsSetOwn(NOTIF_KEY, JSON.stringify(notif));
        b.classList.toggle('on', notif[k]);
      });
    });
    // details: save
    var save=el('saveDetails');
    if(save) save.addEventListener('click', function(){
      var nm=el('dName').value.trim();
      if(!isGuest){
        var users=loadUsers(), i=users.findIndex(function(x){ return x.email===user.email; });
        if(i>-1){ users[i].name=nm; saveUsers(users); user=users[i]; }
      }
      var m=el('savedMsg'); if(m){ m.classList.add('show'); setTimeout(function(){ m.classList.remove('show'); }, 1800); }
      renderSide();
    });
    // settings: logout / delete
    var lo=el('doLogout');
    if(lo) lo.addEventListener('click', function(){
      if(confirm(t.logoutConfirm)){ lsDel(SESSION_KEY); location.href='index.html'; }
    });
    var del=el('doDelete');
    if(del) del.addEventListener('click', function(){
      if(confirm(t.delConfirm)){
        var users=loadUsers().filter(function(x){ return x.email!==user.email; });
        saveUsers(users); lsDel(SESSION_KEY); location.href='index.html';
      }
    });
    var addc=el('addCard');
    if(addc) addc.addEventListener('click', function(){ location.href='pricing/'; });
    // billing: Stripe checkout / portal (falls back to pricing/ if unconfigured)
    host.querySelectorAll('[data-billing-checkout]').forEach(function(b){
      b.addEventListener('click', function(){ billingCheckout(b.getAttribute('data-billing-checkout')); });
    });
    var bportal=host.querySelector('[data-billing-portal]');
    if(bportal) bportal.addEventListener('click', function(){ billingPortal(); });
    // team view loads its data (Supabase / demo) after the shell renders
    if(view==='team') loadTeam();
    // request inbox binds its list/detail interactions after the shell renders
    if(view==='my-requests') wireReqInbox();
  }

  /* =====================================================
     Language + theme (header owns the picker → __setLang)
     ===================================================== */
  function applyLang(l){
    if(!I18N[l]) l='he';
    lang=l; t=I18N[l];
    document.documentElement.lang=l;
    document.documentElement.dir=(l==='he')?'rtl':'ltr';
    try{ localStorage.setItem('ac_lang', l); }catch(e){}
    el('mMenuTx').textContent=t.menu;
    el('dfoot').textContent=t.footer;
    render();
  }
  window.__setLang=applyLang;

  function detectLang(){
    var c=lsGet('ac_lang'); if(c) return c;
    var cc=lsGet('ac_country'); if(cc) return cc==='IL'?'he':'en';
    var tz=''; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(e){}
    var navHe=(navigator.language||'').toLowerCase().indexOf('he')===0;
    return (tz==='Asia/Jerusalem'||navHe)?'he':'en';
  }
  function applyTheme(th){
    var dark=(th==='dark');
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
    var ti=el('themeIco'); if(ti) ti.textContent=dark?'☀️':'🌙';
    try{ localStorage.setItem('theme', dark?'dark':'light'); }catch(e){}
  }

  /* =====================================================
     Init
     ===================================================== */
  // Deep-link: dashboard.html#settings (etc.) opens that view directly — used by
  // the header account menu. Only accepts ids that exist in NAV.
  function viewFromHash(){
    var h=(location.hash||'').replace(/^#/,'');
    if(!h) return null;
    return NAV.some(function(c){ return c.items.some(function(it){ return it.id===h; }); }) ? h : null;
  }

  applyTheme(lsGet('theme')||'light');
  loadUser();
  // Invite deep-link: dashboard.html#join=TOKEN → accept it, then open Team.
  (function handleJoin(){
    var m=(location.hash||'').match(/^#join=([A-Za-z0-9\-]+)/);
    if(!m) return;
    var token=m[1];
    try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
    if(window.KolkliAuth && window.KolkliAuth.configured()){
      Team.acceptInvite(token).then(function(r){
        if(r.ok){ selectView('team'); }
        else { alert(tt().joinFail+(r.message?(': '+r.message):'')); }
      });
    } else {
      alert(tt().joinDemo);
    }
  })();
  var hv=viewFromHash(); if(hv) view=hv;
  window.addEventListener('hashchange', function(){ var v=viewFromHash(); if(v) selectView(v); });
  // auth-store.js loads async and fires kolkli:auth once the Supabase session
  // is synced. Re-render then so the account + billing buttons reflect the
  // real signed-in state (guarded to the session actually changing, so a
  // periodic token refresh doesn't wipe a form the user is filling in).
  window.addEventListener('kolkli:auth', function(){
    var before = user && user.email;
    loadUser();
    if((user && user.email) !== before) render();
  });
  wireSide();
  el('mMenuBtn').addEventListener('click', openDrawer);
  el('sideScrim').addEventListener('click', closeDrawer);
  var tb=el('themeToggle'); if(tb) tb.addEventListener('click', function(){
    applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'); render();
  });
  applyLang(detectLang());
})();
</script>
</body>
</html>
