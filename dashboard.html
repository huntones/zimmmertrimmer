<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOLKLI — דשבורד</title>
<link rel="canonical" href="https://kolkli.com/dashboard">
<meta name="description" content="Your KOLKLI dashboard — manage your profile, audio, video, files and transfers. See your plan, limits and current usage.">
<style>
  :root {
    --bg:#ffffff; --panel:#ffffff; --panel-2:#f5f6fa; --line:#e5e8f0; --line-2:#eef0f6;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#7c3aed; --accent-dim:#6a2fe0; --accent-ink:#ffffff; --accent-soft:#efe9fe;
    --sel-bg:#f4f0ff; --sel-line:#c9d0e0;
    --new-bg:#f1f3f8; --new-line:#dde2ee;
    --success:#22b04b; --success-dim:#1c9a41; --success-soft:#e6f6ec;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --danger:#e5484d; --danger-soft:#fdecec;
    --warm-soft:#fff5da; --warm-line:#f2d98a;
    --ok:#22b04b; --warn:#c88a04; --err:#e5484d;
    --grad:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-h:linear-gradient(105deg,#6a29e6 0%,#2f74f0 100%);
    --grad-soft:linear-gradient(120deg,#efe9fe,#e6f0ff);
    --grad-shadow:rgba(93,79,240,0.30);
    --grad-btn:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn-glow:rgba(59,111,246,0.38);
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-lg:0 2px 6px rgba(20,24,44,0.05), 0 20px 50px rgba(20,24,44,0.10);
    --shadow-sm:0 1px 2px rgba(20,24,44,0.05);
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --sans:'Space Grotesk',system-ui,'Segoe UI','Heebo',sans-serif;
  }
  html[data-theme="dark"] {
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a303c; --line-2:#232833;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --accent:#a06bff; --accent-dim:#7c3aed; --accent-ink:#ffffff; --accent-soft:#241a3a;
    --sel-bg:#1f1830; --sel-line:#39414f;
    --new-bg:#1b2029; --new-line:#333b48;
    --success:#37c26a; --success-dim:#2fae5e; --success-soft:#132a1c;
    --info:#5b95f8; --info-dim:#4f8ef7; --info-soft:#182338;
    --danger:#ff6b6b; --danger-soft:#2a1719;
    --warm-soft:#2c2718; --warm-line:#5a4d24;
    --ok:#4ec98a; --warn:#e8b84b; --err:#ff6b6b;
    --grad:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-h:linear-gradient(105deg,#9a63ff 0%,#6aa2ff 100%);
    --grad-soft:linear-gradient(120deg,#1c1633,#11242a);
    --grad-shadow:rgba(77,123,255,0.42);
    --grad-btn:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn-glow:rgba(77,123,255,0.45);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,0.45), 0 24px 60px rgba(0,0,0,0.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;overflow-x:clip;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;}
  body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:var(--bg);}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--sans);}

  /* ---------- layout ---------- */
  /* content box spans the viewport while keeping the same side padding as the shared header */
  .dash-wrap{width:100%;max-width:none;margin:0 auto;padding:22px 22px 60px;}
  .dash{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:start;}

  /* ---------- mobile bar ---------- */
  .dash-mbar{display:none;align-items:center;gap:12px;margin-bottom:14px;}
  .dash-mbar button{display:inline-flex;align-items:center;gap:9px;height:42px;padding:0 16px;border-radius:12px;
    background:var(--panel);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;font-size:14px;font-weight:600;box-shadow:var(--shadow-sm);}
  .dash-mbar button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .dash-mbar .mbar-title{font-weight:700;font-size:15px;}

  /* ---------- sidebar ---------- */
  .side{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow);
    position:sticky;top:88px;display:flex;flex-direction:column;gap:4px;}
  .side-logo{display:none;}
  .side-logo img{display:block;width:auto;height:34px;}
  .side-nav-card{display:flex;flex-direction:column;gap:4px;}
  .side-scrim{display:none;}

  .cat{border-radius:12px;}
  .cat-head{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border:none;background:none;cursor:pointer;
    color:var(--ink-2);font-family:var(--sans);font-size:14.5px;font-weight:700;border-radius:11px;text-align:start;transition:background .12s,color .12s;}
  .cat-head:hover{background:var(--panel-2);}
  .cat-head .cat-ic{width:34px;height:34px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center;
    background:var(--grad-soft);color:var(--accent);}
  .cat-head .cat-ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .cat-head .cat-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cat-head .cat-chev{width:16px;height:16px;flex-shrink:0;color:var(--faint);transition:transform .2s ease;}
  .cat-head .cat-chev svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .cat.open .cat-head .cat-chev{transform:rotate(180deg);}
  .cat.on > .cat-head{color:var(--accent-dim);}
  .cat.on > .cat-head .cat-ic{background:var(--grad);color:#fff;box-shadow:0 4px 12px var(--grad-shadow);}
  .cat.no-subs .cat-head{cursor:pointer;}
  .cat.no-subs .cat-chev{display:none;}

  .subs{display:none;flex-direction:column;gap:2px;padding:2px 4px 8px;}
  .cat.open .subs{display:flex;}
  .subitem{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--muted);
    font-size:13.5px;font-weight:600;transition:background .12s,color .12s;border:1px solid transparent;}
  .subitem .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5;flex-shrink:0;margin-inline-start:12px;}
  .subitem:hover{background:var(--panel-2);color:var(--ink-2);}
  .subitem.active{background:var(--accent-soft);color:var(--accent-dim);border-color:var(--accent);}
  .subitem.active .dot{opacity:1;}
  .mp-tone-select{--svc:#2563eb;--svc-bg:rgba(37,99,235,.12);--svc-line:rgba(37,99,235,.42);--svc-shadow:rgba(37,99,235,.22);}
  .mp-tone-receive{--svc:#0891b2;--svc-bg:rgba(8,145,178,.12);--svc-line:rgba(8,145,178,.42);--svc-shadow:rgba(8,145,178,.22);}
  .mp-tone-send{--svc:#f97316;--svc-bg:rgba(249,115,22,.14);--svc-line:rgba(249,115,22,.44);--svc-shadow:rgba(249,115,22,.24);}
  .mp-tone-review{--svc:#16a34a;--svc-bg:rgba(22,163,74,.13);--svc-line:rgba(22,163,74,.42);--svc-shadow:rgba(22,163,74,.22);}
  .mp-tone-all{--svc:#4f46e5;--svc-bg:rgba(79,70,229,.12);--svc-line:rgba(79,70,229,.40);--svc-shadow:rgba(79,70,229,.22);}
  .edit-tone-all{--svc:#7c3aed;--svc-bg:rgba(124,58,237,.12);--svc-line:rgba(124,58,237,.40);--svc-shadow:rgba(124,58,237,.22);}
  .edit-tone-audio{--svc:#c026d3;--svc-bg:rgba(192,38,211,.12);--svc-line:rgba(192,38,211,.40);--svc-shadow:rgba(192,38,211,.22);}
  .edit-tone-video{--svc:#2563eb;--svc-bg:rgba(37,99,235,.12);--svc-line:rgba(37,99,235,.40);--svc-shadow:rgba(37,99,235,.22);}
  .edit-tone-images{--svc:#ca8a04;--svc-bg:rgba(202,138,4,.14);--svc-line:rgba(202,138,4,.42);--svc-shadow:rgba(202,138,4,.22);}
  .edit-tone-docs{--svc:#dc2626;--svc-bg:rgba(220,38,38,.12);--svc-line:rgba(220,38,38,.38);--svc-shadow:rgba(220,38,38,.20);}
  .cat.on.mp-tone-select > .cat-head,
  .cat.on.mp-tone-receive > .cat-head,
  .cat.on.mp-tone-send > .cat-head,
  .cat.on.mp-tone-review > .cat-head,
  .cat.on.mp-tone-all > .cat-head,
  .cat.on.edit-tone-all > .cat-head,
  .cat.on.edit-tone-audio > .cat-head,
  .cat.on.edit-tone-video > .cat-head,
  .cat.on.edit-tone-images > .cat-head,
  .cat.on.edit-tone-docs > .cat-head{color:var(--svc);}
  .cat.on.mp-tone-select > .cat-head .cat-ic,
  .cat.on.mp-tone-receive > .cat-head .cat-ic,
  .cat.on.mp-tone-send > .cat-head .cat-ic,
  .cat.on.mp-tone-review > .cat-head .cat-ic,
  .cat.on.mp-tone-all > .cat-head .cat-ic,
  .cat.on.edit-tone-all > .cat-head .cat-ic,
  .cat.on.edit-tone-audio > .cat-head .cat-ic,
  .cat.on.edit-tone-video > .cat-head .cat-ic,
  .cat.on.edit-tone-images > .cat-head .cat-ic,
  .cat.on.edit-tone-docs > .cat-head .cat-ic{background:var(--svc);color:#fff;box-shadow:0 4px 12px var(--svc-shadow);}
  .subitem.mp-tone-select .dot,
  .subitem.mp-tone-receive .dot,
  .subitem.mp-tone-send .dot,
  .subitem.mp-tone-review .dot,
  .subitem.edit-tone-all .dot,
  .subitem.edit-tone-audio .dot,
  .subitem.edit-tone-video .dot,
  .subitem.edit-tone-images .dot,
  .subitem.edit-tone-docs .dot{background:var(--svc);opacity:.75;}
  .subitem.mp-tone-select:hover,
  .subitem.mp-tone-receive:hover,
  .subitem.mp-tone-send:hover,
  .subitem.mp-tone-review:hover,
  .subitem.edit-tone-all:hover,
  .subitem.edit-tone-audio:hover,
  .subitem.edit-tone-video:hover,
  .subitem.edit-tone-images:hover,
  .subitem.edit-tone-docs:hover{background:var(--svc-bg);color:var(--svc);}
  .subitem.active.mp-tone-select,
  .subitem.active.mp-tone-receive,
  .subitem.active.mp-tone-send,
  .subitem.active.mp-tone-review,
  .subitem.active.edit-tone-all,
  .subitem.active.edit-tone-audio,
  .subitem.active.edit-tone-video,
  .subitem.active.edit-tone-images,
  .subitem.active.edit-tone-docs{background:var(--svc-bg);color:var(--svc);border-color:var(--svc-line);}
  /* Selected "My Files" / "My Projects" head: unified subtle-purple active pill.
     Overrides the per-service tone on the head so the whole system reads one accent
     when a top-level category is the current page (matches .subitem.active language). */
  .cat.on.no-subs > .cat-head{background:var(--accent-soft);color:var(--accent-dim);}
  .cat.on.no-subs > .cat-head:hover{background:color-mix(in srgb,var(--accent) 18%,var(--accent-soft));}
  .cat.on.no-subs > .cat-head .cat-ic{background:var(--grad);color:#fff;box-shadow:0 4px 12px var(--grad-shadow);}
  .client-subbar{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:6px;align-items:center;}
  .client-subbar .subitem{min-width:0;}
  .side-add-project{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:var(--panel);
    color:var(--accent-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-sm);
    transition:background .12s,border-color .12s,transform .08s;}
  .side-add-project:hover{background:var(--accent-soft);border-color:var(--accent);}
  .side-add-project:active{transform:translateY(1px);}
  .side-add-project svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .side-projects{display:flex;flex-direction:column;gap:3px;padding:4px 2px 2px;}
  .project-nav{display:flex;align-items:center;gap:8px;width:100%;min-height:34px;padding:7px 12px;border:none;border-radius:10px;
    background:none;color:var(--muted);font-family:var(--sans);font-size:12.8px;font-weight:600;text-align:start;cursor:pointer;
    transition:background .12s,color .12s;}
  .project-nav:hover{background:var(--panel-2);color:var(--ink-2);}
  .project-nav.active{background:var(--accent-soft);color:var(--accent-dim);}
  .project-nav .pn-dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.65;flex-shrink:0;}
  .project-nav .pn-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .side-links{display:flex;flex-direction:column;gap:4px;margin-top:2px;padding-top:6px;}
  .side-link{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;color:var(--ink-2);
    width:100%;border:0;background:transparent;font-family:var(--sans);font-size:14.5px;font-weight:800;text-align:start;cursor:pointer;transition:background .12s,color .12s;}
  .side-link:hover,.side-link.active{background:var(--tool-bg,var(--panel-2));color:var(--tool,var(--accent-dim));}
  .side-link-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;background:var(--tool-bg,var(--accent-soft));color:var(--tool,var(--accent-dim));}
  .side-link-ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .side-link.ai{--tool:#9333ea;--tool-bg:rgba(147,51,234,.12);}
  .side-link.editing{--tool:#7c3aed;--tool-bg:rgba(124,58,237,.12);}
  .side-link.design{--tool:#0d9488;--tool-bg:rgba(13,148,136,.12);}
  .side-link.text{--tool:#be123c;--tool-bg:rgba(190,18,60,.12);}
  .side-below-tools{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;}
  /* Editable nav-item labels (pencil + inline save) */
  .subitem .lbl-txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .subitem .lbl-btn{width:26px;height:26px;flex-shrink:0;border:none;background:none;border-radius:8px;color:inherit;
    display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.5;
    transition:opacity .12s,background .12s,color .12s;}
  .subitem .lbl-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  /* rename pencil stays hidden until you hover (or keyboard-focus) its row — keeps the sidebar uncluttered */
  .subitem .lbl-btn.edit{opacity:0;pointer-events:none;}
  .subitem:hover .lbl-btn.edit,.subitem:focus-within .lbl-btn.edit{opacity:.85;pointer-events:auto;}
  .subitem .lbl-btn.edit:hover{opacity:1;}
  .subitem .lbl-btn:hover{background:var(--accent-soft);color:var(--accent-dim);opacity:1;}
  .subitem .lbl-btn.save{color:var(--accent-dim);opacity:1;}
  .subitem.editing{cursor:default;background:var(--panel-2);color:var(--ink-2);border-color:var(--line);}
  .subitem.editing:hover{background:var(--panel-2);}
  .subitem .lbl-input{flex:1;min-width:0;border:none;background:none;outline:none;color:var(--ink);
    font-family:var(--sans);font-size:13.5px;font-weight:600;padding:0;}

  /* plan chip + storage pinned at the bottom of the sidebar, merged into one block */
  .side-plan{margin-top:8px;border-top:1px solid var(--line);padding-top:12px;}
  /* the plan + storage share ONE bordered container so they read as a single unit */
  .plan-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow-sm);}
  .planchip{display:flex;align-items:center;gap:11px;padding:12px;background:var(--grad-soft);border:none;border-radius:0;}
  .planchip .pc-ic{width:36px;height:36px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center;
    background:var(--grad);color:#fff;box-shadow:0 4px 12px var(--grad-shadow);}
  .planchip .pc-ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .planchip .pc-tx{min-width:0;flex:1;display:flex;flex-direction:column;}
  .planchip .pc-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
  .planchip .pc-name{font-size:15px;font-weight:800;line-height:1.2;}
  .storage-chip{display:flex;align-items:center;gap:12px;margin-top:0;padding:12px;border-radius:0;background:transparent;border:none;border-top:1px solid var(--line);box-shadow:none;}
  .storage-ring{--p:0;width:54px;height:54px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;position:relative;
    background:conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0);}
  .storage-ring::before{content:'';position:absolute;inset:7px;border-radius:50%;background:var(--panel);}
  .storage-ring span{position:relative;font-family:var(--mono);font-size:12px;font-weight:900;color:var(--ink);}
  .storage-tx{min-width:0;display:flex;flex-direction:column;gap:1px;}
  .storage-title{font-size:13px;font-weight:850;color:var(--ink-2);line-height:1.15;}
  .storage-line{font-size:11.5px;font-weight:650;color:var(--muted);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .storage-left{font-size:11px;color:var(--accent-dim);font-weight:800;}
  .side-plan .upg{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:9px;color:#fff;border:none;cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:700;font-size:13.5px;padding:11px 14px;border-radius:11px;text-shadow:0 1px 2px rgba(0,0,0,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 16px var(--grad-btn-glow);transition:filter .14s,transform .08s;}
  .side-plan .upg:hover{filter:brightness(1.05);} .side-plan .upg:active{transform:translateY(1px);}
  .side-plan .upg svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .side-account{width:100%;margin-top:auto;padding-top:14px;}
  .side-account .dash-acct-btn{width:100%;height:auto;justify-content:flex-start;align-items:center;gap:11px;padding:9px 12px;
    border-radius:14px;background:var(--panel);border:1.5px solid color-mix(in srgb,var(--accent) 30%,var(--line));box-shadow:var(--shadow-sm);}
  html[dir="rtl"] .side-account .dash-acct-btn{padding:9px 12px;}
  .side-account .dash-avatar-sm{width:40px;height:40px;font-size:15px;}
  .side-account .dash-acct-tx{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;overflow:hidden;text-align:center;}
  .side-account .dash-acct-name{display:block;flex:none;align-self:stretch;max-width:none;font-size:14px;font-weight:800;line-height:1.2;color:var(--ink);text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .side-account .dash-acct-btnmail{display:block;font-size:12px;font-weight:600;color:var(--muted);direction:ltr;text-align:center;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .side-account .dash-acct-chev{display:block;flex-shrink:0;color:var(--faint);}
  .side-account .dash-acct-menu{top:auto;bottom:calc(100% + 9px);inset-inline-end:0;width:min(270px,100%);}

  /* admin-only shortcut, pinned above the nav */
  .side-admin{display:flex;align-items:center;gap:11px;padding:9px 12px;margin-bottom:6px;border-radius:12px;
    background:var(--grad-soft);border:1px solid var(--accent-soft);color:var(--accent-dim);font-weight:700;font-size:14.5px;
    transition:border-color .12s;}
  .side-admin:hover{border-color:var(--accent);}
  .side-admin .sa-ic{width:34px;height:34px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center;
    background:var(--grad);color:#fff;box-shadow:0 4px 12px var(--grad-shadow);}
  .side-admin .sa-ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  /* ---------- main ---------- */
  .main{min-width:0;}
  .guestnote{display:flex;align-items:center;gap:10px;background:var(--info-soft);border:1px solid var(--info);color:var(--info-dim);
    border-radius:14px;padding:12px 16px;font-size:13.5px;margin-bottom:16px;}
  .guestnote svg{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .guestnote a{font-weight:700;color:var(--accent-dim);cursor:pointer;text-decoration:underline;}

  .dash-search{position:relative;z-index:35;margin:0 0 18px;}
  .dash-search-box{position:relative;display:flex;align-items:center;gap:8px;width:min(780px,100%);height:58px;margin-inline:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow-sm),0 10px 30px rgba(123,52,255,.10);
    padding-inline-start:26px;padding-inline-end:7px;transition:border-color .14s,box-shadow .14s;}
  .dash-search-box:focus-within{border-color:#9a8cff;box-shadow:0 0 0 3px rgba(123,52,255,.18),0 14px 34px rgba(123,52,255,.20);}
  .dash-search-box input{flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--ink);
    font-family:var(--sans);font-size:15px;font-weight:600;outline:none;padding:0;}
  .dash-search-box input::placeholder{color:var(--muted);font-weight:500;}
  .dash-search-box input::-webkit-search-cancel-button{-webkit-appearance:none;}
  .dash-search-btn{flex-shrink:0;width:44px;height:44px;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;
    background:linear-gradient(140deg,#7b34ff 0%,#3f85ff 100%);box-shadow:0 6px 16px rgba(123,52,255,.40);
    transition:filter .14s,transform .08s;}
  .dash-search-btn:hover{filter:brightness(1.06);}
  .dash-search-btn:active{transform:scale(.94);}
  .dash-search-btn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .dash-search-results{display:none;position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);width:min(860px,100%);max-height:min(460px,70vh);overflow:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:6px;}
  .dash-search.open .dash-search-results{display:block;}
  .ds-row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 12px;border-radius:12px;text-decoration:none;color:inherit;}
  .ds-row:hover{background:var(--panel-2);}
  .ds-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex-shrink:0;}
  .ds-ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .ds-ic.project{background:#eef2ff;color:#4f46e5;}
  .ds-ic.file{background:#eaf5ff;color:#2377d6;}
  .ds-ic.order{background:#e8f7f8;color:#0f8b94;}
  .ds-ic.client{background:#fff3df;color:#c06a12;}
  .ds-ic.send{background:#fff0e8;color:#e06622;}
  .ds-ic.review{background:#edf8ef;color:#2f9b55;}
  .ds-ic.processed{background:#f2ecff;color:#6d4df2;}
  .ds-type{display:inline-flex;align-items:center;width:max-content;max-width:100%;height:20px;padding:0 8px;border-radius:999px;background:var(--panel-2);color:var(--muted);font-size:10.5px;font-weight:850;letter-spacing:.02em;text-transform:uppercase;}
  .ds-title{display:block;margin-top:4px;color:var(--ink);font-size:14px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ds-meta{display:block;margin-top:2px;color:var(--muted);font-size:12px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ds-action{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel);color:var(--accent-dim);font-family:var(--sans);font-size:12.5px;font-weight:850;text-decoration:none;cursor:pointer;white-space:nowrap;}
  .ds-action:hover{border-color:var(--accent);background:var(--accent-soft);}
  .ds-action svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .ds-empty{padding:20px 14px;text-align:center;color:var(--muted);font-size:13px;font-weight:650;}

  .phead{display:flex;align-items:center;gap:16px;margin:2px 0 22px;}
  .phead .avatar{width:56px;height:56px;flex-shrink:0;border-radius:16px;display:flex;align-items:center;justify-content:center;
    background:var(--grad);color:#fff;font-size:24px;font-weight:800;box-shadow:0 6px 18px var(--grad-shadow);}
  .phead h1{font-size:clamp(22px,3vw,28px);font-weight:800;letter-spacing:-0.02em;margin:0 0 3px;}
  .phead p{font-size:14px;color:var(--muted);margin:0;}
  /* ---------- editable profile picture ---------- */
  .avatar-wrap{position:relative;flex-shrink:0;}
  .phead .avatar{overflow:hidden;position:relative;}
  button.avatar{padding:0;border:0;cursor:pointer;font:inherit;}
  .avatar-img{width:100%;height:100%;object-fit:cover;display:block;}
  .avatar-edit .avatar-ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.42);opacity:0;transition:opacity .15s;}
  .avatar-edit:hover .avatar-ov,.avatar-edit:focus-visible .avatar-ov{opacity:1;}
  .avatar-ov svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .avatar-cam{position:absolute;bottom:-4px;inset-inline-end:-4px;width:24px;height:24px;border-radius:50%;
    background:var(--grad);border:2px solid var(--panel);display:flex;align-items:center;justify-content:center;pointer-events:none;}
  .avatar-cam svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .avatar-remove{position:absolute;top:100%;inset-inline-start:0;margin-top:7px;background:none;border:0;
    color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;white-space:nowrap;padding:0;}
  .avatar-remove:hover{color:#e5484d;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px;}
  .card > h2{font-size:17px;font-weight:700;margin:0 0 4px;letter-spacing:-0.01em;}
  .card > .csub{font-size:13px;color:var(--muted);margin:0 0 16px;}
  .card > h2 + .csub{margin-top:2px;}

  /* ---------- subscription card ---------- */
  .subcard{position:relative;overflow:hidden;background:var(--grad-soft);}
  .subcard .sc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;}
  .sc-info{min-width:0;}
  .sc-kick{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .sc-planline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .sc-planname{font-size:30px;font-weight:800;letter-spacing:-0.02em;line-height:1;}
  .plan-badge{font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    padding:4px 11px;border-radius:999px;}
  .plan-badge.free{color:var(--muted);background:var(--panel);border:1px solid var(--line);}
  .plan-badge.creator{color:#fff;background:var(--grad);border:1px solid transparent;box-shadow:0 4px 12px var(--grad-shadow);}
  .plan-badge.studio{color:#fff;background:linear-gradient(135deg,#1f2937,#4338ca);border:1px solid transparent;box-shadow:0 4px 12px rgba(67,56,202,.35);}
  .sc-price{font-size:14px;color:var(--muted);margin-top:10px;}
  .sc-price b{font-size:22px;color:var(--ink);font-weight:800;}
  .sc-actions{display:flex;flex-direction:column;gap:10px;align-items:stretch;}
  .btn-up{display:inline-flex;align-items:center;justify-content:center;gap:8px;color:#fff;border:none;cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:700;font-size:14px;padding:12px 22px;border-radius:12px;text-shadow:0 1px 2px rgba(0,0,0,.18);white-space:nowrap;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 20px var(--grad-btn-glow);transition:filter .14s,transform .08s;}
  .btn-up:hover{filter:brightness(1.05);} .btn-up:active{transform:translateY(1px);}
  .btn-up svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .sc-top-plan{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--success-dim);
    background:var(--success-soft);border:1px solid var(--success);padding:11px 18px;border-radius:12px;white-space:nowrap;}
  .sc-top-plan svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  /* 7-day free-trial pill on the subscription card */
  .sc-trial{display:inline-flex;align-items:center;gap:7px;margin-top:11px;font-size:12.5px;font-weight:700;
    color:var(--accent-dim);background:var(--accent-soft);border:1px solid var(--accent);border-radius:999px;padding:6px 13px;}
  .sc-trial svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}

  /* demo plan switcher */
  .demoswitch{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);}
  .demoswitch .ds-lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin-bottom:8px;}
  .seg{display:inline-flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:var(--shadow-sm);}
  .seg-btn{border:none;background:none;color:var(--muted);cursor:pointer;font-family:var(--sans);font-size:13.5px;font-weight:700;
    padding:8px 18px;border-radius:9px;transition:color .14s,background .14s,box-shadow .14s;}
  .seg-btn.on{background:var(--accent-soft);color:var(--accent-dim);box-shadow:var(--shadow-sm);}

  /* ---------- usage metrics ---------- */
  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .metric{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:15px;}
  .metric-top{display:flex;align-items:center;gap:9px;margin-bottom:11px;}
  .metric-ic{width:32px;height:32px;flex-shrink:0;border-radius:9px;display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);color:var(--accent);}
  .metric-ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .metric-label{font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.2;}
  .metric-val{font-size:18px;font-weight:800;letter-spacing:-0.01em;margin-bottom:10px;}
  .metric-lim{font-size:12.5px;font-weight:600;color:var(--faint);}
  .bar{height:7px;border-radius:999px;background:var(--line);overflow:hidden;}
  .bar-fill{display:block;height:100%;border-radius:999px;background:var(--grad);transition:width .4s ease;}
  .bar-fill.warn{background:linear-gradient(90deg,#e5a904,#e5484d);}

  /* ---------- plan features list ---------- */
  .feats{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,1fr);gap:11px;}
  .feats li{display:flex;align-items:flex-start;gap:10px;font-size:13.7px;color:var(--ink-2);}
  .feats li svg{width:17px;height:17px;color:var(--success);flex-shrink:0;margin-top:2px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .compare{display:inline-flex;align-items:center;gap:7px;margin-top:18px;font-size:13.5px;font-weight:700;color:var(--accent-dim);}
  .compare svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}

  /* ---------- quick actions ---------- */
  .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .qcard{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:16px;box-shadow:var(--shadow-sm);transition:transform .14s,border-color .14s,box-shadow .14s;}
  .qcard:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow-lg);}
  .qcard .q-ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--grad-soft);color:var(--accent);}
  .qcard .q-ic svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .qcard .q-t{font-size:14.5px;font-weight:700;}
  .qcard .q-d{font-size:12.5px;color:var(--muted);line-height:1.4;}
  .dt-shell{display:flex;flex-direction:column;gap:22px;}
  .dt-hero{text-align:center;padding:34px 16px 28px;border-radius:22px;background:
    radial-gradient(55% 70% at 50% 0%,rgba(124,58,237,.08),transparent 68%),
    linear-gradient(180deg,rgba(255,255,255,.36),rgba(255,255,255,0));}
  .dt-kicker{display:inline-flex;align-items:center;gap:8px;min-height:28px;padding:5px 13px;border-radius:999px;
    background:var(--accent-soft);color:var(--accent-dim);font-family:var(--mono);font-size:11px;font-weight:850;letter-spacing:.04em;text-transform:uppercase;}
  .dt-hero h2{margin:16px 0 10px;font-size:clamp(28px,4.2vw,44px);line-height:1.06;font-weight:900;letter-spacing:0;}
  .dt-hero p{margin:0 auto;color:var(--muted);font-size:16px;line-height:1.65;max-width:64ch;}
  .dt-fullpage{display:inline-flex;align-items:center;gap:7px;margin-top:16px;min-height:36px;padding:0 15px;border-radius:999px;
    border:1px solid var(--line);background:var(--panel);color:var(--ink-2);font-size:12.8px;font-weight:800;text-decoration:none;transition:border-color .12s,color .12s;}
  .dt-fullpage svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .dt-fullpage:hover{border-color:var(--accent);color:var(--accent-dim);}
  /* live text-tools workspace, embedded from text-tools.html?embed=1; height is set by postMessage */
  .tt-embed-frame{width:100%;min-height:600px;border:0;border-radius:16px;background:transparent;display:block;}
  .dt-head{display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding-top:18px;}
  .dt-head h3{margin:0;font-size:22px;font-weight:900;letter-spacing:0;}
  .dt-head .btn{min-height:38px;border-radius:999px;padding:0 15px;font-size:12.8px;}
  .dt-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;}
  .dt-card{min-height:156px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:10px;padding:20px;
    position:relative;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow-sm);color:inherit;text-decoration:none;
    transition:transform .14s,border-color .14s,box-shadow .14s,background .14s;}
  .dt-card:hover{transform:translateY(-3px);border-color:#f4a3c4;box-shadow:var(--shadow-lg);}
  .dt-card.tool-card{display:block;padding:0;overflow:hidden;}
  .tool-card-link{display:flex;min-height:156px;flex-direction:column;justify-content:center;align-items:flex-start;gap:10px;padding:20px;color:inherit;text-decoration:none;}
  .dt-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#fde7f0;color:#e0447a;margin-bottom:6px;}
  /* design/dev-tools cards use the mint-green of the "Design & Digital" sidebar category (--tool:#0d9488) */
  .dt-ic--design{background:rgba(13,148,136,.12);color:#0d9488;}
  .dt-ic svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;}
  .dt-name{display:block;font-size:15.5px;font-weight:900;color:var(--ink);line-height:1.25;}
  .dt-desc{display:block;font-size:12.8px;color:var(--muted);line-height:1.45;}
  .tool-fav-btn{position:absolute;top:12px;right:12px;z-index:5;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--muted);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow-sm);
    transition:background .12s,color .12s,border-color .12s,transform .08s;}
  html[dir="rtl"] .tool-fav-btn{left:12px;right:auto;}
  html:not([dir="rtl"]) .tool-fav-btn{right:12px;left:auto;}
  .tool-fav-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);}
  .tool-fav-btn:active{transform:translateY(1px);}
  .tool-fav-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;}
  .tool-fav-btn.is-fav{color:#f59e0b;background:#fff7df;border-color:#f4c56a;}
  .tool-fav-btn.is-fav svg{fill:currentColor;}
  .ai-demo-badge{position:absolute;top:14px;right:14px;z-index:4;display:inline-flex;align-items:center;justify-content:center;min-height:22px;padding:0 8px;border-radius:7px;border:1px solid var(--success);background:var(--success-soft);color:var(--success-dim);font-size:10.5px;font-weight:900;}
  html:not([dir="rtl"]) .ai-demo-badge{left:14px;right:auto;}
  .fav-empty{min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;
    border:1px dashed var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow-sm);padding:28px;}
  .fav-empty .fe-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-dim);}
  .fav-empty .fe-ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .fav-empty h3{margin:4px 0 0;font-size:18px;font-weight:900;}
  .fav-empty p{margin:0;color:var(--muted);font-size:13.5px;}
  .edit-hub-section{display:flex;flex-direction:column;gap:14px;}
  .edit-hub-title{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:18px;}
  .edit-hub-title h3{margin:0;font-size:21px;font-weight:900;letter-spacing:0;color:var(--ink);}
  .edit-hub-title .section-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-dim);}
  .edit-hub-title .section-ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;}

  /* ---------- generic form rows ---------- */
  .frow{display:flex;flex-direction:column;gap:6px;margin-bottom:15px;}
  .frow label{font-size:12.5px;font-weight:600;color:var(--ink-2);}
  .frow input{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;
    font-family:var(--sans);font-size:14px;padding:11px 13px;transition:border-color .12s,box-shadow .12s;}
  .frow input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .frow input:disabled{color:var(--muted);cursor:not-allowed;}
  .frow .hint{font-size:11.5px;color:var(--faint);}
  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:0 16px;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-family:var(--sans);
    font-weight:700;font-size:13.5px;padding:11px 20px;border-radius:11px;transition:filter .14s,transform .08s,border-color .12s,background .12s;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{color:#fff;border:none;text-shadow:0 1px 2px rgba(0,0,0,.18);
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 16px var(--grad-btn-glow);}
  .btn.primary:hover{filter:brightness(1.05);}
  .btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--ink-2);box-shadow:var(--shadow-sm);}
  .btn.ghost:hover{border-color:var(--accent);}
  .btn.danger{background:var(--panel);border:1px solid var(--danger);color:var(--danger);}
  .btn.danger:hover{background:var(--danger-soft);}
  .btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .saved-msg{font-size:12.5px;color:var(--success-dim);font-weight:600;opacity:0;transition:opacity .2s;}
  .saved-msg.show{opacity:1;}

  /* settings option rows */
  .optrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line-2);}
  .optrow:last-child{border-bottom:none;}
  .optrow .opt-tx{min-width:0;}
  .optrow .opt-t{font-size:14px;font-weight:600;}
  .optrow .opt-d{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .segsm{display:inline-flex;gap:3px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px;flex-shrink:0;}
  .segsm button{border:none;background:none;color:var(--muted);cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:700;padding:7px 14px;border-radius:8px;}
  .segsm button.on{background:var(--panel);color:var(--accent-dim);box-shadow:var(--shadow-sm);}
  /* toggle */
  .toggle{position:relative;width:46px;height:26px;flex-shrink:0;border-radius:999px;background:var(--line);border:none;cursor:pointer;transition:background .16s;}
  .toggle::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .16s;}
  .toggle.on{background:var(--accent);}
  html[dir="ltr"] .toggle.on::after{transform:translateX(20px);}
  html[dir="rtl"] .toggle.on::after{transform:translateX(-20px);}

  .danger-zone{border-color:var(--danger);}
  .danger-zone > h2{color:var(--danger);}

  /* ---------- team / organization ---------- */
  .team-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
  .team-head h2{margin:0;}
  .team-head .csub{margin:4px 0 0;}
  .team-meta{text-align:end;}
  .team-meta .opt-t{font-size:14px;font-weight:700;}
  .team-meta .opt-d{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .tm-row{gap:12px;}
  .tm-row .opt-t,.tm-row .opt-d{display:block;}
  .tm-row .opt-t .tm-you{display:inline;margin-inline-start:5px;}
  .tm-id{display:flex;align-items:center;gap:11px;}
  .tm-av{width:36px;height:36px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--grad);color:#fff;font-size:15px;font-weight:700;box-shadow:0 3px 9px var(--grad-shadow);}
  .tm-you{font-size:11px;color:var(--muted);font-weight:600;}
  .tm-ctrl{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
  .tm-role{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:9px;font-family:var(--sans);
    font-size:13px;font-weight:600;padding:8px 10px;cursor:pointer;}
  .tm-badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--muted);
    background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;}
  .tm-badge.owner{color:var(--accent-dim);background:var(--accent-soft);border-color:transparent;}
  .tm-badge svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .btn.tm-rm{padding:8px 10px;}
  .btn.tm-rm svg{margin:0;}
  .tm-invite{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .tm-invite input[type="email"]{flex:1;min-width:200px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;font-family:var(--sans);font-size:14px;padding:11px 13px;}
  .tm-invite input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .tm-invite select{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;
    font-family:var(--sans);font-size:14px;font-weight:600;padding:11px 12px;cursor:pointer;}
  .tm-err{font-size:12.5px;color:var(--danger);margin-top:6px;min-height:1px;}
  .tm-link{margin-top:12px;}
  .tm-linkrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .tm-linkrow input{flex:1;min-width:220px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    border-radius:9px;font-family:var(--mono);font-size:12.5px;padding:10px 12px;}
  .team-head + .card{margin-top:0;}

  /* ---------- payments ---------- */
  .payrow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .pm-empty{display:flex;align-items:center;gap:12px;background:var(--panel-2);border:1px dashed var(--line);border-radius:12px;padding:16px;}
  .pm-empty .pm-ic{width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .pm-empty .pm-ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .pm-empty .pm-tx{flex:1;min-width:0;}
  .pm-empty .pm-t{font-size:14px;font-weight:600;}
  .pm-empty .pm-d{font-size:12.5px;color:var(--muted);}
  table.inv{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.inv th{text-align:start;font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);}
  table.inv td{padding:12px 10px;border-bottom:1px solid var(--line-2);color:var(--ink-2);}
  table.inv tr:last-child td{border-bottom:none;}
  .inv-status{font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--success-dim);background:var(--success-soft);border:1px solid var(--success);border-radius:6px;padding:2px 8px;}
  .inv-dl{color:var(--accent-dim);font-weight:700;cursor:pointer;}

  /* ---------- empty state (my audio/video/files/transfers) ---------- */
  .empty{text-align:center;padding:44px 20px;}
  .empty .ei{width:66px;height:66px;margin:0 auto 16px;border-radius:18px;display:flex;align-items:center;justify-content:center;
    background:var(--grad-soft);color:var(--accent);}
  .empty .ei svg{width:32px;height:32px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .empty h3{margin:0 0 6px;font-size:17px;}
  .empty p{margin:0 auto 20px;font-size:13.5px;color:var(--muted);max-width:44ch;}
  .toolrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
  .toolrow a{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink-2);
    background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 16px;box-shadow:var(--shadow-sm);transition:border-color .12s;}
  .toolrow a:hover{border-color:var(--accent);}
  .toolrow a svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  /* ---------- clients / projects ---------- */
  .projects-card{overflow:hidden;padding:0;}
  .project-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:22px;border-bottom:1px solid var(--line);}
  .project-head h2{font-size:18px;font-weight:800;margin:0 0 4px;letter-spacing:-0.01em;}
  .project-head .csub{font-size:13px;color:var(--muted);margin:0;}
  .project-list{display:flex;flex-direction:column;}
  .project-row{display:grid;grid-template-columns:minmax(220px,1.5fr) minmax(92px,.45fr) minmax(92px,.45fr) minmax(104px,.5fr) auto;
    gap:16px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line-2);background:var(--panel);
    transition:background .12s;}
  .project-row:last-child{border-bottom:none;}
  .project-row.on{background:var(--accent-soft);}
  .project-main{display:flex;align-items:center;gap:12px;min-width:0;}
  .project-mark{width:42px;height:42px;border-radius:12px;background:var(--grad-soft);color:var(--accent);display:flex;
    align-items:center;justify-content:center;flex-shrink:0;}
  .project-mark svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .project-title{display:block;font-size:15px;font-weight:800;color:var(--ink);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .project-client{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .project-stat{min-width:0;}
  .project-stat .ps-l{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin-bottom:2px;}
  .project-stat .ps-v{font-size:13.5px;font-weight:700;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .project-status{display:inline-flex;align-items:center;justify-content:center;min-height:28px;padding:5px 10px;border-radius:999px;
    font-size:12px;font-weight:800;color:var(--accent-dim);background:var(--accent-soft);border:1px solid rgba(124,58,237,.24);white-space:nowrap;}
  .project-status.sent{color:var(--info-dim);background:var(--info-soft);border-color:var(--info);}
  .project-status.approved{color:var(--success-dim);background:var(--success-soft);border-color:var(--success);}
  .project-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;}
  .project-actions .btn{padding:9px 12px;font-size:12.8px;border-radius:10px;white-space:nowrap;}
  .project-empty{padding:44px 22px;text-align:center;}
  .mp-shell{display:flex;flex-direction:column;gap:18px;}
  .mp-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;}
  .mp-head h2{font-size:22px;font-weight:850;margin:0 0 4px;letter-spacing:0;}
  .mp-head .csub{font-size:13.5px;color:var(--muted);margin:0;max-width:64ch;}
  .mp-new-request{min-height:42px;padding:0 17px;border-radius:999px;font-size:13.5px;white-space:nowrap;text-decoration:none;}
  .mp-tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
  .mp-tools-5{grid-template-columns:repeat(5,minmax(0,1fr));}
  .mp-tools-4{grid-template-columns:repeat(4,minmax(0,1fr));}
  .mp-tool{display:flex;align-items:center;gap:12px;min-height:92px;padding:16px;border:1px solid var(--line);border-radius:8px;background:var(--panel);
    box-shadow:var(--shadow-sm);cursor:pointer;color:var(--ink);text-align:start;transition:border-color .14s,background .14s,transform .08s,box-shadow .14s;}
  .mp-tool:hover{border-color:var(--svc,var(--accent));background:var(--svc-bg,var(--panel-2));}
  .mp-tool:active{transform:translateY(1px);}
  .mp-tool.on{border-color:var(--svc,var(--accent));background:var(--svc-bg,var(--accent-soft));box-shadow:var(--shadow-sm);}
  .mp-tool-ic{width:42px;height:42px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--svc-bg,var(--grad-soft));color:var(--svc,var(--accent));}
  .mp-tool.on .mp-tool-ic{background:var(--svc,var(--grad));color:#fff;box-shadow:0 5px 14px var(--svc-shadow,var(--grad-shadow));}
  .mp-tool-ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .mp-tool-t{display:block;font-size:15px;font-weight:850;line-height:1.15;}
  .mp-tool-d{display:block;font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.25;}
  .mp-section-title{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:2px;}
  .mp-section-title h3{margin:0;font-size:17px;font-weight:850;letter-spacing:0;}
  .mp-section-title span{font-family:var(--mono);font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;}
  .mp-clients{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;}
  .mp-client{display:flex;flex-direction:column;gap:14px;min-height:248px;padding:17px;border:1px solid var(--line);border-top:3px solid var(--svc-line,var(--line));border-radius:8px;background:var(--panel);box-shadow:var(--shadow-sm);}
  .mp-client-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .mp-badge{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:8px 15px;border-radius:10px;background:var(--svc-bg,var(--accent-soft));color:var(--svc,var(--accent-dim));border:1px solid var(--svc-line,transparent);
    font-size:13px;font-weight:850;text-transform:uppercase;letter-spacing:.03em;}
  .mp-badge svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .mp-menu{width:28px;height:28px;border:0;background:transparent;color:var(--faint);display:grid;place-items:center;border-radius:8px;cursor:pointer;transition:background .12s,color .12s;}
  .mp-menu:hover{background:var(--danger-soft);color:var(--danger);}
  .mp-menu:focus-visible{outline:2px solid var(--danger);outline-offset:1px;}
  .mp-menu svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  /* identifier + share-link status row (approval cards), mirrors the received-files bar */
  .mp-idrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 10px;margin-top:-2px;}
  .mp-order{font-size:13px;font-weight:800;color:var(--muted);}
  .mp-order b{color:var(--ink);font-weight:900;direction:ltr;unicode-bidi:isolate;display:inline-block;}
  .mp-link{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:13px;font-weight:850;line-height:1;white-space:nowrap;}
  .mp-link::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
  .mp-link.on{background:var(--success-soft);color:var(--success);}
  .mp-link.off{background:var(--danger-soft);color:var(--danger);}
  /* confirm dialog */
  .kc-overlay{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:20px;background:rgba(17,20,32,.44);opacity:0;transition:opacity .18s;}
  .kc-overlay.show{opacity:1;}
  .kc-modal{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px rgba(17,20,32,.28);padding:22px 22px 18px;transform:translateY(8px) scale(.98);transition:transform .18s;}
  .kc-overlay.show .kc-modal{transform:none;}
  .kc-title{margin:0 0 8px;font-size:18px;font-weight:850;color:var(--ink);}
  .kc-body{margin:0 0 20px;font-size:14px;line-height:1.55;color:var(--muted);}
  .kc-actions{display:flex;gap:10px;justify-content:flex-end;}
  .kc-btn{min-height:40px;padding:0 18px;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;border:1px solid var(--line);transition:filter .14s,background .14s;}
  .kc-cancel{background:var(--panel-2);color:var(--ink-2);}
  .kc-cancel:hover{background:var(--line-2);}
  .kc-ok.danger{background:var(--danger);border-color:var(--danger);color:#fff;}
  .kc-ok.danger:hover{filter:brightness(1.06);}
  .mp-client-id{display:flex;align-items:center;gap:12px;}
  .mp-avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--svc-bg,var(--grad-soft));color:var(--svc,var(--accent-dim));font-weight:850;border:1px solid var(--svc-line,transparent);overflow:hidden;}
  .mp-avatar.has-img{background:var(--panel);}
  .mp-avatar-img{width:100%;height:100%;object-fit:cover;display:block;}
  .mp-client-name{display:block;font-size:16px;font-weight:850;line-height:1.2;}
  .mp-number{display:block;margin-top:4px;font-size:12px;font-weight:850;color:var(--svc,var(--accent-dim));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mp-client-mail{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:28ch;}
  .mp-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;border-block:1px solid var(--line-2);padding:13px 0;}
  .mp-fact{min-width:0;}
  .mp-fact b{display:block;font-size:13px;font-weight:850;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mp-fact span{display:block;font-size:11.5px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mp-note{font-size:13px;color:var(--ink-2);line-height:1.45;margin:0;min-height:38px;}
  .mp-client-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;}
  .mp-foot-actions{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
  .mp-copy{width:38px;height:38px;flex-shrink:0;display:inline-grid;place-items:center;border-radius:8px;border:1px solid var(--line);
    background:var(--panel);color:var(--muted);cursor:pointer;box-shadow:var(--shadow-sm);transition:border-color .12s,color .12s,background .12s,transform .08s;}
  .mp-copy:hover{border-color:var(--accent);color:var(--accent-dim);background:var(--accent-soft);}
  .mp-copy:active{transform:translateY(1px);}
  .mp-copy svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  /* status pill — color reflects the link/project STATE, not the service tone */
  .mp-status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;border-radius:999px;padding:6px 12px;
    border:1px solid transparent;white-space:nowrap;color:var(--muted);background:var(--panel-2);}
  .mp-status::before{content:'';width:8px;height:8px;border-radius:999px;background:currentColor;flex-shrink:0;}
  .mp-status.st-active{color:var(--success-dim);background:var(--success-soft);}
  .mp-status.st-active::before{background:var(--success);box-shadow:0 0 0 3px color-mix(in srgb,var(--success) 22%,transparent);animation:mppulse 1.8s ease-in-out infinite;}
  .mp-status.st-success{color:var(--success-dim);background:var(--success-soft);}
  .mp-status.st-info{color:var(--info-dim);background:var(--info-soft);}
  .mp-status.st-warn{color:var(--warn);background:var(--warm-soft);border-color:var(--warm-line);}
  .mp-status.st-danger{color:var(--danger);background:var(--danger-soft);}
  .mp-status.st-neutral{color:var(--muted);background:var(--panel-2);border-color:var(--line);}
  /* Select-page status pills - dedicated color + icon per selection state */
  .mp-sel-status{border-color:transparent;}
  .mp-sel-status::before{display:none;}
  .mp-sel-status svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  .mp-status.sel-wait{color:#C96A00;background:#FFF7E6;}
  .mp-status.sel-progress{color:#1769D1;background:#EAF3FF;}
  .mp-status.sel-done{color:#16804A;background:#EAF8F0;}
  .mp-status.sel-view{color:#6B3CC9;background:#F3EEFF;}
  .mp-status.sel-blocked{color:#6C757D;background:#F1F3F5;}
  .mp-sel-status.sel-progress svg{animation:mpspin 1.1s linear infinite;transform-origin:50% 50%;}
  /* Review / approval lifecycle pills - dedicated color + icon per state, following
     the KOLKLI approval legend: waiting=blue · changes=amber · new version=violet ·
     re-review=orange · approved=green · rejected=red. */
  .mp-rv-status{border-color:transparent;}
  .mp-rv-status::before{display:none;}
  .mp-rv-status svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  .mp-status.rv-wait{color:#1769D1;background:#EAF3FF;}
  .mp-status.rv-changes{color:#C96A00;background:#FFF7E6;}
  .mp-status.rv-version{color:#6B3CC9;background:#F3EEFF;}
  .mp-status.rv-review{color:#C2410C;background:#FFF1E8;}
  .mp-status.rv-approved{color:#16804A;background:#EAF8F0;}
  .mp-status.rv-rejected{color:#C0353A;background:#FDECEC;}
  .mp-rv-status.rv-version svg{animation:mpspin 1.1s linear infinite;transform-origin:50% 50%;}
  @keyframes mpspin{to{transform:rotate(360deg);}}
  @keyframes mppulse{0%,100%{opacity:1;}50%{opacity:.4;}}
  .mp-id-txt{min-width:0;}
  .mp-client-phone{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin-top:3px;direction:ltr;}
  .mp-client-phone svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.85;}
  .mp-files-link{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--accent);background:var(--panel);color:var(--accent-dim);box-shadow:var(--shadow-sm);font-size:12.8px;font-weight:850;white-space:nowrap;text-decoration:none;transition:background .12s,filter .12s,transform .08s;}
  .mp-files-link:hover{background:var(--accent-soft);}
  .mp-files-link:active{transform:translateY(1px);}
  .mp-files-link svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;}
  .mp-client-foot .btn{padding:9px 12px;border-radius:8px;font-size:12.8px;white-space:nowrap;}
  /* Received-files order cards: a vertical stack of wide "order rows". Each row =
     top action bar (received-files link · active-order status · menu) · body
     (client identity on the right beside the 4-up stat panel + order number on
     the left) · client note · action buttons. */
  .mpr-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
  /* Inline empty state shown when the live dashboard search matches no card. */
  .mpr-empty{grid-column:1/-1;padding:34px 18px;text-align:center;color:var(--faint);font-weight:600;font-size:14px;border:1px dashed var(--line);border-radius:16px;background:var(--panel);}
  .mpr-card{--recv-sel:#0891b2;--recv-sel-bg:#eaf6f9;container-type:inline-size;overflow:hidden;border:1px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:var(--shadow);display:flex;flex-direction:column}
  html[data-theme="dark"] .mpr-card{--recv-sel:#22c3d6;--recv-sel-bg:#14282e}

  /* ---- top action bar: received-files (right) · status + menu (left) ---- */
  .mpr-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 20px;border-bottom:1px solid var(--line)}
  .mpr-receive{--recv:#0891b2;--recv-bg:rgba(8,145,178,.12);--recv-bgh:rgba(8,145,178,.2);--recv-line:rgba(8,145,178,.42);display:inline-flex;align-items:center;gap:9px;padding:9px 15px;border-radius:12px;border:1px solid var(--recv-line);background:var(--recv-bg);color:var(--recv);font-size:13.5px;font-weight:800;text-decoration:none;white-space:nowrap;cursor:pointer;transition:border-color .15s ease,background .15s ease}
  .mpr-receive:hover{border-color:var(--recv);background:var(--recv-bgh)}
  .mpr-receive>svg:first-child{width:17px;height:17px;stroke:var(--recv);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .mpr-receive>svg:last-child{width:16px;height:16px;stroke:var(--recv);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
  html[data-theme="dark"] .mpr-receive{--recv:#22c3d6;--recv-bg:rgba(34,195,214,.14);--recv-bgh:rgba(34,195,214,.22);--recv-line:rgba(34,195,214,.42)}
  .mpr-side{display:inline-flex;align-items:center;gap:8px}
  /* active-order status pill */
  .mpr-status{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:var(--success-soft);color:var(--success);font-size:12.5px;font-weight:850;white-space:nowrap}
  .mpr-status::after{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px rgba(43,184,60,.18)}
  /* File lifecycle stages on received-files cards */
  .mpr-status.st-ready{background:var(--info-soft);color:var(--info-dim)}
  .mpr-status.st-ready::after{box-shadow:0 0 0 3px rgba(59,130,246,.18)}
  .mpr-status.st-uploading{background:var(--warm-soft);color:var(--warn)}
  .mpr-status.st-uploading::after{box-shadow:0 0 0 3px rgba(200,138,4,.18);animation:mprDotPulse 1.15s ease-in-out infinite}
  .mpr-status.st-done{background:var(--success-soft);color:var(--success-dim)}
  .mpr-status.st-done::after{box-shadow:0 0 0 3px rgba(43,184,60,.18)}
  @keyframes mprDotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.82)}}
  @media (prefers-reduced-motion:reduce){ .mpr-status.st-uploading::after{animation:none} }
  .mpr-menu{width:34px;height:34px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .mpr-menu:hover{border-color:var(--danger,#e5484d);color:var(--danger,#e5484d);background:rgba(229,72,77,.06)}
  .mpr-menu svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* ---- body: client identity (right) beside the stat panel (left) ---- */
  .mpr-body{display:grid;grid-template-columns:minmax(220px,300px) 1fr;align-items:center;gap:34px;padding:22px 24px}
  .mpr-person{display:flex;align-items:center;gap:14px;min-width:0}
  /* Received-files avatar wears the "קבצים שהתקבלו" teal end to end: teal-tinted
     fill + teal letters + teal round frame (var(--recv-sel), re-tinted per tone on
     the select/review/send cards). The frame sits just outside via box-shadow so it
     never eats into the fill or clips the client photo. */
  .mpr-avatar{width:60px;height:60px;flex:0 0 60px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,rgba(8,145,178,.18),rgba(8,145,178,.10));color:var(--recv-sel);font-size:21px;font-weight:900;box-shadow:0 0 0 1.5px var(--panel),0 0 0 3px var(--recv-sel)}
  .mpr-avatar img{width:100%;height:100%;object-fit:cover}
  /* Review-tone card: green round frame + green inner fill on the avatar, echoing
     the card's approval green (--svc) used by the link pill and approve button. */
  .mpr-card.mp-tone-review .mpr-avatar{background:linear-gradient(135deg,rgba(22,163,74,.18),rgba(22,163,74,.10));color:var(--svc);box-shadow:0 0 0 1.5px var(--panel),0 0 0 3px var(--svc)}
  /* Select-tone card: blue round frame + blue inner fill on the avatar, echoing
     the "בחירת קבצים" service blue (--svc) used by the badge and open-selection CTA. */
  .mpr-card.mp-tone-select .mpr-avatar{background:linear-gradient(135deg,rgba(37,99,235,.18),rgba(37,99,235,.10));color:var(--svc);box-shadow:0 0 0 1.5px var(--panel),0 0 0 3px var(--svc)}
  .mpr-person-copy{min-width:0;text-align:right;flex:1 1 auto}
  .mpr-name{display:block;font-size:19px;font-weight:900;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mpr-crow{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;font-weight:600;margin-top:5px;min-width:0}
  .mpr-crow svg{width:15px;height:15px;stroke:var(--faint);fill:none;stroke-width:1.9;flex-shrink:0}
  .mpr-crow .v{direction:ltr;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mpr-crow a.v{color:inherit;text-decoration:none;cursor:pointer}
  .mpr-crow a.v:hover{color:var(--ink);text-decoration:underline}
  .mpr-crow.he .v{direction:rtl}
  /* 4-up stat panel — one boxed row divided by thin hairlines · order number below */
  .mpr-statswrap{min-width:0;display:flex;flex-direction:column;gap:13px}
  /* stat row — no outer frame; cells split only by thin inner hairlines (.mpr-stat::before) */
  .mpr-stats{--recv-frame-soft:rgba(8,145,178,.08);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-radius:14px;background:var(--panel);overflow:hidden;transition:background .12s ease}
  .mpr-stats:active{background:var(--recv-frame-soft)}
  html[data-theme="dark"] .mpr-stats{--recv-frame-soft:rgba(34,195,214,.10)}
  .mpr-stat{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:7px;padding:18px 8px;min-width:0}
  /* thin vertical divider between adjacent stats (RTL-aware: inline-start edge) */
  .mpr-stat + .mpr-stat::before{content:'';position:absolute;inset-inline-start:0;top:14px;bottom:14px;width:1px;background:var(--line)}
  .mpr-stat svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.85;flex-shrink:0}
  .mpr-stat:nth-child(1){color:#6540ff}.mpr-stat:nth-child(2){color:#3388f2}.mpr-stat:nth-child(3){color:#35bd58}.mpr-stat:nth-child(4){color:#f27c00}
  .mpr-stat-txt{min-width:0;width:100%;line-height:1.2}
  .mpr-stat b{display:block;color:var(--ink);font-size:16px;font-weight:900;line-height:1.1}
  /* expiry value ("עד 5 ימים") is text, not a number — smaller so it stays on one line */
  .mpr-stat:nth-child(1) b{font-size:12.5px}
  /* countdown expiry ("עוד 5 ימים") is text, not a number — a touch smaller than the 16px numbers */
  .mpr-stat b.mpr-days{font-size:13.5px}
  /* LTR numeric third stat — on the received-files card this is the volume value
     ("3.2 GB"), kept smaller so a long value doesn't dominate the strip. */
  .mpr-stat b[dir="ltr"]{direction:ltr;font-size:12.5px}
  /* On the select/send/review cards every stat value is a "N unit" count or a
     date string, so keep all three the same size as the "1 קבצים" file count
     (12.5px) instead of letting the comments count and the date jump to 16px. */
  .mpr-card[class*="mp-tone-"] .mpr-stat b{font-size:12.5px}
  .mpr-stat span{display:block;color:var(--muted);font-size:10.5px;font-weight:600;margin-top:3px}
  .mpr-order{font-size:14px;font-weight:800;color:var(--muted);text-align:center}
  .mpr-order b{color:var(--ink);font-weight:900;direction:ltr;unicode-bidi:isolate;display:inline-block}
  /* מספר מזהה grouped with its link-status pill (pill sits to the left of the id
     in RTL). margin-inline-end (physical-left margin in RTL) nudges the whole
     group toward the receive button; cqi keeps the nudge proportional so narrow
     cards don't overflow the header row. */
  .mpr-idwrap{display:inline-flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 8px;min-width:0;margin-inline-end:clamp(4px,2cqi,16px)}
  .mpr-link{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;border:1px solid transparent;font-size:13.5px;font-weight:800;white-space:nowrap}
  .mpr-link::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
  .mpr-link.on{background:var(--success-soft);color:var(--success)}
  .mpr-link.off{background:var(--danger-soft);color:var(--danger)}
  /* client note */
  .mpr-note{display:flex;gap:6px;align-items:baseline;color:var(--muted);font-size:12.5px;line-height:1.5;padding:0 24px}
  .mpr-note b{flex:0 0 auto;color:var(--ink-2);font-weight:850;white-space:nowrap}
  .mpr-note .t{flex:1 1 auto;min-width:0;text-align:right;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* action buttons */
  .mpr-linkrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 24px 0}
  .mpr-bottom{display:flex;flex-wrap:wrap;gap:8px;padding:12px 24px 18px;margin-top:0}
  .mpr-action{flex:1 1 auto;min-width:104px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 16px;font-size:12.5px;font-weight:850;cursor:pointer;text-decoration:none;white-space:nowrap}
  .mpr-action svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}
  .mpr-action.primary{background:var(--grad-btn);border-color:transparent;color:#fff;box-shadow:0 8px 18px var(--grad-btn-glow)}
  .mpr-action.is-disabled,.mpr-action:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;filter:saturate(.15)}
  .mpr-action.share{color:var(--accent);border-color:var(--accent-soft)}
  .mpr-action.is-saved{color:var(--success-dim);border-color:var(--success);background:var(--success-soft)}

  /* Selected order/project card — click marks the current order with the brand
     accent (border + ring) over a soft accent wash, so it stays clearly and
     boldly identifiable while moving around the page, matching the accent used
     for active nav / tools. Only one card is selected at a time (see selectedProjectKey). */
  .mpr-card,.mp-client{cursor:pointer;transition:background .15s ease,border-color .15s ease,box-shadow .15s ease}
  /* New / unviewed order — a freshly-arrived order the user has not opened yet
     carries a subtle light-gray wash so it is clearly identifiable as new.
     Opening the order or marking it read (see readProjectSet) removes .is-new
     and returns the card to its normal panel background. Declared before the
     .is-selected rules below so selecting a card (equal specificity) wins. */
  .mpr-card.is-new,.mp-client.is-new{background:var(--new-bg);border-color:var(--new-line)}
  .mpr-card:not(.is-selected):hover,.mp-client:not(.is-selected):hover{box-shadow:var(--shadow-lg)}
  .mp-client.is-selected{background:var(--sel-bg)}
  /* Received-files cards adopt the "קבצים שהתקבלו" teal for their selected state
     (wash + border + ring) instead of the global purple accent. */
  .mpr-card.is-selected{background:var(--recv-sel-bg);border-color:var(--recv-sel);box-shadow:0 0 0 1.5px var(--recv-sel),var(--shadow-lg)}
  .mp-client.is-selected{box-shadow:0 0 0 1.5px var(--accent),var(--shadow-sm)}
  /* Select ("קבצים לבחירה") cards: neutral grey top line at rest — same as the
     received-files look. The service blue only appears as the frame (border +
     ring, no wash) once the card is selected. */
  .mp-client.mp-tone-select{border-top-color:var(--line)}
  .mp-client.mp-tone-select.is-selected{background:var(--panel);border-color:var(--svc);box-shadow:0 0 0 1.5px var(--svc),var(--shadow-sm)}
  /* Send ("קבצים שנשלחו") + Review ("אישור למסירה") cards: adopt their own tone
     (warm orange / green) for the selected frame + wash instead of the global
     purple accent, matching the tone used across the rest of the card. */
  .mp-client.mp-tone-send.is-selected,
  .mp-client.mp-tone-review.is-selected{background:var(--svc-bg);border-color:var(--svc);box-shadow:0 0 0 1.5px var(--svc),var(--shadow-sm)}

  /* Select / Review / Send project cards now share the received-files card
     layout (.mpr-card). Re-tint the teal-specific pieces (top action button,
     selected ring/wash) with each service tone so the layout footprint is
     identical while the color still reads per service. */
  .mpr-card.mp-tone-select,.mpr-card.mp-tone-review,.mpr-card.mp-tone-send,
  html[data-theme="dark"] .mpr-card.mp-tone-select,
  html[data-theme="dark"] .mpr-card.mp-tone-review,
  html[data-theme="dark"] .mpr-card.mp-tone-send{--recv-sel:var(--svc);--recv-sel-bg:var(--svc-bg)}
  .mpr-card.mp-tone-select .mpr-receive,
  .mpr-card.mp-tone-review .mpr-receive,
  .mpr-card.mp-tone-send .mpr-receive{--recv:var(--svc);--recv-bg:var(--svc-bg);--recv-bgh:var(--svc-line);--recv-line:var(--svc-line)}
  /* send card: warm-orange client badge — filled orange background + orange ring,
     replacing the shared lavender avatar so it matches the send service tone. */
  .mpr-card.mp-tone-send .mpr-avatar{background:linear-gradient(135deg,#ffe3cc,#ffd0a8);color:#c2410c;
    box-shadow:0 0 0 1.5px var(--panel),0 0 0 3px var(--svc)}
  html[data-theme="dark"] .mpr-card.mp-tone-send .mpr-avatar{background:linear-gradient(135deg,#3a260f,#2c1c0c);color:#fdba74}
  /* Stat font sizes intentionally left to the shared base .mpr-stat rules so the
     select / review / send cards read exactly like the received-files cards:
     first stat 12.5px, the rest 16px, labels 10.5px. */

  /* responsive — keyed to the card's OWN width (container query), so it lays out
     correctly whatever the dashboard column width is: keep the client identity
     beside the stat strip while it fits; on narrower cards the blocks stack in
     DOM order — the client identity on top and the stat strip directly beneath. */
  /* mid-width cards: keep the client identity beside the stat strip as ONE row
     of four columns (client · תפוגה · קבצים · נפח) — shrink the avatar, contact
     lines and stat cells so everything packs into a single line at this width. */
  @container (max-width:760px) and (min-width:481px){
    .mpr-body{grid-template-columns:minmax(150px,200px) 1fr;gap:16px;padding:20px 20px}
    .mpr-person{gap:11px}
    .mpr-avatar{width:50px;height:50px;flex-basis:50px;font-size:18px}
    .mpr-name{font-size:16px}
    .mpr-crow{font-size:11.5px;gap:6px;margin-top:3px}
    .mpr-crow svg{width:13px;height:13px}
    .mpr-statswrap{gap:11px}
    .mpr-stat{padding:13px 5px;gap:5px}
    .mpr-stat svg{width:18px;height:18px}
    .mpr-stat b{font-size:14.5px}
    .mpr-stat:nth-child(1) b{font-size:11.5px}
    .mpr-stat b[dir="ltr"]{font-size:11.5px}
    .mpr-card[class*="mp-tone-"] .mpr-stat b{font-size:11.5px}
    .mpr-stat span{font-size:10px;margin-top:2px}
    .mpr-order{font-size:12.5px}
  }
  /* narrow cards: stack — client identity on top, stat strip directly beneath */
  @container (max-width:480px){
    .mpr-body{grid-template-columns:1fr;gap:16px}
  }
  @container (max-width:400px){
    .mpr-stats{grid-template-columns:repeat(2,1fr)}
    .mpr-stat + .mpr-stat::before{display:none}
    .mpr-stat{border-top:1px solid var(--line)}
    .mpr-stat:nth-child(-n+2){border-top:none}
    .mpr-stat:nth-child(odd){border-inline-start:1px solid var(--line)}
    .mpr-bar{flex-wrap:wrap}
  }

  /* ---------- processed files history ---------- */
  .pf-card{overflow:hidden;padding:0;}
  .pf-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:22px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .pf-head h2{font-size:18px;font-weight:800;margin:0 0 4px;letter-spacing:-0.01em;}
  .pf-head .csub{font-size:13px;color:var(--muted);margin:0;max-width:72ch;}
  .pf-plan{display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:7px 12px;border-radius:999px;
    background:var(--svc-bg,var(--accent-soft));color:var(--svc,var(--accent-dim));font-size:12px;font-weight:800;white-space:nowrap;}
  .pf-plan svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .pf-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:18px;}
  .pf-item{display:flex;flex-direction:column;gap:14px;min-height:230px;padding:17px;border:1px solid var(--line);
    border-radius:8px;background:var(--svc-bg,var(--panel));box-shadow:var(--shadow-sm);position:relative;transition:border-color .16s,box-shadow .16s,background .16s;}
  .pf-item.is-selected{border-color:var(--svc,var(--accent));background:var(--svc-bg,var(--panel));box-shadow:0 0 0 2px var(--svc-line,var(--accent-soft)),var(--shadow);}
  /* checkbox lives in a reserved leading gutter that only opens in select mode — never overlaps the file icon */
  .pf-select{position:absolute;top:24px;inset-inline-start:14px;z-index:3;width:28px;height:28px;border-radius:999px;display:none;place-items:center;cursor:pointer;}
  .pf-card.pf-selecting .pf-item{padding-inline-start:54px;}
  .pf-card.pf-selecting .pf-select{display:grid;}
  .pf-select input{position:absolute;inset:0;margin:0;opacity:0;cursor:pointer;}
  .pf-select span{width:24px;height:24px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:transparent;display:grid;place-items:center;box-shadow:var(--shadow-sm);transition:background .14s,border-color .14s,color .14s,transform .12s;}
  .pf-select svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
  .pf-select:hover span{border-color:var(--svc,var(--accent));transform:translateY(-1px);}
  .pf-select input:focus-visible + span{outline:2px solid var(--svc,var(--accent));outline-offset:2px;}
  .pf-select input:checked + span{background:var(--svc,var(--accent));border-color:var(--svc,var(--accent));color:#fff;box-shadow:0 8px 18px var(--svc-shadow,rgba(124,58,237,.25));}
  .pf-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .pf-file{display:flex;align-items:center;gap:12px;min-width:0;}
  .pf-ic{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;background:var(--svc-bg,var(--grad-soft));color:var(--svc,var(--accent));}
  .pf-ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .pf-name{display:block;font-size:15px;font-weight:850;line-height:1.25;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pf-size{display:block;font-size:12px;color:var(--muted);margin-top:3px;}
  .pf-action{display:inline-flex;align-items:center;gap:7px;min-height:28px;padding:5px 10px;border-radius:8px;
    background:var(--svc-bg,var(--accent-soft));color:var(--svc,var(--accent-dim));font-size:11.5px;font-weight:850;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
