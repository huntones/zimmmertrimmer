  .pf-action svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .pf-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-block:1px solid var(--line-2);padding:13px 0;}
  .pf-k{display:block;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);margin-bottom:2px;}
  .pf-v{display:block;font-size:12.8px;font-weight:700;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pf-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;}
  .pf-foot .btn{border-radius:8px;font-size:12.8px;padding:9px 12px;white-space:nowrap;}
  .pf-empty{padding:44px 20px;text-align:center;}
  .pf-tools{padding:0 18px 18px;}
  .pf-head-side{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .pf-mode-btn{border-radius:999px;font-size:12.5px;padding:8px 13px;white-space:nowrap;}
  .pf-mode-btn.on{background:var(--svc-bg,var(--accent-soft));border-color:var(--svc,var(--accent));color:var(--svc,var(--accent-dim));}
  .pf-bulk{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 18px 0;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);box-shadow:var(--shadow-sm);}
  .pf-bulk .btn[disabled]{opacity:.5;cursor:not-allowed;pointer-events:none;}
  .pf-bulk-count{font-size:13px;font-weight:850;color:var(--svc,var(--accent-dim));}
  .pf-bulk-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .pf-bulk .btn{border-radius:8px;font-size:12.5px;padding:8px 11px;}

  /* ===== Processed-file card — clean media player (redesign) ===== */
  .pf-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:20px;align-items:stretch;}
  .pf-item{position:relative;display:flex;flex-direction:column;min-height:0;padding:22px 24px 16px;border:1px solid var(--line);
    border-radius:20px;background:var(--panel);box-shadow:var(--shadow);color:var(--ink);overflow:visible;
    transition:border-color .16s,box-shadow .16s;}
  .pf-item:hover{border-color:var(--sel-line);box-shadow:var(--shadow-lg);}
  .pf-item.is-selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow);}
  /* leading select checkbox — visible only in multi-select mode */
  .pf-item .pf-select{display:none;position:absolute;top:20px;left:18px;z-index:6;width:26px;height:26px;place-items:center;}
  .pf-card.pf-selecting .pf-item{padding-left:58px;}
  .pf-card.pf-selecting .pf-item .pf-select{display:grid;}
  .pf-item .pf-select span{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--sel-line);background:var(--panel);box-shadow:none;}
  .pf-item .pf-select input:checked + span{background:var(--accent);border-color:var(--accent);color:#fff;}
  /* body: main content only — the transport now lives inline in the wave row (LTR) */
  .pf-body{flex:1 1 auto;display:flex;flex-direction:column;align-items:stretch;gap:16px;direction:ltr;}
  .pf-play{position:relative;width:54px;height:54px;flex-shrink:0;border-radius:50%;border:none;cursor:pointer;padding:0;
    background:var(--grad-btn);display:grid;place-items:center;box-shadow:0 8px 18px var(--grad-btn-glow);transition:transform .12s,filter .12s;}
  .pf-play::before{content:'';position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--accent-soft);}
  .pf-play:hover{transform:translateY(-1px);filter:brightness(1.04);}
  .pf-play:active{transform:translateY(0);}
  .pf-play svg{width:22px;height:22px;fill:#fff;stroke:none;}
  .pf-play .i-play{margin-inline-start:3px;}
  .pf-play .i-pause,.pf-item.is-playing .pf-play .i-play{display:none;}
  .pf-item.is-playing .pf-play .i-pause{display:block;}
  /* times sit under the waveform: current on the left, total on the right */
  .pf-time{grid-column:2;grid-row:2;display:flex;align-items:baseline;justify-content:space-between;gap:10px;line-height:1.15;}
  .pf-cur{font-family:var(--mono);font-size:12.5px;font-weight:800;color:var(--accent-dim);}
  .pf-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:13px;}
  .pf-main-head{display:flex;align-items:flex-start;gap:14px;}
  .pf-name{flex:1;min-width:0;margin:0;font-size:14px;font-weight:500;line-height:1.3;color:var(--ink);letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pf-corner{position:relative;flex-shrink:0;display:flex;align-items:center;gap:9px;}
  .pf-fileicon{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:var(--grad-soft);color:var(--accent);}
  .pf-fileicon svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .pf-kebab{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:all .14s;}
  .pf-kebab:hover{background:var(--panel-2);color:var(--ink-2);border-color:var(--sel-line);}
  .pf-kebab svg{width:18px;height:18px;}
  .pf-kebab svg circle{fill:currentColor;stroke:none;}
  .pf-menu{position:absolute;top:calc(100% + 8px);right:0;z-index:30;min-width:196px;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;display:none;}
  .pf-menu.open{display:block;}
  .pf-menu button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 11px;border:none;border-radius:8px;
    background:transparent;color:var(--ink-2);font-family:var(--sans);font-size:13.5px;font-weight:650;cursor:pointer;text-align:start;transition:background .12s;}
  .pf-menu button:hover{background:var(--panel-2);}
  .pf-menu button.danger{color:var(--danger);}
  .pf-menu button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  .pf-menu-sep{height:1px;background:var(--line-2);margin:5px 6px;}
  .pf-pills{display:flex;flex-wrap:wrap;gap:8px;}
  .pf-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:9px;background:var(--panel-2);color:var(--muted);font-size:12.5px;font-weight:700;white-space:nowrap;}
  .pf-pill svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .pf-pill.primary{background:var(--accent-soft);color:var(--accent-dim);}
  /* play button (left) beside the wave; times sit on a second row under the wave */
  .pf-wave-row{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:14px;row-gap:8px;align-items:center;}
  .pf-wave-row .pf-play{grid-column:1;grid-row:1;}
  /* interactive real-audio waveform: bar layer + playhead + hover cursor */
  .pf-wave{grid-column:2;grid-row:1;position:relative;min-width:0;height:46px;cursor:pointer;touch-action:none;}
  .pf-wave:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px;}
  .pf-bars{position:absolute;inset:0;display:flex;align-items:center;gap:3px;overflow:hidden;pointer-events:none;}
  .pf-wave i{flex:1 1 0;min-width:2px;max-width:5px;border-radius:3px;background:var(--line);transition:background .12s;}
  .pf-wave i.on{background:var(--accent);}
  .pf-wave i.cur{background:var(--accent-dim);}
  .pf-playhead{position:absolute;top:8%;bottom:8%;left:0;width:2px;margin-left:-1px;border-radius:2px;
    background:var(--accent-dim);box-shadow:0 0 0 2px var(--panel);opacity:0;pointer-events:none;transition:opacity .15s;}
  .pf-item.is-playing .pf-playhead,.pf-wave:hover .pf-playhead,.pf-wave:focus-visible .pf-playhead{opacity:1;}
  .pf-hover{position:absolute;top:6%;bottom:6%;left:0;width:2px;margin-left:-1px;border-radius:2px;
    background:var(--accent);opacity:0;pointer-events:none;transition:opacity .12s;}
  .pf-wave:hover .pf-hover{opacity:.4;}
  .pf-total{font-family:var(--mono);font-size:13px;font-weight:800;color:var(--ink-2);}
  /* footer actions */
  .pf-divider{height:1px;background:var(--line-2);margin-top:18px;}
  .pf-foot{display:flex;align-items:center;justify-content:center;gap:12px;padding-top:15px;flex-wrap:wrap;direction:ltr;}
  .pf-fbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 22px;border-radius:11px;
    border:1px solid var(--line);background:var(--panel);color:var(--ink-2);font-family:var(--sans);font-size:13.5px;font-weight:750;cursor:pointer;transition:all .14s;}
  .pf-fbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .pf-fbtn:hover{background:var(--panel-2);border-color:var(--sel-line);}
  .pf-fbtn.share:hover{border-color:var(--accent);color:var(--accent-dim);background:var(--accent-soft);}
  .pf-fbtn.download{background:var(--grad-btn);border:none;color:#fff;box-shadow:0 8px 18px var(--grad-btn-glow);padding:0 26px;}
  .pf-fbtn.download:hover{filter:brightness(1.05);background:var(--grad-btn);}
  .pf-fbtn.delete{color:var(--danger);}
  .pf-fbtn.delete:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft);}
  /* image / document variant — no transport row (no `player` markup is emitted) */
  /* responsive column count handled below: 2-up ≤1150px, 1-up ≤900px */
  @media(max-width:560px){ .pf-foot .pf-fbtn{flex:1 1 auto;} }

  /* ===== Share popup ===== */
  .pf-share-overlay{z-index:130;}
  .pf-share{position:relative;width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;
    box-shadow:0 24px 60px rgba(17,20,32,.30);padding:24px 22px 22px;transform:translateY(8px) scale(.98);transition:transform .18s;}
  .kc-overlay.show .pf-share{transform:none;}
  .pf-share-x{position:absolute;top:14px;inset-inline-end:14px;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel);color:var(--muted);cursor:pointer;display:grid;place-items:center;}
  .pf-share-x:hover{background:var(--panel-2);color:var(--ink-2);}
  .pf-share-x svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;}
  .pf-share-head{display:flex;align-items:center;gap:13px;margin-bottom:18px;padding-inline-end:36px;}
  .pf-share-ic{flex-shrink:0;width:48px;height:48px;border-radius:13px;display:grid;place-items:center;background:var(--grad-soft);color:var(--accent);}
  .pf-share-ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .pf-share-meta{min-width:0;}
  .pf-share-meta h3{margin:0 0 3px;font-size:17px;font-weight:800;color:var(--ink);}
  .pf-share-meta p{margin:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pf-share-link{display:flex;align-items:center;gap:8px;padding:6px;padding-inline-start:13px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);margin-bottom:18px;}
  .pf-share-link input{flex:1;min-width:0;border:none;background:transparent;color:var(--ink-2);font-family:var(--mono);font-size:12.5px;outline:none;direction:ltr;text-align:start;}
  .pf-share-copy{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:9px;border:none;
    background:var(--grad-btn);color:#fff;font-family:var(--sans);font-size:12.5px;font-weight:750;cursor:pointer;box-shadow:0 6px 14px var(--grad-btn-glow);white-space:nowrap;}
  .pf-share-copy svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;}
  .pf-share-copy.done{background:var(--success);box-shadow:none;}
  .pf-share-via{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin-bottom:11px;}
  .pf-share-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:10px;}
  .pf-sh-t{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px;border:1px solid var(--line);border-radius:13px;
    background:var(--panel);color:var(--ink-2);font-family:var(--sans);font-size:12px;font-weight:650;cursor:pointer;transition:all .14s;}
  .pf-sh-t:hover{background:var(--panel-2);border-color:var(--sel-line);transform:translateY(-1px);}
  .pf-sh-ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;}
  .pf-sh-ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .pf-sh-ic.wa{background:#25d366;}
  .pf-sh-ic.em{background:#5b7cfa;}
  .pf-sh-ic.tg{background:#2aabee;}
  .pf-sh-ic.nt{background:var(--accent);}
  @media(max-width:1150px){.pf-list,.mpr-list{grid-template-columns:repeat(2,minmax(0,1fr))}}

  footer.dfoot{text-align:center;color:var(--faint);font-size:12px;font-family:var(--mono);margin-top:30px;}

  /* ---------- responsive ---------- */
  @media (max-width:900px){
    .dash{grid-template-columns:1fr;}
    .dash-mbar{display:flex;}
    .side{position:fixed;top:0;inset-inline-start:0;height:100%;width:300px;max-width:86vw;border-radius:0;z-index:120;
      transform:translateX(-110%);transition:transform .22s ease;overflow-y:auto;border-inline-start:none;}
    html[dir="rtl"] .side{transform:translateX(110%);}
    .side.open{transform:translateX(0)!important;box-shadow:var(--shadow-lg);}
    .side-scrim{display:block;position:fixed;inset:0;background:rgba(10,12,20,.5);z-index:110;opacity:0;visibility:hidden;transition:opacity .2s;}
    .side-scrim.open{opacity:1;visibility:visible;}
    .metrics{grid-template-columns:repeat(2,1fr);}
    .quick{grid-template-columns:repeat(2,1fr);}
    .mp-tools{grid-template-columns:repeat(2,minmax(0,1fr));}
    .mp-clients{grid-template-columns:1fr;}
    .mpr-list{grid-template-columns:1fr;}
    .dt-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
    .pf-list{grid-template-columns:1fr;}
    .project-row{grid-template-columns:1fr 1fr;gap:12px;}
    .project-main,.project-actions{grid-column:1/-1;}
    .project-actions{justify-content:flex-start;}
  }
  @media (max-width:560px){
    .metrics,.quick,.feats,.grid2{grid-template-columns:1fr;}
    .mp-head{align-items:stretch;}
    .mp-new-request{width:100%;}
    .mp-tools{grid-template-columns:1fr;}
    .mp-tool{min-height:76px;}
    .dt-grid{grid-template-columns:1fr;}
    .dt-head{align-items:flex-start;flex-direction:column;}
    .mp-section-title{align-items:flex-start;flex-direction:column;gap:4px;}
    .mp-facts{grid-template-columns:1fr;}
    .mp-client-foot{align-items:stretch;flex-direction:column;}
    .mp-foot-actions{width:100%;}
    .mp-client-foot .btn,.mp-files-link{flex:1;width:100%;}
    /* .mpr-* narrow layout is handled by the per-card @container queries above */
    .pf-head{padding:18px;}
    .pf-list{padding:14px;}
    .pf-bulk{align-items:stretch;flex-direction:column;margin:14px 14px 0;}
    .pf-bulk-actions{width:100%;}
    .pf-bulk .btn{flex:1;}
    .pf-meta{grid-template-columns:1fr;}
    .pf-foot{align-items:stretch;flex-direction:column;}
    .pf-foot .btn{width:100%;}
    .dash-search-box{width:100%;}
    .ds-row{grid-template-columns:36px minmax(0,1fr);gap:10px;padding:10px;}
    .ds-ic{width:36px;height:36px;border-radius:10px;}
    .ds-ic svg{width:18px;height:18px;}
    .ds-action{grid-column:2;justify-self:start;height:32px;}
    .sc-actions{width:100%;}
    .phead .avatar{width:48px;height:48px;font-size:20px;}
    .project-head{flex-direction:column;align-items:stretch;}
    .project-head .btn{width:100%;}
    .project-row{grid-template-columns:1fr;padding:15px;}
    .project-stat,.project-actions{grid-column:auto;}
    .project-actions{align-items:stretch;justify-content:stretch;}
    .project-actions .btn,.project-status{width:100%;}
  }

  /* ===== KOLKLI Request inbox (my-requests) — its own look, inspired not copied ===== */
  .ri-card{padding:20px 22px 22px;}
  .ri-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
  .ri-head h2{font-size:17px;font-weight:700;margin:0 0 4px;letter-spacing:-0.01em;}
  .ri-head .csub{font-size:13px;color:var(--muted);margin:0;}
  .ri-newbtn{white-space:nowrap;}
  .ri-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .ri-search{position:relative;flex:1;min-width:180px;}
  .ri-search svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--faint);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;}
  .ri-search input{width:100%;height:40px;padding:0 14px;padding-inline-start:36px;border:1px solid var(--line);border-radius:11px;background:var(--panel-2);color:var(--ink);font-family:var(--sans);font-size:13.5px;outline:none;transition:border-color .12s;}
  .ri-search input:focus{border-color:var(--accent);}
  .ri-sort{height:40px;padding:0 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel-2);color:var(--ink-2);font-family:var(--sans);font-size:13px;cursor:pointer;}
  .ri-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .ri-chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--muted);font-family:var(--sans);font-size:12.5px;font-weight:600;cursor:pointer;transition:all .12s;}
  .ri-chip:hover{border-color:var(--accent);color:var(--ink-2);}
  .ri-chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent-dim);}
  .ri-chip .n{font-family:var(--mono);font-size:11px;background:var(--panel-2);border-radius:999px;padding:1px 7px;color:var(--muted);}
  .ri-chip.on .n{background:var(--panel);color:var(--accent-dim);}
  .ri-body{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start;}
  .ri-list{display:flex;flex-direction:column;gap:10px;min-width:0;}
  .ri-row{position:relative;display:flex;align-items:flex-start;gap:13px;padding:14px 15px;border:1px solid var(--line);border-radius:14px;background:var(--panel);cursor:pointer;transition:border-color .12s,box-shadow .12s;box-shadow:var(--shadow-sm);}
  .ri-row:hover{border-color:var(--accent);}
  .ri-row.on{border-color:transparent;box-shadow:0 0 0 1.6px var(--accent),var(--shadow);}
  .ri-mark{flex-shrink:0;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--grad-soft);color:var(--accent-dim);}
  .ri-mark svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .ri-rmain{flex:1;min-width:0;}
  .ri-rtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .ri-name{font-size:14px;font-weight:700;color:var(--ink);letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .ri-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:5px;}
  .ri-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--faint);flex-shrink:0;}
  .ri-meta b{color:var(--ink-2);font-weight:600;}
  .ri-badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:0.01em;}
  .ri-badge.active{background:var(--success-soft);color:var(--success-dim);}
  .ri-badge.expired{background:var(--danger-soft);color:var(--danger);}
  .ri-badge.closed{background:var(--panel-2);color:var(--faint);border:1px solid var(--line);}
  .ri-exp{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;}
  .ri-exp svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .ri-unseen{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--grad);color:#fff;box-shadow:0 2px 8px var(--grad-shadow);}
  .ri-kebab{flex-shrink:0;width:32px;height:32px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:all .12s;}
  .ri-kebab:hover{background:var(--panel-2);border-color:var(--line);color:var(--ink-2);}
  .ri-kebab svg{width:18px;height:18px;}
  .ri-kebab svg circle{fill:currentColor;stroke:none;}
  .ri-menu{position:absolute;top:48px;inset-inline-end:12px;z-index:30;min-width:186px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;display:none;}
  .ri-menu.open{display:block;}
  .ri-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border:none;border-radius:8px;background:transparent;color:var(--ink-2);font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;text-align:start;transition:background .12s;}
  .ri-menu button:hover{background:var(--panel-2);}
  .ri-menu button.danger{color:var(--danger);}
  .ri-menu button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

(function(){
  function signedIn(){
    try{
      var email=(localStorage.getItem('ac_session')||'').toLowerCase();
      var users=JSON.parse(localStorage.getItem('ac_users')||'[]');
      return !!(email && Array.isArray(users) && users.some(function(u){ return (u.email||'').toLowerCase()===email; }));
    }catch(e){ return false; }
  }
  function syncHeader(){
    document.body.classList.toggle('dash-signed-in', signedIn());
  }
  window.addEventListener('kolkli:auth', syncHeader);
  window.addEventListener('storage', function(e){
    if(!e || e.key===null || e.key==='ac_session' || e.key==='ac_users'){
      syncHeader();
    }
  });
  syncHeader();
})();

    reviews.forEach(function(p){

      bytes+=items.reduce(function(s,f){ return s+(Number(f.size)||0); },0);
    });
    return {
      storageGB: Math.round((bytes/1e9)*100)/100,

  // Read an image file, downscale it to <=256px on a canvas (keeps localStorage
  // small) and store the result as the avatar.
  function readAvatarFile(file){
    if(!file) return;
    if(!/^image\//.test(file.type) || file.size>5*1024*1024){ alert(t.photoErr); return; }
    var reader=new FileReader();
    reader.onload=function(){
      var img=new Image();
      img.onload=function(){
        var max=256, scale=Math.min(1, max/Math.max(img.width, img.height));
        var cw=Math.max(1,Math.round(img.width*scale)), ch=Math.max(1,Math.round(img.height*scale));
        var cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
        var ctx=cv.getContext('2d');
        ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,cw,ch);
        ctx.drawImage(img,0,0,cw,ch);
        var data; try{ data=cv.toDataURL('image/jpeg',0.85); }catch(e){ data=reader.result; }
        user.avatar=data; persistUser(); render();
      };
      img.onerror=function(){ alert(t.photoErr); };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  }

  function storageText(){
    return ({
      he:{ title:'STORAGE', used:'נוצל', of:'מתוך', left:'נותר' },
      en:{ title:'STORAGE', used:'Used', of:'of', left:'Left' },
      ru:{ title:'STORAGE', used:'Used', of:'of', left:'Left' }
    })[lang] || { title:'STORAGE', used:'Used', of:'of', left:'Left' };
  }
  function fmtStorageGB(gb){
    if(gb===INF) return '∞';
    gb=Math.max(0,Number(gb)||0);
    if(gb>=1000) return (Math.round(gb/1000*10)/10)+' TB';
    if(gb>=1) return (Math.round(gb*10)/10)+' GB';
    var mb=gb*1000;
    return (mb<10 ? Math.round(mb*10)/10 : Math.round(mb))+' MB';
  }
  function storagePctRaw(used,limit){
    used=Number(used)||0;
    if(!limit || limit===INF) return 0;
    return Math.max(0, Math.min(100, Math.round(used/limit*100)));
  }
  function sideStorageHtml(){
    var P=PLANS[plan], L=P.limits, u=currentUsage(), used=Number(u.storageGB)||0, total=L.storageGB;
    var p=storagePctRaw(used,total), left=(total===INF?INF:Math.max(0,total-used)), st=storageText();
    return '<div class="storage-chip" title="'+esc(st.used+' '+fmtStorageGB(used)+' '+st.of+' '+fmtStorageGB(total))+'">'+
      '<span class="storage-ring" style="--p:'+p+'"><span>'+p+'%</span></span>'+
      '<span class="storage-tx"><span class="storage-title">'+esc(st.title)+'</span>'+
      '<span class="storage-line">'+esc(st.used+' '+fmtStorageGB(used)+' '+st.of+' '+fmtStorageGB(total))+'</span>'+
      '<span class="storage-left">'+esc(st.left+' '+fmtStorageGB(left))+'</span></span>'+
    '</div>';
  }

  function renderSide(){
    var html='';
    if(isAdmin()){
      html += '<a class="side-admin" href="admin"><span class="sa-ic">'+s(ICON.shield)+'</span><span>'+esc(t.adminPanel)+'</span></a>';
    }
    // Settings gear removed from the top of the side rail — it duplicated the
    // "הגדרות חשבון" gear already available in the account menu at the bottom.
    NAV.forEach(function(cat){
      if(cat.id==='teamsec') return;
      // profile/settings items live on the standalone account-settings page now,
      // reached via the gear button — never rendered inline in the sidebar.
      if(isSettingsCat(cat)) return;
      var isOn = cat.items.some(function(it){ return it.id===view; });
      var noSubs = cat.id==='projects' || cat.id==='mytools';
      var open = !noSubs && (cat.open || isOn);
      var subs;
      if(noSubs){
        subs = '';
      } else if(cat.id==='organize'){
        subs = '<div class="client-subbar">'+
          editableItem('my-files', labelFor('my-files', nameFor(cat.items[0])), view==='my-files' && !activeProjectId)+
          '<button class="side-add-project" type="button" id="sideNewProject" title="'+esc(t.newProject)+'" aria-label="'+esc(t.newProject)+'">'+s(ICON.plus)+'</button>'+
        '</div>';
      } else if(cat.add){
        var first=cat.items[0], rest=cat.items.slice(1);
        var addLbl=t[cat.add.label]||'';
        // add.view → open a dashboard view in place; add.href → navigate to a page
        var addAttr=cat.add.view ? 'data-add-view="'+esc(cat.add.view)+'"' : 'data-add-href="'+esc(cat.add.href)+'"';
        subs = '<div class="client-subbar">'+
          editableItem(first.id, labelFor(first.id, nameFor(first)), first.id===view)+
          '<button class="side-add-project" type="button" '+addAttr+' title="'+esc(addLbl)+'" aria-label="'+esc(addLbl)+'">'+s(ICON.plus)+'</button>'+
        '</div>'+
        rest.map(function(it){
          return '<div class="subitem '+(it.id===view?'active':'')+'" data-view="'+it.id+'">'+
            '<span class="dot"></span><span>'+esc(nameFor(it))+'</span></div>';
        }).join('');
      } else {
        subs = cat.items.map(function(it){
          if(it.editable) return editableItem(it.id, labelFor(it.id, nameFor(it)), it.id===view);
          return '<div class="subitem '+(it.id===view?'active':'')+navToneClass(it.id)+'" data-view="'+it.id+'">'+
            '<span class="dot"></span><span>'+esc(nameFor(it))+'</span></div>';
        }).join('');
      }
      var headTag = 'button';
      var headTarget = '';
      // "My Projects" head always opens the combined, chronological project-all
      // view; "My Files" keeps its current sub-view (or defaults to my-all).
      if(noSubs) headTarget = cat.id==='mytools' ? (isOn ? view : 'my-all') : 'project-all';
      var headAttr = noSubs ? ' type="button" data-view="'+esc(headTarget)+'"' : ' type="button" data-cattoggle="'+cat.id+'"';
      html += '<div class="cat '+(open?'open':'')+' '+(isOn?'on':'')+(noSubs?' no-subs':'')+(cat.id==='projects'?projectToneClass(view):cat.id==='mytools'?editToneClass(view):'')+'" data-cat="'+cat.id+'">'+

          '<span class="cat-ic">'+s(ICON[cat.icon])+'</span>'+
          '<span class="cat-name">'+esc(nameFor(cat))+'</span>'+
          '<span class="cat-chev">'+s(ICON.chev)+'</span>'+
        '</'+headTag+'>'+
        (noSubs ? '' : '<div class="subs">'+subs+'</div>')+
      '</div>';
    });
    html += sideToolLinksHtml();
    html += sideBelowToolsHtml();

    var P=PLANS[plan];
    html += '<div class="side-plan">'+
      '<div class="plan-card">'+
        '<div class="planchip">'+
          '<span class="pc-ic">'+s(ICON[PLAN_ICON[plan]])+'</span>'+

      '<div class="side-logo"><img src="./assets/logo.png" alt="KOLKLI" width="139" height="34" decoding="async"></div>'+

      ? '<div class="sc-top-plan">'+s(ICON.check)+esc(t.topPlan)+' 🎉</div>'
      : '<a class="btn-up" href="pricing/">'+s(ICON.zap)+esc(t.upgrade)+'</a>';

      '<div class="sc-top">'+

        '<div class="sc-actions">'+actions+'</div>'+
      '</div>'+
    '</div>';

    // usage
    var usageNow=currentUsage();
    var sWarn=pct(usageNow.storageGB,L.storageGB)>=80, tWarn=pct(usageNow.transfersMo,L.transfersMo)>=80,
        fWarn=pct(usageNow.files,L.files)>=80, lWarn=pct(usageNow.links,L.links)>=80;
    var usage = '<div class="card">'+
      '<h2>'+esc(t.usageTitle)+'</h2><p class="csub">'+esc(t.usageSub)+'</p>'+

        metricCard('drive', t.mStorage,   fmtGB(usageNow.storageGB), fmtGB(L.storageGB), pct(usageNow.storageGB,L.storageGB), sWarn)+
        metricCard('swap',  t.mTransfers, fmtNum(usageNow.transfersMo), fmtNum(L.transfersMo), pct(usageNow.transfersMo,L.transfersMo), tWarn)+
        metricCard('files', t.mFiles,     fmtNum(usageNow.files), fmtNum(L.files), pct(usageNow.files,L.files), fWarn)+
        metricCard('link',  t.mLinks,     fmtNum(usageNow.links), fmtNum(L.links), pct(usageNow.links,L.links), lWarn)+
      '</div>'+
    '</div>';

    var feats = P.feats[lang].map(function(f){ return '<li>'+s(ICON.check)+esc(f)+'</li>'; }).join('');

      '<h2>'+esc(t.limitsTitle)+' — '+esc(P.name)+'</h2>'+

      '<a class="compare" href="pricing/">'+esc(t.comparePlans)+s(ICON.arrow)+'</a>'+

    var q = [
      {ic:'music', href:'app',      t:t.qAudioT, d:t.qAudioD},
      {ic:'film',  href:'video-cut',t:t.qVideoT, d:t.qVideoD},
      {ic:'folder',href:'files',    t:t.qOrgT,   d:t.qOrgD},
      {ic:'send',  href:'send',     t:t.qSendT,  d:t.qSendD}
    ].map(function(c){
      return '<a class="qcard" href="'+c.href+'"><span class="q-ic">'+s(ICON[c.ic])+'</span>'+
        '<span class="q-t">'+esc(c.t)+'</span><span class="q-d">'+esc(c.d)+'</span></a>';
    }).join('');
    var quick = '<div class="card"><h2>'+esc(t.quickTitle)+'</h2><p class="csub"></p><div class="quick">'+q+'</div></div>';

  // Map any status string (English canonical OR already-localized he/ru) to a
  // semantic state, so the pill color reflects the link's STATE — not the
  // service tone. Keyword-based so it survives translation.
  function projStatusTone(raw){
    var s=String(raw||'').toLowerCase();
    function has(){ for(var i=0;i<arguments.length;i++){ if(s.indexOf(arguments[i])>=0) return true; } return false; }
    if(has('expire','פג','истек')) return 'danger';
    if(has('closed','סגור','закрыт','draft','טיוטה','черновик')) return 'neutral';
    if(has('change','שינויים','изменени')) return 'success';
    if(has('active','פעיל','активн')) return 'active';
    // waiting/pending BEFORE success — else "waiting APPROVal" matches the "approv" (approved) keyword
    if(has('wait','pending','awaiting','ממתין','ожида')) return 'warn';
    // "not downloaded / טרם הורד" is a waiting state — guard it before the
    // success keywords below, since it contains the "download/הורד" substring.
    if(has('not download','undownloaded','טרם','не скач')) return 'warn';
    if(has('approv','deliver','download','received','מאושר','נמסר','הורד','התקבל','согласова','доставл','скача','получен')) return 'success';
    if(has('sent','progress','review','נשלח','בתהליך','בבדיקה','отправл','процесс','провер')) return 'info';
    return 'info';
  }
  // Select-page selection state -> dedicated pill class + icon. Keyword based
  // so it survives localization (English canonical, Hebrew or Russian labels).
  function projSelectStatus(raw){
    var s=String(raw||'').toLowerCase();
    function has(){ for(var i=0;i<arguments.length;i++){ if(s.indexOf(arguments[i])>=0) return true; } return false; }
    if(has('complete','finished','done','approv','הסתיימ','אושר','заверш','готов')) return { cls:'sel-done', icon:'check' };
    if(has('view only','view-only','viewonly','לצפייה','просмотр')) return { cls:'sel-view', icon:'eye' };
    if(has('unavailable','blocked','closed','expired','locked','אינה זמינה','לא זמינה','חסומ','נעול','недоступ','заблок','закрыт')) return { cls:'sel-blocked', icon:'lock' };
    if(has('in progress','progress','בתהליך','процесс')) return { cls:'sel-progress', icon:'refresh' };
    return { cls:'sel-wait', icon:'clock' };
  }
  // Review / approval lifecycle -> dedicated status pill (color + icon). Keyword
  // based so it survives localization and matches both the demo phrases and the
  // review-store tokens (sent/viewed/changes/approved). Follows the KOLKLI
  // approval legend. Returns null for closed/expired/draft so the generic tone
  // pill (neutral / danger) keeps handling those non-lifecycle states.
  function projReviewStatus(raw){
    var s=String(raw||'').toLowerCase();
    function has(){ for(var i=0;i<arguments.length;i++){ if(s.indexOf(arguments[i])>=0) return true; } return false; }
    if(has('expire','closed','draft','פג','סגור','טיוטה','истек','закрыт','черновик')) return null;
    if(has('reject','declin','נדח','נדחה','отклон')) return { cls:'rv-rejected', icon:'x' };           // red
    // "new version sent" contains "sent" - resolve it before the waiting rule below
    if(has('new version','version','re-sent','resent','גרסה','версия')) return { cls:'rv-version', icon:'refresh' }; // violet
    if(has('change','comment','feedback','שינויים','הערות','תיקון','измен','правк','замеч','отзыв')) return { cls:'rv-changes', icon:'chat' }; // amber
    // waiting BEFORE approved - else "waiting APPROVal" matches the "approv" keyword
    if(has('wait','pending','awaiting','sent','ממתין','נשלח','טרם','ожида','отправл')) return { cls:'rv-wait', icon:'clock' }; // blue
    if(has('approv','אושר','מאושר','одобр','согласов')) return { cls:'rv-approved', icon:'check' };     // green
    if(has('re-review','rereview','review','viewed','opened','בבדיקה','נצפה','провер','просмотр')) return { cls:'rv-review', icon:'eye' }; // orange
    return { cls:'rv-wait', icon:'clock' };
  }

  var Team = (function(){
    var orgId=null, myId=null;
    function demoInvites(){ try{ return JSON.parse(lsGet('kolkli_demo_invites'))||[]; }catch(e){ return []; } }
    function saveDemoInvites(a){ lsSet('kolkli_demo_invites', JSON.stringify(a)); }
    function sb(){ return (window.KolkliAuth && window.KolkliAuth.configured()) ? window.KolkliAuth.getClient() : Promise.resolve(null); }

    async function load(){
      var c=await sb();
      if(!c){
        return { demo:true, org:{ name:(user.name||'My')+' · '+(({he:'סביבת עבודה',en:'workspace',ru:'рабочая область'})[lang]||'workspace'), plan:plan, seats:3 },
          role:'owner', members:[{ id:'me', name:user.name||((user.email||'you').split('@')[0]), email:user.email||'you@example.com', role:'owner', you:true }],
          invites:demoInvites() };
      }
      myId=await window.KolkliAuth.userId();
      var orgs=((await c.from('organizations').select('id,name,plan,seats,owner')).data)||[];
      if(!orgs.length) return { org:null, members:[], invites:[], role:null };
      var mine=null; for(var i=0;i<orgs.length;i++){ if(orgs[i].owner===myId){ mine=orgs[i]; break; } }
      mine=mine||orgs[0]; orgId=mine.id;
      var mem=((await c.from('org_members').select('user_id,role').eq('org_id',orgId)).data)||[];
      var ids=mem.map(function(m){ return m.user_id; });
      var profs=ids.length ? (((await c.from('profiles').select('id,full_name,email').in('id',ids)).data)||[]) : [];
      var pmap={}; profs.forEach(function(p){ pmap[p.id]=p; });
      var members=mem.map(function(m){ var p=pmap[m.user_id]||{}; return { id:m.user_id, name:p.full_name||'', email:p.email||'', role:m.role, you:m.user_id===myId }; });
      members.sort(function(a,b){ var o={owner:0,admin:1,member:2}; return (o[a.role]-o[b.role]); });
      var myRole=(members.find(function(m){ return m.you; })||{}).role||'member';
      var invites=((await c.from('org_invites').select('id,email,role,token').eq('org_id',orgId).eq('accepted',false)).data)||[];
      return { org:mine, members:members, invites:invites, role:myRole };
    }
    async function invite(email, role){
      var c=await sb();
      if(!c){ var a=demoInvites(); var tok='demo-'+Math.random().toString(36).slice(2,10); a.push({ id:'d'+a.length+'-'+tok, email:email, role:role, token:tok }); saveDemoInvites(a); return { ok:true, token:tok }; }
      var res=await c.from('org_invites').insert({ org_id:orgId, email:email.toLowerCase(), role:role }).select('token').single();
      return res.error ? { ok:false, message:res.error.message } : { ok:true, token:res.data.token };
    }
    async function revokeInvite(id){
      var c=await sb();
      if(!c){ saveDemoInvites(demoInvites().filter(function(x){ return x.id!==id; })); return { ok:true }; }
      var res=await c.from('org_invites').delete().eq('id',id); return { ok:!res.error, message:res.error&&res.error.message };
    }
    async function setRole(uid, role){ var c=await sb(); if(!c) return { ok:true }; var res=await c.from('org_members').update({ role:role }).eq('org_id',orgId).eq('user_id',uid); return { ok:!res.error, message:res.error&&res.error.message }; }
    async function removeMember(uid){ var c=await sb(); if(!c) return { ok:true }; var res=await c.from('org_members').delete().eq('org_id',orgId).eq('user_id',uid); return { ok:!res.error, message:res.error&&res.error.message }; }
    async function acceptInvite(token){ var c=await sb(); if(!c) return { ok:false, message:'not configured' }; var res=await c.rpc('accept_invite',{ invite_token:token }); return res.error ? { ok:false, message:res.error.message } : { ok:true, orgId:res.data }; }
    return { load:load, invite:invite, revokeInvite:revokeInvite, setRole:setRole, removeMember:removeMember, acceptInvite:acceptInvite };

  async function billingGo(path, extra){
    var base=(typeof kolkliWorker==='function') && kolkliWorker('billing');

    try{
      var token=await window.KolkliAuth.getToken();

      var payload=Object.assign({ orgId:orgId }, extra||{});
      if(path==='/checkout' && !payload.seats) payload.seats=Math.max(1, (d.members||[]).length);
      var r=await fetch(base+path, { method:'POST', headers:{ authorization:'Bearer '+token, 'content-type':'application/json' }, body:JSON.stringify(payload) }).then(function(x){ return x.json(); });
      if(r && r.url){ location.href=r.url; } else { alert((r && r.error) || tt().errGeneric); }
    }catch(e){ location.href='pricing/'; }

  function wireTeam(root){
    var x=tt();
    var inv=el('tmInvite');
    if(inv) inv.addEventListener('click', function(){
      var email=(el('tmEmail').value||'').trim().toLowerCase();
      var role=el('tmRole').value;

      if(!EMAIL_RE.test(email)){ errBox.textContent=x.errEmail; return; }

        inv.disabled=false;
        if(!r.ok){ errBox.textContent=r.message||x.errGeneric; return; }

  /* =====================================================
     KOLKLI Request — inbox for the "my-requests" view.
     Rows = upload links (window.KR / request-store.js).
     Inbox + detail render inline; New request + full
     preview deep-link to request.html.
     ===================================================== */
  function riReqs(){ return (window.KR ? KR.loadRequests() : []).slice(); }
  function riStatus(r){ return window.KR ? KR.statusOf(r) : 'active'; }
  function riStatusLabel(st){ return t.ri[st] || st; }
  // File lifecycle stage for a received-files request:
  //  uploading = client hasn't finished uploading yet (no files)
  //  ready     = files are in and at least one still un-downloaded
  //  done      = every received file has been downloaded/seen
  function riFileStage(r){
    var files=(r&&r.files)||[];
    if(!files.length) return 'uploading';
    var unseen = window.KR ? KR.reqUnseen(r) : files.filter(function(f){ return !f.seen; }).length;
    return unseen>0 ? 'ready' : 'done';
  }
  function riFileStageLabel(stage){
    var m=(t&&t.ri)||{};
    if(stage==='uploading') return m.stgUploading || 'Upload in progress';
    if(stage==='done')      return m.stgDone      || 'Download completed';
    return m.stgReady || 'Ready for download';
  }
  function riExpiry(r){
    if(!r.expiresAt) return '';
    var ms=r.expiresAt-Date.now();
    if(ms<=0) return t.ri.expiredOn;

  function riToast(msg){
    var box=el('riToast');
    if(!box){ box=document.createElement('div'); box.id='riToast'; box.className='ri-toast'; document.body.appendChild(box); }

  function riCopy(token){
    var url=riUploadUrl(token), done=function(){ riToast(t.ri.copied); };
    try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done,done); return; } }catch(e){}
    var ta=document.createElement('textarea'); ta.value=url; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(_){ } ta.remove(); done();
  }
  function riTrigger(blob, name){
    var url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download=name||'file'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);

  function riDownload(id){
    if(!window.KR) return;
    KR.getBlob(id).then(function(blob){
      if(!blob) return;
      var r=KR.getRequest(reqState.sel), f=r&&(r.files||[]).filter(function(x){ return x.id===id; })[0];
      riTrigger(blob, (f&&f.name)||'file');
    });

  // Bundle every file in the request into a single .zip (mirrors download.html).
  function riDownloadAll(token){
    if(!window.KR) return;
    var r=KR.getRequest(token); if(!r) return;
    var files=(r.files||[]).slice();
    if(!files.length){ riToast(t.ri.dlAllEmpty); return; }
    var sel=window.CSS&&CSS.escape?CSS.escape(token):token;
    var btn=document.querySelector('.ri-dlall[data-rdlall="'+sel+'"]');
    var lbl=btn&&btn.querySelector('.lbl'), prev=lbl?lbl.textContent:null;
    if(btn){ btn.disabled=true; if(lbl) lbl.textContent=t.ri.zipping; }
    var restore=function(){ if(btn){ btn.disabled=false; if(lbl&&prev!=null) lbl.textContent=prev; } };
    Promise.all(files.map(function(f){
      return KR.getBlob(f.id).then(function(b){ return { name:f.name, blob:b }; }, function(){ return { name:f.name, blob:null }; });
    })).then(function(items){
      items=items.filter(function(x){ return x.blob; });
      if(!items.length){ riToast(t.ri.dlAllEmpty); restore(); return; }
      if(!window.JSZip){ items.forEach(function(x){ riTrigger(x.blob, x.name); }); restore(); return; }
      var zip=new JSZip(), used={};
      items.forEach(function(x){
        var base=x.name||'file', n=base, i=2;
        while(used[n]){ var dot=base.lastIndexOf('.'); n = dot>0 ? base.slice(0,dot)+' ('+i+')'+base.slice(dot) : base+' ('+i+')'; i++; }
        used[n]=true; zip.file(n, x.blob);
      });
      return zip.generateAsync({type:'blob'}).then(function(blob){
        var safe=(r.name||'kolkli-files').replace(/[^\w֐-׿ \-]+/g,'').trim()||'kolkli-files';
        riTrigger(blob, safe+'.zip'); restore();
      });
    }).catch(function(){ riToast(t.ri.dlAllEmpty); restore(); });
  }
  function riDuplicate(token){
    if(!window.KR) return;
    var src=KR.getRequest(token); if(!src) return;
    var copy=JSON.parse(JSON.stringify(src));
    copy.token=KR.randToken(); copy.name=(src.name||'')+t.ri.dupSuffix; copy.createdAt=Date.now();
    copy.status='active'; copy.submissions=[]; copy.files=[];
    if(src.expiresAt){ var span=src.expiresAt-src.createdAt; copy.expiresAt=Date.now()+Math.max(span,86400000); }
    KR.upsertRequest(copy); reqState.sel=copy.token; renderMain();
  }
  function riClose(token){

      reqState.filter=b.getAttribute('data-rfilter'); renderReqList();
    });
    listEl.addEventListener('click', function(e){
      var actBtn=e.target.closest('[data-ract]');
      if(actBtn){
        e.stopPropagation(); riCloseMenus();
        var act=actBtn.getAttribute('data-ract'), token=actBtn.getAttribute('data-rtoken');
        if(act==='open') location.href='request?tab=manage';
        else if(act==='copy') riCopy(token);
        else if(act==='dup') riDuplicate(token);
        else if(act==='close') riClose(token);
        else if(act==='del') riDelete(token);
        return;
      }
      var kb=e.target.closest('[data-rmenu]');
      if(kb){
        e.stopPropagation();
        var tk=kb.getAttribute('data-rmenu');
        var menu=listEl.querySelector('.ri-menu[data-menu-for="'+(window.CSS&&CSS.escape?CSS.escape(tk):tk)+'"]');
        var wasOpen=menu&&menu.classList.contains('open');
        riCloseMenus();
        if(menu&&!wasOpen) menu.classList.add('open');
        return;
      }
      var row=e.target.closest('[data-rtoken]');
      if(row){
        riCloseMenus();
        reqState.sel=row.getAttribute('data-rtoken');
        riMarkSeen(reqState.sel);
        renderReqList();
      }
    });
    var detail=el('riDetail');
    if(detail) detail.addEventListener('click', function(e){
      var dlAll=e.target.closest('[data-rdlall]'); if(dlAll){ riDownloadAll(dlAll.getAttribute('data-rdlall')); return; }

        if(!e.target.closest('.ri-menu') && !e.target.closest('[data-rmenu]')) riCloseMenus();
      });
      wireReqInbox._docBound=true;

    if(!reqBC && window.KR && KR.listen){

    }

  function dsSet(){ return DS_TEXT[lang] || DS_TEXT.en; }

  function dsBits(v){
    var out=[];
    function add(x){
      if(Array.isArray(x)){ x.forEach(add); return; }
      if(x===null || x===undefined) return;
      var s=String(x).trim();
      if(s) out.push(s);
    }
    add(v);
    return out;
  }
  function normSearch(x){
    var str=String(x===null||x===undefined?'':x).toLowerCase();
    try{ str=str.normalize('NFKD').replace(/[\u0300-\u036f]/g,''); }catch(e){}
    return str.replace(/[\u200e\u200f]/g,' ').replace(/[\s\-_.,:;\/\\()\[\]{}]+/g,' ').trim();
  }
  function dsFileIcon(kind){
    kind=String(kind||'').toLowerCase();
    if(kind==='audio') return 'music';
    if(kind==='video') return 'film';
    if(kind==='image' || kind==='images') return 'camera';
    return 'files';
  }
  function dsPush(out,o){
    var title=String(o.title||'').trim();
    if(!title) return null;
    var meta=dsBits(o.meta).slice(0,5);
    var item={
      type:o.type || 'file',
      icon:o.icon || 'search',
      title:title,
      meta:meta.join(' · '),
      href:o.href || '#',
      hay:normSearch(dsBits([title, meta, o.hay, o.id]).join(' ')),
      downloadType:o.downloadType || '',
      downloadId:o.downloadId || '',
      downloadName:o.downloadName || title
    };
    out.push(item);
    return item;
  }
  function buildGlobalSearchIndex(){
    var out=[], clientMap={};
    function addClient(name,email,phone,source,href,hay){
      var title=String(name||email||phone||'').trim();
      if(!title) return;
      var key=normSearch(email||phone||title);
      if(!key) return;
      if(clientMap[key]){
        clientMap[key].hay += ' '+normSearch(dsBits([source,hay]).join(' '));
        if(source && clientMap[key].meta.indexOf(source)<0) clientMap[key].meta += (clientMap[key].meta?' · ':'')+source;
        return;
      }
      clientMap[key]=dsPush(out,{
        type:'client', icon:'user', title:title,
        meta:[email, phone, source],
        href:href || 'dashboard#project-select',
        hay:[email, phone, source, hay]
      });
    }

    ensureProjectNumbers('select', loadProjects(), saveProjects).forEach(function(p){
      var href='dashboard#project-select';
      var numText=projectNumberText('select',p);
      dsPush(out,{
        type:'project', icon:'folder', title:p.name || p.id || dsType('project'),
        meta:[numText, p.client, projectStatusText(p.status||'draft'), (p.files||0)+' files', projectDate(p.updated)],
        href:href,
        hay:[p.id, p.name, p.client, p.email, p.phone, p.status, p.files, p.selected, p.sizeMB, p.updated, p.projectNumber, numText].concat(projectNumberHay('select',p))
      });
      addClient(p.client, p.email, p.phone, dsType('project'), href, [p.id, p.name, p.status, p.projectNumber, numText]);
    });

    var reqs=window.KR ? ensureProjectNumbers('receive', KR.loadRequests(), KR.saveRequests) : readOwnArray('kr_requests');
    reqs.forEach(function(r){
      var href='request?tab=manage';
      var subs=r.submissions||[];
      var files=r.files||[];
      var bytes=window.KR ? KR.reqBytes(r) : files.reduce(function(a,f){ return a+(Number(f.size)||0); },0);
      var first=subs[0]||{};
      var numText=projectNumberText('receive',r);
      dsPush(out,{
        type:'order', icon:'inbox', title:r.name || r.token || dsText('fileRequest'),
        meta:[numText, first.name, r.token?('#'+r.token):'', riStatusLabel(riStatus(r)), files.length+' files', fmtDashBytes(bytes)],
        href:href,

  // Live, real-time filtering of the visible project-card grid. Runs on every
  // keystroke (via updateDashboardSearchResults) alongside the global dropdown:
  // cards whose data-search haystack contains every typed word stay, the rest
  // are hidden instantly — no submit button, no reload. Empty query restores the
  // full grid. Also keeps the "N כרטיסי לקוח" count in sync and shows an inline
  // empty state when nothing matches the current text.
  function projCardHayMatch(hay, words){
    for(var i=0;i<words.length;i++){ if(hay.indexOf(words[i])<0) return false; }
    return true;
  }
  function applyProjectCardFilter(q){
    var host=el('main'); if(!host) return;
    var words=normSearch(q||'').split(/\s+/).filter(Boolean);
    var lists=host.querySelectorAll('.mpr-list');
    for(var li=0; li<lists.length; li++){
      var list=lists[li], cards=list.querySelectorAll('[data-proj-key]'), shown=0;
      for(var ci=0; ci<cards.length; ci++){
        var card=cards[ci];
        var match=!words.length || projCardHayMatch(card.getAttribute('data-search')||'', words);
        card.style.display=match?'':'none';
        if(match) shown++;
      }
      var section=list.closest('.mp-shell');
      if(section){
        var countEl=section.querySelector('.mp-section-title span');
        if(countEl) countEl.textContent=projCardsCountText(words.length?shown:cards.length);
      }
      var empty=list.querySelector('.mpr-empty');
      if(words.length && shown===0){
        if(!empty){ empty=document.createElement('div'); empty.className='mpr-empty'; list.appendChild(empty); }
        empty.textContent=dsText('noResults');
        empty.style.display='';
      } else if(empty){ empty.style.display='none'; }
    }
  }
  function updateDashboardSearchResults(){
    var root=el('dashSearch'), input=el('dashSearchInput'), box=el('dashSearchResults');
    if(!root || !input || !box) return;
    dashSearchState.q=input.value || '';
    var open=normSearch(dashSearchState.q).replace(/\s/g,'').length>=2 && dashSearchState.open;
    box.innerHTML=open ? dashSearchResultsHtml(dashSearchState.q) : '';
    root.classList.toggle('open', open);
    applyProjectCardFilter(dashSearchState.q);
  }
  function dsDownload(type,id,name){
    if(!id) return;
    if(type==='processed'){
      if(!window.KolkliProcessedFiles || !KolkliProcessedFiles.download){ riToast(pfText('missing')); return; }
      KolkliProcessedFiles.download(id).then(function(r){ if(!r || !r.ok) riToast(pfText('missing')); });
      return;
    }
    if(type==='request'){
      if(!window.KR || !KR.getBlob){ riToast(pfText('missing')); return; }
      KR.getBlob(id).then(function(blob){ if(blob) riTrigger(blob,name||'file'); else riToast(pfText('missing')); }, function(){ riToast(pfText('missing')); });
      return;
    }
    if(type==='review'){
      if(!window.RV || !RV.getBlob){ riToast(pfText('missing')); return; }
      RV.getBlob(id).then(function(blob){ if(blob) riTrigger(blob,name||'file'); else riToast(pfText('missing')); }, function(){ riToast(pfText('missing')); });
    }
  }
  function wireDashboardSearch(){
    var input=el('dashSearchInput'), root=el('dashSearch'), box=el('dashSearchResults');
    if(!input || !root || !box) return;
    input.value=dashSearchState.q || '';
    input.addEventListener('input', function(){ dashSearchState.open=true; updateDashboardSearchResults(); });
    input.addEventListener('focus', function(){ dashSearchState.open=true; updateDashboardSearchResults(); });
    var btn=el('dashSearchBtn');
    if(btn) btn.addEventListener('click', function(){ dashSearchState.open=true; input.focus(); updateDashboardSearchResults(); });
    input.addEventListener('keydown', function(e){
      if(e.key==='Escape'){ dashSearchState.open=false; root.classList.remove('open'); input.blur(); }
    });
    box.addEventListener('click', function(e){
      var dl=e.target.closest('[data-ds-download]');
      if(dl){
        e.preventDefault();
        dsDownload(dl.getAttribute('data-ds-download'), dl.getAttribute('data-ds-id'), dl.getAttribute('data-ds-name'));
        return;
      }
      if(e.target.closest('a')) dashSearchState.open=false;
    });
    if(!wireDashboardSearch._docBound){
      document.addEventListener('click', function(e){
        if(e.target.closest('#dashSearch')) return;
        dashSearchState.open=false;
        var r=el('dashSearch');
        if(r) r.classList.remove('open');
      });
      wireDashboardSearch._docBound=true;
    }
    updateDashboardSearchResults();
  }

  function wireSide(){
    el('side').addEventListener('click', function(e){
      var sideAcctBtn=e.target.closest('#sideAcctBtn');
      if(sideAcctBtn){
        e.preventDefault();
        e.stopPropagation();
        var wrap=el('sideAcct');
        if(wrap){
          var open=wrap.classList.toggle('open');
          sideAcctBtn.setAttribute('aria-expanded', open?'true':'false');
        }
        return;
      }
      var sideLangBtn=e.target.closest('#sideAcctLangBtn');
      if(sideLangBtn){
        e.preventDefault();
        e.stopPropagation();
        var lbox=el('sideAcctLang');
        if(lbox){
          var lopen=lbox.classList.toggle('open');
          sideLangBtn.setAttribute('aria-expanded', lopen?'true':'false');
        }
        return;
      }
      var setLangBtn=e.target.closest('[data-setlang]');
      if(setLangBtn){
        e.preventDefault();
        e.stopPropagation();
        applyLang(setLangBtn.getAttribute('data-setlang'));   // re-renders the rail in the new language
        return;
      }
      var sideLogout=e.target.closest('[data-side-logout]');
      if(sideLogout){
        closeSideAccountMenu();
        if(confirm(t.logoutConfirm)){ lsDel(SESSION_KEY); location.href='./'; }
        return;
      }
      var dashView=e.target.closest('[data-dash-view]');
      if(dashView){
        closeSideAccountMenu();
        selectView(dashView.getAttribute('data-dash-view'));
        return;
      }
      var settingsTog=e.target.closest('[data-settings-toggle]');
      if(settingsTog){
        // The gear ("הגדרות חשבון") opens the standalone settings page, which holds
        // everything that used to live in the inline profile submenu.
        location.href='account-settings';
        return;
      }
      var tog=e.target.closest('[data-cattoggle]');
      if(tog){
        var id=tog.getAttribute('data-cattoggle');
        var cat=NAV.find(function(c){ return c.id===id; });
        cat.open=!cat.open;
        renderSide();
        return;
      }
      // rename a sidebar label — must run before the data-view (navigate) check
      var editBtn=e.target.closest('[data-editlabel]');
      if(editBtn){ editingLabel=editBtn.getAttribute('data-editlabel'); renderSide(); focusLabelInput(); return; }
      var saveBtn=e.target.closest('[data-savelabel]');
      if(saveBtn){ commitLabel(saveBtn.getAttribute('data-savelabel')); return; }
      if(e.target.closest('.lbl-input')) return; // clicks inside the input shouldn't navigate
      var addProject=e.target.closest('#sideNewProject');
      if(addProject){ location.href='files?new=1'; return; }
      var addNav=e.target.closest('[data-add-href]');
      if(addNav){ location.href=addNav.getAttribute('data-add-href'); return; }
      var addView=e.target.closest('[data-add-view]');
      if(addView){ focusInvite=true; selectView(addView.getAttribute('data-add-view')); return; }
      var project=e.target.closest('[data-project]');
      if(project){ activeProjectId=project.getAttribute('data-project'); selectView('my-files'); return; }
      var item=e.target.closest('[data-view]');
      if(item){
        if(item.getAttribute('data-view')==='my-files') activeProjectId=null;
        selectView(item.getAttribute('data-view'));
        return;
      }
      var upg=e.target.closest('#sideUpg');
      if(upg){ location.href='pricing/'; }
    });
    el('side').addEventListener('keydown', function(e){
      var inp=e.target.closest('[data-label-input]');
      if(!inp) return;
      if(e.key==='Enter'){ e.preventDefault(); commitLabel(inp.getAttribute('data-label-input')); }
      else if(e.key==='Escape'){ e.preventDefault(); editingLabel=null; renderSide(); }
    });
    if(!wireSide._docBound){
      document.addEventListener('click', function(e){
        var w=el('sideAcct');
        if(w && w.classList.contains('open') && !w.contains(e.target)) closeSideAccountMenu();
      });
      document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSideAccountMenu(); });
      wireSide._docBound=true;
    }
  }

        if(!ids.length) return;
        var copy=ids.length===1 ? (function(){
          var all=KolkliProcessedFiles.list ? KolkliProcessedFiles.list({category:'all'}) : [];
          var rec=all.filter(function(r){ return r.id===ids[0]; })[0];
          return pfDeleteDialogText(rec ? rec.name : '');
        })() : pfBulkDeleteDialogText(ids.length);
        kConfirm({
          title:copy.title,
          body:copy.body,
          ok:copy.ok,
          cancel:copy.cancel,
          danger:true,
          onOk:function(){
            ids.forEach(function(id){ pfWaveStopIf(id); KolkliProcessedFiles.remove(id); });
            pfClearSelection(kind);
            riToast(ids.length===1 ? pfText('removed') : pfMultiText('removed',ids.length));
            renderMain();
          }
        });
      });
    });
    host.querySelectorAll('[data-pf-download]').forEach(function(b){
      b.addEventListener('click', function(){
        if(!window.KolkliProcessedFiles || !KolkliProcessedFiles.download){ riToast(pfText('missing')); return; }
        KolkliProcessedFiles.download(b.getAttribute('data-pf-download')).then(function(r){
          if(!r || !r.ok) riToast(pfText('missing'));
        });
      });
    });
    host.querySelectorAll('[data-pf-remove]').forEach(function(b){
      b.addEventListener('click', function(){
        if(!window.KolkliProcessedFiles || !KolkliProcessedFiles.remove) return;
        var card=b.closest('.pf-item');
        var nameEl=card ? card.querySelector('.pf-name') : null;
        var copy=pfDeleteDialogText(nameEl ? nameEl.textContent : '');
        kConfirm({
          title:copy.title,
          body:copy.body,
          ok:copy.ok,
          cancel:copy.cancel,
          danger:true,
          onOk:function(){
            var rid=b.getAttribute('data-pf-remove');
            pfWaveStopIf(rid);
            KolkliProcessedFiles.remove(rid);
            riToast(pfText('removed'));
          }
        });
      });
    });
    // ---- media-card: real playback (play/pause), waveform scrub/seek, keyboard ----
    pfWireTransport(host);
    // Draw a real waveform per media card by decoding its stored audio. Done lazily
    // as cards scroll into view so a large library doesn't decode everything at once.
    pfWireWaveforms(host);
    host.querySelectorAll('[data-pf-share]').forEach(function(b){
      b.addEventListener('click', function(){ pfShareDialog(pfFindRec(b.getAttribute('data-pf-share'))); });
    });
    host.querySelectorAll('[data-pf-copy]').forEach(function(b){
      b.addEventListener('click', function(){
        var rec=pfFindRec(b.getAttribute('data-pf-copy'));
        if(rec) pfCopyText(pfShareLink(rec));
        pfCloseMenus();
      });
    });
    host.querySelectorAll('[data-pf-menu]').forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        var menu=host.querySelector('.pf-menu[data-pf-menu-for="'+b.getAttribute('data-pf-menu')+'"]');
        var wasOpen=menu && menu.classList.contains('open');
        pfCloseMenus();
        if(menu && !wasOpen){ menu.classList.add('open'); b.setAttribute('aria-expanded','true'); }
      });
    });
    // one document-level listener closes any open card menu on an outside click
    if(!window.__pfMenuDocBound){
      window.__pfMenuDocBound=true;
      document.addEventListener('click', function(e){
        if(e.target && e.target.closest && (e.target.closest('.pf-menu') || e.target.closest('.pf-kebab'))) return;
        pfCloseMenus();
      });
    }
    host.querySelectorAll('[data-new-project]').forEach(function(b){
      b.addEventListener('click', function(){ location.href='files?new=1'; });
    });
    // account header: change / remove profile picture
    var avBtn=el('avatarBtn'), avFile=el('avatarFile'), avRem=el('avatarRemove');
    if(avBtn && avFile){
      avBtn.addEventListener('click', function(){ avFile.click(); });
      avFile.addEventListener('change', function(){ readAvatarFile(avFile.files && avFile.files[0]); });
    }
    if(avRem) avRem.addEventListener('click', function(){
      delete user.avatar; persistUser(); render();
    });
    // settings: language
    host.querySelectorAll('[data-setlang]').forEach(function(b){
      b.addEventListener('click', function(){ applyLang(b.getAttribute('data-setlang')); lsSet('ac_lang', b.getAttribute('data-setlang')); });
    });
    // settings: theme
    host.querySelectorAll('[data-settheme]').forEach(function(b){
      b.addEventListener('click', function(){ applyTheme(b.getAttribute('data-settheme')); render(); });
    });
    // settings: toggles
    host.querySelectorAll('[data-toggle]').forEach(function(b){
      b.addEventListener('click', function(){
        var k=b.getAttribute('data-toggle'); notif[k]=!notif[k]; lsSetOwn(NOTIF_KEY, JSON.stringify(notif));
        b.classList.toggle('on', notif[k]);
      });
    });
    // details: save
    var save=el('saveDetails');
    if(save) save.addEventListener('click', function(){
      var nm=el('dName').value.trim();
      if(!isGuest){
        var users=loadUsers(), i=users.findIndex(function(x){ return x.email===user.email; });
        if(i>-1){ users[i].name=nm; saveUsers(users); user=users[i]; }
      }
      var m=el('savedMsg'); if(m){ m.classList.add('show'); setTimeout(function(){ m.classList.remove('show'); }, 1800); }
      renderDashTop();
      renderSide();
    });
    // settings: logout / delete
    var lo=el('doLogout');
    if(lo) lo.addEventListener('click', function(){
      if(confirm(t.logoutConfirm)){ lsDel(SESSION_KEY); location.href='./'; }
    });
    var del=el('doDelete');
    if(del) del.addEventListener('click', function(){
      if(confirm(t.delConfirm)){
        var users=loadUsers().filter(function(x){ return x.email!==user.email; });
        saveUsers(users); lsDel(SESSION_KEY); location.href='./';
      }
    });
    var addc=el('addCard');
    if(addc) addc.addEventListener('click', function(){ location.href='pricing/'; });
    // billing: Stripe checkout / portal (falls back to pricing/ if unconfigured)
    host.querySelectorAll('[data-billing-checkout]').forEach(function(b){
      b.addEventListener('click', function(){ billingCheckout(b.getAttribute('data-billing-checkout')); });
    });
    var bportal=host.querySelector('[data-billing-portal]');
    if(bportal) bportal.addEventListener('click', function(){ billingPortal(); });
    // team view loads its data (Supabase / demo) after the shell renders
    if(view==='team') loadTeam();
    // request inbox binds its list/detail interactions after the shell renders
    if(view==='my-requests') wireReqInbox();
  }

  /* =====================================================
     Language + theme (header owns the picker → __setLang)
     ===================================================== */
  function applyLang(l){
    if(!I18N[l]) l='he';
    lang=l; t=I18N[l];
    document.documentElement.lang=l;
    document.documentElement.dir=(l==='he')?'rtl':'ltr';
    try{ localStorage.setItem('ac_lang', l); }catch(e){}
    el('mMenuTx').textContent=t.menu;
    el('dfoot').textContent=t.footer;
    render();
  }
  window.__setLang=applyLang;

  function detectLang(){
    var c=lsGet('ac_lang'); if(c) return c;
    var cc=lsGet('ac_country'); if(cc) return cc==='IL'?'he':'en';
    var tz=''; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(e){}
    var navHe=(navigator.language||'').toLowerCase().indexOf('he')===0;
    return (tz==='Asia/Jerusalem'||navHe)?'he':'en';
  }
  function applyTheme(th){
    var dark=(th==='dark');
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
    var ti=el('themeIco'); if(ti) ti.textContent=dark?'☀️':'🌙';
    try{ localStorage.setItem('theme', dark?'dark':'light'); }catch(e){}
  }

  /* =====================================================
     Init
     ===================================================== */
  // Deep-links open dashboard views; legacy #settings redirects to the standalone
  // account-settings page so settings stay separate from the file workspace.
  function viewFromHash(){
    var h=(location.hash||'').replace(/^#/,'');
    if(!h) return null;
    if(PROJECT_VIEW[h]) return h;
    if(VIEWS[h]) return h;
    return NAV.some(function(c){ return c.items.some(function(it){ return it.id===h; }); }) ? h : null;
  }

  if((location.hash||'').replace(/^#/,'')==='settings'){
    location.replace('account-settings');
    return;
  }

  window.addEventListener('storage', function(e){
    if(!e || !e.key || e.key.indexOf(FAV_BASE_KEY+'::')!==0) return;
    if(view==='favorites') renderMain();
    else favSyncButtons();
    renderSide();
  });

  // The embedded text-tools workspace (viewTextTools) posts its content height so the
  // iframe grows to fit — no inner scrollbar, one natural page scroll.
  window.addEventListener('message', function(e){
    if(!e || !e.data || e.data.type!=='kolkli-tt-height') return;
    var f=document.getElementById('ttEmbedFrame');
    if(f && e.source===f.contentWindow && e.data.height){ f.style.height=Math.max(360, e.data.height)+'px'; }
  });

  applyTheme(lsGet('theme')||'light');
  loadUser();
  // Invite deep-link: dashboard.html#join=TOKEN → accept it, then open Team.
  (function handleJoin(){
    var m=(location.hash||'').match(/^#join=([A-Za-z0-9\-]+)/);
    if(!m) return;
    var token=m[1];
    try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
    if(window.KolkliAuth && window.KolkliAuth.configured()){
      Team.acceptInvite(token).then(function(r){
        if(r.ok){ selectView('team'); }
        else { alert(tt().joinFail+(r.message?(': '+r.message):'')); }
      });
    } else {
      alert(tt().joinDemo);
    }
  })();
  var hv=viewFromHash(); if(hv) view=hv;
  window.addEventListener('hashchange', function(){ var v=viewFromHash(); if(v) selectView(v); });
  // auth-store.js loads async and fires kolkli:auth once the Supabase session
  // is synced. Re-render then so the account + billing buttons reflect the
  // real signed-in state (guarded to the session actually changing, so a
  // periodic token refresh doesn't wipe a form the user is filling in).
  window.addEventListener('kolkli:auth', function(){
    var before = user && user.email;
    loadUser();
    if((user && user.email) !== before) render();
  });
  window.addEventListener('kolkli:processed-files', function(){
    if(/^my-(audio|video|images|docs)$/.test(view)) renderMain();
  });
  wireSide();
  el('mMenuBtn').addEventListener('click', openDrawer);
  el('sideScrim').addEventListener('click', closeDrawer);
  var tb=el('themeToggle'); if(tb) tb.addEventListener('click', function(){
    applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'); render();
  });
  applyLang(detectLang());
})();
</script>
</body>
</html>
