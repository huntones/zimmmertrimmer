<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOLKLI — מחולל Placeholder</title>
<link rel="canonical" href="https://kolkli.com/placeholder-generator">
<meta name="description" content="Free placeholder image generator. Set any width and height, pick background and text colors, choose a pattern (grid, diagonal, cross, checkerboard) and add text, then download as PNG, JPG or WEBP or copy the data URI. Fast, simple and professional-quality.">
<style>
  :root {
    --bg:#eef0f6; --panel:#ffffff; --panel-2:#f5f6fa; --line:#e5e8f0; --line-2:#eef0f6;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#7c3aed; --accent-dim:#6a2fe0; --accent-ink:#ffffff; --accent-soft:#efe9fe;
    --success:#22b04b; --success-dim:#1c9a41; --success-soft:#e6f6ec;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --danger:#e5484d; --danger-soft:#fdecec;
    --warm-soft:#fff5da; --warm-line:#f2d98a;
    --ok:#22b04b; --warn:#c88a04; --err:#e5484d;
    --grad:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn-glow:rgba(59,111,246,0.38);
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-lg:0 2px 6px rgba(20,24,44,0.05), 0 20px 50px rgba(20,24,44,0.10);
    --shadow-sm:0 1px 2px rgba(20,24,44,0.05);
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --sans:'Overpass','Rubik',system-ui,'Segoe UI',sans-serif;
  }
  html[data-theme="dark"] {
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a303c; --line-2:#232833;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --accent:#a06bff; --accent-dim:#7c3aed; --accent-ink:#ffffff; --accent-soft:#241a3a;
    --success:#37c26a; --success-dim:#2fae5e; --success-soft:#132a1c;
    --info:#5b95f8; --info-dim:#4f8ef7; --info-soft:#182338;
    --danger:#ff6b6b; --danger-soft:#2a1719;
    --warm-soft:#2c2718; --warm-line:#5a4d24;
    --ok:#4ec98a; --warn:#e8b84b; --err:#ff6b6b;
    --grad:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn-glow:rgba(77,123,255,0.45);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,0.45), 0 24px 60px rgba(0,0,0,0.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;}
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:var(--grad);z-index:100;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--sans);}
  .wrap{width:100%;max-width:none;margin:0 auto;padding:26px 20px 64px;}

  /* page intro */
  .pagehead{margin:4px 0 22px;}
  .pagehead h1{font-size:clamp(23px,3vw,32px);font-weight:700;letter-spacing:-0.02em;margin:0 0 8px;}
  .pagehead .kick{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);
    padding:4px 11px;border-radius:999px;margin-bottom:12px;}
  .pagehead p{font-size:14.5px;color:var(--muted);margin:0;max-width:70ch;}

  /* reused helpers (from box-shadow.html / color-convert.html) */
  .gbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--ink-2);font-size:13px;font-weight:600;padding:10px 12px;border-radius:11px;
    cursor:pointer;transition:all .12s;}
  .gbtn:hover{border-color:var(--accent);color:var(--accent-dim);background:var(--accent-soft);}
  .gbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .gbtn.hidden{display:none;}
  .copybtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);
    color:var(--muted);font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:9px;cursor:pointer;transition:all .12s;}
  .copybtn:hover{border-color:var(--accent);color:var(--accent-dim);background:var(--accent-soft);}
  .copybtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .fstr{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ink);background:var(--panel-2);
    border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;margin-bottom:12px;overflow-x:auto;white-space:nowrap;
    direction:ltr;text-align:start;}
  .numwrap{display:inline-flex;align-items:center;gap:5px;direction:ltr;}
  .numin{width:58px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:9px;
    font-family:var(--mono);font-size:13px;font-weight:600;text-align:center;padding:6px 4px;transition:border-color .12s,box-shadow .12s;}
  .numin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .numin::-webkit-outer-spin-button,.numin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .unit{font-family:var(--mono);font-size:12px;color:var(--faint);}

  /* ---- placeholder generator tool ---- */
  .tool{display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start;}
  @media (max-width:820px){ .tool{grid-template-columns:1fr;} }
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);}
  .setcard{padding:18px;}
  .pvcard{padding:18px;}

  .cardtitle{font-size:13px;font-weight:800;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;margin-bottom:14px;}

  /* form fields */
  .field{margin-bottom:15px;}
  .field:last-child{margin-bottom:0;}
  .flabel{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:7px;}

  /* dimensions */
  .dimrow{display:flex;align-items:center;gap:9px;}
  .dimwrap{flex:1;min-width:0;}
  .dimwrap .numin{flex:1;width:auto;min-width:0;text-align:start;padding-inline:11px;font-size:14px;}
  .dimx{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--faint);}

  /* preset chips */
  .presets{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--muted);background:var(--panel-2);
    border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer;transition:all .12s;direction:ltr;}
  .chip:hover{border-color:var(--accent);color:var(--accent-dim);background:var(--accent-soft);}
  .chip.active{border-color:var(--accent);color:var(--accent-ink);background:var(--accent);}

  /* color rows */
  .colorrow{display:flex;align-items:center;gap:8px;}
  .swatch{width:40px;height:36px;padding:0;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);
    cursor:pointer;flex-shrink:0;}
  .swatch::-webkit-color-swatch-wrapper{padding:3px;}
  .swatch::-webkit-color-swatch{border:none;border-radius:6px;}
  .swatch::-moz-color-swatch{border:none;border-radius:6px;}
  .hexin{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:9px;
    font-family:var(--mono);font-size:13px;font-weight:600;padding:9px 11px;text-transform:uppercase;
    direction:ltr;unicode-bidi:isolate;text-align:start;transition:border-color .12s,box-shadow .12s;}
  .hexin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}

  /* text + selects */
  .txtin{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:9px;
    font-family:var(--sans);font-size:13.5px;padding:9px 11px;transition:border-color .12s,box-shadow .12s;}
  .txtin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .tworow{display:flex;gap:10px;}
  .tworow .field{flex:1;margin-bottom:0;}
  .selin{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:9px;
    font-family:var(--sans);font-size:13.5px;font-weight:600;padding:9px 11px;cursor:pointer;
    -webkit-appearance:none;appearance:none;transition:border-color .12s,box-shadow .12s;}
  .selin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}

  .divider{height:1px;background:var(--line);margin:16px 0;border:0;}

  /* download button (gradient) */
  .dlbtn{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;
    background:var(--grad-btn);color:#fff;font-family:var(--sans);font-size:14px;font-weight:700;padding:12px 14px;
    border-radius:12px;cursor:pointer;box-shadow:0 6px 18px var(--grad-btn-glow);
    transition:transform .12s,box-shadow .12s,filter .12s;}
  .dlbtn:hover{filter:brightness(1.05);box-shadow:0 8px 22px var(--grad-btn-glow);}
  .dlbtn:active{transform:translateY(1px);}
  .dlbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  /* preview */
  .pvhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .pvhead .cardtitle{margin-bottom:0;}
  .dimlabel{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent-dim);background:var(--accent-soft);
    padding:4px 11px;border-radius:999px;direction:ltr;unicode-bidi:isolate;}
  .canvasbox{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;align-items:center;
    justify-content:center;min-height:220px;overflow:hidden;background-color:var(--panel-2);
    background-image:linear-gradient(45deg,var(--line-2) 25%,transparent 25%),
      linear-gradient(-45deg,var(--line-2) 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,var(--line-2) 75%),
      linear-gradient(-45deg,transparent 75%,var(--line-2) 75%);
    background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0;}
  #pvCanvas{max-width:100%;height:auto;border-radius:4px;box-shadow:var(--shadow-sm);display:block;}
  .pvactions{display:flex;gap:9px;margin-top:14px;}
  .pvactions .gbtn{flex:1;}

  .note{display:flex;align-items:flex-start;gap:9px;margin-top:18px;padding:12px 14px;border-radius:12px;
    background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);
    font-size:12px;color:var(--ink-2);line-height:1.55;}
  .note svg{width:16px;height:16px;color:var(--accent-dim);flex-shrink:0;margin-top:1px;
    stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  footer{margin-top:34px;text-align:center;color:var(--faint);font-size:12px;font-family:var(--mono);}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:11px 18px;border-radius:999px;
    box-shadow:var(--shadow-lg);transition:opacity .2s,transform .2s;z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
<link rel="stylesheet" href="./header.css">
</head>
<body>
<div id="site-header"></div>
<script src="./header.js"></script>
<div class="wrap">

  <div class="pagehead">
    <span class="kick" data-i18n="kick"></span>
    <h1 data-i18n="pageTitle"></h1>
    <p data-i18n="pageSub"></p>
  </div>

  <div class="tool">
    <!-- settings -->
    <div class="card setcard">
      <div class="cardtitle" data-i18n="settingsTitle"></div>

      <div class="field">
        <label class="flabel" data-i18n="sizeLabel"></label>
        <div class="dimrow">
          <span class="numwrap dimwrap"><input type="number" id="wIn" class="numin" value="1080" min="1" max="5000" step="1" aria-label="width"><span class="unit">px</span></span>
          <span class="dimx">×</span>
          <span class="numwrap dimwrap"><input type="number" id="hIn" class="numin" value="720" min="1" max="5000" step="1" aria-label="height"><span class="unit">px</span></span>
        </div>
      </div>

      <div class="field">
        <label class="flabel" data-i18n="presetLabel"></label>
        <div class="presets" id="presets"></div>
      </div>

      <hr class="divider">

      <div class="field">
        <label class="flabel" data-i18n="bgLabel"></label>
        <div class="colorrow">
          <input type="color" id="bgColor" class="swatch" value="#3f85ff" aria-label="background color">
          <input type="text" id="bgHex" class="hexin" value="#3F85FF" spellcheck="false" maxlength="7" aria-label="background hex">
        </div>
      </div>

      <div class="field">
        <label class="flabel" data-i18n="fgLabel"></label>
        <div class="colorrow">
          <input type="color" id="fgColor" class="swatch" value="#ffffff" aria-label="text color">
          <input type="text" id="fgHex" class="hexin" value="#FFFFFF" spellcheck="false" maxlength="7" aria-label="text hex">
        </div>
      </div>

      <div class="field">
        <label class="flabel" data-i18n="textLabel"></label>
        <input type="text" id="txtIn" class="txtin" spellcheck="false" aria-label="custom text">
      </div>

      <div class="tworow">
        <div class="field">
          <label class="flabel" data-i18n="patternLabel"></label>
          <select id="patSel" class="selin">
            <option value="solid" data-i18n="patSolid"></option>
            <option value="grid" data-i18n="patGrid"></option>
            <option value="diagonal" data-i18n="patDiagonal"></option>
            <option value="cross" data-i18n="patCross"></option>
            <option value="checker" data-i18n="patChecker"></option>
          </select>
        </div>
        <div class="field">
          <label class="flabel" data-i18n="formatLabel"></label>
          <select id="fmtSel" class="selin">
            <option value="png">PNG</option>
            <option value="jpg">JPG</option>
            <option value="webp">WEBP</option>
          </select>
        </div>
      </div>

      <hr class="divider">

      <button class="dlbtn" id="dlBtn" type="button">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        <span data-i18n="download"></span>
      </button>
    </div>

    <!-- preview -->
    <div class="card pvcard">
      <div class="pvhead">
        <div class="cardtitle" data-i18n="previewTitle"></div>
        <span class="dimlabel" id="dimLabel">1080 × 720</span>
      </div>
      <div class="canvasbox">
        <canvas id="pvCanvas" width="1080" height="720"></canvas>
      </div>
      <div class="pvactions">
        <button class="gbtn" id="copyUriBtn" type="button">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span data-i18n="copyUri"></span>
        </button>
        <button class="gbtn" id="copyImgBtn" type="button">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
          <span data-i18n="copyImg"></span>
        </button>
      </div>

      <div class="note">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        <span data-i18n="note"></span>
      </div>
    </div>
  </div>

  <footer data-i18n="foot"></footer>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const el = id => document.getElementById(id);

  const I18N = {
    he:{ dir:'rtl',
      kick:'מחולל תמונות Placeholder',
      pageTitle:'מחולל תמונות Placeholder — בכל מידה, צבע ותבנית',
      pageSub:'בחרו רוחב וגובה, צבע רקע וטקסט, תבנית ופורמט — וקבלו תמונת פלייסהולדר מוכנה להורדה כ-PNG, JPG או WEBP, או העתיקו את ה-data URI. מהיר, פשוט ובאיכות מקצועית.',
      settingsTitle:'הגדרות', previewTitle:'תצוגה מקדימה',
      sizeLabel:'מידות (רוחב × גובה)', presetLabel:'מידות מוכנות',
      bgLabel:'צבע רקע', fgLabel:'צבע טקסט', textLabel:'טקסט מותאם (רשות)', textPh:'ריק = הצגת המידות',
      patternLabel:'תבנית', formatLabel:'פורמט',
      patSolid:'מלא', patGrid:'רשת', patDiagonal:'קווים אלכסוניים', patCross:'צלב אלכסוני', patChecker:'לוח שחמט',
      download:'הורדת התמונה', copyUri:'העתקת data URI', copyImg:'העתקת תגית <img>',
      copy:'העתקה', copiedMsg:'הועתק ✓', downloadedMsg:'התמונה הורדה ✓', clampedMsg:'המידה הוגבלה ל-5000px',
      note:'מהיר, פשוט ובאיכות מקצועית.',
      foot:'KOLKLI · מחולל תמונות Placeholder · מהיר, פשוט ובאיכות מקצועית' },
    en:{ dir:'ltr',
      kick:'Placeholder Image Generator',
      pageTitle:'Placeholder Image Generator — any size, color & pattern',
      pageSub:'Pick a width and height, background and text colors, a pattern and a format — and get a ready placeholder image to download as PNG, JPG or WEBP, or copy its data URI. Fast, simple and professional-quality.',
      settingsTitle:'Settings', previewTitle:'Preview',
      sizeLabel:'Size (width × height)', presetLabel:'Preset sizes',
      bgLabel:'Background color', fgLabel:'Text color', textLabel:'Custom text (optional)', textPh:'Empty = show dimensions',
      patternLabel:'Pattern', formatLabel:'Format',
      patSolid:'Solid', patGrid:'Grid', patDiagonal:'Diagonal lines', patCross:'Cross', patChecker:'Checkerboard',
      download:'Download image', copyUri:'Copy data URI', copyImg:'Copy <img> tag',
      copy:'Copy', copiedMsg:'Copied ✓', downloadedMsg:'Image downloaded ✓', clampedMsg:'Size capped at 5000px',
      note:'Fast, simple and professional-quality.',
      foot:'KOLKLI · Placeholder Image Generator · Fast, simple and professional quality' },
    ru:{ dir:'ltr',
      kick:'Генератор изображений-заглушек',
      pageTitle:'Генератор заглушек — любой размер, цвет и узор',
      pageSub:'Выберите ширину и высоту, цвета фона и текста, узор и формат — и получите готовое изображение-заглушку для скачивания в PNG, JPG или WEBP, либо скопируйте data URI. Быстро, просто и профессионального качества.',
      settingsTitle:'Настройки', previewTitle:'Предпросмотр',
      sizeLabel:'Размер (ширина × высота)', presetLabel:'Готовые размеры',
      bgLabel:'Цвет фона', fgLabel:'Цвет текста', textLabel:'Свой текст (необязательно)', textPh:'Пусто = показать размеры',
      patternLabel:'Узор', formatLabel:'Формат',
      patSolid:'Сплошной', patGrid:'Сетка', patDiagonal:'Диагональные линии', patCross:'Крест', patChecker:'Шахматный',
      download:'Скачать изображение', copyUri:'Копировать data URI', copyImg:'Копировать тег <img>',
      copy:'Копировать', copiedMsg:'Скопировано ✓', downloadedMsg:'Изображение скачано ✓', clampedMsg:'Размер ограничен 5000px',
      note:'Быстро, просто и профессионального качества.',
      foot:'KOLKLI · Генератор изображений-заглушек · Быстро, просто и профессионального качества' }
  };

  // ---- tool constants ----
  const MAXDIM = 5000;
  const PRESETS = [
    [1080,1080],[1080,1350],[1920,1080],[1200,630],[800,600],
    [600,400],[300,250],[728,90],[400,400]
  ];
  const FMT = {
    png:{ mime:'image/png',  ext:'png',  q:undefined },
    jpg:{ mime:'image/jpeg', ext:'jpg',  q:0.92 },
    webp:{ mime:'image/webp', ext:'webp', q:0.92 }
  };

  let lang='he', t=I18N.he;

  const canvas = el('pvCanvas');
  const ctx = canvas.getContext('2d');

  // ---- helpers ----
  function clampDim(v,def){
    v=Math.round(parseFloat(v));
    if(!isFinite(v)||v<1) return def;
    return v;
  }
  function normHex(v){
    v=(v||'').trim();
    if(v && v[0]!=='#') v='#'+v;
    if(/^#[0-9a-fA-F]{3}$/.test(v)){ v='#'+v[1]+v[1]+v[2]+v[2]+v[3]+v[3]; }
    return /^#[0-9a-fA-F]{6}$/.test(v) ? v.toUpperCase() : null;
  }
  function hexA(hex, alpha){
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    return 'rgba('+r+','+g+','+b+','+alpha+')';
  }
  function fmtConf(){ return FMT[el('fmtSel').value] || FMT.png; }

  function readState(){
    let w=clampDim(el('wIn').value,1080);
    let h=clampDim(el('hIn').value,720);
    let clamped=false;
    if(w>MAXDIM){ w=MAXDIM; clamped=true; }
    if(h>MAXDIM){ h=MAXDIM; clamped=true; }
    return { w:w, h:h, clamped:clamped,
      bg:el('bgColor').value, fg:el('fgColor').value,
      text:el('txtIn').value, pat:el('patSel').value };
  }

  function buildPresets(){
    el('presets').innerHTML = PRESETS.map(function(p){
      return '<button type="button" class="chip" data-w="'+p[0]+'" data-h="'+p[1]+'">'+p[0]+'×'+p[1]+'</button>';
    }).join('');
    el('presets').querySelectorAll('.chip').forEach(function(c){
      c.addEventListener('click',function(){
        el('wIn').value=c.dataset.w; el('hIn').value=c.dataset.h; render();
      });
    });
  }
  function markPreset(w,h){
    el('presets').querySelectorAll('.chip').forEach(function(c){
      c.classList.toggle('active', (+c.dataset.w===w && +c.dataset.h===h));
    });
  }

  // ---- draw ----
  function drawPlaceholder(s){
    const w=s.w, h=s.h;
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle=s.bg;
    ctx.fillRect(0,0,w,h);

    const faded=hexA(s.fg,0.16);
    const line=hexA(s.fg,0.30);
    const unit=Math.max(16, Math.round(Math.min(w,h)/12));

    if(s.pat==='grid'){
      ctx.strokeStyle=faded; ctx.lineWidth=Math.max(1,Math.round(Math.min(w,h)/450));
      for(let x=unit;x<w;x+=unit){ ctx.beginPath(); ctx.moveTo(x+0.5,0); ctx.lineTo(x+0.5,h); ctx.stroke(); }
      for(let y=unit;y<h;y+=unit){ ctx.beginPath(); ctx.moveTo(0,y+0.5); ctx.lineTo(w,y+0.5); ctx.stroke(); }
    } else if(s.pat==='diagonal'){
      ctx.strokeStyle=faded; ctx.lineWidth=Math.max(6,Math.round(unit/2));
      const step=unit*1.5;
      ctx.beginPath();
      for(let d=-h; d<w; d+=step){ ctx.moveTo(d,0); ctx.lineTo(d+h,h); }
      ctx.stroke();
    } else if(s.pat==='cross'){
      const bw=Math.max(2,Math.round(Math.min(w,h)/110));
      ctx.strokeStyle=line; ctx.lineWidth=bw;
      ctx.strokeRect(bw/2,bw/2,w-bw,h-bw);
      ctx.beginPath();
      ctx.moveTo(0,0); ctx.lineTo(w,h);
      ctx.moveTo(w,0); ctx.lineTo(0,h);
      ctx.stroke();
    } else if(s.pat==='checker'){
      const sq=unit;
      ctx.fillStyle=hexA(s.fg,0.11);
      for(let y=0,ry=0; y<h; y+=sq,ry++){
        for(let x=0,rx=0; x<w; x+=sq,rx++){
          if((rx+ry)%2===0) ctx.fillRect(x,y,sq,sq);
        }
      }
    }
    // solid: background only

    // centered label (custom text or dimensions)
    const label = (s.text && s.text.trim()) ? s.text.trim() : (w+' × '+h);
    let fs=Math.min(w,h)/8;
    fs=Math.max(14, Math.min(fs, 260));
    ctx.fillStyle=s.fg;
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.font='700 '+fs+"px 'Overpass', system-ui, 'Segoe UI', sans-serif";
    let guard=0;
    while(ctx.measureText(label).width > w*0.86 && fs>10 && guard<40){
      fs*=0.92; guard++;
      ctx.font='700 '+fs+"px 'Overpass', system-ui, 'Segoe UI', sans-serif";
    }
    ctx.fillText(label, w/2, h/2);
  }

  function render(){
    const s=readState();
    canvas.width=s.w; canvas.height=s.h;
    const dl=el('dimLabel'); if(dl) dl.textContent=s.w+' × '+s.h;
    drawPlaceholder(s);
    markPreset(s.w,s.h);
    if(s.clamped) toast(t.clampedMsg);
  }

  function syncPh(){ const e=el('txtIn'); if(e) e.placeholder=t.textPh; }

  // ---- download / copy ----
  function triggerDownload(url,name){
    const a=document.createElement('a'); a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast(t.downloadedMsg);
  }
  function download(){
    render();
    const s=readState(), conf=fmtConf();
    const name='placeholder-'+s.w+'x'+s.h+'.'+conf.ext;
    if(canvas.toBlob){
      canvas.toBlob(function(blob){
        if(!blob){ triggerDownload(canvas.toDataURL(conf.mime, conf.q), name); return; }
        const url=URL.createObjectURL(blob);
        triggerDownload(url,name);
        setTimeout(()=>URL.revokeObjectURL(url), 4000);
      }, conf.mime, conf.q);
    } else {
      triggerDownload(canvas.toDataURL(conf.mime, conf.q), name);
    }
  }

  // ---- toast + copy ----
  function toast(msg){ const e=el('toast'); e.textContent=msg; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),1700); }
  function copy(text){
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).catch(fallbackCopy.bind(null,text)); }
    else fallbackCopy(text);
    toast(t.copiedMsg);
  }
  function fallbackCopy(text){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(_){} document.body.removeChild(ta);
  }

  // ---- events ----
  function bindColor(colorId, hexId){
    const c=el(colorId), h=el(hexId);
    c.addEventListener('input',function(){ h.value=c.value.toUpperCase(); render(); });
    h.addEventListener('input',function(){ const n=normHex(h.value); if(n){ c.value=n; render(); } });
    h.addEventListener('blur',function(){
      const n=normHex(h.value);
      if(n){ c.value=n; h.value=n; } else { h.value=c.value.toUpperCase(); }
      render();
    });
  }
  bindColor('bgColor','bgHex');
  bindColor('fgColor','fgHex');

  [['wIn',1080],['hIn',720]].forEach(function(pair){
    const id=pair[0], def=pair[1];
    el(id).addEventListener('input',render);
    el(id).addEventListener('blur',function(){
      let v=clampDim(el(id).value,def); if(v>MAXDIM) v=MAXDIM;
      el(id).value=v; render();
    });
  });
  el('txtIn').addEventListener('input',render);
  el('patSel').addEventListener('change',render);
  el('fmtSel').addEventListener('change',render);
  el('dlBtn').addEventListener('click',download);

  el('copyUriBtn').addEventListener('click',function(){
    render(); const conf=fmtConf();
    copy(canvas.toDataURL(conf.mime, conf.q));
  });
  el('copyImgBtn').addEventListener('click',function(){
    render(); const s=readState(), conf=fmtConf();
    const uri=canvas.toDataURL(conf.mime, conf.q);
    copy('<img src="'+uri+'" width="'+s.w+'" height="'+s.h+'" alt="placeholder">');
  });

  // ---- i18n + theme ----
  function applyLang(l){
    if(!I18N[l]) l='en';
    lang=l; t=I18N[l];
    document.documentElement.lang=l; document.documentElement.dir=t.dir;
    document.querySelectorAll('[data-i18n]').forEach(n=>{ const k=n.getAttribute('data-i18n'); if(typeof t[k]==='string') n.textContent=t[k]; });
    try{ localStorage.setItem('ac_lang', l); }catch(_){}
  }
  function ls(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
  function detectLang(){
    const chosen=ls('ac_lang'); if(chosen) return chosen;
    const cc=ls('ac_country'); if(cc) return cc==='IL'?'he':'en';
    let tz=''; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(_){}
    const navHe=(navigator.language||'').toLowerCase().indexOf('he')===0;
    return (tz==='Asia/Jerusalem'||navHe)?'he':'en';
  }
  function applyTheme(th){
    const dark=(th==='dark');
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
    const ti=el('themeIco'); if(ti) ti.textContent = dark?'☀️':'🌙';
    try{ localStorage.setItem('theme', dark?'dark':'light'); }catch(_){}
  }
  window.__setLang=applyLang;
  const tb=el('themeToggle'); if(tb) tb.addEventListener('click',()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));

  // ---- init ----
  buildPresets();
  applyTheme(ls('theme')||'light');
  applyLang(detectLang());
  syncPh();
  (function(){ const _setLang=window.__setLang; window.__setLang=function(l){ _setLang(l); syncPh(); }; })();
  render();
})();
</script>
</body>
</html>
