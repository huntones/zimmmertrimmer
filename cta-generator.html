<meta name="description" content="Generate high-converting call-to-action button text for any goal — purchase, leads, downloads, sign-ups and more. Curated phrase banks in Hebrew, English and Russian, with a live button preview and copyable HTML. Fast, simple and professional-quality.">
<style>
  :root {
    --bg:#eef0f6; --panel:#ffffff; --panel-2:#f5f6fa; --line:#e5e8f0; --line-2:#eef0f6;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#7c3aed; --accent-dim:#6a2fe0; --accent-ink:#ffffff; --accent-soft:#efe9fe;
    --success:#22b04b; --success-dim:#1c9a41; --success-soft:#e6f6ec;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --danger:#e5484d; --danger-soft:#fdecec;
    --warm-soft:#fff5da; --warm-line:#f2d98a;
    --ok:#22b04b; --warn:#c88a04; --err:#e5484d;
    --grad:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-h:linear-gradient(105deg,#6a29e6 0%,#2f74f0 100%);
    --grad-soft:linear-gradient(120deg,#efe9fe,#e6f0ff);
    --grad-shadow:rgba(93,79,240,0.30);
    --grad-btn:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn-glow:rgba(59,111,246,0.38);
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-lg:0 2px 6px rgba(20,24,44,0.05), 0 20px 50px rgba(20,24,44,0.10);
    --shadow-sm:0 1px 2px rgba(20,24,44,0.05);
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --sans:'Space Grotesk','Rubik',system-ui,'Segoe UI',sans-serif;
  }
  html[data-theme="dark"] {
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a303c; --line-2:#232833;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --accent:#a06bff; --accent-dim:#7c3aed; --accent-ink:#ffffff; --accent-soft:#241a3a;
    --success:#37c26a; --success-dim:#2fae5e; --success-soft:#132a1c;
    --info:#5b95f8; --info-dim:#4f8ef7; --info-soft:#182338;
    --danger:#ff6b6b; --danger-soft:#2a1719;
    --warm-soft:#2c2718; --warm-line:#5a4d24;
    --ok:#4ec98a; --warn:#e8b84b; --err:#ff6b6b;
    --grad:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-h:linear-gradient(105deg,#9a63ff 0%,#6aa2ff 100%);
    --grad-soft:linear-gradient(120deg,#1c1633,#11242a);
    --grad-shadow:rgba(77,123,255,0.42);
    --grad-btn:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn-glow:rgba(77,123,255,0.45);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,0.45), 0 24px 60px rgba(0,0,0,0.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;}
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:var(--grad);z-index:100;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--sans);}
  .wrap{width:100%;max-width:none;margin:0 auto;padding:22px 20px 60px;}

  /* page intro */
  .pagehead{margin:4px 0 20px;}
  .pagehead h2{font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:-0.02em;margin:0 0 6px;}
  .pagehead .kick{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);
    padding:4px 11px;border-radius:999px;margin-bottom:11px;}
  .pagehead p{font-size:14.5px;color:var(--muted);margin:0;max-width:64ch;}

  /* layout */
  .grid{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start;}
  @media (max-width:840px){ .grid{grid-template-columns:1fr;} }
  .col{min-width:0;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);}

  /* inputs */
  .inp{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;
    font-family:var(--sans);font-size:13.5px;padding:10px 12px;transition:border-color .12s,box-shadow .12s;}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  textarea.inp{resize:vertical;min-height:74px;}
  label.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:7px;}

  /* config card */
  .config{padding:18px;}
  .config h3{font-size:15px;margin:0 0 14px;font-weight:700;}
  .opt{margin-bottom:16px;}
  .opt:last-child{margin-bottom:0;}
  .hint{font-size:11px;color:var(--faint);margin-top:7px;font-family:var(--mono);line-height:1.5;}

  /* goal picker */
  .goals{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .goal{position:relative;display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:12px;
    border:1px solid var(--line);background:var(--panel-2);cursor:pointer;transition:border-color .12s,background .12s,transform .08s;text-align:start;}
  .goal:hover{border-color:var(--accent);}
  .goal:active{transform:scale(.98);}
  .goal.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--shadow-sm);}
  .goal .gico{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:var(--panel);color:var(--accent);border:1px solid var(--line-2);}
  .goal.on .gico{background:var(--accent);color:#fff;border-color:transparent;}
  .goal .gico svg{width:16px;height:16px;}
  .goal b{font-size:13px;font-weight:600;color:var(--ink);line-height:1.25;}
  .goal.on b{color:var(--accent-dim);}

  /* phrases grid */
  .phrasewrap{padding:18px;}
  .phrasehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .phrasehead h3{font-size:16px;margin:0;font-weight:700;}
  .phrasehead .cnt{font-family:var(--mono);font-size:11px;color:var(--accent-dim);font-weight:700;
    background:var(--accent-soft);padding:3px 10px;border-radius:999px;}
  .phrases{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px;}
  .phrase{display:flex;flex-direction:column;gap:8px;padding:12px 13px;border:1px solid var(--line);border-radius:13px;
    background:var(--panel-2);transition:border-color .12s,transform .08s,box-shadow .12s;cursor:pointer;}
  .phrase:hover{border-color:var(--accent);box-shadow:var(--shadow-sm);}
  .phrase.tpl{background:var(--grad-soft);border-color:color-mix(in srgb,var(--accent) 30%,var(--line));}
  .phrase .ptxt{font-size:15px;font-weight:600;color:var(--ink);line-height:1.3;word-break:break-word;}
  .phrase .prow{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .phrase .plen{font-family:var(--mono);font-size:10.5px;color:var(--faint);white-space:nowrap;}
  .phrase .pbtns{display:flex;gap:6px;}
  .pbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);
    font-family:var(--sans);font-size:11px;font-weight:600;padding:5px 9px;border-radius:8px;cursor:pointer;transition:all .12s;}
  .pbtn:hover{border-color:var(--accent);color:var(--accent-dim);}
  .pbtn svg{width:12px;height:12px;}
  .pbtn.use{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--grad-btn);color:#fff;border:none;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 9px var(--grad-btn-glow);}
  .pbtn.use:hover{filter:brightness(1.06);color:#fff;}
  .tplbadge{align-self:flex-start;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--accent-dim);background:var(--panel);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));
    padding:2px 7px;border-radius:999px;}

  /* preview side */
  .side{padding:18px;position:sticky;top:16px;}
  .side h3{font-size:15px;margin:0 0 4px;font-weight:700;}
  .side .subh{font-size:11.5px;color:var(--muted);margin:0 0 14px;}
  .stage{border:1px solid var(--line-2);border-radius:14px;background:
    radial-gradient(circle at 25% 20%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 60%),var(--panel-2);
    padding:30px 18px;display:flex;align-items:center;justify-content:center;min-height:118px;margin-bottom:16px;}
  #previewBtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:none;
    font-family:var(--sans);text-decoration:none;max-width:100%;text-align:center;transition:filter .14s,transform .08s;
    word-break:break-word;line-height:1.25;}
  #previewBtn:active{transform:translateY(1px);}

  .ctrl{margin-bottom:14px;}
  .ctrl > label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px;}
  .seg{display:flex;gap:5px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:4px;}
  .seg button{flex:1;border:none;background:transparent;color:var(--muted);font-family:var(--sans);font-size:12px;font-weight:600;
    padding:7px 4px;border-radius:7px;cursor:pointer;transition:all .12s;}
  .seg button:hover{color:var(--ink);}
  .seg button.on{background:var(--panel);color:var(--accent-dim);box-shadow:var(--shadow-sm);}

  .swatch{display:flex;gap:8px;align-items:center;}
  .swatch input[type=color]{width:38px;height:34px;padding:0;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);cursor:pointer;}
  .swatch .inp{flex:1;font-family:var(--mono);text-transform:uppercase;direction:ltr;}

  .copyhtml{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:9px;color:#fff;border:none;cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:600;font-size:14px;padding:12px 18px;border-radius:999px;text-shadow:0 1px 2px rgba(0,0,0,.18);margin-top:4px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.14),0 8px 20px var(--grad-btn-glow);
    transition:filter .14s,transform .08s;}
  .copyhtml:hover{filter:brightness(1.05);} .copyhtml:active{transform:translateY(1px);}
  .copyhtml svg{width:16px;height:16px;}

  .code{margin-top:14px;}
  .codebox{position:relative;border:1px solid var(--line);border-radius:11px;background:var(--panel-2);overflow:hidden;}
  .codebox pre{margin:0;padding:12px 13px;font-family:var(--mono);font-size:11px;line-height:1.55;color:var(--ink-2);
    white-space:pre-wrap;word-break:break-all;max-height:150px;overflow:auto;}
  .codecopy{position:absolute;top:8px;inset-inline-end:8px;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink-2);font-family:var(--sans);font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;cursor:pointer;transition:all .12s;}
  .codecopy:hover{border-color:var(--accent);color:var(--accent-dim);}
  .codecopy svg{width:11px;height:11px;}

  .seam{display:flex;align-items:flex-start;gap:8px;margin-top:16px;padding:11px 13px;border-radius:11px;
    background:var(--warm-soft);border:1px solid var(--warm-line);font-size:11.5px;color:var(--ink-2);line-height:1.55;}
  .seam svg{width:15px;height:15px;color:var(--warn);flex-shrink:0;margin-top:1px;}

  footer{margin-top:34px;text-align:center;color:var(--faint);font-size:12px;font-family:var(--mono);}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:11px 18px;border-radius:999px;
    box-shadow:var(--shadow-lg);transition:opacity .2s,transform .2s;z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>

          <span data-i18n="seam"></span>

  let lang='he', t=I18N.he;

  // ---- helpers ----
  function toast(m){ const e=el('toast'); e.textContent=m; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),1800); }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function normHex(v){ v=String(v||'').trim(); if(!v.startsWith('#')) v='#'+v; return /^#[0-9a-fA-F]{6}$/.test(v)?v:null; }
  function lighten(hex,amt){ const h=hex.replace('#',''); const r=Math.min(255,parseInt(h.slice(0,2),16)+amt), g=Math.min(255,parseInt(h.slice(2,4),16)+amt), b=Math.min(255,parseInt(h.slice(4,6),16)+amt); return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  function darken(hex,amt){ const h=hex.replace('#',''); const r=Math.max(0,parseInt(h.slice(0,2),16)-amt), g=Math.max(0,parseInt(h.slice(2,4),16)-amt), b=Math.max(0,parseInt(h.slice(4,6),16)-amt); return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  function charLen(s){ return Array.from(String(s||'')).length; }

  function copyText(str){
    const done=()=>toast(t.copied);
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(str).then(done).catch(()=>fallback(str,done)); }
    else fallback(str,done);
  }
  function fallback(str,cb){ const ta=document.createElement('textarea'); ta.value=str; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} ta.remove(); cb&&cb(); }

  function currentGoal(){ return GOALS.find(g=>g.id===goal); }

  // ---- goal picker ----
  function renderGoals(){
    el('goals').innerHTML = GOALS.map(g=>`
      <button type="button" class="goal ${g.id===goal?'on':''}" data-goal="${g.id}">
        <span class="gico">${g.ico}</span>
        <b>${escapeHtml(t.goals[g.id])}</b>
      </button>`).join('');
  }

  // ---- phrase bank ----
  function buildPhraseList(){
    const g=currentGoal();
    const base=(g.phrases[lang]||[]).map(p=>({text:p,tpl:false}));
    const offer=el('offer').value.trim();
    let out=base;
    if(offer){
      const tpl=(g.tpl[lang]||[]).map(s=>({text:s.replace('{X}',offer),tpl:true}));
      out=tpl.concat(base);
    }
    return out;
  }

  function renderPhrases(){
    const g=currentGoal();
    el('phrTitle').textContent = t.phrTitle(t.goals[g.id]);
    const list=buildPhraseList();
    el('phrCnt').textContent = t.cntLbl(list.length);
    el('phrases').innerHTML = list.map((p,i)=>{
      const len=charLen(p.text);
      return `<div class="phrase ${p.tpl?'tpl':''}" data-i="${i}">
        ${p.tpl?`<span class="tplbadge">${escapeHtml(t.tplBadge)}</span>`:''}
        <div class="ptxt">${escapeHtml(p.text)}</div>
        <div class="prow">
          <span class="plen">${t.charsLbl(len)}</span>
          <span class="pbtns">
            <button type="button" class="pbtn use" data-use="${i}">${escapeHtml(t.usePhrase)}</button>
            <button type="button" class="pbtn" data-copy="${i}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <span>${escapeHtml(t.copyPhrase)}</span>
            </button>
          </span>
        </div>
      </div>`;
    }).join('');
    // ensure a phrase is loaded
    if(!phrase && list.length){ phrase=list[0].text; }
    renderPreview();
  }

  // ---- button style computation (shared by preview + code) ----
  function btnStyle(){
    const sh=SHAPES.find(s=>s.id===shape), sz=SIZES.find(s=>s.id===size);
    const c=color, cd=darken(c,26), cl=lighten(c,40);
    const base={ 'display':'inline-flex','align-items':'center','justify-content':'center',
      'font-family':"'Space Grotesk',system-ui,'Segoe UI',sans-serif",'font-weight':'600',
      'font-size':sz.font,'padding':sz.pad,'border-radius':sh.radius,'text-decoration':'none',
      'cursor':'pointer','line-height':'1.25','letter-spacing':'.005em' };
    if(style==='filled'){
      base['background']=`linear-gradient(105deg, ${c} 0%, ${lighten(c,24)} 100%)`;
      base['color']='#ffffff';
      base['border']='none';
      base['box-shadow']=`0 6px 18px ${hexToRgba(c,0.35)}`;
    } else if(style==='outline'){
      base['background']='transparent';
      base['color']=c;
      base['border']=`2px solid ${c}`;
    } else { // solid
      base['background']=c;
      base['color']='#ffffff';
      base['border']='none';
      base['box-shadow']=`0 4px 12px ${hexToRgba(c,0.28)}`;
    }
    return base;
  }
  function hexToRgba(hex,a){ const h=hex.replace('#',''); const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16); return `rgba(${r},${g},${b},${a})`; }
  function styleToCss(obj){ return Object.entries(obj).map(([k,v])=>`${k}:${v}`).join(';'); }

  // ---- preview + code ----
  function renderPreview(){
    const b=el('previewBtn');
    const css=btnStyle();
    b.removeAttribute('style');
    Object.entries(css).forEach(([k,v])=>b.style.setProperty(k,v));
    b.textContent = phrase || (currentGoal().phrases[lang][0]||'CTA');
    renderCode();
  }
  function renderCode(){
    const css=styleToCss(btnStyle());
    const txt=phrase || (currentGoal().phrases[lang][0]||'CTA');
    const html=`<a href="#" style="${css}">${escapeHtml(txt)}</a>`;
    el('codeOut').textContent = html;
  }

  // ---- segmented controls ----
  function renderSegs(){
    el('styleSeg').innerHTML = STYLES.map(s=>`<button type="button" data-style="${s.id}" class="${s.id===style?'on':''}">${escapeHtml(t[s.key])}</button>`).join('');
    el('shapeSeg').innerHTML = SHAPES.map(s=>`<button type="button" data-shape="${s.id}" class="${s.id===shape?'on':''}">${escapeHtml(t[s.key])}</button>`).join('');
    el('sizeSeg').innerHTML  = SIZES.map(s=>`<button type="button" data-size="${s.id}" class="${s.id===size?'on':''}">${escapeHtml(t[s.key])}</button>`).join('');
  }

  // ---- i18n + theme ----
  function applyLang(l){
    lang=l; t=I18N[l];
    document.documentElement.lang=l; document.documentElement.dir=t.dir;
    document.querySelectorAll('[data-i18n]').forEach(n=>{ const k=n.getAttribute('data-i18n'); if(typeof t[k]==='string') n.textContent=t[k]; });
    document.querySelectorAll('[data-i18n-ph]').forEach(n=>{ const k=n.getAttribute('data-i18n-ph'); if(typeof t[k]==='string') n.setAttribute('placeholder',t[k]); });
    try{ localStorage.setItem('ac_lang', l); }catch(_){}
    // keep the loaded phrase in sync with the language: map by index if it was from the bank
    reconcilePhrase();
    renderGoals(); renderSegs(); renderPhrases();
  }
  function reconcilePhrase(){
    // when switching languages, move the loaded phrase to the same slot in the new language
    const list=buildPhraseList();
    if(list.some(p=>p.text===phrase)) return; // still valid
    if(prevList){
      const idx=prevList.findIndex(p=>p.text===phrase);
      if(idx>=0 && list[idx]){ phrase=list[idx].text; return; }
    }
    phrase = list.length ? list[0].text : '';
  }
  let prevList=null;
  function snapshotList(){ prevList=buildPhraseList(); }

  function ls(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
  function detectLang(){
    const chosen=ls('ac_lang'); if(chosen) return chosen;
    const cc=ls('ac_country'); if(cc) return cc==='IL'?'he':'en';
    let tz=''; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(_){}
    const navHe=(navigator.language||'').toLowerCase().indexOf('he')===0;
    return (tz==='Asia/Jerusalem'||navHe)?'he':'en';
  }
  function applyTheme(th){
    const dark=(th==='dark');
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
    const ti=el('themeIco'); if(ti) ti.textContent = dark?'☀️':'🌙';
    try{ localStorage.setItem('theme', dark?'dark':'light'); }catch(_){}
  }

  // ---- events ----
  el('goals').addEventListener('click',e=>{
    const b=e.target.closest('[data-goal]'); if(!b) return;
    snapshotList();
    goal=b.getAttribute('data-goal');
    // reset loaded phrase to the new goal's first phrase
    phrase='';
    renderGoals(); renderPhrases();
  });

  el('offer').addEventListener('input',()=>{ renderPhrases(); });

  el('phrases').addEventListener('click',e=>{
    const list=buildPhraseList();
    const u=e.target.closest('[data-use]');
    if(u){ const i=+u.getAttribute('data-use'); if(list[i]){ phrase=list[i].text; renderPreview(); toast(t.chosen); } return; }
    const c=e.target.closest('[data-copy]');
    if(c){ const i=+c.getAttribute('data-copy'); if(list[i]) copyText(list[i].text); return; }
    // clicking the card body (not a button) also loads it
    const card=e.target.closest('.phrase');
    if(card){ const i=+card.getAttribute('data-i'); if(list[i]){ phrase=list[i].text; renderPreview(); toast(t.chosen); } }
  });

  el('styleSeg').addEventListener('click',e=>{ const b=e.target.closest('[data-style]'); if(b){ style=b.getAttribute('data-style'); renderSegs(); renderPreview(); } });

  function setColor(v,syncPick,syncHex){
    const n=normHex(v); if(!n) return;
    color=n.toLowerCase();
    if(syncPick) el('colorPick').value=color;
    if(syncHex)  el('colorHex').value=color.toUpperCase();
    renderPreview();
  }
  el('colorPick').addEventListener('input',()=>setColor(el('colorPick').value,false,true));
  el('colorHex').addEventListener('input',()=>{ const n=normHex(el('colorHex').value); if(n) setColor(n,true,false); });
  el('colorHex').addEventListener('blur',()=>{ el('colorHex').value=color.toUpperCase(); });

  el('copyHtmlBtn').addEventListener('click',()=>copyText(el('codeOut').textContent));
  el('codeCopyBtn').addEventListener('click',()=>copyText(el('codeOut').textContent));

  window.__setLang=applyLang;
  el('themeToggle').addEventListener('click',()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));

  // ---- init ----
  applyTheme(ls('theme')||'light');
  applyLang(detectLang());
})();
</script>
</body>
</html>
