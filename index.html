<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOLKLI — Everything you need to work with files</title>
<link rel="canonical" href="https://kolkli.com/">
<meta name="description" content="Upload once — then edit, convert, compress, organize and send your files. Audio, images, video, documents, converters and AI tools in one place. Fast, simple and professional-quality.">
<style>
  :root {
    --bg:#eef0f6; --panel:#ffffff; --panel-2:#f5f6fa; --line:#e5e8f0; --line-2:#eef0f6;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#7c3aed; --accent-dim:#6a2fe0; --accent-ink:#ffffff; --accent-soft:#efe9fe;
    --success:#22b04b; --success-dim:#1c9a41; --success-soft:#e6f6ec;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --danger:#e5484d; --danger-soft:#fdecec;
    --warm-soft:#fff5da; --warm-line:#f2d98a;
    --ok:#22b04b; --warn:#c88a04; --err:#e5484d;
    --grad:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-h:linear-gradient(105deg,#6a29e6 0%,#2f74f0 100%);
    --grad-soft:linear-gradient(120deg,#efe9fe,#e6f0ff);
    --grad-shadow:rgba(93,79,240,0.30);
    --grad-btn:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn-glow:rgba(59,111,246,0.38);
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-lg:0 2px 6px rgba(20,24,44,0.05), 0 20px 50px rgba(20,24,44,0.10);
    --shadow-sm:0 1px 2px rgba(20,24,44,0.05);
    --glass:rgba(255,255,255,0.70); --glass-line:rgba(255,255,255,0.9);
    --mesh-1:rgba(124,58,237,0.10); --mesh-2:rgba(34,211,160,0.09); --mesh-3:rgba(59,111,246,0.07);
    --tile-audio:linear-gradient(150deg,#7b34ff,#3f85ff); --tile-image:linear-gradient(150deg,#5f6bff,#38a2ff);
    --tile-video:linear-gradient(150deg,#7b34ff,#3f85ff); --tile-pdf:linear-gradient(150deg,#5f6bff,#38a2ff);
    --tile-doc:linear-gradient(150deg,#7b34ff,#3f85ff);
    --float-shadow:0 22px 44px -16px rgba(40,28,90,0.42);
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --sans:'Space Grotesk',system-ui,'Segoe UI','Heebo',sans-serif;
  }
  html[data-theme="dark"] {
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a303c; --line-2:#232833;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --accent:#a06bff; --accent-dim:#7c3aed; --accent-ink:#ffffff; --accent-soft:#241a3a;
    --success:#37c26a; --success-dim:#2fae5e; --success-soft:#132a1c;
    --info:#5b95f8; --info-dim:#4f8ef7; --info-soft:#182338;
    --danger:#ff6b6b; --danger-soft:#2a1719;
    --warm-soft:#2c2718; --warm-line:#5a4d24;
    --ok:#4ec98a; --warn:#e8b84b; --err:#ff6b6b;
    --grad:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-h:linear-gradient(105deg,#9a63ff 0%,#6aa2ff 100%);
    --grad-soft:linear-gradient(120deg,#1c1633,#11242a);
    --grad-shadow:rgba(77,123,255,0.42);
    --grad-btn:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn-glow:rgba(77,123,255,0.45);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,0.45), 0 24px 60px rgba(0,0,0,0.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
    --glass:rgba(24,28,37,0.62); --glass-line:rgba(255,255,255,0.08);
    --mesh-1:rgba(124,58,237,0.16); --mesh-2:rgba(34,211,160,0.11); --mesh-3:rgba(59,111,246,0.12);
    --tile-audio:linear-gradient(150deg,#8f52ff,#5a97ff); --tile-image:linear-gradient(150deg,#5f6bff,#38a2ff);
    --tile-video:linear-gradient(150deg,#8f52ff,#5a97ff); --tile-pdf:linear-gradient(150deg,#5f6bff,#38a2ff);
    --tile-doc:linear-gradient(150deg,#8f52ff,#5a97ff);
    --float-shadow:0 22px 44px -16px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;overflow-x:clip;position:relative;}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(60% 42% at 18% 6%,var(--mesh-1),transparent 60%),
      radial-gradient(52% 40% at 88% 2%,var(--mesh-2),transparent 60%),
      radial-gradient(60% 50% at 50% 100%,var(--mesh-3),transparent 62%);}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--sans);}
  .wrap{width:100%;max-width:none;margin:0 auto;padding:0 22px;}
  .gtext{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}

  /* ---------- top bar ---------- */
  .nav{position:sticky;top:0;z-index:50;backdrop-filter:saturate(1.4) blur(10px);
    background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid transparent;
    transition:border-color .2s,background .2s;}
  .nav.scrolled{border-bottom-color:var(--line);}
  .nav .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px;}
  .brand{display:flex;align-items:center;gap:11px;}
  .brand .logo{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    background:var(--grad);color:#fff;box-shadow:0 4px 12px var(--grad-shadow);flex-shrink:0;}
  .brand .logo svg{width:21px;height:21px;}
  .brand b{font-size:18px;font-weight:700;letter-spacing:0.01em;}
  .navtools{display:flex;align-items:center;gap:8px;}
  .navlinks{display:flex;gap:2px;margin-inline-end:6px;}
  .navlinks a{padding:8px 9px;border-radius:9px;font-size:13px;color:var(--muted);transition:color .12s,background .12s;white-space:nowrap;}
  .navlinks a:hover{color:var(--ink);background:var(--panel-2);}
  .pillbtn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:999px;
    background:var(--panel);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;font-size:13.5px;
    box-shadow:var(--shadow-sm);transition:border-color .12s,transform .08s,background .12s;}
  .pillbtn:hover{border-color:var(--accent);}
  .pillbtn:active{transform:scale(0.97);}
  .iconbtn{width:38px;height:38px;padding:0;justify-content:center;font-size:15px;line-height:1;}
  .menuBtn{display:none;}
  .navpanel{display:none;border-top:1px solid var(--line);background:var(--panel);}
  .navpanel.open{display:block;}
  .navpanel .inner{display:flex;flex-direction:column;width:100%;max-width:none;margin:0 auto;padding:6px 22px 14px;}
  .navpanel a{padding:12px 8px;font-size:15px;color:var(--ink-2);border-bottom:1px solid var(--line-2);}
  .navpanel a:last-child{border-bottom:none;}

  /* ---------- gradient CTA button ---------- */
  .cta{display:inline-flex;align-items:center;justify-content:center;gap:9px;color:#fff;border:none;cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:600;font-size:15px;padding:13px 26px;border-radius:999px;text-shadow:0 1px 2px rgba(0,0,0,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.14),0 8px 20px var(--grad-btn-glow);
    transition:filter .14s,transform .08s;}
  .cta:hover{filter:brightness(1.06);} .cta:active{transform:translateY(1px);}
  .cta.sm{padding:10px 18px;font-size:14px;}
  .cta.lg{padding:16px 34px;font-size:16.5px;}
  .cta svg{width:18px;height:18px;}
  .ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:999px;font-size:15px;
    font-weight:600;background:var(--panel);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;
    box-shadow:var(--shadow-sm);transition:border-color .12s,transform .08s;}
  .ghost:hover{border-color:var(--accent);} .ghost:active{transform:translateY(1px);}
  .linklike{background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;text-decoration:underline;padding:0;}

  /* ---------- hero ---------- */
  .hero{position:relative;text-align:center;padding:84px 0 30px;overflow:hidden;}
  .hero .wrap{position:relative;z-index:3;}
  /* soft ambient glows — gentle, never neon */
  .orb{position:absolute;border-radius:50%;filter:blur(84px);z-index:0;pointer-events:none;}
  .orb.a{width:440px;height:440px;background:radial-gradient(circle,rgba(124,58,237,.30),transparent 66%);top:-140px;inset-inline-start:-110px;}
  .orb.b{width:480px;height:480px;background:radial-gradient(circle,rgba(34,211,160,.24),transparent 66%);top:-70px;inset-inline-end:-140px;}
  .orb.c{width:540px;height:360px;background:radial-gradient(circle,rgba(59,111,246,.16),transparent 70%);top:130px;inset-inline-start:50%;transform:translateX(-50%);}

  /* 3D floating tiles */
  .hero3d{position:absolute;inset:0;z-index:1;pointer-events:none;perspective:1100px;}
  .float{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:20px;
    box-shadow:var(--float-shadow),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -7px 14px rgba(0,0,0,.14);
    animation:floaty 7s ease-in-out infinite;will-change:transform;}
  .float::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:0;
    background:linear-gradient(158deg,rgba(255,255,255,.42),transparent 52%);}
  .float svg{position:relative;z-index:1;width:44%;height:44%;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 3px rgba(0,0,0,.22));}
  .float.f1{width:78px;height:78px;background:var(--tile-audio);top:9%;inset-inline-start:7%;transform:rotate(-9deg);animation-duration:7s;animation-delay:-.2s;}
  .float.f2{width:64px;height:64px;background:var(--tile-image);top:19%;inset-inline-end:8%;transform:rotate(10deg);animation-duration:8s;animation-delay:-1.6s;}
  .float.f3{width:58px;height:58px;background:var(--tile-video);top:52%;inset-inline-start:4%;transform:rotate(7deg);animation-duration:6.4s;animation-delay:-3s;}
  .float.f4{width:72px;height:72px;background:var(--tile-pdf);top:58%;inset-inline-end:5%;transform:rotate(-11deg);animation-duration:9s;animation-delay:-2.2s;}
  .float.f5{width:52px;height:52px;background:var(--tile-doc);top:6%;inset-inline-start:46%;transform:rotate(-5deg);animation-duration:7.6s;animation-delay:-4.2s;}
  @keyframes floaty{0%,100%{translate:0 0;}50%{translate:0 -17px;}}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-family:var(--mono);color:var(--muted);
    background:var(--panel);border:1px solid var(--line);padding:6px 14px;border-radius:999px;box-shadow:var(--shadow-sm);margin-bottom:22px;}
  .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px var(--success-soft);}
  h1.big{font-size:clamp(34px,6vw,58px);line-height:1.05;letter-spacing:-0.025em;margin:0 auto 18px;max-width:16ch;font-weight:700;}
  .sub{font-size:clamp(16px,2.3vw,19px);color:var(--muted);max-width:56ch;margin:0 auto 26px;line-height:1.6;}
  .trust{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;font-size:12.5px;font-family:var(--mono);color:var(--faint);margin-top:22px;}
  .trust span{display:inline-flex;align-items:center;gap:6px;}
  .trust svg{width:14px;height:14px;color:var(--success);}

  /* ---------- section frame ---------- */
  section{padding:52px 0;}
  .shead{text-align:center;max-width:60ch;margin:0 auto 34px;}
  .kicker{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:inline-flex;gap:8px;align-items:center;}
  .kicker .new{color:#fff;background:var(--grad);padding:1px 8px;border-radius:999px;font-size:10px;letter-spacing:.04em;}
  .shead h2{font-size:clamp(26px,3.6vw,36px);line-height:1.12;letter-spacing:-0.02em;margin:0 0 12px;font-weight:700;}
  .shead p{font-size:16px;color:var(--muted);margin:0;line-height:1.6;}

  /* generic card + grids */
  .grid{display:grid;gap:16px;}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g4{grid-template-columns:repeat(4,1fr);}
  .g2{grid-template-columns:repeat(2,1fr);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);
    transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;}
  a.card{display:block;}
  .card.hov:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow-lg);}
  .card .cardtop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:23px;
    background:var(--grad-soft);margin-bottom:14px;}
  .card h3{font-size:16.5px;font-weight:700;margin:0 0 6px;letter-spacing:-0.01em;}
  .card p{font-size:13.7px;color:var(--muted);margin:0;line-height:1.55;}
  .hubcap{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:10px;}

  /* status badges */
  .badge{font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:6px;padding:2px 7px;white-space:nowrap;}
  .badge.soon{color:var(--warn);background:var(--warm-soft);border:1px solid var(--warm-line);}
  .badge.live{color:var(--success-dim);background:var(--success-soft);border:1px solid var(--success);}

  /* ---------- AI studio ---------- */
  .aigrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .aicard{display:flex;align-items:center;gap:11px;padding:14px;border-radius:13px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-sm);}
  .aicard .aico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--grad-soft);font-size:19px;flex-shrink:0;}
  .aicard .an{font-size:13.5px;font-weight:600;line-height:1.25;}

  /* ---------- hub sections ---------- */
  .hubhead{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
  .hubhead .ico{margin-bottom:0;}
  .hubhead .htext{flex:1;min-width:180px;}
  .hubhead h2{font-size:clamp(22px,3vw,30px);margin:0;font-weight:700;letter-spacing:-.02em;}
  .hubhead p{margin:3px 0 0;color:var(--muted);font-size:14px;}
  .chips{display:flex;flex-wrap:wrap;gap:9px;}
  .chip{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);background:var(--panel);
    border:1px solid var(--line);border-radius:999px;padding:8px 14px;box-shadow:var(--shadow-sm);}
  a.chip{cursor:pointer;transition:border-color .12s,transform .08s,box-shadow .12s;}
  a.chip:hover{border-color:var(--success);transform:translateY(-1px);box-shadow:var(--shadow);}
  .chip .badge{padding:1px 6px;font-size:9px;}

  /* ---------- steps ---------- */
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;position:relative;}
  .step{text-align:center;padding:26px 20px;}
  .step .num{width:54px;height:54px;margin:0 auto 16px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    font-size:26px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;}
  .step .num small{position:absolute;top:-8px;inset-inline-end:-8px;width:24px;height:24px;border-radius:50%;background:var(--grad);
    color:#fff;font-family:var(--mono);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px var(--grad-shadow);}
  .step h3{font-size:17px;margin:0 0 6px;font-weight:700;}
  .step p{font-size:13.7px;color:var(--muted);margin:0;}

  /* ---------- pricing ---------- */
  .plans{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:start;}
  .plan{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 24px;box-shadow:var(--shadow);}
  .plan.pop{border-color:var(--accent);box-shadow:var(--shadow-lg);}
  .plan .ribbon{position:absolute;top:-11px;inset-inline-start:24px;background:var(--grad);color:#fff;font-size:11px;font-weight:700;
    font-family:var(--mono);padding:3px 12px;border-radius:999px;box-shadow:0 4px 10px var(--grad-shadow);}
  .plan h3{font-size:18px;margin:0 0 2px;font-weight:700;}
  .plan .price{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:10px 0 2px;}
  .plan .price span{font-size:14px;font-weight:500;color:var(--muted);}
  .plan .tagline{font-size:13.5px;color:var(--muted);margin:0 0 4px;}
  .plan ul{list-style:none;padding:0;margin:18px 0 22px;display:flex;flex-direction:column;gap:10px;}
  .plan li{display:flex;align-items:flex-start;gap:9px;font-size:13.7px;color:var(--ink-2);}
  .plan li svg{width:16px;height:16px;color:var(--success);flex-shrink:0;margin-top:2px;}
  .plan .cta,.plan .ghost{width:100%;}
  .plan-trial{display:block;text-align:center;margin-top:10px;font-size:12px;font-weight:600;color:var(--accent-dim,var(--accent));text-decoration:none;}
  .plan-trial:hover{text-decoration:underline;}

  /* ---------- faq ---------- */
  .faq{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
  details.q{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:4px 20px;box-shadow:var(--shadow-sm);transition:border-color .15s;}
  details.q[open]{border-color:var(--accent);}
  details.q summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:16px 0;font-size:15.5px;font-weight:600;}
  details.q summary::-webkit-details-marker{display:none;}
  details.q summary .chev{width:20px;height:20px;flex-shrink:0;color:var(--muted);transition:transform .2s;}
  details.q[open] summary .chev{transform:rotate(180deg);}
  details.q .ans{padding:0 0 18px;font-size:14px;color:var(--muted);line-height:1.65;}

  /* ---------- final CTA ---------- */
  .final{text-align:center;background:var(--grad-soft);border:1px solid var(--line);border-radius:24px;padding:56px 30px;box-shadow:var(--shadow);}
  .final h2{font-size:clamp(26px,4vw,38px);letter-spacing:-0.02em;margin:0 0 12px;font-weight:700;}
  .final p{font-size:16.5px;color:var(--muted);margin:0 auto 26px;max-width:46ch;}

  /* ---------- footer ---------- */
  footer{border-top:1px solid var(--line);margin-top:56px;padding:44px 0 34px;}
  .fcols{display:grid;grid-template-columns:1.5fr repeat(4,1fr);gap:26px;margin-bottom:30px;}
  .fbrand .brand b{font-size:20px;}
  .fbrand p{font-size:15.5px;color:var(--ink-2);margin:14px 0 0;max-width:34ch;line-height:1.7;}
  .fcol h4{font-size:15.5px;font-weight:700;margin:0 0 14px;color:var(--ink);}
  .fcol a,.fcol span{display:block;font-size:15px;color:var(--ink-2);padding:6px 0;}
  .fcol a:hover{color:var(--ink);}
  footer .base{border-top:1px solid var(--line-2);padding-top:22px;font-size:14.5px;color:var(--ink-2);text-align:center;}

  /* ---------- reveal ---------- */
  .reveal{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease;}
  .reveal.in{opacity:1;transform:none;}

  /* ---------- responsive ---------- */
  @media (max-width:1040px){
    .navlinks{display:none;}
    .menuBtn{display:inline-flex;}
  }
  @media (max-width:1080px){ .hero3d{display:none;} }
  @media (max-width:860px){
    .g4{grid-template-columns:repeat(2,1fr);} .g3{grid-template-columns:repeat(2,1fr);}
    .aigrid{grid-template-columns:repeat(2,1fr);}
    .plans{grid-template-columns:1fr;max-width:460px;margin-inline:auto;}
    .fcols{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:560px){
    .g4,.g3,.g2,.steps{grid-template-columns:1fr;}
    .plans{grid-template-columns:1fr;}
    .aigrid{grid-template-columns:1fr;}
    .fcols{grid-template-columns:1fr;}
    .hero{padding:48px 0 18px;}
    .brand b{font-size:16px;}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;} .reveal{transition:none;opacity:1;transform:none;} .card.hov:hover{transform:none;}
  }
  /* ---------- 3D floating file icons (hero) ---------- */

       ru:['Какие инструменты работают уже сейчас?','Аудиоредактор и локальное упорядочивание файлов уже доступны. Остальные инструменты выходят постепенно.']},
      {he:['צריך חשבון?','לא כדי להתחיל. חשבון מוסיף היסטוריה, לינקים שמורים ושיתוף.'],
       en:['Do I need an account?','Not to start. An account adds history, saved links and sharing.'],
       ru:['Нужен ли аккаунт?','Не для начала работы. Аккаунт добавляет историю, сохранённые ссылки и общий доступ.']},
      {he:['יש מגבלת גודל?','בחינם עד 3GB לשליחה; מסלולי Creator ו-Studio מעלים את המגבלה.'],
       en:['Is there a size limit?','Free is up to 3GB per transfer; Creator and Studio raise the limit.'],
       ru:['Есть ли ограничение по размеру?','Бесплатно — до 3 ГБ за передачу; Creator и Studio увеличивают лимит.']}
    ],
    footerCols:[
      {t:{he:'כלים',en:'Tools',ru:'Инструменты'}, links:[
        {he:'אודיו',en:'Audio',ru:'Аудио',href:'./app'},{he:'תמונות',en:'Images',ru:'Изображения',href:'./images/'},
        {he:'וידאו',en:'Video',ru:'Видео',href:'./video/'},{he:'מסמכים',en:'Documents',ru:'Документы',href:'./documents/'},
        {he:'ממירים',en:'Converters',ru:'Конвертеры',href:'./converters/'},{he:'דחיסה',en:'Compress',ru:'Сжатие',href:'./compress/'},{he:'שיווק',en:'Marketing',ru:'Маркетинг',href:'./marketing/'},{he:'מחשבונים',en:'Calculators',ru:'Калькуляторы',href:'./calc/'},
        {he:'כלי עיצוב ופיתוח',en:'Design & Dev',ru:'Дизайн и код',href:'./dev-tools/'}]},
      {t:{he:'AI',en:'AI',ru:'AI'}, links:[
        {he:'סטודיו AI',en:'AI Studio',ru:'AI-студия',href:'./ai/'},{he:'חיתוך חכם',en:'Smart Crop',ru:'Умная обрезка',href:'./ai-smart-crop'},{he:'הסרת רקע',en:'Remove BG',ru:'Удалить фон',href:'./remove-bg'},
        {he:'ניקוי אודיו',en:'Audio Cleaner',ru:'Очистка звука',href:'./ai-audio-cleanup'},{he:'כתוביות',en:'Subtitles',ru:'Субтитры',href:'./subtitle-generator'},{he:'סיכום PDF',en:'Summarize PDF',ru:'Конспект PDF',href:'./ai-summarize-pdf'},{he:'שדרוג תמונה',en:'Upscaler',ru:'Апскейлер'}]},
      {t:{he:'חברה',en:'Company',ru:'Компания'}, links:[
        {he:'אודות',en:'About',ru:'О нас'},{he:'מסלולים ומחירים',en:'Pricing',ru:'Цены',href:'./pricing/'},
        {he:'בלוג',en:'Blog',ru:'Блог'},{he:'צור קשר',en:'Contact',ru:'Контакты'}]},
      {t:{he:'משפטי',en:'Legal',ru:'Правовое'}, links:[
        {he:'פרטיות',en:'Privacy',ru:'Конфиденциальность'},{he:'תנאי שימוש',en:'Terms',ru:'Условия'},
        {he:'DMCA',en:'DMCA',ru:'DMCA'},{he:'אבטחה',en:'Security',ru:'Безопасность'}]}
    ]
  };

  let lang = 'he';
  const chev = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
  const check = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  const NAV = [['navHome','#top'],['navSend','#send'],['navAI','#ai'],['navAudio','#audio'],['navImages','#images'],['navVideo','#video'],['navDocs','#documents'],['navConvert','#converters'],['navCompress','#compress'],['navPricing','#pricing']];

  function badge(status, S){
    return status==='live'
      ? `<span class="badge live">${S.liveLbl}</span>`
      : `<span class="badge soon">${S.soonLbl}</span>`;
  }
  function toolCard(t, L, S){
    const [h,p] = t[L];
    const inner = `<div class="cardtop"><div class="ico">${t.i}</div>${badge(t.status,S)}</div><h3>${h}</h3><p>${p}</p>`;
    return (t.status==='live' && t.href)
      ? `<a class="card hov" href="${t.href}">${inner}</a>`
      : `<div class="card">${inner}</div>`;
  }
  function hubSection(hb, L, S){
    const [h,p] = hb[L];
    const cta = hb.cta ? `<a class="cta sm" href="${hb.cta.href}">${S[hb.cta.k]}</a>` : '';
    const chips = hb.tools.map(t=>`<span class="chip">${badge(t.s,S)}${t[L]}</span>`).join('');
    return `<section id="${hb.id}"><div class="wrap">
      <div class="hubhead"><div class="ico">${hb.i}</div><div class="htext"><h2>${h}</h2><p>${p}</p></div>${cta}</div>
      <div class="chips">${chips}</div></div></section>`;
  }
  function planCard(p, L, S){
    const [name,tagline] = p[L];
    const ribbon = p.pop ? `<span class="ribbon">${S.mostPopular}</span>` : '';
    const feats = p.feats.map(f=>`<li>${check}${f[L]}</li>`).join('');
    // Free → sign-up; paid plans (Creator/Studio) → the checkout flow.
    const slug = (p.en[0]||'').toLowerCase();
    const href = slug==='free' ? './auth?mode=signup' : `./checkout.html?plan=${slug}`;
    const btn = p.pop
      ? `<a class="cta" href="${href}">${p.cta[L]}</a>`
      : `<a class="ghost" href="${href}">${p.cta[L]}</a>`;
    // Creator is the trialed tier → offer the no-card 7-day trial via sign-up.
    const trialTxt = { he:'או 7 ימי ניסיון חינם — ללא כרטיס אשראי', en:'or start 7 days free — no credit card', ru:'или 7 дней бесплатно — без карты' };
    const trial = slug==='creator' ? `<a class="plan-trial" href="./auth?mode=signup">${trialTxt[L]}</a>` : '';
    return `<div class="plan ${p.pop?'pop':''}">${ribbon}<h3>${name}</h3>
      <div class="price">${p.price[L]}<span>${S.perMonth}</span></div><p class="tagline">${tagline}</p>
      <ul>${feats}</ul>${btn}${trial}</div>`;
  }

  function render(){
    const L = lang, S = STR[L];
    document.querySelectorAll('[data-i18n]').forEach(n=>{ const k=n.getAttribute('data-i18n'); if(S[k]!=null) n.textContent=S[k]; });



    const TABS=[['all','tabAll'],['audio','tabAudio'],['images','tabImages'],['video','tabVideo'],['documents','tabDocs'],['convert','tabConvert'],['compress','tabCompress'],['marketing','tabMarketing'],['calc','tabCalc']];
    el('toolsTabs').innerHTML = TABS.map((t,i)=>
      `<button class="tab${i===0?' on':''}" data-cat="${t[0]}">${S[t[1]]}</button>`).join('');
    el('toolsAllGrid').innerHTML = DATA.tools.map(t=>{
      const [h,p]=t[L];
      const nb = t.new ? `<span class="new">${S.newBadge}</span>` : '';
      return `<a class="tool" href="${t.href}" data-cat="${t.cat.join(' ')}"><span class="tico ti-${t.c}">${t.i}</span>${nb}<h3>${h}</h3><p>${p}</p></a>`;
    }).join('');

    el('catsGrid').innerHTML = DATA.cats.map(c=>{
      const [h,p]=c[L];
      return `<a class="card hov" href="${c.href}"><div class="ico">${c.i}</div><h3>${h}</h3><p>${p}</p><div class="hubcap">${c.cap[L]}</div></a>`;
    }).join('');


    el('sendGrid').innerHTML = DATA.send.map(s=>`<a class="chip" href="./send">${badge('live',S)}${s[L]}</a>`).join('');

    el('whyGrid').innerHTML = DATA.why.map(w=>{
      const [h,p]=w[L]; return `<div class="card"><div class="ico">${w.i}</div><h3>${h}</h3><p>${p}</p></div>`;
    }).join('');

    el('stepsGrid').innerHTML = DATA.steps.map((s,i)=>{
      const [t,d]=s[L]; return `<div class="step"><div class="num">${s.i}<small>${i+1}</small></div><h3>${t}</h3><p>${d}</p></div>`;
    }).join('');



    el('footerCols').innerHTML = DATA.footerCols.map(col=>{
      const items = col.links.map(li=> li.href
        ? `<a href="${li.href}">${li[L]}</a>`
        : `<span>${li[L]}</span>`).join('');
      return `<div class="fcol"><h4>${col.t[L]}</h4>${items}</div>`;
    }).join('');

  }

  /* ---------------- mobile menu ---------------- */
  function initMenu(){
    const panel = el('navpanel'), btn = el('menuBtn'); if(!panel || !btn) return;
    btn.addEventListener('click', ()=>panel.classList.toggle('open'));
    panel.addEventListener('click', e=>{ if(e.target.closest('a')) panel.classList.remove('open'); });
  }

  function applyLang(l, persist){
    lang = l;
    document.documentElement.lang = l;
    document.documentElement.dir = (l==='he') ? 'rtl' : 'ltr';
    if(persist){ try{ localStorage.setItem('ac_lang', l); }catch(_){} }
    render();
    revealScan();
  }

  /* ---------------- auto language by region (IL -> he, else en) ---------------- */
  function ls(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
  function detectLang(){
    const chosen = ls('ac_lang');
    if(chosen){ applyLang(chosen, false); return; }
    const cc = ls('ac_country');
    if(cc){ applyLang(cc==='IL' ? 'he' : 'en', false); return; }
    let tz=''; try{ tz = Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(_){}
    const navHe = (navigator.language||'').toLowerCase().indexOf('he')===0;
    applyLang((tz==='Asia/Jerusalem' || navHe) ? 'he' : 'en', false);
    geoLang();
  }
  function geoLang(){
    if(!('fetch' in window)) return;
    const ctrl = ('AbortController' in window) ? new AbortController() : null;
    const timer = ctrl ? setTimeout(()=>{ try{ ctrl.abort(); }catch(_){} }, 2200) : null;
    fetch('https://api.country.is/', ctrl ? {signal:ctrl.signal} : undefined)
      .then(r=> r.ok ? r.json() : Promise.reject())
      .then(d=>{
        const country = d && d.country;
        if(!country) return;
        try{ localStorage.setItem('ac_country', country); }catch(_){}
        if(ls('ac_lang')) return;
        applyLang(country==='IL' ? 'he' : 'en', false);
      })
      .catch(()=>{})
      .finally(()=>{ if(timer) clearTimeout(timer); });
  }

  /* ---------------- theme (shares 'theme' key with the app) ---------------- */
  function applyTheme(t){
    const dark = (t==='dark');
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
    el('themeIco').textContent = dark ? '☀️' : '🌙';
    try{ localStorage.setItem('theme', dark?'dark':'light'); }catch(_){}
  }

  /* ---------------- scroll reveal (robust: a scroll-scan can't "miss" an
     element the way IntersectionObserver can on fast/momentum scrolls) ---------------- */
  function revealScan(){
    const vh = window.innerHeight || document.documentElement.clientHeight || 0;
    document.querySelectorAll('.reveal').forEach(n=>{
      if(n.classList.contains('in')) return;
      // reveal once the element's top has crossed into (or above) the viewport;
      // anything still fully below the fold animates in when scrolled to.
      if(n.getBoundingClientRect().top < vh - 40) n.classList.add('in');
    });
  }
  let revealTick=false;
  function onRevealScroll(){
    if(revealTick) return; revealTick=true;
    requestAnimationFrame(()=>{ revealTick=false; revealScan(); });
  }

  /* ---------------- init ---------------- */
  (function init(){
    let savedTheme='light'; try{ savedTheme=localStorage.getItem('theme')||'light'; }catch(_){}
    applyTheme(savedTheme);

    el('themeToggle').addEventListener('click',()=>{
      applyTheme(document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark');
    });
    window.__setLang=applyLang;

    initMenu();

    const toolsTabs = el('toolsTabs');
    if(toolsTabs){
      toolsTabs.addEventListener('click', e=>{
        const b = e.target.closest('.tab'); if(!b) return;
        toolsTabs.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
        b.classList.add('on');
        const cat = b.getAttribute('data-cat');
        el('toolsAllGrid').querySelectorAll('.tool').forEach(card=>{
          const cats = (card.getAttribute('data-cat')||'').split(' ');
          card.classList.toggle('hide', cat!=='all' && cats.indexOf(cat)===-1);
        });
      });
    }

    window.addEventListener('scroll', onRevealScroll, {passive:true});
    window.addEventListener('resize', onRevealScroll, {passive:true});
    window.addEventListener('load', revealScan);
    revealScan();

    detectLang();

    const nav = document.getElementById('shNav');
    if(nav){
      const onScroll=()=>{ nav.classList.toggle('scrolled', window.scrollY>8); };
      onScroll(); window.addEventListener('scroll',onScroll,{passive:true});
    }
  })();
</script>
