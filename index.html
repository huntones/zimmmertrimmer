<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AudioCut — The Fast Audio Studio in Your Browser</title>
<meta name="description" content="Cut, normalize, convert and batch-process audio right in your browser. BPM & key detection, master presets, ZIP export. Nothing gets uploaded.">
<style>
  :root {
    --bg:#eef0f6; --panel:#ffffff; --panel-2:#f5f6fa; --line:#e5e8f0; --line-2:#eef0f6;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#7c3aed; --accent-dim:#6a2fe0; --accent-ink:#ffffff; --accent-soft:#efe9fe;
    --success:#22b04b; --success-dim:#1c9a41; --success-soft:#e6f6ec;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --danger:#e5484d; --danger-soft:#fdecec;
    --warm-soft:#fff5da; --warm-line:#f2d98a;
    --ok:#22b04b; --warn:#c88a04; --err:#e5484d;
    --grad:linear-gradient(105deg,#8b2fe0 0%,#3b6ff6 52%,#22d3a0 100%);
    --grad-h:linear-gradient(105deg,#7d22d6 0%,#2f63ec 52%,#16c493 100%);
    --grad-soft:linear-gradient(120deg,#efe9fe,#e6f0ff);
    --grad-shadow:rgba(93,79,240,0.30);
    --grad-btn:linear-gradient(105deg,#8b2fe0 0%,#3b6ff6 52%,#22d3a0 100%);
    --grad-btn-glow:rgba(59,111,246,0.38);
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-lg:0 2px 6px rgba(20,24,44,0.05), 0 20px 50px rgba(20,24,44,0.10);
    --shadow-sm:0 1px 2px rgba(20,24,44,0.05);
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --sans:'Space Grotesk',system-ui,'Segoe UI','Heebo',sans-serif;
  }
  html[data-theme="dark"] {
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a303c; --line-2:#232833;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --accent:#a06bff; --accent-dim:#7c3aed; --accent-ink:#ffffff; --accent-soft:#241a3a;
    --success:#37c26a; --success-dim:#2fae5e; --success-soft:#132a1c;
    --info:#5b95f8; --info-dim:#4f8ef7; --info-soft:#182338;
    --danger:#ff6b6b; --danger-soft:#2a1719;
    --warm-soft:#2c2718; --warm-line:#5a4d24;
    --ok:#4ec98a; --warn:#e8b84b; --err:#ff6b6b;
    --grad:linear-gradient(105deg,#9a45f0 0%,#4d7bff 52%,#2fe0ad 100%);
    --grad-h:linear-gradient(105deg,#a659ff 0%,#5d89ff 52%,#48e9bd 100%);
    --grad-soft:linear-gradient(120deg,#1c1633,#11242a);
    --grad-shadow:rgba(77,123,255,0.42);
    --grad-btn:linear-gradient(105deg,#9a45f0 0%,#4d7bff 52%,#2fe0ad 100%);
    --grad-btn-glow:rgba(77,123,255,0.45);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,0.45), 0 24px 60px rgba(0,0,0,0.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;overflow-x:hidden;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--sans);}
  .wrap{max-width:1080px;margin:0 auto;padding:0 22px;}
  .gtext{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}

  /* ---------- top bar ---------- */
  .nav{position:sticky;top:0;z-index:50;backdrop-filter:saturate(1.4) blur(10px);
    background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid transparent;
    transition:border-color .2s,background .2s;}
  .nav.scrolled{border-bottom-color:var(--line);}
  .nav .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px;}
  .brand{display:flex;align-items:center;gap:11px;}
  .brand .logo{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    background:var(--grad);color:#fff;box-shadow:0 4px 12px var(--grad-shadow);flex-shrink:0;}
  .brand .logo svg{width:21px;height:21px;}
  .brand b{font-size:18px;font-weight:700;letter-spacing:-0.01em;}
  .navtools{display:flex;align-items:center;gap:8px;}
  .navlinks{display:flex;gap:4px;margin-inline-end:6px;}
  .navlinks a{padding:8px 12px;border-radius:9px;font-size:13.5px;color:var(--muted);transition:color .12s,background .12s;}
  .navlinks a:hover{color:var(--ink);background:var(--panel-2);}
  .pillbtn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:999px;
    background:var(--panel);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;font-size:13.5px;
    box-shadow:var(--shadow-sm);transition:border-color .12s,transform .08s,background .12s;}
  .pillbtn:hover{border-color:var(--accent);}
  .pillbtn:active{transform:scale(0.97);}
  .iconbtn{width:38px;height:38px;padding:0;justify-content:center;font-size:15px;line-height:1;}

  /* ---------- gradient CTA button ---------- */
  .cta{display:inline-flex;align-items:center;justify-content:center;gap:9px;color:#fff;border:none;cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:600;font-size:15px;padding:13px 26px;border-radius:999px;text-shadow:0 1px 2px rgba(0,0,0,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.14),0 8px 20px var(--grad-btn-glow);
    transition:filter .14s,transform .08s;}
  .cta:hover{filter:brightness(1.06);} .cta:active{transform:translateY(1px);}
  .cta.sm{padding:10px 18px;font-size:14px;}
  .cta.lg{padding:16px 34px;font-size:16.5px;}
  .cta svg{width:18px;height:18px;}
  .ghost{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:999px;font-size:15px;
    font-weight:600;background:var(--panel);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;
    box-shadow:var(--shadow-sm);transition:border-color .12s,transform .08s;}
  .ghost:hover{border-color:var(--accent);} .ghost:active{transform:translateY(1px);}

  /* ---------- hero ---------- */
  .hero{position:relative;text-align:center;padding:74px 0 30px;overflow:hidden;}
  .orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;z-index:-1;pointer-events:none;}
  .orb.a{width:420px;height:420px;background:radial-gradient(circle,#8b2fe0,transparent 66%);top:-120px;inset-inline-start:-90px;}
  .orb.b{width:460px;height:460px;background:radial-gradient(circle,#22d3a0,transparent 66%);top:-60px;inset-inline-end:-120px;opacity:.4;}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-family:var(--mono);color:var(--muted);
    background:var(--panel);border:1px solid var(--line);padding:6px 14px;border-radius:999px;box-shadow:var(--shadow-sm);margin-bottom:22px;}
  .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px var(--success-soft);}
  h1.big{font-size:clamp(34px,6vw,58px);line-height:1.05;letter-spacing:-0.025em;margin:0 auto 18px;max-width:16ch;font-weight:700;}
  .sub{font-size:clamp(16px,2.3vw,19px);color:var(--muted);max-width:56ch;margin:0 auto 30px;line-height:1.6;}
  .herobtns{display:flex;gap:13px;justify-content:center;flex-wrap:wrap;margin-bottom:18px;}
  .trust{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;font-size:12.5px;font-family:var(--mono);color:var(--faint);}
  .trust span{display:inline-flex;align-items:center;gap:6px;}
  .trust svg{width:14px;height:14px;color:var(--success);}

  /* app preview strip under hero */
  .heroshot{margin:44px auto 0;max-width:820px;border-radius:18px;border:1px solid var(--line);background:var(--panel);
    box-shadow:var(--shadow-lg);overflow:hidden;}
  .heroshot .chromebar{display:flex;align-items:center;gap:7px;padding:11px 15px;border-bottom:1px solid var(--line);background:var(--panel-2);}
  .heroshot .chromebar i{width:11px;height:11px;border-radius:50%;background:var(--line);}
  .heroshot .chromebar i:nth-child(1){background:#ff6058;} .heroshot .chromebar i:nth-child(2){background:#ffbd2e;} .heroshot .chromebar i:nth-child(3){background:#28c941;}
  .heroshot .chromebar .u{margin-inline-start:10px;font-family:var(--mono);font-size:11.5px;color:var(--faint);direction:ltr;}
  .fauxdrop{margin:26px;border:1.6px dashed var(--line);border-radius:14px;padding:34px 20px;text-align:center;background:var(--panel-2);}
  .fauxdrop .cloud{width:52px;height:52px;margin:0 auto 12px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);}
  .fauxdrop .cloud svg{width:26px;height:26px;}
  .fauxdrop .big{font-size:15.5px;font-weight:600;}
  .fauxrows{padding:0 26px 26px;display:flex;flex-direction:column;gap:8px;}
  .fauxrow{display:flex;align-items:center;gap:11px;padding:11px 14px;border:1px solid var(--line-2);border-radius:11px;background:var(--panel);}
  .fauxrow .fico{width:26px;height:26px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);}
  .fauxrow .fico svg{width:14px;height:14px;}
  .fauxrow .fn{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start;}
  .fauxrow .tag{font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--panel-2);color:var(--muted);white-space:nowrap;}
  .fauxrow .tag.g{background:var(--success-soft);color:var(--success-dim);}
  .fauxrow .tag.p{background:var(--accent-soft);color:var(--accent);}

  /* ---------- section frame ---------- */
  section{padding:56px 0;}
  .shead{text-align:center;max-width:60ch;margin:0 auto 38px;}
  .kicker{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;}
  .shead h2{font-size:clamp(26px,3.6vw,36px);line-height:1.12;letter-spacing:-0.02em;margin:0 0 12px;font-weight:700;}
  .shead p{font-size:16px;color:var(--muted);margin:0;line-height:1.6;}

  /* generic card + grids */
  .grid{display:grid;gap:16px;}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g4{grid-template-columns:repeat(4,1fr);}
  .g2{grid-template-columns:repeat(2,1fr);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);
    transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;}
  .card.hov:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow-lg);}
  .ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:23px;
    background:var(--grad-soft);margin-bottom:14px;}
  .card h3{font-size:16.5px;font-weight:700;margin:0 0 6px;letter-spacing:-0.01em;}
  .card p{font-size:13.7px;color:var(--muted);margin:0;line-height:1.55;}
  .soonrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px;}
  .soonchip{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);
    background:var(--panel);border:1px dashed var(--line);border-radius:999px;padding:8px 15px;}
  .soonchip b{font-weight:600;color:var(--ink-2);}
  .soonchip .lbl{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--warn);
    background:var(--warm-soft);border:1px solid var(--warm-line);border-radius:6px;padding:1px 6px;}

  /* ---------- steps ---------- */
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;position:relative;}
  .step{text-align:center;padding:26px 20px;}
  .step .num{width:54px;height:54px;margin:0 auto 16px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    font-size:26px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;}
  .step .num small{position:absolute;top:-8px;inset-inline-end:-8px;width:24px;height:24px;border-radius:50%;background:var(--grad);
    color:#fff;font-family:var(--mono);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px var(--grad-shadow);}
  .step h3{font-size:17px;margin:0 0 6px;font-weight:700;}
  .step p{font-size:13.7px;color:var(--muted);margin:0;}

  /* ---------- presets ---------- */
  .presetgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .preset{position:relative;border-radius:15px;padding:20px;border:1px solid var(--line);background:var(--panel);
    overflow:hidden;transition:transform .16s,border-color .16s;cursor:default;}
  .preset:hover{transform:translateY(-3px);border-color:var(--accent);}
  .preset::before{content:'';position:absolute;inset:0 auto 0 0;width:4px;background:var(--grad);}
  .preset .pemoji{font-size:22px;}
  .preset h4{margin:10px 0 4px;font-size:16px;font-weight:700;}
  .preset p{margin:0;font-size:13px;color:var(--muted);}

  /* ---------- batch showcase ---------- */
  .batchbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:var(--shadow);
    display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:center;}
  .bstep{text-align:center;}
  .bstep .bi{font-size:28px;margin-bottom:8px;}
  .bstep .bt{font-size:14px;font-weight:600;}
  .bstep .bs{font-size:12px;color:var(--muted);font-family:var(--mono);}
  .bbar{grid-column:1/-1;height:10px;border-radius:999px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line-2);}
  .bbar i{display:block;height:100%;width:72%;background:var(--grad);border-radius:999px;}

  /* ---------- formats ---------- */
  .fmts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
  .fmt{font-family:var(--mono);font-size:13px;font-weight:600;padding:9px 16px;border-radius:10px;
    background:var(--panel);border:1px solid var(--line);color:var(--ink-2);box-shadow:var(--shadow-sm);}

  /* ---------- comparison ---------- */
  .cmp{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);}
  .cmp th,.cmp td{padding:14px 18px;text-align:start;border-bottom:1px solid var(--line-2);font-size:14px;}
  .cmp thead th{font-size:13px;color:var(--muted);font-weight:600;background:var(--panel-2);}
  .cmp thead th:nth-child(2){color:var(--accent);}
  .cmp tr:last-child td{border-bottom:none;}
  .cmp td:not(:first-child),.cmp th:not(:first-child){text-align:center;width:22%;}
  .cmp .yes{color:var(--success);font-weight:700;} .cmp .no{color:var(--faint);}

  /* ---------- use cases ---------- */
  .uses{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;}
  .use{display:inline-flex;align-items:center;gap:9px;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;
    background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-sm);}
  .use .e{font-size:17px;}

  /* ---------- faq ---------- */
  .faq{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
  details.q{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:4px 20px;box-shadow:var(--shadow-sm);transition:border-color .15s;}
  details.q[open]{border-color:var(--accent);}
  details.q summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:16px 0;font-size:15.5px;font-weight:600;}
  details.q summary::-webkit-details-marker{display:none;}
  details.q summary .chev{width:20px;height:20px;flex-shrink:0;color:var(--muted);transition:transform .2s;}
  details.q[open] summary .chev{transform:rotate(180deg);}
  details.q .ans{padding:0 0 18px;font-size:14px;color:var(--muted);line-height:1.65;}

  /* ---------- final CTA ---------- */
  .final{text-align:center;background:var(--grad-soft);border:1px solid var(--line);border-radius:24px;padding:56px 30px;box-shadow:var(--shadow);}
  .final h2{font-size:clamp(26px,4vw,38px);letter-spacing:-0.02em;margin:0 0 12px;font-weight:700;}
  .final p{font-size:16.5px;color:var(--muted);margin:0 auto 26px;max-width:46ch;}

  /* ---------- footer ---------- */
  footer{border-top:1px solid var(--line);margin-top:56px;padding:34px 0;}
  footer .row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  footer .muted{font-size:13px;color:var(--muted);}
  footer .links{display:flex;gap:18px;font-size:13.5px;}
  footer .links a{color:var(--muted);} footer .links a:hover{color:var(--ink);}

  /* ---------- reveal ---------- */
  .reveal{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease;}
  .reveal.in{opacity:1;transform:none;}

  /* ---------- responsive ---------- */
  @media (max-width:860px){
    .navlinks{display:none;}
    .g4{grid-template-columns:repeat(2,1fr);} .g3{grid-template-columns:repeat(2,1fr);}
    .presetgrid{grid-template-columns:repeat(2,1fr);}
    .batchbox{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:560px){
    .g4,.g3,.g2,.presetgrid,.steps{grid-template-columns:1fr;}
    .hero{padding:52px 0 20px;}
    .brand b{font-size:16px;}
    .cmp th:not(:first-child),.cmp td:not(:first-child){width:auto;}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;} .reveal{transition:none;opacity:1;transform:none;} .card.hov:hover,.preset:hover{transform:none;}
  }
</style>
</head>
<body>

<!-- ===================== NAV ===================== -->
<header class="nav" id="nav">
  <div class="wrap bar">
    <a class="brand" href="#top" aria-label="AudioCut">
      <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path d="M9 18V5l12-2v11"/></svg></span>
      <b>AudioCut</b>
    </a>
    <nav class="navtools">
      <div class="navlinks">
        <a href="#tools" data-i18n="navTools"></a>
        <a href="#presets" data-i18n="navPresets"></a>
        <a href="#why" data-i18n="navWhy"></a>
        <a href="#faq" data-i18n="navFaq"></a>
      </div>
      <button class="pillbtn iconbtn" id="langBtn" type="button" title="עברית / English"><span id="langIco">EN</span></button>
      <button class="pillbtn iconbtn" id="themeToggle" type="button" aria-label="Toggle theme"><span id="themeIco">🌙</span></button>
      <a class="cta sm" href="./app.html"><span data-i18n="navOpen"></span></a>
    </nav>
  </div>
</header>

<main id="top">
<!-- ===================== HERO ===================== -->
<section class="hero">
  <span class="orb a"></span><span class="orb b"></span>
  <div class="wrap">
    <span class="eyebrow"><span class="dot"></span><span data-i18n="heroBadge"></span></span>
    <h1 class="big"><span data-i18n="heroT1"></span> <span class="gtext" data-i18n="heroT2"></span></h1>
    <p class="sub" data-i18n="heroSub"></p>
    <div class="herobtns">
      <a class="cta lg" href="./app.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span data-i18n="heroCta"></span>
      </a>
      <a class="ghost" href="#tools"><span data-i18n="heroCta2"></span></a>
    </div>
    <div class="trust">
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span data-i18n="trust1"></span></span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span data-i18n="trust2"></span></span>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span data-i18n="trust3"></span></span>
    </div>

    <!-- app preview -->
    <div class="heroshot reveal">

      const [h,d]=p[L]; return `<div class="preset"><div class="pemoji">${p.e}</div><h4>${h}</h4><p>${d}</p></div>`;
    }).join('');

    el('fmtGrid').innerHTML = DATA.formats.map(f=>`<span class="fmt">${f}</span>`).join('');

    el('whyGrid').innerHTML = DATA.why.map(w=>{
      const [h,p]=w[L]; return `<div class="card hov"><div class="ico">${w.i}</div><h3>${h}</h3><p>${p}</p></div>`;
    }).join('');

    const y='<span class="yes">✓</span>', n='<span class="no">—</span>';
    el('cmpBody').innerHTML = DATA.compare.map(c=>
      `<tr><td>${c[L]}</td><td>${c.ac?y:n}</td><td>${c.other?y:n}</td></tr>`).join('');

    el('useGrid').innerHTML = DATA.uses.map(u=>
      `<span class="use"><span class="e">${u.e}</span>${u[L]}</span>`).join('');

    el('faqList').innerHTML = DATA.faq.map(f=>{
      const [q,a]=f[L]; return `<details class="q"><summary>${q}${chev}</summary><div class="ans">${a}</div></details>`;
    }).join('');
  }

  function applyLang(l, persist){
    lang = l;
    document.documentElement.lang = l;
    document.documentElement.dir = (l==='he') ? 'rtl' : 'ltr';
    el('langIco').textContent = (l==='he') ? 'EN' : 'עב';
    if(persist){ try{ localStorage.setItem('ac_lang', l); }catch(_){} }
    render();
    revealScan();
  }

  /* ---------------- auto language by region (IL -> he, else en) ----------------
     Offline-first: instant guess from timezone / browser locale, then confirm by
     IP via a tiny free endpoint. A manual toggle (persist=true) always wins. */
  function ls(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
  function detectLang(){
    const chosen = ls('ac_lang');                    // 1) explicit choice wins forever
    if(chosen){ applyLang(chosen, false); return; }
    const cc = ls('ac_country');                     // 2) cached country from a prior lookup
    if(cc){ applyLang(cc==='IL' ? 'he' : 'en', false); return; }
    let tz=''; try{ tz = Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(_){}
    const navHe = (navigator.language||'').toLowerCase().indexOf('he')===0;
    applyLang((tz==='Asia/Jerusalem' || navHe) ? 'he' : 'en', false);  // 3) instant offline guess
    geoLang();                                        // 4) confirm by IP when online
  }
  function geoLang(){
    if(!('fetch' in window)) return;
    const ctrl = ('AbortController' in window) ? new AbortController() : null;
    const timer = ctrl ? setTimeout(()=>{ try{ ctrl.abort(); }catch(_){} }, 2200) : null;
    fetch('https://api.country.is/', ctrl ? {signal:ctrl.signal} : undefined)
      .then(r=> r.ok ? r.json() : Promise.reject())
      .then(d=>{
        const country = d && d.country;
        if(!country) return;
        try{ localStorage.setItem('ac_country', country); }catch(_){}
        if(ls('ac_lang')) return;                     // user picked in the meantime
        applyLang(country==='IL' ? 'he' : 'en', false);
      })
      .catch(()=>{})
      .finally(()=>{ if(timer) clearTimeout(timer); });
  }

  /* ---------------- theme (shares 'theme' key with the app) ---------------- */
  function applyTheme(t){
    const dark = (t==='dark');
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
    el('themeIco').textContent = dark ? '☀️' : '🌙';
    try{ localStorage.setItem('theme', dark?'dark':'light'); }catch(_){}
  }

  /* ---------------- scroll reveal ---------------- */
  let io;
  function revealScan(){
    document.querySelectorAll('.reveal').forEach(n=>{
      if(n.classList.contains('in')) return;
      if(io) io.observe(n);
    });
  }

  /* ---------------- init ---------------- */
  (function init(){
    let savedTheme='light'; try{ savedTheme=localStorage.getItem('theme')||'light'; }catch(_){}
    applyTheme(savedTheme);

    el('themeToggle').addEventListener('click',()=>{
      applyTheme(document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark');
    });
    el('langBtn').addEventListener('click',()=>applyLang(lang==='he'?'en':'he', true));

    // observer for reveal-on-scroll
    if('IntersectionObserver' in window){
      io = new IntersectionObserver((entries)=>{
        entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
      },{rootMargin:'0px 0px -8% 0px', threshold:0.05});
    } else {
      document.querySelectorAll('.reveal').forEach(n=>n.classList.add('in'));
    }

    detectLang(); // picks language by region, then renders + scans reveals

    // sticky nav border
    const nav = el('nav');
    const onScroll=()=>{ nav.classList.toggle('scrolled', window.scrollY>8); };
    onScroll(); window.addEventListener('scroll',onScroll,{passive:true});
  })();
</script>
</body>
</html>
