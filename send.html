  // ---- create link ----

  // Mirror a just-saved package to the server (Supabase). No-op until configured.
  function mirrorSendRemote(record){
    try{
      if(!(window.KolkliDB && KolkliDB.enabled())) return;
      var token=record.token;
      var meta=Object.assign({}, record);
      meta.files=(record.files||[]).map(function(f,i){ var id=f.id||('sf'+i); return { id:id, name:f.name, size:f.size, type:f.type||'', storagePath:'send/'+token+'/'+id }; });
      KolkliDB.pushProject('send', token, meta, 'active');
      (record.files||[]).forEach(function(f,i){ var id=f.id||('sf'+i); if(f.blob) KolkliDB.uploadBlob('send', token, id, f.blob); });
    }catch(_){}
  }
  // Cross-device reopen: pull a package (and its bytes) from the server when it isn't local.
  async function loadSendRemote(token){
    try{
      if(!(window.KolkliDB && KolkliDB.enabled())) return null;
      var meta=await KolkliDB.pullToken('send', token);
      if(!meta || !Array.isArray(meta.files)) return null;
      for(var i=0;i<meta.files.length;i++){ var f=meta.files[i]; try{ var b=await KolkliDB.downloadBlob('send', token, f.id); if(b) f.blob=b; }catch(_){} }
      try{ await idbPut('t_'+token, meta); }catch(_){}
      return meta;
    }catch(_){ return null; }
  }

  async function createLink(){
    el('optErr').textContent='';
    if(!files.length){ el('optErr').textContent=t.errNoFiles; goStep(1); return; }
    const senderEmail=(el('senderEmail').value||'').trim();
    const recipEmail=(el('recipients').value||'').trim();
    const recipName=(el('recipientName')&&el('recipientName').value.trim())||'';
    const pwOn=!!sendDefaults.pw, pwVal=sendDefaults.pwVal||'';
    // in edit mode a blank password field keeps the existing (hashed) password
    const keepingPw = !!(editToken && editBase && editBase.password);
    if(pwOn && !pwVal && !keepingPw){ el('optErr').textContent=t.errNoPw; return; }
    const notifyOn=!!sendDefaults.notify;

    const prog=el('progCard');
    let result=null;
    try{
      result = await withUsage('send-files', { files:files.length, totalBytes:totalBytes() }, async()=>{
        // fake-but-real progress while we write blobs to IndexedDB
        el('wizard').style.display='none';
        showSwitch(false);
        prog.classList.add('show');
        setProg(0);
        prog.scrollIntoView({behavior:'smooth',block:'center'});
        const days=+(EXP_ALLOWED.includes(String(sendDefaults.expiry))?sendDefaults.expiry:'7');
        const editing=!!editToken;
        const token = editing ? editToken : randToken();
        const createdAt = (editing && editBase && editBase.createdAt) ? editBase.createdAt : Date.now();
        // password: hash the newly typed value, else keep the existing hash on edit
        const password = pwOn ? (pwVal ? await hashPass(pwVal) : (editing && editBase ? (editBase.password||null) : null)) : null;
        const record={
          token, ownerId:currentOwnerId(), createdAt, expiresAt:Date.now()+days*86400000,
          sender:senderEmail,
          recipient: recipEmail,
          recipientName: recipName,
          subject: el('subject') ? el('subject').value.trim() : '',
          message:el('message').value.trim(),
          recipients: recipEmail,
          password,
          notify: notifyOn,
          allowZip: sendDefaults.allowZip!==false,
          disabled: (editing && editBase) ? !!editBase.disabled : false,
          downloads: (editing && editBase) ? (editBase.downloads||0) : 0,
          files: files.map((f,i)=>({ id:'sf'+i, name:(f.folder ? f.folder+'/'+f.name : (f.path||f.name)), size:f.size, type:f.file.type||'', blob:f.file })),
        };
        record.brand = brandForRecord();
        // preserve the project number across edits; assign a fresh one only for new sends
        if(editing && editBase && (editBase.projectNumber||editBase.project_number)){
          record.projectNumber = editBase.projectNumber;
          record.project_number = editBase.project_number;
        } else if(window.KolkliProjectNumbers){
          await KolkliProjectNumbers.assign('send', record);
        }

        const total=Math.max(totalBytes(),1); let done=0;
        // animate progress proportional to file sizes (purely visual for the demo)
        for(let i=0;i<files.length;i++){
          await new Promise(r=>setTimeout(r, 120));
          done+=files[i].size; setProg(Math.min(99, Math.round(done/total*100)));
        }
        slog("save:begin", { token: token, files: record.files.length, bytes: totalBytes() });
        // 1) write the file bytes to storage (IndexedDB in the local demo)
        await idbPut('t_'+token, record);
        // 2) verify the bytes are actually persisted BEFORE creating the index record;
        //    a failed/evicted write would otherwise leave a phantom card with no files
        //    (exactly the "files vanished after refresh" symptom).
        let verifyOk=false;
        try{
          const back=await idbGet('t_'+token);
          const savedBlobs=(back && Array.isArray(back.files)) ? back.files.filter(f=>f && f.blob).length : 0;
          verifyOk = !!back && savedBlobs===record.files.length;
          slog("save:verify", { ok: verifyOk, expected: record.files.length, stored: savedBlobs });
        }catch(e){ serr("save:verify", e); }
        if(!verifyOk){ throw new Error("storage_verify_failed"); }
        // 3) only now record the lightweight index entry the dashboard reads
        upsertSendIndex(record);
        mirrorSendRemote(record);
        slog("save:indexed", { token: token, ownerId: record.ownerId });
        setProg(100);
        await new Promise(r=>setTimeout(r,200));
        return { token, days, record };
      });
    }catch(err){
      prog.classList.remove('show');
      el('wizard').style.display='';
      showSwitch(true);
      if(err && err.usage) return;
      if(err && err.message==="storage_verify_failed"){
        serr("save:failed", err);
        el("optErr").textContent = lang==="he" ? "שמירת הקבצים נכשלה (ייתכן שאין מספיק מקום פנוי). נסו שוב." : "Saving the files failed (storage may be full). Please try again.";
        return;
      }
      if(err && err.message==='project_number_allocation_failed'){
        el('optErr').textContent = lang==='he' ? 'לא ניתן להקצות מספר פרויקט כרגע. נסו שוב.' : 'Could not allocate a project number. Please try again.';
        return;
      }
      throw err;
    }

    prog.classList.remove('show');
    showShare(result.token, result.days, pwOn, notifyOn, result.record);
    if(editToken){ toast(t.editToast); editToken=null; editBase=null; syncSendChrome(); }
    // link flow: the recipient can be emailed via the "Open email" button on the share screen
  }
  function setProg(p){
    el('progBar').style.width=p+'%'; el('progPct').textContent=p+'%';
    const msg=el('progMsg');
    if(msg && t && Array.isArray(t.upStages)){
      let cur=t.upStages[0][1];
      for(const [thr,txt] of t.upStages){ if(p>=thr) cur=txt; }
      msg.textContent=cur;
    }
  }

  let currentToken=null, currentUrl='', currentDays=7, statTimer=null, notifyEnabled=false, lastNotifiedCount=0, bc=null;
  function showShare(token, days, pwOn, notifyOn, record){
    currentToken=token; currentDays=days;
    const url=new URL('download?t='+token, location.href).href;
    currentUrl=url;
    el('shareLink').textContent=url;
    el('previewLink').href=url;
    const num=(window.KolkliProjectNumbers && record) ? KolkliProjectNumbers.display('send', record, lang) : '';
    el('shareChips').innerHTML =
      (num ? `<span class="chip">${escapeHtml(num)}</span>` : '')+
      `<span class="chip">${clockSvg()} ${t.chipExpiry(expiryText(days))}</span>`+
      `<span class="chip">${fileSvg()} ${t.chipFiles(files.length)}</span>`+
      (pwOn? `<span class="chip">${lockSvg()} ${t.chipPw}</span>` : '');
    renderQR(url);
    el('emailBtn').classList.toggle('hidden', !el('recipients').value.trim());
    lastNotifiedCount=0;
    updateStat(0);
    startStatWatch(notifyOn);
    el('shareCard').classList.add('show');
    el('shareCard').scrollIntoView({behavior:'smooth',block:'center'});
  }

  // ---- QR code ----
  function renderQR(url){
    const box=el('qrBox'), wrap=el('qrWrap');
    try{
      const qr=qrcode(0,'M'); qr.addData(url); qr.make();
      box.innerHTML=qr.createImgTag(5,10);
      const img=box.querySelector('img'); if(img) img.alt='QR';
      box._png=qr.createDataURL(8,10);
      wrap.style.display='';
    }catch(_){ wrap.style.display='none'; }
  }
  function downloadQR(){
    const png=el('qrBox')._png; if(!png) return;
    const a=document.createElement('a'); a.href=png; a.download='kolkli-qr.png'; document.body.appendChild(a); a.click(); a.remove();
  }

  // ---- email delivery (opens the sender's mail app, prefilled) ----
  function buildMailto(){
    const to=encodeURIComponent(el('recipients').value.trim());
    const msg=el('message').value.trim();
    const subject=encodeURIComponent((el('subject')&&el('subject').value.trim())||t.emailSubject);
    const body=encodeURIComponent((msg? msg+'\n\n':'')+t.emailBodyLead+'\n'+currentUrl+'\n\n'+t.emailBodyExpiry(expiryText(currentDays)));
    let url='mailto:'+to+'?subject='+subject+'&body='+body;
    // "send a copy to myself" → blind-copy the sender's own address
    const self=(el('senderEmail').value||'').trim();
    if(sendDefaults.copySelf && self) url+='&bcc='+encodeURIComponent(self);
    return url;
  }
  function openMailto(){ const a=document.createElement('a'); a.href=buildMailto(); a.style.display='none'; document.body.appendChild(a); a.click(); a.remove(); }

  // ---- live download stats + notifications ----
  function updateStat(count){
    const line=el('statLine');
    line.classList.toggle('live', count>0);
    line.innerHTML=`<span class="dot"></span><span>${count>0? t.statDownloads(count) : t.statWaiting}</span>`;
    line.dataset.count=count;
  }
  function fireNotify(){
    const count=+el('statLine').dataset.count||0;
    if(count<=lastNotifiedCount) return; lastNotifiedCount=count;
    try{ if('Notification'in window && Notification.permission==='granted') new Notification(t.notifTitle,{body:t.notifBody}); }catch(_){}
    toast(t.notifTitle);
  }
  function onDownloadCount(count){
    const prev=+el('statLine').dataset.count||0;
    if(count===prev) return;
    updateStat(count);
    if(count>prev && notifyEnabled) fireNotify();
  }
  function ensureBC(){
    if(bc || !('BroadcastChannel'in window)) return;
    try{ bc=new BroadcastChannel('audiocut_dl'); bc.onmessage=e=>{ const d=e.data||{}; if(d.token && d.token===currentToken && typeof d.downloads==='number') onDownloadCount(d.downloads); }; }catch(_){}
  }
  function startStatWatch(notifyOn){
    notifyEnabled=!!notifyOn; ensureBC(); stopStatWatch();
    statTimer=setInterval(async()=>{
      if(!currentToken) return;
      let rec=null; try{ rec=await idbGet('t_'+currentToken); }catch(_){}
      if(rec) onDownloadCount(rec.downloads||0);
    },4000);
  }
  function stopStatWatch(){ if(statTimer){ clearInterval(statTimer); statTimer=null; } }
  function clockSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>'; }
  function fileSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2v6h6"/><path d="M4 2h10l6 6v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/></svg>'; }
  function lockSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'; }

  function reset(){
    files=[]; folders=[]; currentToken=null; editToken=null; editBase=null;
    stopStatWatch(); notifyEnabled=false; lastNotifiedCount=0;
    el('shareCard').classList.remove('show');
    el('message').value=''; el('recipients').value=''; if(window.renderRecipChips) renderRecipChips(); if(el('subject')) el('subject').value='';
    if(el('recipientName')) el('recipientName').value='';
    el('senderEmail').value=''; syncSenderEmail();
    el('emailBtn').classList.add('hidden');
    applyDefaultsToUI();   // restore saved defaults (expiry / password / notify / copy-to-self / zip)
    el('wizard').style.display=''; renderFiles(); syncSendChrome(); goStep(1);
    window.scrollTo({top:0,behavior:'smooth'});
  }

  // Swap the composer's kicker / title / subtitle and the primary button between
  // "new send" and "edit send" wording. Re-applied after every applyLang() (which
  // repaints the default i18n text) so the edit chrome survives a language switch.
  function syncSendChrome(){
    const editing=!!editToken;
    const head=document.querySelector('.pagehead');
    if(head){
      const k=head.querySelector('.kick'), h=head.querySelector('h2'), p=head.querySelector('p');
      if(k) k.textContent = editing ? t.editKick  : t.kick;
      if(h) h.textContent = editing ? t.editTitle : t.pageTitle;
      if(p) p.textContent = editing ? t.editSub   : t.pageSub;
    }
    const sb=el('sendBtn') && el('sendBtn').querySelector('[data-i18n="sendBtn"]');
    if(sb) sb.textContent = editing ? t.saveEditBtn : t.sendBtn;
  }

  // Load an existing send into the composer for editing. Pulls the full record
  // (with file blobs) from IndexedDB, falling back to the lightweight index entry,
  // and pre-fills recipients, message, expiry, password state, notify and files.
  // createLink() then updates this token in place instead of minting a new one.
  async function enterEditMode(token){
    let rec=null, fromIdb=false;
    try{ rec = await idbGet('t_'+token); fromIdb=!!rec; }catch(e){ serr("reopen:idbGet", e); }
    if(!rec){ rec = sendIndex().find(x=>x.token===token) || null; }
    if(!rec){ rec = await loadSendRemote(token); }
    slog("reopen", { token: token, found: !!rec, fromIndexedDB: fromIdb, hasBlobs: !!(rec && Array.isArray(rec.files) && rec.files.some(f=>f && f.blob)) });
    if(!rec){ slog("reopen:miss", token); return; }   // unknown token -> stay on the new-send form
    editToken=token; editBase=rec;

    const to=(rec.recipient||rec.recipients||'').trim();
    syncSenderEmail();
    if(el('recipientName')) el('recipientName').value=rec.recipientName||'';
    if(el('recipients')) el('recipients').value=to;
    if(window.renderRecipChips) renderRecipChips();
    if(el('subject')) el('subject').value=rec.subject||'';
    if(el('message')) el('message').value=rec.message||'';

    // snap the saved lifespan to the closest expiry option the form offers
    let snapExpiry=String(sendDefaults.expiry||'7');
    if(rec.expiresAt && rec.createdAt){
      const savedDays=Math.round((rec.expiresAt-rec.createdAt)/86400000);
      const allowed=EXP_ALLOWED.map(Number);
      const snap=allowed.reduce((a,b)=>Math.abs(b-savedDays)<Math.abs(a-savedDays)?b:a, allowed[0]);
      snapExpiry=String(snap);
    }

    // only the password hash is stored, so keep protection ON with a blank field —
    // a blank field on save preserves the existing password (see createLink)
    const hasPw=!!rec.password;
    sendDefaults.expiry=snapExpiry; sendDefaults.pw=hasPw; sendDefaults.pwVal='';
    sendDefaults.notify=!!rec.notify; sendDefaults.allowZip=(rec.allowZip!==false);
    saveDefaults(); applyDefaultsToUI();

    // rebuild the file picker from the stored blobs (index-only records carry none)
    files=[];
    const items=(Array.isArray(rec.files)?rec.files:[]).filter(f=>f && f.blob).map(f=>({
      file:new File([f.blob], String(f.name||'file').split('/').pop()||'file', {type:f.type||''}),
      path:f.name||''
    }));
    addFiles(items);   // renders the list + enables the save button
    slog("reopen:rehydrated", { token: token, files: items.length });
    if(!items.length){ slog("reopen:no-blobs", "index entry has no stored file bytes for token "+token+" (created without a completed upload, or on another browser?)"); }

    renderAdvSummary();
    syncSendChrome();
    goStep(1);
  }

  // ---- i18n + theme ----
  function applyLang(l){
    lang=l; t=I18N[l];
    document.documentElement.lang=l; document.documentElement.dir=t.dir;
    document.querySelectorAll('[data-i18n]').forEach(n=>{ const k=n.getAttribute('data-i18n'); if(typeof t[k]==='string') n.textContent=t[k]; });
    document.querySelectorAll('[data-i18n-ph]').forEach(n=>{ const k=n.getAttribute('data-i18n-ph'); if(typeof t[k]==='string') n.setAttribute('placeholder',t[k]); });
    document.querySelectorAll('[data-i18n-title]').forEach(n=>{ const k=n.getAttribute('data-i18n-title'); if(typeof t[k]==='string'){ n.setAttribute('title',t[k]); n.setAttribute('aria-label',t[k]); } });
    try{ localStorage.setItem('ac_lang', l); }catch(_){}
    renderFiles();
    if(el('bprevName')) renderBrandUI();
    renderAdvSummary();
    syncSendChrome();
  }
  function ls(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
  function detectLang(){
    const chosen=ls('ac_lang'); if(chosen) return chosen;
    const cc=ls('ac_country'); if(cc) return cc==='IL'?'he':'en';
    let tz=''; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(_){}
    const navHe=(navigator.language||'').toLowerCase().indexOf('he')===0;
    return (tz==='Asia/Jerusalem'||navHe)?'he':'en';
  }
  function applyTheme(th){
    const dark=(th==='dark');
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
    el('themeIco').textContent = dark?'☀️':'🌙';
    try{ localStorage.setItem('theme', dark?'dark':'light'); }catch(_){}
  }

  // ---- events ----
  const drop=el('drop'), input=el('fileInput'), folderInput=el('folderInput');
  el('chooseBtn').addEventListener('click',e=>{ e.stopPropagation(); input.click(); });
  el('chooseFolderBtn').addEventListener('click',e=>{ e.stopPropagation(); folderInput.click(); });
  drop.addEventListener('click',()=>input.click());
  input.addEventListener('change',()=>{ addFiles(pathItems(input.files), true); input.value=''; });
  folderInput.addEventListener('change',()=>{ addFiles(pathItems(folderInput.files), true); folderInput.value=''; });
  ;['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.add('over'); }));
  ;['dragleave','dragend'].forEach(ev=>drop.addEventListener(ev,()=>drop.classList.remove('over')));
  drop.addEventListener('drop',e=>{ e.preventDefault(); drop.classList.remove('over'); if(e.dataTransfer) addFromDataTransfer(e.dataTransfer); });
  document.addEventListener('dragover',e=>{ if(e.dataTransfer && Array.from(e.dataTransfer.types||[]).includes('Files')) e.preventDefault(); });
  document.addEventListener('drop',e=>{ if(e.target!==drop && e.dataTransfer && Array.from(e.dataTransfer.types||[]).includes('Files')) e.preventDefault(); });

  el('flist').addEventListener('click',e=>{ const b=e.target.closest('[data-rm]'); if(b) removeFile(b.getAttribute('data-rm')); });

  // ----- staging: drag-reorder + folder assignment + new folder -----
  let dragId=null;
  function reorderFiles(from,to){
    if(from===to) return;
    const fi=files.findIndex(x=>x.id===from); if(fi<0) return;
    const [m]=files.splice(fi,1);
    const ti=files.findIndex(x=>x.id===to);
    files.splice(ti<0?files.length:ti,0,m);
    renderFiles();
  }
  el('flist').addEventListener('dragstart',e=>{ const row=e.target.closest('[data-id]'); if(!row) return; dragId=row.getAttribute('data-id'); row.classList.add('dragging'); if(e.dataTransfer){ e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain',dragId); }catch(_){} } });
  el('flist').addEventListener('dragend',()=>{ document.querySelectorAll('#flist .dragging').forEach(x=>x.classList.remove('dragging')); dragId=null; });
  el('flist').addEventListener('dragover',e=>{ if(dragId){ e.preventDefault(); if(e.dataTransfer) e.dataTransfer.dropEffect='move'; } });
  el('flist').addEventListener('drop',e=>{ if(!dragId) return; e.preventDefault(); const row=e.target.closest('[data-id]'); if(row) reorderFiles(dragId, row.getAttribute('data-id')); });
  el('flist').addEventListener('change',e=>{ const sel=e.target.closest('[data-folder]'); if(!sel) return; const f=files.find(x=>x.id===sel.getAttribute('data-folder')); if(f){ f.folder=sel.value||''; renderFiles(); } });
  el('newFolderBtn').addEventListener('click',()=>{ const name=(prompt(t.newFolderPrompt)||'').trim().replace(/[\\/]+/g,''); if(!name) return; if(!folders.includes(name)) folders.push(name); renderFiles(); toast(t.newFolderMade); });

  // ----- wizard step navigation -----
  document.querySelectorAll('.wz-tab, .wz-back').forEach(b=>b.addEventListener('click',()=>{ const g=b.getAttribute('data-goto'); if(g) goStep(+g); }));
  el('toStep2').addEventListener('click',()=>goStep(2));
  el('toStep3').addEventListener('click',()=>goStep(3));
  el('qsMore').addEventListener('click',openAdv);
  el('cvDetails').addEventListener('toggle',()=>{ if(el('cvDetails').open) mountClientPreview(); });

  // ----- quick settings (mirror the advanced modal via sendDefaults) -----
  el('qsExpiry').addEventListener('change',e=>{ sendDefaults.expiry=e.target.value; saveDefaults(); applyDefaultsToUI(); refreshClientPreview(); });
  el('qsPw').addEventListener('change',e=>{ sendDefaults.pw=e.target.checked; saveDefaults(); applyDefaultsToUI(); if(e.target.checked && el('qsPassword')) el('qsPassword').focus(); refreshClientPreview(); });
  el('qsPassword').addEventListener('input',()=>{ sendDefaults.pwVal=el('qsPassword').value; saveDefaults(); if(el('password')&&document.activeElement!==el('password')) el('password').value=sendDefaults.pwVal; });
  el('qsZip').addEventListener('change',e=>{ sendDefaults.allowZip=e.target.checked; saveDefaults(); applyDefaultsToUI(); });
  el('qsNotify').addEventListener('change',e=>{ sendDefaults.notify=e.target.checked; saveDefaults(); applyDefaultsToUI(); askNotify(e.target.checked); });
  el('zipToggle').addEventListener('change',e=>{ sendDefaults.allowZip=e.target.checked; saveDefaults(); applyDefaultsToUI(); });
  el('vtoggle').addEventListener('click',e=>{ const b=e.target.closest('[data-view]'); if(!b) return; view=b.getAttribute('data-view'); try{ localStorage.setItem('kolkli_send_view',view); }catch(_){} renderFiles(); });
  el('viewSwitch').addEventListener('click',e=>{ const b=e.target.closest('.vsw-btn'); if(!b) return; setViewMode(b.getAttribute('data-mode')); });
  // the preview's file buttons are illustrative only — a real download happens once the link is sent
  el('cvPage').addEventListener('click',e=>{ if(e.target.closest('button')){ e.preventDefault(); toast((CV_I18N[lang]||CV_I18N.en).previewOnly); } });

  // ===== recipient email chips =====
  // #recipients stays the canonical comma-joined value every downstream reader
  // uses; #recipInput is the visible field and each address becomes a removable
  // chip. Comma / semicolon / Enter (and blur / multi-value paste) tokenise.
  (function(){
    const hidden=el('recipients'), box=el('recipTok'), input=el('recipInput');
    if(!hidden || !box || !input) return;
    const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    let recips=[];
    function sync(){ hidden.value=recips.join(', '); hidden.dispatchEvent(new Event('input',{bubbles:true})); }
    function paint(){
      box.querySelectorAll('.tok-chip').forEach(c=>c.remove());
      recips.forEach((addr,i)=>{
        const chip=document.createElement('span');
        chip.className='tok-chip'+(EMAIL_RE.test(addr)?'':' tok-bad');
        const m=document.createElement('span'); m.className='tok-mail'; m.textContent=addr; chip.appendChild(m);
        const x=document.createElement('button'); x.type='button'; x.className='tok-x'; x.setAttribute('aria-label','remove'); x.innerHTML='&times;';
        x.addEventListener('click',()=>{ recips.splice(i,1); paint(); sync(); input.focus(); });
        chip.appendChild(x);
        box.insertBefore(chip,input);
      });
      // keep the i18n placeholder attribute intact; just hide it once chips exist
      box.classList.toggle('has-chips', recips.length>0);
    }
    function addTokens(raw){
      let added=false;
      String(raw).split(/[,;\s]+/).map(s=>s.trim()).filter(Boolean).forEach(p=>{
        if(!recips.some(r=>r.toLowerCase()===p.toLowerCase())){ recips.push(p); added=true; }
      });
      if(added){ paint(); sync(); }
      return added;
    }
    function commit(){ if(input.value.trim()){ addTokens(input.value); input.value=''; } }
    input.addEventListener('keydown',e=>{
      if(e.key===','||e.key===';'||e.key==='Enter'){ e.preventDefault(); commit(); }
      else if(e.key==='Backspace' && !input.value && recips.length){ recips.pop(); paint(); sync(); }
    });
    input.addEventListener('blur',commit);
    input.addEventListener('paste',e=>{
      const txt=((e.clipboardData||window.clipboardData)||{}).getData ? (e.clipboardData||window.clipboardData).getData('text') : '';
      if(txt && /[,;\s]/.test(txt)){ e.preventDefault(); addTokens(txt); }
    });
    box.addEventListener('mousedown',e=>{ if(e.target===box){ e.preventDefault(); input.focus(); } });
    // rebuild chips from whatever the hidden input currently holds (edit / reset / restore)
    window.renderRecipChips=function(){
      recips=String(hidden.value||'').split(/[,;]+/).map(s=>s.trim()).filter(Boolean);
      paint();
    };
    renderRecipChips();
  })();

  function setMethod(m){ method=(m==='email')?'email':'link'; }
  el('pwToggle').addEventListener('change',e=>{
    el('password').classList.toggle('hidden', !e.target.checked); if(e.target.checked) el('password').focus();
    sendDefaults.pw=e.target.checked; saveDefaults(); renderAdvSummary();
  });
  el('password').addEventListener('input',()=>{ sendDefaults.pwVal=el('password').value; saveDefaults(); });
  el('expiry').addEventListener('change',()=>{ sendDefaults.expiry=el('expiry').value; saveDefaults(); renderAdvSummary(); });
  function askNotify(on){
    if(!on) return;
    if('Notification'in window){
      if(Notification.permission==='granted') toast(t.notifOn);
      else if(Notification.permission==='denied') toast(t.notifBlocked);
      else Notification.requestPermission().then(p=>{ toast(p==='granted'? t.notifOn : t.notifBlocked); });
    } else { toast(t.notifOn); }
  }
  el('notifyToggle').addEventListener('change',e=>{
    sendDefaults.notify=e.target.checked; saveDefaults(); applyDefaultsToUI(); askNotify(e.target.checked);
  });
  el('copySelfToggle').addEventListener('change',e=>{ sendDefaults.copySelf=e.target.checked; saveDefaults(); renderAdvSummary(); });

  // ---- advanced-settings popup ----
  const advOverlay=el('advOverlay');
  function openAdv(){ advOverlay.classList.add('open'); document.body.style.overflow='hidden'; }
  function closeAdv(){ advOverlay.classList.remove('open'); document.body.style.overflow=''; renderAdvSummary(); }
  el('advClose').addEventListener('click',closeAdv);
  el('advDone').addEventListener('click',closeAdv);
  advOverlay.addEventListener('mousedown',e=>{ if(e.target===advOverlay) closeAdv(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape' && advOverlay.classList.contains('open')) closeAdv(); });
  el('qrDlBtn').addEventListener('click',downloadQR);
  el('emailBtn').addEventListener('click',openMailto);

  buildSwatches();
  el('logoTile').addEventListener('click',()=>el('logoInput').click());
  el('bgTile').addEventListener('click',()=>el('bgInput').click());
  el('logoInput').addEventListener('change',async()=>{ const f=el('logoInput').files[0]; el('logoInput').value=''; if(!f)return; try{ brand.logo=await readImageScaled(f,400,200,'image/png',0.92); saveBrand(); renderBrandUI(); }catch(_){ toast(t.brandImgErr); } });
  el('bgInput').addEventListener('change',async()=>{ const f=el('bgInput').files[0]; el('bgInput').value=''; if(!f)return; try{ brand.bg=await readImageScaled(f,1600,1000,'image/jpeg',0.82); saveBrand(); renderBrandUI(); }catch(_){ toast(t.brandImgErr); } });
  el('logoX').addEventListener('click',e=>{ e.stopPropagation(); brand.logo=''; saveBrand(); renderBrandUI(); });
  el('bgX').addEventListener('click',e=>{ e.stopPropagation(); brand.bg=''; saveBrand(); renderBrandUI(); });
  el('brandName').addEventListener('input',()=>{ brand.name=el('brandName').value; saveBrand(); renderBrandUI(); });
  el('brandTagline').addEventListener('input',()=>{ brand.tagline=el('brandTagline').value; saveBrand(); renderBrandUI(); });

  el('sendBtn').addEventListener('click',createLink);
  el('againBtn').addEventListener('click',reset);
  el('delBtn').addEventListener('click',async()=>{ if(currentToken){ await idbDel('t_'+currentToken); deleteSendIndex(currentToken); if(window.KolkliDB && KolkliDB.enabled()) KolkliDB.deleteProject('send', currentToken); } reset(); });
  el('copyBtn').addEventListener('click',()=>{
    const url=el('shareLink').textContent;
    const done=()=>toast(t.copied);
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done).catch(fallbackCopy); }
    else fallbackCopy();
    function fallbackCopy(){ const ta=document.createElement('textarea'); ta.value=url; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(_){}; ta.remove(); done(); }
  });

  window.__setLang=applyLang;
  el('pageBackBtn').addEventListener('click',()=>{ if(history.length>1) history.back(); else location.href='./dashboard'; });
  el('themeToggle').addEventListener('click',()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));
  // keep the branding gate + locked sender email in sync when the user logs in/out or switches plan
  window.addEventListener('kolkli:auth',()=>{ applyBrandGate(); syncSenderEmail(); });
  window.addEventListener('storage',e=>{ if(!e.key||e.key==='ac_session'||e.key==='ac_plan'||e.key==='ac_users'){ applyBrandGate(); syncSenderEmail(); } });

  // ---- init ----
  try{ if(window.KolkliOwnerMigrate) window.KolkliOwnerMigrate.run(); }catch(_){}
  applyTheme(ls('theme')||'light');
  applyLang(detectLang());
  renderFiles();
  applyBrandGate();
  syncSenderEmail();
  applyDefaultsToUI();
  // reopen an existing send for editing when arrived via the dashboard's "ערוך שליחת קבצים"
  const _editParam = new URLSearchParams(location.search).get('edit');
  if(_editParam){ enterEditMode(_editParam); }
})();
</script>
