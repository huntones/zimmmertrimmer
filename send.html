<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOLKLI — שליחת קבצים גדולים</title>
<link rel="canonical" href="https://kolkli.com/send">
<meta name="description" content="Send large files with a shareable link — set an expiry, add a password and a message. Recipient gets a clean download page.">
<style>
  :root {
    --bg:#f6f4ff; --panel:#ffffff; --panel-2:#f5f6fa; --line:#e5e8f0; --line-2:#eef0f6;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#6f3afb; --accent-dim:#5a24e0; --accent-ink:#ffffff; --accent-soft:#f0ebfe;
    --success:#22b04b; --success-dim:#1c9a41; --success-soft:#e6f6ec;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --danger:#e5484d; --danger-soft:#fdecec;
    --warm-soft:#fff5da; --warm-line:#f2d98a;
    --ok:#22b04b; --warn:#c88a04; --err:#e5484d;
    --grad:linear-gradient(105deg,#8b5cfb 0%,#6f3afb 100%);
    --grad-h:linear-gradient(105deg,#6f3afb 0%,#5a24e0 100%);
    --grad-soft:linear-gradient(120deg,#f0ebfe,#e7ddff);
    --grad-shadow:rgba(111,58,251,0.30);
    --grad-btn:linear-gradient(105deg,#8b5cfb 0%,#6f3afb 100%);
    --grad-btn-glow:rgba(111,58,251,0.34);
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-lg:0 2px 6px rgba(20,24,44,0.05), 0 20px 50px rgba(20,24,44,0.10);
    --shadow-sm:0 1px 2px rgba(20,24,44,0.05);
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --sans:'Overpass','Rubik',system-ui,'Segoe UI',sans-serif;
  }
  html[data-theme="dark"] {
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a303c; --line-2:#232833;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --accent:#8b5cfb; --accent-dim:#6f3afb; --accent-ink:#ffffff; --accent-soft:#241a3a;
    --success:#37c26a; --success-dim:#2fae5e; --success-soft:#132a1c;
    --info:#5b95f8; --info-dim:#4f8ef7; --info-soft:#182338;
    --danger:#ff6b6b; --danger-soft:#2a1719;
    --warm-soft:#2c2718; --warm-line:#5a4d24;
    --ok:#4ec98a; --warn:#e8b84b; --err:#ff6b6b;
    --grad:linear-gradient(105deg,#8b5cfb 0%,#6f3afb 100%);
    --grad-h:linear-gradient(105deg,#a375ff 0%,#8b5cfb 100%);
    --grad-soft:linear-gradient(120deg,#241a3a,#1c1430);
    --grad-shadow:rgba(139,92,251,0.42);
    --grad-btn:linear-gradient(105deg,#8b5cfb 0%,#6f3afb 100%);
    --grad-btn-glow:rgba(139,92,251,0.45);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,0.45), 0 24px 60px rgba(0,0,0,0.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;}
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:var(--grad);z-index:100;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--sans);}
  .wrap{width:100%;max-width:none;margin:0 auto;padding:14px 20px 8px;}
  @media (max-width:1560px){ .wrap{width:100%;} }
  @media (max-width:640px){ .wrap{width:100%;padding:14px 14px 16px;} }

  /* header */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:11px;}
  .brand .logo{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    background:var(--grad);color:#fff;box-shadow:0 4px 12px var(--grad-shadow);flex-shrink:0;}
  .brand .logo svg{width:21px;height:21px;}
  .brand b{font-size:18px;font-weight:700;letter-spacing:-0.01em;}
  .toolbtns{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .pillbtn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:999px;
    background:var(--panel);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;font-size:13.5px;
    box-shadow:var(--shadow-sm);transition:border-color .12s,transform .08s,background .12s;}
  .pillbtn:hover{border-color:var(--accent);}
  .pillbtn:active{transform:scale(0.97);}
  .iconbtn{width:38px;height:38px;padding:0;justify-content:center;font-size:15px;line-height:1;}

  /* page intro */
  .pagehead{margin:2px 0 10px;text-align:center;}
  .pagehead h2{font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:-0.02em;margin:0 0 6px;}
  .pagehead .kick{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);
    padding:4px 11px;border-radius:999px;margin-bottom:7px;}
  .pagehead p{font-size:14.5px;color:var(--muted);margin:0 auto;max-width:64ch;}

  /* page-level back button (top-left) — same pill styling as the "received files" screen */
  .sendtop{display:flex;justify-content:flex-end;margin:2px 0 8px;}
  .backbtn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink-2);cursor:pointer;font-size:13px;font-weight:600;box-shadow:var(--shadow-sm);
    transition:border-color .12s,color .12s,transform .08s;}
  .backbtn:hover{border-color:var(--accent);color:var(--ink);}
  .backbtn:active{transform:translateY(1px);}
  .backbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  /* layout */
  .grid{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start;}
  @media (max-width:840px){ .grid{grid-template-columns:1fr;} }
  .col{min-width:0;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);}

  /* dropzone */
  .drop{display:flex;align-items:center;gap:14px;border:2px dashed color-mix(in srgb,var(--accent) 55%,var(--line));border-radius:14px;
    padding:11px 15px;cursor:pointer;background:var(--panel-2);transition:border-color .15s,background .15s;margin-bottom:16px;}
  .drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);}
  .drop .cloud{width:40px;height:40px;flex:0 0 auto;border-radius:12px;display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);color:var(--accent);}
  .drop .cloud svg{width:22px;height:22px;}
  .drop .dinfo{flex:1;min-width:0;text-align:start;}
  .drop .big{font-size:14.5px;font-weight:600;color:var(--ink);}
  .drop .dhint{margin-top:2px;font-size:11.5px;color:var(--faint);font-family:var(--mono);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .drop .dbtns{display:flex;align-items:center;gap:8px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end;}
  .drop .choose{display:inline-flex;align-items:center;gap:7px;color:#fff;border:none;white-space:nowrap;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:600;font-size:13px;padding:9px 16px;border-radius:999px;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.14),0 6px 16px var(--grad-btn-glow);transition:filter .14s,transform .08s;}
  .drop .choose:hover{filter:brightness(1.05);} .drop .choose:active{transform:translateY(1px);}
  .drop .choose svg{width:15px;height:15px;}
  .drop .choose.ghost{color:var(--accent-dim,var(--accent));background:var(--panel);border:1px solid var(--accent);text-shadow:none;box-shadow:none;}
  html[data-theme="dark"] .drop .choose.ghost{color:var(--accent);}
  .drop .choose.ghost:hover{background:var(--accent-soft);filter:none;}
  @media (max-width:560px){ .drop{flex-wrap:wrap;} .drop .dinfo{flex:1 1 auto;} .drop .dbtns{flex:1 1 100%;} .drop .choose{flex:1;justify-content:center;} }
  input[type=file]{display:none;}

  /* file list */
  /* the files card is a fixed-height internal window: the header (count + view toggle) and the
     total-size row are ordinary siblings that stay put, while ONLY the middle grid scrolls. That
     grid's max-height is what caps the whole thing — JS sets an exact inline value (sizeFilesWindow)
     so the window ends just above the viewport bottom no matter how tall the stuff above it is; the
     calc() below is only a no-JS fallback. Result: the card never grows with the file count and the
     page itself never has to scroll to reveal files. Same principle on mobile/tablet. */
  .files{display:flex;flex-direction:column;}
  .fhead,.ftot{flex:0 0 auto;}
  /* shared scroll region for BOTH list & gallery views: sizes to its content up to the cap, then
     shows a draggable scrollbar (renders on the left edge in RTL) instead of pushing the page taller. */
  .flist,.fgrid{max-height:calc(100dvh - 452px);overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;}
  .flist{display:flex;flex-direction:column;gap:8px;padding:14px;}
  .flist::-webkit-scrollbar,.fgrid::-webkit-scrollbar{width:12px;}
  .flist::-webkit-scrollbar-button,.fgrid::-webkit-scrollbar-button{display:none;height:0;width:0;}
  .flist::-webkit-scrollbar-track,.fgrid::-webkit-scrollbar-track{background:transparent;margin:4px 0;}
  .flist::-webkit-scrollbar-thumb,.fgrid::-webkit-scrollbar-thumb{background:var(--faint);border-radius:999px;border:3px solid var(--panel);min-height:44px;}
  .flist::-webkit-scrollbar-thumb:hover,.fgrid::-webkit-scrollbar-thumb:hover{background:var(--muted);}
  .frow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line-2);border-radius:11px;background:var(--panel);}
  .frow .fico{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);}
  .frow .fico.image{color:var(--info);background:var(--info-soft);} .frow .fico.video{color:#e5484d;background:var(--danger-soft);}
  .frow .fico.audio{color:var(--accent);} .frow .fico.doc{color:var(--info-dim);background:var(--info-soft);}
  .frow .fico svg{width:17px;height:17px;}
  .frow .fn{flex:1;min-width:0;}
  .frow .fn .nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .frow .fn .sz{font-family:var(--mono);font-size:11px;color:var(--faint);}
  .frow .rm{width:30px;height:30px;flex-shrink:0;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;}
  .frow .rm:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft);}
  .frow .rm svg{width:15px;height:15px;}
  .ftot{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line-2);
    font-size:13px;color:var(--muted);}
  .ftot b{color:var(--ink);font-family:var(--mono);}
  .flist.empty-hint{color:var(--faint);font-size:13px;text-align:center;padding:22px;}

  /* thumbnail inside a list row (images) */
  .frow .fico.img{background:none;overflow:hidden;}
  .frow .fico.img img{width:100%;height:100%;object-fit:cover;display:block;}

  /* files card header + view toggle */
  .fhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 0;}
  .fhead .fcount{font-size:12.5px;color:var(--muted);font-weight:600;}
  .fhead .fcount b{color:var(--ink);}
  .vtoggle{display:flex;gap:3px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:3px;flex:0 0 auto;}
  .vbtn{width:32px;height:28px;border:none;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;transition:color .14s,background .14s,box-shadow .14s;}
  .vbtn svg{width:16px;height:16px;}
  .vbtn.on{background:var(--panel);color:var(--accent-dim);box-shadow:var(--shadow-sm);}
  .vbtn:hover:not(.on){color:var(--ink-2);}

  /* gallery view */
  .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;padding:14px;}
  .fcard{position:relative;border:1px solid var(--line-2);border-radius:12px;background:var(--panel);overflow:hidden;}
  .fcard .fthumb{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:var(--panel-2);overflow:hidden;}
  .fcard .fthumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .fcard .fthumb .fico{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);}
  .fcard .fthumb .fico.image{color:var(--info);background:var(--info-soft);} .fcard .fthumb .fico.video{color:#e5484d;background:var(--danger-soft);}
  .fcard .fthumb .fico.audio{color:var(--accent);} .fcard .fthumb .fico.doc{color:var(--info-dim);background:var(--info-soft);}
  .fcard .fthumb .fico svg{width:23px;height:23px;}
  .fcard .ext-badge{position:absolute;bottom:7px;inset-inline-start:7px;font-family:var(--mono);font-size:9.5px;font-weight:700;
    text-transform:uppercase;letter-spacing:.03em;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--ink) 70%,transparent);color:#fff;}
  .fcard .fmeta{padding:8px 10px 10px;}
  .fcard .fmeta .nm{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fcard .fmeta .sz{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:2px;}
  .fcard .rm{position:absolute;top:7px;inset-inline-end:7px;width:28px;height:28px;border-radius:8px;border:1px solid var(--line);
    background:color-mix(in srgb,var(--panel) 80%,transparent);color:var(--muted);cursor:pointer;z-index:1;
    display:flex;align-items:center;justify-content:center;transition:all .12s;}
  .fcard .rm:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft);}
  .fcard .rm svg{width:14px;height:14px;}

  /* options side */
  .side{padding:13px 18px;position:sticky;top:14px;}
  .side h3{font-size:15px;margin:0 0 8px;font-weight:700;}
  .opt{margin-bottom:8px;}
  .opt > label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .two .opt{margin-bottom:8px;}
  @media (max-width:560px){ .two{grid-template-columns:1fr;} }
  .seg{display:flex;gap:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:4px;}
  .segbtn{flex:1;height:36px;border:none;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;
    font-size:13px;font-weight:600;transition:color .14s,background .14s,box-shadow .14s;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
  .segbtn.on{background:var(--panel);color:var(--accent-dim);box-shadow:var(--shadow-sm);}
  .segbtn svg{width:14px;height:14px;}
  .inp,.ta{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;
    font-family:var(--sans);font-size:13.5px;padding:10px 12px;transition:border-color .12s,box-shadow .12s;}
  .inp:focus,.ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .inp:disabled,.inp[readonly]{cursor:not-allowed;color:var(--muted);background:var(--line-2);box-shadow:none;}
  .ta{resize:vertical;min-height:46px;}
  .inp[dir=ltr]{text-align:start;}
  select.inp{cursor:pointer;}
  /* recipient email chips: a token box that mirrors .inp; comma / Enter tokenises */
  .tok{display:flex;flex-wrap:wrap;align-items:center;gap:6px;width:100%;cursor:text;
    background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:7px 9px;
    transition:border-color .12s,box-shadow .12s;}
  .tok:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .tok-input{flex:1 1 120px;min-width:120px;border:none;outline:none;background:transparent;color:var(--ink);
    font-family:var(--sans);font-size:13.5px;padding:3px 2px;direction:ltr;text-align:start;}
  .tok.has-chips .tok-input::placeholder{color:transparent;}
  .tok-chip{display:inline-flex;align-items:center;gap:6px;direction:ltr;font-size:12.5px;color:var(--ink);
    background:var(--accent-soft);border:1px solid var(--accent);border-radius:999px;padding:3px 5px 3px 10px;max-width:100%;}
  .tok-chip .tok-mail{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;}
  .tok-chip.tok-bad{background:var(--danger-soft,#fdecec);border-color:var(--danger,#d64545);color:var(--danger,#d64545);}
  .tok-x{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;
    border:none;border-radius:50%;background:transparent;color:inherit;cursor:pointer;font-size:15px;line-height:1;opacity:.7;}
  .tok-x:hover{opacity:1;background:rgba(0,0,0,.08);}
  .chkline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);cursor:pointer;margin-bottom:8px;}
  .chkline input{accent-color:var(--accent);width:15px;height:15px;}
  .hidden{display:none !important;}

  .sendbtn{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:9px;color:#fff;border:none;cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:600;font-size:15px;padding:13px 20px;border-radius:999px;text-shadow:0 1px 2px rgba(0,0,0,.18);margin-top:4px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.14),0 8px 20px var(--grad-btn-glow);
    transition:filter .14s,transform .08s;}
  .sendbtn:hover{filter:brightness(1.05);} .sendbtn:active{transform:translateY(1px);}
  .sendbtn:disabled{opacity:.5;cursor:not-allowed;filter:none;transform:none;}
  .sendbtn svg{width:17px;height:17px;}
  .opterr{font-size:11.5px;color:var(--danger);margin-top:8px;min-height:14px;text-align:center;}

  /* progress */
  .prog{padding:16px;display:none;}
  .prog.show{display:block;}
  .prog .lbl{font-size:13px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;}
  .bar{height:10px;border-radius:999px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line-2);}
  .bar i{display:block;height:100%;width:0;background:var(--grad);border-radius:999px;transition:width .2s ease;}

  /* animated "sending files to your client" loader — shown while createLink() writes the blobs */
  .prog{padding:34px 24px 28px;text-align:center;overflow:hidden;}
  .su-loader{--su-size:200px;width:var(--su-size);height:var(--su-size);margin:0 auto 22px;position:relative;display:grid;place-items:center;}
  .su-ring{position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from -90deg,var(--accent) 0deg,#b98bff 120deg,#7c3bec 250deg,var(--accent) 360deg);
    animation:su-spin 1.7s linear infinite;
    -webkit-mask:radial-gradient(circle,transparent 61%,#000 63%);mask:radial-gradient(circle,transparent 61%,#000 63%);
    filter:drop-shadow(0 0 14px var(--grad-shadow));}
  .su-ring::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:50%;transform:translateX(-50%);box-shadow:0 0 18px rgba(255,255,255,.95);}
  .su-pulse{position:absolute;inset:22px;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 32%,transparent);animation:su-pulse 1.7s ease-out infinite;}
  .su-core{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;position:relative;z-index:2;
    background:linear-gradient(145deg,var(--panel),var(--panel-2));box-shadow:0 14px 32px rgba(20,24,40,.16),inset 0 1px 0 rgba(255,255,255,.5);}
  html[data-theme="dark"] .su-core{box-shadow:0 14px 32px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);}
  .su-percent{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:30px;font-weight:900;letter-spacing:-1px;color:color-mix(in srgb,var(--ink) 15%,transparent);z-index:1;white-space:nowrap;pointer-events:none;}
  .su-send-icon{width:50px;height:50px;color:var(--accent);position:relative;z-index:3;animation:su-orbit 2.6s ease-in-out infinite,su-tilt 1.3s ease-in-out infinite alternate;filter:drop-shadow(0 10px 12px var(--grad-shadow));}
  .su-flying{position:absolute;inset:-28px;pointer-events:none;z-index:4;}
  .su-fly{position:absolute;width:40px;height:46px;border-radius:11px;display:grid;place-items:center;color:#fff;opacity:0;transform-style:preserve-3d;box-shadow:0 10px 22px rgba(31,38,61,.18),inset 0 1px 0 rgba(255,255,255,.28);}
  .su-fly svg{width:22px;height:22px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.14));}
  .su-fly-folder{width:46px;height:34px;border-radius:8px 8px 11px 11px;background:linear-gradient(145deg,#f4c85b,#e9a72f);animation:su-orbitFolder 5.4s ease-in-out infinite;}
  .su-folder-tab{position:absolute;width:20px;height:8px;left:5px;top:-6px;border-radius:6px 6px 0 0;background:#efbb45;}
  .su-fly-doc{background:linear-gradient(145deg,#6f9eff,#4d74dd);animation:su-orbitDoc 5.8s ease-in-out infinite .5s;}
  .su-fly-audio{background:linear-gradient(145deg,#9c75f5,#7249d4);animation:su-orbitAudio 6.2s ease-in-out infinite 1s;}
  .su-fly-video{background:linear-gradient(145deg,#f17ca9,#d85587);animation:su-orbitVideo 5.7s ease-in-out infinite 1.5s;}
  .su-fly-image{background:linear-gradient(145deg,#50c994,#2ca56f);animation:su-orbitImage 6.4s ease-in-out infinite 2s;}
  .su-particles{position:absolute;inset:0;pointer-events:none;}
  .su-particle{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:0;animation:su-float 2.2s ease-out infinite;}
  .su-particle:nth-child(1){left:18%;top:42%;animation-delay:.1s;}
  .su-particle:nth-child(2){right:15%;top:35%;animation-delay:.7s;background:#7c3bec;}
  .su-particle:nth-child(3){left:30%;top:18%;animation-delay:1.15s;background:#b98bff;}
  .su-particle:nth-child(4){right:28%;top:22%;animation-delay:1.7s;}
  .su-title{margin:0;font-size:21px;font-weight:800;color:var(--ink);}
  .su-sub{margin:7px auto 0;max-width:360px;color:var(--muted);font-size:14px;line-height:1.6;}
  .su-status{margin:6px 0 0;color:var(--accent-dim,var(--accent));font-size:13px;font-weight:600;min-height:18px;}
  .prog .bar{margin-top:20px;}
  @keyframes su-spin{to{transform:rotate(360deg);}}
  @keyframes su-orbit{0%,100%{transform:translateY(2px) scale(.96);}50%{transform:translateY(-7px) scale(1.06);}}
  @keyframes su-tilt{from{rotate:-8deg;}to{rotate:8deg;}}
  @keyframes su-pulse{0%{transform:scale(.82);opacity:.7;}100%{transform:scale(1.38);opacity:0;}}
  @keyframes su-float{0%{transform:translateY(12px) scale(.6);opacity:0;}30%{opacity:.8;}100%{transform:translateY(-34px) scale(1.15);opacity:0;}}
  @keyframes su-orbitFolder{0%{left:10%;top:70%;opacity:0;transform:translateZ(-30px) scale(.65) rotate(-18deg);}18%{opacity:.95;}48%{left:2%;top:16%;opacity:1;transform:translateZ(40px) scale(1) rotate(8deg);}80%{left:33%;top:-4%;opacity:.7;transform:translateZ(10px) scale(.82) rotate(18deg);}100%{left:48%;top:12%;opacity:0;transform:translateZ(-40px) scale(.55) rotate(26deg);}}
  @keyframes su-orbitDoc{0%{right:12%;top:76%;opacity:0;transform:translateZ(-35px) scale(.62) rotate(16deg);}18%{opacity:.95;}48%{right:1%;top:20%;opacity:1;transform:translateZ(45px) scale(1) rotate(-8deg);}82%{right:34%;top:-8%;opacity:.72;transform:translateZ(12px) scale(.8) rotate(-18deg);}100%{right:48%;top:13%;opacity:0;transform:translateZ(-45px) scale(.52) rotate(-25deg);}}
  @keyframes su-orbitAudio{0%{left:42%;top:-14%;opacity:0;transform:translateZ(-25px) scale(.58) rotate(-8deg);}22%{opacity:.9;}52%{left:82%;top:38%;opacity:1;transform:translateZ(42px) scale(1) rotate(12deg);}82%{left:58%;top:82%;opacity:.65;transform:translateZ(6px) scale(.78) rotate(22deg);}100%{left:48%;top:58%;opacity:0;transform:translateZ(-38px) scale(.5) rotate(30deg);}}
  @keyframes su-orbitVideo{0%{left:45%;top:88%;opacity:0;transform:translateZ(-35px) scale(.6) rotate(12deg);}20%{opacity:.95;}50%{left:8%;top:45%;opacity:1;transform:translateZ(48px) scale(1) rotate(-10deg);}82%{left:26%;top:2%;opacity:.7;transform:translateZ(8px) scale(.8) rotate(-18deg);}100%{left:48%;top:24%;opacity:0;transform:translateZ(-45px) scale(.52) rotate(-26deg);}}
  @keyframes su-orbitImage{0%{right:44%;top:-8%;opacity:0;transform:translateZ(-28px) scale(.58) rotate(-12deg);}22%{opacity:.9;}52%{right:7%;top:50%;opacity:1;transform:translateZ(44px) scale(1) rotate(9deg);}82%{right:28%;top:85%;opacity:.68;transform:translateZ(8px) scale(.8) rotate(18deg);}100%{right:48%;top:56%;opacity:0;transform:translateZ(-40px) scale(.5) rotate(25deg);}}
  @media (prefers-reduced-motion:reduce){
    .su-ring,.su-pulse,.su-send-icon,.su-fly,.su-particle{animation-duration:.01ms!important;animation-iteration-count:1!important;}
  }

  /* share result */
  .share{padding:22px;display:none;}
  .share.show{display:block;}
  .share .ok{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    background:var(--success-soft);color:var(--success-dim);}
  .share .ok svg{width:28px;height:28px;}
  .share h3{text-align:center;font-size:19px;margin:0 0 4px;}
  .share .subt{text-align:center;font-size:13px;color:var(--muted);margin:0 0 18px;}
  .linkrow{display:flex;gap:8px;margin-bottom:14px;}
  .linkrow .lk{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;
    font-family:var(--mono);font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;}
  .copybtn{flex-shrink:0;display:inline-flex;align-items:center;gap:7px;color:#fff;border:none;cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:600;font-size:13px;padding:0 16px;border-radius:10px;text-shadow:0 1px 2px rgba(0,0,0,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 12px var(--grad-btn-glow);transition:filter .14s;}
  .copybtn:hover{filter:brightness(1.05);} .copybtn svg{width:15px;height:15px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px;}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-family:var(--mono);color:var(--muted);
    background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;}
  .chip svg{width:13px;height:13px;color:var(--accent);}
  .share .row2{display:flex;gap:10px;flex-wrap:wrap;}
  .share .row2 a,.share .row2 button{flex:1;min-width:130px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 16px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid var(--line);
    background:var(--panel);color:var(--ink-2);transition:border-color .12s,transform .08s;box-shadow:var(--shadow-sm);}
  .share .row2 a:hover,.share .row2 button:hover{border-color:var(--accent);} .share .row2 *:active{transform:translateY(1px);}
  .share .row2 .del{color:var(--danger);border-color:var(--danger);background:transparent;}
  .share .row2 .del:hover{background:var(--danger-soft);}
  .share .row2 svg{width:15px;height:15px;}
  .seam{display:flex;align-items:flex-start;gap:8px;margin-top:16px;padding:11px 13px;border-radius:11px;
    background:var(--warm-soft);border:1px solid var(--warm-line);font-size:11.5px;color:var(--ink-2);line-height:1.55;}
  .seam svg{width:15px;height:15px;color:var(--warn);flex-shrink:0;margin-top:1px;}

  /* qr + live stats */
  .qrwrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:0 0 18px;}
  .qrbox{width:172px;height:172px;padding:10px;border-radius:14px;background:#fff;border:1px solid var(--line);
    box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;}
  .qrbox img{width:100%;height:100%;image-rendering:pixelated;display:block;}
  .qrdl{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--accent-dim);
    background:var(--accent-soft);border:1px solid transparent;border-radius:999px;padding:7px 14px;cursor:pointer;transition:filter .12s;}
  .qrdl:hover{filter:brightness(0.97);} .qrdl svg{width:14px;height:14px;}
  .statline{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 16px;font-size:12.5px;color:var(--muted);}
  .statline .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex-shrink:0;}
  .statline.live .dot{background:var(--success);box-shadow:0 0 0 3px var(--success-soft);animation:pulse 1.6s ease-in-out infinite;}
  .statline b{color:var(--ink);font-family:var(--mono);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

  /* client branding */
  .brandsec{border-top:1px dashed var(--line);margin-top:4px;padding-top:11px;}
  .brandhead{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:4px;}
  .brandsub{font-size:11.5px;color:var(--muted);line-height:1.5;margin-bottom:11px;}
  .tiles{display:flex;gap:9px;margin-bottom:11px;}
  .tile{flex:1;position:relative;height:74px;border:1.4px dashed var(--line);border-radius:11px;background:var(--panel-2);
    cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:border-color .12s,background .12s;}
  .tile:hover{border-color:var(--accent);background:var(--accent-soft);}
  .tile-empty{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);font-size:11.5px;font-weight:600;pointer-events:none;}
  .tile-empty svg{width:19px;height:19px;color:var(--accent);}
  .tile.filled{border-style:solid;border-color:var(--line);background:#fff;}
  .tile.filled .tile-empty{display:none;}
  .tile-img{max-width:88%;max-height:60px;object-fit:contain;}
  #bgTile.filled{background-size:cover;background-position:center;}
  #bgTile.filled .tile-img{display:none;}
  .tile-x{position:absolute;top:5px;inset-inline-end:5px;width:22px;height:22px;border-radius:7px;border:none;cursor:pointer;
    background:rgba(10,12,20,.62);color:#fff;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2;}
  .tile-x:hover{background:var(--danger);}
  .mini-lbl{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin:2px 0 8px;}
  .swatches{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:13px;}
  .swatch{width:25px;height:25px;border-radius:7px;cursor:pointer;border:2px solid var(--panel);outline:1px solid var(--line);
    padding:0;transition:transform .1s;}
  .swatch:hover{transform:scale(1.08);} .swatch.on{outline:2px solid var(--ink);outline-offset:1px;}
  .colorpick{width:32px;height:27px;padding:0;border:1px solid var(--line);border-radius:7px;background:var(--panel);cursor:pointer;}
  .bprev{position:relative;height:118px;border-radius:13px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow-sm);}
  .bprev-bg{position:absolute;inset:0;background-size:cover;background-position:center;}
  .bprev-in{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;}
  .bprev-logo{background:#fff;border-radius:9px;padding:6px 10px;box-shadow:0 4px 12px rgba(0,0,0,.2);}
  .bprev-logo img{display:block;max-height:26px;max-width:120px;object-fit:contain;}
  .bprev-name{font-size:15px;font-weight:800;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.35);text-align:center;padding:0 8px;}
  .bprev-hint{font-size:11px;color:var(--faint);text-align:center;margin-top:7px;}
  .brandlock{border:1.4px solid var(--line);border-radius:13px;background:var(--panel-2);padding:12px 15px;margin-top:4px;
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;}
  .brandlock[hidden]{display:none;}
  .brandlock-badge{font-size:10px;font-weight:800;letter-spacing:.06em;color:#fff;background:var(--grad);padding:3px 10px;border-radius:999px;}
  .brandlock-ic{width:26px;height:26px;color:var(--accent);}
  .brandlock-txt{font-size:12px;color:var(--muted);line-height:1.55;max-width:250px;}
  .brandlock-cta{display:inline-block;text-decoration:none;font-size:12.5px;font-weight:700;color:#fff;
    background:var(--grad-btn);padding:9px 18px;border-radius:10px;box-shadow:0 4px 12px var(--grad-btn-glow);transition:filter .14s;}
  .brandlock-cta:hover{filter:brightness(1.06);}

  /* advanced-settings: gear in the card header + summary bar that opens the popup */
  .side-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px;}
  .side-head h3{margin:0;}
  .gearbtn{width:34px;height:34px;flex:0 0 auto;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);
    color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
    transition:border-color .12s,color .12s,background .12s;}
  .gearbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
  .gearbtn svg{width:18px;height:18px;transition:transform .35s ease;}
  .gearbtn:hover svg{transform:rotate(60deg);}

  .advbar{display:flex;align-items:center;gap:11px;width:100%;text-align:start;cursor:pointer;margin:2px 0 10px;
    padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);font-family:var(--sans);
    transition:border-color .12s,background .12s;}
  .advbar:hover{border-color:var(--accent);background:var(--accent-soft);}
  .advbar-ic{width:34px;height:34px;flex:0 0 auto;border-radius:9px;display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);color:var(--accent);transition:background .12s;}
  .advbar:hover .advbar-ic{background:var(--panel);}
  .advbar-ic svg{width:18px;height:18px;}
  .advbar-txt{flex:1;min-width:0;}
  .advbar-title{display:block;font-size:13px;font-weight:700;color:var(--ink-2);}
  .advbar-sum{display:block;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px;}
  .advbar-chev{flex:0 0 auto;color:var(--faint);display:flex;}
  .advbar-chev svg{width:18px;height:18px;}

  /* advanced-settings modal */
  .adv-overlay{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:24px 16px;
    background:rgba(18,20,34,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    opacity:0;visibility:hidden;transition:opacity .22s ease,visibility .22s ease;overflow:auto;}
  .adv-overlay.open{opacity:1;visibility:visible;}
  .adv-modal{position:relative;width:100%;max-width:480px;margin:auto;background:var(--panel);border:1px solid var(--line);
    border-radius:22px;box-shadow:var(--shadow-lg);overflow:hidden;display:flex;flex-direction:column;max-height:calc(100dvh - 48px);
    transform:translateY(14px) scale(.985);opacity:0;transition:transform .26s cubic-bezier(.2,.8,.25,1),opacity .26s;}
  .adv-overlay.open .adv-modal{transform:none;opacity:1;}
  @media (max-width:560px){ .adv-modal{border-radius:18px;} }
  .adv-close{position:absolute;top:15px;inset-inline-end:15px;width:34px;height:34px;border-radius:10px;border:none;cursor:pointer;
    background:var(--panel-2);color:var(--muted);display:flex;align-items:center;justify-content:center;z-index:3;transition:background .12s,color .12s;}
  .adv-close:hover{background:var(--danger-soft);color:var(--danger);}
  .adv-close svg{width:17px;height:17px;}
  .adv-head{display:flex;align-items:flex-start;gap:13px;padding:22px 22px 15px;}
  .adv-hico{width:48px;height:48px;flex:0 0 auto;border-radius:14px;display:flex;align-items:center;justify-content:center;
    background:var(--grad);color:#fff;box-shadow:0 6px 15px var(--grad-shadow);}
  .adv-hico svg{width:24px;height:24px;}
  .adv-head-txt{flex:1;min-width:0;padding-inline-end:30px;}
  .adv-head-txt h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em;}
  .adv-head-txt p{margin:4px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5;}
  .adv-body{padding:0 20px 18px;overflow:auto;display:flex;flex-direction:column;gap:11px;}
  .adv-sec{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px 15px;}
  .adv-sec-main{display:flex;align-items:center;gap:12px;margin:0;}
  label.adv-sec-main{cursor:pointer;}
  .adv-sec-txt{flex:1;min-width:0;}
  .adv-sec-title{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--ink);}
  .adv-sec-title svg{width:16px;height:16px;color:var(--accent);flex:0 0 auto;}
  .adv-sec-sub{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45;}
  .adv-select{width:auto;min-width:106px;flex:0 0 auto;padding:8px 30px 8px 10px;}
  html[dir=rtl] .adv-select{padding:8px 10px 8px 30px;}
  .adv-foot{padding:14px 20px;border-top:1px solid var(--line-2);background:var(--panel-2);}
  .adv-done{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:#fff;border:none;cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:600;font-size:14.5px;padding:12px 20px;border-radius:999px;text-shadow:0 1px 2px rgba(0,0,0,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 16px var(--grad-btn-glow);transition:filter .14s,transform .08s;}
  .adv-done:hover{filter:brightness(1.05);} .adv-done:active{transform:translateY(1px);}
  /* branding section inside the modal drops its own top divider */
  #brandSec.adv-sec{border-top:1px solid var(--line);margin-top:0;padding-top:14px;}

  /* toggle switch (direction-aware: knob slides toward the inline-end) */
  .switch{position:relative;display:inline-block;flex:0 0 auto;width:42px;height:25px;}
  .switch input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer;z-index:1;}
  .switch .track{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .18s;pointer-events:none;}
  .switch .track::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:19px;height:19px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:inset-inline-start .18s ease;}
  .switch input:checked + .track{background:var(--accent);}
  .switch input:checked + .track::after{inset-inline-start:20px;}

  /* ============================================================================
     Admin ⇄ Client view switch + live client preview
     #viewSwitch flips the composer for a pixel-faithful preview of the recipient
     download page (mirrors download.html), fed straight from the staged files[] +
     brand + send options — no persistence, so it reflects every add/remove/edit the
     instant it happens, before any link is created. Everything below is namespaced
     under .cv- so it never collides with the composer's own .card/.flist/.frow/.chip,
     and the client's brand accent is scoped to #cvPage via --cv-* custom props (never
     touches :root) so it can't bleed into the composer chrome. */
  .viewswitch{display:flex;justify-content:center;margin:0 0 16px;}
  .vsw{display:inline-flex;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:5px;box-shadow:var(--shadow);}
  .vsw-btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 22px;border:none;border-radius:999px;
    background:transparent;color:var(--muted);cursor:pointer;font-size:14px;font-weight:600;font-family:var(--sans);
    transition:color .16s,background .16s,box-shadow .16s;white-space:nowrap;}
  .vsw-btn svg{width:17px;height:17px;flex:0 0 auto;}
  .vsw-btn.on{color:#fff;background:var(--grad-btn);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 16px var(--grad-btn-glow);}
  .vsw-btn:not(.on):hover{color:var(--ink-2);}
  @media (max-width:480px){ .vsw-btn{padding:0 15px;font-size:13px;} }

  .clientview{margin:0 0 10px;}
  .cv-cap{max-width:860px;margin:0 auto 12px;display:flex;align-items:center;gap:9px;padding:10px 14px;border-radius:12px;
    background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 24%,var(--line));color:var(--ink-2);
    font-size:12.5px;line-height:1.5;}
  .cv-cap svg{width:17px;height:17px;color:var(--accent);flex:0 0 auto;}
  .cv-frame{max-width:860px;margin:0 auto;border:1px solid var(--line);border-radius:18px;overflow:hidden;
    box-shadow:var(--shadow-lg);background:var(--panel);}
  .cv-chrome{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line-2);}
  .cv-dots{display:flex;gap:6px;flex:0 0 auto;}
  .cv-dots i{width:11px;height:11px;border-radius:50%;background:var(--line);}
  .cv-dots i:nth-child(1){background:#ff5f57;} .cv-dots i:nth-child(2){background:#febc2e;} .cv-dots i:nth-child(3){background:#28c840;}
  .cv-url{flex:1;min-width:0;display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;
    background:var(--panel-2);border:1px solid var(--line-2);font-family:var(--mono);font-size:12px;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;}
  .cv-url svg{width:13px;height:13px;color:var(--faint);flex:0 0 auto;}
  .cv-url span{overflow:hidden;text-overflow:ellipsis;}
  .cv-livetag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--success-dim);flex:0 0 auto;}
  .cv-livetag .d{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px var(--success-soft);
    animation:pulse 1.6s ease-in-out infinite;}
  @media (max-width:480px){ .cv-livetag span{display:none;} }

  /* the "client page" surface — its own bg/accent so it reads as a separate site */
  .cv-page{--cv-accent:#6f3afb;--cv-accent-dim:#5a24e0;--cv-accent-soft:rgba(111,58,251,.14);
    --cv-grad:linear-gradient(105deg,#8b5cfb 0%,#6f3afb 100%);--cv-glow:rgba(111,58,251,.34);
    background:#eef0f6;padding:22px 18px 26px;}
  html[data-theme="dark"] .cv-page{background:#0d0f14;}
  .cv-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);
    padding:24px;max-width:620px;margin:0 auto;}
  .cv-dhead{text-align:center;border-bottom:1px solid var(--line-2);padding-bottom:18px;margin-bottom:18px;}
  .cv-ava{width:56px;height:56px;margin:0 auto 12px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    background:var(--cv-accent-soft);color:var(--cv-accent);}
  .cv-ava svg{width:28px;height:28px;}
  .cv-dhead h1{font-size:20px;margin:0 0 4px;font-weight:700;}
  .cv-who{font-size:13.5px;color:var(--muted);}
  .cv-msgbox{background:var(--panel-2);border:1px solid var(--line-2);border-radius:12px;padding:13px 15px;font-size:14px;
    color:var(--ink-2);line-height:1.6;margin-bottom:18px;white-space:pre-wrap;word-break:break-word;}
  .cv-metarow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px;}
  .cv-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-family:var(--mono);color:var(--muted);
    background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;}
  .cv-chip svg{width:13px;height:13px;color:var(--cv-accent);}
  .cv-flist{display:flex;flex-direction:column;gap:9px;margin-bottom:18px;max-height:420px;overflow-y:auto;overscroll-behavior:contain;}
  .cv-flist::-webkit-scrollbar{width:10px;}
  .cv-flist::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:999px;border:3px solid var(--panel);}
  .cv-flist::-webkit-scrollbar-thumb:hover{background:var(--muted);}
  .cv-frow{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line-2);border-radius:12px;background:var(--panel);}
  .cv-fico{width:38px;height:38px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:var(--cv-accent-soft);color:var(--cv-accent);overflow:hidden;}
  .cv-fico.image{color:var(--info);background:var(--info-soft);} .cv-fico.video{color:#e5484d;background:var(--danger-soft);}
  .cv-fico.doc{color:var(--info-dim);background:var(--info-soft);}
  .cv-fico.img{background:none;} .cv-fico img{width:100%;height:100%;object-fit:cover;}
  .cv-fico svg{width:18px;height:18px;}
  .cv-fn{flex:1;min-width:0;}
  .cv-fn .nm{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cv-fn .sz{font-family:var(--mono);font-size:11px;color:var(--faint);}
  .cv-act{display:flex;gap:6px;flex-shrink:0;}
  .cv-act button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;}
  .cv-act button:hover{border-color:var(--cv-accent);color:var(--cv-accent);}
  .cv-act svg{width:16px;height:16px;}
  .cv-dlall{width:fit-content;max-width:100%;margin-inline:auto;display:flex;align-items:center;justify-content:center;gap:9px;
    color:#fff;border:none;cursor:pointer;background:var(--cv-grad);font-weight:600;font-size:15px;padding:14px 34px;border-radius:999px;
    text-shadow:0 1px 2px rgba(0,0,0,.18);box-shadow:0 8px 20px var(--cv-glow);transition:filter .14s,transform .08s;}
  .cv-dlall:hover{filter:brightness(1.05);} .cv-dlall:active{transform:translateY(1px);} .cv-dlall svg{width:17px;height:17px;}
  .cv-empty{text-align:center;padding:34px 12px;}
  .cv-empty-ic{width:60px;height:60px;margin:0 auto 14px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    background:var(--panel-2);border:1px dashed var(--line);color:var(--muted);}
  .cv-empty-ic svg{width:28px;height:28px;}
  .cv-empty-t{font-size:14px;color:var(--muted);font-weight:600;}
  .cv-seam{display:flex;align-items:flex-start;gap:8px;margin-top:18px;padding:11px 13px;border-radius:11px;
    background:var(--warm-soft);border:1px solid var(--warm-line);font-size:11.5px;color:var(--ink-2);line-height:1.55;}
  .cv-seam svg{width:15px;height:15px;color:var(--warn);flex-shrink:0;margin-top:1px;}
  .cv-pbwrap{text-align:center;margin-top:18px;}
  .cv-poweredby{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--faint);font-family:var(--mono);letter-spacing:.02em;}
  .cv-poweredby b{color:var(--muted);font-family:var(--sans);font-weight:800;letter-spacing:0;}
  .cv-branded .cv-ava{display:none;}

  /* branded hero (mirrors download.html .brandhero) */
  .cv-brandhero{position:relative;border-radius:16px;overflow:hidden;margin:0 auto 16px;max-width:620px;border:1px solid var(--line);box-shadow:var(--shadow-lg);}
  .cv-bh-bg{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;}
  .cv-bh-scrim{position:absolute;inset:0;}
  .cv-bh-in{position:relative;padding:30px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:11px;}
  .cv-bh-logo{background:#fff;border-radius:14px;padding:10px 15px;box-shadow:0 8px 24px rgba(0,0,0,.20);}
  .cv-bh-logo img{display:block;max-height:46px;max-width:min(200px,55vw);object-fit:contain;}
  .cv-bh-name{font-size:clamp(19px,3.4vw,24px);font-weight:800;letter-spacing:-.01em;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.30);}
  .cv-bh-tag{font-size:13.5px;color:rgba(255,255,255,.92);text-shadow:0 1px 8px rgba(0,0,0,.30);max-width:46ch;}
  .cv-brandhero.cv-bh-default{min-height:clamp(160px,20vw,220px);}
  .cv-brandhero.cv-bh-default .cv-bh-bg{background-color:#e3d7fb;background-position:center 22%;}
  .cv-brandhero.cv-bh-default .cv-bh-name{color:#3d2270;text-shadow:none;}
  .cv-brandhero.cv-bh-default .cv-bh-tag{color:#5a3a8f;text-shadow:none;}

  footer{margin-top:6px;text-align:center;color:var(--faint);font-size:12px;font-family:var(--mono);}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:11px 18px;border-radius:999px;
    box-shadow:var(--shadow-lg);transition:opacity .2s,transform .2s;z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ===== 3-step send wizard ===== */
  #viewSwitch{display:none !important;}
  .wz{max-width:1080px;margin:0 auto;}
  .wz-bar{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 18px;}
  .wz-track{display:flex;align-items:center;justify-content:center;gap:8px;flex:0 1 auto;min-width:0;}
  .wz-tab{display:inline-flex;align-items:center;gap:9px;padding:8px 15px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel);color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;
    transition:background .15s,color .15s,border-color .15s,box-shadow .15s;}
  .wz-tab .wz-num{width:23px;height:23px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;
    background:var(--panel-2);color:var(--muted);font-size:12px;font-weight:800;border:1px solid var(--line);}
  .wz-tab:hover:not(:disabled):not(.on){border-color:var(--accent);color:var(--ink-2);}
  .wz-tab.on{border-color:transparent;background:var(--grad);color:#fff;box-shadow:0 6px 16px var(--grad-shadow);}
  .wz-tab.on .wz-num{background:rgba(255,255,255,.28);color:#fff;border-color:transparent;}
  .wz-tab.done{color:var(--ink-2);}
  .wz-tab.done .wz-num{background:var(--accent);color:#fff;border-color:transparent;}
  .wz-tab:disabled{cursor:not-allowed;opacity:.55;}
  .wz-conn{flex:0 0 auto;width:22px;height:2px;background:var(--line);border-radius:2px;transition:background .2s ease;}
  .wz-conn.done{background:var(--accent);}
  @media(max-width:600px){ .wz-tab .wz-lbl{display:none;} .wz-tab{padding:8px 12px;} .wz-conn{width:12px;} }

  .wz-step{display:none;}
  .wz-step.on{display:block;animation:wzIn .22s ease;}
  @keyframes wzIn{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}
  .wz-narrow{max-width:660px;margin:0 auto;}
  .wz-steptitle{font-size:18px;font-weight:700;margin:0 0 3px;letter-spacing:-.01em;}
  .wz-stepsub{font-size:13px;color:var(--muted);margin:0 0 15px;}

  .wz-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;}
  .wz-foot.end{justify-content:flex-end;}
  .wz-back{display:inline-flex;align-items:center;gap:7px;padding:11px 20px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink-2);font-size:14px;font-weight:600;cursor:pointer;box-shadow:var(--shadow-sm);
    transition:border-color .12s,transform .08s;}
  .wz-back:hover:not(:disabled){border-color:var(--accent);} .wz-back:active:not(:disabled){transform:scale(.98);}
  .wz-back:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
  .wz-next{display:inline-flex;align-items:center;justify-content:center;gap:9px;color:#fff;border:none;cursor:pointer;
    padding:12px 30px;border-radius:999px;font-size:15px;font-weight:700;background:var(--grad-btn);
    box-shadow:0 8px 22px var(--grad-btn-glow);transition:filter .12s,transform .08s;}
  .wz-next:hover{filter:brightness(1.05);} .wz-next:active{transform:translateY(1px);}
  .wz-next:disabled{opacity:.5;cursor:not-allowed;filter:none;transform:none;}
  .wz-next svg,.wz-back svg{width:16px;height:16px;}
  .wz-send{width:auto;padding:13px 34px;border-radius:999px;font-size:15.5px;}

  .fhead-tools{display:flex;align-items:center;gap:8px;}
  .fnewfolder{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:8px;
    border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);font-size:12px;font-weight:600;cursor:pointer;}
  .fnewfolder:hover{border-color:var(--accent);color:var(--accent);}
  .fnewfolder svg{width:15px;height:15px;}
  .frow[draggable=true],.fcard[draggable=true]{cursor:default;}
  .frow.dragging,.fcard.dragging{opacity:.4;}
  .frow.drop-into,.fcard.drop-into{outline:2px dashed var(--accent);outline-offset:-2px;}
  .fdrag{cursor:grab;color:var(--faint);display:inline-flex;align-items:center;flex:0 0 auto;touch-action:none;}
  .fdrag:active{cursor:grabbing;} .fdrag svg{width:16px;height:16px;}
  .folderbadge{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--accent);font-weight:700;margin-inline-end:6px;}
  .folderbadge svg{width:12px;height:12px;}
  .ffolder{width:auto;max-width:128px;padding:5px 7px;font-size:11.5px;border-radius:8px;flex:0 0 auto;}

  /* quick settings (step 2) */
  .qs-head{font-size:12.5px;font-weight:700;color:var(--ink-2);margin:15px 0 9px;padding-top:13px;border-top:1px dashed var(--line);}
  .qs{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  @media(max-width:520px){ .qs{grid-template-columns:1fr;} }
  .qs-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px;border:1px solid var(--line);
    border-radius:11px;background:var(--panel-2);cursor:pointer;margin:0;}
  .qs-item .qs-txt{font-size:12.5px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px;min-width:0;}
  .qs-item .qs-txt svg{width:16px;height:16px;color:var(--muted);flex:0 0 auto;}
  .qs-select{width:auto;padding:6px 8px;font-size:12.5px;flex:0 0 auto;}
  .qs-more{display:inline-flex;align-items:center;gap:7px;margin-top:12px;background:none;border:none;cursor:pointer;
    color:var(--accent);font-size:13px;font-weight:600;padding:4px 2px;}
  .qs-more svg{width:16px;height:16px;}

  /* review (step 3) */
  .rv{border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden;}
  .rv-row{display:flex;align-items:center;gap:13px;padding:13px 16px;border-bottom:1px solid var(--line-2);}
  .rv-row:last-child{border-bottom:none;}
  .rv-ic{width:36px;height:36px;flex:0 0 auto;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);}
  .rv-ic svg{width:18px;height:18px;}
  .rv-txt{flex:1;min-width:0;}
  .rv-lbl{font-size:11.5px;color:var(--muted);font-weight:600;}
  .rv-val{font-size:14.5px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rv-preview{margin-top:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;}
  .rv-preview>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;
    color:var(--ink-2);padding:13px 16px;}
  .rv-preview>summary::-webkit-details-marker{display:none;}
  .rv-preview>summary svg{width:17px;height:17px;color:var(--accent);}
  .rv-preview[open]>summary{border-bottom:1px solid var(--line-2);}
  #cvHost{padding:6px;}
  #cvHost .clientview{display:block !important;}

<body>
<div id="site-header"></div>
<script src="./header.js"></script>
<script src="./project-numbering.js"></script>
<script src="./owner-migrate.js"></script>
<script src="./supabase-config.js"></script>
<script src="./auth-store.js"></script>
<script src="./kolkli-db.js"></script>
<div class="wrap">

  <!-- page-level back button (top-left), arrow pill like the "received files" screen -->
  <div class="sendtop">
    <button class="backbtn" id="pageBackBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span data-i18n="pageBack"></span>
    </button>
  </div>

  <!-- admin ⇄ client view switch: flips the composer into a live recipient preview -->
  <div class="viewswitch" id="viewSwitch" role="tablist">
    <div class="vsw">
      <button class="vsw-btn on" type="button" data-mode="admin" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span id="vswAdminLbl"></span>
      </button>
      <button class="vsw-btn" type="button" data-mode="client" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        <span id="vswClientLbl"></span>
      </button>
    </div>
  </div>

  <div class="pagehead">
    <span class="kick" data-i18n="kick"></span>
    <h2 data-i18n="pageTitle"></h2>
    <p data-i18n="pageSub"></p>
  </div>

  <div class="wz" id="wizard">
    <div class="wz-bar">
      <div class="wz-track">
        <button class="wz-tab on" type="button" data-goto="1" id="wzTab1"><span class="wz-num">1</span><span class="wz-lbl" data-i18n="wzStep1"></span></button>
        <span class="wz-conn"></span>
        <button class="wz-tab" type="button" data-goto="2" id="wzTab2"><span class="wz-num">2</span><span class="wz-lbl" data-i18n="wzStep2"></span></button>
        <span class="wz-conn"></span>
        <button class="wz-tab" type="button" data-goto="3" id="wzTab3"><span class="wz-num">3</span><span class="wz-lbl" data-i18n="wzStep3"></span></button>
      </div>
    </div>

    <!-- STEP 1 - files -->
    <section class="wz-step on" data-step="1">
      <div class="drop" id="drop">
        <div class="cloud"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"/><path d="M12 12v9"/><path d="m8 17 4-4 4 4"/></svg></div>
        <div class="dinfo">
          <div class="big" data-i18n="dropBig"></div>
          <div class="dhint" data-i18n="sizeNote"></div>
        </div>
        <div class="dbtns">
          <button class="choose" type="button" id="chooseBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span data-i18n="choose"></span>
          </button>
          <button class="choose ghost" type="button" id="chooseFolderBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>
            <span data-i18n="chooseFolder"></span>
          </button>
        </div>
      </div>
      <input type="file" id="fileInput" multiple>
      <input type="file" id="folderInput" webkitdirectory directory multiple>

      <div class="card files" id="filesCard" style="display:none">
        <div class="fhead">

  function readImageScaled(file,maxW,maxH,mime,q){
    return new Promise((resolve,reject)=>{

        let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        if(!w||!h){ URL.revokeObjectURL(url); return reject(new Error('dim')); }
        const s=Math.min(1,maxW/w,maxH/h); w=Math.max(1,Math.round(w*s)); h=Math.max(1,Math.round(h*s));

        c.getContext('2d').drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        try{ resolve(c.toDataURL(mime,q)); }catch(e){ reject(e); }
      };
      img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('load')); };
      img.src=url;
    });
  }

  // accepts either a FileList/File[] or an array of {file,path}; keeps each file's relative

  function pathItems(list){ return Array.from(list||[]).map(f=>({file:f, path:f.webkitRelativePath||f.name})); }

    (items||[]).forEach(it=>{
      const file = it.file || it;                       // tolerate a raw File too
      const path = (it.path || file.webkitRelativePath || file.name);
      const ext=extOf(file.name);
      const kind=kindOf(ext);
      const rec={ id:'f'+(uid++), file, name:file.name, path, ext, kind, size:file.size, thumb:'' };
      if(kind==='image'){ try{ rec.thumb=URL.createObjectURL(file); }catch(_){} }   // preview for gallery/list
      files.push(rec);

  // walk dropped directories via the entries API so whole folders keep their tree
  async function addFromDataTransfer(dt){
    let items;

  }
  function filesFromDataTransfer(dt){
    const list = dt.items ? Array.from(dt.items) : [];
    const entries = list.map(it=> it.webkitGetAsEntry ? it.webkitGetAsEntry() : null).filter(Boolean);
    if(!entries.length){ return Promise.resolve(pathItems(dt.files)); }
    const out=[];
    return Promise.all(entries.map(en=>walkEntry(en,'',out))).then(()=>out);
  }
  function walkEntry(entry, prefix, out){
    return new Promise(resolve=>{
      if(!entry){ resolve(); return; }
      if(entry.isFile){ entry.file(f=>{ out.push({file:f, path:prefix+entry.name}); resolve(); }, ()=>resolve()); }
      else if(entry.isDirectory){
        const reader=entry.createReader(), kids=[];
        const readBatch=()=>reader.readEntries(batch=>{
          if(!batch.length){ Promise.all(kids.map(k=>walkEntry(k, prefix+entry.name+'/', out))).then(resolve); }
          else { kids.push(...batch); readBatch(); }
        }, ()=>resolve());
        readBatch();
      } else resolve();
    });
  }

  function withUsage(tool,payload,work){
