<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOLKLI — שליחת קבצים גדולים</title>
<meta name="description" content="Send large files with a shareable link — set an expiry, add a password and a message. Recipient gets a clean download page.">
<style>
  :root {
    --bg:#eef0f6; --panel:#ffffff; --panel-2:#f5f6fa; --line:#e5e8f0; --line-2:#eef0f6;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#7c3aed; --accent-dim:#6a2fe0; --accent-ink:#ffffff; --accent-soft:#efe9fe;
    --success:#22b04b; --success-dim:#1c9a41; --success-soft:#e6f6ec;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --danger:#e5484d; --danger-soft:#fdecec;
    --warm-soft:#fff5da; --warm-line:#f2d98a;
    --ok:#22b04b; --warn:#c88a04; --err:#e5484d;
    --grad:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-h:linear-gradient(105deg,#6a29e6 0%,#2f74f0 100%);
    --grad-soft:linear-gradient(120deg,#efe9fe,#e6f0ff);
    --grad-shadow:rgba(93,79,240,0.30);
    --grad-btn:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn-glow:rgba(59,111,246,0.38);
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-lg:0 2px 6px rgba(20,24,44,0.05), 0 20px 50px rgba(20,24,44,0.10);
    --shadow-sm:0 1px 2px rgba(20,24,44,0.05);
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --sans:'Space Grotesk',system-ui,'Segoe UI','Heebo',sans-serif;
  }
  html[data-theme="dark"] {
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a303c; --line-2:#232833;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --accent:#a06bff; --accent-dim:#7c3aed; --accent-ink:#ffffff; --accent-soft:#241a3a;
    --success:#37c26a; --success-dim:#2fae5e; --success-soft:#132a1c;
    --info:#5b95f8; --info-dim:#4f8ef7; --info-soft:#182338;
    --danger:#ff6b6b; --danger-soft:#2a1719;
    --warm-soft:#2c2718; --warm-line:#5a4d24;
    --ok:#4ec98a; --warn:#e8b84b; --err:#ff6b6b;
    --grad:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-h:linear-gradient(105deg,#9a63ff 0%,#6aa2ff 100%);
    --grad-soft:linear-gradient(120deg,#1c1633,#11242a);
    --grad-shadow:rgba(77,123,255,0.42);
    --grad-btn:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn-glow:rgba(77,123,255,0.45);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,0.45), 0 24px 60px rgba(0,0,0,0.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;}
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:var(--grad);z-index:100;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--sans);}
  .wrap{width:80%;max-width:none;margin:0 auto;padding:14px 20px 8px;}
  @media (max-width:1560px){ .wrap{width:90%;} }
  @media (max-width:640px){ .wrap{width:100%;padding:14px 14px 16px;} }

  /* header */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:11px;}
  .brand .logo{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    background:var(--grad);color:#fff;box-shadow:0 4px 12px var(--grad-shadow);flex-shrink:0;}
  .brand .logo svg{width:21px;height:21px;}
  .brand b{font-size:18px;font-weight:700;letter-spacing:-0.01em;}
  .toolbtns{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .pillbtn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:999px;
    background:var(--panel);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;font-size:13.5px;
    box-shadow:var(--shadow-sm);transition:border-color .12s,transform .08s,background .12s;}
  .pillbtn:hover{border-color:var(--accent);}
  .pillbtn:active{transform:scale(0.97);}
  .iconbtn{width:38px;height:38px;padding:0;justify-content:center;font-size:15px;line-height:1;}

  /* page intro */
  .pagehead{margin:2px 0 10px;}
  .pagehead h2{font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:-0.02em;margin:0 0 6px;}
  .pagehead .kick{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);
    padding:4px 11px;border-radius:999px;margin-bottom:7px;}
  .pagehead p{font-size:14.5px;color:var(--muted);margin:0;max-width:64ch;}

  /* layout */
  .grid{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start;}
  @media (max-width:840px){ .grid{grid-template-columns:1fr;} }
  .col{min-width:0;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);}

  /* dropzone */
  .drop{display:flex;align-items:center;gap:14px;border:2px dashed color-mix(in srgb,var(--accent) 55%,var(--line));border-radius:14px;
    padding:11px 15px;cursor:pointer;background:var(--panel-2);transition:border-color .15s,background .15s;margin-bottom:16px;}
  .drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);}
  .drop .cloud{width:40px;height:40px;flex:0 0 auto;border-radius:12px;display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);color:var(--accent);}
  .drop .cloud svg{width:22px;height:22px;}
  .drop .dinfo{flex:1;min-width:0;text-align:start;}
  .drop .big{font-size:14.5px;font-weight:600;color:var(--ink);}
  .drop .dhint{margin-top:2px;font-size:11.5px;color:var(--faint);font-family:var(--mono);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .drop .dbtns{display:flex;align-items:center;gap:8px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end;}
  .drop .choose{display:inline-flex;align-items:center;gap:7px;color:#fff;border:none;white-space:nowrap;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:600;font-size:13px;padding:9px 16px;border-radius:999px;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.14),0 6px 16px var(--grad-btn-glow);transition:filter .14s,transform .08s;}
  .drop .choose:hover{filter:brightness(1.05);} .drop .choose:active{transform:translateY(1px);}
  .drop .choose svg{width:15px;height:15px;}
  .drop .choose.ghost{color:var(--accent-dim,var(--accent));background:var(--panel);border:1px solid var(--accent);text-shadow:none;box-shadow:none;}
  html[data-theme="dark"] .drop .choose.ghost{color:var(--accent);}
  .drop .choose.ghost:hover{background:var(--accent-soft);filter:none;}
  @media (max-width:560px){ .drop{flex-wrap:wrap;} .drop .dinfo{flex:1 1 auto;} .drop .dbtns{flex:1 1 100%;} .drop .choose{flex:1;justify-content:center;} }
  input[type=file]{display:none;}

  /* file list */
  /* the files card is a fixed-height internal window: the header (count + view toggle) and the
     total-size row are ordinary siblings that stay put, while ONLY the middle grid scrolls. That
     grid's max-height is what caps the whole thing — JS sets an exact inline value (sizeFilesWindow)
     so the window ends just above the viewport bottom no matter how tall the stuff above it is; the
     calc() below is only a no-JS fallback. Result: the card never grows with the file count and the
     page itself never has to scroll to reveal files. Same principle on mobile/tablet. */
  .files{display:flex;flex-direction:column;}
  .fhead,.ftot{flex:0 0 auto;}
  /* shared scroll region for BOTH list & gallery views: sizes to its content up to the cap, then
     shows a draggable scrollbar (renders on the left edge in RTL) instead of pushing the page taller. */
  .flist,.fgrid{max-height:calc(100dvh - 452px);overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;}
  .flist{display:flex;flex-direction:column;gap:8px;padding:14px;}
  .flist::-webkit-scrollbar,.fgrid::-webkit-scrollbar{width:12px;}
  .flist::-webkit-scrollbar-button,.fgrid::-webkit-scrollbar-button{display:none;height:0;width:0;}
  .flist::-webkit-scrollbar-track,.fgrid::-webkit-scrollbar-track{background:transparent;margin:4px 0;}
  .flist::-webkit-scrollbar-thumb,.fgrid::-webkit-scrollbar-thumb{background:var(--faint);border-radius:999px;border:3px solid var(--panel);min-height:44px;}
  .flist::-webkit-scrollbar-thumb:hover,.fgrid::-webkit-scrollbar-thumb:hover{background:var(--muted);}
  .frow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line-2);border-radius:11px;background:var(--panel);}
  .frow .fico{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);}
  .frow .fico.image{color:var(--info);background:var(--info-soft);} .frow .fico.video{color:#e5484d;background:var(--danger-soft);}
  .frow .fico.audio{color:var(--accent);} .frow .fico.doc{color:var(--info-dim);background:var(--info-soft);}
  .frow .fico svg{width:17px;height:17px;}
  .frow .fn{flex:1;min-width:0;}
  .frow .fn .nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .frow .fn .sz{font-family:var(--mono);font-size:11px;color:var(--faint);}
  .frow .rm{width:30px;height:30px;flex-shrink:0;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;}
  .frow .rm:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft);}
  .frow .rm svg{width:15px;height:15px;}
  .ftot{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line-2);
    font-size:13px;color:var(--muted);}
  .ftot b{color:var(--ink);font-family:var(--mono);}
  .flist.empty-hint{color:var(--faint);font-size:13px;text-align:center;padding:22px;}

  /* thumbnail inside a list row (images) */
  .frow .fico.img{background:none;overflow:hidden;}
  .frow .fico.img img{width:100%;height:100%;object-fit:cover;display:block;}

  /* files card header + view toggle */
  .fhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 0;}
  .fhead .fcount{font-size:12.5px;color:var(--muted);font-weight:600;}
  .fhead .fcount b{color:var(--ink);}
  .vtoggle{display:flex;gap:3px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:3px;flex:0 0 auto;}
  .vbtn{width:32px;height:28px;border:none;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;transition:color .14s,background .14s,box-shadow .14s;}
  .vbtn svg{width:16px;height:16px;}
  .vbtn.on{background:var(--panel);color:var(--accent-dim);box-shadow:var(--shadow-sm);}
  .vbtn:hover:not(.on){color:var(--ink-2);}

  /* gallery view */
  .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;padding:14px;}
  .fcard{position:relative;border:1px solid var(--line-2);border-radius:12px;background:var(--panel);overflow:hidden;}
  .fcard .fthumb{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:var(--panel-2);overflow:hidden;}
  .fcard .fthumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .fcard .fthumb .fico{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);}
  .fcard .fthumb .fico.image{color:var(--info);background:var(--info-soft);} .fcard .fthumb .fico.video{color:#e5484d;background:var(--danger-soft);}
  .fcard .fthumb .fico.audio{color:var(--accent);} .fcard .fthumb .fico.doc{color:var(--info-dim);background:var(--info-soft);}
  .fcard .fthumb .fico svg{width:23px;height:23px;}
  .fcard .ext-badge{position:absolute;bottom:7px;inset-inline-start:7px;font-family:var(--mono);font-size:9.5px;font-weight:700;
    text-transform:uppercase;letter-spacing:.03em;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--ink) 70%,transparent);color:#fff;}
  .fcard .fmeta{padding:8px 10px 10px;}
  .fcard .fmeta .nm{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fcard .fmeta .sz{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:2px;}
  .fcard .rm{position:absolute;top:7px;inset-inline-end:7px;width:28px;height:28px;border-radius:8px;border:1px solid var(--line);
    background:color-mix(in srgb,var(--panel) 80%,transparent);color:var(--muted);cursor:pointer;z-index:1;
    display:flex;align-items:center;justify-content:center;transition:all .12s;}
  .fcard .rm:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft);}
  .fcard .rm svg{width:14px;height:14px;}

  /* options side */
  .side{padding:13px 18px;position:sticky;top:14px;}
  .side h3{font-size:15px;margin:0 0 8px;font-weight:700;}
  .opt{margin-bottom:8px;}
  .opt > label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .two .opt{margin-bottom:8px;}
  @media (max-width:560px){ .two{grid-template-columns:1fr;} }
  .seg{display:flex;gap:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:4px;}
  .segbtn{flex:1;height:36px;border:none;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;
    font-size:13px;font-weight:600;transition:color .14s,background .14s,box-shadow .14s;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
  .segbtn.on{background:var(--panel);color:var(--accent-dim);box-shadow:var(--shadow-sm);}
  .segbtn svg{width:14px;height:14px;}
  .inp,.ta{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;
    font-family:var(--sans);font-size:13.5px;padding:10px 12px;transition:border-color .12s,box-shadow .12s;}
  .inp:focus,.ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .ta{resize:vertical;min-height:46px;}
  .inp[dir=ltr]{text-align:start;}
  select.inp{cursor:pointer;}
  .chkline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);cursor:pointer;margin-bottom:8px;}
  .chkline input{accent-color:var(--accent);width:15px;height:15px;}
  .hidden{display:none !important;}

  .sendbtn{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:9px;color:#fff;border:none;cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:600;font-size:15px;padding:13px 20px;border-radius:999px;text-shadow:0 1px 2px rgba(0,0,0,.18);margin-top:4px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.14),0 8px 20px var(--grad-btn-glow);
    transition:filter .14s,transform .08s;}
  .sendbtn:hover{filter:brightness(1.05);} .sendbtn:active{transform:translateY(1px);}
  .sendbtn:disabled{opacity:.5;cursor:not-allowed;filter:none;transform:none;}
  .sendbtn svg{width:17px;height:17px;}
  .opterr{font-size:11.5px;color:var(--danger);margin-top:8px;min-height:14px;text-align:center;}

  /* progress */
  .prog{padding:16px;display:none;}
  .prog.show{display:block;}
  .prog .lbl{font-size:13px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;}
  .bar{height:10px;border-radius:999px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line-2);}
  .bar i{display:block;height:100%;width:0;background:var(--grad);border-radius:999px;transition:width .2s ease;}

  /* share result */
  .share{padding:22px;display:none;}
  .share.show{display:block;}
  .share .ok{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    background:var(--success-soft);color:var(--success-dim);}
  .share .ok svg{width:28px;height:28px;}
  .share h3{text-align:center;font-size:19px;margin:0 0 4px;}
  .share .subt{text-align:center;font-size:13px;color:var(--muted);margin:0 0 18px;}
  .linkrow{display:flex;gap:8px;margin-bottom:14px;}
  .linkrow .lk{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;
    font-family:var(--mono);font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;}
  .copybtn{flex-shrink:0;display:inline-flex;align-items:center;gap:7px;color:#fff;border:none;cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:600;font-size:13px;padding:0 16px;border-radius:10px;text-shadow:0 1px 2px rgba(0,0,0,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 12px var(--grad-btn-glow);transition:filter .14s;}
  .copybtn:hover{filter:brightness(1.05);} .copybtn svg{width:15px;height:15px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px;}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-family:var(--mono);color:var(--muted);
    background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;}
  .chip svg{width:13px;height:13px;color:var(--accent);}
  .share .row2{display:flex;gap:10px;flex-wrap:wrap;}
  .share .row2 a,.share .row2 button{flex:1;min-width:130px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 16px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid var(--line);
    background:var(--panel);color:var(--ink-2);transition:border-color .12s,transform .08s;box-shadow:var(--shadow-sm);}
  .share .row2 a:hover,.share .row2 button:hover{border-color:var(--accent);} .share .row2 *:active{transform:translateY(1px);}
  .share .row2 .del{color:var(--danger);border-color:var(--danger);background:transparent;}
  .share .row2 .del:hover{background:var(--danger-soft);}
  .share .row2 svg{width:15px;height:15px;}
  .seam{display:flex;align-items:flex-start;gap:8px;margin-top:16px;padding:11px 13px;border-radius:11px;
    background:var(--warm-soft);border:1px solid var(--warm-line);font-size:11.5px;color:var(--ink-2);line-height:1.55;}
  .seam svg{width:15px;height:15px;color:var(--warn);flex-shrink:0;margin-top:1px;}

  /* qr + live stats */
  .qrwrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:0 0 18px;}
  .qrbox{width:172px;height:172px;padding:10px;border-radius:14px;background:#fff;border:1px solid var(--line);
    box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;}
  .qrbox img{width:100%;height:100%;image-rendering:pixelated;display:block;}
  .qrdl{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--accent-dim);
    background:var(--accent-soft);border:1px solid transparent;border-radius:999px;padding:7px 14px;cursor:pointer;transition:filter .12s;}
  .qrdl:hover{filter:brightness(0.97);} .qrdl svg{width:14px;height:14px;}
  .statline{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 16px;font-size:12.5px;color:var(--muted);}
  .statline .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex-shrink:0;}
  .statline.live .dot{background:var(--success);box-shadow:0 0 0 3px var(--success-soft);animation:pulse 1.6s ease-in-out infinite;}
  .statline b{color:var(--ink);font-family:var(--mono);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

  .brandsec{border-top:1px dashed var(--line);margin-top:4px;padding-top:11px;}

  .brandsub{font-size:11.5px;color:var(--muted);line-height:1.5;margin-bottom:11px;}
  .tiles{display:flex;gap:9px;margin-bottom:11px;}
  .tile{flex:1;position:relative;height:74px;border:1.4px dashed var(--line);border-radius:11px;background:var(--panel-2);
    cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:border-color .12s,background .12s;}
  .tile:hover{border-color:var(--accent);background:var(--accent-soft);}
  .tile-empty{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);font-size:11.5px;font-weight:600;pointer-events:none;}
  .tile-empty svg{width:19px;height:19px;color:var(--accent);}
  .tile.filled{border-style:solid;border-color:var(--line);background:#fff;}
  .tile.filled .tile-empty{display:none;}
  .tile-img{max-width:88%;max-height:60px;object-fit:contain;}
  #bgTile.filled{background-size:cover;background-position:center;}
  #bgTile.filled .tile-img{display:none;}
  .tile-x{position:absolute;top:5px;inset-inline-end:5px;width:22px;height:22px;border-radius:7px;border:none;cursor:pointer;
    background:rgba(10,12,20,.62);color:#fff;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2;}
  .tile-x:hover{background:var(--danger);}
  .mini-lbl{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin:2px 0 8px;}
  .swatches{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:13px;}
  .swatch{width:25px;height:25px;border-radius:7px;cursor:pointer;border:2px solid var(--panel);outline:1px solid var(--line);
    padding:0;transition:transform .1s;}
  .swatch:hover{transform:scale(1.08);} .swatch.on{outline:2px solid var(--ink);outline-offset:1px;}
  .colorpick{width:32px;height:27px;padding:0;border:1px solid var(--line);border-radius:7px;background:var(--panel);cursor:pointer;}
  .bprev{position:relative;height:118px;border-radius:13px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow-sm);}
  .bprev-bg{position:absolute;inset:0;background-size:cover;background-position:center;}
  .bprev-in{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;}
  .bprev-logo{background:#fff;border-radius:9px;padding:6px 10px;box-shadow:0 4px 12px rgba(0,0,0,.2);}
  .bprev-logo img{display:block;max-height:26px;max-width:120px;object-fit:contain;}
  .bprev-name{font-size:15px;font-weight:800;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.35);text-align:center;padding:0 8px;}
  .bprev-hint{font-size:11px;color:var(--faint);text-align:center;margin-top:7px;}
  .brandlock{border:1.4px solid var(--line);border-radius:13px;background:var(--panel-2);padding:12px 15px;margin-top:4px;
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;}
  .brandlock[hidden]{display:none;}
  .brandlock-badge{font-size:10px;font-weight:800;letter-spacing:.06em;color:#fff;background:var(--grad);padding:3px 10px;border-radius:999px;}
  .brandlock-ic{width:26px;height:26px;color:var(--accent);}
  .brandlock-txt{font-size:12px;color:var(--muted);line-height:1.55;max-width:250px;}
  .brandlock-cta{display:inline-block;text-decoration:none;font-size:12.5px;font-weight:700;color:#fff;
    background:var(--grad-btn);padding:9px 18px;border-radius:10px;box-shadow:0 4px 12px var(--grad-btn-glow);transition:filter .14s;}
  .brandlock-cta:hover{filter:brightness(1.06);}

  footer{margin-top:6px;text-align:center;color:var(--faint);font-size:12px;font-family:var(--mono);}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:11px 18px;border-radius:999px;
    box-shadow:var(--shadow-lg);transition:opacity .2s,transform .2s;z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  function safeOwnerId(v){ return String(v||'guest').toLowerCase().replace(/[^a-z0-9_.@-]+/g,'_') || 'guest'; }

    let email=''; try{ email=(localStorage.getItem('ac_session')||'').toLowerCase(); }catch(_){}

    try{
      const users=JSON.parse(localStorage.getItem('ac_users')||'[]')||[];
      const u=users.find(x=>(x.email||'').toLowerCase()===email);

    }catch(_){ return safeOwnerId(email); }
  }
  function scopedKey(base){ return base+'::'+currentOwnerId(); }
  function sendIndex(){
    try{ const a=JSON.parse(localStorage.getItem(scopedKey('kolkli_send_links'))||'[]'); return Array.isArray(a)?a:[]; }

  function saveSendIndex(a){ try{ localStorage.setItem(scopedKey('kolkli_send_links'), JSON.stringify((a||[]).slice(0,100))); }catch(_){} }
  function upsertSendIndex(rec){
    const a=sendIndex().filter(x=>x.token!==rec.token);
    const bytes=(rec.files||[]).reduce((s,f)=>s+(f.size||0),0);
    a.unshift({ token:rec.token, ownerId:rec.ownerId, createdAt:rec.createdAt, expiresAt:rec.expiresAt,
      files:(rec.files||[]).length, bytes, downloads:rec.downloads||0 });
    saveSendIndex(a);
  }

  // ---- client branding (saved profile, reused across sends) ----
  const DEFCLR='#7b34ff';
  const SWATCHES=['#7b34ff','#3f85ff','#0ea5a5','#16a34a','#ef7d00','#e5484d','#ec4899','#0f172a'];

  function loadBrand(){

  // branding is a paid feature: Pro + Business only (Free/Lite are locked out)

    let plan='';

      const email=(localStorage.getItem('ac_session')||'').toLowerCase();
      if(email){
        const users=JSON.parse(localStorage.getItem('ac_users')||'[]')||[];
        const u=users.find(x=>(x.email||'').toLowerCase()===email);
        if(u&&u.plan) plan=u.plan;

    if(!plan){ try{ plan=localStorage.getItem('ac_plan')||''; }catch(_){} }
    return (plan||'free').toLowerCase();

  function canBrand(){ const p=currentPlan(); return p==='pro'||p==='business'; }
  function applyBrandGate(){
    const ok=canBrand(), body=el('brandBody'), lock=el('brandLock');

    if(lock) lock.hidden=ok;

  function brandForRecord(){
    if(!canBrand()) return null;
    const b=brand||{};
    const any=(b.name&&b.name.trim())||b.logo||b.bg||((b.color||DEFCLR).toLowerCase()!==DEFCLR);
    if(!any) return null;
    return { name:(b.name||'').trim(), tagline:(b.tagline||'').trim(), logo:b.logo||'', bg:b.bg||'', color:b.color||DEFCLR };
  }
  function readImageScaled(file,maxW,maxH,mime,q){
    return new Promise((resolve,reject)=>{
      const url=URL.createObjectURL(file), img=new Image();
      img.onload=()=>{
        let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        if(!w||!h){ URL.revokeObjectURL(url); return reject(new Error('dim')); }
        const s=Math.min(1,maxW/w,maxH/h); w=Math.max(1,Math.round(w*s)); h=Math.max(1,Math.round(h*s));
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        try{ resolve(c.toDataURL(mime,q)); }catch(e){ reject(e); }
      };
      img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('load')); };
      img.src=url;
    });
  }
  function hexRgb(h){ h=String(h||'').replace('#',''); if(h.length===3)h=h.split('').map(x=>x+x).join(''); if(!/^[0-9a-f]{6}$/i.test(h))return null; const n=parseInt(h,16); return {r:(n>>16)&255,g:(n>>8)&255,b:n&255}; }
  function mixc(a,b,tt){ return {r:Math.round(a.r+(b.r-a.r)*tt),g:Math.round(a.g+(b.g-a.g)*tt),b:Math.round(a.b+(b.b-a.b)*tt)}; }
  function hexOfc(c){ return '#'+[c.r,c.g,c.b].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join(''); }
  function gradFor(hex){ const c=hexRgb(hex)||hexRgb(DEFCLR), l=mixc(c,{r:255,g:255,b:255},0.16); return 'linear-gradient(120deg,'+hexOfc(c)+' 0%,'+hexOfc(l)+' 100%)'; }
  function buildSwatches(){
    const wrap=el('swatches'); if(!wrap||wrap._built) return; wrap._built=true;
    SWATCHES.forEach(clr=>{
      const b=document.createElement('button'); b.type='button'; b.className='swatch'; b.dataset.c=clr; b.style.background=clr; b.title=clr;
      b.addEventListener('click',()=>{ brand.color=clr; saveBrand(); renderBrandUI(); });
      wrap.appendChild(b);
    });
    const pick=document.createElement('input'); pick.type='color'; pick.id='colorPick'; pick.className='colorpick'; pick.value=brand.color||DEFCLR;
    pick.addEventListener('input',()=>{ brand.color=pick.value; saveBrand(); renderBrandUI(); });
    wrap.appendChild(pick);
  }
  function tileFill(kind){
    const tile=el(kind+'Tile'), img=el(kind+'Img'), x=el(kind+'X'), data=(kind==='logo')?brand.logo:brand.bg;
    if(data){
      tile.classList.add('filled'); x.classList.remove('hidden');
      if(kind==='bg'){ tile.style.backgroundImage='url("'+data+'")'; img.classList.add('hidden'); }
      else { img.src=data; img.classList.remove('hidden'); }
    } else {
      tile.classList.remove('filled'); x.classList.add('hidden');
      if(kind==='bg') tile.style.backgroundImage='';
      img.classList.add('hidden'); img.removeAttribute('src');
    }
  }
  function renderBrandUI(){
    if(!el('brandName')) return;
    if(document.activeElement!==el('brandName')) el('brandName').value=brand.name||'';
    if(document.activeElement!==el('brandTagline')) el('brandTagline').value=brand.tagline||'';
    const pick=el('colorPick'); if(pick) pick.value=brand.color||DEFCLR;

    const bg=el('bprevBg');

    else el('bprevLogo').classList.add('hidden');
    el('bprevName').textContent=brand.name||t.brandYou;

  function extOf(name){ const m=(name||'').match(/\.([^.\/\\]+)$/); return m?m[1].toLowerCase():''; }
  function fmtBytes(n){ if(n==null) return '—'; if(n>=1073741824) return (n/1073741824).toFixed(2)+' GB'; if(n>=1048576) return (n/1048576).toFixed(1)+' MB'; if(n>=1024) return (n/1024).toFixed(0)+' KB'; return n+' B'; }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function totalBytes(){ return files.reduce((a,f)=>a+f.size,0); }
  function randToken(){
    if(window.crypto && crypto.getRandomValues){ const a=new Uint8Array(9); crypto.getRandomValues(a); return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join(''); }
    return Math.random().toString(36).slice(2)+Date.now().toString(36);
  }
  async function hashPass(str){
    try{ if(window.crypto && crypto.subtle){ const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); } }catch(_){}
    let h=5381; for(let i=0;i<str.length;i++){ h=((h<<5)+h)+str.charCodeAt(i); h|=0; } return 'x'+(h>>>0).toString(16);
  }

  // ---- IndexedDB (demo store; the server replaces this) ----
  function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open('audiocut',1); r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains('transfers')) r.result.createObjectStore('transfers'); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
  async function idbPut(key,val){ const db=await idb(); return new Promise((res,rej)=>{ const tx=db.transaction('transfers','readwrite'); tx.objectStore('transfers').put(val,key); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
  async function idbGet(key){ const db=await idb(); return new Promise((res,rej)=>{ const tx=db.transaction('transfers','readonly'); const rq=tx.objectStore('transfers').get(key); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); }
  async function idbDel(key){ const db=await idb(); return new Promise((res,rej)=>{ const tx=db.transaction('transfers','readwrite'); tx.objectStore('transfers').delete(key); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }

  // ---- intake ----
  // accepts either a FileList/File[] or an array of {file,path}; keeps each file's relative
  // path so dropped folders keep their structure (used as the zip entry path on the recipient side)
  function pathItems(list){ return Array.from(list||[]).map(f=>({file:f, path:f.webkitRelativePath||f.name})); }
  function addFiles(items){
    (items||[]).forEach(it=>{
      const file = it.file || it;                       // tolerate a raw File too
      const path = (it.path || file.webkitRelativePath || file.name);
      const ext=extOf(file.name);
      const kind=kindOf(ext);
      const rec={ id:'f'+(uid++), file, name:file.name, path, ext, kind, size:file.size, thumb:'' };
      if(kind==='image'){ try{ rec.thumb=URL.createObjectURL(file); }catch(_){} }   // preview for gallery/list
      files.push(rec);
    });
    renderFiles();
  }

  // walk dropped directories via the entries API so whole folders keep their tree
  async function addFromDataTransfer(dt){
    let items;
    try{ items = await filesFromDataTransfer(dt); }
    catch(_){ items = pathItems(dt.files); }
    addFiles(items);
  }
  function filesFromDataTransfer(dt){
    const list = dt.items ? Array.from(dt.items) : [];
    const entries = list.map(it=> it.webkitGetAsEntry ? it.webkitGetAsEntry() : null).filter(Boolean);
    if(!entries.length){ return Promise.resolve(pathItems(dt.files)); }
    const out=[];
    return Promise.all(entries.map(en=>walkEntry(en,'',out))).then(()=>out);
  }
  function walkEntry(entry, prefix, out){
    return new Promise(resolve=>{
      if(!entry){ resolve(); return; }
      if(entry.isFile){ entry.file(f=>{ out.push({file:f, path:prefix+entry.name}); resolve(); }, ()=>resolve()); }
      else if(entry.isDirectory){
        const reader=entry.createReader(), kids=[];
        const readBatch=()=>reader.readEntries(batch=>{
          if(!batch.length){ Promise.all(kids.map(k=>walkEntry(k, prefix+entry.name+'/', out))).then(resolve); }
          else { kids.push(...batch); readBatch(); }
        }, ()=>resolve());
        readBatch();
      } else resolve();
    });
  }
  function removeFile(id){
    const f=files.find(x=>x.id===id);
    if(f&&f.thumb){ try{ URL.revokeObjectURL(f.thumb); }catch(_){} }
    files=files.filter(x=>x.id!==id); renderFiles();
  }

  function renderFiles(){
    const card=el('filesCard'), list=el('flist');
    card.style.display = files.length? '' : 'none';
    // header: file count + active view button
    if(el('fcountVal')) el('fcountVal').textContent = files.length;
    if(el('fcountWord')) el('fcountWord').textContent = t.filesWord(files.length);
    document.querySelectorAll('#vtoggle .vbtn').forEach(b=>{
      const v=b.getAttribute('data-view');
      b.classList.toggle('on', v===view);
      b.title = v==='gallery' ? t.viewGallery : t.viewList;
    });
    if(view==='gallery'){
      list.className='fgrid';
      list.innerHTML = files.map(f=>`
        <div class="fcard">
          <button class="rm" data-rm="${f.id}" title="${escapeHtml(t.remove)}">${ICON.trash}</button>
          <div class="fthumb">
            ${f.thumb ? `<img src="${f.thumb}" alt="" loading="lazy">` : `<span class="fico ${f.kind}">${ICON[f.kind]}</span>`}
            ${f.ext ? `<span class="ext-badge">${escapeHtml(f.ext)}</span>` : ''}
          </div>
          <div class="fmeta">
            <div class="nm" title="${escapeHtml(f.path||f.name)}">${escapeHtml(f.name)}</div>
            <div class="sz">${fmtBytes(f.size)}</div>
          </div>
        </div>`).join('');
    } else {
      list.className='flist';
      list.innerHTML = files.map(f=>`
        <div class="frow">
          <span class="fico ${f.kind}${f.thumb?' img':''}">${f.thumb ? `<img src="${f.thumb}" alt="" loading="lazy">` : ICON[f.kind]}</span>
          <span class="fn"><div class="nm" title="${escapeHtml(f.path||f.name)}">${escapeHtml(f.path||f.name)}</div><div class="sz">${fmtBytes(f.size)}</div></span>
          <button class="rm" data-rm="${f.id}" title="${escapeHtml(t.remove)}">${ICON.trash}</button>
        </div>`).join('');
    }
    el('totalVal').textContent = fmtBytes(totalBytes());
    el('sendBtn').disabled = files.length===0;
    sizeFilesWindow();
  }

  // Cap the scrolling grid so the files card behaves as a fixed-height internal window: measure the
  // grid's natural offset from the top of the document and give it just the height that fits above
  // the viewport bottom (minus the pinned total-size row). That keeps the header + total row visible
  // and lets ONLY the middle grid scroll — the page itself never grows with the file count. Re-run
  // after every render and on resize/rotate; same on mobile (window.innerHeight tracks the URL bar).
  function sizeFilesWindow(){
    const list=el('flist'), ftot=document.querySelector('#filesCard .ftot');
    if(!list || !files.length || !list.offsetParent) return;   // skip when hidden (e.g. result view)
    const top=list.getBoundingClientRect().top + window.scrollY;   // stable doc offset (scroll-safe)
    const ftotH=ftot ? ftot.offsetHeight : 46;                     // total row stays pinned below
    const avail=window.innerHeight - top - ftotH - 22;             // 22px breathing room at the bottom
    list.style.maxHeight=Math.max(180, avail)+'px';
  }
  window.addEventListener('resize', sizeFilesWindow);
  window.addEventListener('orientationchange', sizeFilesWindow);

  function expiryText(days){ days=+days; return days===1 ? t.day : t.days(days); }

  function toast(msg){ const el2=el('toast'); el2.textContent=msg; el2.classList.add('show'); clearTimeout(el2._t); el2._t=setTimeout(()=>el2.classList.remove('show'),1800); }
  function withUsage(tool,payload,work){
    if(window.KolkliUsage && window.KolkliUsage.guard) return window.KolkliUsage.guard(tool,payload,work);
    return Promise.resolve().then(work);
  }

  // ---- create link ----
  async function createLink(){
    el('optErr').textContent='';
    if(!files.length){ el('optErr').textContent=t.errNoFiles; return; }
    const recipientEmail=(el('recipientEmail').value||'').trim();
    if(method==='email' && !(recipientEmail || el('recipients').value.trim())){ el('optErr').textContent=t.errNoEmail; return; }
    const pwOn=el('pwToggle').checked, pwVal=el('password').value;
    if(pwOn && !pwVal){ el('optErr').textContent=t.errNoPw; return; }
    const notifyOn=el('notifyToggle').checked;

    const prog=el('progCard');
    let result=null;
    try{
      result = await withUsage('send-files', { files:files.length, totalBytes:totalBytes() }, async()=>{
        // fake-but-real progress while we write blobs to IndexedDB
        el('composer').style.display='none';
        prog.classList.add('show');
        const days=+el('expiry').value;
        const token=randToken();
        const record={
          token, ownerId:currentOwnerId(), createdAt:Date.now(), expiresAt:Date.now()+days*86400000,
          sender:{
            name:(el('senderName').value||'').trim(),
            email:(el('senderEmail').value||'').trim()
          },
          recipient:{
            name:(el('recipientName').value||'').trim(),
            email:recipientEmail
          },
          message:el('message').value.trim(),
          recipients:method==='email'? (recipientEmail || el('recipients').value.trim()) : recipientEmail,
          password: pwOn? await hashPass(pwVal) : null,
          notify: notifyOn,
          downloads:0,
          files: files.map(f=>({ name:(f.path||f.name), size:f.size, type:f.file.type||'', blob:f.file })),
        };
        record.brand = brandForRecord();

        const total=Math.max(totalBytes(),1); let done=0;
        // animate progress proportional to file sizes (purely visual for the demo)
        for(let i=0;i<files.length;i++){
          await new Promise(r=>setTimeout(r, 120));
          done+=files[i].size; setProg(Math.min(99, Math.round(done/total*100)));
        }
        await idbPut('t_'+token, record);
        upsertSendIndex(record);
        setProg(100);
        await new Promise(r=>setTimeout(r,200));
        return { token, days, record };
      });
    }catch(err){
      prog.classList.remove('show');
      el('composer').style.display='';
      if(err && err.usage) return;
      throw err;
    }

    prog.classList.remove('show');
    showShare(result.token, result.days, pwOn, notifyOn);
    if(method==='email' && result.record.recipients){ openMailto(); }
  }
  function setProg(p){ el('progBar').style.width=p+'%'; el('progPct').textContent=p+'%'; }

  let currentToken=null, currentUrl='', currentDays=7, statTimer=null, notifyEnabled=false, lastNotifiedCount=0, bc=null;
  function showShare(token, days, pwOn, notifyOn){
    currentToken=token; currentDays=days;
    const url=new URL('download.html?t='+token, location.href).href;
    currentUrl=url;
    el('shareLink').textContent=url;
    el('previewLink').href=url;
    el('shareChips').innerHTML =
      `<span class="chip">${clockSvg()} ${t.chipExpiry(expiryText(days))}</span>`+
      `<span class="chip">${fileSvg()} ${t.chipFiles(files.length)}</span>`+
      (pwOn? `<span class="chip">${lockSvg()} ${t.chipPw}</span>` : '');
    renderQR(url);
    el('emailBtn').classList.toggle('hidden', !(method==='email' && ((el('recipientEmail').value||'').trim() || el('recipients').value.trim())));
    lastNotifiedCount=0;
    updateStat(0);
    startStatWatch(notifyOn);
    el('shareCard').classList.add('show');
    el('shareCard').scrollIntoView({behavior:'smooth',block:'center'});
  }

  // ---- QR code ----
  function renderQR(url){
    const box=el('qrBox'), wrap=el('qrWrap');
    try{
      const qr=qrcode(0,'M'); qr.addData(url); qr.make();
      box.innerHTML=qr.createImgTag(5,10);
      const img=box.querySelector('img'); if(img) img.alt='QR';
      box._png=qr.createDataURL(8,10);
      wrap.style.display='';
    }catch(_){ wrap.style.display='none'; }
  }
  function downloadQR(){
    const png=el('qrBox')._png; if(!png) return;
    const a=document.createElement('a'); a.href=png; a.download='kolkli-qr.png'; document.body.appendChild(a); a.click(); a.remove();
  }

  // ---- email delivery (opens the sender's mail app, prefilled) ----
  function buildMailto(){
    const to=encodeURIComponent((el('recipientEmail').value||'').trim() || el('recipients').value.trim());
    const msg=el('message').value.trim();
    const subject=encodeURIComponent(t.emailSubject);
    const body=encodeURIComponent((msg? msg+'\n\n':'')+t.emailBodyLead+'\n'+currentUrl+'\n\n'+t.emailBodyExpiry(expiryText(currentDays)));
    return 'mailto:'+to+'?subject='+subject+'&body='+body;
  }
  function openMailto(){ const a=document.createElement('a'); a.href=buildMailto(); a.style.display='none'; document.body.appendChild(a); a.click(); a.remove(); }

  // ---- live download stats + notifications ----
  function updateStat(count){
    const line=el('statLine');
    line.classList.toggle('live', count>0);
    line.innerHTML=`<span class="dot"></span><span>${count>0? t.statDownloads(count) : t.statWaiting}</span>`;
    line.dataset.count=count;
  }
  function fireNotify(){
    const count=+el('statLine').dataset.count||0;
    if(count<=lastNotifiedCount) return; lastNotifiedCount=count;
    try{ if('Notification'in window && Notification.permission==='granted') new Notification(t.notifTitle,{body:t.notifBody}); }catch(_){}
    toast(t.notifTitle);
  }
  function onDownloadCount(count){
    const prev=+el('statLine').dataset.count||0;
    if(count===prev) return;
    updateStat(count);
    if(count>prev && notifyEnabled) fireNotify();
  }
  function ensureBC(){
    if(bc || !('BroadcastChannel'in window)) return;
    try{ bc=new BroadcastChannel('audiocut_dl'); bc.onmessage=e=>{ const d=e.data||{}; if(d.token && d.token===currentToken && typeof d.downloads==='number') onDownloadCount(d.downloads); }; }catch(_){}
  }
  function startStatWatch(notifyOn){
    notifyEnabled=!!notifyOn; ensureBC(); stopStatWatch();
    statTimer=setInterval(async()=>{
      if(!currentToken) return;
      let rec=null; try{ rec=await idbGet('t_'+currentToken); }catch(_){}
      if(rec) onDownloadCount(rec.downloads||0);
    },4000);
  }
  function stopStatWatch(){ if(statTimer){ clearInterval(statTimer); statTimer=null; } }
  function clockSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>'; }
  function fileSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2v6h6"/><path d="M4 2h10l6 6v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/></svg>'; }
  function lockSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'; }

  function reset(){
    files=[]; currentToken=null;
    stopStatWatch(); notifyEnabled=false; lastNotifiedCount=0;
    el('shareCard').classList.remove('show');
    el('message').value=''; el('recipients').value=''; el('password').value='';
    el('senderName').value=''; el('senderEmail').value='';
    el('recipientName').value=''; el('recipientEmail').value='';
    el('pwToggle').checked=false; el('password').classList.add('hidden');
    el('notifyToggle').checked=false; el('emailBtn').classList.add('hidden');
    el('composer').style.display=''; renderFiles();
    window.scrollTo({top:0,behavior:'smooth'});
  }

  // ---- i18n + theme ----
  function applyLang(l){
    lang=l; t=I18N[l];
    document.documentElement.lang=l; document.documentElement.dir=t.dir;
    document.querySelectorAll('[data-i18n]').forEach(n=>{ const k=n.getAttribute('data-i18n'); if(typeof t[k]==='string') n.textContent=t[k]; });
    document.querySelectorAll('[data-i18n-ph]').forEach(n=>{ const k=n.getAttribute('data-i18n-ph'); if(typeof t[k]==='string') n.setAttribute('placeholder',t[k]); });
    try{ localStorage.setItem('ac_lang', l); }catch(_){}
    renderFiles();
    if(el('bprevName')) renderBrandUI();
  }
  function ls(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
  function detectLang(){
    const chosen=ls('ac_lang'); if(chosen) return chosen;
    const cc=ls('ac_country'); if(cc) return cc==='IL'?'he':'en';
    let tz=''; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(_){}
    const navHe=(navigator.language||'').toLowerCase().indexOf('he')===0;
    return (tz==='Asia/Jerusalem'||navHe)?'he':'en';
  }
  function applyTheme(th){
    const dark=(th==='dark');
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
    el('themeIco').textContent = dark?'☀️':'🌙';
    try{ localStorage.setItem('theme', dark?'dark':'light'); }catch(_){}
  }

  // ---- events ----
  const drop=el('drop'), input=el('fileInput'), folderInput=el('folderInput');
  el('chooseBtn').addEventListener('click',e=>{ e.stopPropagation(); input.click(); });
  el('chooseFolderBtn').addEventListener('click',e=>{ e.stopPropagation(); folderInput.click(); });
  drop.addEventListener('click',()=>input.click());
  input.addEventListener('change',()=>{ addFiles(pathItems(input.files)); input.value=''; });
  folderInput.addEventListener('change',()=>{ addFiles(pathItems(folderInput.files)); folderInput.value=''; });
  ;['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.add('over'); }));
  ;['dragleave','dragend'].forEach(ev=>drop.addEventListener(ev,()=>drop.classList.remove('over')));
  drop.addEventListener('drop',e=>{ e.preventDefault(); drop.classList.remove('over'); if(e.dataTransfer) addFromDataTransfer(e.dataTransfer); });
  document.addEventListener('dragover',e=>{ if(e.dataTransfer && Array.from(e.dataTransfer.types||[]).includes('Files')) e.preventDefault(); });
  document.addEventListener('drop',e=>{ if(e.target!==drop && e.dataTransfer && Array.from(e.dataTransfer.types||[]).includes('Files')) e.preventDefault(); });

  el('flist').addEventListener('click',e=>{ const b=e.target.closest('[data-rm]'); if(b) removeFile(b.getAttribute('data-rm')); });
  el('vtoggle').addEventListener('click',e=>{ const b=e.target.closest('[data-view]'); if(!b) return; view=b.getAttribute('data-view'); try{ localStorage.setItem('kolkli_send_view',view); }catch(_){} renderFiles(); });

  el('mLink').addEventListener('click',()=>{ method='link'; el('mLink').classList.add('on'); el('mEmail').classList.remove('on'); el('emailOpt').classList.add('hidden'); });
  el('mEmail').addEventListener('click',()=>{ method='email'; el('mEmail').classList.add('on'); el('mLink').classList.remove('on'); el('emailOpt').classList.remove('hidden'); });
  el('pwToggle').addEventListener('change',e=>{ el('password').classList.toggle('hidden', !e.target.checked); if(e.target.checked) el('password').focus(); });
  el('notifyToggle').addEventListener('change',e=>{
    if(!e.target.checked) return;
    if('Notification'in window){
      if(Notification.permission==='granted') toast(t.notifOn);
      else if(Notification.permission==='denied') toast(t.notifBlocked);
      else Notification.requestPermission().then(p=>{ toast(p==='granted'? t.notifOn : t.notifBlocked); });
    } else { toast(t.notifOn); }
  });
  el('qrDlBtn').addEventListener('click',downloadQR);
  el('emailBtn').addEventListener('click',openMailto);

  buildSwatches();
  el('logoTile').addEventListener('click',()=>el('logoInput').click());
  el('bgTile').addEventListener('click',()=>el('bgInput').click());
  el('logoInput').addEventListener('change',async()=>{ const f=el('logoInput').files[0]; el('logoInput').value=''; if(!f)return; try{ brand.logo=await readImageScaled(f,400,200,'image/png',0.92); saveBrand(); renderBrandUI(); }catch(_){ toast(t.brandImgErr); } });
  el('bgInput').addEventListener('change',async()=>{ const f=el('bgInput').files[0]; el('bgInput').value=''; if(!f)return; try{ brand.bg=await readImageScaled(f,1600,1000,'image/jpeg',0.82); saveBrand(); renderBrandUI(); }catch(_){ toast(t.brandImgErr); } });
  el('logoX').addEventListener('click',e=>{ e.stopPropagation(); brand.logo=''; saveBrand(); renderBrandUI(); });
  el('bgX').addEventListener('click',e=>{ e.stopPropagation(); brand.bg=''; saveBrand(); renderBrandUI(); });
  el('brandName').addEventListener('input',()=>{ brand.name=el('brandName').value; saveBrand(); renderBrandUI(); });
  el('brandTagline').addEventListener('input',()=>{ brand.tagline=el('brandTagline').value; saveBrand(); renderBrandUI(); });

  el('sendBtn').addEventListener('click',createLink);
  el('againBtn').addEventListener('click',reset);
  el('delBtn').addEventListener('click',async()=>{ if(currentToken){ await idbDel('t_'+currentToken); deleteSendIndex(currentToken); } reset(); });
  el('copyBtn').addEventListener('click',()=>{
    const url=el('shareLink').textContent;
    const done=()=>toast(t.copied);
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done).catch(fallbackCopy); }
    else fallbackCopy();
    function fallbackCopy(){ const ta=document.createElement('textarea'); ta.value=url; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(_){}; ta.remove(); done(); }
  });

  window.__setLang=applyLang;
  el('themeToggle').addEventListener('click',()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));
  // keep the branding gate in sync when the user logs in/out or switches plan
  window.addEventListener('kolkli:auth',applyBrandGate);
  window.addEventListener('storage',e=>{ if(!e.key||e.key==='ac_session'||e.key==='ac_plan'||e.key==='ac_users') applyBrandGate(); });

  // ---- init ----
  applyTheme(ls('theme')||'light');
  applyLang(detectLang());
  renderFiles();
  applyBrandGate();
})();
</script>
</body>
</html>
