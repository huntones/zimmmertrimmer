# ============================================================
# KOLKLI storage Worker — Cloudflare config.
# Deploy from this folder:  cd worker && npm install && npx wrangler deploy
# ============================================================
name = "kolkli-storage"
main = "src/index.js"
compatibility_date = "2024-11-01"

# --- Non-secret config (safe to commit) -------------------------------
# The anon key is public by design; the account id / bucket are not secret.
[vars]
SUPABASE_URL      = "https://YOUR-PROJECT.supabase.co"
SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY"
R2_ACCOUNT_ID     = "YOUR_CLOUDFLARE_ACCOUNT_ID"
R2_BUCKET         = "kolkli-files"
# Lock this to your site's origin in production (e.g. https://kolkli.com).
ALLOWED_ORIGIN    = "*"

# --- Guest email verification (see EMAIL-VERIFICATION.md) --------------
# Guests must confirm a 6-digit code before an upload is authorized.
# Provider ∈ resend | sendgrid | postmark | smtp2go | mailchannels.
EMAIL_PROVIDER    = "resend"
# Must be an address on a domain you've verified with the provider.
EMAIL_FROM        = "KOLKLI <verify@YOUR-DOMAIN.com>"
EMAIL_BRAND       = "KOLKLI"
# Which tools the gate applies to: transfers | uploads | all | off.
#   transfers = the four file services only (recommended)
#   uploads   = file services + edit:*/ai:* file tools (default in verify.js)
#   off       = disable the server-side gate entirely
VERIFY_SCOPE      = "uploads"
# Optional tuning (defaults shown): code lifetime, resend cooldown, attempts,
# signed-token lifetime, per-IP send throttles.
# VERIFY_CODE_TTL_SEC = "600"
# VERIFY_RESEND_SEC   = "45"
# VERIFY_MAX_ATTEMPTS = "5"
# VERIFY_TOKEN_DAYS   = "30"
# VERIFY_IP_BURST     = "6"
# VERIFY_IP_DAILY     = "30"

# --- Secrets (DO NOT put here; set with `wrangler secret put NAME`) ----
#   R2_ACCESS_KEY_ID       ← from R2 → Manage API Tokens
#   R2_SECRET_ACCESS_KEY   ← from R2 → Manage API Tokens
#   VERIFY_SECRET          ← any long random string; signs the verify tokens
#                            (generate: `openssl rand -base64 48`)
#   EMAIL_API_KEY          ← your email provider's API key
#                            (not needed only if EMAIL_PROVIDER=mailchannels)

# --- Durable Object: free/anonymous usage limits --------------------
# Required for /usage/* quota enforcement. The object stores counters
# by Israel calendar day and combines signed-in/free user id, anonymous
# browser id, browser fingerprint and IP-based abuse limits.
[[durable_objects.bindings]]
name = "USAGE_LIMITER"
class_name = "UsageLimiter"

[[migrations]]
tag = "v1"
# SQLite-backed DO: runs on the Workers FREE plan (and paid). Uses the same
# storage.get/put/transaction API the code already calls. Do NOT switch this
# to new_classes after first deploy — the storage backend can't be changed.
new_sqlite_classes = ["UsageLimiter"]

# --- Optional: direct bucket binding --------------------------------
# Only needed if you switch index.js to the "proxy upload" fallback
# (streaming bytes through the Worker) instead of presigned URLs.
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "kolkli-files"
