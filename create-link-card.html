<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOLKLI — יצירת קישור לקבלת קבצים</title>
<meta name="description" content="Create-upload-link form mockup: request settings on the right beside a live client-preview panel with a file picker and wizard stepper, KOLKLI style.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef0f6; --panel:#ffffff; --panel-2:#f6f7fb; --line:#e5e8f0; --line-2:#eef0f6; --sep:#e7eaf2;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#7c3aed; --accent-dim:#6a2fe0; --accent-soft:#efe9fe; --accent-line:#d9c9ff;
    --danger:#e5484d;
    --btn:linear-gradient(180deg,#8a63ff 0%,#6a34f2 100%);
    --btn-glow:rgba(108,52,242,.34);
    --toggle-on:linear-gradient(180deg,#9575ff,#7546f3);
    --shadow:0 1px 2px rgba(20,24,44,.05), 0 10px 30px rgba(28,32,60,.07);
    --shadow-sm:0 1px 2px rgba(20,24,44,.05);
    --shadow-lg:0 2px 6px rgba(20,24,44,.05), 0 24px 60px rgba(28,32,60,.12);
    --sans:'Rubik','Space Grotesk',system-ui,'Segoe UI',sans-serif;
    --mono:'Space Grotesk',ui-monospace,'SFMono-Regular',Menlo,monospace;
  }
  html[data-theme="dark"]{
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1c212b; --line:#2a303c; --line-2:#232833; --sep:#2a303c;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --accent:#a06bff; --accent-dim:#b48bff; --accent-soft:#241a3a; --accent-line:#3b2d5c;
    --danger:#ff6b6b;
    --btn:linear-gradient(180deg,#9a6dff 0%,#7546f3 100%);
    --btn-glow:rgba(120,70,240,.45);
    --toggle-on:linear-gradient(180deg,#a689ff,#8258f6);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px rgba(0,0,0,.4);
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,.45), 0 26px 64px rgba(0,0,0,.55);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0d0f14; --panel:#161a22; --panel-2:#1c212b; --line:#2a303c; --line-2:#232833; --sep:#2a303c;
      --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
      --accent:#a06bff; --accent-dim:#b48bff; --accent-soft:#241a3a; --accent-line:#3b2d5c;
      --danger:#ff6b6b;
      --btn:linear-gradient(180deg,#9a6dff 0%,#7546f3 100%);
      --btn-glow:rgba(120,70,240,.45);
      --toggle-on:linear-gradient(180deg,#a689ff,#8258f6);
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px rgba(0,0,0,.4);
      --shadow-sm:0 1px 2px rgba(0,0,0,.35);
      --shadow-lg:0 2px 6px rgba(0,0,0,.45), 0 26px 64px rgba(0,0,0,.55);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;transition:background-color .25s,color .25s;
    display:flex;align-items:flex-start;justify-content:center;padding:40px 20px 64px;}
  svg{display:block;}

  .stage{width:100%;max-width:1160px;}

  .grid{display:grid;grid-template-columns:minmax(0,1fr) 306px;gap:22px;align-items:start;}
  @media (max-width:900px){ .grid{grid-template-columns:1fr;} }

  .card{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);}

  /* ============ FORM ============ */
  .form{padding:30px 32px 32px;}
  @media (max-width:560px){ .form{padding:22px 18px 24px;} }

  .fhd{display:flex;align-items:center;gap:16px;}
  .fhd-txt{flex:1;min-width:0;}
  .fhd-txt h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.02em;color:var(--ink);}
  .fhd-txt p{margin:5px 0 0;font-size:14px;color:var(--muted);}
  .fhd-ico{width:52px;height:52px;flex-shrink:0;border-radius:15px;display:grid;place-items:center;
    background:var(--accent-soft);color:var(--accent);}
  .fhd-ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  .fdiv{height:1px;background:var(--sep);margin:24px -32px 26px;}
  @media (max-width:560px){ .fdiv{margin:22px -18px 22px;} }

  .fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 20px;}
  @media (max-width:760px){ .fgrid{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media (max-width:460px){ .fgrid{grid-template-columns:1fr;} }
  .field{min-width:0;}
  .span-2{grid-column:span 2;}
  .span-4{grid-column:1/-1;}
  @media (max-width:760px){ .span-2{grid-column:1/-1;} }

  .lbl{display:block;font-size:13.5px;font-weight:700;color:var(--ink-2);margin-bottom:9px;}
  .lbl .req{color:var(--danger);margin-inline-start:2px;}
  .lbl .info{display:inline-flex;vertical-align:-2px;margin-inline-start:5px;color:var(--faint);}
  .lbl .info svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .sublbl{font-size:12px;color:var(--faint);margin-top:8px;}

  .inp{width:100%;height:46px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    border-radius:12px;font-family:var(--sans);font-size:14px;padding:0 14px;transition:border-color .12s,box-shadow .12s,background .12s;}
  textarea.inp{height:auto;min-height:90px;padding:12px 14px;resize:vertical;line-height:1.55;}
  .inp::placeholder{color:var(--faint);}
  .inp:focus{outline:none;border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft);}

  /* custom select */
  .sel{position:relative;}
  .sel select{appearance:none;-webkit-appearance:none;cursor:pointer;padding-inline-start:40px;}
  .sel > .chev{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--faint);}
  .sel > .chev svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .sel > .lead{position:absolute;inset-inline-end:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--accent);}
  .sel > .lead svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .sel.has-lead select{padding-inline-end:40px;}

  /* file-type multiselect box */
  .typebox{display:flex;align-items:center;justify-content:center;gap:7px;min-height:46px;background:var(--panel-2);
    border:1px solid var(--line);border-radius:12px;padding:7px 12px;position:relative;flex-wrap:wrap;}
  .tchip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;
    background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 10px;user-select:none;white-space:nowrap;
    transition:background .12s,border-color .12s,color .12s;}
  .tchip svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .tchip:hover{border-color:var(--accent-line);color:var(--ink-2);}
  .tchip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent-dim);}

  /* password checkbox row */
  .pwrow{grid-column:1/-1;display:flex;justify-content:flex-end;}
  .chkline{display:inline-flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer;}
  .chkline input{position:absolute;opacity:0;width:0;height:0;}
  .chkbox{width:19px;height:19px;border-radius:6px;border:1.6px solid var(--line);background:var(--panel-2);
    display:grid;place-items:center;color:#fff;transition:background .14s,border-color .14s;flex-shrink:0;}
  .chkbox svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .12s;}
  .chkline input:checked + .chkbox{background:var(--accent);border-color:var(--accent);}
  .chkline input:checked + .chkbox svg{opacity:1;}
  .chkline .info{display:inline-flex;color:var(--faint);}
  .chkline .info svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  /* notify toggle */
  .notify{grid-column:span 1;display:flex;align-items:center;gap:12px;align-self:center;}
  @media (max-width:760px){ .notify{grid-column:1/-1;} }
  .notify .nt{font-size:13.5px;font-weight:600;color:var(--ink-2);}
  .switch{position:relative;flex-shrink:0;width:44px;height:26px;cursor:pointer;}
  .switch input{position:absolute;opacity:0;width:0;height:0;}
  .track{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .18s;}
  .knob{position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;
    box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .18s;}
  .switch input:checked + .track{background-image:var(--toggle-on);}
  .switch input:checked ~ .knob{transform:translateX(-18px);}
  html[dir="ltr"] .switch input:checked ~ .knob{transform:translateX(18px);}

  .msgfield{grid-column:span 3;}
  @media (max-width:760px){ .msgfield{grid-column:1/-1;} }

  .submit{grid-column:1/-1;width:100%;height:56px;margin-top:6px;display:inline-flex;align-items:center;justify-content:center;gap:10px;
    color:#fff;border:none;cursor:pointer;background:var(--btn);border-radius:14px;font-family:var(--sans);
    font-size:16px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 24px var(--btn-glow);transition:filter .14s,transform .08s;}
  .submit:hover{filter:brightness(1.05);}
  .submit:active{transform:translateY(1px);}
  .submit svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  /* ============ PREVIEW ============ */
  .prev{padding:26px 22px 22px;position:sticky;top:24px;}
  @media (max-width:900px){ .prev{position:static;} }
  .pv-logo{width:120px;height:26px;margin:0 auto 22px;border-radius:8px;
    background:linear-gradient(90deg,var(--line-2),var(--line));opacity:.9;}
  .pv-ava{width:82px;height:82px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;
    background:var(--accent-soft);color:var(--accent);}
  .pv-ava svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .pv-name{text-align:center;font-size:18px;font-weight:800;color:var(--ink);}
  .pv-sub{text-align:center;font-size:13px;color:var(--muted);margin-top:6px;max-width:24ch;margin-inline:auto;}
  .pv-drop{margin-top:20px;border:1.6px dashed var(--accent-line);border-radius:14px;padding:22px 14px;text-align:center;
    background:linear-gradient(180deg,var(--accent-soft),transparent 130%);}
  .pv-pick{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--accent-dim);}
  .pv-pick svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .pv-hint{text-align:center;font-size:12px;color:var(--faint);margin-top:12px;}

  .stepper{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:20px;}
  .step-btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;
    border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);cursor:pointer;font-family:var(--sans);
    font-size:12.5px;font-weight:700;transition:border-color .12s,color .12s;}
  .step-btn:hover{border-color:var(--accent-line);color:var(--accent-dim);}
  .step-btn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .step-count{font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap;}
  .pv-total{text-align:center;font-size:12.5px;color:var(--muted);margin-top:18px;padding-top:16px;border-top:1px solid var(--line-2);}
  .pv-total b{color:var(--accent-dim);font-weight:800;}

  /* theme toggle */
  .themebtn{position:fixed;top:18px;inset-inline-start:18px;width:40px;height:40px;border-radius:12px;
    border:1px solid var(--line);background:var(--panel);color:var(--ink-2);cursor:pointer;display:grid;place-items:center;
    box-shadow:var(--shadow-sm);z-index:20;}
  .themebtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .themebtn .moon{display:none;}
  html[data-theme="dark"] .themebtn .sun{display:none;}
  html[data-theme="dark"] .themebtn .moon{display:block;}
</style>
</head>
<body>

<button class="themebtn" id="themeBtn" type="button" aria-label="החלף ערכת נושא">
  <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
</button>

<div class="stage">
  <div class="grid">

    <!-- ============ FORM (right) ============ -->
    <section class="card form">
      <header class="fhd">
        <div class="fhd-txt">
          <h1>יצירת קישור לקבלת קבצים</h1>
          <p>שלחו קבצים בקלות ותנהלו את ההעלאה</p>
        </div>
        <div class="fhd-ico">
          <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
        </div>
      </header>

      <div class="fdiv"></div>

      <div class="fgrid">

        <!-- row 1 -->
        <div class="field span-2">
          <label class="lbl" for="fName">שם הבקשה <span class="req">*</span></label>
          <input class="inp" id="fName" type="text" placeholder="לדוגמה: תמונות לאירוע">
        </div>
        <div class="field span-2">
          <label class="lbl" for="fDesc">הנחיות ללקוח</label>
          <input class="inp" id="fDesc" type="text" placeholder="מה בדיוק להעלות? כמה קבצים? מידע נוסף ללקוח…">
        </div>

        <!-- row 2 -->
        <div class="field span-2">
          <label class="lbl" for="fFolder">תקיית יעד</label>
          <div class="sel">
            <span class="chev"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span>
            <select class="inp" id="fFolder">
              <option>Inbox</option>
              <option>תמונות לאירוע</option>
              <option>מסמכים</option>
              <option>＋ תיקייה חדשה…</option>
            </select>
          </div>
        </div>
        <div class="field span-2">
          <label class="lbl">סוגי קבצים מותרים</label>
          <div class="typebox" id="typeBox">
            <span class="tchip on" data-type="image"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>תמונות</span>
            <span class="tchip" data-type="video"><svg viewBox="0 0 24 24"><path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>וידאו</span>
            <span class="tchip" data-type="audio"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>אודיו</span>
            <span class="tchip" data-type="doc"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>מסמכים</span>
          </div>
          <div class="sublbl">אפשר לבחור סוג אחד או יותר</div>
        </div>

        <!-- row 3 : limits -->
        <div class="field">
          <label class="lbl" for="fMaxFile">גודל קובץ מקסימלי</label>
          <div class="sel">
            <span class="chev"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span>
            <select class="inp" id="fMaxFile">
              <option>ללא הגבלה</option><option>25 MB</option><option>100 MB</option><option>500 MB</option><option>2 GB</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label class="lbl" for="fMaxCount">מספר קבצים מקסימלי</label>
          <div class="sel">
            <span class="chev"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span>
            <select class="inp" id="fMaxCount">
              <option>ללא הגבלה</option><option selected>5</option><option>10</option><option>25</option><option>50</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label class="lbl" for="fMaxTotal">גודל כולל מקסימלי</label>
          <div class="sel">
            <span class="chev"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span>
            <select class="inp" id="fMaxTotal">
              <option>ללא הגבלה</option><option>100 MB</option><option>500 MB</option><option>2 GB</option><option>5 GB</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label class="lbl" for="fExpiry">תוקף הקישור</label>
          <div class="sel has-lead">
            <span class="chev"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span>
            <span class="lead"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>
            <select class="inp" id="fExpiry">
              <option>שמור לתמיד</option><option>יום אחד</option><option>3 ימים</option><option selected>7 ימים</option><option>30 יום</option>
            </select>
          </div>
        </div>

        <!-- password -->
        <div class="pwrow">
          <label class="chkline">
            <input type="checkbox" id="fPw">
            <span class="chkbox"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>
            <span>להגן בסיסמה</span>
            <span class="info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></span>
          </label>
        </div>

        <!-- notify + message -->
        <div class="notify">
          <label class="switch">
            <input type="checkbox" id="fNotify" checked>
            <span class="track"></span>
            <span class="knob"></span>
          </label>
          <span class="nt">הודיעו לי כשמתקבלים קבצים</span>
        </div>
        <div class="field msgfield">
          <label class="lbl" for="fMsg">הודעה ללקוח <span style="color:var(--faint);font-weight:600;">(לא חובה)</span></label>
          <textarea class="inp" id="fMsg" placeholder="הודעה שתתמצג ללקוח לפני ההעלאה…"></textarea>
        </div>

        <!-- submit -->
        <button class="submit" type="button">
          <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
          צור קישור העלאה
        </button>

      </div>
    </section>

    <!-- ============ PREVIEW (left) ============ -->
    <aside class="card prev">
      <div class="pv-logo"></div>
      <div class="pv-ava">
        <svg viewBox="0 0 24 24"><path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"/><path d="M12 12v9"/><path d="m8 17 4-4 4 4"/></svg>
      </div>
      <div class="pv-name" id="pvName">לדוגמה: תמונות לאירוע</div>
      <div class="pv-sub">גררו קבצים לכאן או בחרו מהמכשיר</div>

      <div class="pv-drop">
        <span class="pv-pick"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>בחר קבצים</span>
      </div>
      <div class="pv-hint">עד 2 GB לקובץ אחד</div>

      <div class="stepper">
        <button class="step-btn" type="button"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>הבא</button>
        <span class="step-count">2 מתוך 5</span>
        <button class="step-btn" type="button">הקודם<svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
      </div>
      <div class="pv-total">סה״כ נבחרו <b>7</b> קבצים</div>
    </aside>

  </div>
</div>

<script>
(function(){
  var root = document.documentElement;
  // theme toggle
  document.getElementById('themeBtn').addEventListener('click', function(){
    var dark = root.getAttribute('data-theme') === 'dark';
    // if unset, fall back to what the OS shows
    if(!root.getAttribute('data-theme')){
      dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    }
    root.setAttribute('data-theme', dark ? 'light' : 'dark');
  });

  // live-mirror the request name into the preview
  var name = document.getElementById('fName');
  var pvName = document.getElementById('pvName');
  name.addEventListener('input', function(){
    pvName.textContent = name.value.trim() || 'לדוגמה: תמונות לאירוע';
  });

  // file-type chips toggle
  document.getElementById('typeBox').addEventListener('click', function(e){
    var chip = e.target.closest('.tchip');
    if(chip) chip.classList.toggle('on');
  });
})();
</script>
</body>
</html>
