<html lang="he" dir="rtl">
<head>

<link rel="canonical" href="https://kolkli.com/aspect-ratio">
<meta name="description" content="Free aspect ratio calculator — enter a width and height to get the simplified ratio, lock a ratio to resize proportionally, or pick presets like 16:9, 4:5, 9:16 and 21:9. Live preview and one-click copy. Fast, simple and professional-quality.">
<style>
  :root {
    --bg:#eef0f6; --panel:#ffffff; --panel-2:#f5f6fa; --line:#e5e8f0; --line-2:#eef0f6;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#7c3aed; --accent-dim:#6a2fe0; --accent-ink:#ffffff; --accent-soft:#efe9fe;
    --success:#22b04b; --success-dim:#1c9a41; --success-soft:#e6f6ec;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --danger:#e5484d; --danger-soft:#fdecec;
    --warm-soft:#fff5da; --warm-line:#f2d98a;
    --ok:#22b04b; --warn:#c88a04; --err:#e5484d;
    --grad:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn-glow:rgba(59,111,246,0.38);
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-lg:0 2px 6px rgba(20,24,44,0.05), 0 20px 50px rgba(20,24,44,0.10);
    --shadow-sm:0 1px 2px rgba(20,24,44,0.05);
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --sans:'Space Grotesk',system-ui,'Segoe UI','Heebo',sans-serif;
  }
  html[data-theme="dark"] {
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a303c; --line-2:#232833;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --accent:#a06bff; --accent-dim:#7c3aed; --accent-ink:#ffffff; --accent-soft:#241a3a;
    --success:#37c26a; --success-dim:#2fae5e; --success-soft:#132a1c;
    --info:#5b95f8; --info-dim:#4f8ef7; --info-soft:#182338;
    --danger:#ff6b6b; --danger-soft:#2a1719;
    --warm-soft:#2c2718; --warm-line:#5a4d24;
    --ok:#4ec98a; --warn:#e8b84b; --err:#ff6b6b;
    --grad:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn-glow:rgba(77,123,255,0.45);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,0.45), 0 24px 60px rgba(0,0,0,0.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;}
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:var(--grad);z-index:100;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--sans);}
  .wrap{width:100%;max-width:none;margin:0 auto;padding:26px 20px 64px;}

  /* page intro */
  .pagehead{margin:4px 0 22px;}
  .pagehead h1{font-size:clamp(23px,3vw,32px);font-weight:700;letter-spacing:-0.02em;margin:0 0 8px;}
  .pagehead .kick{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);
    padding:4px 11px;border-radius:999px;margin-bottom:12px;}
  .pagehead p{font-size:14.5px;color:var(--muted);margin:0;max-width:70ch;}

  /* reused helpers (from box-shadow.html / color-convert.html) */
  .gbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--ink-2);font-size:13px;font-weight:600;padding:10px 12px;border-radius:11px;
    cursor:pointer;transition:all .12s;}
  .gbtn:hover{border-color:var(--accent);color:var(--accent-dim);background:var(--accent-soft);}
  .gbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .gbtn.hidden{display:none;}
  .copybtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);
    color:var(--muted);font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:9px;cursor:pointer;transition:all .12s;}
  .copybtn:hover{border-color:var(--accent);color:var(--accent-dim);background:var(--accent-soft);}
  .copybtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .fstr{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ink);background:var(--panel-2);
    border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;margin-bottom:12px;overflow-x:auto;white-space:nowrap;
    direction:ltr;text-align:start;}
  .numwrap{display:inline-flex;align-items:center;gap:5px;direction:ltr;}
  .numin{width:58px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:9px;
    font-family:var(--mono);font-size:13px;font-weight:600;text-align:center;padding:6px 4px;transition:border-color .12s,box-shadow .12s;}
  .numin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .numin::-webkit-outer-spin-button,.numin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .unit{font-family:var(--mono);font-size:12px;color:var(--faint);}

  /* ---- aspect-ratio tool ---- */
  .tool{display:grid;grid-template-columns:1fr 350px;gap:18px;align-items:start;}
  @media (max-width:820px){ .tool{grid-template-columns:1fr;} }
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);}
  .cardtitle{font-size:13px;font-weight:800;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;margin-bottom:14px;}

  .dimcard{padding:18px;}
  .presetcard{padding:18px;position:sticky;top:16px;}
  .prevcard{padding:18px;margin-top:18px;}
  .tblcard{padding:18px;margin-top:18px;}

  /* big ratio result */
  .ratiobig{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel-2);
    border:1px solid var(--line-2);border-radius:14px;padding:15px 18px;margin-bottom:7px;}
  .ratioval{font-family:var(--mono);font-size:34px;font-weight:800;color:var(--ink);letter-spacing:-0.01em;line-height:1;
    direction:ltr;unicode-bidi:isolate;}
  .ratiodec{font-family:var(--mono);font-size:13px;color:var(--muted);margin-bottom:16px;
    direction:ltr;unicode-bidi:isolate;text-align:start;}

  /* dimension rows */
  .drow{display:flex;align-items:center;gap:11px;margin-bottom:11px;}
  .dlabel{width:72px;flex-shrink:0;font-size:13px;font-weight:600;color:var(--ink-2);}
  .drow .numin{flex:1;width:auto;min-width:0;text-align:start;padding-inline:12px;font-size:15px;}
  .drow .unit{min-width:22px;text-align:start;}

  .lockrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 2px;}
  .lockbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel-2);
    color:var(--muted);font-size:12px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;transition:all .12s;}
  .lockbtn:hover{border-color:var(--accent);color:var(--accent-dim);}
  .lockbtn.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent);color:var(--accent-dim);}
  .lockbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .lockbtn #lockIco{display:inline-flex;}

  .divider{height:1px;background:var(--line);margin:16px 0;border:0;}

  /* custom ratio inputs */
  .customlbl{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:9px;text-align:center;}
  .ratiorow{display:flex;align-items:center;justify-content:center;gap:9px;direction:ltr;}
  .ratiorow .numin{width:78px;font-size:15px;}
  .ratiosep{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--faint);}

  /* presets */
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink-2);background:var(--panel-2);
    border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;transition:all .12s;
    direction:ltr;unicode-bidi:isolate;}
  .chip:hover{border-color:var(--accent);color:var(--accent-dim);background:var(--accent-soft);}
  .chip.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 12px var(--grad-btn-glow);}

  /* preview */
  .prevstage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    min-height:270px;padding:14px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:14px;}
  .prevbox{background:var(--grad);border-radius:8px;box-shadow:var(--shadow);min-width:18px;min-height:18px;
    transition:width .2s ease,height .2s ease;}
  .prevmeta{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--mono);
    direction:ltr;unicode-bidi:isolate;}
  .prevmeta .pm1{font-size:15px;font-weight:700;color:var(--ink);}
  .prevmeta .pm2{font-size:12px;color:var(--muted);}

  /* reference table */
  .tablewrap{overflow-x:auto;}
  .rtable{width:100%;border-collapse:collapse;}
  .rtable th{text-align:start;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.05em;padding:8px 12px;border-bottom:1px solid var(--line);}
  .rtable td{font-size:13px;color:var(--ink-2);padding:9px 12px;border-bottom:1px solid var(--line-2);}
  .rtable tr:last-child td{border-bottom:0;}
  .rtable td.pxcol{font-family:var(--mono);font-weight:700;color:var(--ink);white-space:nowrap;
    direction:ltr;unicode-bidi:isolate;text-align:start;}

  .note{display:flex;align-items:flex-start;gap:9px;margin-top:18px;padding:12px 14px;border-radius:12px;
    background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);
    font-size:12px;color:var(--ink-2);line-height:1.55;}
  .note svg{width:16px;height:16px;color:var(--accent-dim);flex-shrink:0;margin-top:1px;
    stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  footer{margin-top:34px;text-align:center;color:var(--faint);font-size:12px;font-family:var(--mono);}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:11px 18px;border-radius:999px;
    box-shadow:var(--shadow-lg);transition:opacity .2s,transform .2s;z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>

<body>
<div id="site-header"></div>
<script src="./header.js"></script>
<div class="wrap">

  <div class="pagehead">
    <span class="kick" data-i18n="kick"></span>
    <h1 data-i18n="pageTitle"></h1>

  </div>

  <div class="tool">
    <!-- dimensions -->
    <div class="card dimcard">
      <div class="cardtitle" data-i18n="dimTitle"></div>

      <div class="ratiobig">

        <button class="copybtn" data-copy="ratioText" type="button"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span data-i18n="copy"></span></button>
      </div>

      </div>
      <div class="drow">
        <span class="dlabel" data-i18n="heightLabel"></span>
        <input type="number" id="heightIn" class="numin" value="1080" min="1" step="1" aria-label="height">
        <span class="unit">px</span>
      </div>

      <div class="lockrow">
        <button class="lockbtn on" id="lockBtn" type="button"><span id="lockIco"></span><span data-i18n="lockLabel"></span></button>
        <button class="copybtn" data-act="copysize" type="button"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span data-i18n="copySize"></span></button>
      </div>

      <hr class="divider">

      <div class="customlbl" data-i18n="customLabel"></div>
      <div class="ratiorow">
        <input type="number" id="rwIn" class="numin" value="16" min="0" step="any" aria-label="ratio width">
        <span class="ratiosep">:</span>
        <input type="number" id="rhIn" class="numin" value="9" min="0" step="any" aria-label="ratio height">
      </div>
    </div>

    <!-- presets -->
    <div class="card presetcard">
      <div class="cardtitle" data-i18n="presetTitle"></div>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <!-- preview -->
  <div class="card prevcard">
    <div class="cardtitle" data-i18n="previewTitle"></div>
    <div class="prevstage">
      <div class="prevbox" id="previewBox"></div>
      <div class="prevmeta">
        <span class="pm1" id="prevSize">1920 × 1080</span>
        <span class="pm2" id="prevRatio">16 : 9</span>
      </div>
    </div>
  </div>

  <!-- reference table -->
  <div class="card tblcard">
    <div class="cardtitle" data-i18n="tableTitle"></div>
    <div class="tablewrap">
      <table class="rtable">
        <thead><tr><th data-i18n="thRatio"></th><th data-i18n="thUse"></th></tr></thead>
        <tbody>
          <tr><td class="pxcol">16:9</td><td data-i18n="u169"></td></tr>
          <tr><td class="pxcol">1:1</td><td data-i18n="u11"></td></tr>
          <tr><td class="pxcol">4:5</td><td data-i18n="u45"></td></tr>
          <tr><td class="pxcol">9:16</td><td data-i18n="u916"></td></tr>
          <tr><td class="pxcol">1.91:1</td><td data-i18n="u191"></td></tr>
          <tr><td class="pxcol">21:9</td><td data-i18n="u219"></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="note">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <span data-i18n="note"></span>
  </div>

  <footer data-i18n="foot"></footer>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const el = id => document.getElementById(id);

  const I18N = {
    he:{ dir:'rtl',
      kick:'מחשבון יחס תמונה',
      pageTitle:'מחשבון יחס תמונה — חשבו ושמרו על יחס רוחב-גובה',
      pageSub:'הזינו רוחב וגובה וקבלו מיד את היחס המצומצם, או בחרו יחס נפוץ ונעלו אותו כדי שהממד השני יחושב אוטומטית. תצוגה מקדימה חיה, יחסים מותאמים אישית והעתקה בלחיצה. מהיר, פשוט ובאיכות מקצועית.',
      dimTitle:'מידות', presetTitle:'יחסים נפוצים', previewTitle:'תצוגה מקדימה',
      widthLabel:'רוחב', heightLabel:'גובה', lockLabel:'נעילת יחס',
      customLabel:'יחס מותאם אישית', copySize:'העתקת מידות',

      foot:'KOLKLI · מחשבון יחס תמונה · מהיר, פשוט ובאיכות מקצועית' },

  const LOCK_CLOSED = '<svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';

  const PRESETS = [
    [16,9],[9,16],[4,3],[3,4],[1,1],[4,5],[5,4],[3,2],[2,3],[21,9],[1.91,1]
  ];

  let lang='he', t=I18N.he;
  const state = { width:1920, height:1080, aspect:16/9, locked:true, rw:16, rh:9 };

  // ---- math helpers ----
  function gcd(a,b){ a=Math.abs(Math.round(a)); b=Math.abs(Math.round(b)); while(b){ const r=a%b; a=b; b=r; } return a||1; }
  function simplify(w,h){ const g=gcd(w,h); return [Math.round(w/g), Math.round(h/g)]; }
  function trim(n){ if(!isFinite(n)) return '0'; return String(Math.round(n*1e6)/1e6); }
  function fmtDec(n){ if(!isFinite(n)||n<=0) return '1'; let s=n.toFixed(3).replace(/\.?0+$/,''); return s===''?'0':s; }
  function readNum(id,def){ const v=parseFloat(el(id).value); return (isFinite(v)&&v>0)?v:def; }
  function setVal(id,v,except){ if(id===except) return; const e=el(id); if(e && String(e.value)!==String(v)) e.value=v; }

  function displayRatio(){
    const rw=state.rw, rh=state.rh;
    if(Number.isInteger(rw)&&Number.isInteger(rh)&&rw>0&&rh>0) return simplify(rw,rh);
    return [rw,rh];
  }
  function setRatioFromDims(){
    const [a,b]=simplify(Math.round(state.width),Math.round(state.height));
    state.rw=a; state.rh=b; state.aspect=state.width/state.height;
  }

  // ---- render ----
  function render(except){
    const [a,b]=displayRatio();
    el('ratioText').textContent = trim(a)+' : '+trim(b);
    el('ratioDec').textContent = fmtDec(state.aspect)+' : 1';
    setVal('widthIn', Math.round(state.width), except);
    setVal('heightIn', Math.round(state.height), except);
    setVal('rwIn', trim(state.rw), except);
    setVal('rhIn', trim(state.rh), except);
    updateLock();
    updatePreview();
    highlightPresets();
  }
  function updateLock(){
    const b=el('lockBtn');
    b.classList.toggle('on', state.locked);
    el('lockIco').innerHTML = state.locked ? LOCK_CLOSED : LOCK_OPEN;
  }
  function updatePreview(){
    const maxW=340, maxH=230;
    let ar=state.aspect; if(!isFinite(ar)||ar<=0) ar=1;
    let w=maxW, h=maxW/ar;
    if(h>maxH){ h=maxH; w=maxH*ar; }
    const box=el('previewBox');
    box.style.width=Math.max(18,Math.round(w))+'px';
    box.style.height=Math.max(18,Math.round(h))+'px';
    const [a,b]=displayRatio();
    el('prevSize').textContent=Math.round(state.width)+' × '+Math.round(state.height);
    el('prevRatio').textContent=trim(a)+' : '+trim(b);
  }
  function highlightPresets(){
    el('chips').querySelectorAll('.chip').forEach(function(btn){
      const p=PRESETS[+btn.dataset.i];
      btn.classList.toggle('on', Math.abs(p[0]/p[1]-state.aspect)<1e-4);
    });
  }

  // ---- presets ----
  function buildChips(){
    el('chips').innerHTML = PRESETS.map(function(p,i){
      return '<button class="chip" type="button" data-i="'+i+'">'+trim(p[0])+':'+trim(p[1])+'</button>';
    }).join('');
    el('chips').querySelectorAll('.chip').forEach(function(btn){
      btn.addEventListener('click',function(){ const p=PRESETS[+btn.dataset.i]; setRatio(p[0],p[1]); });
    });
  }
  function setRatio(rw,rh){
    state.rw=rw; state.rh=rh; state.aspect=rw/rh;
    state.height=Math.max(1,Math.round(state.width/state.aspect));
    render();
  }

  // ---- toast + copy ----
  function toast(msg){ const e=el('toast'); e.textContent=msg; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),1700); }
  function copy(text){
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).catch(fallbackCopy.bind(null,text)); }
    else fallbackCopy(text);
    toast(t.copiedMsg);
  }
  function fallbackCopy(text){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(_){} document.body.removeChild(ta);
  }

  // ---- events ----
  el('widthIn').addEventListener('input',function(){
    const raw=el('widthIn').value.trim(); if(raw==='') return;
    const w=parseFloat(raw); if(!isFinite(w)||w<=0) return;
    state.width=w;
    if(state.locked) state.height=Math.max(1,Math.round(w/state.aspect));
    else setRatioFromDims();
    render('widthIn');
  });
  el('widthIn').addEventListener('blur',function(){
    if(!(parseFloat(el('widthIn').value)>0)) el('widthIn').value=Math.round(state.width);
    render();
  });
  el('heightIn').addEventListener('input',function(){
    const raw=el('heightIn').value.trim(); if(raw==='') return;
    const h=parseFloat(raw); if(!isFinite(h)||h<=0) return;
    state.height=h;
    if(state.locked) state.width=Math.max(1,Math.round(h*state.aspect));
    else setRatioFromDims();
    render('heightIn');
  });
  el('heightIn').addEventListener('blur',function(){
    if(!(parseFloat(el('heightIn').value)>0)) el('heightIn').value=Math.round(state.height);
    render();
  });

  function applyCustomRatio(except){
    const rw=parseFloat(el('rwIn').value), rh=parseFloat(el('rhIn').value);
    if(!isFinite(rw)||!isFinite(rh)||rw<=0||rh<=0) return;
    state.rw=rw; state.rh=rh; state.aspect=rw/rh;
    state.height=Math.max(1,Math.round(state.width/state.aspect));
    render(except);
  }
  el('rwIn').addEventListener('input',()=>applyCustomRatio('rwIn'));
  el('rhIn').addEventListener('input',()=>applyCustomRatio('rhIn'));
  el('rwIn').addEventListener('blur',()=>render());
  el('rhIn').addEventListener('blur',()=>render());

  el('lockBtn').addEventListener('click',function(){
    state.locked=!state.locked;
    if(state.locked){ state.aspect=state.width/state.height; setRatioFromDims(); }
    render();
  });

  document.querySelectorAll('.copybtn').forEach(function(b){
    b.addEventListener('click',function(){
      if(b.dataset.copy){ const target=el(b.dataset.copy); if(target) copy(target.textContent); }
      else if(b.dataset.act==='copysize'){ copy(Math.round(state.width)+'×'+Math.round(state.height)); }
    });
  });

  // ---- i18n + theme ----
  function applyLang(l){
    if(!I18N[l]) l='en';
    lang=l; t=I18N[l];
    document.documentElement.lang=l; document.documentElement.dir=t.dir;
    document.querySelectorAll('[data-i18n]').forEach(n=>{ const k=n.getAttribute('data-i18n'); if(typeof t[k]==='string') n.textContent=t[k]; });
    try{ localStorage.setItem('ac_lang', l); }catch(_){}
  }
  function ls(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
  function detectLang(){
    const chosen=ls('ac_lang'); if(chosen) return chosen;
    const cc=ls('ac_country'); if(cc) return cc==='IL'?'he':'en';
    let tz=''; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(_){}
    const navHe=(navigator.language||'').toLowerCase().indexOf('he')===0;
    return (tz==='Asia/Jerusalem'||navHe)?'he':'en';
  }
  function applyTheme(th){
    const dark=(th==='dark');
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
    const ti=el('themeIco'); if(ti) ti.textContent = dark?'☀️':'🌙';
    try{ localStorage.setItem('theme', dark?'dark':'light'); }catch(_){}
  }
  window.__setLang=applyLang;
  const tb=el('themeToggle'); if(tb) tb.addEventListener('click',()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));

  // ---- init ----
  buildChips();
  applyTheme(ls('theme')||'light');
  applyLang(detectLang());
  render();
})();
</script>
</body>
</html>
