<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOLKLI — מחולל סיסמאות</title>
<meta name="description" content="Generate strong, cryptographically-random passwords. Choose length and character sets, see live strength, and copy. Fast, simple and professional-quality.">
<link rel="stylesheet" href="./calc.css">
<link rel="stylesheet" href="./header.css">
<style>
  .pw-out{display:flex;align-items:center;gap:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;}
  .pw-out .pw{flex:1;min-width:0;font-family:var(--mono);font-size:clamp(18px,3.4vw,26px);font-weight:700;letter-spacing:.02em;
    color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start;}
  .pw-act{display:flex;gap:8px;flex-shrink:0;}
  .iconbtn{width:42px;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--muted);
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;}
  .iconbtn:hover{border-color:var(--accent);color:var(--accent-dim);background:var(--accent-soft);}
  .iconbtn.done{border-color:var(--success);color:var(--success-dim);background:var(--success-soft);}
  .iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .strength{margin-top:16px;}
  .sbar{height:9px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line-2);overflow:hidden;display:flex;gap:3px;padding:2px;}
  .sbar i{flex:1;border-radius:999px;background:var(--line);transition:background .2s;}
  .slabel{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;font-family:var(--mono);color:var(--muted);}
  .slabel b{color:var(--ink);}
  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .qhead label{font-size:12.5px;font-weight:600;color:var(--ink-2);margin:0;}
  .qval{font-family:var(--mono);font-size:13px;color:var(--accent-dim);font-weight:700;background:var(--accent-soft);padding:2px 11px;border-radius:999px;}
</style>
</head>
<body>
<div id="site-header"></div>
<script src="./header.js"></script>
<div class="wrap">

  <div class="pagehead">
    <span class="kick" data-i18n="kick"></span>
    <h1 data-i18n="title"></h1>
    <p data-i18n="sub"></p>
  </div>

  <div class="card" style="max-width:680px;margin:0 auto">
    <div class="pw-out">
      <span class="pw" id="pw">·········</span>
      <div class="pw-act">
        <button class="iconbtn" id="regen" data-i18n-title="regen"><svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
        <button class="iconbtn" id="copyBtn" data-i18n-title="copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
      </div>
    </div>

    <div class="strength">
      <div class="sbar" id="sbar"><i></i><i></i><i></i><i></i></div>
      <div class="slabel"><span data-i18n="strengthLbl"></span><b id="sword">—</b></div>
    </div>

    <div class="divider"></div>

    <div class="field">
      <div class="qhead"><label data-i18n="lenLbl"></label><span class="qval" id="lenVal">16</span></div>
      <input type="range" class="range" id="len" min="4" max="64" value="16">
    </div>

    <div class="pair">
      <label class="check"><input type="checkbox" id="cUpper" checked><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span><span data-i18n="cUpper"></span></label>
      <label class="check"><input type="checkbox" id="cLower" checked><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span><span data-i18n="cLower"></span></label>
      <label class="check"><input type="checkbox" id="cDigit" checked><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span><span data-i18n="cDigit"></span></label>
      <label class="check"><input type="checkbox" id="cSymbol" checked><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span><span data-i18n="cSymbol"></span></label>
    </div>
    <label class="check"><input type="checkbox" id="cNoAmb"><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span><span data-i18n="cNoAmb"></span></label>

    <button class="btn block" id="genBtn" style="margin-top:14px"><svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg><span data-i18n="genBtn"></span></button>
    <div class="err" id="err"></div>

    <div class="note">
      <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span data-i18n="note"></span>
    </div>
  </div>

  <footer class="pgfoot" data-i18n="foot"></footer>
</div>
<div class="toast" id="toast"></div>

<script src="./calc.js"></script>
<script>
(function(){
  const el = id => document.getElementById(id);
  const I18N = {
    he:{ dir:'rtl',
      kick:'חישובים והמרות · סיסמאות',
      title:'מחולל סיסמאות',
      sub:'צרו סיסמאות חזקות ואקראיות — בחרו אורך וסוגי תווים, וקבלו חיווי חוזק חי. מהיר, פשוט ובאיכות מקצועית.',
      regen:'צרו מחדש', copy:'העתקה',
      strengthLbl:'חוזק הסיסמה', lenLbl:'אורך הסיסמה',
      cUpper:'אותיות גדולות A-Z', cLower:'אותיות קטנות a-z', cDigit:'ספרות 0-9', cSymbol:'סימנים !@#$', cNoAmb:'ללא תווים מבלבלים (O/0, l/1)',
      genBtn:'צרו סיסמה חדשה',
      note:'הסיסמאות נוצרות מקומית עם crypto.getRandomValues של הדפדפן. מהיר, פשוט ובאיכות מקצועית.',
      errNone:'צריך לבחור לפחות סוג תווים אחד',
      s0:'חלשה', s1:'סבירה', s2:'טובה', s3:'חזקה', s4:'חזקה מאוד',
      foot:'KOLKLI · מחולל סיסמאות · מהיר, פשוט ובאיכות מקצועית',
      copied:'הסיסמה הועתקה ✓' },
    en:{ dir:'ltr',
      kick:'Calc & Convert · Passwords',
      title:'Password Generator',
      sub:'Create strong, random passwords — choose length and character sets and see live strength. Fast, simple and professional-quality.',
      regen:'Regenerate', copy:'Copy',
      strengthLbl:'Password strength', lenLbl:'Password length',
      cUpper:'Uppercase A-Z', cLower:'Lowercase a-z', cDigit:'Digits 0-9', cSymbol:'Symbols !@#$', cNoAmb:'No look-alike chars (O/0, l/1)',
      genBtn:'Generate new password',
      note:'Fast, simple and professional-quality.',
      errNone:'Pick at least one character set',
      s0:'Weak', s1:'Fair', s2:'Good', s3:'Strong', s4:'Very strong',
      foot:'KOLKLI · Password Generator · Fast, simple and professional quality',
      copied:'Password copied ✓' },
    ru:{ dir:'ltr',
      kick:'Расчёты · Пароли',
      title:'Генератор паролей',
      sub:'Создавайте надёжные случайные пароли — выберите длину и наборы символов и следите за индикатором надёжности. Быстро, просто и профессионального качества.',
      regen:'Создать заново', copy:'Копировать',
      strengthLbl:'Надёжность пароля', lenLbl:'Длина пароля',
      cUpper:'Заглавные A-Z', cLower:'Строчные a-z', cDigit:'Цифры 0-9', cSymbol:'Символы !@#$', cNoAmb:'Без похожих (O/0, l/1)',
      genBtn:'Создать новый пароль',
      note:'Быстро, просто и профессионального качества.',
      errNone:'Выберите хотя бы один набор символов',
      s0:'Слабый', s1:'Средний', s2:'Хороший', s3:'Надёжный', s4:'Очень надёжный',
      foot:'KOLKLI · Генератор паролей · Быстро, просто и профессионального качества',
      copied:'Пароль скопирован ✓' }
  };

  const SETS = {
    cUpper:'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    cLower:'abcdefghijklmnopqrstuvwxyz',
    cDigit:'0123456789',
    cSymbol:'!@#$%^&*-_=+?'
  };
  const AMBIG = /[O0oIl1|]/g;

  function randInt(max){ // unbiased random index in [0,max)
    const limit = 4294967296 - (4294967296 % max);
    const buf = new Uint32Array(1);
    let x;
    do { crypto.getRandomValues(buf); x = buf[0]; } while (x >= limit);
    return x % max;
  }
  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){ const j = randInt(i+1); const tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp; }
    return arr;
  }

  function activeSets(){
    const noAmb = el('cNoAmb').checked;
    return Object.keys(SETS).filter(k=>el(k).checked).map(k=>{
      let s = SETS[k];
      if(noAmb) s = s.replace(AMBIG,'');
      return s;
    }).filter(s=>s.length);
  }

  function generate(){
    el('err').textContent = '';
    const sets = activeSets();
    if(!sets.length){ el('err').textContent = APP.t().errNone; el('pw').textContent = '·········'; strength(''); return; }
    const len = +el('len').value;
    const pool = sets.join('');
    const chars = [];
    // guarantee at least one from each selected set
    sets.forEach(s=>{ if(chars.length < len) chars.push(s[randInt(s.length)]); });
    while(chars.length < len) chars.push(pool[randInt(pool.length)]);
    const pw = shuffle(chars).slice(0,len).join('');
    el('pw').textContent = pw;
    strength(pw, pool.length);
  }

  function strength(pw, poolSize){
    const bars = el('sbar').children;
    if(!pw){ for(const b of bars) b.style.background = 'var(--line)'; el('sword').textContent = '—'; return; }
    const bits = pw.length * Math.log2(poolSize || 2);
    let lvl; // 0..3 -> 4 buckets
    if(bits < 40) lvl = 0; else if(bits < 60) lvl = 1; else if(bits < 90) lvl = 2; else lvl = 3;
    const colors = ['var(--danger)','var(--warn)','var(--info)','var(--success)'];
    for(let i=0;i<bars.length;i++) bars[i].style.background = i <= lvl ? colors[lvl] : 'var(--line)';
    const t = APP.t();
    el('sword').textContent = [t.s0,t.s1,t.s3,t.s4][lvl] || t.s2;
  }

  function copyPw(){
    const v = el('pw').textContent;
    if(!v || v==='·········') return;
    KolkliTool.copy(v, el('copyBtn'));
    KolkliTool.toast(APP.t().copied);
  }

  el('len').addEventListener('input', ()=>{ el('lenVal').textContent = el('len').value; generate(); });
  el('genBtn').addEventListener('click', generate);
  el('regen').addEventListener('click', generate);
  el('copyBtn').addEventListener('click', copyPw);
  Object.keys(SETS).forEach(id=>el(id).addEventListener('change', generate));
  el('cNoAmb').addEventListener('change', generate);

  const APP = KolkliTool.init(I18N, function(){
    // re-evaluate the strength word in the new language
    const v = el('pw').textContent;
    if(v && v!=='·········'){ const sets = activeSets(); strength(v, sets.join('').length); }
  });
  el('lenVal').textContent = el('len').value;
  generate();
})();
</script>
</body>
</html>
