<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOLKLI — יצירת רינגטון</title>
<link rel="canonical" href="https://kolkli.com/ringtone">
<meta name="description" content="Make a ringtone from any song — pick the segment on a waveform, add a fade, and export to M4R for iPhone or MP3 for Android. In the browser, private and free.">
<style>
  :root {
    --bg:#eef0f6; --panel:#ffffff; --panel-2:#f5f6fa; --line:#e5e8f0; --line-2:#eef0f6;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#7c3aed; --accent-dim:#6a2fe0; --accent-ink:#ffffff; --accent-soft:#efe9fe;
    --success:#22b04b; --success-dim:#1c9a41; --success-soft:#e6f6ec;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --danger:#e5484d; --danger-soft:#fdecec;
    --warm-soft:#fff5da; --warm-line:#f2d98a;
    --grad:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-soft:linear-gradient(120deg,#efe9fe,#e6f0ff);
    --grad-btn:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn-glow:rgba(59,111,246,0.38);
    --wave:#b9c0d4; --wave-sel:#7c3aed;
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-lg:0 2px 6px rgba(20,24,44,0.05), 0 20px 50px rgba(20,24,44,0.10);
    --shadow-sm:0 1px 2px rgba(20,24,44,0.05);
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --sans:'Space Grotesk',system-ui,'Segoe UI','Heebo',sans-serif;
  }
  html[data-theme="dark"] {
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a303c; --line-2:#232833;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --accent:#a06bff; --accent-dim:#7c3aed; --accent-ink:#ffffff; --accent-soft:#241a3a;
    --success:#37c26a; --success-dim:#2fae5e; --success-soft:#132a1c;
    --info:#5b95f8; --info-dim:#4f8ef7; --info-soft:#182338;
    --danger:#ff6b6b; --danger-soft:#2a1719;
    --warm-soft:#2c2718; --warm-line:#5a4d24;
    --grad:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-soft:linear-gradient(120deg,#1c1633,#11242a);
    --grad-btn:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn-glow:rgba(77,123,255,0.45);
    --wave:#3a4152; --wave-sel:#a06bff;
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,0.45), 0 24px 60px rgba(0,0,0,0.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;}
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:var(--grad);z-index:100;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--sans);}
  .wrap{width:100%;max-width:900px;margin:0 auto;padding:22px 20px 60px;}

  .pagehead{margin:4px 0 20px;}
  .pagehead h2{font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:-0.02em;margin:0 0 6px;}
  .pagehead .kick{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);
    padding:4px 11px;border-radius:999px;margin-bottom:11px;}
  .pagehead p{font-size:14.5px;color:var(--muted);margin:0;max-width:66ch;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);}

  .drop{border:2.5px dashed color-mix(in srgb,var(--accent) 55%,var(--line));border-radius:16px;padding:52px 28px;text-align:center;cursor:pointer;
    background:var(--panel-2);transition:border-color .15s,background .15s;}
  .drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);}
  .drop .cloud{width:72px;height:72px;margin:0 auto 15px;border-radius:18px;display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);color:var(--accent);}
  .drop .cloud svg{width:36px;height:36px;}
  .drop .big{font-size:20px;font-weight:600;color:var(--ink);}
  .drop .or{font-size:14px;color:var(--faint);margin:8px 0;font-family:var(--mono);}
  .drop .choose{display:inline-flex;align-items:center;gap:8px;color:#fff;border:none;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:600;font-size:15px;padding:12px 26px;border-radius:999px;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.14),0 6px 16px var(--grad-btn-glow);transition:filter .14s,transform .08s;}
  .drop .choose:hover{filter:brightness(1.05);} .drop .choose:active{transform:translateY(1px);}
  .drop .sizenote{margin-top:15px;font-size:13px;color:var(--faint);font-family:var(--mono);}
  input[type=file]{display:none;}

  .stack{display:none;}
  .stack.show{display:block;}
  .sect{margin-top:16px;padding:18px;}
  .sect h3{font-size:15px;margin:0 0 4px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .sect h3 svg{width:17px;height:17px;color:var(--accent);}
  .sect .hint{font-size:12.5px;color:var(--muted);margin:0 0 14px;}

  /* file bar */
  .fbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .fbar .fico{width:42px;height:42px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:var(--grad-soft);color:var(--accent);}
  .fbar .fico svg{width:20px;height:20px;}
  .fbar .fn{flex:1;min-width:0;}
  .fbar .fn .nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fbar .fn .meta{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:2px;}
  .fbar .chg{flex-shrink:0;font-size:11.5px;color:var(--faint);background:none;border:1px solid var(--line);border-radius:999px;
    padding:6px 12px;cursor:pointer;font-family:var(--mono);transition:border-color .12s,color .12s;}
  .fbar .chg:hover{border-color:var(--accent);color:var(--accent);}

  /* waveform */
  .wavewrap{direction:ltr;position:relative;height:150px;border-radius:12px;overflow:hidden;background:var(--panel-2);
    border:1px solid var(--line);touch-action:none;user-select:none;cursor:pointer;}
  .wavewrap canvas{display:block;width:100%;height:100%;}
  .wavewrap .loadingw{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:12px;color:var(--faint);}
  .timeaxis{direction:ltr;display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:6px;padding:0 2px;}

  .playrow{display:flex;align-items:center;gap:12px;margin-top:14px;}
  .playbtn{width:46px;height:46px;flex-shrink:0;border-radius:50%;border:none;cursor:pointer;color:#fff;
    background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--grad-btn);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 16px var(--grad-btn-glow);display:flex;align-items:center;justify-content:center;
    transition:filter .14s,transform .08s;}
  .playbtn:hover{filter:brightness(1.05);} .playbtn:active{transform:translateY(1px);}
  .playbtn svg{width:20px;height:20px;}
  .selinfo{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--mono);font-size:12px;color:var(--muted);}
  .selinfo b{color:var(--ink);font-weight:700;}
  .selinfo .len b{color:var(--accent-dim);}

  /* precise inputs */
  .prec{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
  @media (max-width:560px){ .prec{grid-template-columns:1fr;} }
  .numfld{display:flex;flex-direction:column;gap:6px;}
  .numfld label{font-size:11.5px;color:var(--muted);font-family:var(--mono);}
  .numin{display:flex;align-items:center;gap:6px;}
  .numin input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;
    font-family:var(--mono);font-size:14px;font-weight:600;padding:9px 11px;width:100%;}
  .numin input:focus{outline:none;border-color:var(--accent);}
  .numin .u{font-family:var(--mono);font-size:11px;color:var(--faint);}

  .fld{margin-top:16px;}
  .fld > label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:8px;}
  .seg{display:flex;gap:9px;flex-wrap:wrap;}
  .seg button{flex:1;min-width:100px;text-align:start;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel-2);cursor:pointer;transition:border-color .12s,background .12s,transform .08s;}
  .seg button:hover{border-color:var(--accent);} .seg button:active{transform:scale(.99);}
  .seg button.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--shadow-sm);}
  .seg button b{display:block;font-size:13.5px;color:var(--ink);}
  .seg button small{font-size:10.5px;color:var(--faint);font-family:var(--mono);}
  .seg button.on b{color:var(--accent-dim);}
  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;
    font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink-2);transition:border-color .12s,background .12s;}
  .chip:hover{border-color:var(--accent);} .chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-dim);}

  .toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;
    padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);}
  .toggle .tg-txt b{font-size:13px;display:block;} .toggle .tg-txt small{font-size:10.5px;color:var(--faint);font-family:var(--mono);}
  .sw{position:relative;width:42px;height:24px;flex-shrink:0;direction:ltr;}
  .sw input{opacity:0;width:0;height:0;position:absolute;}
  .sw .track{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .15s;cursor:pointer;}
  .sw .track::before{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;
    transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .sw input:checked + .track{background:var(--accent);}
  .sw input:checked + .track::before{transform:translateX(18px);}

  .qrow2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:8px;}
  .sel{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;
    font-family:var(--mono);font-size:13px;padding:10px 11px;cursor:pointer;}
  .sel:focus{outline:none;border-color:var(--accent);}
  .sel:disabled{opacity:.5;cursor:not-allowed;}

  .gobtn{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:9px;color:#fff;border:none;cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:600;font-size:15px;padding:15px 20px;border-radius:999px;text-shadow:0 1px 2px rgba(0,0,0,.18);margin-top:18px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.14),0 8px 20px var(--grad-btn-glow);
    transition:filter .14s,transform .08s;}
  .gobtn:hover{filter:brightness(1.05);} .gobtn:active{transform:translateY(1px);}
  .gobtn:disabled{opacity:.5;cursor:not-allowed;filter:none;transform:none;}
  .gobtn svg{width:18px;height:18px;}
  .opterr{font-size:12px;color:var(--danger);margin-top:10px;min-height:15px;text-align:center;}
  .rtnote{font-size:10.5px;color:var(--faint);font-family:var(--mono);text-align:center;margin-top:8px;line-height:1.5;}

  .prog{padding:16px;display:none;margin-top:18px;}
  .prog.show{display:block;}
  .prog .lbl{font-size:13px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;}
  .bar{height:10px;border-radius:999px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line-2);}
  .bar i{display:block;height:100%;width:0;background:var(--grad);border-radius:999px;transition:width .2s ease;}
  .bar.indet i{width:35%;animation:slide 1.1s ease-in-out infinite;}
  @keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
  .prog .phase{margin-top:8px;font-family:var(--mono);font-size:10.5px;color:var(--faint);text-align:center;}

  .results{padding:22px;display:none;margin-top:18px;}
  .results.show{display:block;}
  .results .ok{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    background:var(--success-soft);color:var(--success-dim);}
  .results .ok svg{width:28px;height:28px;}
  .results h3{text-align:center;font-size:19px;margin:0 0 4px;}
  .results .subt{text-align:center;font-size:13px;color:var(--muted);margin:0 0 18px;}
  .rrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line-2);border-radius:12px;background:var(--panel-2);margin-bottom:16px;}
  .rrow .rico{width:46px;height:46px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--success-soft);color:var(--success-dim);}
  .rrow .rico svg{width:20px;height:20px;}
  .rrow .rn{flex:1;min-width:0;}
  .rrow .rn .nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rrow .rn .meta{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:2px;}
  .row2{display:flex;gap:10px;flex-wrap:wrap;}
  .row2 button{flex:1;min-width:150px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 16px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid var(--line);
    background:var(--panel);color:var(--ink-2);transition:border-color .12s,transform .08s;box-shadow:var(--shadow-sm);}
  .row2 button:hover{border-color:var(--accent);} .row2 button:active{transform:translateY(1px);}
  .row2 .primary{color:#fff;border:none;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--grad-btn);
    text-shadow:0 1px 2px rgba(0,0,0,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 16px var(--grad-btn-glow);}
  .row2 svg{width:15px;height:15px;}
  .seam{display:flex;align-items:flex-start;gap:8px;margin-top:16px;padding:11px 13px;border-radius:11px;
    background:var(--warm-soft);border:1px solid var(--warm-line);font-size:11.5px;color:var(--ink-2);line-height:1.55;}
  .seam svg{width:15px;height:15px;color:var(--warn,#c88a04);flex-shrink:0;margin-top:1px;}

  footer{margin-top:34px;text-align:center;color:var(--faint);font-size:12px;font-family:var(--mono);}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:11px 18px;border-radius:999px;
    box-shadow:var(--shadow-lg);transition:opacity .2s,transform .2s;z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
<link rel="icon" type="image/png" href="./assets/logo.png">
<link rel="stylesheet" href="./header.css">
</head>
<body>
<div id="site-header"></div>
<script src="./header.js"></script>
<div class="wrap">

  <div class="pagehead">
    <span class="kick" data-i18n="kick"></span>
    <h2 data-i18n="pageTitle"></h2>
    <p data-i18n="pageSub"></p>
  </div>

  <!-- upload -->
  <div class="drop" id="drop">
    <div class="cloud"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
    <div class="big" data-i18n="dropBig"></div>
    <div class="or" data-i18n="or2"></div>
    <button class="choose" type="button" id="chooseBtn" data-i18n="choose"></button>
    <div class="sizenote" data-i18n="sizeNote"></div>
  </div>
  <input type="file" id="fileInput" accept="audio/*,.mp3,.wav,.flac,.aac,.m4a,.ogg,.oga,.opus,.wma,.aiff,.aif">

  <!-- editor -->
  <div class="stack" id="stack">
    <div class="card sect">
      <div class="fbar">
        <div class="fico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
        <div class="fn"><div class="nm" id="fName"></div><div class="meta" id="fMeta"></div></div>
        <button class="chg" id="chgBtn" type="button" data-i18n="change"></button>
      </div>

      <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h2l3-9 4 18 3-13 2 8h6"/></svg><span data-i18n="pickTitle"></span></h3>
      <p class="hint" data-i18n="pickHint"></p>

      <div class="wavewrap" id="waveWrap">
        <canvas id="wave"></canvas>
        <div class="loadingw" id="waveLoad" data-i18n="waveLoading"></div>
      </div>
      <div class="timeaxis"><span id="axStart">0:00</span><span id="axEnd">0:00</span></div>

      <div class="playrow">
        <button class="playbtn" id="playBtn" type="button" aria-label="play">
          <svg id="playIco" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="selinfo">
          <span class="st"><span data-i18n="lblStart"></span> <b id="infStart">0:00</b></span>
          <span class="en"><span data-i18n="lblEnd"></span> <b id="infEnd">0:00</b></span>
          <span class="len"><span data-i18n="lblLen"></span> <b id="infLen">0.0s</b></span>
        </div>
      </div>

      <div class="prec">
        <div class="numfld">
          <label data-i18n="startAt"></label>
          <div class="numin"><input type="number" id="startNum" min="0" step="0.1" value="0"><span class="u">s</span></div>
        </div>
        <div class="numfld">
          <label data-i18n="lengthLbl"></label>
          <div class="numin"><input type="number" id="lenNum" min="1" max="40" step="0.5" value="30"><span class="u">s</span></div>
        </div>
      </div>

      <div class="fld">
        <label data-i18n="quickLen"></label>
        <div class="chips" id="lenChips">
          <button class="chip" type="button" data-len="15">15s</button>
          <button class="chip on" type="button" data-len="30">30s</button>
          <button class="chip" type="button" data-len="40">40s</button>
        </div>
      </div>
    </div>

    <!-- settings -->
    <div class="card sect">
      <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span data-i18n="setTitle"></span></h3>

      <div class="fld">

      goBtn:'Create ringtone', goBtnBusy:'Processing…',
      working:'Processing…', engineLoading:'Loading audio engine…', phaseCut:'Cutting & exporting…',
      readyTitle:'Ringtone ready!', readySub:'Have a listen, then download the file.',

      metaOut:(len,fmt)=>`${len} · ${fmt}`,

    ru:{

      kick:'Создание рингтона',

      pageSub:'Загрузите песню, выделите нужный фрагмент на волновой форме, добавьте плавное появление и затухание — и экспортируйте в M4R для iPhone или MP3 для Android. Всё работает в браузере, ничего не загружается на сервер.',
      dropBig:'Перетащите песню сюда', or2:'или', choose:'Выбрать файл',

      sizeFree:(cap,per)=>`MP3 · WAV · FLAC · AAC · M4A · OGG · до ${cap} на файл · ${per} рингтонов/день`,

      errTooBig:(cap)=>`Файл слишком большой — до ${cap} на файл на вашем плане`,
      errDaily:(n)=>`Достигнут лимит ${n} рингтонов/день на бесплатном плане. Оформите подписку, чтобы продолжить.`,
      change:'Заменить файл',
      pickTitle:'Выберите фрагмент', pickHint:'Тяните за края, чтобы задать начало и конец, или перетащите всю область целиком. Максимальная длина рингтона: 40 секунд.',
      waveLoading:'Загрузка волны…',
      lblStart:'Начало', lblEnd:'Конец', lblLen:'Длина',
      startAt:'Начало (сек)', lengthLbl:'Длина (сек)',
      quickLen:'Быстрая длина',
      setTitle:'Настройки экспорта',
      fmtLbl:'Формат рингтона',
      fadeLbl:'Плавное появление / затухание', fadeSub:'ввод в начале и вывод в конце фрагмента',
      goBtn:'Создать рингтон', goBtnBusy:'Обработка…',
      working:'Обработка…', engineLoading:'Загрузка аудиодвижка…', phaseCut:'Обрезка и экспорт…',
      readyTitle:'Рингтон готов!', readySub:'Послушайте и скачайте файл.',
      dlBtn:'Скачать рингтон', newBtn:'Новый рингтон',
      metaOut:(len,fmt)=>`${len} · ${fmt}`,
      seam:'Совет для iPhone: после скачивания откройте файл в GarageBand или iTunes/Finder, чтобы установить его как рингтон.',
      foot:'KOLKLI · Создание рингтона · Быстро, просто и профессионального качества',
      rtNote:'Обработка выполняется локально во встроенном движке ffmpeg.',
      errNoFile:'Сначала загрузите песню',
      errEngine:'ОШИБКА: не удалось загрузить аудиодвижок. Убедитесь, что папка vendor/ существует.',
      errFileProto:'Открыто как локальный файл — браузер блокирует движок. Запустите через start.bat или локальный сервер.',
      errFail:'Обработка не удалась — попробуйте другой фрагмент или формат.',
      dlName:'ringtone',
    },
  };

  const AUDIO_EXTS = ['mp3','wav','flac','aac','m4a','ogg','oga','opus','wma','aiff','aif','m4b'];
  const MAX_LEN = 40, MIN_LEN = 1;
  const OUT = {
    m4r:{ enc:['-c:a','aac'], fmt:['-f','ipod'], ext:'m4a', dl:'m4r', mime:'audio/mp4', label:'M4R' },
    mp3:{ enc:['-c:a','libmp3lame'], fmt:[], ext:'mp3', dl:'mp3', mime:'audio/mpeg', label:'MP3' },
    m4a:{ enc:['-c:a','aac'], fmt:[], ext:'m4a', dl:'m4a', mime:'audio/mp4', label:'M4A' },
  };

  const FFmpeg    = (window.FFmpegWASM && window.FFmpegWASM.FFmpeg);
  const fetchFile = (window.FFmpegUtil  && window.FFmpegUtil.fetchFile);
  const engineAvailable = !!(FFmpeg && fetchFile);

  let lang='he', t=I18N.he;
  let item=null;       // {file,name,size,url,dur}
  let peaks=null;      // Float32Array of max-abs buckets
  let regStart=0, regLen=30, dur=0;
  let fmt='m4r', busy=false, uid=1;
  let ffmpeg=null, ffLoading=null;
  let result=null;     // {blob,url,name}
  const audio=new Audio(); audio.preload='auto';
  let playing=false, raf=0;

  // ---- helpers ----
  function baseName(name){ return String(name||'audio').replace(/\.[^.\/\\]+$/,''); }
  function extOf(name){ const m=/\.([^.\/\\]+)$/.exec(name||''); const e=m?m[1].toLowerCase():''; return AUDIO_EXTS.includes(e)?e:'mp3'; }
  function fmtBytes(n){ if(n==null) return '—'; if(n>=1048576) return (n/1048576).toFixed(1)+' MB'; if(n>=1024) return (n/1024).toFixed(0)+' KB'; return n+' B'; }
  function mmss(s){ if(s==null||!isFinite(s)) return '0:00'; s=Math.max(0,s); const m=Math.floor(s/60); return m+':'+String(Math.floor(s%60)).padStart(2,'0'); }
  function toast(msg){ const e=el('toast'); e.textContent=msg; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),1900); }
  const sleep = ms => new Promise(r=>setTimeout(r,ms));
  function ls(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
  function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

  // ---- plan-aware limits ----
  const MB = 1048576;
  const FREE_DAILY = 3;
  function planPaid(){
    try{ if(window.KolkliUsage && window.KolkliUsage.isExempt) return !!window.KolkliUsage.isExempt(); }catch(_){}
    let plan='';
    try{
      const email=(ls('ac_session')||'').toLowerCase();
      if(email){ const users=JSON.parse(ls('ac_users')||'[]')||[]; const u=users.find(x=>(x.email||'').toLowerCase()===email); if(u&&u.plan) plan=u.plan; }
    }catch(_){}
    if(!plan) plan=ls('ac_plan')||'';
    plan=(plan||'free').toLowerCase();
    return plan==='lite'||plan==='creator'||plan==='pro'||plan==='business'||plan==='studio';
  }
  function fileCap(){
    try{ if(window.KolkliUsage && window.KolkliUsage.fileByteCap) return window.KolkliUsage.fileByteCap(); }catch(_){}
    return planPaid() ? 500*MB : 50*MB;
  }
  function capTxt(){ const c=fileCap(); return c>=1073741824 ? Math.round(c/1073741824)+'GB' : Math.round(c/MB)+'MB'; }
  function dayStamp(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
  function ledgerKey(){ return 'kolkli_ringtone_'+dayStamp(); }
  function usedToday(){ if(planPaid()) return 0; const n=parseInt(ls(ledgerKey())||'0',10); return isFinite(n)&&n>0?n:0; }
  function addToday(){ if(planPaid()) return; try{ localStorage.setItem(ledgerKey(), String(usedToday()+1)); }catch(_){} }
  function remaining(){ return planPaid() ? Infinity : Math.max(0, FREE_DAILY - usedToday()); }
  function showUpgrade(){ try{ if(window.KolkliUsage && window.KolkliUsage.showBlocked) window.KolkliUsage.showBlocked({code:'daily_files'}); }catch(_){}}
  function updateLimitsUI(){
    const note=document.querySelector('.sizenote');
    if(note && t.sizeFree) note.textContent = planPaid() ? t.sizePaid(capTxt()) : t.sizeFree(capTxt(), FREE_DAILY);
  }

  // ---- engine ----
  function loadFF(){
    if(ffmpeg) return Promise.resolve(ffmpeg);
    if(!ffLoading){
      ffLoading = (async()=>{
        if(!engineAvailable) throw new Error('engine');
        const f=new FFmpeg();
        const dir=location.href.replace(/[^/]*$/,'')+'vendor/';
        await f.load({ coreURL:dir+'ffmpeg-core.js', wasmURL:dir+'ffmpeg-core.wasm' });
        ffmpeg=f; return f;
      })().catch(e=>{ ffLoading=null; throw e; });
    }
    return ffLoading;
  }
  function disposeFF(){ try{ ffmpeg && ffmpeg.terminate && ffmpeg.terminate(); }catch(_){} ffmpeg=null; ffLoading=null; }

  // ---- intake + decode ----
  function pickFile(list){
    const arr=Array.from(list||[]).filter(file=>{
      const okType = file.type && file.type.indexOf('audio')===0;
      const okExt  = new RegExp('\\.('+AUDIO_EXTS.join('|')+')$','i').test(file.name);
      return okType || okExt;
    });
    if(!arr.length) return;
    const file=arr[0];
    if(file.size > fileCap()){ const m=t.errTooBig(capTxt()); el('optErr').textContent=m; toast(m); return; }
    loadItem(file);
  }
  function loadItem(file){
    clearItem();
    item={ file, name:file.name, size:file.size, url:URL.createObjectURL(file), dur:0 };
    audio.src=item.url;
    el('fName').textContent=item.name;
    el('fMeta').textContent=[extOf(item.name).toUpperCase(), fmtBytes(item.size)].join(' · ');
    el('drop').style.display='none';
    el('stack').classList.add('show');
    el('resultsCard').classList.remove('show');
    el('optErr').textContent='';
    el('waveLoad').style.display='';
    peaks=null;
    decodeWave(file);
    window.scrollTo({top:0,behavior:'smooth'});
  }
  async function decodeWave(file){
    // duration first, from a quick metadata probe (works even if decode is slow / unsupported)
    try{
      const a=new Audio(); a.preload='metadata';
      a.onloadedmetadata=()=>{ if(isFinite(a.duration)&&a.duration>0){ setDur(a.duration); } a.src=''; };
      a.src=item.url;
    }catch(_){}
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) throw new Error('no-audiocontext');
      const ctx=new AC();
      const buf=await file.arrayBuffer();
      const audioBuf=await new Promise((res,rej)=>{ const p=ctx.decodeAudioData(buf.slice(0),res,rej); if(p&&p.then) p.then(res,rej); });
      setDur(audioBuf.duration);
      peaks=computePeaks(audioBuf, 2000);
      try{ ctx.close(); }catch(_){}
    }catch(_){
      peaks=null; // fall back to a flat bar; numeric selection still works
    }
    el('waveLoad').style.display='none';
    drawWave();
  }
  function setDur(d){
    if(!(d>0)) return;
    dur=d; if(item) item.dur=d;
    // default region: first 30s (or whole track if shorter)
    regLen=clamp(Math.min(30,dur), MIN_LEN, Math.min(MAX_LEN,dur));
    regStart=clamp(regStart,0,Math.max(0,dur-regLen));
    el('startNum').max=Math.max(0,dur);
    el('lenNum').max=Math.min(MAX_LEN,dur);
    el('axStart').textContent='0:00';
    el('axEnd').textContent=mmss(dur);
    updateInfo(); drawWave();
  }
  function computePeaks(audioBuf, n){
    const ch=audioBuf.numberOfChannels;
    const len=audioBuf.length;
    const out=new Float32Array(n);
    const step=len/n;
    const data=[]; for(let c=0;c<ch;c++) data.push(audioBuf.getChannelData(c));
    for(let i=0;i<n;i++){
      const s=Math.floor(i*step), e=Math.min(len,Math.floor((i+1)*step));
      let mx=0;
      for(let j=s;j<e;j+=Math.max(1,Math.floor((e-s)/400))){
        let v=0; for(let c=0;c<ch;c++){ const a=Math.abs(data[c][j]); if(a>v) v=a; }
        if(v>mx) mx=v;
      }
      out[i]=mx;
    }
    // normalize
    let peak=0; for(let i=0;i<n;i++) if(out[i]>peak) peak=out[i];
    if(peak>0){ const g=1/peak; for(let i=0;i<n;i++) out[i]*=g; }
    return out;
  }

  // ---- waveform draw ----
  function drawWave(){
    const wrap=el('waveWrap'), cv=el('wave');
    const W=wrap.clientWidth, H=wrap.clientHeight;
    if(!W||!H) return;
    const dpr=Math.min(2, window.devicePixelRatio||1);
    cv.width=W*dpr; cv.height=H*dpr;
    const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
    g.clearRect(0,0,W,H);

    const cWave=cssVar('--wave')||'#b9c0d4';
    const cSel=cssVar('--wave-sel')||'#7c3aed';
    const cSoft=cssVar('--accent-soft')||'#efe9fe';
    const mid=H/2, N=2000;

    // selection pixel bounds
    const x0 = dur>0 ? (regStart/dur)*W : 0;
    const x1 = dur>0 ? ((regStart+regLen)/dur)*W : W;

    // selection background
    g.fillStyle=cSoft; g.globalAlpha=0.65; g.fillRect(x0,0,x1-x0,H); g.globalAlpha=1;

    // bars
    const barW=2, gap=1, tot=barW+gap;
    for(let x=0;x<W;x+=tot){
      const idx=Math.floor((x/W)*N);
      let amp = peaks ? peaks[Math.min(N-1,idx)] : 0.12+0.06*Math.sin(x/9);
      amp=Math.max(0.02,amp);
      const h=amp*(H*0.9);
      g.fillStyle=(x>=x0 && x<=x1)?cSel:cWave;
      g.fillRect(x, mid-h/2, barW, h);
    }

    // handles
    g.fillStyle=cSel;
    g.fillRect(x0-1,0,3,H);
    g.fillRect(x1-2,0,3,H);
    // grips
    g.fillStyle=cSel;
    [x0, x1].forEach(x=>{ roundRect(g, x-4, mid-13, 8, 26, 4); g.fill(); });
    g.fillStyle='#fff'; g.globalAlpha=0.85;
    [x0,x1].forEach(x=>{ g.fillRect(x-1.5, mid-7, 1, 14); g.fillRect(x+0.5, mid-7, 1, 14); });
    g.globalAlpha=1;

    // playhead
    if(playing && audio.duration && dur>0){
      const px=(audio.currentTime/dur)*W;
      g.fillStyle=cssVar('--ink')||'#1c2030'; g.globalAlpha=0.55;
      g.fillRect(px-0.5,0,1.5,H); g.globalAlpha=1;
    }
  }
  function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

  function updateInfo(){
    el('infStart').textContent=mmss(regStart);
    el('infEnd').textContent=mmss(regStart+regLen);
    el('infLen').textContent=regLen.toFixed(1)+'s';
    el('startNum').value=regStart.toFixed(1);
    el('lenNum').value=regLen.toFixed(1);
    document.querySelectorAll('#lenChips .chip').forEach(c=>c.classList.toggle('on', Math.abs(parseFloat(c.getAttribute('data-len'))-regLen)<0.05));
  }
  function setRegion(start, len){
    len=clamp(len, MIN_LEN, Math.min(MAX_LEN, dur||MAX_LEN));
    start=clamp(start, 0, Math.max(0, (dur||len)-len));
    regStart=start; regLen=len;
    updateInfo(); drawWave();
  }

  // ---- pointer interaction on waveform ----
  (function(){
    const wrap=el('waveWrap');
    let mode=null, grabDx=0;
    function xToTime(clientX){ const r=wrap.getBoundingClientRect(); const x=clamp(clientX-r.left,0,r.width); return dur>0 ? (x/r.width)*dur : 0; }
    function px(time){ const r=wrap.getBoundingClientRect(); return dur>0 ? (time/dur)*r.width : 0; }
    function down(e){
      if(!dur) return;
      const cx=(e.touches?e.touches[0].clientX:e.clientX);
      const x0=px(regStart), x1=px(regStart+regLen), x=cx-wrap.getBoundingClientRect().left;
      const near=8;
      if(Math.abs(x-x0)<=near) mode='start';
      else if(Math.abs(x-x1)<=near) mode='end';
      else if(x>x0 && x<x1){ mode='move'; grabDx=xToTime(cx)-regStart; }
      else { // click outside → start a new region here
        mode='end'; setRegion(xToTime(cx), MIN_LEN);
      }
      e.preventDefault();
      window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
    }
    function move(e){
      if(!mode) return;
      const cx=e.clientX; const tm=xToTime(cx);
      if(mode==='move'){ setRegion(tm-grabDx, regLen); }
      else if(mode==='start'){ const end=regStart+regLen; const s=clamp(tm,0,end-MIN_LEN); setRegion(s, clamp(end-s,MIN_LEN,MAX_LEN)); }
      else if(mode==='end'){ const s=regStart; const end=clamp(tm, s+MIN_LEN, dur); setRegion(s, clamp(end-s,MIN_LEN,MAX_LEN)); }
    }
    function up(){ mode=null; window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); }
    wrap.addEventListener('pointerdown',down);
  })();

  // ---- preview playback ----
  function stopPlay(){ playing=false; audio.pause(); cancelAnimationFrame(raf); setPlayIco(false); drawWave(); }
  function setPlayIco(on){ el('playIco').innerHTML = on ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>'; }
  function togglePlay(){
    if(!item||!dur) return;
    if(playing){ stopPlay(); return; }
    playing=true; setPlayIco(true);
    audio.currentTime=regStart;
    const p=audio.play(); if(p&&p.catch) p.catch(()=>{});
    const tick=()=>{
      if(!playing) return;
      if(audio.currentTime>=regStart+regLen-0.02){ audio.currentTime=regStart; }
      drawWave();
      raf=requestAnimationFrame(tick);
    };
    raf=requestAnimationFrame(tick);
  }
  audio.addEventListener('ended',stopPlay);

  // ---- run ----
  async function run(){
    if(busy) return;
    el('optErr').textContent='';
    if(!item){ el('optErr').textContent=t.errNoFile; return; }
    if(location.protocol==='file:'){ el('optErr').textContent=t.errFileProto; return; }
    if(!planPaid() && remaining()<=0){ el('optErr').textContent=t.errDaily(FREE_DAILY); showUpgrade(); return; }
    stopPlay();

    busy=true; el('goBtn').disabled=true; el('goTxt').textContent=t.goBtnBusy;
    const prog=el('progCard'); prog.classList.add('show');
    el('progName').textContent=t.engineLoading; el('progPct').textContent=''; el('progPhase').textContent='';
    el('progWrap').classList.add('indet');
    prog.scrollIntoView({behavior:'smooth',block:'center'});

    let f;
    try{ f=await loadFF(); }
    catch(_){ prog.classList.remove('show'); el('progWrap').classList.remove('indet'); el('optErr').textContent=t.errEngine; finishBusy(); return; }
    el('progWrap').classList.remove('indet');
    el('progPhase').textContent=t.phaseCut;

    const conf=OUT[fmt];
    const inName='in_'+(uid++)+'.'+extOf(item.name);
    const outName='out_'+(uid++)+'.'+conf.ext;
    const br=el('brSel').value;
    const len=regLen, start=regStart;
    const onp=e=>{ if(e && isFinite(e.progress)) setProg(Math.round(clamp(e.progress,0,1)*100)); };
    let spent=false;
    try{
      await f.writeFile(inName, await fetchFile(item.file));
      f.on('progress', onp);
      const args=['-hide_banner','-ss',start.toFixed(3),'-i',inName,'-t',len.toFixed(3)];
      if(el('fadeChk').checked){
        const fd=Math.min(1.5, Math.max(0.2, len*0.12));
        const outSt=Math.max(0,(len-fd)).toFixed(3);
        args.push('-af', `afade=t=in:st=0:d=${fd.toFixed(3)},afade=t=out:st=${outSt}:d=${fd.toFixed(3)}`);
      }
      args.push('-ac','2', ...conf.enc);
      if(fmt!=='wav') args.push('-b:a', br+'k');
      args.push(...conf.fmt, outName);
      await f.exec(args);
      const data=await f.readFile(outName);
      setProg(100);
      const blob=new Blob([data.buffer||data], { type: conf.mime });
      if(!blob.size) throw new Error('empty');
      const dlName = baseName(item.name).slice(0,40)+'-'+t.dlName+'.'+conf.dl;
      result={ blob, url:URL.createObjectURL(blob), name:dlName, len, label:conf.label };
      addToday();
    }catch(err){
      console.error(err); spent=true;
      prog.classList.remove('show'); el('optErr').textContent=t.errFail; finishBusy(); return;
    }finally{
      try{ f.off('progress', onp); }catch(_){}
      if(!spent){ try{ await f.deleteFile(inName); }catch(_){} try{ await f.deleteFile(outName); }catch(_){} }
    }
    await sleep(180);
    prog.classList.remove('show'); el('progPhase').textContent='';
    finishBusy();
    showResult();
  }
  function finishBusy(){ busy=false; el('goBtn').disabled=false; el('goTxt').textContent=t.goBtn; }
  function setProg(p){ el('progBar').style.width=p+'%'; el('progPct').textContent=p+'%'; }

  function showResult(){
    if(!result) return;
    el('rName').textContent=result.name;
    el('rMeta').textContent=t.metaOut(result.len.toFixed(1)+'s', result.label+' · '+fmtBytes(result.blob.size));
    el('resultsCard').classList.add('show');
    el('resultsCard').scrollIntoView({behavior:'smooth',block:'center'});
  }
  function downloadResult(){
    if(!result) return;
    const a=document.createElement('a'); a.href=result.url; a.download=result.name; document.body.appendChild(a); a.click(); a.remove();
  }
  let rAudio=null, rPlaying=false;
  function toggleResultPlay(){
    if(!result) return;
    if(!rAudio){ rAudio=new Audio(); rAudio.addEventListener('ended',()=>{ rPlaying=false; el('rPlay').querySelector('svg').innerHTML='<path d="M8 5v14l11-7z"/>'; }); }
    if(rPlaying){ rAudio.pause(); rPlaying=false; el('rPlay').querySelector('svg').innerHTML='<path d="M8 5v14l11-7z"/>'; return; }
    rAudio.src=result.url; rAudio.currentTime=0; const p=rAudio.play(); if(p&&p.catch) p.catch(()=>{});
    rPlaying=true; el('rPlay').querySelector('svg').innerHTML='<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
  }

  function clearItem(){
    stopPlay();
    if(item&&item.url) URL.revokeObjectURL(item.url);
    if(result&&result.url){ URL.revokeObjectURL(result.url); result=null; }
    if(rAudio){ try{ rAudio.pause(); }catch(_){} rAudio=null; rPlaying=false; }
    item=null; peaks=null; dur=0; regStart=0; regLen=30;
  }
  function reset(){
    clearItem();
    el('stack').classList.remove('show');
    el('resultsCard').classList.remove('show');
    el('drop').style.display='';
    el('optErr').textContent='';
    audio.removeAttribute('src');
    window.scrollTo({top:0,behavior:'smooth'});
  }

  // ---- i18n + theme ----
  function applyLang(l){
    lang=l; t=I18N[l];
    document.documentElement.lang=l; document.documentElement.dir=t.dir;
    document.querySelectorAll('[data-i18n]').forEach(n=>{ const k=n.getAttribute('data-i18n'); if(typeof t[k]==='string') n.textContent=t[k]; });
    el('goTxt').textContent = busy ? t.goBtnBusy : t.goBtn;
    try{ localStorage.setItem('ac_lang', l); }catch(_){}
    updateLimitsUI();
    if(result && el('resultsCard').classList.contains('show')) showResult();
  }
  function detectLang(){
    const chosen=ls('ac_lang'); if(chosen) return chosen;
    const cc=ls('ac_country'); if(cc) return cc==='IL'?'he':'en';
    let tz=''; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(_){}
    const navHe=(navigator.language||'').toLowerCase().indexOf('he')===0;
    return (tz==='Asia/Jerusalem'||navHe)?'he':'en';
  }
  function applyTheme(th){
    const dark=(th==='dark');
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
    const ti=el('themeIco'); if(ti) ti.textContent = dark?'☀️':'🌙';
    try{ localStorage.setItem('theme', dark?'dark':'light'); }catch(_){}
    drawWave();
  }

  // ---- events ----
  const drop=el('drop'), input=el('fileInput');
  el('chooseBtn').addEventListener('click',e=>{ e.stopPropagation(); input.click(); });
  el('chgBtn').addEventListener('click',()=>input.click());
  drop.addEventListener('click',()=>input.click());
  input.addEventListener('change',()=>{ pickFile(input.files); input.value=''; });
  ;['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.add('over'); }));
  ;['dragleave','dragend'].forEach(ev=>drop.addEventListener(ev,()=>drop.classList.remove('over')));
  drop.addEventListener('drop',e=>{ e.preventDefault(); drop.classList.remove('over'); if(e.dataTransfer) pickFile(e.dataTransfer.files); });
  document.addEventListener('dragover',e=>{ if(e.dataTransfer && Array.from(e.dataTransfer.types||[]).includes('Files')) e.preventDefault(); });
  document.addEventListener('drop',e=>{ if(e.target!==drop && e.dataTransfer && Array.from(e.dataTransfer.types||[]).includes('Files')){ e.preventDefault(); if(!item) pickFile(e.dataTransfer.files); } });

  el('playBtn').addEventListener('click',togglePlay);
  el('startNum').addEventListener('input',()=>{ const v=parseFloat(el('startNum').value); if(isFinite(v)) setRegion(v, regLen); });
  el('lenNum').addEventListener('input',()=>{ const v=parseFloat(el('lenNum').value); if(isFinite(v)) setRegion(regStart, v); });
  el('lenChips').addEventListener('click',e=>{ const c=e.target.closest('.chip'); if(c) setRegion(regStart, parseFloat(c.getAttribute('data-len'))); });
  el('fmtSeg').addEventListener('click',e=>{ const b=e.target.closest('[data-fmt]'); if(b){ el('fmtSeg').querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); fmt=b.getAttribute('data-fmt'); } });

  el('goBtn').addEventListener('click',run);
  el('dlBtn').addEventListener('click',downloadResult);
  el('rPlay').addEventListener('click',toggleResultPlay);
  el('newBtn').addEventListener('click',reset);

  window.addEventListener('resize',()=>{ clearTimeout(window._wt); window._wt=setTimeout(drawWave,120); });
  window.__setLang=applyLang;
  const tt=el('themeToggle'); if(tt) tt.addEventListener('click',()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));

  // ---- init ----
  applyTheme(ls('theme')||'light');
  applyLang(detectLang());
  updateLimitsUI();
  setTimeout(()=>{ if(engineAvailable && location.protocol!=='file:') loadFF().catch(()=>{}); }, 800);
})();
</script>
</body>
