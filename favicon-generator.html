<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOLKLI — מחולל Favicon</title>
<meta name="description" content="Free favicon generator — build a website favicon from text, an emoji or an image, preview it live at 16/32/48/180px, download ready PNGs and copy the &lt;link&gt; tags. Fast, simple and professional-quality.">
<style>
  :root {
    --bg:#eef0f6; --panel:#ffffff; --panel-2:#f5f6fa; --line:#e5e8f0; --line-2:#eef0f6;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#7c3aed; --accent-dim:#6a2fe0; --accent-ink:#ffffff; --accent-soft:#efe9fe;
    --success:#22b04b; --success-dim:#1c9a41; --success-soft:#e6f6ec;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --danger:#e5484d; --danger-soft:#fdecec;
    --warm-soft:#fff5da; --warm-line:#f2d98a;
    --ok:#22b04b; --warn:#c88a04; --err:#e5484d;
    --grad:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn-glow:rgba(59,111,246,0.38);
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-lg:0 2px 6px rgba(20,24,44,0.05), 0 20px 50px rgba(20,24,44,0.10);
    --shadow-sm:0 1px 2px rgba(20,24,44,0.05);
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --sans:'Space Grotesk',system-ui,'Segoe UI','Heebo',sans-serif;
  }
  html[data-theme="dark"] {
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a303c; --line-2:#232833;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --accent:#a06bff; --accent-dim:#7c3aed; --accent-ink:#ffffff; --accent-soft:#241a3a;
    --success:#37c26a; --success-dim:#2fae5e; --success-soft:#132a1c;
    --info:#5b95f8; --info-dim:#4f8ef7; --info-soft:#182338;
    --danger:#ff6b6b; --danger-soft:#2a1719;
    --warm-soft:#2c2718; --warm-line:#5a4d24;
    --ok:#4ec98a; --warn:#e8b84b; --err:#ff6b6b;
    --grad:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn-glow:rgba(77,123,255,0.45);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,0.45), 0 24px 60px rgba(0,0,0,0.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;}
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:var(--grad);z-index:100;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--sans);}
  .wrap{width:100%;max-width:none;margin:0 auto;padding:26px 20px 64px;}

  /* page intro */
  .pagehead{margin:4px 0 22px;}
  .pagehead h1{font-size:clamp(23px,3vw,32px);font-weight:700;letter-spacing:-0.02em;margin:0 0 8px;}
  .pagehead .kick{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);
    padding:4px 11px;border-radius:999px;margin-bottom:12px;}
  .pagehead p{font-size:14.5px;color:var(--muted);margin:0;max-width:70ch;}

  /* reused helpers (from color-convert.html) */
  input[type=color]{-webkit-appearance:none;appearance:none;width:56px;height:44px;padding:0;border:1px solid var(--line);
    border-radius:12px;background:var(--panel-2);cursor:pointer;flex-shrink:0;}
  input[type=color]::-webkit-color-swatch-wrapper{padding:4px;}
  input[type=color]::-webkit-color-swatch{border:none;border-radius:8px;}
  .gbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--ink-2);font-size:13px;font-weight:600;padding:10px 12px;border-radius:11px;
    cursor:pointer;transition:all .12s;}
  .gbtn:hover{border-color:var(--accent);color:var(--accent-dim);background:var(--accent-soft);}
  .gbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .gbtn.hidden{display:none;}
  .copybtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);
    color:var(--muted);font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:9px;cursor:pointer;transition:all .12s;}
  .copybtn:hover{border-color:var(--accent);color:var(--accent-dim);background:var(--accent-soft);}
  .copybtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .fstr{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ink);background:var(--panel-2);
    border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;margin-bottom:12px;overflow-x:auto;white-space:nowrap;
    direction:ltr;text-align:start;}

  /* ---- favicon tool ---- */
  .tool{display:grid;grid-template-columns:1fr 350px;gap:18px;align-items:start;}
  @media (max-width:820px){ .tool{grid-template-columns:1fr;} }
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);}

  .pvcard{padding:18px;position:sticky;top:16px;}
  .pvhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .pvhead .ptitle{font-size:13px;font-weight:800;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;}
  .stage{border-radius:14px;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:26px;padding:34px 22px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);
    background-color:var(--panel-2);
    background-image:
      linear-gradient(45deg,rgba(128,128,128,.10) 25%,transparent 25%,transparent 75%,rgba(128,128,128,.10) 75%),
      linear-gradient(45deg,rgba(128,128,128,.10) 25%,transparent 25%,transparent 75%,rgba(128,128,128,.10) 75%);
    background-size:20px 20px;background-position:0 0,10px 10px;}
  .sizes{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:22px;}
  .sztile{display:flex;flex-direction:column;align-items:center;gap:9px;}
  .sztile canvas{display:block;border-radius:2px;image-rendering:auto;}
  .szlbl{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted);direction:ltr;unicode-bidi:isolate;}
  .tabmock{width:100%;display:flex;justify-content:center;}
  .tab{direction:ltr;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px 10px 4px 4px;padding:9px 12px;box-shadow:var(--shadow-sm);width:100%;max-width:280px;}
  .tab canvas{width:16px;height:16px;flex-shrink:0;border-radius:2px;}
  .tab .tabtitle{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
  .tab .tabx{color:var(--faint);font-size:15px;line-height:1;flex-shrink:0;}

  .ctrlcard{padding:18px;}
  .ctrl{margin-bottom:15px;}
  .ctrl.inline{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .ctrl.inline > label{font-size:13px;font-weight:600;color:var(--ink-2);}
  .ctrl-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px;}
  .ctrl-head label{font-size:13px;font-weight:600;color:var(--ink-2);}

  .btngroup{display:flex;gap:8px;}
  .chip{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--ink-2);font-size:12.5px;font-weight:600;padding:9px 8px;border-radius:10px;
    cursor:pointer;transition:all .12s;}
  .chip:hover{border-color:var(--accent);color:var(--accent-dim);}
  .chip.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-dim);}
  .chip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  .txtin{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:11px;
    font-family:var(--sans);font-size:18px;font-weight:600;text-align:center;padding:10px 12px;
    transition:border-color .12s,box-shadow .12s;}
  .txtin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .sel{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;
    font-family:var(--sans);font-size:13px;font-weight:600;padding:8px 10px;cursor:pointer;transition:border-color .12s,box-shadow .12s;}
  .sel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}

  .drop{border:2px dashed var(--line);border-radius:14px;padding:26px 18px;text-align:center;cursor:pointer;
    transition:border-color .12s,background .12s;color:var(--muted);}
  .drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);}
  .drop svg{width:26px;height:26px;stroke:var(--accent-dim);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-bottom:8px;}
  .drop .dt{font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:3px;word-break:break-word;}
  .drop .ds{font-size:11.5px;color:var(--muted);}

  .dlgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .dlgrid .gbtn{flex:none;font-family:var(--mono);font-size:12px;padding:9px 6px;}
  .ltr{direction:ltr;unicode-bidi:isolate;}
  #snip{white-space:pre;line-height:1.75;font-size:12.5px;}
  .hidden{display:none;}

  /* reused numeric/slider + switch helpers (from box-shadow.html) */
  .numwrap{display:inline-flex;align-items:center;gap:5px;direction:ltr;}
  .numin{width:58px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:9px;
    font-family:var(--mono);font-size:13px;font-weight:600;text-align:center;padding:6px 4px;transition:border-color .12s,box-shadow .12s;}
  .numin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .numin::-webkit-outer-spin-button,.numin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .unit{font-family:var(--mono);font-size:12px;color:var(--faint);}
  .rng{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;margin:0;}
  .rng:focus{outline:none;}
  .rng::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:var(--line);}
  .rng::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;
    background:var(--accent);border:3px solid var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.28);margin-top:-6px;cursor:pointer;}
  .rng:focus::-webkit-slider-thumb{box-shadow:0 0 0 4px var(--accent-soft);}
  .rng::-moz-range-track{height:6px;border-radius:999px;background:var(--line);}
  .rng::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--accent);border:3px solid var(--panel);
    box-shadow:0 1px 3px rgba(0,0,0,.28);cursor:pointer;}
  .switch{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0;direction:ltr;}
  .switch input{position:absolute;opacity:0;width:0;height:0;}
  .switch .track{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .15s;cursor:pointer;}
  .switch .track::before{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
    background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s;}
  .switch input:checked + .track{background:var(--accent);}
  .switch input:checked + .track::before{transform:translateX(20px);}

  .divider{height:1px;background:var(--line);margin:16px 0;border:0;}
  .fhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
  .ftitle{font-size:13px;font-weight:800;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;}

  .note{display:flex;align-items:flex-start;gap:9px;margin-top:18px;padding:12px 14px;border-radius:12px;
    background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);
    font-size:12px;color:var(--ink-2);line-height:1.55;}
  .note svg{width:16px;height:16px;color:var(--accent-dim);flex-shrink:0;margin-top:1px;
    stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  footer{margin-top:34px;text-align:center;color:var(--faint);font-size:12px;font-family:var(--mono);}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:11px 18px;border-radius:999px;
    box-shadow:var(--shadow-lg);transition:opacity .2s,transform .2s;z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
<link rel="stylesheet" href="./header.css">
</head>
<body>
<div id="site-header"></div>
<script src="./header.js"></script>
<div class="wrap">

  <div class="pagehead">
    <span class="kick" data-i18n="kick"></span>
    <h1 data-i18n="pageTitle"></h1>
    <p data-i18n="pageSub"></p>
  </div>

  <div class="tool">
    <!-- preview stage -->
    <div class="card pvcard">
      <div class="pvhead">
        <span class="ptitle" data-i18n="previewLabel"></span>
      </div>
      <div class="stage" id="stage">
        <div class="sizes">
          <div class="sztile"><canvas id="cv16" width="16" height="16"></canvas><span class="szlbl">16&times;16</span></div>
          <div class="sztile"><canvas id="cv32" width="32" height="32"></canvas><span class="szlbl">32&times;32</span></div>
          <div class="sztile"><canvas id="cv48" width="48" height="48"></canvas><span class="szlbl">48&times;48</span></div>
          <div class="sztile"><canvas id="cv180" width="180" height="180"></canvas><span class="szlbl">180&times;180</span></div>
        </div>
        <div class="tabmock">
          <div class="tab">
            <canvas id="cvTab" width="16" height="16"></canvas>
            <span class="tabtitle" id="tabTitle"></span>
            <span class="tabx">&times;</span>
          </div>
        </div>
      </div>
    </div>

    <!-- controls + output -->
    <div class="card ctrlcard">
      <!-- source mode -->
      <div class="ctrl">
        <div class="ctrl-head"><label data-i18n="modeLabel"></label></div>
        <div class="btngroup" id="modeGroup">
          <button class="chip active" data-mode="text" type="button">
            <svg viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
            <span data-i18n="modeText"></span>
          </button>
          <button class="chip" data-mode="image" type="button">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
            <span data-i18n="modeImage"></span>
          </button>
        </div>
      </div>

      <!-- TEXT / EMOJI panel -->
      <div id="textPanel">
        <div class="ctrl">
          <div class="ctrl-head"><label for="txtIn" data-i18n="textLabel"></label></div>
          <input type="text" id="txtIn" class="txtin" maxlength="6" value="K" spellcheck="false" autocomplete="off">
        </div>
        <div class="ctrl inline">
          <label for="fgPick" data-i18n="fgLabel"></label>
          <input type="color" id="fgPick" value="#ffffff" aria-label="text color">
        </div>
        <div class="ctrl inline">
          <label for="weightSel" data-i18n="weightLabel"></label>
          <select id="weightSel" class="sel">
            <option value="400" data-i18n="weightRegular"></option>
            <option value="700" selected data-i18n="weightBold"></option>
            <option value="900" data-i18n="weightBlack"></option>
          </select>
        </div>
      </div>

      <!-- IMAGE panel -->
      <div id="imagePanel" class="hidden">
        <div class="ctrl">
          <div class="drop" id="drop">
            <input type="file" id="fileIn" accept="image/*" hidden>
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <div class="dt" id="dropTitle"></div>
            <div class="ds" data-i18n="dropSub"></div>
          </div>
        </div>
      </div>

      <!-- shared: background + shape -->
      <div class="ctrl inline">
        <label for="bgPick" data-i18n="bgLabel"></label>
        <input type="color" id="bgPick" value="#7b34ff" aria-label="background color">
      </div>

      <div class="ctrl">
        <div class="ctrl-head"><label data-i18n="shapeLabel"></label></div>
        <div class="btngroup" id="shapeGroup">
          <button class="chip" data-shape="square" type="button"><span data-i18n="shapeSquare"></span></button>
          <button class="chip active" data-shape="rounded" type="button"><span data-i18n="shapeRounded"></span></button>
          <button class="chip" data-shape="circle" type="button"><span data-i18n="shapeCircle"></span></button>
        </div>
      </div>

      <hr class="divider">

      <!-- download -->
      <div class="ctrl-head"><label data-i18n="downloadLabel"></label></div>
      <div class="dlgrid" id="dlGrid">
        <button class="gbtn" data-size="16" type="button"><span class="ltr">16&nbsp;px</span></button>
        <button class="gbtn" data-size="32" type="button"><span class="ltr">32&nbsp;px</span></button>
        <button class="gbtn" data-size="48" type="button"><span class="ltr">48&nbsp;px</span></button>
        <button class="gbtn" data-size="180" type="button"><span class="ltr">180&nbsp;px</span></button>
        <button class="gbtn" data-size="192" type="button"><span class="ltr">192&nbsp;px</span></button>
        <button class="gbtn" data-size="512" type="button"><span class="ltr">512&nbsp;px</span></button>
      </div>

      <hr class="divider">

      <!-- code snippet -->
      <div class="fhead"><span class="ftitle" data-i18n="snippetLabel"></span>
        <button class="copybtn" data-copy="snip" type="button"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span data-i18n="copy"></span></button>
      </div>
      <div class="fstr" id="snip"></div>
    </div>
  </div>

  <div class="note">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <span data-i18n="note"></span>
  </div>

  <footer data-i18n="foot"></footer>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const el = id => document.getElementById(id);

  const I18N = {
    he:{ dir:'rtl',
      kick:'מחולל Favicon',

      previewLabel:'תצוגה מקדימה', tabTitle:'האתר שלי — KOLKLI',

      weightLabel:'עובי הגופן', weightRegular:'רגיל', weightBold:'מודגש', weightBlack:'שחור',
      bgLabel:'צבע הרקע', shapeLabel:'צורה', shapeSquare:'מרובע', shapeRounded:'מעוגל', shapeCircle:'עיגול',
      dropTitle:'גררו תמונה לכאן', dropSub:'או לחצו לבחירת קובץ · PNG/JPG/SVG',
      downloadLabel:'הורדת PNG', snippetLabel:'קוד ל-head',
      copy:'העתקה', copiedMsg:'הועתק ✓', downloadedMsg:'הורד favicon-{n}.png ✓',
      badFile:'קובץ לא נתמך — בחרו תמונה',
      note:'לא נוצר קובץ ico. מרובה-רזולוציות — דפדפנים מודרניים מקבלים favicon בפורמט PNG. מהיר, פשוט ובאיכות מקצועית.',
      foot:'KOLKLI · מחולל Favicon · מהיר, פשוט ובאיכות מקצועית' },
    en:{ dir:'ltr',
      kick:'Favicon Generator',
      pageTitle:'Favicon Generator',
      pageSub:'Create a website favicon from text, an emoji or an image — pick a color, shape and background and watch a live preview at every size. Download ready-made PNGs and copy the link tags. Fast, simple and professional-quality.',
      previewLabel:'Live preview', tabTitle:'My Website — KOLKLI',
      modeLabel:'Source', modeText:'Text / Emoji', modeImage:'Image',
      textLabel:'Text or emoji (1–3 chars)', fgLabel:'Text color',
      weightLabel:'Font weight', weightRegular:'Regular', weightBold:'Bold', weightBlack:'Black',
      bgLabel:'Background color', shapeLabel:'Shape', shapeSquare:'Square', shapeRounded:'Rounded', shapeCircle:'Circle',
      dropTitle:'Drop an image here', dropSub:'or click to choose a file · PNG/JPG/SVG',
      downloadLabel:'Download PNG', snippetLabel:'Code for head',
      copy:'Copy', copiedMsg:'Copied ✓', downloadedMsg:'Downloaded favicon-{n}.png ✓',
      badFile:'Unsupported file — choose an image',
      note:'A real multi-resolution .ico isn\'t generated — modern browsers accept PNG favicons. Fast, simple and professional-quality.',
      foot:'KOLKLI · Favicon Generator · Fast, simple and professional quality' },
    ru:{ dir:'ltr',
      kick:'Генератор Favicon',
      pageTitle:'Генератор favicon',
      pageSub:'Создайте favicon для сайта из текста, эмодзи или изображения — выберите цвет, форму и фон и следите за живым предпросмотром во всех размерах. Скачивайте готовые PNG и копируйте теги link. Быстро, просто и профессионального качества.',
      previewLabel:'Живой предпросмотр', tabTitle:'Мой сайт — KOLKLI',
      modeLabel:'Источник', modeText:'Текст / Эмодзи', modeImage:'Изображение',
      textLabel:'Текст или эмодзи (1–3 симв.)', fgLabel:'Цвет текста',
      weightLabel:'Насыщенность шрифта', weightRegular:'Обычный', weightBold:'Жирный', weightBlack:'Чёрный',
      bgLabel:'Цвет фона', shapeLabel:'Форма', shapeSquare:'Квадрат', shapeRounded:'Скруглённый', shapeCircle:'Круг',
      dropTitle:'Перетащите изображение сюда', dropSub:'или нажмите, чтобы выбрать файл · PNG/JPG/SVG',
      downloadLabel:'Скачать PNG', snippetLabel:'Код для head',
      copy:'Копировать', copiedMsg:'Скопировано ✓', downloadedMsg:'Скачано favicon-{n}.png ✓',
      badFile:'Неподдерживаемый файл — выберите изображение',
      note:'Настоящий многоразмерный .ico не создаётся — современные браузеры принимают PNG-favicon. Быстро, просто и профессионального качества.',
      foot:'KOLKLI · Генератор Favicon · Быстро, просто и профессионального качества' }
  };

  const SANS = "'Space Grotesk',system-ui,'Segoe UI','Heebo',sans-serif";
  const SNIP =
    '<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">\n' +
    '<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">\n' +
    '<link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png">';

  let lang='he', t=I18N.he;
  const state = { mode:'text', text:'K', fg:'#ffffff', bg:'#7b34ff', shape:'rounded', weight:'700', img:null, fileName:'' };

  // ---- drawing ----
  function roundRectPath(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function clipShape(ctx,size){
    if(state.shape==='circle'){ ctx.beginPath(); ctx.arc(size/2,size/2,size/2,0,Math.PI*2); ctx.closePath(); ctx.clip(); }
    else if(state.shape==='rounded'){ roundRectPath(ctx,0,0,size,size,size*0.22); ctx.clip(); }
    // 'square' → no clip (full canvas)
  }
  function drawIcon(canvas,size){
    canvas.width=size; canvas.height=size;
    const ctx=canvas.getContext('2d');
    ctx.clearRect(0,0,size,size);
    ctx.save();
    clipShape(ctx,size);
    // background behind the glyph / transparent image areas
    ctx.fillStyle=state.bg;
    ctx.fillRect(0,0,size,size);
    if(state.mode==='image' && state.img){
      const iw=state.img.naturalWidth||state.img.width, ih=state.img.naturalHeight||state.img.height;
      if(iw && ih){
        const scale=Math.max(size/iw,size/ih); // cover-fit
        const w=iw*scale, h=ih*scale;
        ctx.drawImage(state.img,(size-w)/2,(size-h)/2,w,h);
      }
    } else if(state.mode==='text'){
      const glyphs=Array.from((state.text||'').trim());
      if(glyphs.length){
        const n=glyphs.length;
        const fs=size*(n>=3?0.40:n===2?0.52:0.64);
        ctx.fillStyle=state.fg;
        ctx.textAlign='center';
        ctx.textBaseline='middle';
        ctx.font=state.weight+' '+fs+'px '+SANS;
        ctx.fillText(glyphs.join(''), size/2, size/2 + size*0.03);
      }
    }
    ctx.restore();
  }

  function render(){
    drawIcon(el('cv16'),16);
    drawIcon(el('cv32'),32);
    drawIcon(el('cv48'),48);
    drawIcon(el('cv180'),180);
    drawIcon(el('cvTab'),16);
  }

  // ---- toast + copy ----
  function toast(msg){ const e=el('toast'); e.textContent=msg; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),1700); }
  function copy(text){
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).catch(fallbackCopy.bind(null,text)); }
    else fallbackCopy(text);
    toast(t.copiedMsg);
  }
  function fallbackCopy(text){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(_){} document.body.removeChild(ta);
  }

  // ---- download ----
  function download(size){
    const c=document.createElement('canvas');
    drawIcon(c,size);
    c.toBlob(function(blob){
      if(!blob) return;
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download='favicon-'+size+'.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1500);
      toast(t.downloadedMsg.replace('{n}',size));
    },'image/png');
  }

  // ---- file loading ----
  function loadFile(f){
    if(!f || !/^image\//.test(f.type)){ toast(t.badFile); return; }
    const reader=new FileReader();
    reader.onload=function(){
      const img=new Image();
      img.onload=function(){ state.img=img; state.fileName=f.name; setMode('image'); render(); updateDropUI(); };
      img.onerror=function(){ toast(t.badFile); };
      img.src=reader.result;
    };
    reader.readAsDataURL(f);
  }
  function updateDropUI(){
    const dt=el('dropTitle');
    if(dt) dt.textContent = state.fileName ? state.fileName : t.dropTitle;
  }

  // ---- mode / shape ----
  function setMode(m){
    state.mode=m;
    el('textPanel').classList.toggle('hidden', m!=='text');
    el('imagePanel').classList.toggle('hidden', m!=='image');
    el('modeGroup').querySelectorAll('.chip').forEach(c=>c.classList.toggle('active', c.getAttribute('data-mode')===m));
  }
  function setShape(s){
    state.shape=s;
    el('shapeGroup').querySelectorAll('.chip').forEach(c=>c.classList.toggle('active', c.getAttribute('data-shape')===s));
    render();
  }

  // ---- events ----
  el('modeGroup').addEventListener('click',e=>{ const b=e.target.closest('[data-mode]'); if(!b) return; setMode(b.getAttribute('data-mode')); render(); });
  el('shapeGroup').addEventListener('click',e=>{ const b=e.target.closest('[data-shape]'); if(!b) return; setShape(b.getAttribute('data-shape')); });

  el('txtIn').addEventListener('input',()=>{ state.text=el('txtIn').value; render(); });
  el('fgPick').addEventListener('input',()=>{ state.fg=el('fgPick').value; render(); });
  el('bgPick').addEventListener('input',()=>{ state.bg=el('bgPick').value; render(); });
  el('weightSel').addEventListener('change',()=>{ state.weight=el('weightSel').value; render(); });

  el('drop').addEventListener('click',()=>el('fileIn').click());
  el('fileIn').addEventListener('change',e=>{ const f=e.target.files && e.target.files[0]; if(f) loadFile(f); e.target.value=''; });
  ['dragenter','dragover'].forEach(ev=>el('drop').addEventListener(ev,e=>{ e.preventDefault(); el('drop').classList.add('over'); }));
  ['dragleave','dragend'].forEach(ev=>el('drop').addEventListener(ev,()=>el('drop').classList.remove('over')));
  el('drop').addEventListener('drop',e=>{ e.preventDefault(); el('drop').classList.remove('over'); const f=e.dataTransfer.files && e.dataTransfer.files[0]; if(f) loadFile(f); });

  el('dlGrid').addEventListener('click',e=>{ const b=e.target.closest('[data-size]'); if(!b) return; download(+b.getAttribute('data-size')); });

  document.querySelectorAll('.copybtn').forEach(b=>{
    b.addEventListener('click',()=>{ const target=el(b.getAttribute('data-copy')); if(target) copy(target.textContent); });
  });

  // ---- i18n + theme ----
  function applyLang(l){
    if(!I18N[l]) l='en';
    lang=l; t=I18N[l];
    document.documentElement.lang=l; document.documentElement.dir=t.dir;
    document.querySelectorAll('[data-i18n]').forEach(n=>{ const k=n.getAttribute('data-i18n'); if(typeof t[k]==='string') n.textContent=t[k]; });
    const tt=el('tabTitle'); if(tt) tt.textContent=t.tabTitle;
    updateDropUI();
    try{ localStorage.setItem('ac_lang', l); }catch(_){}
  }
  function ls(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
  function detectLang(){
    const chosen=ls('ac_lang'); if(chosen) return chosen;
    const cc=ls('ac_country'); if(cc) return cc==='IL'?'he':'en';
    let tz=''; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(_){}
    const navHe=(navigator.language||'').toLowerCase().indexOf('he')===0;
    return (tz==='Asia/Jerusalem'||navHe)?'he':'en';
  }
  function applyTheme(th){
    const dark=(th==='dark');
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
    const ti=el('themeIco'); if(ti) ti.textContent = dark?'☀️':'🌙';
    try{ localStorage.setItem('theme', dark?'dark':'light'); }catch(_){}
  }
  window.__setLang=applyLang;
  const tb=el('themeToggle'); if(tb) tb.addEventListener('click',()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));

  // ---- init ----
  el('snip').textContent=SNIP;
  applyTheme(ls('theme')||'light');
  applyLang(detectLang());
  render();
})();
</script>
</body>
</html>
