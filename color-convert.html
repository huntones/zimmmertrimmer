<style>
  :root {
    --bg:#eef0f6; --panel:#ffffff; --panel-2:#f5f6fa; --line:#e5e8f0; --line-2:#eef0f6;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#7c3aed; --accent-dim:#6a2fe0; --accent-ink:#ffffff; --accent-soft:#efe9fe;
    --success:#22b04b; --success-dim:#1c9a41; --success-soft:#e6f6ec;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --danger:#e5484d; --danger-soft:#fdecec;
    --warm-soft:#fff5da; --warm-line:#f2d98a;
    --ok:#22b04b; --warn:#c88a04; --err:#e5484d;
    --grad:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn-glow:rgba(59,111,246,0.38);
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-lg:0 2px 6px rgba(20,24,44,0.05), 0 20px 50px rgba(20,24,44,0.10);
    --shadow-sm:0 1px 2px rgba(20,24,44,0.05);
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --sans:'Space Grotesk',system-ui,'Segoe UI','Heebo',sans-serif;
  }
  html[data-theme="dark"] {
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a303c; --line-2:#232833;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --accent:#a06bff; --accent-dim:#7c3aed; --accent-ink:#ffffff; --accent-soft:#241a3a;
    --success:#37c26a; --success-dim:#2fae5e; --success-soft:#132a1c;
    --info:#5b95f8; --info-dim:#4f8ef7; --info-soft:#182338;
    --danger:#ff6b6b; --danger-soft:#2a1719;
    --warm-soft:#2c2718; --warm-line:#5a4d24;
    --ok:#4ec98a; --warn:#e8b84b; --err:#ff6b6b;
    --grad:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn-glow:rgba(77,123,255,0.45);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,0.45), 0 24px 60px rgba(0,0,0,0.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;}
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:var(--grad);z-index:100;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--sans);}
  .wrap{width:100%;max-width:none;margin:0 auto;padding:26px 20px 64px;}

  /* page intro */
  .pagehead{margin:4px 0 22px;}
  .pagehead h1{font-size:clamp(23px,3vw,32px);font-weight:700;letter-spacing:-0.02em;margin:0 0 8px;}
  .pagehead .kick{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);
    padding:4px 11px;border-radius:999px;margin-bottom:12px;}
  .pagehead p{font-size:14.5px;color:var(--muted);margin:0;max-width:70ch;}

  .tool{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start;}
  @media (max-width:760px){ .tool{grid-template-columns:1fr;} }
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);}

  /* preview + picker column */
  .pickcol{padding:16px;position:sticky;top:16px;}
  .preview{height:190px;border-radius:14px;display:flex;align-items:flex-end;justify-content:center;
    padding:14px;transition:background .12s;position:relative;overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);
    background-image:
      linear-gradient(45deg,rgba(128,128,128,.10) 25%,transparent 25%,transparent 75%,rgba(128,128,128,.10) 75%),
      linear-gradient(45deg,rgba(128,128,128,.10) 25%,transparent 25%,transparent 75%,rgba(128,128,128,.10) 75%);
    background-size:20px 20px;background-position:0 0,10px 10px;}
  .preview .pvhex{font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:.04em;
    padding:5px 12px;border-radius:999px;background:rgba(0,0,0,.14);backdrop-filter:blur(2px);}
  .pickrow{display:flex;gap:9px;margin-top:14px;}
  input[type=color]{-webkit-appearance:none;appearance:none;width:56px;height:44px;padding:0;border:1px solid var(--line);
    border-radius:12px;background:var(--panel-2);cursor:pointer;flex-shrink:0;}
  input[type=color]::-webkit-color-swatch-wrapper{padding:4px;}
  input[type=color]::-webkit-color-swatch{border:none;border-radius:8px;}
  .hexfield{flex:1;display:flex;direction:ltr;align-items:center;gap:2px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:12px;padding:0 12px;transition:border-color .12s,box-shadow .12s;}
  .hexfield:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .hexfield .hash{color:var(--faint);font-family:var(--mono);font-size:16px;}
  .hexfield input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-family:var(--mono);
    font-size:16px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:11px 0;outline:none;}
  .btnrow{display:flex;gap:9px;margin-top:10px;}
  .gbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--ink-2);font-size:13px;font-weight:600;padding:10px 12px;border-radius:11px;
    cursor:pointer;transition:all .12s;}
  .gbtn:hover{border-color:var(--accent);color:var(--accent-dim);background:var(--accent-soft);}
  .gbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .gbtn.hidden{display:none;}
  .swatches{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;}
  .swatches button{width:26px;height:26px;border-radius:8px;border:1px solid rgba(0,0,0,.12);cursor:pointer;padding:0;
    transition:transform .1s;}
  .swatches button:hover{transform:scale(1.12);}

  /* formats column */
  .formats{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:520px){ .formats{grid-template-columns:1fr;} }
  .fcard{padding:15px 16px 16px;}
  .fhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
  .ftitle{font-size:13px;font-weight:800;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;}
  .copybtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);
    color:var(--muted);font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:9px;cursor:pointer;transition:all .12s;}
  .copybtn:hover{border-color:var(--accent);color:var(--accent-dim);background:var(--accent-soft);}
  .copybtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .fstr{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ink);background:var(--panel-2);
    border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;margin-bottom:12px;overflow-x:auto;white-space:nowrap;
    direction:ltr;text-align:start;}
  .finputs{display:flex;gap:8px;}
  .finputs.wide{gap:8px;}
  .fin{flex:1;min-width:0;}
  .fin > span{display:block;font-size:10px;font-weight:700;color:var(--faint);text-align:center;margin-bottom:4px;font-family:var(--mono);letter-spacing:.06em;}
  .fin input{width:100%;direction:ltr;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:9px;
    font-family:var(--mono);font-size:13.5px;font-weight:600;text-align:center;padding:8px 4px;transition:border-color .12s,box-shadow .12s;}
  .fin input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .fin.hex-in input{text-align:start;text-transform:uppercase;padding-inline:10px;}

  .note{display:flex;align-items:flex-start;gap:9px;margin-top:18px;padding:12px 14px;border-radius:12px;
    background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);
    font-size:12px;color:var(--ink-2);line-height:1.55;}
  .note svg{width:16px;height:16px;color:var(--accent-dim);flex-shrink:0;margin-top:1px;
    stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  footer{margin-top:34px;text-align:center;color:var(--faint);font-size:12px;font-family:var(--mono);}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:11px 18px;border-radius:999px;
    box-shadow:var(--shadow-lg);transition:opacity .2s,transform .2s;z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>

<script>
(function(){
  const el = id => document.getElementById(id);

  const I18N = {
    he:{ dir:'rtl',
      kick:'ממיר צבעים',
      pageTitle:'ממיר צבעים — HEX, RGB, HSL ו-CMYK',
      pageSub:'בחרו צבע או הדביקו ערך באחד הפורמטים, וקבלו מייד את כל השאר — HEX, RGB, HSL ו-CMYK — עם קוד מוכן להעתקה. מהיר, פשוט ובאיכות מקצועית.',
      randomBtn:'צבע אקראי', eyedropBtn:'טפטפת', copy:'העתקה', copiedMsg:'הועתק ✓',
      note:'CMYK מיועד להדפסה והוא קירוב בלבד — הצבע במסך (RGB) עשוי להיראות מעט שונה מהתוצאה המודפסת.',
      foot:'KOLKLI · ממיר צבעים · מהיר, פשוט ובאיכות מקצועית' },
    en:{ dir:'ltr',
      kick:'Color Converter',
      pageTitle:'Color Converter — HEX, RGB, HSL & CMYK',
      pageSub:'Pick a color or paste a value in any format and instantly get all the others — HEX, RGB, HSL and CMYK — with ready-to-copy code. Fast, simple and professional-quality.',
      randomBtn:'Random', eyedropBtn:'Eyedropper', copy:'Copy', copiedMsg:'Copied ✓',
      note:'CMYK is for print and is an approximation only — an on-screen (RGB) color can look a little different once printed.',
      foot:'KOLKLI · Color Converter · Fast, simple and professional quality' },
    ru:{ dir:'ltr',
      kick:'Конвертер цвета',
      pageTitle:'Конвертер цвета — HEX, RGB, HSL и CMYK',
      pageSub:'Выберите цвет или вставьте значение в любом формате и мгновенно получите все остальные — HEX, RGB, HSL и CMYK — с готовым кодом для копирования. Быстро, просто и профессионального качества.',
      randomBtn:'Случайный', eyedropBtn:'Пипетка', copy:'Копировать', copiedMsg:'Скопировано ✓',
      note:'CMYK предназначен для печати и является лишь приближением — экранный цвет (RGB) может немного отличаться от напечатанного.',
      foot:'KOLKLI · Конвертер цвета · Быстро, просто и профессионального качества' }
  };

  const PRESETS = ['#000000','#FFFFFF','#7B34FF','#3F85FF','#E0447A','#22B04B','#F5A623','#0FA6AB','#EF4444','#111827'];

  let lang='he', t=I18N.he;
  let rgb = {r:123, g:52, b:255};

  // ---- conversions ----
  function clamp(v,a,b){ v=+v; if(isNaN(v)) v=0; return v<a?a:v>b?b:v; }
  function toInt(v,max){ return Math.round(clamp(v,0,max)); }
  function hexToRgb(hex){
    hex=String(hex).trim().replace(/^#/,'');
    if(/^[0-9a-f]{3}$/i.test(hex)) hex=hex.split('').map(c=>c+c).join('');
    if(!/^[0-9a-f]{6}$/i.test(hex)) return null;
    const n=parseInt(hex,16);
    return {r:(n>>16)&255, g:(n>>8)&255, b:n&255};
  }
  function rgbToHex(r,g,b){
    return '#'+[r,g,b].map(x=>toInt(x,255).toString(16).padStart(2,'0')).join('').toUpperCase();
  }
  function rgbToHsl(r,g,b){
    r/=255; g/=255; b/=255;
    const max=Math.max(r,g,b), min=Math.min(r,g,b);
    let h, s, l=(max+min)/2;
    if(max===min){ h=0; s=0; }
    else{
      const d=max-min;
      s = l>0.5 ? d/(2-max-min) : d/(max+min);
      if(max===r) h=(g-b)/d+(g<b?6:0);
      else if(max===g) h=(b-r)/d+2;
      else h=(r-g)/d+4;
      h/=6;
    }
    return {h:Math.round(h*360), s:Math.round(s*100), l:Math.round(l*100)};
  }
  function hslToRgb(h,s,l){
    h=((h%360)+360)%360/360; s=clamp(s,0,100)/100; l=clamp(l,0,100)/100;
    let r,g,b;
    if(s===0){ r=g=b=l; }
    else{
      const hue2rgb=(p,q,x)=>{ if(x<0)x+=1; if(x>1)x-=1;
        if(x<1/6)return p+(q-p)*6*x; if(x<1/2)return q; if(x<2/3)return p+(q-p)*(2/3-x)*6; return p; };
      const q = l<0.5 ? l*(1+s) : l+s-l*s;
      const p = 2*l-q;
      r=hue2rgb(p,q,h+1/3); g=hue2rgb(p,q,h); b=hue2rgb(p,q,h-1/3);
    }
    return {r:Math.round(r*255), g:Math.round(g*255), b:Math.round(b*255)};
  }
  function rgbToCmyk(r,g,b){
    r/=255; g/=255; b/=255;
    const k=1-Math.max(r,g,b);
    if(k>=1) return {c:0,m:0,y:0,k:100};
    return {
      c:Math.round((1-r-k)/(1-k)*100),
      m:Math.round((1-g-k)/(1-k)*100),
      y:Math.round((1-b-k)/(1-k)*100),
      k:Math.round(k*100)
    };
  }
  function cmykToRgb(c,m,y,k){
    c=clamp(c,0,100)/100; m=clamp(m,0,100)/100; y=clamp(y,0,100)/100; k=clamp(k,0,100)/100;
    return {
      r:Math.round(255*(1-c)*(1-k)),
      g:Math.round(255*(1-m)*(1-k)),
      b:Math.round(255*(1-y)*(1-k))
    };
  }
  function luminance(r,g,b){
    const a=[r,g,b].map(v=>{ v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); });
    return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2];
  }

  // ---- render ----
  function setVal(id,v,except){ if(id===except) return; const e=el(id); if(e && String(e.value)!==String(v)) e.value=v; }
  function render(except){
    const {r,g,b}=rgb;
    const hex=rgbToHex(r,g,b), hsl=rgbToHsl(r,g,b), cmyk=rgbToCmyk(r,g,b);
    const pv=el('preview');
    pv.style.background=hex;
    el('previewHex').textContent=hex;
    el('previewHex').style.color = luminance(r,g,b)>0.5 ? '#111' : '#fff';
    el('previewHex').style.background = luminance(r,g,b)>0.5 ? 'rgba(255,255,255,.5)' : 'rgba(0,0,0,.22)';
    // inputs (skip the one currently being edited)
    setVal('colorPick',hex,except);
    setVal('hexIn',hex.slice(1),except);
    setVal('hexIn2',hex.slice(1),except);
    setVal('rIn',r,except); setVal('gIn',g,except); setVal('bIn',b,except);
    setVal('hIn',hsl.h,except); setVal('sIn',hsl.s,except); setVal('lIn',hsl.l,except);
    setVal('cIn',cmyk.c,except); setVal('mIn',cmyk.m,except); setVal('yIn',cmyk.y,except); setVal('kIn',cmyk.k,except);
    // css strings
    el('hexStr').textContent=hex;
    el('rgbStr').textContent=`rgb(${r}, ${g}, ${b})`;
    el('hslStr').textContent=`hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;
    el('cmykStr').textContent=`cmyk(${cmyk.c}%, ${cmyk.m}%, ${cmyk.y}%, ${cmyk.k}%)`;
  }

  function toast(msg){ const e=el('toast'); e.textContent=msg; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),1700); }
  function copy(text){
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).catch(fallbackCopy.bind(null,text)); }
    else fallbackCopy(text);
    toast(t.copiedMsg);
  }
  function fallbackCopy(text){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(_){} document.body.removeChild(ta);
  }

  // ---- events ----
  el('colorPick').addEventListener('input',e=>{ const c=hexToRgb(e.target.value); if(c){ rgb=c; render('colorPick'); } });
  ['hexIn','hexIn2'].forEach(id=>{
    el(id).addEventListener('input',e=>{ const c=hexToRgb(e.target.value); if(c){ rgb=c; render(id); } });
    el(id).addEventListener('blur',()=>render());
  });
  function rgbHandler(id){ return ()=>{ rgb={ r:toInt(el('rIn').value,255), g:toInt(el('gIn').value,255), b:toInt(el('bIn').value,255) }; render(id); }; }
  ['rIn','gIn','bIn'].forEach(id=> el(id).addEventListener('input', rgbHandler(id)));
  function hslHandler(id){ return ()=>{ rgb=hslToRgb(el('hIn').value, el('sIn').value, el('lIn').value); render(id); }; }
  ['hIn','sIn','lIn'].forEach(id=> el(id).addEventListener('input', hslHandler(id)));
  function cmykHandler(id){ return ()=>{ rgb=cmykToRgb(el('cIn').value, el('mIn').value, el('yIn').value, el('kIn').value); render(id); }; }
  ['cIn','mIn','yIn','kIn'].forEach(id=> el(id).addEventListener('input', cmykHandler(id)));
  // re-normalize number fields on blur so out-of-range typing settles
  ['rIn','gIn','bIn','hIn','sIn','lIn','cIn','mIn','yIn','kIn'].forEach(id=> el(id).addEventListener('blur',()=>render()));

  el('randomBtn').addEventListener('click',()=>{
    rgb={ r:Math.floor(Math.random()*256), g:Math.floor(Math.random()*256), b:Math.floor(Math.random()*256) };
    render();
  });

  // Eyedropper (Chromium) — only shown when supported.
  if('EyeDropper' in window){
    const eb=el('eyedropBtn'); eb.classList.remove('hidden');
    eb.addEventListener('click',()=>{
      try{
        new window.EyeDropper().open().then(res=>{ const c=hexToRgb(res.sRGBHex); if(c){ rgb=c; render(); } }).catch(()=>{});
      }catch(_){}
    });
  }

  document.querySelectorAll('.copybtn').forEach(b=>{
    b.addEventListener('click',()=>{ const target=el(b.getAttribute('data-copy')); if(target) copy(target.textContent); });
  });

  // preset swatches
  el('swatches').innerHTML = PRESETS.map(h=>`<button type="button" data-h="${h}" style="background:${h}" title="${h}"></button>`).join('');
  el('swatches').addEventListener('click',e=>{ const b=e.target.closest('[data-h]'); if(!b) return; const c=hexToRgb(b.getAttribute('data-h')); if(c){ rgb=c; render(); } });

  // ---- i18n + theme ----
  function applyLang(l){
    if(!I18N[l]) l='en';
    lang=l; t=I18N[l];
    document.documentElement.lang=l; document.documentElement.dir=t.dir;
    document.querySelectorAll('[data-i18n]').forEach(n=>{ const k=n.getAttribute('data-i18n'); if(typeof t[k]==='string') n.textContent=t[k]; });
    try{ localStorage.setItem('ac_lang', l); }catch(_){}
  }
  function ls(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
  function detectLang(){
    const chosen=ls('ac_lang'); if(chosen) return chosen;
    const cc=ls('ac_country'); if(cc) return cc==='IL'?'he':'en';
    let tz=''; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(_){}
    const navHe=(navigator.language||'').toLowerCase().indexOf('he')===0;
    return (tz==='Asia/Jerusalem'||navHe)?'he':'en';
  }
  function applyTheme(th){
    const dark=(th==='dark');
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
    const ti=el('themeIco'); if(ti) ti.textContent = dark?'☀️':'🌙';
    try{ localStorage.setItem('theme', dark?'dark':'light'); }catch(_){}
  }
  window.__setLang=applyLang;
  const tb=el('themeToggle'); if(tb) tb.addEventListener('click',()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));

  // ---- init ----
  applyTheme(ls('theme')||'light');
  applyLang(detectLang());
  render();
})();
</script>
</body>
</html>
