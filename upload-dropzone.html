<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOLKLI — אזור העלאת קבצים</title>
<meta name="description" content="רכיב אזור העלאה (Dropzone) — גררו קבצים לכאן או לחצו לבחירה. RTL, מצב כהה, לכל סוגי הקבצים.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300..800&family=Overpass:wght@300..800&family=Rubik:wght@300..900&display=swap" rel="stylesheet">
<!-- theme boot: apply saved (or OS) theme before first paint -->
<script>try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<style>
/* ============================================================
   TOKENS — KOLKLI send-service purple, light + dark.
   ============================================================ */
:root{
  --bg:#f3f3fb; --panel:#ffffff; --panel-2:#f8f8fd; --line:#e8e8f4;
  --ink:#141330; --muted:#6f7196; --faint:#a1a3c4;

  --accent:#6d3bf5; --accent-2:#8b5cff; --accent-dim:#5a2ee0;
  --accent-soft:#efe9ff; --accent-line:#ded2ff;
  --grad:linear-gradient(135deg,#8a5cff 0%,#6a34f0 52%,#5b2fe0 100%);
  --glow:rgba(107,55,240,.34);

  --blue:#3f7bff; --blue-soft:#e9f0ff;
  --amber:#f59e0b; --amber-soft:#fff3dc;
  --green:#25b06a; --green-soft:#e3f7ec;

  --shadow-xs:0 1px 2px rgba(24,22,60,.05);
  --shadow-sm:0 2px 6px rgba(24,22,60,.05), 0 10px 24px rgba(24,22,60,.06);
  --shadow:0 6px 16px rgba(24,22,60,.07), 0 26px 60px rgba(24,22,60,.11);
  --shadow-lg:0 10px 24px rgba(24,22,60,.09), 0 40px 90px rgba(24,22,60,.16);
  --float:0 22px 40px -16px rgba(58,42,132,.45);
  --ring:0 0 0 4px rgba(109,59,245,.28);

  --sans:'Overpass','Rubik',system-ui,'Segoe UI',sans-serif;
  --mono:'Overpass',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
html[data-theme="dark"]{
  --bg:#0b0c13; --panel:#15161f; --panel-2:#1b1d29; --line:#282a3b;
  --ink:#eef0fa; --muted:#9195b6; --faint:#5f6280;

  --accent:#a483ff; --accent-2:#b79bff; --accent-dim:#8b5cff;
  --accent-soft:#241d3d; --accent-line:#3a2f63;
  --grad:linear-gradient(135deg,#9a72ff 0%,#7b45f5 52%,#6a34f0 100%);
  --glow:rgba(139,92,255,.4);

  --blue:#5b95f8; --blue-soft:#182338;
  --amber:#fbbf24; --amber-soft:#2c2413;
  --green:#37c26a; --green-soft:#12291c;

  --shadow-xs:0 1px 2px rgba(0,0,0,.4);
  --shadow-sm:0 2px 6px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.34);
  --shadow:0 6px 16px rgba(0,0,0,.45), 0 26px 62px rgba(0,0,0,.5);
  --shadow-lg:0 10px 24px rgba(0,0,0,.5), 0 40px 90px rgba(0,0,0,.62);
  --float:0 22px 40px -16px rgba(0,0,0,.7);
  --ring:0 0 0 4px rgba(164,131,255,.32);
}

/* ============================================================ BASE */
*{box-sizing:border-box;}
html,body{margin:0;min-height:100%;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 22px;
  transition:background-color .3s,color .3s;overflow-x:clip;}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(48% 40% at 84% -6%,rgba(124,77,255,.16),transparent 62%),
    radial-gradient(42% 36% at 8% 4%,rgba(63,123,255,.10),transparent 60%),
    radial-gradient(60% 46% at 50% 116%,rgba(139,92,255,.12),transparent 64%);}
button{font-family:inherit;}
svg{display:block;}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:12px;}

/* ============================================================ BUTTONS */
.btn{display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  font-family:var(--sans);font-weight:700;font-size:13.5px;line-height:1;white-space:nowrap;
  border:1px solid transparent;border-radius:13px;padding:11px 17px;
  transition:transform .1s,box-shadow .16s,border-color .16s,background .16s,color .16s,filter .16s;}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.btn:active{transform:translateY(1px) scale(.99);}
.btn-grad{color:#fff;border:none;position:relative;isolation:isolate;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--grad);
  text-shadow:0 1px 2px rgba(30,14,80,.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 5px rgba(40,16,90,.22),0 10px 22px var(--glow);}
.btn-grad::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;
  background:var(--grad);filter:blur(14px);opacity:.35;transition:opacity .2s;}
.btn-grad:hover{filter:brightness(1.06);}
.btn-grad:hover::after{opacity:.55;}
.btn-ghost{background:var(--panel);border-color:var(--line);color:var(--ink);box-shadow:var(--shadow-sm);}
.btn-ghost:hover{border-color:var(--accent-line);transform:translateY(-1px);box-shadow:var(--shadow-sm);}

/* ============================================================ SCENE + CARD */
.dz-scene{position:relative;width:min(1180px,100%);}

.dz-card{position:relative;overflow:hidden;border-radius:30px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent-soft) 26%,var(--panel)),var(--panel) 46%);
  border:1px solid var(--line);box-shadow:var(--shadow);
  min-height:300px;display:flex;align-items:center;justify-content:center;padding:34px;
  animation:rise .7s cubic-bezier(.2,.7,.2,1) both;
  transition:box-shadow .25s,border-color .2s,background .2s;}
.dz-card:hover{box-shadow:var(--shadow-lg);}
/* drag-over feedback: a dashed brand outline blooms in */
.dz-card.dragover{border-color:var(--accent);
  box-shadow:var(--shadow-lg),inset 0 0 0 2px var(--accent);
  background:linear-gradient(180deg,var(--accent-soft),var(--panel) 60%);}
.dz-card.dragover::after{content:"";position:absolute;inset:12px;border-radius:22px;
  border:2px dashed var(--accent);opacity:.6;pointer-events:none;}

/* ---- decoration: faint dot grid, top-right ---- */
.deco-dots{position:absolute;top:22px;right:26px;width:132px;height:70px;pointer-events:none;
  color:var(--faint);opacity:.5;
  -webkit-mask-image:linear-gradient(115deg,transparent,#000 70%);mask-image:linear-gradient(115deg,transparent,#000 70%);
  background-image:radial-gradient(currentColor 1.4px,transparent 1.6px);background-size:15px 15px;}
/* ---- decoration: partial brand circle, bottom-left ---- */
.deco-circle{position:absolute;bottom:-64px;left:-58px;width:172px;height:172px;border-radius:50%;
  pointer-events:none;background:var(--grad);opacity:.16;filter:blur(2px);}
html[data-theme="dark"] .deco-circle{opacity:.26;}

/* ---- top actions (files + folder) ---- */
.dz-actions{position:absolute;top:24px;left:28px;display:flex;gap:10px;z-index:5;}

/* ---- decorative paper plane, right side ---- */
.dz-plane{position:absolute;top:20%;right:36px;width:150px;height:110px;z-index:1;pointer-events:none;}
.dz-plane svg{width:100%;height:100%;overflow:visible;}
.dz-plane .p-trail{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;
  stroke-dasharray:5 9;opacity:.5;animation:dashFlow 1.5s linear infinite;}
.dz-plane .p-body{filter:drop-shadow(0 10px 14px rgba(58,42,132,.34));animation:planeBob 6s ease-in-out infinite;}

/* ============================================================ CENTER CORE */
.dz-core{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;text-align:center;max-width:31rem;}
.dz-orb{position:relative;width:112px;height:112px;border-radius:50%;background:var(--grad);cursor:pointer;
  display:flex;align-items:center;justify-content:center;margin-bottom:22px;border:none;
  box-shadow:0 18px 38px var(--glow),inset 0 2px 0 rgba(255,255,255,.55),inset 0 -10px 20px rgba(40,16,90,.26);
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s;animation:bob 6s ease-in-out infinite;}
.dz-orb::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--accent);
  opacity:0;animation:ring 2.8s ease-out infinite;}
.dz-orb svg{width:48px;height:48px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 2px 4px rgba(20,8,60,.3));}
.dz-orb .up{position:absolute;width:22px;height:22px;stroke-width:2.6;animation:upnudge 2.4s ease-in-out infinite;}
.dz-card:hover .dz-orb,.dz-orb:hover{transform:translateY(-3px) scale(1.045);
  box-shadow:0 24px 46px var(--glow),inset 0 2px 0 rgba(255,255,255,.55),inset 0 -10px 20px rgba(40,16,90,.26);}

.dz-core h2{font-size:clamp(20px,2vw,26px);font-weight:800;letter-spacing:-.02em;margin:0 0 8px;color:var(--ink);}
.dz-core .sub{font-size:clamp(14px,1.3vw,16px);color:var(--muted);margin:0;}
.dz-core .plan{margin:14px 0 0;font-size:13px;color:var(--faint);letter-spacing:.01em;}
.dz-core .plan b{color:var(--accent);font-weight:800;}
.dz-core .plan .n{direction:ltr;unicode-bidi:isolate;font-family:var(--mono);font-weight:700;}

/* ---- selected files tray ---- */
.dz-files{display:none;flex-wrap:wrap;gap:10px;justify-content:center;max-width:40rem;margin-top:8px;}
.dz-card.has-files .dz-files{display:flex;}
.dz-card.has-files .dz-core .sub,
.dz-card.has-files .dz-core .plan{display:none;}
.fchip{display:inline-flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:8px 10px 8px 12px;box-shadow:var(--shadow-xs);max-width:240px;
  animation:pop .28s cubic-bezier(.2,.8,.2,1) both;}
.fchip .fi{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:var(--accent-soft);color:var(--accent);}
.fchip .fi svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.fchip .ft{display:flex;flex-direction:column;min-width:0;text-align:start;}
.fchip .fn{font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext;}
.fchip .fs{font-size:11px;color:var(--faint);font-family:var(--mono);direction:ltr;text-align:start;}
.fchip .fx{width:20px;height:20px;border-radius:6px;border:none;background:transparent;color:var(--faint);cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .12s,color .12s;}
.fchip .fx:hover{background:var(--amber-soft);color:var(--amber);}
.fchip .fx svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;}

/* ============================================================ FLOATING FEATURE PILLS (left edge) */
.dz-feats{position:absolute;top:50%;left:-16px;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:16px;z-index:6;pointer-events:none;}
.pill{display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:700;color:var(--ink);
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 15px;
  box-shadow:var(--float);white-space:nowrap;animation:floatSm 6s ease-in-out infinite;}
.pill .pi{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.pill .pi svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;}
.pi-amber{background:var(--amber-soft);color:var(--amber);}
.pi-green{background:var(--green-soft);color:var(--green);}
.pi-blue{background:var(--blue-soft);color:var(--blue);}
/* gentle cascade + stagger, matching the reference */
.dz-feats .pill:nth-child(1){margin-left:6px;animation-delay:0s;}
.dz-feats .pill:nth-child(2){margin-left:24px;animation-delay:-1.4s;}
.dz-feats .pill:nth-child(3){margin-left:2px;animation-delay:-2.8s;}

/* ============================================================ KEYFRAMES */
@keyframes rise{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
@keyframes floatSm{0%,100%{translate:0 0;}50%{translate:0 -7px;}}
@keyframes planeBob{0%,100%{transform:translate(0,0) rotate(0);}50%{transform:translate(-6px,-10px) rotate(-5deg);}}
@keyframes dashFlow{to{stroke-dashoffset:-28;}}
@keyframes ring{0%{opacity:.5;transform:scale(.9);}80%,100%{opacity:0;transform:scale(1.22);}}
@keyframes upnudge{0%,100%{transform:translateY(2px);opacity:.6;}50%{transform:translateY(-4px);opacity:1;}}
@keyframes pop{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:none;}}

/* ============================================================ RESPONSIVE */
@media (max-width:820px){
  .dz-plane{display:none;}
  .dz-feats{position:static;transform:none;flex-direction:row;flex-wrap:wrap;justify-content:center;
    margin-top:20px;gap:10px;}
  .dz-feats .pill{margin:0!important;}
  .dz-scene{display:flex;flex-direction:column;}
}
@media (max-width:560px){
  .dz-actions{position:static;justify-content:center;margin-bottom:18px;}
  .dz-card{flex-direction:column;padding:26px 18px;}
  .deco-dots{display:none;}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
}
</style>
</head>
<body>

<div class="dz-scene">
  <div class="dz-card" id="dropzone">

    <!-- decorations -->
    <span class="deco-dots" aria-hidden="true"></span>
    <span class="deco-circle" aria-hidden="true"></span>

    <!-- top actions -->
    <div class="dz-actions">
      <button class="btn btn-grad" id="btnFiles" type="button">
        <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 18v-6M9 15h6"/></svg>
        הוספת קבצים
      </button>
      <button class="btn btn-ghost" id="btnFolder" type="button">
        <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        הוספת תיקייה
      </button>
    </div>

    <!-- decorative paper plane + dashed trail -->
    <div class="dz-plane" aria-hidden="true">
      <svg viewBox="0 0 150 110">
        <defs><linearGradient id="plg" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="var(--accent-2)"/><stop offset="1" stop-color="var(--accent-dim)"/>
        </linearGradient></defs>
        <path class="p-trail" d="M6 104C46 100 74 78 66 40"/>
        <g class="p-body" transform="translate(70 4)">
          <path d="M74 2 40 34" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M74 2 56 60 44 36 20 26z" fill="url(#plg)" stroke="var(--accent-dim)" stroke-width="1.4" stroke-linejoin="round"/>
        </g>
      </svg>
    </div>

    <!-- center core -->
    <div class="dz-core">
      <button class="dz-orb" id="dzOrb" type="button" aria-label="בחירת קבצים">
        <svg viewBox="0 0 24 24"><path d="M20 16.5A4.5 4.5 0 0 0 18 8h-1.26A7 7 0 1 0 5 15.5"/></svg>
        <svg class="up" viewBox="0 0 24 24"><path d="M12 19v-9"/><path d="M8.5 13.5 12 10l3.5 3.5"/></svg>
      </button>
      <h2 id="dzTitle">גררו קבצים לכאן או לחצי לבחירה</h2>
      <p class="sub">תומך בכל סוגי הקבצים</p>
      <p class="plan">עד <span class="n">368&nbsp;GB</span> להעלאה · תכנית <b>Free</b></p>
      <div class="dz-files" id="dzFiles"></div>
    </div>

  </div>

  <!-- floating feature pills (overflow the left edge) -->
  <div class="dz-feats" aria-hidden="true">
    <span class="pill"><span class="pi pi-amber"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg></span>מהיר</span>
    <span class="pill"><span class="pi pi-green"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>מאובטח</span>
    <span class="pill"><span class="pi pi-blue"><svg viewBox="0 0 24 24"><path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.6 2A4 4 0 0 0 6.5 19z"/></svg></span>ללא הגבלות</span>
  </div>
</div>

<!-- hidden inputs -->
<input type="file" id="fileInput" multiple hidden>
<input type="file" id="dirInput" webkitdirectory hidden>

<script>
/* ============================================================
   Dropzone — reusable upload component: file picker, folder
   picker, drag & drop, and a selected-files tray with per-file
   removal. Fully client-side; swap the `handleFiles` seam to POST.
   ============================================================ */
(function(){
  const $ = s => document.querySelector(s);
  const zone=$('#dropzone'), tray=$('#dzFiles'), title=$('#dzTitle');
  const fileInput=$('#fileInput'), dirInput=$('#dirInput');
  const DEFAULT_TITLE = title.textContent;
  let files=[];

  const FTYPE=[
    [/\.(mp3|wav|m4a|flac|aac|ogg)$/i,'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>'],
    [/\.(mp4|mov|mkv|avi|webm)$/i,'<rect x="2.5" y="6" width="14" height="12" rx="2.5"/><path d="M16.5 10l5-3v10l-5-3"/>'],
    [/\.(png|jpe?g|gif|webp|svg|heic)$/i,'<rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 16l-5-5-9 9"/>'],
    [/\.(pdf|docx?|txt|pptx?|xlsx?|zip|rar)$/i,'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>']
  ];
  const glyph=name=>{ for(const[re,g]of FTYPE) if(re.test(name)) return g;
    return '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>'; };
  const human=b=>{ if(b<1024)return b+' B'; const u=['KB','MB','GB','TB']; let i=-1;
    do{b/=1024;i++;}while(b>=1024&&i<u.length-1); return b.toFixed(b<10?1:0)+' '+u[i]; };

  function handleFiles(list){ for(const f of list) files.push(f); paint(); }
  function removeAt(i){ files.splice(i,1); paint(); }

  function paint(){
    tray.innerHTML='';
    files.slice(0,8).forEach((f,i)=>{
      const chip=document.createElement('div'); chip.className='fchip'; chip.style.animationDelay=(i*.03)+'s';
      chip.innerHTML=
        `<span class="fi"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">${glyph(f.name)}</svg></span>`+
        `<span class="ft"><span class="fn">${f.name.replace(/</g,'&lt;')}</span><span class="fs">${human(f.size)}</span></span>`+
        `<button class="fx" type="button" aria-label="הסרה"><svg viewBox="0 0 24 24" fill="none"><path d="M18 6 6 18M6 6l12 12"/></svg></button>`;
      chip.querySelector('.fx').addEventListener('click',()=>removeAt(i));
      tray.appendChild(chip);
    });
    if(files.length>8){
      const more=document.createElement('div'); more.className='fchip'; more.style.padding='8px 14px';
      more.innerHTML=`<span class="fn">+${files.length-8}</span>`;
      tray.appendChild(more);
    }
    zone.classList.toggle('has-files', files.length>0);
    if(files.length){
      const total=files.reduce((s,f)=>s+f.size,0);
      title.textContent=`נבחרו ${files.length} קבצים · ${human(total)}`;
    } else {
      title.textContent=DEFAULT_TITLE;
    }
  }

  // wiring
  $('#btnFiles').addEventListener('click',()=>fileInput.click());
  $('#dzOrb').addEventListener('click',()=>fileInput.click());
  $('#btnFolder').addEventListener('click',()=>dirInput.click());
  fileInput.addEventListener('change',e=>{ handleFiles(e.target.files); fileInput.value=''; });
  dirInput.addEventListener('change',e=>{ handleFiles(e.target.files); dirInput.value=''; });

  ['dragenter','dragover'].forEach(ev=>zone.addEventListener(ev,e=>{ e.preventDefault(); zone.classList.add('dragover'); }));
  ['dragleave','drop'].forEach(ev=>zone.addEventListener(ev,e=>{ e.preventDefault();
    if(ev==='drop'||!zone.contains(e.relatedTarget)) zone.classList.remove('dragover'); }));
  zone.addEventListener('drop',e=>{ if(e.dataTransfer&&e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });

  // preview state: ?demo shows a filled tray
  if(/[?&]demo/.test(location.search)){
    const mk=(name,size)=>{ const f=new File(['x'],name); try{Object.defineProperty(f,'size',{value:size});}catch(e){} return f; };
    handleFiles([mk('meeting-recording.mp4',734003200),mk('brand-assets.zip',52428800),mk('cover-art.jpg',3145728)]);
  }
})();
</script>
</body>
</html>
