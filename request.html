<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOLKLI — Kolkli Request</title>
<meta name="description" content="Create upload links and receive files directly from your clients into an organized folder.">
<style>
  :root {
    --bg:#eef0f6; --panel:#ffffff; --panel-2:#f5f6fa; --line:#e5e8f0; --line-2:#eef0f6;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#7c3aed; --accent-dim:#6a2fe0; --accent-ink:#ffffff; --accent-soft:#efe9fe;
    --success:#22b04b; --success-dim:#1c9a41; --success-soft:#e6f6ec;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --danger:#e5484d; --danger-soft:#fdecec;
    --warm-soft:#fff5da; --warm-line:#f2d98a;
    --ok:#22b04b; --warn:#c88a04; --err:#e5484d;
    --grad:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-h:linear-gradient(105deg,#6a29e6 0%,#2f74f0 100%);
    --grad-soft:linear-gradient(120deg,#efe9fe,#e6f0ff);
    --grad-shadow:rgba(93,79,240,0.30);
    --grad-btn:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn-glow:rgba(59,111,246,0.38);
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-lg:0 2px 6px rgba(20,24,44,0.05), 0 20px 50px rgba(20,24,44,0.10);
    --shadow-sm:0 1px 2px rgba(20,24,44,0.05);
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --sans:'Space Grotesk',system-ui,'Segoe UI','Heebo',sans-serif;
  }
  html[data-theme="dark"] {
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a303c; --line-2:#232833;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --accent:#a06bff; --accent-dim:#7c3aed; --accent-ink:#ffffff; --accent-soft:#241a3a;
    --success:#37c26a; --success-dim:#2fae5e; --success-soft:#132a1c;
    --info:#5b95f8; --info-dim:#4f8ef7; --info-soft:#182338;
    --danger:#ff6b6b; --danger-soft:#2a1719;
    --warm-soft:#2c2718; --warm-line:#5a4d24;
    --ok:#4ec98a; --warn:#e8b84b; --err:#ff6b6b;
    --grad:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-h:linear-gradient(105deg,#9a63ff 0%,#6aa2ff 100%);
    --grad-soft:linear-gradient(120deg,#1c1633,#11242a);
    --grad-shadow:rgba(77,123,255,0.42);
    --grad-btn:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn-glow:rgba(77,123,255,0.45);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,0.45), 0 24px 60px rgba(0,0,0,0.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;}
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:var(--grad);z-index:100;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--sans);}
  .wrap{width:100%;max-width:none;margin:0 auto;padding:16px 0 18px;}
  @media (max-width:840px){ .wrap{width:100%;max-width:none;padding:18px 14px 48px;} }

  /* page intro */
  .pagehead{text-align:center;margin:0 auto 12px;}
  .pagehead h2{font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:-0.02em;margin:0 0 6px;}
  .pagehead .kick{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);
    padding:4px 11px;border-radius:999px;margin-bottom:11px;}
  .pagehead p{font-size:14.5px;color:var(--muted);margin:0 auto;max-width:70ch;}

  /* tabs */
  .tabs{display:flex;width:max-content;max-width:100%;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin:0 auto 14px;box-shadow:var(--shadow-sm);}
  .tab{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border:none;border-radius:9px;background:transparent;
    color:var(--muted);cursor:pointer;font-size:13.5px;font-weight:600;transition:color .14s,background .14s,box-shadow .14s;}
  .tab.on{background:var(--accent-soft);color:var(--accent-dim);box-shadow:var(--shadow-sm);}
  .tab svg{width:16px;height:16px;}
  .tab .count{font-family:var(--mono);font-size:11px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--muted);}
  .tab.on .count{background:var(--panel);color:var(--accent-dim);}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,340px);gap:16px;align-items:start;}
  @media (max-width:840px){ .grid{grid-template-columns:1fr;} }
  .col{min-width:0;}
  .hidden{display:none !important;}

  /* form */
  .form{padding:20px;}
  .form h3{font-size:15px;margin:0 0 16px;font-weight:700;}
  .opt{margin-bottom:16px;}
  .opt > label,.optlbl{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:7px;}
  .optlbl .req{color:var(--danger);}
  .hint{font-size:12px;color:var(--faint);margin-top:6px;}
  .inp,.ta{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;
    font-family:var(--sans);font-size:13.5px;padding:10px 12px;transition:border-color .12s,box-shadow .12s;}
  .inp:focus,.ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .ta{resize:vertical;min-height:64px;}
  .inp[dir=ltr]{text-align:start;}
  select.inp{cursor:pointer;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:520px){ .two{grid-template-columns:1fr;} }
  .chkline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);cursor:pointer;margin-bottom:8px;}
  .chkline input{accent-color:var(--accent);width:15px;height:15px;}

  /* type toggle chips */
  .typechips{display:flex;flex-wrap:wrap;gap:8px;}
  .tchip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;
    background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;transition:all .12s;user-select:none;}
  .tchip svg{width:15px;height:15px;}
  .tchip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-dim);}

  .primary{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:9px;color:#fff;border:none;cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:600;font-size:15px;padding:13px 20px;border-radius:999px;text-shadow:0 1px 2px rgba(0,0,0,.18);margin-top:4px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.14),0 8px 20px var(--grad-btn-glow);
    transition:filter .14s,transform .08s;}
  .primary:hover{filter:brightness(1.05);} .primary:active{transform:translateY(1px);}
  .primary:disabled{opacity:.5;cursor:not-allowed;filter:none;transform:none;}
  .primary svg{width:17px;height:17px;}
  .opterr{font-size:11.5px;color:var(--danger);margin-top:8px;min-height:14px;text-align:center;}

  /* live client preview */
  .side{padding:18px;position:sticky;top:16px;}
  .side .plabel{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:10px;}
  .pvcard{border:1px solid var(--line-2);border-radius:14px;overflow:hidden;background:var(--panel-2);}
  .pvcard .pv-top{background:var(--grad-soft);padding:16px;text-align:center;border-bottom:1px solid var(--line-2);}
  .pvcard .pv-ava{width:46px;height:46px;margin:0 auto 10px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:#fff;color:var(--accent);box-shadow:var(--shadow-sm);}
  .pvcard .pv-ava svg{width:23px;height:23px;}
  .pvcard .pv-name{font-size:16px;font-weight:700;color:var(--ink);word-break:break-word;}
  .pvcard .pv-desc{font-size:13px;color:var(--muted);margin-top:4px;white-space:pre-wrap;word-break:break-word;}
  .pvcard .pv-body{padding:14px;}
  .pvcard .pv-drop{border:1.4px dashed var(--line);border-radius:11px;padding:18px;text-align:center;color:var(--faint);font-size:13px;background:var(--panel);}
  .pvcard .pv-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}

  /* chips */
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-family:var(--mono);color:var(--muted);
    background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;}
  .chip svg{width:13px;height:13px;color:var(--accent);}
  .chip.warn{background:var(--warm-soft);border-color:var(--warm-line);color:var(--warn);}
  .chip.warn svg{color:var(--warn);}

  @media (min-width:841px){
    .wrap{padding-top:8px;padding-bottom:8px;}
    .pagehead{margin-bottom:12px;}
    .pagehead .kick{font-size:11.5px;padding:4px 10px;margin-bottom:8px;}
    .pagehead h2{font-size:clamp(23px,2.5vw,30px);margin-bottom:4px;}
    .pagehead p{font-size:14.5px;line-height:1.4;max-width:60ch;}
    .tabs{margin-bottom:14px;}
    .tab{height:38px;padding:0 15px;font-size:13.5px;}
    .grid{grid-template-columns:minmax(0,1fr) minmax(260px,320px);gap:14px;}
    .form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 12px;padding:16px;}
    .form h3{grid-column:1/-1;margin:0;font-size:15.5px;}
    .form > .opt{margin-bottom:0;}
    .form > .opt:nth-child(2),
    .form > .opt:nth-child(3),
    .form > .opt:nth-child(4),
    .form > .opt:nth-child(5),
    .form > .opt:nth-child(9){grid-column:span 2;}
    .form > .opt:nth-child(10){align-self:end;}
    .form > .two{grid-column:span 2;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 10px;}
    .form > .two .opt{margin-bottom:0;}
    .opt > label,.optlbl{font-size:13.5px;margin-bottom:5px;}
    .inp,.ta{padding:9px 12px;font-size:14px;}
    .ta{min-height:48px;}
    .hint{margin-top:4px;line-height:1.3;}
    .typechips{gap:7px;}
    .tchip{padding:6px 11px;font-size:13px;}
    .chkline{margin-bottom:0;}
    .primary{grid-column:1/-1;justify-self:center;width:min(480px,100%);align-self:center;min-height:44px;padding:12px 24px;margin-top:6px;font-size:15.5px;}
    .opterr{grid-column:1/-1;margin-top:2px;align-self:center;}
    .side{position:static;padding:14px;}
    .side .plabel{margin-bottom:7px;}
    .pvcard .pv-top{padding:12px;}
    .pvcard .pv-ava{width:38px;height:38px;margin-bottom:7px;}
    .pvcard .pv-body{padding:11px;}
    .pvcard .pv-drop{padding:12px;}
    .pvcard .pv-chips{margin-top:9px;}
    #createView:not(.hidden) ~ footer{display:none;}
  }

  @media (min-width:841px) and (max-width:1099px){
    .form{grid-template-columns:repeat(3,minmax(0,1fr));}
    .form > .opt:nth-child(2),
    .form > .opt:nth-child(4),
    .form > .opt:nth-child(8),
    .form > .opt:nth-child(10){grid-column:span 1;}
    .form > .two{grid-column:1/-1;}
    .opterr{grid-column:1/-1;}
  }

  @media (min-width:1100px) and (min-height:760px){
    .wrap{padding-top:12px;padding-bottom:12px;}
    .pagehead{margin-bottom:14px;}
    .pagehead .kick{font-size:12px;padding:4px 11px;margin-bottom:9px;}
    .pagehead h2{font-size:clamp(26px,2.7vw,34px);margin-bottom:6px;}
    .pagehead p{font-size:15.5px;line-height:1.5;max-width:64ch;}
    .tabs{margin-bottom:16px;}
    .tab{height:40px;padding:0 17px;font-size:14.5px;}
    .grid{grid-template-columns:minmax(0,1fr) minmax(310px,380px);gap:16px;}
    .form{gap:12px 16px;padding:20px;}
    .form h3{font-size:17px;}
    .opt > label,.optlbl{font-size:14.5px;margin-bottom:6px;}
    .inp,.ta{font-size:15px;padding:10px 13px;}
    .ta{min-height:56px;}
    .typechips{gap:8px;}
    .tchip{padding:7px 13px;font-size:13.5px;}
    .primary{min-height:48px;padding:13px 26px;font-size:16.5px;}
    .side{padding:16px;}
    .pvcard .pv-top{padding:15px;}
    .pvcard .pv-ava{width:44px;height:44px;margin-bottom:8px;}
    .pvcard .pv-body{padding:13px;}
    .pvcard .pv-drop{padding:16px;}
    .pvcard .pv-chips{margin-top:11px;}
  }

  /* share panel */
  .share{padding:22px;display:none;}
  .share.show{display:block;}
  .share .ok{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    background:var(--success-soft);color:var(--success-dim);}
  .share .ok svg{width:28px;height:28px;}
  .share h3{text-align:center;font-size:19px;margin:0 0 4px;}
  .share .subt{text-align:center;font-size:13px;color:var(--muted);margin:0 0 18px;}
  .linkrow{display:flex;gap:8px;margin-bottom:14px;}
  .linkrow .lk{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;
    font-family:var(--mono);font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;}
  .copybtn{flex-shrink:0;display:inline-flex;align-items:center;gap:7px;color:#fff;border:none;cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:600;font-size:13px;padding:0 16px;border-radius:10px;text-shadow:0 1px 2px rgba(0,0,0,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 12px var(--grad-btn-glow);transition:filter .14s;}
  .copybtn:hover{filter:brightness(1.05);} .copybtn svg{width:15px;height:15px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px;}
  .qrwrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:0 0 18px;}
  .qrbox{width:172px;height:172px;padding:10px;border-radius:14px;background:#fff;border:1px solid var(--line);
    box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;}
  .qrbox img{width:100%;height:100%;image-rendering:pixelated;display:block;}
  .qrdl{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--accent-dim);
    background:var(--accent-soft);border:1px solid transparent;border-radius:999px;padding:7px 14px;cursor:pointer;transition:filter .12s;}
  .qrdl:hover{filter:brightness(0.97);} .qrdl svg{width:14px;height:14px;}
  .row2{display:flex;gap:10px;flex-wrap:wrap;}
  .row2 a,.row2 button{flex:1;min-width:130px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 16px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid var(--line);
    background:var(--panel);color:var(--ink-2);transition:border-color .12s,transform .08s;box-shadow:var(--shadow-sm);}
  .row2 a:hover,.row2 button:hover{border-color:var(--accent);} .row2 *:active{transform:translateY(1px);}
  .row2 svg{width:15px;height:15px;}
  .row2 .wa{color:#1c9a41;} .row2 .wa svg{color:#25d366;}
  .seam{display:flex;align-items:flex-start;gap:8px;margin-top:16px;padding:11px 13px;border-radius:11px;
    background:var(--warm-soft);border:1px solid var(--warm-line);font-size:11.5px;color:var(--ink-2);line-height:1.55;}
  .seam svg{width:15px;height:15px;color:var(--warn);flex-shrink:0;margin-top:1px;}

  /* manage view */
  .mgbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;padding:0 14px;flex-wrap:wrap;}
  .mgbar h3{font-size:17px;margin:0;font-weight:700;}
  .btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink-2);cursor:pointer;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-sm);transition:border-color .12s,transform .08s;}
  .btn:hover{border-color:var(--accent);} .btn:active{transform:translateY(1px);} .btn svg{width:16px;height:16px;}
  .btn.grad{color:#fff;border:none;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--grad-btn);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 16px var(--grad-btn-glow);}

  .reqlist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:0 14px;}
  .rcard{display:flex;flex-direction:column;align-items:stretch;gap:18px;min-height:244px;padding:18px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;box-shadow:var(--shadow-sm);}
  .rcard.unseen{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .rc-main{flex:1;min-width:0;}
  .rc-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px;}
  .rc-name{font-size:17px;font-weight:800;color:var(--ink);line-height:1.25;word-break:break-word;}
  .badge{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;}
  .badge.b-active{background:var(--success-soft);color:var(--success-dim);}
  .badge.b-expired{background:var(--warm-soft);color:var(--warn);}
  .badge.b-closed{background:var(--panel-2);color:var(--faint);border:1px solid var(--line);}
  .newbadge{font-family:var(--mono);font-size:10px;font-weight:700;background:var(--grad);color:#fff;padding:3px 9px;border-radius:999px;}
  .rc-meta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;}
  .rc-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:auto;}
  .minibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--ink-2);cursor:pointer;font-size:12.5px;font-weight:600;transition:all .12s;}
  .minibtn.go{grid-column:1/-1;}
  .minibtn:hover{border-color:var(--accent);color:var(--accent-dim);} .minibtn svg{width:14px;height:14px;}
  .minibtn.danger:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft);}
  .minibtn.go{color:var(--accent-dim);border-color:var(--accent);background:var(--accent-soft);}

  @media (max-width:1020px){
    .reqlist{grid-template-columns:repeat(2,minmax(0,1fr));}
  }
  @media (max-width:640px){
    .reqlist{grid-template-columns:1fr;}
    .rcard{min-height:0;}
    .rc-actions{grid-template-columns:1fr;}
  }
  @media (max-width:840px){
    .mgbar,.reqlist{padding-inline:0;}
  }

  .empty{text-align:center;padding:48px 20px;color:var(--muted);}
  .empty .ei{width:66px;height:66px;margin:0 auto 16px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);}
  .empty .ei svg{width:32px;height:32px;} .empty h3{font-size:18px;color:var(--ink);margin:0 0 6px;} .empty p{margin:0 auto 18px;max-width:42ch;font-size:14px;}

  /* received view */
  .rvhead{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .backbtn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink-2);cursor:pointer;font-size:13px;font-weight:600;box-shadow:var(--shadow-sm);}
  .backbtn:hover{border-color:var(--accent);} .backbtn svg{width:15px;height:15px;}
  .rvhead h3{font-size:18px;margin:0;font-weight:700;flex:1;min-width:150px;}
  .rvtools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .filterchips{display:flex;gap:6px;flex-wrap:wrap;}
  .fchip{font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;transition:all .12s;}
  .fchip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-dim);}
  .sortsel{height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);font-size:12.5px;font-family:var(--sans);cursor:pointer;}

  .subgroup{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);margin-bottom:14px;overflow:hidden;}
  .sg-head{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-2);background:var(--panel-2);flex-wrap:wrap;}
  .sg-ava{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--grad);color:#fff;font-weight:700;font-size:15px;}
  .sg-id{flex:1;min-width:160px;}
  .sg-name{font-size:14.5px;font-weight:700;color:var(--ink);}
  .sg-when{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:2px;}
  .sg-contact{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .sg-note{font-size:12.5px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line-2);border-radius:9px;padding:8px 11px;margin-top:9px;width:100%;white-space:pre-wrap;word-break:break-word;}
  .sg-files{display:flex;flex-direction:column;max-height:340px;overflow-y:auto;overscroll-behavior:contain;}
  .sg-files::-webkit-scrollbar{width:10px;}
  .sg-files::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:999px;border:3px solid var(--panel);}
  .sg-files::-webkit-scrollbar-thumb:hover{background:var(--muted);}
  .frow{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line-2);}
  .frow:first-child{border-top:none;}
  .frow .newdot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;box-shadow:0 0 0 3px var(--accent-soft);}
  .frow .newdot.ph{background:transparent;box-shadow:none;}
  .frow .fico{width:38px;height:38px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);overflow:hidden;cursor:pointer;}
  .frow .fico.image{color:var(--info);background:var(--info-soft);} .frow .fico.video{color:#e5484d;background:var(--danger-soft);}
  .frow .fico.doc{color:var(--info-dim);background:var(--info-soft);}
  .frow .fico img{width:100%;height:100%;object-fit:cover;} .frow .fico svg{width:18px;height:18px;}
  .frow .fn{flex:1;min-width:0;}
  .frow .fn .nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .frow .fn .sz{font-family:var(--mono);font-size:11px;color:var(--faint);}
  .frow .act{display:flex;gap:6px;flex-shrink:0;}
  .frow .act button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;}
  .frow .act button:hover{border-color:var(--accent);color:var(--accent);}
  .frow .act button.del:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft);}
  .frow .act svg{width:16px;height:16px;}

  /* preview modal */
  .pv{position:fixed;inset:0;background:rgba(6,8,16,.86);display:none;flex-direction:column;z-index:180;}
  .pv.show{display:flex;}
  .pvbar{display:flex;align-items:center;gap:12px;padding:14px 18px;color:#fff;}
  .pvbar .pvt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:14.5px;}
  .pvbar button{background:rgba(255,255,255,.12);border:none;color:#fff;cursor:pointer;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;}
  .pvbody{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 20px 26px;min-height:0;}
  .pvbody img,.pvbody video{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;}
  .pvbody iframe{width:min(760px,100%);height:100%;border:none;border-radius:8px;background:#fff;}
  .pvbody audio{width:min(520px,100%);}

  /* confirm dialog */
  .cf{position:fixed;inset:0;background:rgba(10,12,22,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;z-index:210;padding:20px;opacity:0;transition:opacity .16s ease;}
  .cf.show{display:flex;opacity:1;}
  .cf-box{width:100%;max-width:404px;background:var(--panel);border:1px solid var(--line);border-radius:18px;
    box-shadow:var(--shadow-lg);padding:26px 24px 22px;text-align:center;
    transform:translateY(10px) scale(.97);transition:transform .2s cubic-bezier(.2,.9,.3,1);}
  .cf.show .cf-box{transform:none;}
  .cf-ico{width:54px;height:54px;margin:0 auto 15px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    background:var(--danger-soft);color:var(--danger);}
  .cf-ico.warn{background:var(--warm-soft);color:var(--warn);}
  .cf-ico svg{width:26px;height:26px;}
  .cf-box h3{font-size:18.5px;font-weight:700;margin:0 0 8px;color:var(--ink);letter-spacing:-.01em;}
  .cf-box p{font-size:13.5px;color:var(--muted);margin:0 0 22px;line-height:1.6;}
  .cf-actions{display:flex;gap:10px;}
  .cf-actions button{flex:1;height:44px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;
    font-family:var(--sans);transition:filter .12s,border-color .12s,transform .08s;}
  .cf-actions button:active{transform:translateY(1px);}
  .cf-cancel{background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2);}
  .cf-cancel:hover{border-color:var(--accent);color:var(--accent-dim);}
  .cf-confirm{border:none;color:#fff;background:var(--danger);box-shadow:0 6px 16px rgba(229,72,77,.30);}
  .cf-confirm:hover{filter:brightness(1.05);}
  .cf-confirm.warn{background:var(--warn);box-shadow:0 6px 16px rgba(200,138,4,.28);}

  footer{margin-top:34px;text-align:center;color:var(--faint);font-size:12px;font-family:var(--mono);}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:11px 18px;border-radius:999px;
    box-shadow:var(--shadow-lg);transition:opacity .2s,transform .2s;z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ===== received: summary card ===== */
  .rvhead{margin-bottom:14px;}
  .rvsum{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,300px);overflow:hidden;margin-bottom:14px;}
  @media(max-width:720px){ .rvsum{grid-template-columns:1fr;} }
  .rvsum .sum-l{padding:18px 20px;min-width:0;}
  .rvsum .sum-r{padding:18px 20px;background:var(--panel-2);border-inline-start:1px solid var(--line-2);}
  @media(max-width:720px){ .rvsum .sum-r{border-inline-start:none;border-top:1px solid var(--line-2);} }
  .sum-title{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:13px;}
  .sum-title svg{width:14px;height:14px;color:var(--accent);}
  .sum-row{display:flex;align-items:center;gap:12px;font-size:13px;padding:5px 0;}
  .sum-row .k{display:inline-flex;align-items:center;gap:7px;color:var(--muted);flex-shrink:0;min-width:104px;}
  .sum-row .k svg{width:14px;height:14px;color:var(--accent);flex-shrink:0;}
  .sum-row .v{color:var(--ink);font-weight:600;word-break:break-word;min-width:0;}
  .sum-more{font-weight:600;font-size:11px;color:var(--accent-dim);background:var(--accent-soft);padding:2px 8px;border-radius:999px;margin-inline-start:4px;white-space:nowrap;}
  .sum-badge{margin-bottom:9px;}

  /* ===== received: panel ===== */
  .rvpanel{padding:16px 18px 18px;}
  .rvp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:15px;}
  .rvp-name{font-size:18px;font-weight:800;color:var(--ink);letter-spacing:-.01em;word-break:break-word;}
  .rvp-id{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:3px;}
  .rvp-ico{width:40px;height:40px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);}
  .rvp-ico svg{width:19px;height:19px;}
  .rvpanel .rvtools{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;margin-bottom:14px;}
  .rvtools-r{display:flex;align-items:center;gap:8px;margin-inline-start:auto;flex-wrap:wrap;}
  .rvsearch{display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);min-width:170px;flex:1;}
  .rvsearch svg{width:15px;height:15px;color:var(--faint);flex-shrink:0;}
  .rvsearch input{border:none;background:transparent;outline:none;font-family:var(--sans);font-size:13px;color:var(--ink);width:100%;min-width:0;}
  .viewtoggle{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex-shrink:0;}
  .viewtoggle button{width:34px;height:28px;border:none;background:transparent;border-radius:7px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s,box-shadow .12s;}
  .viewtoggle button svg{width:16px;height:16px;}
  .viewtoggle button.on{background:var(--panel);color:var(--accent-dim);box-shadow:var(--shadow-sm);}
  .viewtoggle button:hover:not(.on){color:var(--ink-2);}

  /* ===== received: list / table ===== */
  .ftbl-wrap{overflow-x:auto;}
  .ftbl{width:100%;border-collapse:collapse;font-size:13px;}
  .ftbl col.cg-name{width:44%;} .ftbl col.cg-act{width:1%;}
  .ftbl th{text-align:start;font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
  .ftbl td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle;}
  .ftbl tbody tr:last-child td{border-bottom:none;}
  .ftbl tr.frw:hover td{background:var(--panel-2);}
  .ftbl tr.frw.hide{display:none;}
  .ftbl .c-mono{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;}
  .ftbl .c-act{width:1%;white-space:nowrap;}
  .ftbl tr.grp td{background:var(--panel-2);cursor:pointer;padding:8px 12px;border-bottom:1px solid var(--line-2);}
  .ftbl tr.grp:hover td{background:var(--line-2);}
  .grp-c{display:flex;align-items:center;gap:10px;}
  .grp-chev{display:inline-flex;color:var(--muted);transition:transform .15s;}
  .grp-chev svg{width:16px;height:16px;}
  .grp.collapsed .grp-chev{transform:rotate(-90deg);}
  .grp-fico{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--grad);color:#fff;}
  .grp-fico svg{width:15px;height:15px;}
  .grp-nm{font-size:13.5px;font-weight:700;color:var(--ink);}
  .grp-count{margin-inline-start:auto;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-dim);white-space:nowrap;}
  .ft-file{display:flex;align-items:center;gap:11px;min-width:0;}
  .ft-ico{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);overflow:hidden;cursor:pointer;}
  .ft-ico.image{color:var(--info);background:var(--info-soft);}
  .ft-ico.video{color:var(--danger);background:var(--danger-soft);}
  .ft-ico.doc{color:var(--info-dim);background:var(--info-soft);}
  .ft-ico img{width:100%;height:100%;object-fit:cover;}
  .ft-ico svg{width:17px;height:17px;}
  .ft-nm{min-width:0;display:flex;align-items:center;flex-wrap:wrap;}
  .ft-nm .t{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
  .new-tag{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--grad);color:#fff;padding:2px 7px;border-radius:999px;margin-inline-start:8px;}
  .kbadge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap;}
  .kbadge.image{color:var(--info);background:var(--info-soft);border-color:transparent;}
  .kbadge.video{color:var(--danger);background:var(--danger-soft);border-color:transparent;}
  .kbadge.audio{color:var(--accent-dim);background:var(--accent-soft);border-color:transparent;}
  .kbadge.doc{color:var(--info-dim);background:var(--info-soft);border-color:transparent;}
  .kbadge.other{color:var(--muted);background:var(--panel-2);border-color:var(--line);}
  .upbadge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--success-soft);color:var(--success-dim);white-space:nowrap;}
  .upbadge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
  .ft-act{display:flex;gap:6px;}
  .ft-act button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .12s,color .12s,background .12s;}
  .ft-act button:hover{border-color:var(--accent);color:var(--accent);}
  .ft-act button.del:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft);}
  .ft-act svg{width:15px;height:15px;}

  /* ===== received: grid (thumbnails) ===== */
  .fgrid-group{margin-bottom:20px;}
  .fgrid-group:last-child{margin-bottom:0;}
  .fg-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:9px;border-bottom:1px solid var(--line-2);}
  .fg-ava{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--grad);color:#fff;font-weight:700;font-size:13px;}
  .fg-nm{font-weight:700;font-size:14px;color:var(--ink);}
  .fg-count{margin-inline-start:auto;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-dim);}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .gcard{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);cursor:pointer;transition:border-color .12s,box-shadow .12s,transform .08s;}
  .gcard:hover{border-color:var(--accent);box-shadow:var(--shadow-sm);}
  .gcard:active{transform:translateY(1px);}
  .gcard.isnew{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
  .gc-thumb{position:relative;aspect-ratio:4/3;background:var(--panel-2);display:flex;align-items:center;justify-content:center;color:var(--faint);overflow:hidden;}
  .gc-thumb.image{color:var(--info);} .gc-thumb.video{color:var(--danger);} .gc-thumb.audio{color:var(--accent);}
  .gc-thumb img,.gc-thumb video{width:100%;height:100%;object-fit:cover;display:block;}
  .gc-thumb .ph{display:flex;}
  .gc-thumb .ph svg{width:38px;height:38px;}
  .gc-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
  .gc-play svg{width:34px;height:34px;color:#fff;filter:drop-shadow(0 2px 6px rgba(0,0,0,.55));}
  .gc-body{padding:9px 11px;}
  .gc-nm{font-size:12.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .gc-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px;}
  .gc-act{position:absolute;top:7px;inset-inline-end:7px;display:flex;gap:5px;opacity:0;transition:opacity .12s;}
  .gcard:hover .gc-act,.gcard:focus-within .gc-act{opacity:1;}
  .gc-act button{width:28px;height:28px;border-radius:7px;border:none;background:rgba(15,18,32,.62);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);}
  .gc-act button:hover{background:rgba(15,18,32,.85);}
  .gc-act button.del:hover{background:var(--danger);}
  .gc-act svg{width:14px;height:14px;}

  /* ===== received: no results ===== */
  .nores{text-align:center;padding:40px 20px;color:var(--muted);}
  .nores svg{width:30px;height:30px;color:var(--faint);margin-bottom:10px;}
  .nores p{margin:0;font-size:14px;}
</style>

<body>
<div id="site-header"></div>
<script src="./header.js"></script>
<div class="wrap">

  <div class="pagehead">
    <span class="kick" data-i18n="kick"></span>
    <h2 data-i18n="pageTitle"></h2>
    <p data-i18n="pageSub"></p>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab" id="tabManage" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
      <span data-i18n="tabManage"></span>
      <span class="count" id="mgCount">0</span>
    </button>
    <button class="tab on" id="tabCreate" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      <span data-i18n="tabCreate"></span>
    </button>
  </div>

  <!-- ============ CREATE ============ -->
  <div id="createView">
    <div class="grid" id="createGrid">
      <div class="col">
        <div class="card form">
          <h3 data-i18n="formTitle"></h3>

          <div class="opt">
            <div class="optlbl"><span data-i18n="fName"></span> <span class="req">*</span></div>
            <input class="inp" id="fName" type="text" data-i18n-ph="fNamePh">
          </div>

          <div class="opt">
            <div class="optlbl" data-i18n="fDesc"></div>
            <textarea class="ta" id="fDesc" data-i18n-ph="fDescPh"></textarea>
          </div>

          <div class="opt">
            <div class="optlbl" data-i18n="fFolder"></div>
            <select class="inp" id="fFolder"></select>
            <input class="inp hidden" id="fNewFolder" type="text" data-i18n-ph="fNewFolderPh" style="margin-top:8px">
          </div>

          <div class="opt">
            <div class="optlbl" data-i18n="fTypes"></div>
            <div class="typechips" id="fTypes"></div>
            <div class="hint" data-i18n="fTypesHint"></div>
          </div>

          <div class="two">
            <div class="opt">
              <div class="optlbl" data-i18n="fMaxFile"></div>
              <select class="inp" id="fMaxFile">
                <option value="0" data-i18n="noLimit"></option>
                <option value="25">25 MB</option>
                <option value="100">100 MB</option>
                <option value="500">500 MB</option>
                <option value="2000">2 GB</option>
              </select>
            </div>
            <div class="opt">
              <div class="optlbl" data-i18n="fMaxCount"></div>
              <select class="inp" id="fMaxCount">
                <option value="0" data-i18n="noLimit"></option>
                <option value="5" selected>5</option>
                <option value="10">10</option>
                <option value="25">25</option>
                <option value="50">50</option>
              </select>
            </div>
          </div>

          <div class="two">
            <div class="opt">
              <div class="optlbl" data-i18n="fMaxTotal"></div>
              <select class="inp" id="fMaxTotal">
                <option value="0" data-i18n="noLimit"></option>
                <option value="100">100 MB</option>
                <option value="500">500 MB</option>
                <option value="2000">2 GB</option>
                <option value="5000">5 GB</option>
              </select>
            </div>
            <div class="opt">
              <div class="optlbl" data-i18n="fExpiry"></div>
              <select class="inp" id="fExpiry">
                <option value="0" data-i18n="expNever"></option>

  const TYPE_KEYS = ['image','video','audio','doc'];

  let lang='he', t=I18N.he;
  let view='create';
  let createTypes = {};           // {image:true,...}
  let lastToken=null;             // request just created (for share panel)
  let rvToken=null;               // request open in received view
  let rvSort='new', rvFilter='all', rvView='list', rvSearch='';
  let rvCollapsed=new Set(), rvNewIds=new Set(), gridUrls=[];
  const ARCHIVE=['zip','rar','7z','gz','tar','bz2','xz'];

  // ---------- helpers ----------
  function toast(msg){ const b=el('toast'); b.textContent=msg; b.classList.add('show'); clearTimeout(b._t); b._t=setTimeout(()=>b.classList.remove('show'),1900); }
  function withUsage(tool,payload,work){
    if(window.KolkliUsage && window.KolkliUsage.guard) return window.KolkliUsage.guard(tool,payload,work);
    return Promise.resolve().then(work);
  }
  function confirmDialog(opts){
    return new Promise(resolve=>{
      const overlay=el('cf'), okBtn=el('cfConfirm'), cancelBtn=el('cfCancel'), ico=el('cfIco');
      const tone=opts.tone==='warn'?' warn':'';
      ico.className='cf-ico'+tone; ico.innerHTML=opts.icon||trashSvg();
      el('cfTitle').textContent=opts.title||''; el('cfMsg').textContent=opts.message||'';
      okBtn.className='cf-confirm'+tone; okBtn.textContent=opts.confirmLabel||t.aDel;
      cancelBtn.textContent=opts.cancelLabel||t.confCancel;
      overlay.classList.add('show');
      let settled=false;
      function done(res){ if(settled) return; settled=true; overlay.classList.remove('show');
        okBtn.onclick=cancelBtn.onclick=overlay.onclick=null; document.removeEventListener('keydown',onKey); resolve(res); }
      function onKey(e){ if(e.key==='Escape'){ done(false); } else if(e.key==='Enter'){ done(true); } }
      okBtn.onclick=()=>done(true); cancelBtn.onclick=()=>done(false);
      overlay.onclick=e=>{ if(e.target===overlay) done(false); };
      document.addEventListener('keydown',onKey);
      setTimeout(()=>{ try{ okBtn.focus(); }catch(_){} },30);
    });
  }
  function ls(k){ return KR.ls(k); }
  function uploadUrl(token){ return new URL('upload.html?req='+token, location.href).href; }

  function daysWord(n){ n=+n; return n===1? t.dayU : t.daysU(n); }
  function fmtDate(ms){
    if(!ms) return '';
    const d=new Date(ms), now=new Date();
    const sameDay=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
    const yest=new Date(now.getTime()-86400000);
    if(sameDay(d,now)) return t.today;
    if(sameDay(d,yest)) return t.yesterday;
    try{ return d.toLocaleDateString(lang==='he'?'he-IL':lang==='ru'?'ru-RU':'en-US',{day:'numeric',month:'short'}); }catch(_){ return d.toISOString().slice(0,10); }
  }
  function fmtDateTime(ms){
    const d=new Date(ms);
    try{ return d.toLocaleString(lang==='he'?'he-IL':lang==='ru'?'ru-RU':'en-US',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
    catch(_){ return d.toISOString().slice(0,16).replace('T',' '); }
  }
  function expiresPhrase(ms){
    if(!ms) return t.chipNoExpiry;
    const days=Math.ceil((ms-Date.now())/86400000);
    if(days<=0) return t.chipExpired;
    return t.chipExpires(fmtDate(ms));
  }

  // ---------- tabs / views ----------
  function setView(v){
    if(view==='received' && v!=='received') revokeGridUrls();
    view=v;
    el('createView').classList.toggle('hidden', v!=='create');
    el('manageView').classList.toggle('hidden', v!=='manage');
    el('receivedView').classList.toggle('hidden', v!=='received');
    el('tabCreate').classList.toggle('on', v==='create');
    el('tabManage').classList.toggle('on', v==='manage' || v==='received');
    if(v==='manage') renderManage();
    window.scrollTo({top:0,behavior:'smooth'});
  }

  // ---------- create ----------
  function fillFolders(sel){
    const folders=KR.loadFolders();
    const cur=sel||folders[0];
    el('fFolder').innerHTML = folders.map(f=>`<option value="${KR.escapeHtml(f)}"${f===cur?' selected':''}>${KR.escapeHtml(f)}</option>`).join('')
      + `<option value="__new">${KR.escapeHtml(t.newFolderOpt)}</option>`;
  }
  function renderTypeChips(){
    el('fTypes').innerHTML = TYPE_KEYS.map(k=>{
      const on=createTypes[k];
      const iconKind = k==='doc'?'doc':k;
      return `<span class="tchip${on?' on':''}" data-type="${k}">${KR.FICON[iconKind]}<span data-i18n="${'t'+k.charAt(0).toUpperCase()+k.slice(1)}">${lblForType(k)}</span></span>`;
    }).join('');
  }
  function lblForType(k){ return t['t'+k.charAt(0).toUpperCase()+k.slice(1)]; }

  function renderPreview(){
    el('pvName').textContent = el('fName').value.trim() || I18N[lang].fNamePh;
    const desc=el('fDesc').value.trim();
    el('pvDesc').textContent = desc; el('pvDesc').style.display = desc? '' : 'none';
    const chips=[];
    const chosen=TYPE_KEYS.filter(k=>createTypes[k]);
    if(chosen.length && chosen.length<TYPE_KEYS.length) chips.push(chosen.map(k=>lblForType(k)).join(' · '));
    const mf=+el('fMaxFile').value; if(mf) chips.push('≤ '+(mf>=1000?(mf/1000)+' GB':mf+' MB'));
    const mc=+el('fMaxCount').value || 5; if(mc) chips.push('≤ '+mc);
    const ex=+el('fExpiry').value; if(ex) chips.push(daysWord(ex));
    if(el('fPwToggle').checked) chips.push('🔒');
    el('pvChips').innerHTML = chips.map(c=>`<span class="chip">${KR.escapeHtml(c)}</span>`).join('');
  }

  async function createRequest(){
    el('createErr').textContent='';
    const name=el('fName').value.trim();
    if(!name){ el('createErr').textContent=t.errName; return; }
    const pwOn=el('fPwToggle').checked, pwVal=el('fPassword').value;
    if(pwOn && !pwVal){ el('createErr').textContent=t.errPw; return; }

    let folder=el('fFolder').value;
    if(folder==='__new'){ folder=el('fNewFolder').value.trim() || 'Inbox'; }

    const rawMaxCount=+el('fMaxCount').value;
    const effectiveMaxCount=rawMaxCount || 5;
    let req;
    try{
      req = await withUsage('request-files', { files:effectiveMaxCount }, async()=>{
        KR.addFolder(folder);
        const days=+el('fExpiry').value;
        const next={
          token: KR.randToken(),
          name, desc: el('fDesc').value.trim(), folder,
          types: TYPE_KEYS.filter(k=>createTypes[k]),
          maxFileMB:+el('fMaxFile').value, maxCount:effectiveMaxCount, maxTotalMB:+el('fMaxTotal').value,
          expiresAt: days? Date.now()+days*86400000 : 0,
          createdAt: Date.now(),
          password: pwOn? await KR.hashPass(pwVal) : null,
          thankYou: el('fThanks').value.trim(),
          notify: el('fNotify').checked,
          status:'active', submissions:[], files:[]
        };
        if(window.KolkliProjectNumbers) await KolkliProjectNumbers.assign('receive', next);
        KR.upsertRequest(next);
        return next;
      });
    }catch(err){
      if(err && err.usage) return;
      if(err && err.message==='project_number_allocation_failed'){
        el('createErr').textContent = lang==='he' ? 'לא ניתן להקצות מספר פרויקט כרגע. נסו שוב.' : 'Could not allocate a project number. Please try again.';
        return;
      }
      throw err;
    }
    lastToken=req.token;
    showShare(req);
    updateCount();
  }

  function showShare(req){
    const url=uploadUrl(req.token);
    el('shareLink').textContent=url;
    el('openClientBtn').href=url;
    el('waShareBtn').href='https://wa.me/?text='+encodeURIComponent(t.waText(req.name,url));
    const chips=[];
    const num=projectNumberText(req);
    if(num) chips.push(`<span class="chip">${KR.escapeHtml(num)}</span>`);
    chips.push(`<span class="chip">${clockSvg()} ${req.expiresAt? t.chipExpSoon(daysWord(Math.ceil((req.expiresAt-Date.now())/86400000))) : t.chipNoExpiry}</span>`);
    chips.push(`<span class="chip">${folderSvg()} ${KR.escapeHtml(req.folder)}</span>`);
    if(req.types.length) chips.push(`<span class="chip">${req.types.map(k=>lblForType(k)).join(' · ')}</span>`);
    if(req.password) chips.push(`<span class="chip">${lockSvg()} ${t.fPw}</span>`);
    el('shareChips').innerHTML=chips.join('');
    renderQR(url);
    el('createGrid').classList.add('hidden');
    el('shareCard').classList.add('show');
    el('shareCard').scrollIntoView({behavior:'smooth',block:'center'});
    // owner notification permission
    if(req.notify) requestNotifyPerm();
  }
  function requestNotifyPerm(){
    if('Notification'in window){
      if(Notification.permission==='granted'){ notifyEnabled=true; }
      else if(Notification.permission!=='denied'){ Notification.requestPermission().then(p=>{ notifyEnabled=(p==='granted'); }); }
    }
  }

  function renderQR(url){
    const box=el('qrBox'), wrap=el('qrWrap');
    try{ const qr=qrcode(0,'M'); qr.addData(url); qr.make(); box.innerHTML=qr.createImgTag(5,10);
      const img=box.querySelector('img'); if(img) img.alt='QR'; box._png=qr.createDataURL(8,10); wrap.style.display=''; }
    catch(_){ wrap.style.display='none'; }
  }
  function downloadQR(){ const png=el('qrBox')._png; if(!png) return; const a=document.createElement('a'); a.href=png; a.download='kolkli-request-qr.png'; document.body.appendChild(a); a.click(); a.remove(); }

  function resetCreate(){
    el('fName').value=''; el('fDesc').value=''; el('fThanks').value=''; el('fPassword').value='';
    el('fPwToggle').checked=false; el('fPassword').classList.add('hidden');
    el('fNotify').checked=true;
    el('fMaxFile').value='0'; el('fMaxCount').value='5'; el('fMaxTotal').value='0'; el('fExpiry').value='7';
    createTypes={}; renderTypeChips(); fillFolders();
    el('fNewFolder').classList.add('hidden'); el('fNewFolder').value='';
    el('createErr').textContent=''; lastToken=null;
    el('shareCard').classList.remove('show'); el('createGrid').classList.remove('hidden');
    renderPreview();
  }

  // ---------- manage ----------
  function updateCount(){ el('mgCount').textContent = KR.loadRequests().length; }
  function statusLabel(s){ return s==='active'? t.stActive : s==='expired'? t.stExpired : t.stClosed; }
  function projectNumberText(req){
    return window.KolkliProjectNumbers ? KolkliProjectNumbers.display('receive', req, lang) : '';
  }

  function reqCardHtml(req){
    const st=KR.statusOf(req);
    const unseen=KR.reqUnseen(req);
    const bytes=KR.reqBytes(req);
    const chips=[];
    const num=projectNumberText(req);
    if(num) chips.push(`<span class="chip">${KR.escapeHtml(num)}</span>`);
    chips.push(`<span class="chip">${folderSvg()} ${KR.escapeHtml(req.folder)}</span>`);
    chips.push(`<span class="chip">${fileSvg()} ${t.chipFiles(req.files.length)}</span>`);
    if(bytes) chips.push(`<span class="chip">${KR.fmtBytes(bytes)}</span>`);
    chips.push(`<span class="chip">${clockSvg()} ${t.chipCreated(fmtDate(req.createdAt))}</span>`);
    if(st==='active' && req.expiresAt){
      const days=Math.ceil((req.expiresAt-Date.now())/86400000);
      if(days<=2) chips.push(`<span class="chip warn">${clockSvg()} ${t.chipExpSoon(daysWord(days))}</span>`);
      else chips.push(`<span class="chip">${t.chipExpires(fmtDate(req.expiresAt))}</span>`);
    } else if(!req.expiresAt){ chips.push(`<span class="chip">${t.chipNoExpiry}</span>`); }

    const actions=[];
    actions.push(`<button class="minibtn go" data-act="files">${folderSvg()} ${t.aFiles(req.files.length)}</button>`);
    actions.push(`<button class="minibtn" data-act="copy">${copySvg()} ${t.aCopy}</button>`);
    if(st==='active') actions.push(`<button class="minibtn" data-act="close">${t.aClose}</button>`);
    actions.push(`<button class="minibtn" data-act="dup">${t.aDup}</button>`);
    actions.push(`<button class="minibtn danger" data-act="del">${trashSvg()} ${t.aDel}</button>`);

    return `<div class="rcard${unseen?' unseen':''}" data-token="${req.token}">
      <div class="rc-main">
        <div class="rc-top">
          <span class="rc-name">${KR.escapeHtml(req.name)}</span>
          <span class="badge b-${st}">${statusLabel(st)}</span>
          ${unseen?`<span class="newbadge">${t.newN(unseen)}</span>`:''}
        </div>
        <div class="rc-meta">${chips.join('')}</div>
      </div>
      <div class="rc-actions">${actions.join('')}</div>
    </div>`;
  }

  function renderManage(){
    updateCount();
    const reqs=window.KolkliProjectNumbers ? KolkliProjectNumbers.ensureAll('receive', KR.loadRequests(), KR.saveRequests) : KR.loadRequests();
    reqs.sort((a,b)=>b.createdAt-a.createdAt);
    el('reqList').innerHTML = reqs.map(reqCardHtml).join('');
    el('mgEmpty').classList.toggle('hidden', reqs.length>0);
    el('reqList').classList.toggle('hidden', reqs.length===0);
  }

  function copyLink(token){
    const url=uploadUrl(token);
    const done=()=>toast(t.copiedShort);
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done).catch(fb); else fb();
    function fb(){ const ta=document.createElement('textarea'); ta.value=url; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(_){}; ta.remove(); done(); }
  }
  async function closeRequest(token){
    const ok=await confirmDialog({tone:'warn',icon:lockSvg(),title:t.confTitleClose,message:t.confClose,confirmLabel:t.aClose});
    if(!ok) return;
    const req=KR.getRequest(token); if(!req) return; req.status='closed'; KR.upsertRequest(req); renderManage(); toast(t.closedToast);
  }
  async function duplicateRequest(token){
    const src=KR.getRequest(token); if(!src) return;
    const copy=JSON.parse(JSON.stringify(src));
    copy.token=KR.randToken(); copy.name=src.name+t.dupSuffix; copy.createdAt=Date.now();
    copy.status='active'; copy.submissions=[]; copy.files=[];
    if(src.expiresAt){ const span=src.expiresAt-src.createdAt; copy.expiresAt=Date.now()+Math.max(span,86400000); }
    delete copy.projectNumber; delete copy.project_number; delete copy.projectNumberLabel; delete copy.projectNumberSource;
    if(window.KolkliProjectNumbers) await KolkliProjectNumbers.assign('receive', copy);
    KR.upsertRequest(copy); renderManage(); updateCount();
  }
  async function deleteRequest(token){
    const ok=await confirmDialog({title:t.confTitleDel,message:t.confDel,confirmLabel:t.aDel});
    if(!ok) return;
    KR.deleteRequest(token).then(()=>{ renderManage(); updateCount(); toast(t.delToast); });
  }

  // ---------- received files ----------
  function openReceived(token){
    rvToken=token; rvSort='new'; rvFilter='all'; rvSearch=''; rvView='list'; rvCollapsed=new Set();
    el('rvSort').value='new';
    const si=el('rvSearchInp'); if(si) si.value='';
    el('vwList').classList.add('on'); el('vwGrid').classList.remove('on');
    renderReceived(true);
    setView('received');
    // mark everything seen (after capturing which were new for the dots)
    const req=KR.getRequest(token);
    if(req){ let changed=false; req.files.forEach(f=>{ if(!f.seen){ f.seen=true; changed=true; } }); if(changed){ KR.upsertRequest(req); } }
  }

  // ---- shared helpers for the received views ----
  function reqShortId(req){ const s=(req.token||'').replace(/[^a-z0-9]/gi,'').toUpperCase(); return '#REQ-'+(s.slice(-4)||'0000'); }
  function kindClass(f){ return (f.kind==='doc' && ARCHIVE.indexOf((f.ext||'').toLowerCase())>=0)? 'other' : f.kind; }
  function kindLabel(f){ const c=kindClass(f); return t['k'+c.charAt(0).toUpperCase()+c.slice(1)] || t.kDoc; }
  function sortCmp(a,b){ return rvSort==='old'? a.at-b.at : rvSort==='name'? (a.name||'').localeCompare(b.name||'') : b.at-a.at; }
  function visibleFiles(req){
    let files=req.files.slice();
    if(rvFilter!=='all') files=files.filter(f=>f.kind===rvFilter);
    const q=rvSearch.trim().toLowerCase();
    if(q) files=files.filter(f=>(f.name||'').toLowerCase().indexOf(q)>=0);
    return files;
  }
  function groupFiles(req){
    const fv=visibleFiles(req);
    let subs=req.submissions.slice();
    subs.sort((a,b)=> rvSort==='old'? a.at-b.at : rvSort==='name'? (a.name||'').localeCompare(b.name||'') : b.at-a.at);
    const groups=subs.map(sub=>({sub, files:fv.filter(f=>f.subId===sub.id).sort(sortCmp)})).filter(g=>g.files.length);
    const claimed=new Set(); groups.forEach(g=>g.files.forEach(f=>claimed.add(f.id)));
    const orphans=fv.filter(f=>!claimed.has(f.id));
    if(orphans.length) groups.push({sub:{id:'__none',name:'',at:0}, files:orphans.sort(sortCmp)});
    return groups;
  }
  function revokeGridUrls(){ gridUrls.forEach(u=>{ try{URL.revokeObjectURL(u);}catch(_){}}); gridUrls=[]; }

  function summaryHtml(req, st){
    const subs=req.submissions.slice().sort((a,b)=>a.at-b.at);
    const primary=subs.filter(s=>s.name||s.email||s.phone)[0]||subs[0]||null;
    const nm=primary&&primary.name?KR.escapeHtml(primary.name):t.anonymous;
    const em=primary&&primary.email?KR.escapeHtml(primary.email):'—';
    const ph=primary&&primary.phone?KR.escapeHtml(primary.phone):'—';
    const lastAt=req.files.reduce((m,f)=>Math.max(m,f.at||0),0);
    const more=subs.length>1?` <span class="sum-more">${KR.escapeHtml(t.sendersMore(subs.length-1))}</span>`:'';
    const left=`<div class="sum-title">${userSvg()}<span>${t.sumSender}</span></div>
      <div class="sum-row"><span class="k">${userSvg()}<span>${t.sumName}</span></span><span class="v">${nm}${more}</span></div>
      <div class="sum-row"><span class="k">${mailSvg()}<span>${t.sumEmail}</span></span><span class="v" dir="ltr">${em}</span></div>
      <div class="sum-row"><span class="k">${phoneSvg()}<span>${t.sumPhone}</span></span><span class="v" dir="ltr">${ph}</span></div>
      <div class="sum-row"><span class="k">${tagSvg()}<span>${t.sumSubject}</span></span><span class="v">${KR.escapeHtml(req.name)}</span></div>
      <div class="sum-row"><span class="k">${calSvg()}<span>${t.sumCreated}</span></span><span class="v">${fmtDateTime(req.createdAt)}</span></div>`;
    const right=`<div class="sum-title">${clockSvg()}<span>${t.sumStatus}</span></div>
      <div class="sum-badge"><span class="badge b-${st}">${statusLabel(st)}</span></div>
      <div class="sum-row"><span class="k">${fileSvg()}<span>${t.sumFiles}</span></span><span class="v">${req.files.length}</span></div>
      <div class="sum-row"><span class="k">${folderSvg()}<span>${t.sumSize}</span></span><span class="v">${KR.fmtBytes(KR.reqBytes(req))}</span></div>
      <div class="sum-row"><span class="k">${clockSvg()}<span>${t.sumUpdated}</span></span><span class="v">${lastAt?fmtDateTime(lastAt):'—'}</span></div>`;
    return `<div class="sum-l">${left}</div><div class="sum-r">${right}</div>`;
  }

  // ---- list (table) view ----
  function fileRowHtml(f, subId, collapsed){
    const previewable=f.kind==='image'||f.kind==='video'||f.kind==='audio'||f.ext==='pdf';
    const isNew=rvNewIds.has(f.id);
    return `<tr class="frw${collapsed?' hide':''}" data-sub="${subId}" data-fid="${f.id}">
      <td class="c-name"><div class="ft-file">
        <span class="ft-ico ${f.kind}" ${previewable?`data-pv="${f.id}"`:''}>${KR.FICON[f.kind]}</span>
        <div class="ft-nm"><span class="t" title="${KR.escapeHtml(f.name)}">${KR.escapeHtml(f.name)}</span>${isNew?`<span class="new-tag">${t.newTag}</span>`:''}</div>
      </div></td>
      <td><span class="kbadge ${kindClass(f)}">${kindLabel(f)}</span></td>
      <td class="c-mono">${KR.fmtBytes(f.size)}</td>
      <td class="c-mono">${fmtDateTime(f.at)}</td>
      <td><span class="upbadge">${t.fStatusUp}</span></td>
      <td class="c-act"><div class="ft-act">
        ${previewable?`<button data-pv="${f.id}" title="${KR.escapeHtml(t.filePreview)}">${eyeSvg()}</button>`:''}
        <button data-dl="${f.id}" title="${KR.escapeHtml(t.fileDownload)}">${dlSvg()}</button>
        <button class="del" data-del="${f.id}" title="${KR.escapeHtml(t.fileDelete)}">${trashSvg()}</button>
      </div></td>
    </tr>`;
  }
  function tableHtml(groups){
    const head=`<thead><tr>
      <th class="c-name">${t.thName}</th><th>${t.thType}</th><th>${t.thSize}</th><th>${t.thDate}</th><th>${t.thStatus}</th><th class="c-act">${t.thActions}</th>
    </tr></thead>`;
    const body=groups.map(g=>{
      const collapsed=rvCollapsed.has(g.sub.id);
      const nm=g.sub.name?KR.escapeHtml(g.sub.name):t.anonymous;
      const grp=`<tr class="grp${collapsed?' collapsed':''}" data-sub="${g.sub.id}">
        <td colspan="6"><div class="grp-c">
          <span class="grp-chev">${chevSvg()}</span>
          <span class="grp-fico">${folderSvg()}</span>
          <span class="grp-nm">${nm}</span>
          <span class="grp-count">${t.chipFiles(g.files.length)}</span>
        </div></td></tr>`;
      return grp + g.files.map(f=>fileRowHtml(f, g.sub.id, collapsed)).join('');
    }).join('');
    return `<div class="ftbl-wrap"><table class="ftbl"><colgroup><col class="cg-name"><col><col><col><col><col class="cg-act"></colgroup>${head}<tbody>${body}</tbody></table></div>`;
  }

  // ---- grid (thumbnails) view ----
  function gcardHtml(f){
    const previewable=f.kind==='image'||f.kind==='video'||f.kind==='audio'||f.ext==='pdf';
    const isThumb=(f.kind==='image'||f.kind==='video');
    const isNew=rvNewIds.has(f.id);
    const thumb=isThumb
      ? `<div class="gc-thumb ${f.kind}" data-thumb="${f.id}" data-kind="${f.kind}"><span class="ph">${KR.FICON[f.kind]}</span>${f.kind==='video'?`<span class="gc-play">${playSvg()}</span>`:''}</div>`
      : `<div class="gc-thumb ${f.kind}"><span class="ph">${KR.FICON[f.kind]}</span></div>`;
    return `<div class="gcard${isNew?' isnew':''}" ${previewable?`data-pv="${f.id}"`:''} data-fid="${f.id}">
      ${thumb}
      <div class="gc-act">
        <button data-dl="${f.id}" title="${KR.escapeHtml(t.fileDownload)}">${dlSvg()}</button>
        <button class="del" data-del="${f.id}" title="${KR.escapeHtml(t.fileDelete)}">${trashSvg()}</button>
      </div>
      <div class="gc-body">
        <div class="gc-nm" title="${KR.escapeHtml(f.name)}">${KR.escapeHtml(f.name)}</div>
        <div class="gc-meta"><span class="kbadge ${kindClass(f)}">${kindLabel(f)}</span><span class="c-mono">${KR.fmtBytes(f.size)}</span></div>
      </div>
    </div>`;
  }
  function gridHtml(groups){
    return groups.map(g=>{
      const nm=g.sub.name?KR.escapeHtml(g.sub.name):t.anonymous;
      const initial=(g.sub.name||'?').trim().charAt(0).toUpperCase()||'?';
      return `<div class="fgrid-group">
        <div class="fg-head">
          <span class="fg-ava">${KR.escapeHtml(initial)}</span>
          <span class="fg-nm">${nm}</span>
          <span class="fg-count">${t.chipFiles(g.files.length)}</span>
        </div>
        <div class="fgrid">${g.files.map(gcardHtml).join('')}</div>
      </div>`;
    }).join('');
  }
  function fillThumbs(){
    el('subList').querySelectorAll('.gc-thumb[data-thumb]').forEach(node=>{
      const id=node.getAttribute('data-thumb'), kind=node.getAttribute('data-kind');
      KR.getBlob(id).then(blob=>{
        if(!blob) return;
        const url=URL.createObjectURL(blob); gridUrls.push(url);
        if(kind==='image'){
          const img=new Image(); img.alt='';
          img.onload=()=>{ const ph=node.querySelector('.ph'); if(ph) ph.remove(); node.insertBefore(img,node.firstChild); };
          img.onerror=()=>{ try{URL.revokeObjectURL(url);}catch(_){} };
          img.src=url;
        } else if(kind==='video'){
          const v=document.createElement('video'); v.muted=true; v.playsInline=true; v.preload='metadata';
          v.onloadeddata=()=>{ const ph=node.querySelector('.ph'); if(ph) ph.remove(); };
          v.src=url+'#t=0.1'; node.insertBefore(v,node.firstChild);
        }
      }).catch(()=>{});
    });
  }

  function renderReceived(freshOpen){
    const req=KR.getRequest(rvToken); if(!req){ setView('manage'); return; }
    revokeGridUrls();
    const st=KR.statusOf(req);
    rvNewIds = new Set(freshOpen ? req.files.filter(f=>!f.seen).map(f=>f.id) : []);

    // filter chips
    el('rvFilter').innerHTML = ['all'].concat(TYPE_KEYS).map(k=>{
      const lbl = k==='all'? t.fAll : lblForType(k);
      return `<span class="fchip${rvFilter===k?' on':''}" data-filter="${k}">${KR.escapeHtml(lbl)}</span>`;
    }).join('');

    const hasFiles=req.files.length>0;
    el('rvSummary').classList.toggle('hidden', !hasFiles);
    el('rvPanel').classList.toggle('hidden', !hasFiles);
    el('rvEmpty').classList.toggle('hidden', hasFiles);
    if(!hasFiles){ el('subList').innerHTML=''; return; }

    el('rvSummary').innerHTML = summaryHtml(req, st);
    el('rvpName').textContent = req.name;
    el('rvpId').textContent = reqShortId(req);

    const groups=groupFiles(req);
    if(!groups.length){ el('subList').innerHTML=`<div class="nores">${searchSvg()}<p>${KR.escapeHtml(t.noResults)}</p></div>`; return; }

    if(rvView==='grid'){ el('subList').innerHTML=gridHtml(groups); fillThumbs(); }
    else { el('subList').innerHTML=tableHtml(groups); }
  }

  function fileById(id){
    const req=KR.getRequest(rvToken); if(!req) return null;
    return req.files.filter(f=>f.id===id)[0]||null;
  }
  async function downloadFile(id){
    const f=fileById(id); if(!f) return;
    const blob=await KR.getBlob(id); if(!blob) return;
    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=f.name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
  }
  async function deleteFile(id){
    const ok=await confirmDialog({title:t.confTitleFileDel,message:t.confFileDel,confirmLabel:t.fileDelete});
    if(!ok) return;
    const req=KR.getRequest(rvToken); if(!req) return;
    req.files=req.files.filter(f=>f.id!==id);
    req.submissions=req.submissions.map(s=>({...s,fileIds:(s.fileIds||[]).filter(x=>x!==id)}));
    KR.upsertRequest(req);
    KR.delBlob(id).catch(()=>{});
    renderReceived(false);
  }
  async function previewFile(id){
    const f=fileById(id); if(!f) return;
    const blob=await KR.getBlob(id); if(!blob) return;
    const url=URL.createObjectURL(blob);
    el('pvTitle').textContent=f.name; const body=el('pvBody');
    if(f.kind==='image') body.innerHTML=`<img src="${url}" alt="">`;
    else if(f.kind==='video') body.innerHTML=`<video src="${url}" controls autoplay playsinline></video>`;
    else if(f.kind==='audio') body.innerHTML=`<audio src="${url}" controls autoplay></audio>`;
    else body.innerHTML=`<iframe src="${url}"></iframe>`;
    el('pv').classList.add('show');
  }
  function closePreview(){ el('pv').classList.remove('show'); el('pvBody').innerHTML=''; }

  // ---------- incoming upload notifications ----------
  function onIncoming(d){
    if(!d || d.type!=='upload') return;
    const req=KR.getRequest(d.token); if(!req) return;
    const who=(d.who && d.who.trim())? d.who.trim() : t.anonymous;
    toast(t.newUploadToast(who));
    if(req.notify){ try{ if('Notification'in window && Notification.permission==='granted') new Notification(t.notifTitle,{body:t.notifBody(d.count||0,who)}); }catch(_){} }
    if(view==='manage') renderManage();
    else if(view==='received' && rvToken===d.token) renderReceived(false);
    updateCount();
  }

  // ---------- i18n + theme ----------
  function applyStatic(){
    document.querySelectorAll('[data-i18n]').forEach(n=>{ const k=n.getAttribute('data-i18n'); if(typeof t[k]==='string') n.textContent=t[k]; });
    document.querySelectorAll('[data-i18n-ph]').forEach(n=>{ const k=n.getAttribute('data-i18n-ph'); if(typeof t[k]==='string') n.setAttribute('placeholder',t[k]); });
  }
  function applyLang(l){
    lang=l; t=I18N[l];
    document.documentElement.lang=l; document.documentElement.dir=t.dir;
    applyStatic();
    { const vl=el('vwList'), vg=el('vwGrid'); if(vl) vl.title=t.viewList; if(vg) vg.title=t.viewGrid; }
    KR.lsSet('ac_lang', l);
    renderTypeChips(); fillFolders(el('fFolder').value && el('fFolder').value!=='__new'? el('fFolder').value : undefined);
    renderPreview();
    if(view==='manage') renderManage();
    if(view==='received') renderReceived(false);
    if(lastToken){ const r=KR.getRequest(lastToken); if(r) showShare(r); }
  }
  function applyTheme(th){ const dark=(th==='dark'); document.documentElement.setAttribute('data-theme',dark?'dark':'light'); const ic=el('themeIco'); if(ic) ic.textContent=dark?'☀️':'🌙'; KR.lsSet('theme',dark?'dark':'light'); }

  // ---------- svg atoms ----------
  function clockSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>'; }
  function fileSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2v6h6"/><path d="M4 2h10l6 6v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/></svg>'; }
  function folderSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>'; }
  function lockSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'; }
  function copySvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'; }
  function trashSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>'; }
  function eyeSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>'; }
  function dlSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>'; }
  function phoneSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.4-1.2a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>'; }
  function mailSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg>'; }
  function chevSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>'; }
  function playSvg(){ return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'; }
  function userSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'; }
  function calSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>'; }
  function tagSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 12 22l-9-9V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5" fill="currentColor" stroke="none"/></svg>'; }
  function searchSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>'; }

  // ---------- events ----------
  el('tabCreate').addEventListener('click',()=>setView('create'));
  el('tabManage').addEventListener('click',()=>setView('manage'));
  el('newReqBtn').addEventListener('click',()=>{ resetCreate(); setView('create'); });
  el('emptyNewBtn').addEventListener('click',()=>{ resetCreate(); setView('create'); });
  el('toManageBtn').addEventListener('click',()=>setView('manage'));
  el('backBtn').addEventListener('click',()=>setView('manage'));

  ['fName','fDesc','fMaxFile','fMaxCount','fExpiry'].forEach(id=>el(id).addEventListener('input',renderPreview));
  el('fPwToggle').addEventListener('change',e=>{ el('fPassword').classList.toggle('hidden',!e.target.checked); if(e.target.checked) el('fPassword').focus(); renderPreview(); });
  el('fFolder').addEventListener('change',e=>{ el('fNewFolder').classList.toggle('hidden', e.target.value!=='__new'); if(e.target.value==='__new') el('fNewFolder').focus(); });
  el('fTypes').addEventListener('click',e=>{ const c=e.target.closest('[data-type]'); if(!c) return; const k=c.getAttribute('data-type'); createTypes[k]=!createTypes[k]; c.classList.toggle('on',createTypes[k]); renderPreview(); });
  el('createBtn').addEventListener('click',createRequest);

  el('copyBtn').addEventListener('click',()=>{ if(lastToken) copyLink(lastToken); toast(t.copied); });
  el('qrDlBtn').addEventListener('click',downloadQR);
  el('emailShareBtn').addEventListener('click',()=>{
    if(!lastToken) return; const req=KR.getRequest(lastToken); const url=uploadUrl(lastToken);
    const href='mailto:?subject='+encodeURIComponent(t.emailSubject(req.name))+'&body='+encodeURIComponent(t.emailBody(req.name,url,req.desc));
    const a=document.createElement('a'); a.href=href; a.style.display='none'; document.body.appendChild(a); a.click(); a.remove();
  });

  el('reqList').addEventListener('click',e=>{
    const btn=e.target.closest('[data-act]'); const card=e.target.closest('[data-token]'); if(!card) return;
    const token=card.getAttribute('data-token');
    if(!btn){ return; }
    const act=btn.getAttribute('data-act');
    if(act==='files') openReceived(token);
    else if(act==='copy') copyLink(token);
    else if(act==='close') closeRequest(token);
    else if(act==='dup') duplicateRequest(token);
    else if(act==='del') deleteRequest(token);
  });

  el('rvFilter').addEventListener('click',e=>{ const c=e.target.closest('[data-filter]'); if(!c) return; rvFilter=c.getAttribute('data-filter'); renderReceived(false); });
  el('rvSort').addEventListener('change',e=>{ rvSort=e.target.value; renderReceived(false); });
  el('rvSearchInp').addEventListener('input',e=>{ rvSearch=e.target.value; renderReceived(false); });
  el('rvViewToggle').addEventListener('click',e=>{
    const b=e.target.closest('[data-view]'); if(!b) return;
    const v=b.getAttribute('data-view'); if(v===rvView) return;
    rvView=v;
    el('vwList').classList.toggle('on', v==='list');
    el('vwGrid').classList.toggle('on', v==='grid');
    renderReceived(false);
  });
  el('subList').addEventListener('click',e=>{
    const del=e.target.closest('[data-del]'); if(del){ deleteFile(del.getAttribute('data-del')); return; }
    const dl=e.target.closest('[data-dl]'); if(dl){ downloadFile(dl.getAttribute('data-dl')); return; }
    const pv=e.target.closest('[data-pv]'); if(pv){ previewFile(pv.getAttribute('data-pv')); return; }
    const grp=e.target.closest('.grp'); if(grp){ const id=grp.getAttribute('data-sub'); if(rvCollapsed.has(id)) rvCollapsed.delete(id); else rvCollapsed.add(id); renderReceived(false); }
  });
  el('pvClose').addEventListener('click',closePreview);
  el('pv').addEventListener('click',e=>{ if(e.target===el('pv')) closePreview(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePreview(); });

  window.__setLang=applyLang;
  const themeBtn=el('themeToggle'); if(themeBtn) themeBtn.addEventListener('click',()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));

  // listen for client uploads (this browser) + poll fallback
  KR.listen(onIncoming);
  let lastSig='';
  setInterval(()=>{
    const reqs=KR.loadRequests();
    const sig=reqs.map(r=>r.token+':'+r.files.length+':'+r.status).join('|');
    if(sig!==lastSig){ lastSig=sig; if(view==='manage') renderManage(); else if(view==='received') renderReceived(false); updateCount(); }
  },4000);

  // ---------- init ----------
  applyTheme(ls('theme')||'light');
  applyLang(KR.detectLang());
  fillFolders(); renderTypeChips(); renderPreview(); updateCount();
  requestNotifyPerm();
  const initParams=new URLSearchParams(location.search);
  const initFilesToken=initParams.get('files');
  if(initFilesToken && KR.getRequest(initFilesToken)) openReceived(initFilesToken);
  else if(initParams.get('tab')==='manage') setView('manage');
})();
</script>
</body>
</html>
