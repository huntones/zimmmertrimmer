    phone:{icon:phoneSvg,k:'palPhone'}, file:{icon:paperclipSvg,k:'palFile'}, signature:{icon:signatureSvg,k:'palSignature'}, satisfaction:{icon:smileySvg,k:'palSatisfaction'}, rating:{icon:barChartSvg,k:'palRating'},
    image:{icon:imageSvg,k:'palImage'}, video:{icon:videoSvg,k:'palVideo'}, score:{icon:barChartSvg,k:'palScore'}, popup:{icon:bubbleSvg,k:'palPopup'}, serial:{icon:serialSvg,k:'palSerial'}
  };
  const STRUCT=new Set(['heading','paragraph','divider','image','video','score','popup','serial']);
  const CONTENT=new Set(['image','video','score','popup','serial']);
  const CHOICE=new Set(['radio','checkbox','select']);   // types that carry an options list

  const RAIL=[
    {g:'navBuild', items:[{id:'components', icon:blocksSvg, k:'secComponents', count:()=>customFields.length}]},
    {g:'navSettings', items:[
      {id:'language', icon:globeSvg, k:'secLanguage'},
      {id:'recipients', icon:inboxSvg, k:'secRecipients', count:()=>recipients.filter(x=>x&&x.trim()).length},
      {id:'files', icon:fileSvg, k:'secFiles'}
    ]}
  ];
  // secondary floating rail (advanced settings + appearance)
  const RAIL2=[
    {g:'navMore', items:[
      {id:'security', icon:shieldSvg, k:'secSecurity'},
      {id:'notifications', icon:bellSvg, k:'secNotifications'},
      {id:'after', icon:rocketSvg, k:'secAfter'}
    ]},
    {g:'navDesign', items:[{id:'design', icon:paletteSvg, k:'secDesign'}]}
  ];

  const esc = s => KR.escapeHtml(s==null?'':String(s));
  function commit(){ persistCreateSettings(); renderPreview(); }
  function restructure(sec){ commit(); renderStudioRail(); showStudioSection(sec); }
  function fieldById(id){ return customFields.filter(f=>f.id===id)[0]||null; }
  function cloneFields(a){ return (a||[]).map(f=>{ const c=Object.assign({}, f); if(Array.isArray(f.options)) c.options=f.options.slice(); return c; }); }

  function addField(type){
    if(!COMP[type]) return;
    const f={ id:'fld'+(++fldSeq), type:type, label:S('def_'+type), required:false };
    if(CHOICE.has(type)) f.options=[S('optA'), S('optB')];
    customFields.push(f);
    restructure('components');
  }

  // ---- rail + section switching ----
  function renderStudioRail(){
    renderRailInto(el('studioRail'), RAIL);
    renderRailInto(el('studioRail2'), RAIL2);
  }
  function renderRailInto(rail, groups){
    if(!rail) return;
    rail.innerHTML = groups.map(grp=>{
      const items=grp.items.map(it=>{
        const c = it.count ? it.count() : 0;
        const badge = it.count && c ? `<span class="st-count">${c}</span>` : '';
        return `<button class="st-nav${studioSection===it.id?' on':''}" data-sec="${it.id}">${it.icon()}<span>${S(it.k)}</span>${badge}</button>`;
      }).join('');
      return `<div class="st-glabel">${S(grp.g)}</div>${items}`;
    }).join('');
  }
  function showStudioSection(id){
    studioSection=id;
    el('studioContent').innerHTML = buildSection(id);
    document.querySelectorAll('.studio-rail .st-nav, .studio-rail2 .st-nav').forEach(n=>n.classList.toggle('on', n.getAttribute('data-sec')===id));
  }
  function secHead(tk,sk){ return `<div class="st-sec-h">${S(tk)}</div><div class="st-sec-sub">${S(sk)}</div>`; }
  function buildSection(id){
    switch(id){
      case 'components': return buildComponents();
      case 'language': return buildLanguage();
      case 'recipients': return buildRecipients();
      case 'files': return buildFiles();
      case 'security': return buildSecurity();
      case 'notifications': return buildNotifications();
      case 'after': return buildAfter();
      case 'design': return buildDesign();
    }
    return '';
  }

  // ---- reusable studio controls ----
  function switchHtml(act,on){ return `<label class="cl-switch"><input type="checkbox" data-act="${act}" ${on?'checked':''}><span class="cl-track"></span><span class="cl-knob"></span></label>`; }
  function selectHtml(act,val,opts){
    const o=opts.map(([v,l])=>`<option value="${v}" ${String(v)===String(val)?'selected':''}>${esc(l)}</option>`).join('');
    return `<div class="cl-sel"><span class="cl-chev">${chevSvg()}</span><select class="cl-inp" data-act="${act}">${o}</select></div>`;
  }
  function selectField(act,label,val,opts){ return `<div class="st-field"><label class="st-flabel">${esc(label)}</label>${selectHtml(act,val,opts)}</div>`; }
  function toggleRow(act,nm,ds,on){ return `<div class="st-toggle"><div class="st-toggle-tx"><div class="st-toggle-nm">${esc(nm)}</div>${ds?`<div class="st-toggle-ds">${esc(ds)}</div>`:''}</div>${switchHtml(act,on)}</div>`; }

  // ---- section builders ----
  function buildComponents(){
    let h = secHead('dragField','dragFieldSub');
    COMP_GROUPS.forEach(g=>{
      h+=`<div class="pal-grp"><div class="pal-grp-t">${S(g.t)}</div><div class="pal">`;
      g.items.forEach(type=>{
        h+=`<button class="pal-tile" data-act="add-comp" data-type="${type}"><span class="pal-ico">${COMP[type].icon()}</span><span class="pal-tx"><span class="pal-nm">${S(COMP[type].k)}</span></span><span class="pal-plus">${plusMiniSvg()}</span></button>`;
      });
      h+=`</div></div>`;
    });
    h+=`<div class="st-hint" style="margin-top:16px">${S('fieldsCanvasHint')}</div>`;
    return h;
  }
  function fldRowHtml(f){
    const req = STRUCT.has(f.type) ? '' : `<label class="fld-req"><input type="checkbox" data-act="field-req" data-id="${f.id}" ${f.required?'checked':''}>${S('required')}</label>`;
    const hasOpts = CHOICE.has(f.type);
    const opts = hasOpts
      ? `<div class="fld-optrow"><label class="st-flabel">${S('fieldOptions')}</label><input class="cl-inp" data-act="field-opts" data-id="${f.id}" value="${esc((f.options||[]).join(', '))}" placeholder="${S('optionsPh')}"></div>`
      : '';
    return `<div class="fld-row${hasOpts?' has-opts':''}" data-id="${f.id}">
      <span class="fld-grip">${gripSvg()}</span>
      <span class="fld-ico">${COMP[f.type].icon()}</span>
      <input class="fld-lblinp" data-act="field-label" data-id="${f.id}" value="${esc(f.label)}" placeholder="${S('fieldLabelPh')}">
      ${req}
      <button class="fld-del" data-act="del-field" data-id="${f.id}" title="${S('remove')}">${trashSvg()}</button>
    </div>${opts}`;
  }
  function buildLanguage(){
    return secHead('secLanguage','secLanguageSub')+
      `<div class="st-field"><label class="st-flabel">${S('clientLang')}</label>`+
      selectHtml('lang', formLang, [['',S('langAuto')],['he','עברית'],['en','English'],['ru','Русский']])+
      `<div class="st-hint">${S('clientLangHint')}</div></div>`;
  }
  function buildRecipients(){
    let h = secHead('secRecipients','secRecipientsSub')+`<label class="st-flabel">${S('recipientsLbl')}</label>`;
    recipients.forEach((e,i)=>{
      h+=`<div class="em-row"><input class="cl-inp" dir="ltr" data-act="email-inp" data-i="${i}" value="${esc(e)}" placeholder="${S('emailPh')}"><button class="em-x" data-act="del-email" data-i="${i}" aria-label="${S('remove')}">${xSvg()}</button></div>`;
    });
    h+=`<button class="em-add" data-act="add-email">${plusMiniSvg()} ${S('addEmail')}</button>`;
    h+=`<div class="st-hint">${S('recipientsHint')}</div>`;
    return h;
  }
  function buildFiles(){
    const nl=S('noLimit');
    let h = secHead('secFiles','secFilesSub');
    h+=`<div class="st-field"><label class="st-flabel">${S('allowedTypes')}</label><div class="typechips">`;
    TYPE_KEYS.forEach(k=>{ const on=createTypes[k]; h+=`<span class="tchip${on?' on':''}" data-act="type-chip" data-type="${k}">${KR.FICON[k==='doc'?'doc':k]}<span>${esc(lblForType(k))}</span></span>`; });
    h+=`</div><div class="st-hint">${S('allowedTypesHint')}</div></div>`;
    h+=`<div class="st-row2">`+
      selectField('maxtotal', S('maxTotal'), el('fMaxTotal').value, [[0,nl],[100,'100 MB'],[500,'500 MB'],[2000,'2 GB'],[5000,'5 GB']])+
      selectField('maxcount', S('maxCount'), maxCount, [[0,nl],[1,'1'],[3,'3'],[5,'5'],[10,'10'],[25,'25'],[50,'50'],[100,'100']])+
      `</div>`;
    h+=selectField('maxfile', S('maxPerFile'), maxFileMB, [[0,nl],[25,'25 MB'],[100,'100 MB'],[500,'500 MB'],[1000,'1 GB'],[2000,'2 GB']]);
    return h;
  }
  function buildSecurity(){
    const pwOn=el('fPwToggle').checked;
    let h = secHead('secSecurity','secSecuritySub');
    h+=toggleRow('pw-toggle', S('pwProtect'), S('pwProtectDs'), pwOn);
    if(pwOn) h+=`<div class="st-field"><input class="cl-inp" dir="ltr" data-act="pw-input" value="${esc(el('fPassword').value)}" placeholder="${S('pwPh')}"></div>`;
    h+=selectField('expiry', S('expiry'), el('fExpiry').value, [[0,t.expNever],[1,t.exp1],[3,t.exp3],[7,t.exp7],[30,t.exp30]]);
    h+=toggleRow('sender-name', S('reqSenderName'), S('reqSenderNameDs'), sender.name);
    h+=toggleRow('sender-email', S('reqSenderEmail'), S('reqSenderEmailDs'), sender.email);
    return h;
  }
  function buildNotifications(){
    let h = secHead('secNotifications','secNotificationsSub');
    h+=toggleRow('notify', S('notifyMe'), S('notifyMeDs'), el('fNotify').checked);
    const perm = ('Notification'in window)? Notification.permission : 'denied';
    const ds = perm==='granted'? S('notifStatusOn') : perm==='denied'? S('notifBlocked2') : S('notifStatusOff');
    const ctl = perm==='granted'? `<span class="badge b-active">${S('notifStatusOn')}</span>` : perm==='denied'? '' : `<button class="em-add" data-act="notif-enable">${S('enable')}</button>`;
    h+=`<div class="st-toggle"><div class="st-toggle-tx"><div class="st-toggle-nm">${S('browserNotif')}</div><div class="st-toggle-ds">${ds}</div></div>${ctl}</div>`;
    return h;
  }
  function buildAfter(){
    let h = secHead('secAfter','secAfterSub')+`<label class="st-flabel">${S('afterMode')}</label>`;
    h+=`<div class="st-toggle" data-act="after-mode" data-mode="thanks"><span class="st-radio${afterUpload.mode==='thanks'?' on':''}"></span><div class="st-toggle-tx"><div class="st-toggle-nm">${S('afterThanks')}</div></div></div>`;
    h+=`<div class="st-toggle" data-act="after-mode" data-mode="redirect"><span class="st-radio${afterUpload.mode==='redirect'?' on':''}"></span><div class="st-toggle-tx"><div class="st-toggle-nm">${S('afterRedirect')}</div></div></div>`;
    if(afterUpload.mode==='redirect')
      h+=`<div class="st-field"><label class="st-flabel">${S('redirectUrl')}</label><input class="cl-inp" dir="ltr" data-act="redirect" value="${esc(afterUpload.redirectUrl)}" placeholder="https://…"></div>`;
    else
      h+=`<div class="st-field"><label class="st-flabel">${S('thanksMsg')}</label><textarea class="cl-inp cl-ta" data-act="thanks" placeholder="${esc(t.fThanksPh)}">${esc(el('fThanks').value)}</textarea></div>`;
    h+=toggleRow('allowmore', S('allowMore'), S('allowMoreDs'), afterUpload.allowMore);
    return h;
  }
  function buildDesign(){
    let h = secHead('secDesign','secDesignSub');
    h+=colorRow('accent', S('primaryColor'), formTheme.accent, DEF_ACCENT);
    h+=colorRow('ink', S('textColor'), formTheme.ink, DEF_INK);
    h+=colorRow('bg', S('bgColor'), formTheme.bg, DEF_BG);
    h+=`<div class="st-field"><label class="st-flabel">${S('gradient')}</label><div class="grad-row">`;
    Object.keys(GRADIENTS).forEach(g=>{ h+=`<button class="grad-sw${formTheme.gradient===g?' on':''}" data-act="grad" data-g="${g}" style="background:${GRADIENTS[g]}" aria-label="${g}"></button>`; });
    h+=`</div>${formTheme.gradient?`<button class="grad-clear" data-act="grad-clear">${S('clearGradient')}</button>`:''}</div>`;
    const fonts=[['',S('fontDefault')],['Heebo','Heebo'],['Assistant','Assistant'],['Open Sans','Open Sans'],['Overpass','Overpass'],['Arial','Arial']];
    h+=selectField('font', S('font'), formTheme.font, fonts);
    h+=`<div class="st-field"><label class="st-flabel">${S('width')}</label><div class="seg">`;
    [['compact','widthCompact'],['normal','widthNormal'],['wide','widthWide']].forEach(([w,k])=>{ h+=`<button data-act="seg-width" data-w="${w}" class="${(formTheme.width||'normal')===w?'on':''}">${S(k)}</button>`; });
    h+=`</div></div>`;
    h+=`<button class="grad-clear" data-act="theme-reset" style="margin-top:2px">${S('resetDesign')}</button>`;
    h+=`<div class="st-hint">${S('livePreview')}</div>`;
    return h;
  }
  function colorRow(key,label,val,def){
    const v = val || def;
    return `<div class="col-row">
      <label class="col-sw" style="background:${v}"><input type="color" data-act="color-${key}" value="${v}"></label>
      <div class="col-meta"><div class="col-nm">${esc(label)}</div></div>
      <input class="cl-inp col-hex" data-act="hex-${key}" value="${esc(val||'')}" placeholder="${def}" dir="ltr" maxlength="7">
    </div>`;
  }

  // ---- live preview sync (theme + custom fields) ----
  function studioSyncPreview(){
    const aside=document.querySelector('.cl-prev'); if(!aside) return;
    const th=formTheme;
    if(th.accent){
      aside.style.setProperty('--pv-accent', th.accent);
      aside.style.setProperty('--pv-accent-soft', `color-mix(in srgb, ${th.accent} 15%, transparent)`);
      aside.style.setProperty('--pv-accent-line', `color-mix(in srgb, ${th.accent} 45%, transparent)`);
    } else { aside.style.removeProperty('--pv-accent'); aside.style.removeProperty('--pv-accent-soft'); aside.style.removeProperty('--pv-accent-line'); }
    if(th.ink) aside.style.setProperty('--pv-ink', th.ink); else aside.style.removeProperty('--pv-ink');
    aside.style.background = th.bg || '';
    aside.style.fontFamily = th.font ? `'${th.font}', var(--sans)` : '';
    aside.setAttribute('data-w', th.width||'normal');
    const ava=aside.querySelector('.cl-pv-ava');
    if(ava){ if(th.gradient && GRADIENTS[th.gradient]){ ava.style.background=GRADIENTS[th.gradient]; ava.style.color='#fff'; } else { ava.style.background=''; ava.style.color=''; } }
    const box=el('pvFields'); if(box) box.innerHTML = customFields.map(pvFieldHtml).join('');
  }
  function pvFieldHtml(f){
    const lbl=esc(f.label||'');
    if(f.type==='heading') return `<div class="pv-fld-head">${lbl}</div>`;
    if(f.type==='paragraph') return `<div class="pv-fld-para">${lbl}</div>`;
    if(f.type==='divider') return `<div class="pv-fld-hr"></div>`;
    if(CONTENT.has(f.type)) return `<div class="pv-content-block"><span class="pv-cico">${COMP[f.type].icon()}</span><span>${lbl}</span></div>`;
    const rq = f.required ? `<span class="rq">*</span>` : '';
    if(f.type==='signature') return `<div><label class="pv-fld-l">${lbl}${rq}</label><div class="pv-fld-box sig">${esc(S('ph_signature'))}</div></div>`;
    if(f.type==='satisfaction') return `<div><label class="pv-fld-l">${lbl}${rq}</label><div class="pv-faces">🙁 😐 🙂 😄 🤩</div></div>`;
    if(f.type==='rating') return `<div><label class="pv-fld-l">${lbl}${rq}</label><div class="pv-stars">★★★★★</div></div>`;
    if(f.type==='radio' || f.type==='checkbox'){
      const opts=((f.options&&f.options.length)? f.options : [S('ph_'+f.type)]).map(o=>`<span class="pv-opt"><span class="pv-mark${f.type==='checkbox'?' sq':''}"></span>${esc(o)}</span>`).join('');
      return `<div><label class="pv-fld-l">${lbl}${rq}</label><div class="pv-opts">${opts}</div></div>`;
    }
    if(f.type==='select' || f.type==='recipient'){
      const first = f.type==='recipient'
        ? (recipients.filter(x=>x&&x.trim())[0] || S('ph_recipient'))
        : ((f.options&&f.options[0]) || S('ph_select'));
      return `<div><label class="pv-fld-l">${lbl}${rq}</label><div class="pv-fld-box sel"><span>${esc(first)}</span><span class="pv-chev">&#9660;</span></div></div>`;
    }
    const ph = esc(S('ph_'+f.type)||'');
    const box = f.type==='textarea' ? `<div class="pv-fld-box ta">${ph}</div>` : `<div class="pv-fld-box">${ph}</div>`;
    return `<div><label class="pv-fld-l">${lbl}${rq}</label>${box}</div>`;
  }

  // ---- live form canvas (Wix-style builder in the manager view) ----
  // The centre card renders the client-facing upload form as a live WYSIWYG.
  // Every field mutation / theme change funnels through commit() -> renderPreview()
  // -> renderFormCanvas(), so palette clicks appear in the form in real time.
  function fcCloudSvg(){ return svgP('<path d="M12 13v8"/><path d="m8 17 4-4 4 4"/><path d="M20 16.5A4.5 4.5 0 0 0 17.5 8h-1.26A7 7 0 1 0 5 15.5"/>'); }
  function fcUpSvg(){ return svgP('<path d="m18 15-6-6-6 6"/>',2.2); }
  function fcDownSvg(){ return svgP('<path d="m6 9 6 6 6-6"/>',2.2); }
  function fcThemeVars(frame){
    const th=formTheme;
    if(th.accent){
      frame.style.setProperty('--pv-accent', th.accent);
      frame.style.setProperty('--pv-accent-soft', `color-mix(in srgb, ${th.accent} 15%, transparent)`);
      frame.style.setProperty('--pv-accent-line', `color-mix(in srgb, ${th.accent} 45%, transparent)`);
    } else { frame.style.removeProperty('--pv-accent'); frame.style.removeProperty('--pv-accent-soft'); frame.style.removeProperty('--pv-accent-line'); }
    if(th.ink) frame.style.setProperty('--pv-ink', th.ink); else frame.style.removeProperty('--pv-ink');
    frame.style.background = th.bg || '';
    frame.style.fontFamily = th.font ? `'${th.font}', var(--sans)` : '';
    frame.setAttribute('data-w', th.width||'normal');
    const ic=frame.querySelector('.fc-ic');
    if(ic){ if(th.gradient && GRADIENTS[th.gradient]){ ic.style.background=GRADIENTS[th.gradient]; ic.style.color='#fff'; } else { ic.style.background=''; ic.style.color=''; } }
  }
  function fcFieldHtml(f){
    const up=`<button class="fc-tt" type="button" data-act="field-move" data-dir="-1" data-id="${f.id}" title="${S('moveUp')}">${fcUpSvg()}</button>`;
    const down=`<button class="fc-tt" type="button" data-act="field-move" data-dir="1" data-id="${f.id}" title="${S('moveDown')}">${fcDownSvg()}</button>`;
    const del=`<button class="fc-tt danger" type="button" data-act="del-field" data-id="${f.id}" title="${S('remove')}">${trashSvg()}</button>`;
    const reqToggle = STRUCT.has(f.type) ? '' :
      `<label class="fc-treq${f.required?' on':''}" title="${S('required')}"><input type="checkbox" data-act="field-req" data-id="${f.id}" ${f.required?'checked':''}>${S('required')}</label>`;
    const tools=`<div class="fc-ftools">${up}${down}${reqToggle}${del}</div>`;
    if(f.type==='heading') return `<div class="fc-field type-heading" data-id="${f.id}">${tools}<input class="fc-f-head" data-act="field-label" data-id="${f.id}" value="${esc(f.label)}" placeholder="${S('def_heading')}"></div>`;
    if(f.type==='paragraph') return `<div class="fc-field type-paragraph" data-id="${f.id}">${tools}<textarea class="fc-f-para" data-act="field-label" data-id="${f.id}" placeholder="${S('def_paragraph')}">${esc(f.label)}</textarea></div>`;
    if(f.type==='divider') return `<div class="fc-field type-divider" data-id="${f.id}">${tools}<div class="fc-f-hr"></div></div>`;
    if(CONTENT.has(f.type)) return `<div class="fc-field type-content" data-id="${f.id}">${tools}<span class="fc-cico">${COMP[f.type].icon()}</span><input class="fc-labelinp cblk" data-act="field-label" data-id="${f.id}" value="${esc(f.label)}" placeholder="${S('fieldLabelPh')}"></div>`;
    const rq = f.required ? ` <span class="req">*</span>` : '';
    const lbl = `<div class="fc-flabel"><input class="fc-labelinp" data-act="field-label" data-id="${f.id}" value="${esc(f.label)}" placeholder="${S('fieldLabelPh')}">${rq}</div>`;
    if(f.type==='signature') return `<div class="fc-field" data-id="${f.id}">${tools}${lbl}<div class="fc-ghost sig">${esc(S('ph_signature'))}</div></div>`;
    if(f.type==='satisfaction') return `<div class="fc-field" data-id="${f.id}">${tools}${lbl}<div class="fc-faces">🙁 😐 🙂 😄 🤩</div></div>`;
    if(f.type==='rating') return `<div class="fc-field" data-id="${f.id}">${tools}${lbl}<div class="fc-stars">★★★★★</div></div>`;
    if(f.type==='radio' || f.type==='checkbox'){
      const opts=((f.options&&f.options.length)? f.options : [S('ph_'+f.type)]).map(o=>`<span class="fc-opt"><span class="fc-mark${f.type==='checkbox'?' sq':''}"></span>${esc(o)}</span>`).join('');
      return `<div class="fc-field" data-id="${f.id}">${tools}${lbl}<div class="fc-opts">${opts}</div><input class="fc-optsinp" data-act="field-opts" data-id="${f.id}" value="${esc((f.options||[]).join(', '))}" placeholder="${S('optionsPh')}"></div>`;
    }
    if(f.type==='select' || f.type==='recipient'){
      const first = f.type==='recipient'
        ? (recipients.filter(x=>x&&x.trim())[0] || S('ph_recipient'))
        : ((f.options&&f.options[0]) || S('ph_select'));
      const optsEditor = f.type==='select'
        ? `<input class="fc-optsinp" data-act="field-opts" data-id="${f.id}" value="${esc((f.options||[]).join(', '))}" placeholder="${S('optionsPh')}">`
        : '';
      return `<div class="fc-field" data-id="${f.id}">${tools}${lbl}<div class="fc-ghost sel"><span>${esc(first)}</span><span class="fc-chev">&#9660;</span></div>${optsEditor}</div>`;
    }
    const ph = esc(S('ph_'+f.type)||'');
    const ghost = f.type==='textarea' ? `<div class="fc-ghost ta">${ph}</div>` : `<div class="fc-ghost">${ph}</div>`;
    return `<div class="fc-field" data-id="${f.id}">${tools}${lbl}${ghost}</div>`;
  }
  function renderFormCanvas(){
    const box=el('formCanvas'); if(!box) return;
    // Don't clobber an inline text field the user is typing into (preserve caret).
    const ae=document.activeElement;
    const typingInCanvas = ae && box.contains(ae) && (ae.tagName==='TEXTAREA' || (ae.tagName==='INPUT' && ae.type!=='checkbox' && ae.type!=='radio'));
    if(typingInCanvas){ const fr0=box.querySelector('.fc-frame'); if(fr0) fcThemeVars(fr0); return; }
    const title=esc(el('fName').value||'');
    const sub=esc(el('fDesc').value||'');
    const fixed = `<div class="fc-grid">`+
      `<div class="fc-fx"><label>${S('fcName')} <span class="req">*</span></label><div class="fc-ghost"></div></div>`+
      `<div class="fc-fx"><label>${S('fcPhone')}</label><div class="fc-ghost"></div></div>`+
      `<div class="fc-fx full"><label>${S('fcEmail')} <span class="req">*</span></label><div class="fc-ghost" dir="ltr">you@mail.com</div></div>`+
      `<div class="fc-fx full"><label>${S('fcMessage')}</label><div class="fc-ghost ta"></div></div>`+
      `</div>`;
    const custom = customFields.length
      ? `<div class="fc-custom">${customFields.map(fcFieldHtml).join('')}</div>`
      : `<div class="fc-empty">${S('fcEmpty')}</div>`;
    let sub2 = S('fcDropSub');
    if(maxFileMB) sub2 += ' · ' + (maxFileMB>=1000 ? (maxFileMB/1000)+' GB' : maxFileMB+' MB');
    const drop = `<div class="fc-drop"><div class="fc-drop-ic">${fcCloudSvg()}</div><div class="fc-drop-big">${S('fcDropTitle')}</div><div class="fc-drop-sub">${esc(sub2)}</div></div>`;
    box.innerHTML = `<div class="fc-frame">`+
      `<div class="fc-hero"><div class="fc-ic">${fcCloudSvg()}</div>`+
      `<input class="fc-title" data-act="canvas-title" value="${title}" placeholder="${S('fcTitlePh')}">`+
      `<input class="fc-sub" data-act="canvas-sub" value="${sub}" placeholder="${S('fcSubPh')}">`+
      `<div class="fc-hrule"></div></div>`+
      fixed + custom + drop +
      `<button class="fc-submit" type="button" tabindex="-1">${S('fcSubmit')}</button>`+
      `</div>`;
    const fr=box.querySelector('.fc-frame'); if(fr) fcThemeVars(fr);
  }

  // ---- open / close ----
  // The studio has two homes that share the SAME panels (#studioRail/#studioRail2/
  // #studioContent): docked as integral side rails flanking the create form on wide
  // screens, or the floating modal as a narrow-screen fallback. Panels are physically
  // moved between homes, so every listener bound to them survives the move.
  const DOCK_MIN = 1080;                       // min viewport width to dock on the sides
  function studioCanDock(){ return window.innerWidth >= DOCK_MIN; }
  // ----- collapsible studio nav sidebar (docked create mode) -----
  function setNavCollapsed(on, persist){
    const g=el('createGrid'); if(!g) return;
    g.classList.toggle('nav-collapsed', !!on);
    const b=el('dockNavToggle');
    if(b){ b.setAttribute('aria-expanded', on?'false':'true');
           const lbl=(typeof S==='function')?S('railToggle'):'Toggle sidebar';
           b.setAttribute('aria-label', lbl); b.setAttribute('title', lbl); }
    if(persist){ try{ KR.lsSet('kr_studio_nav_collapsed', on?'1':'0'); }catch(_){} }
  }
  function toggleNavCollapsed(){
    const g=el('createGrid');
    setNavCollapsed(!(g && g.classList.contains('nav-collapsed')), true);
  }
  function toggleStudio(){ if(studioOpen) closeStudio(); else openStudio(); }
  function openStudio(){
    if(editToken) return;                      // edit mode hosts the studio inline instead
    studioOpen=true;
    studioApplyChrome();
    placeStudio();
    const g=el('openStudio'); if(g) g.classList.add('seen');
    try{ KR.lsSet('kr_studio_seen','1'); }catch(_){}
  }
  // choose the right home for the current width, moving panels if needed, then paint
  function placeStudio(){
    if(!studioOpen) return;
    dockStudio();                 // create mode: the studio is a permanent 3-col layout (no gear, no modal)
    renderStudioRail();
    showStudioSection(studioSection||'components');
  }
  function dockStudio(){
    if(el('studio').classList.contains('show')){ el('studio').classList.remove('show'); document.body.style.overflow=''; }
    const navBody=el('dockNavBody'), ctlBody=el('dockCtlBody');
    const rail=el('studioRail'), rail2=el('studioRail2'), content=el('studioContent');
    if(!navBody||!ctlBody||!rail||!content) return;
    if(rail.parentElement!==navBody){ navBody.appendChild(rail); navBody.appendChild(rail2); }
    if(content.parentElement!==ctlBody) ctlBody.appendChild(content);
    el('dockNavTitle').textContent=S('studioTitle');
    el('dockNavSub').textContent=S('studioSub');
    const dc=el('dockClose'); if(dc) dc.setAttribute('aria-label', S('done'));
    el('createGrid').classList.add('studio-docked');
    document.body.classList.add('studio-docked');
    el('dockNav').hidden=false; el('dockCtl').hidden=false;
    { let c='0'; try{ c=ls('kr_studio_nav_collapsed')||'0'; }catch(_){} setNavCollapsed(c==='1', false); }
  }
  function undockStudio(){
    const main=document.querySelector('#studio .studio-box .studio-main') || document.querySelector('.studio-main');
    const rail=el('studioRail'), rail2=el('studioRail2'), content=el('studioContent');
    if(main && rail && content && rail.parentElement!==main){
      main.insertBefore(rail, main.firstChild);
      main.appendChild(content);
      main.appendChild(rail2);
    }
    const cg=el('createGrid'); if(cg) cg.classList.remove('studio-docked');
    document.body.classList.remove('studio-docked');
    if(el('dockNav')) el('dockNav').hidden=true;
    if(el('dockCtl')) el('dockCtl').hidden=true;
  }
  function showStudioModal(){ el('studio').classList.add('show'); document.body.style.overflow='hidden'; }
  function closeStudio(){ studioOpen=false; undockStudio(); el('studio').classList.remove('show'); document.body.style.overflow=''; }
  function studioApplyChrome(){
    el('stTitle').textContent=S('studioTitle');
    el('stSub').textContent=S('studioSub');
    el('studioDone').textContent=S('done');
    el('studioNote').innerHTML=checkCircleSvg()+'<span>'+esc(S('autosave'))+'</span>';
    const g=el('openStudio'); if(g) g.setAttribute('aria-label', S('studioTitle'));
    const dt=el('dockNavTitle'); if(dt){ dt.textContent=S('studioTitle'); el('dockNavSub').textContent=S('studioSub'); }
  }

  // ---- colour helpers (no re-render → keep picker/field focus) ----
  function setColor(key,val,inputEl){
    formTheme[key]=val;
    const row=inputEl.closest('.col-row'); if(row){ const sw=row.querySelector('.col-sw'); if(sw) sw.style.background=val; const hx=row.querySelector('.col-hex'); if(hx) hx.value=val; }
    commit();
  }
  function setColorHex(key,val,inputEl){
    val=(val||'').trim();
    if(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(val)){
      formTheme[key]=val;
      const row=inputEl.closest('.col-row'); if(row){ const sw=row.querySelector('.col-sw'); if(sw) sw.style.background=val; const ci=row.querySelector('input[type=color]'); if(ci) ci.value=val; }
      commit();
    } else if(val===''){ formTheme[key]=''; commit(); }
  }

  // ---- event delegation ----
  function studioClick(e){
    const b=e.target.closest('[data-act]'); if(!b) return;
    const act=b.getAttribute('data-act');
    if(act.indexOf('color-')===0) return;            // native colour picker → handled on input
    if(act==='add-comp'){ addField(b.getAttribute('data-type')); return; }
    if(act==='del-field'){ customFields=customFields.filter(f=>f.id!==b.getAttribute('data-id')); restructure('components'); return; }
    if(act==='field-move'){ const id=b.getAttribute('data-id'),dir=+b.getAttribute('data-dir'); const i=customFields.findIndex(f=>f.id===id),j=i+dir; if(i>-1&&j>-1&&j<customFields.length){ const tmp=customFields[i]; customFields[i]=customFields[j]; customFields[j]=tmp; commit(); } return; }
    if(act==='add-email'){ recipients.push(''); restructure('recipients'); return; }
    if(act==='del-email'){ recipients.splice(+b.getAttribute('data-i'),1); restructure('recipients'); return; }
    if(act==='type-chip'){ const k=b.getAttribute('data-type'); createTypes[k]=!createTypes[k]; b.classList.toggle('on',createTypes[k]); renderTypeChips(); commit(); return; }
    if(act==='grad'){ const g=b.getAttribute('data-g'); formTheme.gradient=(formTheme.gradient===g?'':g); restructure('design'); return; }
    if(act==='grad-clear'){ formTheme.gradient=''; restructure('design'); return; }
    if(act==='seg-width'){ formTheme.width=b.getAttribute('data-w'); restructure('design'); return; }
    if(act==='theme-reset'){ formTheme={accent:'',ink:'',bg:'',gradient:'',font:'',width:'normal'}; restructure('design'); return; }
    if(act==='after-mode'){ afterUpload.mode=b.getAttribute('data-mode'); restructure('after'); return; }
    if(act==='notif-enable'){ if('Notification'in window){ Notification.requestPermission().then(()=>{ notifyEnabled=(Notification.permission==='granted'); showStudioSection('notifications'); }); } return; }
  }
  function studioChange(e){
    const b=e.target.closest('[data-act]'); if(!b) return;
    const act=b.getAttribute('data-act');
    switch(act){
      case 'field-label': { const f=fieldById(b.getAttribute('data-id')); if(f){ f.label=b.value; commit(); } break; }
      case 'field-req': { const f=fieldById(b.getAttribute('data-id')); if(f){ f.required=b.checked; commit(); } break; }
      case 'field-opts': { const f=fieldById(b.getAttribute('data-id')); if(f){ f.options=b.value.split(',').map(s=>s.trim()).filter(Boolean); commit(); } break; }
      case 'email-inp': { recipients[+b.getAttribute('data-i')]=b.value; persistCreateSettings(); renderStudioRail(); break; }
      case 'lang': formLang=b.value; commit(); break;
      case 'maxtotal': el('fMaxTotal').value=b.value; commit(); break;
      case 'maxcount': maxCount=+b.value; commit(); break;
      case 'maxfile': maxFileMB=+b.value; commit(); break;
      case 'expiry': el('fExpiry').value=b.value; commit(); break;
      case 'pw-toggle': el('fPwToggle').checked=b.checked; el('fPassword').classList.toggle('hidden',!b.checked); commit(); showStudioSection('security'); break;
      case 'pw-input': el('fPassword').value=b.value; persistCreateSettings(); break;
      case 'notify': el('fNotify').checked=b.checked; commit(); break;
      case 'sender-name': sender.name=b.checked; commit(); break;
      case 'sender-email': sender.email=b.checked; commit(); break;
      case 'canvas-title': el('fName').value=b.value; persistCreateSettings(); break;
      case 'canvas-sub': el('fDesc').value=b.value; persistCreateSettings(); break;
      case 'thanks': el('fThanks').value=b.value; persistCreateSettings(); break;
      case 'redirect': afterUpload.redirectUrl=b.value; persistCreateSettings(); break;
      case 'allowmore': afterUpload.allowMore=b.checked; commit(); break;
      case 'font': formTheme.font=b.value; commit(); break;
      case 'color-accent': setColor('accent',b.value,b); break;
      case 'hex-accent': setColorHex('accent',b.value,b); break;
      case 'color-ink': setColor('ink',b.value,b); break;
      case 'hex-ink': setColorHex('ink',b.value,b); break;
      case 'color-bg': setColor('bg',b.value,b); break;
      case 'hex-bg': setColorHex('bg',b.value,b); break;
    }
  }

  { const dc=el('dockClose'); if(dc) dc.addEventListener('click', closeStudio); }
  { const b=el('dockNavToggle'); if(b) b.addEventListener('click', toggleNavCollapsed); }
  el('studioClose').addEventListener('click', closeStudio);
  el('studioScrim').addEventListener('click', closeStudio);
  el('studioDone').addEventListener('click', closeStudio);
  el('studioRail').addEventListener('click', e=>{ const n=e.target.closest('[data-sec]'); if(!n) return; showStudioSection(n.getAttribute('data-sec')); });
  el('studioRail2').addEventListener('click', e=>{ const n=e.target.closest('[data-sec]'); if(!n) return; showStudioSection(n.getAttribute('data-sec')); });
  el('studioContent').addEventListener('click', studioClick);
  el('studioContent').addEventListener('input', studioChange);
  el('studioContent').addEventListener('change', studioChange);
  { const fc=el('formCanvas'); if(fc){ fc.addEventListener('click', studioClick); fc.addEventListener('input', studioChange); fc.addEventListener('change', studioChange); } }
  { let rz; window.addEventListener('resize', ()=>{ if(!studioOpen||editToken) return; clearTimeout(rz); rz=setTimeout(placeStudio, 150); }); }
  studioApplyChrome();

  // ---------- init ----------
  applyTheme(ls('theme')||'light');
  applyLang(KR.detectLang());
  applyCreateDefaults(); renderPreview(); updateCount();
  requestNotifyPerm();
  const initParams=new URLSearchParams(location.search);
  const initFilesToken=initParams.get('files');
  const initEditToken=initParams.get('edit');
  const routeInit=function(){
    if(initEditToken) enterEditMode(initEditToken);
    else if(initFilesToken && KR.getRequest(initFilesToken)) openReceived(initFilesToken);
    else if(initParams.get('tab')==='manage') setView('manage');
    else if(initParams.get('tab')==='create') setView('create');
    else setView('manager');
    openStudio();  // studio panels stay permanently docked in create/manager mode
  };
  // Cross-device: hydrate this owner's requests from the server into the local
  // mirror first (instant no-op when Supabase is unconfigured), then route.
  (KR.pullMine ? KR.pullMine() : Promise.resolve()).then(function(){
    updateCount();
    const tk=initEditToken||initFilesToken;
    if(tk && !KR.getRequest(tk) && KR.pullToken){ KR.pullToken(tk).then(routeInit); }
    else routeInit();
  });
})();
</script>
</body>
</html>
