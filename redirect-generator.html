<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOLKLI — מחולל Redirect</title>
<meta name="description" content="Generate a complete, standalone HTML redirect page in your browser. Set a target URL, delay, canonical tag and a branded holding card — copy or download ready-to-host redirect.html. Fully client-side, nothing leaves your machine.">
<style>
  :root {
    --bg:#eef0f6; --panel:#ffffff; --panel-2:#f5f6fa; --line:#e5e8f0; --line-2:#eef0f6;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#7c3aed; --accent-dim:#6a2fe0; --accent-ink:#ffffff; --accent-soft:#efe9fe;
    --success:#22b04b; --success-dim:#1c9a41; --success-soft:#e6f6ec;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --danger:#e5484d; --danger-soft:#fdecec;
    --warm-soft:#fff5da; --warm-line:#f2d98a;
    --ok:#22b04b; --warn:#c88a04; --err:#e5484d;
    --grad:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-h:linear-gradient(105deg,#6a29e6 0%,#2f74f0 100%);
    --grad-soft:linear-gradient(120deg,#efe9fe,#e6f0ff);
    --grad-shadow:rgba(93,79,240,0.30);
    --grad-btn:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn-glow:rgba(59,111,246,0.38);
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-lg:0 2px 6px rgba(20,24,44,0.05), 0 20px 50px rgba(20,24,44,0.10);
    --shadow-sm:0 1px 2px rgba(20,24,44,0.05);
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --sans:'Space Grotesk',system-ui,'Segoe UI','Heebo',sans-serif;
  }
  html[data-theme="dark"] {
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a303c; --line-2:#232833;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --accent:#a06bff; --accent-dim:#7c3aed; --accent-ink:#ffffff; --accent-soft:#241a3a;
    --success:#37c26a; --success-dim:#2fae5e; --success-soft:#132a1c;
    --info:#5b95f8; --info-dim:#4f8ef7; --info-soft:#182338;
    --danger:#ff6b6b; --danger-soft:#2a1719;
    --warm-soft:#2c2718; --warm-line:#5a4d24;
    --ok:#4ec98a; --warn:#e8b84b; --err:#ff6b6b;
    --grad:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-h:linear-gradient(105deg,#9a63ff 0%,#6aa2ff 100%);
    --grad-soft:linear-gradient(120deg,#1c1633,#11242a);
    --grad-shadow:rgba(77,123,255,0.42);
    --grad-btn:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn-glow:rgba(77,123,255,0.45);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,0.45), 0 24px 60px rgba(0,0,0,0.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;}
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:var(--grad);z-index:100;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--sans);}
  .wrap{max-width:75%;margin:0 auto;padding:22px 20px 60px;zoom:1.2;}

  /* page intro */
  .pagehead{margin:4px 0 20px;}
  .pagehead h2{font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:-0.02em;margin:0 0 6px;}
  .pagehead .kick{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);
    padding:4px 11px;border-radius:999px;margin-bottom:11px;}
  .pagehead p{font-size:14.5px;color:var(--muted);margin:0;max-width:64ch;}

  /* layout */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;}
  @media (max-width:840px){ .grid{grid-template-columns:1fr;} }
  .col{min-width:0;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;}
  .card h3{font-size:15px;margin:0 0 15px;font-weight:700;}
  .card h3 .n{font-family:var(--mono);font-size:11px;color:var(--accent-dim);background:var(--accent-soft);
    padding:2px 8px;border-radius:999px;margin-inline-end:8px;}

  /* form fields */
  .field{margin-bottom:15px;}
  .field:last-child{margin-bottom:0;}
  .field > label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:7px;}
  .field .req{color:var(--danger);font-weight:700;}
  .field .hint{font-size:11px;color:var(--faint);margin-top:6px;font-family:var(--mono);line-height:1.5;}
  .inp{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;
    font-family:var(--sans);font-size:13.5px;padding:10px 12px;transition:border-color .12s,box-shadow .12s;}
  textarea.inp{resize:vertical;min-height:60px;line-height:1.5;}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .inp.bad{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft);}
  .inp::placeholder{color:var(--faint);}

  .two{display:flex;gap:12px;}
  .two .field{flex:1;margin-bottom:0;}
  @media (max-width:480px){ .two{flex-direction:column;gap:15px;} }

  /* quick delay chips */
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;}
  .chip{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:5px 11px;transition:all .12s;}
  .chip:hover{border-color:var(--accent);color:var(--accent-dim);}
  .chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-dim);}

  /* toggles */
  .tog{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);border-radius:11px;
    background:var(--panel-2);cursor:pointer;margin-bottom:10px;transition:border-color .12s;}
  .tog:last-of-type{margin-bottom:0;}
  .tog:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));}
  .tog .sw{position:relative;flex-shrink:0;width:40px;height:23px;border-radius:999px;background:var(--line);
    border:1px solid var(--line);transition:background .15s;}
  .tog .sw::after{content:'';position:absolute;top:2px;inset-inline-start:2px;width:17px;height:17px;border-radius:50%;
    background:#fff;box-shadow:var(--shadow-sm);transition:transform .16s;}
  html[dir="rtl"] .tog .sw::after{transition:transform .16s;}
  .tog.on .sw{background:var(--accent);border-color:var(--accent);}
  .tog.on .sw::after{transform:translateX(17px);}
  html[dir="rtl"] .tog.on .sw::after{transform:translateX(-17px);}
  .tog .tt{flex:1;min-width:0;}
  .tog .tt .tl{font-size:13px;font-weight:600;color:var(--ink);}
  .tog .tt .td{font-size:11px;color:var(--faint);margin-top:2px;font-family:var(--mono);line-height:1.45;}

  /* output box */
  .outbox{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);overflow:hidden;margin-bottom:12px;}
  .outbox textarea{width:100%;background:transparent;border:none;color:var(--ink);font-family:var(--mono);
    font-size:12px;line-height:1.55;padding:14px;resize:vertical;min-height:230px;display:block;}
  .outbox textarea:focus{outline:none;}
  .outactions{display:flex;gap:10px;flex-wrap:wrap;}
  .btn{flex:1;min-width:130px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 16px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid var(--line);
    background:var(--panel);color:var(--ink-2);transition:border-color .12s,transform .08s;box-shadow:var(--shadow-sm);}
  .btn:hover{border-color:var(--accent);} .btn:active{transform:translateY(1px);}
  .btn svg{width:15px;height:15px;}
  .btn.primary{color:#fff;border:none;background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    text-shadow:0 1px 2px rgba(0,0,0,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 16px var(--grad-btn-glow);}
  .btn.primary:hover{filter:brightness(1.05);border:none;}

  /* live preview */
  .previewhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px;}
  .previewhead h3{margin:0;}
  .pvnote{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.03em;color:var(--warn);
    background:var(--warm-soft);border:1px solid var(--warm-line);padding:3px 10px;border-radius:999px;}
  .pvframe{width:100%;height:320px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);display:block;}

  .seam{display:flex;align-items:flex-start;gap:8px;margin-top:16px;padding:11px 13px;border-radius:11px;
    background:var(--warm-soft);border:1px solid var(--warm-line);font-size:11.5px;color:var(--ink-2);line-height:1.55;}
  .seam svg{width:15px;height:15px;color:var(--warn);flex-shrink:0;margin-top:1px;}

  footer{margin-top:34px;text-align:center;color:var(--faint);font-size:12px;font-family:var(--mono);}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:11px 18px;border-radius:999px;
    box-shadow:var(--shadow-lg);transition:opacity .2s,transform .2s;z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
<link rel="stylesheet" href="./header.css">
</head>
<body>
<div id="site-header"></div>
<script src="./header.js"></script>
<div class="wrap">

  <div class="pagehead">
    <span class="kick" data-i18n="kick"></span>
    <h2 data-i18n="pageTitle"></h2>
    <p data-i18n="pageSub"></p>
  </div>

  <div class="grid">
    <!-- left: form -->
    <div class="col">
      <div class="card">
        <h3><span class="n">1</span><span data-i18n="formTitle"></span></h3>

        <div class="field">
          <label><span data-i18n="targetLbl"></span> <span class="req">*</span></label>
          <input type="text" class="inp" id="target" inputmode="url" placeholder="https://example.com/new-page">
          <div class="hint" id="targetErr" data-i18n="targetHint"></div>
        </div>

        <div class="two">
          <div class="field">
            <label data-i18n="delayLbl"></label>
            <input type="number" class="inp" id="delay" min="0" max="60" step="1" value="0">
            <div class="chips" id="delayChips"></div>
          </div>
        </div>

        <div class="field">
          <label data-i18n="titleLbl"></label>
          <input type="text" class="inp" id="ptitle" placeholder="">
        </div>

        <div class="field">
          <label data-i18n="msgLbl"></label>
          <textarea class="inp" id="msg" placeholder=""></textarea>
          <div class="hint" data-i18n="msgHint"></div>
        </div>

        <div class="field">
          <div class="tog on" id="togCanon" role="switch" aria-checked="true" tabindex="0">
            <span class="sw"></span>
            <span class="tt"><span class="tl" data-i18n="canonTl"></span><span class="td" data-i18n="canonTd"></span></span>
          </div>
          <div class="tog" id="togQuery" role="switch" aria-checked="false" tabindex="0">
            <span class="sw"></span>
            <span class="tt"><span class="tl" data-i18n="queryTl"></span><span class="td" data-i18n="queryTd"></span></span>
          </div>
        </div>
      </div>
    </div>

    <!-- right: output + preview -->
    <div class="col">
      <div class="card" style="margin-bottom:18px;">
        <h3><span class="n">2</span><span data-i18n="outTitle"></span></h3>
        <div class="outbox">
          <textarea id="out" readonly spellcheck="false"></textarea>
        </div>
        <div class="outactions">
          <button class="btn primary" id="copyBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span data-i18n="copyBtn"></span>
          </button>
          <button class="btn" id="dlBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span data-i18n="dlBtn"></span>
          </button>
        </div>
      </div>

      <div class="card">
        <div class="previewhead">
          <h3><span class="n">3</span><span data-i18n="previewTitle"></span></h3>
          <span class="pvnote" data-i18n="pvNote"></span>
        </div>
        <iframe class="pvframe" id="preview" title="preview" sandbox="allow-same-origin"></iframe>
        <div class="seam">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span data-i18n="seam"></span>
        </div>
      </div>
    </div>
  </div>

  <footer data-i18n="foot"></footer>
</div>
<div class="toast" id="toast"></div>

<script>

  let lang='he', t=I18N.he;
  const DELAY_PRESETS=[0,3,5,10];

  // ---- helpers ----
  function ls(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
  function toast(m){ const e=el('toast'); e.textContent=m; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),1800); }

  // Escape for an HTML attribute context (double-quoted attributes).
  function escAttr(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  // Escape for HTML text content.
  function escHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  // Escape for a single-quoted JS string literal.
  function escJs(s){
    return String(s)
      .replace(/\\/g,'\\\\').replace(/'/g,"\\'")
      .replace(/\r/g,'\\r').replace(/\n/g,'\\n')
      .replace(/</g,'\\x3c').replace(/>/g,'\\x3e')
      .replace(/ /g,'\\u2028').replace(/ /g,'\\u2029');
  }

  function normalizeTarget(raw){
    const v=(raw||'').trim();
    if(!v) return { url:'', ok:false, empty:true };
    let ok=false, url=v;
    if(/^https?:\/\//i.test(v)){
      try{ new URL(v); ok=true; }catch(_){ ok=false; }
    }
    return { url, ok, empty:false };
  }

  function getState(){
    const target=normalizeTarget(el('target').value);
    let delay=parseInt(el('delay').value,10);
    if(!isFinite(delay)||delay<0) delay=0;
    if(delay>3600) delay=3600;
    return {
      target,
      delay,
      title:(el('ptitle').value||'').trim(),
      msg:(el('msg').value||'').trim(),
      canon: el('togCanon').classList.contains('on'),
      passQuery: el('togQuery').classList.contains('on'),
    };
  }

  // ---- build the generated document ----
  // `forPreview` strips the meta-refresh + the auto-redirect script and shows a banner.
  function buildDoc(st, forPreview){
    const targetAttr = escAttr(st.target.url);        // for href / content / canonical attributes
    const targetJs   = escJs(st.target.url);          // for JS string literal
    const pageTitle  = st.title || t.genTitle;
    const message    = st.msg || t.genDefaultMsg;
    const manual     = t.genManual;
    const dir        = t.dir;
    const htmlLang   = lang;

    const head=[];
    head.push('<meta charset="UTF-8">');
    head.push('<meta name="viewport" content="width=device-width, initial-scale=1.0">');
    if(!forPreview){
      head.push('<meta http-equiv="refresh" content="'+st.delay+';url='+targetAttr+'">');
    }
    if(st.canon){
      head.push('<link rel="canonical" href="'+targetAttr+'">');
    }
    head.push('<title>'+escHtml(pageTitle)+'</title>');

    // Inline styling for the branded card (self-contained, on-brand purple->blue).
    const style =
'<style>\n'+
'  :root{--grad:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);--ink:#1c2030;--muted:#6b7280;--card:#ffffff;--bg:#eef0f6;--line:#e5e8f0;}\n'+
'  @media (prefers-color-scheme:dark){:root{--ink:#eef1f6;--muted:#9aa1b1;--card:#161a22;--bg:#0d0f14;--line:#2a303c;}}\n'+
'  *{box-sizing:border-box;}\n'+
'  html,body{margin:0;height:100%;}\n'+
'  body{background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI","Heebo",sans-serif;\n'+
'    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}\n'+
'  body::before{content:"";position:fixed;top:0;left:0;right:0;height:4px;background:var(--grad);}\n'+
'  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:440px;width:100%;\n'+
'    padding:38px 32px;text-align:center;box-shadow:0 20px 50px rgba(20,24,44,.12);}\n'+
'  .spin{width:46px;height:46px;margin:0 auto 20px;border-radius:50%;border:4px solid var(--line);\n'+
'    border-top-color:#7b34ff;animation:sp 1s linear infinite;}\n'+
'  @keyframes sp{to{transform:rotate(360deg);}}\n'+
'  h1{font-size:20px;margin:0 0 10px;font-weight:700;letter-spacing:-.01em;}\n'+
'  p{font-size:14.5px;color:var(--muted);margin:0 0 22px;line-height:1.55;}\n'+
'  a.go{display:inline-block;background:var(--grad);color:#fff;text-decoration:none;font-weight:600;\n'+
'    font-size:14px;padding:12px 26px;border-radius:999px;box-shadow:0 8px 20px rgba(59,111,246,.32);}\n'+
'  .pvbanner{background:#fff5da;color:#8a6d1a;border:1px solid #f2d98a;border-radius:10px;\n'+
'    font-size:12px;font-weight:600;padding:8px 12px;margin:0 0 18px;}\n'+
'</style>';

    // Body: banner (preview only) + visible card + noscript fallback link
    const bodyParts=[];
    if(forPreview){
      bodyParts.push('  <div class="pvbanner">'+escHtml(t.genPvBanner)+'</div>');
    }
    bodyParts.push('  <div class="card">');
    bodyParts.push('    <div class="spin"></div>');
    bodyParts.push('    <h1>'+escHtml(pageTitle)+'</h1>');
    bodyParts.push('    <p>'+escHtml(message)+'</p>');
    bodyParts.push('    <a class="go" href="'+targetAttr+'">'+escHtml(manual)+'</a>');
    bodyParts.push('  </div>');

    // JS fallback (skipped in preview so nothing navigates).
    let script='';
    if(!forPreview){
      const passQ = st.passQuery ? 'true' : 'false';
      script =
'<script>\n'+
'(function(){\n'+
"  var target = '"+targetJs+"';\n"+
'  var passQuery = '+passQ+';\n'+
'  if(passQuery){\n'+
'    var qs = window.location.search;\n'+
'    if(qs){\n'+
'      try{\n'+
'        var u = new URL(target, window.location.href);\n'+
'        var extra = new URLSearchParams(qs);\n'+
'        extra.forEach(function(v,k){ u.searchParams.set(k,v); });\n'+
'        target = u.href;\n'+
'      }catch(e){\n'+
'        target += (target.indexOf("?")===-1 ? "?" : "&") + qs.replace(/^[?]/,"");\n'+
'      }\n'+
'    }\n'+
'  }\n'+
'  var go = function(){ window.location.replace(target); };\n'+
'  var delay = '+st.delay+';\n'+
'  if(delay > 0){ setTimeout(go, delay*1000); } else { go(); }\n'+
'})();\n'+
'<\/script>';
    }

    // <noscript> holding link so it still works with JS disabled + before meta refresh fires
    const noscript = '<noscript><meta http-equiv="refresh" content="'+st.delay+';url='+targetAttr+'"></noscript>';

    const doc =
'<!DOCTYPE html>\n'+
'<html lang="'+escAttr(htmlLang)+'" dir="'+escAttr(dir)+'">\n'+
'<head>\n'+
head.map(function(l){return '  '+l;}).join('\n')+'\n'+
(forPreview ? '' : ('  '+noscript+'\n'))+
style.split('\n').map(function(l){return l;}).join('\n')+'\n'+
'</head>\n'+
'<body>\n'+
bodyParts.join('\n')+'\n'+
(script ? (script+'\n') : '')+
'</body>\n'+
'</html>\n';

    return doc;
  }

  // ---- render output + preview ----
  function render(){
    const st=getState();

    // target validation styling
    const tInp=el('target'), tErr=el('targetErr');
    if(st.target.empty){
      tInp.classList.remove('bad'); tErr.textContent=t.targetHint;
    } else if(!st.target.ok){
      tInp.classList.add('bad'); tErr.textContent=t.targetErrBad;
    } else {
      tInp.classList.remove('bad'); tErr.textContent=t.targetHint;
    }

    // delay chips active state
    const dv=st.delay;
    document.querySelectorAll('#delayChips .chip').forEach(c=>{
      c.classList.toggle('on', parseInt(c.getAttribute('data-d'),10)===dv);
    });

    // Use a safe placeholder target so the output is always a complete, valid doc,
    // but keep it obviously-a-placeholder until a real URL is entered.
    const outState = Object.assign({}, st);
    if(!st.target.ok){
      outState.target = { url:'https://example.com/', ok:true, empty:false };
    }

    const full = buildDoc(outState, false);
    el('out').value = full;

    const pv = buildDoc(outState, true);
    el('preview').srcdoc = pv;
  }

  // ---- copy / download ----
  function copyText(str){
    const done=()=>toast(t.copied);
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(str).then(done).catch(()=>fallback(str,done)); }
    else fallback(str,done);
  }
  function fallback(str,cb){ const ta=document.createElement('textarea'); ta.value=str; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} ta.remove(); cb&&cb(); }

  function downloadHtml(){
    const str=el('out').value;
    const blob=new Blob([str],{type:'text/html;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='redirect.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  }

  // ---- delay chips ----
  function renderChips(){
    el('delayChips').innerHTML = DELAY_PRESETS.map(d=>
      `<button type="button" class="chip" data-d="${d}">${d}s</button>`).join('');
  }

  // ---- i18n + theme ----
  function applyLang(l){
    lang=l; t=I18N[l];
    document.documentElement.lang=l; document.documentElement.dir=t.dir;
    document.querySelectorAll('[data-i18n]').forEach(n=>{ const k=n.getAttribute('data-i18n'); if(typeof t[k]==='string') n.textContent=t[k]; });
    // localized placeholders
    el('ptitle').setAttribute('placeholder', t.titlePh);
    el('msg').setAttribute('placeholder', t.msgPh);
    try{ localStorage.setItem('ac_lang', l); }catch(_){}
    render();
  }
  function detectLang(){
    const chosen=ls('ac_lang'); if(chosen) return chosen;
    const cc=ls('ac_country'); if(cc) return cc==='IL'?'he':'en';
    let tz=''; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(_){}
    const navHe=(navigator.language||'').toLowerCase().indexOf('he')===0;
    return (tz==='Asia/Jerusalem'||navHe)?'he':'en';
  }
  function applyTheme(th){
    const dark=(th==='dark');
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
    const ti=el('themeIco'); if(ti) ti.textContent = dark?'☀️':'🌙';
    try{ localStorage.setItem('theme', dark?'dark':'light'); }catch(_){}
  }

  // ---- events ----
  ['target','delay','ptitle','msg'].forEach(id=> el(id).addEventListener('input', render));

  function bindTog(id){
    const t2=el(id);
    const flip=()=>{ t2.classList.toggle('on'); t2.setAttribute('aria-checked', t2.classList.contains('on')?'true':'false'); render(); };
    t2.addEventListener('click', flip);
    t2.addEventListener('keydown', e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); flip(); } });
  }
  bindTog('togCanon'); bindTog('togQuery');

  el('delayChips').addEventListener('click', e=>{
    const b=e.target.closest('[data-d]'); if(!b) return;
    el('delay').value=b.getAttribute('data-d'); render();
  });

  el('copyBtn').addEventListener('click', ()=>copyText(el('out').value));
  el('dlBtn').addEventListener('click', downloadHtml);

  window.__setLang=applyLang;
  el('themeToggle').addEventListener('click',()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));

  // ---- init ----
  renderChips();
  applyTheme(ls('theme')||'light');
  applyLang(detectLang());
})();
</script>
</body>
</html>
