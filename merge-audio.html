<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOLKLI — מיזוג אודיו</title>
<meta name="description" content="Merge several audio files into one track. Fast, simple and professional-quality.">
<style>
  :root {
    --bg:#eef0f6; --panel:#ffffff; --panel-2:#f5f6fa; --line:#e5e8f0; --line-2:#eef0f6;
    --ink:#1c2030; --ink-2:#2b3140; --muted:#727a8a; --faint:#9aa1b1;
    --accent:#7c3aed; --accent-dim:#6a2fe0; --accent-ink:#ffffff; --accent-soft:#efe9fe;
    --success:#22b04b; --success-dim:#1c9a41; --success-soft:#e6f6ec;
    --info:#3b82f6; --info-dim:#2f6fd6; --info-soft:#e8f0fe;
    --danger:#e5484d; --danger-soft:#fdecec;
    --warm-soft:#fff5da; --warm-line:#f2d98a;
    --ok:#22b04b; --warn:#c88a04; --err:#e5484d;
    --grad:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-h:linear-gradient(105deg,#6a29e6 0%,#2f74f0 100%);
    --grad-soft:linear-gradient(120deg,#efe9fe,#e6f0ff);
    --grad-shadow:rgba(93,79,240,0.30);
    --grad-btn:linear-gradient(105deg,#7b34ff 0%,#3f85ff 100%);
    --grad-btn-glow:rgba(59,111,246,0.38);
    --shadow:0 1px 2px rgba(20,24,44,0.04), 0 8px 26px rgba(20,24,44,0.06);
    --shadow-lg:0 2px 6px rgba(20,24,44,0.05), 0 20px 50px rgba(20,24,44,0.10);
    --shadow-sm:0 1px 2px rgba(20,24,44,0.05);
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
    --sans:'Space Grotesk',system-ui,'Segoe UI','Heebo',sans-serif;
  }
  html[data-theme="dark"] {
    --bg:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a303c; --line-2:#232833;
    --ink:#eef1f6; --ink-2:#dfe4ee; --muted:#8b93a4; --faint:#6b7280;
    --accent:#a06bff; --accent-dim:#7c3aed; --accent-ink:#ffffff; --accent-soft:#241a3a;
    --success:#37c26a; --success-dim:#2fae5e; --success-soft:#132a1c;
    --info:#5b95f8; --info-dim:#4f8ef7; --info-soft:#182338;
    --danger:#ff6b6b; --danger-soft:#2a1719;
    --warm-soft:#2c2718; --warm-line:#5a4d24;
    --ok:#4ec98a; --warn:#e8b84b; --err:#ff6b6b;
    --grad:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-h:linear-gradient(105deg,#9a63ff 0%,#6aa2ff 100%);
    --grad-soft:linear-gradient(120deg,#1c1633,#11242a);
    --grad-shadow:rgba(77,123,255,0.42);
    --grad-btn:linear-gradient(105deg,#8f52ff 0%,#5a97ff 100%);
    --grad-btn-glow:rgba(77,123,255,0.45);
    --shadow:0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,0.45), 0 24px 60px rgba(0,0,0,0.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;}
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:var(--grad);z-index:100;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--sans);}
  .wrap{width:100%;max-width:none;margin:0 auto;padding:22px 20px 60px;}

  /* page intro */
  .pagehead{margin:4px 0 20px;}
  .pagehead h2{font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:-0.02em;margin:0 0 6px;}
  .pagehead .kick{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);
    padding:4px 11px;border-radius:999px;margin-bottom:11px;}
  .pagehead p{font-size:14.5px;color:var(--muted);margin:0;max-width:64ch;}

  /* layout */
  .grid{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start;}
  @media (max-width:840px){ .grid{grid-template-columns:1fr;} }
  .col{min-width:0;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);}

  /* dropzone */
  .drop{border:2.5px dashed color-mix(in srgb,var(--accent) 55%,var(--line));border-radius:16px;padding:40px 20px;text-align:center;cursor:pointer;
    background:var(--panel-2);transition:border-color .15s,background .15s;margin-bottom:16px;
    min-height:400px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);}
  .drop .cloud{width:72px;height:72px;margin:0 auto 16px;border-radius:18px;display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);color:var(--accent);}
  .drop .cloud svg{width:36px;height:36px;}
  .drop .big{font-size:21px;font-weight:600;color:var(--ink);}
  .drop .or{font-size:15px;color:var(--faint);margin:8px 0;font-family:var(--mono);}
  .drop .choose{display:inline-flex;align-items:center;gap:8px;color:#fff;border:none;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:600;font-size:18px;padding:14px 30px;border-radius:999px;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.14),0 6px 16px var(--grad-btn-glow);transition:filter .14s,transform .08s;}
  .drop .choose:hover{filter:brightness(1.05);} .drop .choose:active{transform:translateY(1px);}
  .drop .sizenote{margin-top:12px;font-size:11.5px;color:var(--faint);font-family:var(--mono);}
  input[type=file]{display:none;}

  /* file list */
  .files{display:flex;flex-direction:column;}
  .flisthead{display:flex;align-items:center;justify-content:space-between;padding:13px 16px 3px;}
  .flisthead .ttl{font-size:13px;font-weight:700;color:var(--ink-2);}
  .flisthead .reorder{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted);
    background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;transition:all .12s;}
  .flisthead .reorder:hover{border-color:var(--accent);color:var(--accent-dim);}
  .flisthead .reorder svg{width:13px;height:13px;}
  .flist{display:flex;flex-direction:column;gap:8px;padding:10px 14px 4px;}
  .frow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line-2);border-radius:11px;background:var(--panel);
    transition:box-shadow .12s,border-color .12s,opacity .12s;}
  .frow.bad{border-color:var(--warm-line);background:var(--warm-soft);}
  .frow.dragging{opacity:.4;}
  .frow.over-top{box-shadow:0 -2px 0 var(--accent);}
  .frow.over-bot{box-shadow:0 2px 0 var(--accent);}
  .frow .grip{width:22px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--faint);cursor:grab;}
  .frow .grip:active{cursor:grabbing;}
  .frow .grip svg{width:16px;height:16px;}
  .frow .ord{width:24px;height:24px;flex-shrink:0;border-radius:7px;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:11.5px;font-weight:700;background:var(--accent-soft);color:var(--accent-dim);}
  .frow.bad .ord{background:transparent;color:var(--warn);}
  .frow .fico{width:32px;height:32px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);}
  .frow.bad .fico{background:transparent;color:var(--warn);}
  .frow .fico svg{width:16px;height:16px;}
  .frow .fn{flex:1;min-width:0;}
  .frow .fn .nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .frow .fn .sz{font-family:var(--mono);font-size:11px;color:var(--faint);}
  .frow .fn .warnt{font-size:11px;color:var(--warn);font-weight:600;}
  .frow .acts{display:flex;align-items:center;gap:4px;flex-shrink:0;}
  .frow .mv{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;}
  .frow .mv:hover:not(:disabled){border-color:var(--accent);color:var(--accent-dim);}
  .frow .mv:disabled{opacity:.35;cursor:not-allowed;}
  .frow .mv svg{width:14px;height:14px;}
  .frow .rm{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;}
  .frow .rm:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft);}
  .frow .rm svg{width:14px;height:14px;}
  .ftot{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line-2);
    font-size:13px;color:var(--muted);margin-top:6px;}
  .ftot b{color:var(--ink);font-family:var(--mono);}
  .ftot .dur{color:var(--accent-dim);}

  /* options side */
  .side{padding:18px;position:sticky;top:16px;}
  .side h3{font-size:15px;margin:0 0 14px;font-weight:700;}
  .opt{margin-bottom:16px;}
  .opt > label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:7px;}
  .inp{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;
    font-family:var(--sans);font-size:13.5px;padding:10px 12px;transition:border-color .12s,box-shadow .12s;}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  select.inp{cursor:pointer;}
  .namewrap{display:flex;align-items:stretch;}
  .namewrap .inp{border-start-end-radius:0;border-end-end-radius:0;}
  .namewrap .suffix{display:flex;align-items:center;padding:0 12px;font-family:var(--mono);font-size:12.5px;color:var(--muted);
    background:var(--panel);border:1px solid var(--line);border-inline-start:none;border-start-end-radius:10px;border-end-end-radius:10px;}

  /* format picker */
  .fmts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
  .fmt{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 4px 9px;border-radius:11px;
    border:1px solid var(--line);background:var(--panel-2);cursor:pointer;transition:border-color .12s,background .12s,transform .08s;}
  .fmt:hover{border-color:var(--accent);}
  .fmt:active{transform:scale(.97);}
  .fmt.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--shadow-sm);}
  .fmt b{font-size:13px;font-weight:700;letter-spacing:.01em;color:var(--ink);}
  .fmt small{font-size:9.5px;color:var(--faint);font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em;direction:ltr;}
  .fmt.on b{color:var(--accent-dim);}
  .fmt.soon{cursor:not-allowed;opacity:.62;}
  .fmt.soon:hover{border-color:var(--line);}
  .fmt .tag{position:absolute;top:-7px;inset-inline-end:-5px;font-family:var(--mono);font-size:8.5px;font-weight:700;
    text-transform:uppercase;letter-spacing:.04em;color:var(--warn);background:var(--warm-soft);border:1px solid var(--warm-line);
    border-radius:6px;padding:1px 5px;}

  .stat{display:flex;gap:10px;margin-bottom:16px;}
  .stat .box{flex:1;text-align:center;background:var(--panel-2);border:1px solid var(--line-2);border-radius:11px;padding:11px 6px;}
  .stat .box .v{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--accent-dim);line-height:1.1;}
  .stat .box .k{font-size:11px;color:var(--muted);margin-top:3px;}

  .gobtn{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:9px;color:#fff;border:none;cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--grad-btn);
    font-weight:600;font-size:15px;padding:13px 20px;border-radius:999px;text-shadow:0 1px 2px rgba(0,0,0,.18);margin-top:4px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px rgba(0,0,0,.14),0 8px 20px var(--grad-btn-glow);
    transition:filter .14s,transform .08s;}
  .gobtn:hover{filter:brightness(1.05);} .gobtn:active{transform:translateY(1px);}
  .gobtn:disabled{opacity:.5;cursor:not-allowed;filter:none;transform:none;}
  .gobtn svg{width:17px;height:17px;}
  .opterr{font-size:11.5px;color:var(--danger);margin-top:8px;min-height:14px;text-align:center;}

  /* progress */
  .prog{padding:16px;display:none;margin-top:18px;}
  .prog.show{display:block;}
  .prog .lbl{font-size:13px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;gap:12px;}
  .prog .lbl .fn2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .bar{height:10px;border-radius:999px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line-2);}
  .bar i{display:block;height:100%;width:0;background:var(--grad);border-radius:999px;transition:width .2s ease;}

  /* result */
  .result{padding:22px;display:none;margin-top:18px;}
  .result.show{display:block;}
  .result .ok{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    background:var(--success-soft);color:var(--success-dim);}
  .result .ok svg{width:28px;height:28px;}
  .result h3{text-align:center;font-size:19px;margin:0 0 4px;}
  .result .subt{text-align:center;font-size:13px;color:var(--muted);margin:0 0 18px;}
  .rlist{display:flex;flex-direction:column;gap:8px;max-width:560px;margin:0 auto 18px;}
  .rrow{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line-2);border-radius:12px;background:var(--panel-2);}
  .rrow .rico{width:38px;height:38px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);}
  .rrow .rico svg{width:19px;height:19px;}
  .rrow .rn{flex:1;min-width:0;}
  .rrow .rn .nm{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rrow .rn .sz{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:2px;}
  .result .player{max-width:560px;margin:0 auto 18px;}
  .result .player audio{width:100%;border-radius:999px;}
  .result .row2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:560px;margin:0 auto;}
  .result .row2 button{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 22px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid var(--line);
    background:var(--panel);color:var(--ink-2);transition:border-color .12s,transform .08s;box-shadow:var(--shadow-sm);}
  .result .row2 button:hover{border-color:var(--accent);} .result .row2 button:active{transform:translateY(1px);}
  .result .row2 svg{width:15px;height:15px;}
  .result .row2 .primary{color:#fff;border:none;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--grad-btn);
    text-shadow:0 1px 2px rgba(0,0,0,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 16px var(--grad-btn-glow);}

  .seam{display:flex;align-items:flex-start;gap:8px;margin-top:16px;padding:11px 13px;border-radius:11px;
    background:var(--warm-soft);border:1px solid var(--warm-line);font-size:11.5px;color:var(--ink-2);line-height:1.55;}
  .seam svg{width:15px;height:15px;color:var(--warn);flex-shrink:0;margin-top:1px;}

  footer{margin-top:34px;text-align:center;color:var(--faint);font-size:12px;font-family:var(--mono);}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:11px 18px;border-radius:999px;
    box-shadow:var(--shadow-lg);transition:opacity .2s,transform .2s;z-index:200;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
<link rel="stylesheet" href="./header.css">
</head>
<body>
<div id="site-header"></div>
<script src="./header.js"></script>
<div class="wrap">

  <div class="pagehead">
    <span class="kick" data-i18n="kick"></span>
    <h2 data-i18n="pageTitle"></h2>
    <p data-i18n="pageSub"></p>
  </div>

  <div class="grid" id="composer">
    <!-- main: upload + files -->
    <div class="col">
      <div class="drop" id="drop">
        <div class="cloud"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
        <div class="big" data-i18n="dropBig"></div>
        <div class="or" data-i18n="or2"></div>
        <button class="choose" type="button" id="chooseBtn" data-i18n="choose"></button>
        <div class="sizenote" data-i18n="sizeNote"></div>
      </div>
      <input type="file" id="fileInput" accept="audio/*" multiple>

      <div class="card files" id="filesCard" style="display:none">
        <div class="flisthead">
          <span class="ttl" data-i18n="orderTtl"></span>
          <button class="reorder" id="reverseBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 6h18"/><path d="m7 22-4-4 4-4"/><path d="M21 18H3"/></svg>
            <span data-i18n="reverse"></span>
          </button>
        </div>
        <div class="flist" id="flist"></div>
        <div class="ftot">
          <span data-i18n="totalLbl"></span>
          <span><b id="totalVal">0</b> · <span class="dur" id="durVal"></span></span>
        </div>
      </div>
    </div>

    <!-- side: options -->
    <div class="col">
      <div class="card side">
        <h3 data-i18n="optTitle"></h3>

        <div class="stat">
          <div class="box"><div class="v" id="stFiles">0</div><div class="k" data-i18n="stFiles"></div></div>
          <div class="box"><div class="v" id="stDur">0:00</div><div class="k" data-i18n="stDur"></div></div>
        </div>

        <div class="opt">
          <label data-i18n="fmtLbl"></label>
          <div class="fmts" id="fmts"></div>
        </div>

        <div class="opt">
          <label data-i18n="gapLbl"></label>
          <select class="inp" id="gap">
            <option value="0" data-i18n="gapNone"></option>
            <option value="0.5">0.5s</option>
            <option value="1">1s</option>
            <option value="2">2s</option>
            <option value="3">3s</option>
          </select>
        </div>

        <div class="opt">
          <label data-i18n="nameLbl"></label>
          <div class="namewrap">
            <input class="inp" id="outName" type="text" spellcheck="false">
            <span class="suffix" id="suffix">.wav</span>
          </div>
        </div>

        <button class="gobtn" id="goBtn" type="button" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
          <span data-i18n="goBtn"></span>
        </button>
        <div class="opterr" id="optErr"></div>
      </div>
    </div>
  </div>

  <!-- progress -->
  <div class="card prog" id="progCard">
    <div class="lbl"><span class="fn2" id="progName" data-i18n="merging"></span><span id="progPct">0%</span></div>
    <div class="bar"><i id="progBar"></i></div>
  </div>

  <!-- result -->
  <div class="card result" id="resultCard">
    <div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h3 data-i18n="readyTitle"></h3>
    <p class="subt" id="readySub"></p>
    <div class="rlist" id="rlist"></div>
    <div class="player" id="player"></div>
    <div class="row2">
      <button id="dlBtn" class="primary" type="button">

        <span data-i18n="download"></span>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const el = id => document.getElementById(id);

  const I18N = {
    he:{
      dir:'rtl', langIco:'EN',
      kick:'אודיו · מיזוג אודיו',
      pageTitle:'מזגו כמה קובצי אודיו לרצועה אחת',
      pageSub:'גררו כמה קובצי אודיו, סדרו אותם בסדר הרצוי, הוסיפו מרווח שקט ביניהם ומזגו אותם לקובץ אחד רציף. מהיר, פשוט ובאיכות מקצועית.',
      dropBig:'גררו קובצי אודיו לכאן', or2:'או', choose:'בחרו קבצים',
      sizeNote:'MP3 · WAV · M4A · AAC · FLAC · OGG · OPUS',
      remove:'הסרה', totalLbl:'סה״כ', orderTtl:'סדר המיזוג', reverse:'הפוך סדר',
      moveUp:'הזז למעלה', moveDown:'הזז למטה',

      gapLbl:'מרווח בין רצועות', gapNone:'ללא מרווח',

      goBtn:'מזגו אודיו', merging:'ממזג…', decoding:'מפענח אודיו…',
      readyTitle:'האודיו המאוחד מוכן!', readySub:(f,d)=>`${f} קבצים מוזגו לרצועה אחת באורך ${d}.`,
      download:'הורדת האודיו', againBtn:'מיזוג נוסף',

      foot:'KOLKLI · מיזוג אודיו. מהיר, פשוט ובאיכות מקצועית.',

    en:{

      dropBig:'Drag audio files here', or2:'or', choose:'Choose files',
      sizeNote:'MP3 · WAV · M4A · AAC · FLAC · OGG · OPUS',
      remove:'Remove', totalLbl:'Total', orderTtl:'Merge order', reverse:'Reverse',
      moveUp:'Move up', moveDown:'Move down',
      optTitle:'Merge options', stFiles:'Files', stDur:'Duration',
      fmtLbl:'Target format',
      gapLbl:'Gap between tracks', gapNone:'No gap',
      nameLbl:'Merged file name', defName:'merged-audio',
      goBtn:'Merge audio', merging:'Merging…', decoding:'Decoding audio…',
      readyTitle:'Your merged audio is ready!', readySub:(f,d)=>`${f} files merged into one ${d} track.`,
      download:'Download audio', againBtn:'Merge more',
      loadingDur:'reading…',
      seam:'Fast and simple: upload and get a professional-quality result in seconds — no installs, no hassle.',
      foot:'KOLKLI · Merge Audio. Fast, simple and professional-quality.',
      copied:'Copied ✓',
      errNone:'Add at least two valid audio files to merge',
      errFail:'Merge failed. Make sure the files are valid and in a supported format.',
      badDecode:'Unsupported or corrupt file',
    },
    ru:{
      dir:'ltr',
      kick:'Аудио · Объединение аудио',
      pageTitle:'Объедините несколько аудиофайлов в один трек',
      pageSub:'Перетащите аудиофайлы, расставьте их в нужном порядке, добавьте по желанию тихую паузу между ними и объедините в один непрерывный трек. Быстро, просто и профессионального качества.',
      dropBig:'Перетащите аудиофайлы сюда', or2:'или', choose:'Выбрать файлы',
      sizeNote:'MP3 · WAV · M4A · AAC · FLAC · OGG · OPUS',
      remove:'Удалить', totalLbl:'Всего', orderTtl:'Порядок объединения', reverse:'Обратить',
      moveUp:'Вверх', moveDown:'Вниз',
      optTitle:'Параметры объединения', stFiles:'Файлы', stDur:'Длительность',
      fmtLbl:'Целевой формат',
      gapLbl:'Пауза между треками', gapNone:'Без паузы',
      nameLbl:'Имя объединённого файла', defName:'merged-audio',
      goBtn:'Объединить аудио', merging:'Объединение…', decoding:'Декодирование аудио…',
      readyTitle:'Ваше объединённое аудио готово!', readySub:(f,d)=>`Объединено файлов: ${f} в один трек · ${d}.`,
      download:'Скачать аудио', againBtn:'Ещё объединение',
      loadingDur:'чтение…',
      seam:'Быстро и просто: загрузите и получите результат профессионального качества за секунды — без установок и лишних действий.',
      foot:'KOLKLI · Объединение аудио. Быстро, просто и профессионального качества.',
      copied:'Скопировано ✓',
      errNone:'Добавьте хотя бы два корректных аудиофайла для объединения',
      errFail:'Объединение не удалось. Убедитесь, что файлы корректны и в поддерживаемом формате.',
      badDecode:'Неподдерживаемый или повреждённый файл',
    },
  };

  // target formats — WAV is fully implemented client-side; the rest arrive with the server engine.
  const FORMATS = [
    { id:'wav', label:'WAV', ext:'wav', sub:'lossless', ready:true  },
    { id:'mp3', label:'MP3', ext:'mp3', sub:'320 kbps', ready:false },
    { id:'m4a', label:'M4A', ext:'m4a', sub:'AAC',      ready:false },
  ];

  const ICON = {
    audio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
    warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
    grip:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
    up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>',
    down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
    trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  };

  let lang='he', t=I18N.he;
  let files=[];          // {id,file,name,size,status:'loading'|'ready'|'bad',buffer,dur}
  let fmt='wav';
  let result=null;       // {name,url,size,dur,files}
  let uid=1, running=false, nameEdited=false;
  let audioCtx=null;

  function fmtBytes(n){ if(n==null) return '—'; if(n>=1073741824) return (n/1073741824).toFixed(2)+' GB'; if(n>=1048576) return (n/1048576).toFixed(1)+' MB'; if(n>=1024) return (n/1024).toFixed(0)+' KB'; return n+' B'; }
  function fmtDur(sec){ if(sec==null||!isFinite(sec)) return '—'; sec=Math.round(sec); const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60; const pad=n=>String(n).padStart(2,'0'); return h>0?`${h}:${pad(m)}:${pad(s)}`:`${m}:${pad(s)}`; }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function safeName(s){ return String(s||'').replace(/[\\/:*?"<>|]+/g,'').trim(); }
  function baseName(name){ return String(name||'audio').replace(/\.[^.\/\\]+$/,''); }
  function totalBytes(){ return files.reduce((a,f)=>a+f.size,0); }
  function readyFiles(){ return files.filter(f=>f.status==='ready'); }
  function totalDur(){ return files.reduce((a,f)=>a+(f.status==='ready'?(f.dur||0):0),0); }
  function curFmt(){ return FORMATS.find(f=>f.id===fmt) || FORMATS[0]; }
  function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }
  function toast(msg){ const e=el('toast'); e.textContent=msg; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),1600); }
  function getCtx(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }

  // ---- format picker ----
  function renderFmts(){
    el('fmts').innerHTML = FORMATS.map(f=>`
      <button type="button" class="fmt ${f.id===fmt?'on':''} ${f.ready?'':'soon'}" data-fmt="${f.id}" ${f.ready?'':'disabled'}>
        ${f.ready?'':`<span class="tag">${lang==='he'?'בקרוב':'soon'}</span>`}
        <b>${f.label}</b><small>${f.sub}</small>
      </button>`).join('');
    el('suffix').textContent = '.'+curFmt().ext;
  }

  // ---- intake ----
  function addFiles(list){
    Array.from(list||[]).forEach(file=>{
      const looksAudio = (file.type||'').indexOf('audio')===0 || /\.(mp3|wav|m4a|aac|flac|ogg|oga|opus|weba|wma|aif|aiff)$/i.test(file.name);
      const f = { id:'f'+(uid++), file, name:file.name, size:file.size,
                  status: looksAudio?'loading':'bad', buffer:null, dur:null };
      files.push(f);
      if(looksAudio) probe(f);
    });
    renderFiles();
  }

  // decode with Web Audio to validate + get duration, caching the buffer for the merge
  async function probe(f){
    try{
      const arr = await f.file.arrayBuffer();
      const buffer = await getCtx().decodeAudioData(arr.slice(0));
      f.buffer = buffer; f.dur = buffer.duration; f.status='ready';
    }catch(_){
      f.status='bad'; f.buffer=null; f.dur=null;
    }
    renderFiles();
  }

  function removeFile(id){ files=files.filter(f=>f.id!==id); renderFiles(); }
  function moveBy(id, delta){
    const i=files.findIndex(f=>f.id===id); if(i<0) return;
    const j=i+delta; if(j<0||j>=files.length) return;
    const [it]=files.splice(i,1); files.splice(j,0,it); renderFiles();
  }
  function syncOrderFromDom(){
    const ids=[...el('flist').querySelectorAll('[data-id]')].map(n=>n.getAttribute('data-id'));
    files.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));
  }

  function renderFiles(){
    const card=el('filesCard'), listEl=el('flist');
    card.style.display = files.length? '' : 'none';
    listEl.innerHTML = files.map((f,i)=>{
      const bad = f.status==='bad';
      let meta;
      if(bad) meta = `<div class="warnt">${escapeHtml(t.badDecode)}</div>`;
      else if(f.status==='loading') meta = `<div class="sz">${fmtBytes(f.size)} · ${escapeHtml(t.loadingDur)}</div>`;
      else meta = `<div class="sz">${fmtBytes(f.size)} · ${fmtDur(f.dur)}</div>`;
      return `
      <div class="frow ${bad?'bad':''}" data-id="${f.id}" draggable="true">
        <span class="grip" title="${escapeHtml(t.orderTtl)}">${ICON.grip}</span>
        <span class="ord">${bad?'!':(i+1)}</span>
        <span class="fico">${bad?ICON.warn:ICON.audio}</span>
        <span class="fn"><div class="nm" title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</div>${meta}</span>
        <span class="acts">
          <button class="mv" data-up="${f.id}" title="${escapeHtml(t.moveUp)}" ${i===0?'disabled':''}>${ICON.up}</button>
          <button class="mv" data-down="${f.id}" title="${escapeHtml(t.moveDown)}" ${i===files.length-1?'disabled':''}>${ICON.down}</button>
          <button class="rm" data-rm="${f.id}" title="${escapeHtml(t.remove)}">${ICON.trash}</button>
        </span>
      </div>`;
    }).join('');
    const dur=totalDur();
    el('totalVal').textContent = fmtBytes(totalBytes());
    el('durVal').textContent = fmtDur(dur);
    el('stFiles').textContent = readyFiles().length;
    el('stDur').textContent = fmtDur(dur);
    el('goBtn').disabled = running || readyFiles().length < 2;
  }

  // ---- drag to reorder ----
  let dragId=null;
  function getDragAfter(container, y){
    const rows=[...container.querySelectorAll('.frow:not(.dragging)')];
    let closest={dist:-Infinity, el:null};
    for(const row of rows){
      const box=row.getBoundingClientRect();
      const off=y - box.top - box.height/2;
      if(off<0 && off>closest.dist) closest={dist:off, el:row};
    }
    return closest.el;
  }

  // ---- WAV encoding (real, offline) ----
  function encodeWav(buffer, bitDepth){
    const numCh=buffer.numberOfChannels, rate=buffer.sampleRate, frames=buffer.length;
    const bytesPer = bitDepth/8;
    const blockAlign=numCh*bytesPer, dataSize=frames*blockAlign;
    const ab=new ArrayBuffer(44+dataSize), view=new DataView(ab);
    const w=(o,s)=>{ for(let i=0;i<s.length;i++) view.setUint8(o+i, s.charCodeAt(i)); };
    w(0,'RIFF'); view.setUint32(4,36+dataSize,true); w(8,'WAVE');
    w(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true);
    view.setUint16(22,numCh,true); view.setUint32(24,rate,true);
    view.setUint32(28,rate*blockAlign,true); view.setUint16(32,blockAlign,true); view.setUint16(34,bitDepth,true);
    w(36,'data'); view.setUint32(40,dataSize,true);
    const chans=[]; for(let c=0;c<numCh;c++) chans.push(buffer.getChannelData(c));
    let off=44;
    for(let i=0;i<frames;i++){
      for(let c=0;c<numCh;c++){
        let s=Math.max(-1,Math.min(1,chans[c][i]));
        view.setInt16(off, s<0?s*0x8000:s*0x7FFF, true); off+=2;
      }
    }
    return new Blob([view],{type:'audio/wav'});
  }

  // ---- merge (real, in-browser via Web Audio) ----
  async function merge(){
    if(running) return;
    clearErr();
    const list = readyFiles();               // keeps the on-screen order
    if(list.length<2){ showErr(t.errNone); return; }

    running=true; el('goBtn').disabled=true;
    el('composer').style.display='none';
    el('resultCard').classList.remove('show');
    if(result){ URL.revokeObjectURL(result.url); result=null; }
    showProg();

    try{
      const ctx = getCtx();
      const rate = ctx.sampleRate;            // decodeAudioData already resampled everything to this
      const channels = Math.min(2, list.reduce((m,f)=>Math.max(m, f.buffer.numberOfChannels), 1));
      const gapSec = parseFloat(el('gap').value)||0;
      const gapFrames = Math.round(gapSec*rate);

      let totalFrames=0;
      list.forEach((f,i)=>{ totalFrames += f.buffer.length; if(i<list.length-1) totalFrames += gapFrames; });

      const out = ctx.createBuffer(channels, Math.max(1,totalFrames), rate);
      let offset=0;
      for(let i=0;i<list.length;i++){
        setProg(Math.round(i/list.length*92), list[i].name);
        const b=list[i].buffer;
        for(let c=0;c<channels;c++){
          const src = b.getChannelData(c < b.numberOfChannels ? c : b.numberOfChannels-1); // mono → both sides
          out.getChannelData(c).set(src, offset);
        }
        offset += b.length + (i<list.length-1?gapFrames:0);
        await wait(15);
      }

      setProg(96, t.merging);
      const blob = encodeWav(out, 16);
      const name = (safeName(el('outName').value) || t.defName) + '.wav';
      result = { name, url:URL.createObjectURL(blob), size:blob.size, dur:out.duration, files:list.length };
      setProg(100, t.merging);
      await wait(150);
      hideProg();
      showResult();
    }catch(err){
      console.error(err);
      hideProg();
      el('composer').style.display='';
      showErr(t.errFail);
    }
    running=false;
    renderFiles();
  }

  // ---- progress ----
  function showProg(){ el('progCard').classList.add('show'); setProg(0, t.decoding); el('progCard').scrollIntoView({behavior:'smooth',block:'center'}); }
  function hideProg(){ el('progCard').classList.remove('show'); }
  function setProg(p, label){ el('progBar').style.width=p+'%'; el('progPct').textContent=p+'%'; if(label!=null) el('progName').textContent=label; }

  // ---- result ----
  function showResult(){
    if(!result) return;
    el('readySub').textContent = t.readySub(result.files, fmtDur(result.dur));
    el('rlist').innerHTML = `
      <div class="rrow">
        <span class="rico">${ICON.audio}</span>
        <span class="rn"><div class="nm" title="${escapeHtml(result.name)}">${escapeHtml(result.name)}</div>
          <div class="sz">${fmtBytes(result.size)} · ${fmtDur(result.dur)}</div></span>
      </div>`;
    el('player').innerHTML = `<audio controls src="${result.url}"></audio>`;
    const card=el('resultCard'); card.classList.add('show');
    card.scrollIntoView({behavior:'smooth',block:'center'});
  }
  function downloadResult(){
    if(!result) return;
    const a=document.createElement('a'); a.href=result.url; a.download=result.name; document.body.appendChild(a); a.click(); a.remove();
  }

  function reset(){
    if(result){ URL.revokeObjectURL(result.url); result=null; }
    files=[];
    el('player').innerHTML='';
    el('resultCard').classList.remove('show');
    el('composer').style.display=''; renderFiles();
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function showErr(m){ el('optErr').textContent=m; }
  function clearErr(){ el('optErr').textContent=''; }

  // ---- i18n + theme ----
  function applyLang(l){
    lang=l; t=I18N[l];
    document.documentElement.lang=l; document.documentElement.dir=t.dir;
    document.querySelectorAll('[data-i18n]').forEach(n=>{ const k=n.getAttribute('data-i18n'); if(typeof t[k]==='string') n.textContent=t[k]; });
    const nameEl=el('outName'); if(nameEl && !nameEdited) nameEl.value=t.defName;
    try{ localStorage.setItem('ac_lang', l); }catch(_){}
    renderFmts(); renderFiles();
    if(result) showResult();
  }
  function ls(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
  function detectLang(){
    const chosen=ls('ac_lang'); if(chosen) return chosen;
    const cc=ls('ac_country'); if(cc) return cc==='IL'?'he':'en';
    let tz=''; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(_){}
    const navHe=(navigator.language||'').toLowerCase().indexOf('he')===0;
    return (tz==='Asia/Jerusalem'||navHe)?'he':'en';
  }
  function applyTheme(th){
    const dark=(th==='dark');
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
    const ti=el('themeIco'); if(ti) ti.textContent = dark?'☀️':'🌙';
    try{ localStorage.setItem('theme', dark?'dark':'light'); }catch(_){}
  }

  // ---- events ----
  const drop=el('drop'), input=el('fileInput');
  el('chooseBtn').addEventListener('click',e=>{ e.stopPropagation(); input.click(); });
  drop.addEventListener('click',()=>input.click());
  input.addEventListener('change',()=>{ addFiles(input.files); input.value=''; });
  ;['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.classList.add('over'); }));
  ;['dragleave','dragend'].forEach(ev=>drop.addEventListener(ev,()=>drop.classList.remove('over')));
  drop.addEventListener('drop',e=>{ e.preventDefault(); drop.classList.remove('over'); if(e.dataTransfer) addFiles(e.dataTransfer.files); });
  document.addEventListener('dragover',e=>{ if(e.dataTransfer && Array.from(e.dataTransfer.types||[]).includes('Files')) e.preventDefault(); });
  document.addEventListener('drop',e=>{ if(e.target!==drop && !el('flist').contains(e.target) && e.dataTransfer && Array.from(e.dataTransfer.types||[]).includes('Files')) e.preventDefault(); });

  const flist=el('flist');
  flist.addEventListener('click',e=>{
    const up=e.target.closest('[data-up]'); if(up){ moveBy(up.getAttribute('data-up'),-1); return; }
    const dn=e.target.closest('[data-down]'); if(dn){ moveBy(dn.getAttribute('data-down'),1); return; }
    const rm=e.target.closest('[data-rm]'); if(rm){ removeFile(rm.getAttribute('data-rm')); }
  });
  // drag-to-reorder within the list
  flist.addEventListener('dragstart',e=>{ const row=e.target.closest('.frow'); if(!row) return; dragId=row.getAttribute('data-id'); row.classList.add('dragging'); if(e.dataTransfer){ e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain',dragId); }catch(_){}} });
  flist.addEventListener('dragover',e=>{
    if(!dragId) return; e.preventDefault();
    const dragging=flist.querySelector('.frow.dragging'); if(!dragging) return;
    const after=getDragAfter(flist, e.clientY);
    if(after==null) flist.appendChild(dragging);
    else flist.insertBefore(dragging, after);
  });
  flist.addEventListener('drop',e=>{ if(dragId){ e.preventDefault(); e.stopPropagation(); } });
  flist.addEventListener('dragend',()=>{ const d=flist.querySelector('.frow.dragging'); if(d) d.classList.remove('dragging'); if(dragId){ syncOrderFromDom(); dragId=null; renderFiles(); } });

  el('reverseBtn').addEventListener('click',()=>{ files.reverse(); renderFiles(); });
  el('fmts').addEventListener('click',e=>{ const b=e.target.closest('[data-fmt]'); if(b && !b.disabled){ fmt=b.getAttribute('data-fmt'); renderFmts(); } });
  el('outName').addEventListener('input',()=>{ nameEdited=true; });
  el('goBtn').addEventListener('click',merge);
  el('dlBtn').addEventListener('click',downloadResult);
  el('againBtn').addEventListener('click',reset);

  window.__setLang=applyLang;
  el('themeToggle').addEventListener('click',()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));

  // ---- init ----
  applyTheme(ls('theme')||'light');
  applyLang(detectLang());
  el('outName').value = t.defName;
  renderFmts(); renderFiles();
})();
</script>
</body>
</html>
