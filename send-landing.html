<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOLKLI — שליחת קבצים גדולים בקלות ובביטחון</title>
<link rel="canonical" href="https://kolkli.com/send-landing">
<meta name="description" content="שלחו קבצים גדולים בקלות ובביטחון — גררו, קשרו ושלחו קישור אחד. מהיר, מאובטח ובאיכות מקצועית, לכל סוגי הקבצים.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300..800&family=Overpass:wght@300..800&family=Rubik:wght@300..900&display=swap" rel="stylesheet">

<!-- theme boot: apply saved theme before first paint to avoid a flash -->
<script>try{var t=localStorage.getItem('theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<style>
/* ============================================================
   TOKENS — a purple-forward, premium interpretation of the
   KOLKLI send service. Light + dark, driven by html[data-theme].
   ============================================================ */
:root{
  --bg:#f3f3fb; --panel:#ffffff; --panel-2:#f8f8fd; --line:#e8e8f4; --line-2:#f0f0f9;
  --ink:#141330; --ink-2:#2c2c4d; --muted:#6f7196; --faint:#a1a3c4;

  --accent:#6d3bf5; --accent-2:#8b5cff; --accent-dim:#5a2ee0; --accent-ink:#ffffff;
  --accent-soft:#efe9ff; --accent-line:#ded2ff;
  --grad:linear-gradient(135deg,#8a5cff 0%,#6a34f0 52%,#5b2fe0 100%);
  --grad-soft:linear-gradient(135deg,#f3edff 0%,#eef0ff 100%);
  --grad-text:linear-gradient(96deg,#7c4dff 0%,#5b2fe0 100%);
  --glow:rgba(107,55,240,.34);

  --blue:#3f7bff; --blue-soft:#e9f0ff;
  --teal:#12b3a6; --teal-soft:#e0f6f3;
  --pink:#ec4899; --pink-soft:#fde8f2;
  --amber:#f59e0b; --amber-soft:#fff3dc;
  --green:#25b06a; --green-soft:#e3f7ec;

  --shadow-xs:0 1px 2px rgba(24,22,60,.05);
  --shadow-sm:0 2px 6px rgba(24,22,60,.05), 0 10px 24px rgba(24,22,60,.05);
  --shadow:0 4px 12px rgba(24,22,60,.06), 0 18px 44px rgba(24,22,60,.09);
  --shadow-lg:0 8px 20px rgba(24,22,60,.08), 0 34px 80px rgba(24,22,60,.14);
  --float:0 26px 46px -18px rgba(58,42,132,.45);
  --ring:0 0 0 4px rgba(109,59,245,.28);

  --r-lg:28px; --r-md:18px; --r-sm:13px;
  --sans:'Overpass','Rubik',system-ui,'Segoe UI',sans-serif;
  --mono:'Overpass',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
html[data-theme="dark"]{
  --bg:#0b0c13; --panel:#15161f; --panel-2:#1b1d29; --line:#282a3b; --line-2:#20222f;
  --ink:#eef0fa; --ink-2:#d6d9ec; --muted:#9195b6; --faint:#5f6280;

  --accent:#a483ff; --accent-2:#b79bff; --accent-dim:#8b5cff; --accent-ink:#ffffff;
  --accent-soft:#241d3d; --accent-line:#3a2f63;
  --grad:linear-gradient(135deg,#9a72ff 0%,#7b45f5 52%,#6a34f0 100%);
  --grad-soft:linear-gradient(135deg,#1d1836 0%,#171a2e 100%);
  --grad-text:linear-gradient(96deg,#b79bff 0%,#8b6bff 100%);
  --glow:rgba(139,92,255,.4);

  --blue:#5b95f8; --blue-soft:#182338;
  --teal:#22c3b4; --teal-soft:#0f2b29;
  --pink:#f472b6; --pink-soft:#301826;
  --amber:#fbbf24; --amber-soft:#2c2413;
  --green:#37c26a; --green-soft:#12291c;

  --shadow-xs:0 1px 2px rgba(0,0,0,.4);
  --shadow-sm:0 2px 6px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.34);
  --shadow:0 4px 12px rgba(0,0,0,.45), 0 20px 50px rgba(0,0,0,.5);
  --shadow-lg:0 8px 22px rgba(0,0,0,.5), 0 36px 84px rgba(0,0,0,.62);
  --float:0 26px 46px -18px rgba(0,0,0,.7);
  --ring:0 0 0 4px rgba(164,131,255,.32);
}

/* ============================================================ BASE */
*{box-sizing:border-box;}
html,body{margin:0;min-height:100%;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background-color .3s ease,color .3s ease;overflow-x:clip;}
/* ambient mesh — soft, never neon */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(48% 40% at 84% -6%,rgba(124,77,255,.16),transparent 62%),
    radial-gradient(42% 36% at 8% 4%,rgba(63,123,255,.11),transparent 60%),
    radial-gradient(60% 46% at 50% 116%,rgba(139,92,255,.12),transparent 64%);}
a{color:inherit;text-decoration:none;}
button,input,select{font-family:inherit;}
svg{display:block;}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:12px;}

.stage{width:min(1240px,100%);margin:0 auto;padding-inline:26px;}

/* ============================================================ BUTTONS
   .btn is the base; variants are composable and reusable. */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;
  font-family:var(--sans);font-weight:700;font-size:15px;line-height:1;white-space:nowrap;
  border:1px solid transparent;border-radius:14px;padding:13px 22px;
  transition:transform .1s ease,box-shadow .16s ease,border-color .16s ease,background .16s ease,color .16s ease,filter .16s ease;}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.btn:active{transform:translateY(1px) scale(.99);}

/* primary — glossy brand gradient with layered glow */
.btn-grad{color:#fff;border:none;position:relative;isolation:isolate;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--grad);
  text-shadow:0 1px 2px rgba(30,14,80,.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 5px rgba(40,16,90,.22),0 10px 22px var(--glow);}
.btn-grad::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;
  background:var(--grad);filter:blur(14px);opacity:.35;transition:opacity .2s;}
.btn-grad:hover{filter:brightness(1.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 5px rgba(40,16,90,.22),0 14px 30px var(--glow);}
.btn-grad:hover::after{opacity:.55;}

/* secondary — clean glass pill */
.btn-ghost{background:var(--panel);border-color:var(--line);color:var(--ink-2);box-shadow:var(--shadow-sm);}
.btn-ghost:hover{border-color:var(--accent-line);color:var(--ink);transform:translateY(-1px);box-shadow:var(--shadow);}

.btn-lg{padding:15px 30px;font-size:16px;border-radius:16px;}
.btn-round{width:96px;height:96px;padding:0;border-radius:50%;}
.btn[disabled]{opacity:.5;pointer-events:none;filter:saturate(.6);}

/* ============================================================ PILLS */
.pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-2);
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;box-shadow:var(--shadow-sm);}
.pill .pi{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.pill .pi svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;}
.pi-violet{background:var(--accent-soft);color:var(--accent);}
.pi-blue{background:var(--blue-soft);color:var(--blue);}
.pi-teal{background:var(--teal-soft);color:var(--teal);}
.pi-amber{background:var(--amber-soft);color:var(--amber);}
.pi-green{background:var(--green-soft);color:var(--green);}

/* ============================================================ HERO LAYOUT */
.hero{position:relative;padding-block:56px 40px;overflow:hidden;}
.hero-head{display:grid;grid-template-columns:1.02fr .98fr;align-items:center;gap:20px;margin-bottom:34px;}

/* ---- copy column ---- */
.hero-copy{max-width:36rem;animation:rise .7s cubic-bezier(.2,.7,.2,1) both;}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;letter-spacing:.01em;
  color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);
  padding:6px 13px 6px 11px;border-radius:999px;margin-bottom:20px;}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent);animation:beacon 2.4s ease-in-out infinite;}
h1.title{font-size:clamp(34px,4.6vw,58px);line-height:1.04;letter-spacing:-.028em;font-weight:800;margin:0;color:var(--ink);}
h1.title .grad{position:relative;display:inline-block;
  background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent;}
h1.title .grad .swoosh{position:absolute;inset-inline:-4px;bottom:-.12em;width:calc(100% + 8px);height:.4em;
  color:var(--accent);opacity:.85;}
h1.title .grad .swoosh path{stroke:currentColor;fill:none;stroke-width:5;stroke-linecap:round;
  stroke-dasharray:340;stroke-dashoffset:340;animation:draw 1s cubic-bezier(.6,0,.2,1) .55s forwards;}
h1.title .spark{display:inline-block;color:var(--accent-2);vertical-align:.14em;font-size:.5em;margin-inline-start:.12em;animation:twinkle 3s ease-in-out infinite;}
.sub{font-size:clamp(15px,1.35vw,18px);color:var(--muted);line-height:1.62;margin:20px 0 0;max-width:34rem;}

/* ---- stepper ---- */
.stepper{display:flex;align-items:center;gap:6px;margin-top:30px;flex-wrap:wrap;}
.step{display:inline-flex;align-items:center;gap:10px;padding:8px 15px 8px 9px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow-xs);
  transition:border-color .2s,background .2s,box-shadow .2s,transform .2s;}
.step .sx{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;background:var(--panel-2);color:var(--muted);border:1px solid var(--line);transition:all .2s;}
.step .sx svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
.step .sl{font-size:13.5px;font-weight:700;color:var(--muted);transition:color .2s;}
.step.active{background:var(--grad);border-color:transparent;box-shadow:0 10px 22px var(--glow);transform:translateY(-1px);}
.step.active .sx{background:rgba(255,255,255,.24);color:#fff;border-color:transparent;}
.step.active .sl{color:#fff;}
.step.done{background:var(--accent-soft);border-color:var(--accent-line);}
.step.done .sx{background:var(--accent);color:#fff;border-color:transparent;}
.step.done .sl{color:var(--accent);}
.step-line{width:22px;height:2px;border-radius:2px;background:var(--line);flex-shrink:0;}
.step-line.on{background:var(--accent-line);}

/* ============================================================ ILLUSTRATION SCENE */
.hero-art{position:relative;min-height:430px;animation:rise .8s cubic-bezier(.2,.7,.2,1) .1s both;}
.scene{position:absolute;inset:0;perspective:1200px;}
.scene .glow{position:absolute;top:50%;inset-inline-start:50%;width:78%;height:66%;
  transform:translate(-50%,-46%);border-radius:50%;filter:blur(46px);
  background:radial-gradient(circle,var(--glow),transparent 68%);}
.scene .plate{position:absolute;top:74%;inset-inline-start:50%;width:56%;height:52px;transform:translateX(-50%);
  border-radius:50%;background:radial-gradient(50% 60% at 50% 50%,rgba(58,42,132,.24),transparent 72%);filter:blur(9px);}

/* the central "portal" tile — the hero object */
.portal{position:absolute;top:50%;inset-inline-start:50%;width:158px;height:158px;
  transform:translate(-50%,-52%) rotate(-6deg);border-radius:34px;
  background:var(--grad);box-shadow:var(--float),inset 0 2px 0 rgba(255,255,255,.55),inset 0 -14px 26px rgba(40,16,90,.28);
  display:flex;align-items:center;justify-content:center;animation:bob 6s ease-in-out infinite;z-index:3;}
.portal::before{content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(158deg,rgba(255,255,255,.5),transparent 46%);}
.portal svg{position:relative;width:66px;height:66px;stroke:#fff;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 3px 5px rgba(20,8,60,.3));}
.portal .up{position:absolute;width:22px;height:22px;stroke:#fff;stroke-width:2.6;animation:upnudge 2.4s ease-in-out infinite;}

/* orbiting file cards */
.fcard{position:absolute;width:64px;height:64px;border-radius:18px;background:var(--panel);
  border:1px solid var(--line);box-shadow:var(--float);display:flex;align-items:center;justify-content:center;
  z-index:2;animation:floatY 7s ease-in-out infinite;}
.fcard::before{content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(160deg,rgba(255,255,255,.6),transparent 52%);opacity:.8;}
.fcard svg{position:relative;width:28px;height:28px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.fcard .badge{position:absolute;bottom:-7px;font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.04em;
  color:#fff;padding:2px 6px;border-radius:6px;box-shadow:0 3px 7px rgba(20,8,60,.25);}
.fc-audio{top:2%;inset-inline-start:8%;animation-delay:-.4s;}       .fc-audio svg{stroke:var(--accent);}   .fc-audio .badge{background:var(--accent);}
.fc-video{top:-2%;inset-inline-end:16%;animation-delay:-2.1s;animation-duration:8s;} .fc-video svg{stroke:var(--blue);} .fc-video .badge{background:var(--blue);}
.fc-img{top:40%;inset-inline-end:1%;animation-delay:-3.4s;animation-duration:6.6s;} .fc-img svg{stroke:var(--teal);}   .fc-img .badge{background:var(--teal);}
.fc-pdf{top:72%;inset-inline-end:22%;animation-delay:-1.2s;animation-duration:7.6s;} .fc-pdf svg{stroke:var(--pink);}   .fc-pdf .badge{background:var(--pink);}
.fc-doc{top:70%;inset-inline-start:12%;animation-delay:-4.6s;animation-duration:8.4s;} .fc-doc svg{stroke:var(--amber);} .fc-doc .badge{background:var(--amber);}

/* paper plane flying out with a dashed motion trail */
.plane{position:absolute;top:8%;inset-inline-start:-1%;width:52px;height:52px;z-index:4;
  animation:planeDrift 7s ease-in-out infinite;}
.plane svg{width:100%;height:100%;filter:drop-shadow(0 8px 12px rgba(58,42,132,.34));}
.trail{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:visible;}
.trail path{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:5 9;opacity:.5;
  animation:dashFlow 1.4s linear infinite;}

/* sparkles */
.spark{position:absolute;color:var(--accent-2);animation:twinkle 3s ease-in-out infinite;}
.spark svg{width:100%;height:100%;fill:currentColor;}
.spark.s1{top:16%;inset-inline-end:40%;width:20px;height:20px;animation-delay:0s;}
.spark.s2{top:60%;inset-inline-start:2%;width:14px;height:14px;animation-delay:-1s;color:var(--blue);}
.spark.s3{top:80%;inset-inline-end:44%;width:16px;height:16px;animation-delay:-2s;}

/* handwritten annotation */
.note{position:absolute;bottom:2%;inset-inline-start:6%;display:flex;align-items:flex-end;gap:6px;transform:rotate(-7deg);z-index:5;}
.note b{font-size:15px;font-weight:700;font-style:italic;color:var(--accent);letter-spacing:.01em;
  text-shadow:0 1px 0 var(--panel);}
.note svg{width:34px;height:30px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.85;}

/* ============================================================ DROPZONE CARD */
.dropzone{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:22px;box-shadow:var(--shadow);animation:rise .7s cubic-bezier(.2,.7,.2,1) .18s both;
  transition:box-shadow .25s ease,border-color .25s ease,transform .25s ease;}
.dropzone:hover{box-shadow:var(--shadow-lg);}
.dz-inner{position:relative;border:2px dashed var(--accent-line);border-radius:22px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent-soft) 45%,transparent),transparent 60%);
  min-height:322px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  transition:border-color .2s,background .2s;}
.dropzone.dragover{transform:translateY(-2px);}
.dropzone.dragover .dz-inner{border-color:var(--accent);border-style:solid;
  background:linear-gradient(180deg,var(--accent-soft),transparent 70%);}

/* top-start action buttons */
.dz-actions{position:absolute;top:18px;inset-inline-start:18px;display:flex;gap:10px;z-index:4;}
.dz-actions .btn{padding:11px 17px;font-size:13.5px;border-radius:13px;}

/* left-edge floating feature pills */
.dz-feats{position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:12px;z-index:4;}
/* float together (shared phase) so their vertical spacing stays even */
.dz-feats .pill{animation:floatSm 6s ease-in-out infinite;}

/* inline-end decorative plane */
.dz-plane{position:absolute;top:52%;inset-inline-end:34px;width:120px;height:64px;z-index:1;opacity:.9;pointer-events:none;}
.dz-plane svg{width:100%;height:100%;overflow:visible;}
.dz-plane .p-trail{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:4 8;opacity:.42;
  animation:dashFlow 1.6s linear infinite;}
.dz-plane .p-body{filter:drop-shadow(0 6px 10px rgba(58,42,132,.3));}

/* center CTA core */
.dz-core{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:14px;max-width:30rem;}
.dz-orb{position:relative;width:96px;height:96px;border-radius:50%;background:var(--grad);cursor:pointer;
  display:flex;align-items:center;justify-content:center;margin-bottom:20px;
  box-shadow:0 16px 34px var(--glow),inset 0 2px 0 rgba(255,255,255,.5),inset 0 -8px 16px rgba(40,16,90,.24);
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s;}
.dz-orb::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--accent);
  opacity:0;animation:ring 2.6s ease-out infinite;}
.dz-orb svg{width:40px;height:40px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 2px 4px rgba(20,8,60,.3));}
.dropzone:hover .dz-orb,.dz-orb:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 22px 42px var(--glow),inset 0 2px 0 rgba(255,255,255,.5),inset 0 -8px 16px rgba(40,16,90,.24);}
.dz-core h2{font-size:clamp(19px,1.7vw,23px);font-weight:800;letter-spacing:-.02em;margin:0 0 6px;color:var(--ink);}
.dz-core .p{font-size:14px;color:var(--muted);margin:0;}
.dz-note{display:inline-flex;align-items:center;gap:7px;margin-top:16px;font-size:12.5px;font-weight:600;
  color:var(--muted);background:var(--panel-2);border:1px solid var(--line);padding:6px 13px;border-radius:999px;}
.dz-note b{color:var(--accent);font-weight:800;}
.dz-note svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* selected-files tray (revealed once files are chosen) */
.dz-files{position:relative;z-index:3;display:none;flex-wrap:wrap;gap:10px;justify-content:center;
  max-width:40rem;margin:20px auto 0;}
.dropzone.has-files .dz-files{display:flex;}
.dropzone.has-files .dz-core .p,.dropzone.has-files .dz-core .dz-note{display:none;}
.fchip{display:inline-flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:8px 10px 8px 12px;box-shadow:var(--shadow-xs);max-width:230px;
  animation:pop .28s cubic-bezier(.2,.8,.2,1) both;}
.fchip .fi{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:var(--accent-soft);color:var(--accent);}
.fchip .fi svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.fchip .ft{display:flex;flex-direction:column;min-width:0;}
.fchip .fn{font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  unicode-bidi:plaintext;text-align:start;}
.fchip .fs{font-size:11px;color:var(--faint);font-family:var(--mono);direction:ltr;text-align:start;}
.fchip .fx{width:20px;height:20px;border-radius:6px;border:none;background:transparent;color:var(--faint);cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .12s,color .12s;}
.fchip .fx:hover{background:var(--pink-soft);color:var(--pink);}
.fchip .fx svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;}

/* ============================================================ HERO FOOT BAR */
.hero-foot{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:24px;
  animation:rise .7s cubic-bezier(.2,.7,.2,1) .26s both;}
.foot-feats{display:flex;align-items:center;gap:26px;flex-wrap:wrap;justify-content:center;}
.ffeat{display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--ink-2);}
.ffeat .fic{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.ffeat .fic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;}

/* micro footer */
.microfoot{text-align:center;color:var(--faint);font-size:12.5px;letter-spacing:.02em;padding:22px 0 40px;}
.microfoot b{color:var(--muted);font-weight:800;}

/* ============================================================ KEYFRAMES */
@keyframes rise{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}
@keyframes bob{0%,100%{transform:translate(-50%,-52%) rotate(-6deg);}50%{transform:translate(-50%,-59%) rotate(-6deg);}}
@keyframes floatY{0%,100%{translate:0 0;}50%{translate:0 -14px;}}
@keyframes floatSm{0%,100%{translate:0 0;}50%{translate:0 -6px;}}
@keyframes planeDrift{0%,100%{translate:0 0;rotate:0deg;}50%{translate:-10px -14px;rotate:-6deg;}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.8);}50%{opacity:1;transform:scale(1.1);}}
@keyframes beacon{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 40%,transparent);}70%{box-shadow:0 0 0 7px transparent;}}
@keyframes draw{to{stroke-dashoffset:0;}}
@keyframes dashFlow{to{stroke-dashoffset:-28;}}
@keyframes ring{0%{opacity:.5;transform:scale(.9);}80%,100%{opacity:0;transform:scale(1.25);}}
@keyframes upnudge{0%,100%{transform:translateY(2px);opacity:.6;}50%{transform:translateY(-4px);opacity:1;}}
@keyframes pop{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:none;}}

/* ============================================================ RESPONSIVE */
@media (max-width:960px){
  .hero-head{grid-template-columns:1fr;gap:8px;}
  .hero-art{min-height:340px;order:-1;max-width:520px;margin-inline:auto;width:100%;}
  .hero-copy{max-width:none;text-align:center;margin-inline:auto;}
  .sub{margin-inline:auto;}
  .stepper{justify-content:center;}
}
@media (max-width:720px){
  .hero{padding-block:34px 26px;}
  .dz-feats{display:none;}
  .dz-plane{display:none;}
  .dz-actions{position:static;justify-content:center;margin-bottom:18px;}
  .dz-inner{min-height:auto;padding-block:34px;}
  .hero-foot{flex-direction:column-reverse;align-items:stretch;}
  .hero-foot .btn{width:100%;}
  .foot-feats{order:-1;gap:16px 22px;}
}
@media (max-width:520px){
  .stage{padding-inline:16px;}
  .stepper .sl{display:none;}
  .step{padding:8px;}
  .hero-art{min-height:300px;}
  .fcard{width:54px;height:54px;}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
  html{scroll-behavior:auto;}
  h1.title .grad .swoosh path{stroke-dashoffset:0;}
}
</style>
</head>
<body>

<!-- ===================== SHARED NAV ===================== -->
<div id="site-header"></div>
<script src="./header.js"></script>

<main>
<section class="hero">
  <div class="stage">

    <!-- ===== HERO HEAD: copy + illustration ===== -->
    <div class="hero-head">

      <!-- copy -->
      <div class="hero-copy">
        <span class="eyebrow"><span class="dot"></span><span data-i18n="eyebrow"></span></span>
        <h1 class="title">
          <span data-i18n="t1a"></span><br>
          <span class="grad"><span data-i18n="t1b"></span><svg class="swoosh" viewBox="0 0 300 22" preserveAspectRatio="none" aria-hidden="true"><path d="M4 15C60 6 150 3 210 8c34 3 62 6 86 10"/></svg></span><span class="spark">✦</span>
        </h1>
        <p class="sub" data-i18n="sub"></p>

        <!-- stepper -->
        <div class="stepper" id="stepper" aria-label="שלבי שליחה">
          <div class="step active" data-step="1">
            <span class="sx">1</span><span class="sl" data-i18n="step1"></span>
          </div>
          <span class="step-line"></span>
          <div class="step" data-step="2">
            <span class="sx">2</span><span class="sl" data-i18n="step2"></span>
          </div>
          <span class="step-line"></span>
          <div class="step" data-step="3">
            <span class="sx">3</span><span class="sl" data-i18n="step3"></span>
          </div>
        </div>
      </div>

      <!-- illustration -->
      <div class="hero-art" aria-hidden="true">
        <div class="scene">
          <span class="glow"></span>
          <span class="plate"></span>

          <!-- motion trail behind plane -->
          <svg class="trail" viewBox="0 0 400 300" preserveAspectRatio="none"><path d="M180 150 C120 120 90 90 60 60"/></svg>

          <!-- central portal -->
          <div class="portal">
            <svg viewBox="0 0 24 24"><path d="M20 16.5A4.5 4.5 0 0 0 18 8h-1.26A7 7 0 1 0 5 15.5"/></svg>
            <svg class="up" viewBox="0 0 24 24"><path d="M12 20V9"/><path d="M7 13l5-5 5 5"/></svg>
          </div>

          <!-- orbiting file cards -->
          <div class="fcard fc-audio"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg><span class="badge">MP3</span></div>
          <div class="fcard fc-video"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="14" height="12" rx="2.5"/><path d="M16.5 10l5-3v10l-5-3"/></svg><span class="badge">MP4</span></div>
          <div class="fcard fc-img"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 16l-5-5-9 9"/></svg><span class="badge">JPG</span></div>
          <div class="fcard fc-pdf"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg><span class="badge">PDF</span></div>
          <div class="fcard fc-doc"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 16h6"/></svg><span class="badge">DOC</span></div>

          <!-- sparkles -->
          <span class="spark s1"><svg viewBox="0 0 24 24"><path d="M12 0l2.5 9.5L24 12l-9.5 2.5L12 24l-2.5-9.5L0 12l9.5-2.5z"/></svg></span>
          <span class="spark s2"><svg viewBox="0 0 24 24"><path d="M12 0l2.5 9.5L24 12l-9.5 2.5L12 24l-2.5-9.5L0 12l9.5-2.5z"/></svg></span>
          <span class="spark s3"><svg viewBox="0 0 24 24"><path d="M12 0l2.5 9.5L24 12l-9.5 2.5L12 24l-2.5-9.5L0 12l9.5-2.5z"/></svg></span>

          <!-- paper plane -->
          <div class="plane"><svg viewBox="0 0 24 24"><defs><linearGradient id="plg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a72ff"/><stop offset="1" stop-color="#5b2fe0"/></linearGradient></defs><path d="M22 2 11 13" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 2 15 22l-4-9-9-4 20-7z" fill="url(#plg)" stroke="#7c4dff" stroke-width="1" stroke-linejoin="round"/></svg></div>

          <!-- handwritten note -->
          <div class="note"><b data-i18n="note"></b><svg viewBox="0 0 34 30"><path d="M4 4c2 12 10 20 24 21"/><path d="M22 20l6 6-8 1"/></svg></div>
        </div>
      </div>
    </div>

    <!-- ===== DROPZONE CARD ===== -->
    <div class="dropzone" id="dropzone">
      <!-- top-start actions -->
      <div class="dz-actions">
        <button class="btn btn-grad" id="btnFiles" type="button">
          <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 18v-6M9 15h6"/></svg>
          <span data-i18n="addFiles"></span>
        </button>
        <button class="btn btn-ghost" id="btnFolder" type="button">
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span data-i18n="addFolder"></span>
        </button>
      </div>

      <!-- left-edge feature pills -->
      <div class="dz-feats">
        <span class="pill"><span class="pi pi-amber"><svg viewBox="0 0 24 24"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg></span><span data-i18n="fFast"></span></span>
        <span class="pill"><span class="pi pi-green"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span><span data-i18n="fSecure"></span></span>
        <span class="pill"><span class="pi pi-blue"><svg viewBox="0 0 24 24"><path d="M18 10h-1.26A7 7 0 1 0 5 15.5"/><path d="M9 19c-3 0-3-4 0-4"/><path d="M20 13a3 3 0 0 1 0 6H9"/></svg></span><span data-i18n="fNoLimit"></span></span>
      </div>

      <!-- inline-end decorative plane -->
      <div class="dz-plane">
        <svg viewBox="0 0 120 64"><path class="p-trail" d="M4 60C30 58 44 44 40 24"/><g class="p-body"><path d="M116 6 78 30" stroke="#fff" stroke-width="1.4" fill="none" stroke-linecap="round"/><path d="M116 6 100 40l-9-14-18-4z" fill="var(--accent)" stroke="var(--accent-dim)" stroke-width="1" stroke-linejoin="round"/></g></svg>
      </div>

      <!-- dashed dropzone core -->
      <div class="dz-inner" id="dzInner">
        <div class="dz-core">
          <button class="dz-orb" id="dzOrb" type="button" aria-label="בחירת קבצים">
            <svg viewBox="0 0 24 24"><path d="M20 16.5A4.5 4.5 0 0 0 18 8h-1.26A7 7 0 1 0 5 15.5"/><path d="M12 19v-8"/><path d="M8.5 14.5 12 11l3.5 3.5"/></svg>
          </button>
          <h2 data-i18n="dzTitle"></h2>
          <p class="p" data-i18n="dzSub"></p>
          <span class="dz-note">
            <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span data-i18n="dzNoteA"></span>&nbsp;<b data-i18n="dzNoteB"></b>&nbsp;<span data-i18n="dzNoteC"></span>
          </span>
        </div>
        <!-- selected files tray -->
        <div class="dz-files" id="dzFiles"></div>
      </div>

      <input type="file" id="fileInput" multiple hidden>
      <input type="file" id="dirInput" webkitdirectory hidden>
    </div>

    <!-- ===== FOOT BAR ===== -->
    <div class="hero-foot">
      <button class="btn btn-grad btn-lg" id="btnNext" type="button">
        <span data-i18n="next"></span>
        <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 5l-7 7 7 7"/></svg>
      </button>

      <div class="foot-feats">
        <span class="ffeat"><span class="fic pi-violet"><svg viewBox="0 0 24 24"><path d="M4.5 16.5 3 21l4.5-1.5"/><path d="M15 6c3 3 3 6 3 6s-4 4-9 4c0 0-1-3 0-6 2-6 6-6 6-4z"/><path d="M14 4c2-2 5-2 6-1 1 1 1 4-1 6"/></svg></span><span data-i18n="foot1"></span></span>
        <span class="ffeat"><span class="fic pi-blue"><svg viewBox="0 0 24 24"><path d="M8 12a4 4 0 1 0 4 4M16 12a4 4 0 1 1-4-4"/></svg></span><span data-i18n="foot2"></span></span>
        <span class="ffeat"><span class="fic pi-green"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg></span><span data-i18n="foot3"></span></span>
      </div>

      <button class="btn btn-ghost btn-lg" id="btnPrev" type="button" disabled>
        <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
        <span data-i18n="prev"></span>
      </button>
    </div>

    <p class="microfoot" data-i18n-html="micro"></p>
  </div>
</section>
</main>

<script>
/* ============================================================
   i18n — he (default) / en / ru. The shared header owns the
   language picker and calls window.__setLang(lang); we re-render
   the page text + set <html> lang/dir in place.
   ============================================================ */
const STR = {
  he:{
    eyebrow:'שליחת קבצים · KOLKLI',
    t1a:'שלחו קבצים גדולים', t1b:'בקלות ובביטחון',
    sub:'גררו קבצים, קשרו קישור אחד — והנמען מוריד בקליק. פשוט, מהיר, מאובטח ובאיכות מקצועית, לכל סוגי הקבצים.',
    step1:'העלאת קבצים', step2:'פרטי ההעברה', step3:'סיום ושליחה',
    addFiles:'הוספת קבצים', addFolder:'הוספת תיקייה',
    dzTitle:'גררו קבצים לכאן, או לחצו לבחירה', dzSub:'תומך בכל סוגי הקבצים',
    dzNoteA:'עד', dzNoteB:'368GB', dzNoteC:'להעלאה · תכנית Free',
    fFast:'מהיר', fSecure:'מאובטח', fNoLimit:'ללא הגבלה',
    next:'הבא', prev:'הקודם',
    foot1:'מהירות מקסימלית', foot2:'ללא הגבלת קבצים', foot3:'שמירה מאובטחת',
    note:'קל, מהיר ובטוח',
    micro:'שליחת קבצים · <b>הכל במקום אחד</b> · KOLKLI',
    filesSel:n=>`נבחרו ${n} קבצים`
  },
  en:{
    eyebrow:'File transfer · KOLKLI',
    t1a:'Send large files', t1b:'easily & securely',
    sub:'Drag your files, share one link — your recipient downloads in a click. Simple, fast, secure and professional-grade, for every file type.',
    step1:'Upload files', step2:'Transfer details', step3:'Review & send',
    addFiles:'Add files', addFolder:'Add folder',
    dzTitle:'Drag files here, or click to browse', dzSub:'Supports every file type',
    dzNoteA:'Up to', dzNoteB:'368GB', dzNoteC:'per upload · Free plan',
    fFast:'Fast', fSecure:'Secure', fNoLimit:'No limits',
    next:'Next', prev:'Back',
    foot1:'Maximum speed', foot2:'No file limits', foot3:'Secure storage',
    note:'easy & fast',
    micro:'File transfer · <b>all in one place</b> · KOLKLI',
    filesSel:n=>`${n} file${n===1?'':'s'} selected`
  },
  ru:{
    eyebrow:'Передача файлов · KOLKLI',
    t1a:'Отправляйте большие файлы', t1b:'легко и безопасно',
    sub:'Перетащите файлы, поделитесь одной ссылкой — получатель скачает в один клик. Просто, быстро, безопасно и профессионально, для любых файлов.',
    step1:'Загрузка файлов', step2:'Детали передачи', step3:'Отправка',
    addFiles:'Добавить файлы', addFolder:'Добавить папку',
    dzTitle:'Перетащите файлы сюда или нажмите для выбора', dzSub:'Поддерживает любые файлы',
    dzNoteA:'До', dzNoteB:'368 ГБ', dzNoteC:'за загрузку · тариф Free',
    fFast:'Быстро', fSecure:'Надёжно', fNoLimit:'Без лимитов',
    next:'Далее', prev:'Назад',
    foot1:'Максимальная скорость', foot2:'Без лимита файлов', foot3:'Надёжное хранение',
    note:'легко и быстро',
    micro:'Передача файлов · <b>всё в одном месте</b> · KOLKLI',
    filesSel:n=>`Выбрано файлов: ${n}`
  }
};
let LANG = (()=>{ try{ return localStorage.getItem('ac_lang')||'he'; }catch(e){ return 'he'; } })();
if(!STR[LANG]) LANG='he';

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function render(lang){
  LANG = STR[lang] ? lang : 'he';
  const d = STR[LANG];
  document.documentElement.setAttribute('lang', LANG);
  document.documentElement.setAttribute('dir', LANG==='he' ? 'rtl' : 'ltr');
  $$('[data-i18n]').forEach(el=>{ const k=el.getAttribute('data-i18n'); if(d[k]!=null) el.textContent=d[k]; });
  $$('[data-i18n-html]').forEach(el=>{ const k=el.getAttribute('data-i18n-html'); if(d[k]!=null) el.innerHTML=d[k]; });
  DZ.refreshTitle();
}
window.__setLang = render;

/* ============================================================
   Dropzone — a real, reusable upload component. Handles the file
   picker, folder picker, drag & drop, a selected-files tray with
   per-file removal, and drives the Next button + wizard stepper.
   ============================================================ */
const DZ = (function(){
  const zone=$('#dropzone'), inner=$('#dzInner'), tray=$('#dzFiles'), core=zone.querySelector('.dz-core h2');
  const fileInput=$('#fileInput'), dirInput=$('#dirInput');
  const btnNext=$('#btnNext'), btnPrev=$('#btnPrev');
  let files=[]; let step=1;

  const FTYPE=[
    [/\.(mp3|wav|m4a|flac|aac|ogg)$/i,'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>'],
    [/\.(mp4|mov|mkv|avi|webm)$/i,'<rect x="2.5" y="6" width="14" height="12" rx="2.5"/><path d="M16.5 10l5-3v10l-5-3"/>'],
    [/\.(png|jpe?g|gif|webp|svg|heic)$/i,'<rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 16l-5-5-9 9"/>'],
    [/\.(pdf|docx?|txt|pptx?|xlsx?)$/i,'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>']
  ];
  const glyph=name=>{ for(const[re,g]of FTYPE) if(re.test(name)) return g; return '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>'; };
  const human=b=>{ if(b<1024)return b+' B'; const u=['KB','MB','GB','TB']; let i=-1; do{b/=1024;i++;}while(b>=1024&&i<u.length-1); return b.toFixed(b<10?1:0)+' '+u[i]; };

  function add(list){
    for(const f of list) files.push(f);
    paint();
  }
  function removeAt(i){ files.splice(i,1); paint(); }

  function paint(){
    tray.innerHTML='';
    files.slice(0,8).forEach((f,i)=>{
      const chip=document.createElement('div'); chip.className='fchip'; chip.style.animationDelay=(i*.03)+'s';
      chip.innerHTML=`<span class="fi"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">${glyph(f.name)}</svg></span>`+
        `<span class="ft"><span class="fn">${f.name.replace(/</g,'&lt;')}</span><span class="fs">${human(f.size)}</span></span>`+
        `<button class="fx" type="button" aria-label="הסרה"><svg viewBox="0 0 24 24" fill="none"><path d="M18 6 6 18M6 6l12 12"/></svg></button>`;
      chip.querySelector('.fx').addEventListener('click',()=>removeAt(i));
      tray.appendChild(chip);
    });
    if(files.length>8){
      const more=document.createElement('div'); more.className='fchip'; more.style.padding='8px 14px';
      more.innerHTML=`<span class="fn">+${files.length-8}</span>`;
      tray.appendChild(more);
    }
    zone.classList.toggle('has-files', files.length>0);
    updateText();
  }

  function updateText(){
    if(files.length>0){
      const total=files.reduce((s,f)=>s+f.size,0);
      core.textContent = STR[LANG].filesSel(files.length)+' · '+human(total);
    } else {
      core.textContent = STR[LANG].dzTitle;
    }
  }

  function setStep(n){
    step=Math.max(1,Math.min(3,n));
    $$('#stepper .step').forEach(el=>{
      const s=+el.dataset.step;
      el.classList.toggle('active', s===step);
      el.classList.toggle('done', s<step);
    });
    $$('#stepper .step-line').forEach((el,i)=>el.classList.toggle('on', i<step-1));
    btnPrev.disabled = step===1;
  }

  // wiring
  $('#btnFiles').addEventListener('click',()=>fileInput.click());
  $('#dzOrb').addEventListener('click',()=>fileInput.click());
  $('#btnFolder').addEventListener('click',()=>dirInput.click());
  fileInput.addEventListener('change',e=>{ add(e.target.files); fileInput.value=''; });
  dirInput.addEventListener('change',e=>{ add(e.target.files); dirInput.value=''; });

  ['dragenter','dragover'].forEach(ev=>zone.addEventListener(ev,e=>{ e.preventDefault(); zone.classList.add('dragover'); }));
  ['dragleave','drop'].forEach(ev=>zone.addEventListener(ev,e=>{ e.preventDefault(); if(ev==='drop'||!zone.contains(e.relatedTarget)) zone.classList.remove('dragover'); }));
  zone.addEventListener('drop',e=>{ if(e.dataTransfer&&e.dataTransfer.files.length) add(e.dataTransfer.files); });

  btnNext.addEventListener('click',()=>setStep(step+1));
  btnPrev.addEventListener('click',()=>setStep(step-1));

  return { refreshTitle: updateText, addFiles: add };
})();

render(LANG);

/* optional preview state: /send-landing?demo shows the selected-files tray */
if(/[?&]demo/.test(location.search)){
  const mk=(name,size)=>{ const f=new File(['x'],name); try{Object.defineProperty(f,'size',{value:size});}catch(e){} return f; };
  DZ.addFiles([mk('meeting-recording.mp4',734003200),mk('brand-assets.zip',52428800),mk('cover-art.jpg',3145728),mk('client-brief.pdf',845000)]);
}
</script>
</body>
</html>
