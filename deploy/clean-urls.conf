# ============================================================================
# KOLKLI — clean-URL rules for nginx, as a DROP-IN SNIPPET.
#
# Use this when kolkli.com already has a working server block (TLS certificate,
# server_name, logs …) and you only want to add the redirects. Do NOT paste a
# second full `server { }` block — that fights the existing one.
#
#   1. scp / paste this file to:  /etc/nginx/snippets/kolkli-clean-urls.conf
#   2. edit the LIVE site file (usually /etc/nginx/sites-available/kolkli.com,
#      the block that has `listen 443 ssl`):
#        * make sure it has:      root /var/www/kolkli;     <- folder with index.html
#        * DELETE / comment out:  location / { proxy_pass http://127.0.0.1:7000; }
#          (that proxy to `python -m http.server` is what serves /about.html
#           raw and 404s /about — the python server knows nothing about
#           clean URLs)
#        * add inside the block:  include snippets/kolkli-clean-urls.conf;
#   3. sudo nginx -t            # must say: syntax is ok / test is successful
#   4. sudo systemctl reload nginx
#
# Verify (expect "301" then the clean Location, and "200" for the clean URL):
#   curl -sI https://kolkli.com/about.html | head -2
#   curl -sI https://kolkli.com/about      | head -1
#
# Keeping the python process alive is optional after this — nginx serves the
# static files itself.
# ============================================================================

charset utf-8;
absolute_redirect off;        # 301 Location stays a path -> the requested host
                              # (kolkli.com or www.kolkli.com) is preserved

# never serve dotfiles (.git, .env, server.log, .htaccess …)
location ~ /\. { deny all; }

# ---- 1) index.html (root OR any sub-folder) -> the directory URL (301) ----
#     /index.html      -> /
#     /ai/index.html   -> /ai/
location ~ ^(/(?:.+/)?)index\.html$ {
    return 301 $1$is_args$args;
}

# ---- 2) EVERY other *.html -> its clean extensionless URL (301) ----
#     /test.html        -> /test
#     /dashboard.html?x=1 -> /dashboard?x=1      (query string preserved)
#     /tools/foo.html   -> /tools/foo
location ~ ^/(.+)\.html$ {
    return 301 /$1$is_args$args;
}

# ---- 3) path-routed pages: /dashboard/<anything> is served FROM dashboard.html ----
#     (their in-app sections route on location.pathname). Mirrors SPA_PAGES in
#     serve.py and the "…/*  ….html  200" lines in _redirects — keep in sync.
location ~ ^/(dashboard|account-settings|text-tools|css-tools)(/.*)?$ {
    try_files /$1.html =404;
}

# ---- 4) the core clean-URL rule: serve /about FROM about.html ----
#     real file -> real directory (its index.html) -> <path>.html -> 404
#     INTERNAL rewrite, so no redirect loop with rule 2. NEVER fall back to
#     /index.html: this is a multi-page site, not a SPA.
location / {
    try_files $uri $uri/ $uri.html =404;
}
