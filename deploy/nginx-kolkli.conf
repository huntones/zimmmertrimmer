# ============================================================================
# KOLKLI — nginx clean-URL config for PRODUCTION (kolkli.com).
#
# This makes nginx behave exactly like serve.py does in dev:
#   /dashboard            -> serves dashboard.html  (INTERNAL rewrite, no redirect)
#   /dashboard.html       -> 301 to /dashboard      (one canonical address)
#   /app, /files, /checkout, ...  -> the matching .html   (ALL pages, not just one)
#   /ai/, /audio/, ...    -> that folder's index.html
#   css / js / images / fonts     -> served as-is, untouched
#
# IMPORTANT: this is a MULTI-PAGE static site, NOT a SPA. The fallback maps a
# clean path to its OWN <path>.html — it must NEVER blanket-fallback to
# index.html (that would serve the homepage for every unknown URL). See the
# `location /` block: it is `$uri $uri/ $uri.html =404`, deliberately NOT
# `$uri /index.html`.
#
# ---------------------------------------------------------------------------
# HOW TO DEPLOY (on the Ubuntu box, over SSH):
#   1. Put this file at:  /etc/nginx/sites-available/kolkli.com
#      (or paste the `server { … }` body into your existing site config,
#       REPLACING the current `location / { proxy_pass … }` that forwards to
#       `python -m http.server` — that proxy is exactly what returns the 404).
#   2. Set `root` below to the folder that actually holds dashboard.html.
#   3. ln -s /etc/nginx/sites-available/kolkli.com /etc/nginx/sites-enabled/  (if not linked)
#   4. sudo nginx -t          # must print "syntax is ok" / "test is successful"
#   5. sudo systemctl reload nginx
#
# After this, nginx serves the static files directly — you no longer need the
# Python process running for the website at all (it stays only if you use it
# for something else).
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name kolkli.com www.kolkli.com;

    # >>> CHANGE THIS to the directory that contains dashboard.html, files.html,
    #     index.html, vendor/ …  (the same files you upload/deploy). <<<
    root /var/www/kolkli;
    index index.html;

    charset utf-8;
    absolute_redirect off;         # keep 301 Location paths relative (safe behind Cloudflare)

    # never serve dotfiles (.git, .env, server.log, source configs, …)
    location ~ /\. { deny all; }

    # ---- 1) index.html (root OR any sub-folder) -> the directory URL (301) ----
    #     /index.html       -> /
    #     /ai/index.html    -> /ai/
    location ~ ^(/(?:.+/)?)index\.html$ {
        return 301 $1$is_args$args;
    }

    # ---- 2) every other  *.html  -> its clean extensionless URL (301) ----
    #     /dashboard.html?x=1 -> /dashboard?x=1   (query string preserved)
    location ~ ^/(.+)\.html$ {
        return 301 /$1$is_args$args;
    }

    # ---- 3) path-routed pages: /dashboard/<anything> is served FROM dashboard.html ----
    #     (these pages route their in-app sections on location.pathname). Mirrors
    #     SPA_PAGES in serve.py and the "…/*  ….html  200" lines in _redirects.
    location ~ ^/(dashboard|account-settings|text-tools|css-tools)(/.*)?$ {
        try_files /$1.html =404;
    }

    # ---- 4) EVERYTHING ELSE (this is the core clean-URL rule) ----
    #     real file  ->  real directory (its index.html)  ->  <path>.html  ->  404
    #     This serves /dashboard from dashboard.html, /app from app.html, and
    #     leaves all assets alone. It is an INTERNAL rewrite (no redirect) so
    #     there is no loop, and it maps to the SPECIFIC page — never index.html.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # (Optional) long-cache the fingerprintable static assets.
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|webp|avif|ico|mp3|mp4|wasm)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }
}
